// CORE START — pure geometry, no DOM (checked in node). Lengths in Å.
const LAT = { dia: 3.567, gra: 2.461, grc: 6.708 };   // diamond cubic a; graphite hexagonal a, c
const U_G = 1.66054e-24, M_C = 12.011, PHI = (1 + Math.sqrt(5)) / 2, OUTER_C = 4;
const BOND = { C: [1.2, 1.7], O: [1.0, 1.5] };        // cutoff window that counts as a bond
const sub = (p, q) => [p[0] - q[0], p[1] - q[1], p[2] - q[2]];
const norm = (v) => Math.hypot(v[0], v[1], v[2]);
const dist = (p, q) => norm(sub(p, q));
function bondsIn(pos, w) {
  const out = [];
  for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
    const d = dist(pos[i], pos[j]);
    if (d > w[0] && d < w[1]) out.push([i, j]);
  }
  return out;
}
function degrees(n, bonds) { const d = new Array(n).fill(0); bonds.forEach(([i, j]) => { d[i]++; d[j]++; }); return d; }
// Bonds per atom in the endless crystal: count neighbours over the 27 surrounding cells.
function crystalBonds(basis, cell, w) {
  return basis.map((p) => {
    let n = 0;
    basis.forEach((q) => {
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) {
        const r = [0, 1, 2].map((c) => q[c] + i * cell[0][c] + j * cell[1][c] + k * cell[2][c]);
        const d = dist(p, r);
        if (d > w[0] && d < w[1]) n++;
      }
    });
    return n;
  });
}
const det3 = (c) => c[0][0] * (c[1][1] * c[2][2] - c[1][2] * c[2][1]) - c[0][1] * (c[1][0] * c[2][2] - c[1][2] * c[2][0]) + c[0][2] * (c[1][0] * c[2][1] - c[1][1] * c[2][0]);
const density = (n, cell) => n * M_C * U_G / (Math.abs(det3(cell)) * 1e-24);   // g/cm³
function diamondCell() {
  const a = LAT.dia, basis = [];
  [[0, 0, 0], [0, .5, .5], [.5, 0, .5], [.5, .5, 0]].forEach((p) => { basis.push(p.map((x) => x * a)); basis.push(p.map((x) => (x + .25) * a)); });
  return { basis, cell: [[a, 0, 0], [0, a, 0], [0, 0, a]] };
}
// Graphite sheets lie in the x–z plane and stack along y (up). AB stacking: sheet B is shifted one bond length along z.
function graphiteCell(sheets) {
  const a = LAT.gra, c = LAT.grc, d = a / Math.sqrt(3);
  const a1 = [a, 0, 0], a2 = [a / 2, 0, a * Math.sqrt(3) / 2];
  const A = [[0, 0, 0], [0, 0, d]], B = [[0, c / 2, d], [0, c / 2, 2 * d]];
  return { basis: sheets === 1 ? A : A.concat(B), cell: [a1, [0, sheets === 1 ? 30 : c, 0], a2], a1, a2, d };
}
function prune(pos, w, minDeg) {   // drop dangling edge atoms
  for (;;) {
    const d = degrees(pos.length, bondsIn(pos, w)), q = pos.filter((_, i) => d[i] >= minDeg);
    if (q.length === pos.length) return pos;
    pos = q;
  }
}
function diamondPiece(R) {
  const { basis } = diamondCell(), a = LAT.dia, pos = [];
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) for (let k = -2; k <= 2; k++) basis.forEach((p) => {
    const r = [p[0] + i * a, p[1] + j * a, p[2] + k * a];
    if (norm(r) < R && !pos.some((q) => dist(q, r) < 1e-6)) pos.push(r);
  });
  return prune(pos, BOND.C, 2);
}
// One hexagonal patch centred on a ring (R = 3.9 Å gives the 24-atom coronene shape).
function sheetPatch(R, y, dz) {
  const g = graphiteCell(1), out = [];
  for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++) g.basis.forEach((p) => {
    const x = p[0] + i * g.a1[0] + j * g.a2[0], z = p[2] + i * g.a1[2] + j * g.a2[2];
    if (Math.hypot(x, z + g.d) < R) out.push([x, y, z + g.d + dz]);
  });
  return out;
}
function graphitePiece(nSheets) {
  const d = LAT.gra / Math.sqrt(3), pos = [], layer = [];
  for (let k = 0; k < nSheets; k++) sheetPatch(3.9, k * LAT.grc / 2, k % 2 ? d : 0).forEach((p) => { pos.push(p); layer.push(k); });
  return { pos, layer };
}
function c60() {   // truncated icosahedron: cyclic permutations of three generators (edge 2), scaled to 1.42 Å
  const out = [], s = [-1, 1], k = 1.42 / 2;
  [[0, 1, 3 * PHI], [1, 2 + PHI, 2 * PHI], [PHI, 2, 2 * PHI + 1]].forEach((g) => s.forEach((x) => s.forEach((y) => s.forEach((z) => {
    const v = [g[0] * x, g[1] * y, g[2] * z];
    for (let c = 0; c < 3; c++) {
      const r = [v[c], v[(c + 1) % 3], v[(c + 2) % 3]].map((t) => t * k);
      if (!out.some((q) => dist(q, r) < 1e-6)) out.push(r);
    }
  }))));
  return out;
}
function ozone() {   // O–O 1.278 Å, angle 116.8°
  const h = 116.8 / 2 * Math.PI / 180, r = 1.278;
  return [[-r * Math.sin(h), -r * Math.cos(h) / 2, 0], [0, r * Math.cos(h) / 2, 0], [r * Math.sin(h), -r * Math.cos(h) / 2, 0]];
}
const oxygen = () => [[-1.207 / 2, 0, 0], [1.207 / 2, 0, 0]];
// Bonds that cross the horizontal plane y = y0 (they would have to break for the top to slide).
const crossing = (pos, bonds, y0) => bonds.filter(([i, j]) => (pos[i][1] - y0) * (pos[j][1] - y0) < 0);
// Faces of a closed cage with 3 bonds per atom from Euler (V − E + F = 2); rings of 5 and 6 only ⇒ Σ(6 − n) = 12.
function cageFaces(V, E) { const F = 2 - V + E, p = 12; return { F, p, h: F - p }; }
function project(p, yaw, pitch, F) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p[0] * cy - p[2] * sy, z1 = p[0] * sy + p[2] * cy;
  const y2 = p[1] * cp - z1 * sp, z2 = p[1] * sp + z1 * cp;
  const k = F / (F + z2);
  return { x: x1 * k, y: -y2 * k, z: z2, k };
}

/* ---------- build the models once ---------- */
const $ = (id) => document.getElementById(id);
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent);
const fmt = Play.fmt;
function centre(pos) {
  const c = [0, 1, 2].map((k) => pos.reduce((s, p) => s + p[k], 0) / pos.length);
  return pos.map((p) => sub(p, c));
}
function model(pos, el, extra) {

}
const DIA = (() => {

  const bonds = bondsIn(raw, BOND.C), plane = LAT.dia / 8;     // atoms sit at y = k·a/4; plane between two of them
  const m = model(centre(raw), "C", { hi });
  m.cut = crossing(raw, bonds, plane).map(([i, j]) => i + "-" + j);
  return m;
})();
const GRA = (() => {
  const g = graphitePiece(3), pos = centre(g.pos), m = model(pos, "C", { layer: g.layer });
  const top = pos.map((p, i) => (g.layer[i] === 2 ? Math.hypot(p[0], p[2]) : 1e9));
  m.hi = top.indexOf(Math.min(...top));
  m.cut = [];
  for (let k = 0; k < 2; k++) {
    const y0 = (pos.find((_, i) => g.layer[i] === k)[1] + pos.find((_, i) => g.layer[i] === k + 1)[1]) / 2;
    m.cut = m.cut.concat(crossing(pos, m.bonds, y0));
  }
  m.weak = [];   // atoms lying straight above another atom in the next sheet
  pos.forEach((p, i) => pos.forEach((q, j) => { if (g.layer[j] === g.layer[i] + 1 && Math.hypot(p[0] - q[0], p[2] - q[2]) < 0.1) m.weak.push([i, j]); }));
  m.slide = 5;       // Å the top sheet moves relative to the bottom one at full push
  m.R += m.slide / 4;

})();
const GRN = (() => { const pos = centre(sheetPatch(3.9, 0, 0)); return model(pos, "C", { hi: pos.findIndex((p) => norm(p) < 1.5) }); })();
const BUCK = model(c60(), "C", { hi: 0 });
const OX2 = model(oxygen(), "O", { order: 2 }), OX3 = model(ozone(), "O", { order: 1.5 });
const DC = diamondCell(), GC = graphiteCell(2), G1 = graphiteCell(1);
const FACT = {

  diaRho: density(DC.basis.length, DC.cell), graRho: density(GC.basis.length, GC.cell),

const allSame = (a) => a.every((x) => x === a[0]);
const bondsPer = (a) => (allSame(a) ? a[0] : NaN);
const BUCKF = cageFaces(BUCK.pos.length, BUCK.bonds.length);
const o3angle = (() => { const p = OX3.pos, u = sub(p[0], p[1]), v = sub(p[2], p[1]); return Math.acos((u[0] * v[0] + u[1] * v[1] + u[2] * v[2]) / (norm(u) * norm(v))) * 180 / Math.PI; })();

/* ---------- state ---------- */
const VIEWS = ["dia", "gra", "grn", "buck"];
const VMODEL = { dia: DIA, gra: GRA, grn: GRN, buck: BUCK };
const VNAME = { dia: "vDia", gra: "vGra", grn: "vGrn", buck: "vBuck" };
const DEF = { yaw: -0.5, pitch: 0.38 }, VPITCH = { dia: 0.38, gra: 0.3, grn: 0.95, buck: 0.38 };
const st8 = { step: 0, view: "dia", yaw: DEF.yaw, pitch: DEF.pitch, push: 0, answered: false, spin: false };
let W = 560, H = 400, fig = $("fig");

function fitSize() {
  const narrow = (fig.clientWidth || 560) < 480, w = narrow ? 360 : 560, h = narrow ? 420 : 400;
  if (w === W && h === H && fig.dataset.sized) return;
  W = w; H = h; fig.dataset.sized = 1;
  fig.setAttribute("viewBox", "0 0 " + W + " " + H);
  fig.style.aspectRatio = W + " / " + H;
}

/* ---------- 3-D drawing ---------- */
// Draw model m centred at (cx, cy) so that radius m.R fits into rad pixels.
function draw3D(m, cx, cy, rad, opt) {
  opt = opt || {};
  const sc = rad / m.R, F = m.R * 4, yaw = st8.yaw, pitch = st8.pitch;
  const shift = (i) => (m.layer && opt.push ? (m.layer[i] / 2 - 0.5) * m.slide * opt.push : 0);
  const pts = m.pos.map((p, i) => project([p[0] + shift(i), p[1], p[2]], yaw, pitch, F));
  const zs = pts.map((p) => p.z), zmin = Math.min(...zs), zmax = Math.max(...zs), span = zmax - zmin || 1;
  const fade = (z) => 1 - 0.5 * (z - zmin) / span;
  const items = [];
  const hiSet = new Set(m.hi != null && opt.hi !== false ? m.bonds.filter(([i, j]) => i === m.hi || j === m.hi).map(([i, j]) => i + "-" + j) : []);
  const cut = new Set(opt.showCut ? m.cut : []);
  if (opt.weak && m.weak) m.weak.forEach(([i, j]) => items.push({ z: (pts[i].z + pts[j].z) / 2 + 0.01, kind: "w", i, j }));
  m.bonds.forEach(([i, j]) => items.push({ z: (pts[i].z + pts[j].z) / 2, kind: "b", i, j, key: i + "-" + j }));
  pts.forEach((p, i) => items.push({ z: p.z - 0.05, kind: "a", i }));
  items.sort((a, b) => b.z - a.z);
  const ar = { C: 0.34, O: 0.42 }[m.el];
  items.forEach((it) => {
    const A = pts[it.i];
    if (it.kind === "a") {
      const hi = opt.hi !== false && it.i === m.hi;
      S("circle", { class: "atom at-" + m.el + (hi ? " hi" : ""), cx: cx + A.x * sc, cy: cy + A.y * sc, r: Math.max(3, ar * sc * A.k), opacity: fade(A.z) }, fig);
      return;
    }
    const B = pts[it.j], x1 = cx + A.x * sc, y1 = cy + A.y * sc, x2 = cx + B.x * sc, y2 = cy + B.y * sc;
    if (it.kind === "w") { S("line", { class: "weak", x1, y1, x2, y2 }, fig); return; }
    const w = Math.max(2, 0.13 * sc * (A.k + B.k) / 2), cls = "bond" + (cut.has(it.key) ? " cut" : hiSet.has(it.key) ? " hi" : "");
    const op = fade(it.z), order = m.order || 1;
    if (order === 1) { S("line", { class: cls, x1, y1, x2, y2, "stroke-width": cut.has(it.key) ? w * 1.6 : w, opacity: op }, fig); return; }
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L * w * 0.9, ny = (x2 - x1) / L * w * 0.9;
    S("line", { class: cls, x1: x1 + nx, y1: y1 + ny, x2: x2 + nx, y2: y2 + ny, "stroke-width": w * 0.7, opacity: op }, fig);
    S("line", { class: cls + (order < 2 ? " half" : ""), x1: x1 - nx, y1: y1 - ny, x2: x2 - nx, y2: y2 - ny, "stroke-width": w * 0.7, opacity: op }, fig);
  });

}
function text(cls, x, y, s, anchor) { S("text", { class: cls, x, y, "text-anchor": anchor || "middle" }, fig).textContent = s; }

function drawGuess() {
  const narrow = W < 480, xs = narrow ? [92, 268] : [140, 420], r = narrow ? 76 : 100, cy = narrow ? 262 : 258, oy = narrow ? 76 : 76;
  S("rect", { class: "bg", x: 2, y: 2, width: W - 4, height: H - 4, rx: 14 }, fig);
  // pencil (left)
  const px = xs[0], g = S("g", { transform: "translate(" + px + "," + oy + ") rotate(-20)" }, fig);
  S("rect", { class: "wood", x: -60, y: -9, width: 90, height: 18, rx: 2 }, g);
  S("path", { class: "obj", d: "M30,-9 L56,0 L30,9 Z" }, g);

function drawRule() {
  S("rect", { class: "bg", x: 2, y: 2, width: W - 4, height: H - 4, rx: 14 }, fig);

/* ---------- panel ---------- */
function row(tb, cells, numCols) {
  const tr = document.createElement("tr");
  cells.forEach((c, i) => { const td = document.createElement(i === 0 ? "th" : "td"); td.textContent = c; if (numCols && numCols.includes(i)) td.className = "n"; tr.appendChild(td); });
  tb.appendChild(tr);
}
function head(tb, cells) {
  const th = document.createElement("thead"), tr = document.createElement("tr");
  cells.forEach((c) => { const x = document.createElement("th"); x.textContent = c; tr.appendChild(x); });
  th.appendChild(tr); tb.appendChild(th);
}
function fillTables() {
  const tb = $("cmp"), dB = bondsPer(FACT.diaBonds), gB = bondsPer(FACT.graBonds);
  tb.innerHTML = "";
  head(tb, [P.t("thProp"), P.t("thDia"), P.t("thGra")]);
  row(tb, [P.t("rAtoms"), P.t("carbonOnly"), P.t("carbonOnly")]);
  row(tb, [P.t("rBonds"), fmt(dB), fmt(gB)], [1, 2]);
  row(tb, [P.t("rSpare"), fmt(OUTER_C - dB), fmt(OUTER_C - gB)], [1, 2]);
  row(tb, [P.t("rShape"), P.t("shDia"), P.t("shGra")]);
  row(tb, [P.t("rCross"), fmt(DIA.cut.length), fmt(GRA.cut.length)], [1, 2]);
  row(tb, [P.t("rDist"), P.t("dDia", { d: fmt(FACT.diaCC, 2) }), P.t("dGra", { d: fmt(FACT.graCC, 2), g: fmt(FACT.graGap, 2) })]);
  row(tb, [P.t("rRho"), P.t("rho", { r: fmt(FACT.diaRho, 2) }), P.t("rho", { r: fmt(FACT.graRho, 2) })]);
  row(tb, [P.t("rMohs"), "10", "1–2"]);
  row(tb, [P.t("rElec"), P.t("eDia"), P.t("eGra")]);
  row(tb, [P.t("rLook"), P.t("lDia"), P.t("lGra")]);
  const ox = $("oxy");
  ox.innerHTML = "";
  head(ox, ["", P.t("thO2"), P.t("thO3")]);
  row(ox, [P.t("oAtoms"), fmt(OX2.pos.length), fmt(OX3.pos.length)], [1, 2]);
  row(ox, [P.t("oShape"), P.t("oS2"), P.t("oS3", { g: fmt(o3angle, 1) })]);
  row(ox, [P.t("oColour"), P.t("oC2"), P.t("oC3")]);
  row(ox, [P.t("oSmell"), P.t("oSm2"), P.t("oSm3")]);
  row(ox, [P.t("oBp"), P.t("oBp2"), P.t("oBp3")]);
  row(ox, [P.t("oLife"), P.t("oL2"), P.t("oL3")]);
}
function message() {
  if (st8.step === 2) return [P.t("ruleMsg", { a: OX2.pos.length, b: OX3.pos.length }), "win"];
  if (st8.step !== 1) return ["", ""];
  if (st8.view === "gra") return st8.push > 0 ? [P.t("mGra", { x: fmt(GRA.slide * st8.push / 2, 1), n: GRA.cut.length }), "win"] : [P.t("mGra0"), ""];
  if (st8.view === "dia") return st8.push > 0 ? [P.t("mDia", { n: DIA.cut.length }), "bad"] : ["", ""];
  return ["", ""];
}
function renderPanel() {
  const b = $("bonus"), v = st8.view;
  b.hidden = !(st8.step === 1 && (v === "grn" || v === "buck"));
  if (v === "grn") b.innerHTML = P.t("bGrn", { n: GRN.pos.length, b: fmt(bondsPer(FACT.grnBonds)) });
  if (v === "buck") b.innerHTML = P.t("bBuck", { n: BUCK.pos.length, e: BUCK.bonds.length, b: fmt(bondsPer(BUCK.deg)), p: BUCKF.p, h: BUCKF.h });
  const canPush = v === "dia" || v === "gra";
  $("pushrow").hidden = st8.step !== 1 || !canPush;
  $("push").disabled = !canPush;
  $("pushVal").textContent = fmt(st8.push * 100) + "%";
  $("viewbar").hidden = st8.step !== 1;
  document.querySelectorAll("#viewbar button").forEach((x) => { const on = x.dataset.v === v; x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); });
  $("tableBox").hidden = st8.step !== 1;
  $("ruleBox").hidden = st8.step !== 2;
  const [msg, cls] = message(), lv = $("live");
  if (lv.textContent !== msg) Play.live(lv, msg);
  lv.className = "msg" + (cls ? " " + cls : "");

  $("spin").setAttribute("aria-pressed", st8.spin);
}
function render() {
  fitSize();

  renderPanel();
}

/* ---------- input ---------- */
VIEWS.forEach((v) => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.v = v; b.textContent = P.t(VNAME[v]);
  b.addEventListener("click", () => { st8.view = v; st8.push = 0; st8.yaw = DEF.yaw; st8.pitch = VPITCH[v]; $("push").value = 0; render(); });
  $("viewbar").appendChild(b);
});
$("push").addEventListener("input", (e) => { st8.push = Play.clamp(+e.target.value / 100, 0, 1); render(); });
const turn = (dyaw, dpitch) => { st8.yaw += dyaw; st8.pitch = Play.clamp(st8.pitch + dpitch, -1.5, 1.5); render(); };
let drag = null;
fig.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; try { fig.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } e.preventDefault(); fig.focus({ preventScroll: true }); });
fig.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const k = 0.01 * 560 / (fig.clientWidth || 560);
  turn((e.clientX - drag.x) * k, (e.clientY - drag.y) * k);
  drag = { x: e.clientX, y: e.clientY };
});
const endDrag = () => { drag = null; };
fig.addEventListener("pointerup", endDrag);
fig.addEventListener("pointercancel", endDrag);
fig.addEventListener("keydown", (e) => {
  const a = e.shiftKey ? 0.5 : 0.15;
  const m = { ArrowLeft: [-a, 0], ArrowRight: [a, 0], ArrowUp: [0, -a], ArrowDown: [0, a] }[e.key];
  if (!m) return;
  turn(m[0], m[1]);
  e.preventDefault();
});
let raf = 0, last = 0;
function loop(t) {
  if (!st8.spin) { raf = 0; return; }
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  if (!drag) { st8.yaw += dt * 0.6; render(); }
  raf = requestAnimationFrame(loop);
}
function setSpin(on) {
  st8.spin = on;
  if (on && !raf) { last = 0; raf = requestAnimationFrame(loop); }
  renderPanel();
}
$("spin").addEventListener("click", () => setSpin(!st8.spin));
addEventListener("resize", () => render());

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("opt1") }, { label: P.t("opt2"), right: true }, { label: P.t("opt3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { st8.answered = true; render(); });
const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  st8.step = i;
  if (i > 0) st8.answered = true;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  setSpin(false);
  Object.assign(st8, { view: "dia", yaw: DEF.yaw, pitch: DEF.pitch, push: 0, answered: false });
  $("push").value = 0;
  pr.reset();
  steps.go(0);
});
fillTables();
render();
</script>
</body>
</html>

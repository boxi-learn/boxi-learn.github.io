  [2, "He", "helium", "氦", 4.00, [2]],
  [3, "Li", "lithium", "锂", 6.94, [2, 1]],

  [7, "N", "nitrogen", "氮", 14.01, [2, 5]],
  [8, "O", "oxygen", "氧", 16.00, [2, 6]],
  [9, "F", "fluorine", "氟", 19.00, [2, 7]],
  [10, "Ne", "neon", "氖", 20.18, [2, 8]],
  [11, "Na", "sodium", "钠", 22.99, [2, 8, 1]],
  [12, "Mg", "magnesium", "镁", 24.31, [2, 8, 2]],
  [13, "Al", "aluminium", "铝", 26.98, [2, 8, 3]],
  [14, "Si", "silicon", "硅", 28.09, [2, 8, 4]],
  [15, "P", "phosphorus", "磷", 30.97, [2, 8, 5]],
  [16, "S", "sulfur", "硫", 32.06, [2, 8, 6]],
  [17, "Cl", "chlorine", "氯", 35.45, [2, 8, 7]],
  [18, "Ar", "argon", "氩", 39.95, [2, 8, 8]],
  [19, "K", "potassium", "钾", 39.10, [2, 8, 8, 1]],
  [20, "Ca", "calcium", "钙", 40.08, [2, 8, 8, 2]],
].map(([z, sym, en, zh, mass, shells]) => ({ z, sym, en, zh, mass, shells }));
const GROUP_NO = [1, 2, 13, 14, 15, 16, 17, 18];   // IUPAC numbers of the 8 main-group columns
const outer = (e) => e.shells[e.shells.length - 1];
const period = (e) => e.shells.length;
// A shell is "full" here when it holds 2 (first shell) or 8 (outer shell of the first 20 elements).
const fullOuter = (e) => outer(e) === (period(e) === 1 ? 2 : 8);
// Column 0..7: number of outer electrons, except a full outer shell goes to the noble-gas column (He has 2).
const column = (e) => (fullOuter(e) ? 7 : outer(e) - 1);
// Colour class 1..8: outer electrons; a full shell counts with the noble gases.
const colourKey = (e) => (fullOuter(e) ? 8 : outer(e));
// Electron-shell filling for the first 20: 2, then 8, then 8, then the rest.
function fillShells(z) {
  const caps = [2, 8, 8, 2], out = [];
  let left = z;
  for (const c of caps) { if (left <= 0) break; out.push(Math.min(c, left)); left -= c; }
  return out;
}
// Slots: where element number i (1-based, by Z) sits in the table.
const SLOTS = ELEMENTS.map((e) => ({ row: period(e) - 1, col: column(e) }));
// Put elements into the slots in a given order (the order fills slot 1, slot 2, …).
function layout(order) { return order.map((e, i) => ({ e, slot: SLOTS[i], home: SLOTS[e.z - 1] })); }
const byZ = () => ELEMENTS.slice().sort((a, b) => a.z - b.z);
const byMass = () => ELEMENTS.slice().sort((a, b) => a.mass - b.mass || a.z - b.z);
// Elements that land somewhere other than their atomic-number slot.
const misplaced = (lay) => lay.filter((p) => p.slot !== p.home).map((p) => p.e);
// Pairs next to each other in Z order whose masses go the "wrong" way.
function massInversions(list) {
  const s = list.slice().sort((a, b) => a.z - b.z), out = [];
  for (let i = 1; i < s.length; i++) if (s[i].mass < s[i - 1].mass) out.push([s[i - 1], s[i]]);
  return out;
}
const membersOfColumn = (c) => ELEMENTS.filter((e) => column(e) === c);
// Points (x, y) for k electrons evenly round a circle of radius r centred at (cx, cy); pairs drawn as in Bohr pictures.
function ringPoints(k, r, cx, cy) {
  const pts = [];
  for (let i = 0; i < k; i++) {
    const t = -Math.PI / 2 + (2 * Math.PI * i) / Math.max(1, k);
    pts.push({ x: cx + r * Math.cos(t), y: cy + r * Math.sin(t) });
  }
  return pts;
}

    homeK: "家里做一做", homeQ: "在 20 张卡片上写前 20 种元素的符号和相对原子质量。先按质量排成一行，再按原子序数排。哪两张换了位置？再按 2、8、8、2 分成几行。",
    foot: "相对原子质量取 IUPAC 标准原子量，保留两位小数（H、Li、B、C、N、O、Mg、Si、S、Cl 用约定值）。电子层用前 20 种元素适用的 2、8、8 简化模型；从钪开始第三层会填到 18 个。列号用 IUPAC 的 1、2、13–18（中国教材写作 ⅠA–ⅦA 和 0 族）。门捷列夫周期表：1869 年；氩到 1894 年才被发现。莫塞莱的 X 射线工作：1913–1914 年。质量和 Z 顺序相反的还有 Co/Ni、Th/Pa、U/Np。CC BY-SA 4.0 · Boxi Yu",
  },
});

const $ = (id) => document.getElementById(id);
const zh = P.lang === "zh";
const nameOf = (e) => (zh ? e.zh : e.en);
const sep = zh ? "、" : ", ";
const cfgOf = (e) => e.shells.join(zh ? "、" : ", ");
const m2 = (x) => Play.fmt(x, 2);
const state = { order: "z", colour: false, sel: 11 };
const grid = $("grid"), tiles = new Map();

GROUP_NO.forEach((g) => { const d = document.createElement("div"); d.textContent = g; $("heads").appendChild(d); });
ELEMENTS.forEach((e) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile k" + colourKey(e);
  b.innerHTML = '<span class="z">' + e.z + '</span><span class="s">' + e.sym + '</span><span class="m"></span><span class="dots" hidden></span>';
  const dots = b.querySelector(".dots");
  for (let i = 0; i < outer(e); i++) dots.appendChild(document.createElement("i"));
  b.addEventListener("click", () => select(e.z, false));
  b.addEventListener("keydown", onKey);
  grid.appendChild(b);
  tiles.set(e.z, b);
});
if (Play.reduced) grid.classList.add("noanim");

function currentLayout() { return layout(state.order === "z" ? byZ() : byMass()); }
function posOf(z) { return currentLayout().find((p) => p.e.z === z).slot; }

function render() {
  const lay = currentLayout(), bad = new Set(misplaced(lay).map((e) => e.z));
  grid.classList.toggle("colour", state.colour);
  lay.forEach((p) => {
    const b = tiles.get(p.e.z);
    b.style.left = p.slot.col * 12.5 + "%";
    b.style.top = p.slot.row * 25 + "%";
    b.classList.toggle("bad", bad.has(p.e.z));
    b.classList.toggle("sel", p.e.z === state.sel);
    b.tabIndex = p.e.z === state.sel ? 0 : -1;
    b.querySelector(".m").textContent = m2(p.e.mass);
    b.querySelector(".m").hidden = state.colour;
    b.querySelector(".dots").hidden = !state.colour;
    b.setAttribute("aria-label", P.t("mSel", { name: nameOf(p.e) + " " + p.e.sym, z: p.e.z, cfg: cfgOf(p.e) }) + " " + P.t("capM", { m: m2(p.e.mass) }));
    b.setAttribute("aria-pressed", p.e.z === state.sel ? "true" : "false");
  });
  $("byZ").setAttribute("aria-pressed", state.order === "z" ? "true" : "false");
  $("byM").setAttribute("aria-pressed", state.order === "m" ? "true" : "false");
  $("colour").setAttribute("aria-pressed", state.colour ? "true" : "false");
  drawBohr();
  drawCard();
  const msg = $("live");
  if (state.order === "m") {
    const [a, b] = massInversions(ELEMENTS)[0];
    msg.className = "msg bad";
    msg.textContent = P.t("mM", { a: a.sym, ma: m2(a.mass), b: b.sym, mb: m2(b.mass), nb: outer(b), gb: GROUP_NO[posOf(b.z).col], na: outer(a), ga: GROUP_NO[posOf(a.z).col] });
  } else {
    msg.className = "msg";
    msg.textContent = state.colour ? P.t("mCol") : P.t("mZ");
  }
}

function drawBohr() {
  const e = ELEMENTS[state.sel - 1], svg = $("bohr"), cx = 120, cy = 120;
  svg.innerHTML = "";
  const n = e.shells.length;
  e.shells.forEach((k, i) => {
    const r = n === 1 ? 64 : 46 + (i * 66) / (n - 1);   // innermost 46, outermost 112
    Play.svg("circle", { class: "shell", cx, cy, r }, svg);
    const isOut = i === n - 1;
    ringPoints(k, r, cx, cy).forEach((p) => Play.svg("circle", { class: isOut ? "e-out" : "e-in", cx: p.x, cy: p.y, r: isOut ? 6.5 : 4.5 }, svg));
  });
  Play.svg("circle", { class: "nuc", cx, cy, r: 26 }, svg);
  const t = Play.svg("text", { class: "nuct", x: cx, y: cy + 5, "text-anchor": "middle" }, svg);
  t.textContent = P.t("nucl", { z: e.z });
  svg.setAttribute("aria-label", P.t("bohrAria", { name: nameOf(e), cfg: cfgOf(e), n: outer(e) }));
  $("bcap").innerHTML = "";
  const lines = [
    ["b", P.t("cap", { name: nameOf(e) + " " + e.sym, z: e.z })],
    ["", P.t("capP", { z: e.z })],
    ["cfg", P.t("capCfg", { cfg: cfgOf(e) })],
    ["", P.t("capOut", { n: outer(e) })],
    ["", P.t("capM", { m: m2(e.mass) })],
    ["", P.t("capPos", { g: GROUP_NO[column(e)], p: period(e) })],
  ];
  lines.forEach(([cls, txt]) => {
    const d = document.createElement("div");
    if (cls === "b") { const b = document.createElement("b"); b.textContent = txt; d.appendChild(b); }
    else { d.textContent = txt; if (cls) d.className = cls; }
    $("bcap").appendChild(d);
  });
}

function drawCard() {
  const e = ELEMENTS[state.sel - 1], g = GROUP_NO[column(e)], box = $("ecard");
  box.innerHTML = "";
  const add = (txt, cls) => { const p = document.createElement("p"); p.textContent = txt; if (cls) p.className = cls; box.appendChild(p); };
  add(P.t("g" + g) + " · " + membersOfColumn(column(e)).map((x) => x.sym).join(sep), "gname");
  add(P.t(outer(e) === 1 ? "cardOut1" : "cardOut", { sym: e.sym, n: outer(e), p: period(e) }));
  if (e.sym === "He") add(P.t("cardHe"));
  if (e.sym === "H") add(P.t("cardH"));
  add(P.t("r" + g));
}

function drawRule() {
  const tb = $("colTable");
  tb.innerHTML = "";
  const head = document.createElement("tr");
  [P.t("thG"), P.t("thN"), P.t("thEl")].forEach((s) => { const th = document.createElement("th"); th.textContent = s; head.appendChild(th); });
  tb.appendChild(head);
  GROUP_NO.forEach((g, c) => {
    const mem = membersOfColumn(c), tr = document.createElement("tr");
    const outs = [...new Set(mem.map(outer))].join(" / ");
    [[g + " · " + P.t("g" + g), ""], [outs, "n"], [mem.map((x) => x.sym).join(sep), ""]].forEach(([s, cls]) => {
      const td = document.createElement("td"); td.textContent = s; if (cls) td.className = cls; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  const [a, b] = massInversions(ELEMENTS)[0];
  $("history").textContent = P.t("hist", { a: a.sym, ma: m2(a.mass), b: b.sym, mb: m2(b.mass) });
}

function select(z, focus) {
  state.sel = Play.clamp(z, 1, ELEMENTS.length);
  render();
  if (focus) tiles.get(state.sel).focus();
}

// Arrow keys move to the nearest element in that direction in the current layout.
function onKey(ev) {
  const d = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0] }[ev.key];
  if (!d) return;
  ev.preventDefault();
  const lay = currentLayout(), me = lay.find((p) => p.e.z === state.sel).slot;
  let best = null, bd = Infinity;
  lay.forEach((p) => {
    const dr = p.slot.row - me.row, dc = p.slot.col - me.col;
    const along = d[0] ? dr * d[0] : dc * d[1], across = d[0] ? Math.abs(dc) : Math.abs(dr);
    if (along <= 0) return;
    const score = along * 10 + across * (d[0] ? 1 : 100);
    if (score < bd) { bd = score; best = p; }
  });
  if (best) select(best.e.z, true);
}

$("byZ").addEventListener("click", () => { state.order = "z"; render(); });
$("byM").addEventListener("click", () => { state.order = "m"; render(); });
$("colour").addEventListener("click", () => { state.colour = !state.colour; render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ecard").hidden = i !== 1;
  $("ruleBox").hidden = i !== 2;
  $("live").hidden = i === 0;
  if (i === 2) { drawRule(); if (!state.colour) { state.colour = true; render(); } }
});
$("reset").addEventListener("click", () => {
  state.order = "z"; state.colour = false; state.sel = 11;
  pr.reset(); st.go(0); render();
});
render();
</script>
</body>
</html>

<script>
// CORE START — constants and pure number logic, no DOM (checked in node)
const NA = 6.02214076e23;            // Avogadro constant, exact since the 2019 SI
const U_G = 1.66053906892e-24;       // atomic mass constant in grams (CODATA 2022)
const YEAR_S = 365.25 * 86400;       // Julian year in seconds
const UNIVERSE_YR = 1.38e10;         // age of the universe, years
// [symbol, English, Chinese, standard atomic weight rounded to 2 d.p., colour var]
const ELS = [
  ["H", "hydrogen", "氢", 1.01, "--c"],
  ["C", "carbon", "碳", 12.01, "--muted"],
  ["O", "oxygen", "氧", 16.00, "--no"],
  ["Mg", "magnesium", "镁", 24.31, "--a"],
  ["S", "sulfur", "硫", 32.06, "--hl"],
  ["Fe", "iron", "铁", 55.85, "--b"],
  ["Cu", "copper", "铜", 63.55, "--h"],
  ["Au", "gold", "金", 196.97, "--hl"],
].map(([sym, en, zh, A, col]) => ({ sym, en, zh, A, col }));
const bySym = (s) => ELS.find((e) => e.sym === s);
// Count ladder: 1 atom → 1 dozen → powers of ten → 1 mole → 2 moles.
const STOPS = [1, 12, 1e3, 1e6, 1e9, 1e12, 1e15, 1e18, 1e21, 1e23, NA, 2 * NA];
const MOLE_IDX = 10;
const atomGrams = (A) => A * U_G;                         // mass of one atom in g
const panGrams = (A, count) => count * atomGrams(A);       // mass of `count` atoms in g
const molarGrams = (A) => NA * atomGrams(A);               // mass of 1 mol in g (= A × 1.000000001)
// Ratio of the two pans: does not depend on the count.
const ratio = (AL, AR, count) => panGrams(AR, count) / panGrams(AL, count);
// Beam angle in degrees (+ = right pan down), saturating at ±22°.
function tilt(mL, mR) {
  const s = mL + mR;
  if (!(s > 0)) return 0;
  return 22 * Math.tanh(3 * (mR - mL) / s);
}
// Split x into mantissa and exponent with `sig` significant figures.
function sci(x, sig) {
  if (!isFinite(x) || x === 0) return { m: "0", e: 0 };
  let e = Math.floor(Math.log10(Math.abs(x)));
  let m = (x / Math.pow(10, e)).toFixed(sig - 1);
  if (Math.abs(+m) >= 10) { e += 1; m = (x / Math.pow(10, e)).toFixed(sig - 1); }
  return { m, e };
}
const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const sup = (n) => String(n).split("").map((c) => SUP[c]).join("");
const pow10 = (e) => "10" + sup(e);
// Human number: plain between 0.001 and 10 000, else "m × 10ⁿ". Never "NaN".
function num(x, sig) {
  sig = sig || 3;
  if (!isFinite(x)) return "–";
  if (x === 0) return "0";
  const a = Math.abs(x);
  if (a >= 1e-3 && a < 1e4) {
    if (Number.isInteger(x) && a < 1e4) return String(x);
    let d = Math.max(0, sig - 1 - Math.floor(Math.log10(a)));
    if (Math.abs(+x.toFixed(d)) >= Math.pow(10, sig - d)) d = Math.max(0, d - 1);  // 9.999 → "10.0", not "10.00"
    return x.toFixed(d);
  }
  const s = sci(x, sig), exact = Math.abs(x / Math.pow(10, s.e) - 1) < 1e-12;
  return (exact ? "" : s.m + " × ") + pow10(s.e);
}
// The water extension: 18 g of water.
function water(g) {
  const M = 2 * 1.01 + 16.00;              // g/mol, from the table values
  const mol = g / M, molecules = mol * NA, atoms = 3 * molecules;
  const years = molecules / YEAR_S;         // counting one molecule per second
  return { M, mol, molecules, atoms, years, ages: years / UNIVERSE_YR };
}
// CORE END

const $ = (id) => document.getElementById(id);
const zh = P.lang === "zh";
const dict = (k) => P.t(k); // arrays come back as-is
const LAD = dict("lad"), VT = dict("vt"), TH = dict("th");
const nameOf = (e) => (zh ? e.zh : e.en);
const fig = $("fig"), slider = $("n");
const state = { idx: 0, L: "C", R: "Mg", step: 0, revealed: false };
const shownIdx = () => (state.step === 0 ? MOLE_IDX : state.idx);
const massStr = (g) => (g >= 1000 ? P.t("kg", { x: num(g / 1000, 4) }) : P.t("g", { x: num(g, 4) }));

// Element pickers
["L", "R"].forEach((side) => {
  const sel = $("sel" + side);
  ELS.forEach((e) => {
    const o = document.createElement("option");
    o.value = e.sym;
    o.textContent = P.t("elOpt", { sym: e.sym, name: nameOf(e), A: e.A.toFixed(2) });
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => { state[side] = sel.value; render(); });
});
// Ladder buttons
const ladBtns = STOPS.map((_, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "small" + (i === MOLE_IDX ? " mole" : "");
  b.textContent = LAD[i];
  b.setAttribute("aria-label", VT[i]);
  b.addEventListener("click", () => { state.idx = i; render(); });
  $("ladder").appendChild(b);
  return b;
});
slider.addEventListener("input", () => { state.idx = +slider.value; render(); });

// Static parts of the balance
const NS_ = Play.svg;

NS_("rect", { class: "base", x: 220, y: 326, width: 160, height: 14, rx: 7 }, fig);
const cntText = NS_("text", { class: "cnt", x: 300, y: 34, "text-anchor": "middle" }, fig);
const beamG = NS_("g", {}, fig);
NS_("line", { class: "beam", x1: 110, y1: 100, x2: 490, y2: 100 }, beamG);
NS_("circle", { class: "pivot", cx: 300, cy: 100, r: 9 }, fig);

const panG = { L: NS_("g", {}, fig), R: NS_("g", {}, fig) };
let curAngle = 0, animId = 0;

function drawPan(side, x, y, e, nDots) {
  const g = panG[side];
  g.innerHTML = "";
  NS_("line", { class: "str", x1: x, y1: y, x2: x - 62, y2: y + 112 }, g);
  NS_("line", { class: "str", x1: x, y1: y, x2: x + 62, y2: y + 112 }, g);
  const py = y + 112;
  // atoms piled on the pan: rows of 5, 4, 3
  const r = 6 + 3 * Math.cbrt(e.A / 12), rows = [5, 4, 3];
  let k = 0;
  for (let row = 0; row < rows.length && k < nDots; row++) {
    const inRow = Math.min(rows[row], nDots - k);
    for (let j = 0; j < inRow; j++, k++) {
      const cx = x + (j - (inRow - 1) / 2) * (2 * r + 1);
      NS_("circle", { class: "atom", cx, cy: py - r - row * (2 * r - 2), r, style: "fill: color-mix(in srgb, var(" + e.col + ") 70%, var(--surface))" }, g);
    }
  }
  NS_("path", { class: "pan", d: `M${x - 70} ${py} Q${x} ${py + 34} ${x + 70} ${py} Z` }, g);
  NS_("text", { class: "sym", x, y: py + 58, "text-anchor": "middle" }, g).textContent = e.sym;
}

function placePans(a) {
  const rad = (a * Math.PI) / 180, c = Math.cos(rad), s = Math.sin(rad);
  const eL = bySym(state.L), eR = bySym(state.R), n = Math.min(12, STOPS[shownIdx()]);
  drawPan("L", 300 - 190 * c, 100 - 190 * s, eL, n);
  drawPan("R", 300 + 190 * c, 100 + 190 * s, eR, n);
}

function pose(a) { beamG.setAttribute("transform", `rotate(${a} 300 100)`); placePans(a); }
// Swing the beam to `target` degrees in 0.8 s (a short one-off move, not a loop); instant when reduced motion.
function setAngle(target) {
  cancelAnimationFrame(animId);
  if (Play.reduced || Math.abs(target - curAngle) < 0.01) { curAngle = target; pose(target); return; }
  const from = curAngle, t0 = performance.now(), dur = 800;
  const ease = (t) => { const c1 = 1.70158 * 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const stepF = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    curAngle = t < 1 ? from + (target - from) * ease(t) : target;
    pose(curAngle);
    if (t < 1) animId = requestAnimationFrame(stepF);
  };
  animId = requestAnimationFrame(stepF);
}

function countText(i) {
  const n = STOPS[i];
  const big = i === 0 ? "1" : i === 1 ? "12" : i === MOLE_IDX ? "6.02214076 × " + pow10(23) : i === MOLE_IDX + 1 ? "1.20442815 × " + pow10(24) : num(n);
  let sub;
  if (i === MOLE_IDX) sub = P.t("cntMole");
  else if (i === MOLE_IDX + 1) sub = P.t("cntMoles");
  else if (i === 1) sub = P.t("cntDozen", { m: num(n / NA) });
  else sub = P.t("cntSub", { d: num(n / 12), m: num(n / NA) });
  return { big, sub };
}

function render() {
  const i = shownIdx(), n = STOPS[i], eL = bySym(state.L), eR = bySym(state.R);
  const mL = panGrams(eL.A, n), mR = panGrams(eR.A, n);
  const locked = state.step === 0 && !state.revealed;
  slider.value = state.idx;
  slider.setAttribute("aria-valuetext", VT[state.idx]);
  ladBtns.forEach((b, j) => { b.classList.toggle("on", j === state.idx); b.setAttribute("aria-pressed", j === state.idx ? "true" : "false"); });
  $("selL").value = state.L; $("selR").value = state.R;
  const ct = countText(i);
  $("count").innerHTML = "";
  const bg = document.createElement("span"); bg.className = "big"; bg.textContent = ct.big;
  const sb = document.createElement("span"); sb.className = "sub"; sb.textContent = " " + ct.sub;
  $("count").append(bg, sb);
  cntText.textContent = VT[i];
  [["L", eL, mL], ["R", eR, mR]].forEach(([s, e, m]) => {
    $("one" + s).textContent = P.t("one", { u: e.A.toFixed(2), g: num(atomGrams(e.A), 4) });
    $("tot" + s).textContent = P.t("tot", { m: massStr(m) });
  });
  lockG.style.display = locked ? "" : "none";
  const a = locked ? 0 : tilt(mL, mR);
  setAngle(a);
  const st = locked ? P.t("aLock") : Math.abs(a) < 0.05 ? P.t("aLevel") : a > 0 ? P.t("aRight") : P.t("aLeft");
  fig.setAttribute("aria-label", P.t("figAria", { n: VT[i], cL: nameOf(eL), cR: nameOf(eR), state: st }));
  let msg;
  if (locked) msg = P.t("mLock");
  else if (eL.sym === eR.sym) msg = P.t("mEq");
  else if (i === MOLE_IDX) msg = P.t("mMole", { L: eL.sym, R: eR.sym, gL: massStr(mL), gR: massStr(mR) });
  else { const [lo, hi] = eL.A <= eR.A ? [eL, eR] : [eR, eL]; msg = P.t("mRat", { L: lo.sym, H: hi.sym, r: num(ratio(lo.A, hi.A, n), 3) }); }
  Play.live($("live"), msg);
}

function drawRule() {
  const tb = $("molTable");
  tb.innerHTML = "";
  const tr0 = document.createElement("tr");
  TH.forEach((s) => { const th = document.createElement("th"); th.textContent = s; tr0.appendChild(th); });
  tb.appendChild(tr0);
  const show = ["C", "Mg", "S", "Cu"];
  [state.L, state.R].forEach((s) => { if (!show.includes(s)) show.push(s); });
  show.map(bySym).forEach((e) => {
    const tr = document.createElement("tr");
    [[e.sym + " " + nameOf(e), ""], [e.A.toFixed(2), ""], [num(atomGrams(e.A), 3), ""], [molarGrams(e.A).toFixed(2), "g"]].forEach(([s, cls]) => {
      const td = document.createElement("td"); td.textContent = s; if (cls) td.className = cls; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  const w = water(18);
  $("ext").textContent = P.t("ext", {
    mol: w.mol.toFixed(3), molec: num(w.molecules, 3), atoms: num(w.atoms, 3), yrs: num(w.years, 2),
    x: zh ? Math.round(w.ages / 1e4) : Play.fmt(w.ages / 1e6, 1),
  });
}

const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { state.revealed = true; $("stepBody").hidden = true; render(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  state.step = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("stepBody").hidden = i === 0 && state.revealed;
  $("handsOn").hidden = i === 0;
  $("ruleBox").hidden = i !== 2;
  if (i === 2) state.idx = MOLE_IDX;
  render();
  if (i === 2) drawRule();
});
["selL", "selR"].forEach((id) => $(id).addEventListener("change", () => { if (state.step === 2) drawRule(); }));
$("reset").addEventListener("click", () => {
  Object.assign(state, { idx: 0, L: "C", R: "Mg", revealed: false });
  pr.reset(); st.go(0);
});
</script>

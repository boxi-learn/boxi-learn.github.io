<script>
// CORE START — pure chemistry, no DOM (checked in node)
const KW = 1.0e-14;            // ion product of water at 25 °C, (mol/L)²
const NA = 6.02214076e23;      // Avogadro constant, 1/mol
const C0 = 0.01;               // starting strong acid, mol/L (pH 2)
const NMAX = 8;                // dilutions allowed
const finitePos = (x) => (Number.isFinite(x) && x > 0 ? x : 0);
// Strong monoprotic acid at concentration c plus water's own ions:
// [H+] = c + [OH-] and [H+][OH-] = Kw  =>  [H+] = c/2 + sqrt(c²/4 + Kw)
function hPlus(c) { c = finitePos(c); return c / 2 + Math.sqrt(c * c / 4 + KW); }
const pHof = (h) => -Math.log10(Math.max(h, 1e-300));
const hOfpH = (p) => Math.pow(10, -p);
// The dot cube: a fixed tiny volume chosen so a pH-2 acid shows 1000 H+ ions.
const DOT_N = 1000;
const VOL_L = DOT_N / (C0 * NA);                          // litres
const CUBE_NM = Math.cbrt(VOL_L * 1e-3) * 1e9;            // edge of that cube, nm
const ions = (h) => finitePos(h) * VOL_L * NA;            // mean H+ count in the cube
function dilution(n) {
  n = Math.round(Math.min(NMAX, Math.max(0, Number.isFinite(n) ? n : 0)));
  const rows = [];
  for (let k = 0; k <= n; k++) {
    const c = C0 * Math.pow(10, -k), h = hPlus(c);
    rows.push({ k, c, h, p: pHof(h), ions: ions(h), ratio: k ? rows[k - 1].h / h : 1 });
  }
  return rows;
}
// Typical, approximate pH values (vary with brand, strength and temperature).
const SUBST = [
  { key: "lemon", lo: 2, hi: 2 },
  { key: "vinegar", lo: 2.5, hi: 3 },
  { key: "coffee", lo: 5, hi: 5 },
  { key: "water", lo: 7, hi: 7 },
  { key: "soda", lo: 8.3, hi: 8.3 },
  { key: "ammonia", lo: 11, hi: 11 },
  { key: "bleach", lo: 12.5, hi: 12.5 },
];
const typ = (s) => (s.lo + s.hi) / 2;
// How many times more H+ the lower-pH one has.
function compare(pa, pb) {
  const d = Math.abs(pa - pb);
  return { d, factor: Math.pow(10, d), aMore: pa < pb, same: d < 1e-9 };
}
// Universal indicator, approximate colours at pH 0…14 (brands differ).
const UI = ["#d0213a", "#e0352b", "#ea4f24", "#f07a22", "#f6a623", "#f5cf1f", "#c8d628", "#5db84a",
  "#2fa66a", "#1f9a9a", "#2a6fb5", "#3b4fa8", "#5b3d9a", "#6e2f8a", "#6b2370"];
function indicator(p) {
  p = Math.min(14, Math.max(0, Number.isFinite(p) ? p : 7));
  const i = Math.min(13, Math.floor(p)), t = p - i;
  const rgb = (h) => [1, 3, 5].map((j) => parseInt(h.slice(j, j + 2), 16));
  const a = rgb(UI[i]), b = rgb(UI[i + 1]);
  return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * t)).join(",") + ")";
}
const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const sup = (n) => String(n).split("").map((ch) => SUP[ch] || ch).join("");
function sci(x, d) {
  if (!Number.isFinite(x) || x <= 0) return "—";
  let e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  if (+m.toFixed(d) >= 10) { m /= 10; e += 1; }
  return m.toFixed(d) + " × 10" + sup(e);
}
const group = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
function sig2(x) {               // two significant figures, as a number
  if (!Number.isFinite(x) || x <= 0) return 0;
  const e = Math.floor(Math.log10(x)) - 1;
  return Math.round(x / Math.pow(10, e)) * Math.pow(10, e);
}
// "×N" text: exact power of ten when the gap is whole, else 2 significant figures.
function factorText(d) {
  if (!Number.isFinite(d) || d < 0) return "—";
  const whole = Math.abs(d - Math.round(d)) < 1e-9;
  const f = Math.pow(10, d);
  if (whole) return Math.round(d) <= 6 ? group(f) : "10" + sup(Math.round(d));
  if (f < 1e6) { const s = sig2(f); return s < 10 ? s.toFixed(1) : group(s); }
  return sci(f, 1);
}
// If the weaker one were drawn 1 mm tall, how tall is the stronger one?
function lengthText(d, lang) {
  const mm = sig2(Math.pow(10, Math.max(0, Number.isFinite(d) ? d : 0)));
  const u = lang === "zh" ? { mm: "毫米", cm: "厘米", m: "米", km: "千米" } : { mm: "mm", cm: "cm", m: "m", km: "km" };
  const num = (v) => (v < 10 ? +v.toFixed(1) : group(v));
  if (mm < 10) return num(mm) + " " + u.mm;
  if (mm < 1000) return num(mm / 10) + " " + u.cm;
  if (mm < 1e6) return num(mm / 1000) + " " + u.m;
  return num(mm / 1e6) + " " + u.km;
}
// CORE END

const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent);
const T = (tag, attrs, text, parent) => { const e = S(tag, attrs, parent || fig); e.textContent = text; return e; };
const f2 = (x) => Play.fmt(x, 2);
const state = { step: 0, revealed: false, n: 0, a: 0, b: 3, next: "b" };

// Jittered grid of 1024 cells, shuffled once, so any first-N subset spreads over the whole cube.
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const SPOTS = (() => {
  const rnd = seeded(5), out = [];
  for (let r = 0; r < 32; r++) for (let c = 0; c < 32; c++) out.push([(c + 0.2 + 0.6 * rnd()) / 32, (r + 0.2 + 0.6 * rnd()) / 32]);
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
})();
function cubeDots(x, y, w, count) {
  S("path", { class: "cube-back", d: `M${x},${y} l14,-14 h${w} v${w} l-14,14` }, fig);
  S("line", { class: "cube-back", x1: x + w, y1: y, x2: x + w + 14, y2: y - 14 }, fig);
  S("rect", { class: "cube", x, y, width: w, height: w }, fig);
  const k = Math.min(SPOTS.length, Math.round(count));
  const r = k > 300 ? 2.6 : k > 30 ? 3.6 : 5;
  for (let i = 0; i < k; i++) S("circle", { class: "ion", cx: x + 4 + SPOTS[i][0] * (w - 8), cy: y + 4 + SPOTS[i][1] * (w - 8), r }, fig);
}
function ionsText(c) {
  if (c >= 0.5) return [Math.round(c) === 1 ? P.t("ionsN1") : P.t("ionsN", { n: group(c) }), ""];
  return [P.t("ionsFew", { n: c >= 0.095 ? c.toFixed(1) : c.toFixed(2) }), P.t("ionsFew2", { k: group(sig2(1 / c)) })];
}
function colourBar(x, y, w, h, p) {
  const id = "uigrad";
  const defs = S("defs", {}, fig);
  const g = S("linearGradient", { id, x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
  UI.forEach((c, i) => S("stop", { offset: i / 14, "stop-color": c }, g));
  S("rect", { x, y, width: w, height: h, rx: 4, fill: `url(#${id})` }, fig);
  [0, 7, 14].forEach((v) => T("text", { class: "lbl-m", x: x + (w * v) / 14, y: y + h + 26, "text-anchor": v === 0 ? "start" : v === 14 ? "end" : "middle" }, String(v)));
  if (p !== undefined) {
    const mx = x + (w * Math.min(14, Math.max(0, p))) / 14;
    S("path", { class: "marker", d: `M${mx - 9},${y - 14} L${mx + 9},${y - 14} L${mx},${y - 1} Z` }, fig);
  }
}

/* ---------- step 1: two cubes ---------- */
function drawGuess() {
  fig.setAttribute("aria-label", P.t("figGuess"));
  fig.innerHTML = "";
  const c5 = ions(hOfpH(5)), c3 = ions(hOfpH(3));
  [[5, 40, c5, "guess5"], [3, 300, c3, "guess3"]].forEach(([p, x, c, key]) => {
    S("rect", { x, y: 28, width: 34, height: 34, rx: 6, fill: indicator(p), stroke: "var(--fg)", "stroke-width": 1 }, fig);
    T("text", { class: "big", x: x + 46, y: 56 }, P.t(key));
    cubeDots(x, 98, 210, state.revealed ? c : 0);
    if (!state.revealed) T("text", { class: "qmark", x: x + 105, y: 225, "text-anchor": "middle" }, "?");
    else T("text", { class: "num", x: x + 105, y: 346, "text-anchor": "middle" }, ionsText(c)[0]);
  });
  T("text", { class: "lbl-m", x: 280, y: 386, "text-anchor": "middle" }, P.t("cubeLbl", { s: Math.round(CUBE_NM) }));
  if (state.revealed) T("text", { class: "lbl", x: 280, y: 428, "text-anchor": "middle" }, P.t("reveal", { a: group(c3), b: group(c5), r: group(c3 / c5) }));
  Play.live($("live"), state.revealed ? P.t("liveGuess", { a: group(c5), b: group(c3), r: group(c3 / c5) }) : "");
}

/* ---------- step 2: dilution lab ---------- */
function drawDil() {
  fig.setAttribute("aria-label", P.t("figDil"));
  fig.innerHTML = "";
  const rows = dilution(state.n), cur = rows[rows.length - 1], col = indicator(cur.p);
  // 1 part + 9 parts water
  for (let i = 0; i < 10; i++) S("rect", i === 0 ? { class: "part", x: 20 + i * 21, y: 18, width: 18, height: 22, rx: 3, fill: col } : { class: "water", x: 20 + i * 21, y: 18, width: 18, height: 22, rx: 3 }, fig);
  T("text", { class: "lbl-m", x: 20, y: 66 }, P.t("partsLbl"));
  // beaker with indicator-coloured liquid
  T("text", { class: "big", x: 92, y: 116, "text-anchor": "middle" }, "pH " + f2(cur.p));
  S("rect", { class: "liquid", x: 32, y: 190, width: 120, height: 128, fill: col, "fill-opacity": 0.85 }, fig);
  S("path", { class: "glass", d: "M24,136 L30,142 L30,320 Q30,330 40,330 L144,330 Q154,330 154,320 L154,142 L160,136" }, fig);
  // pH paper
  S("rect", { class: "strip", x: 184, y: 150, width: 30, height: 150, rx: 3 }, fig);
  S("rect", { x: 186, y: 232, width: 26, height: 66, fill: col }, fig);
  T("text", { class: "lbl-m", x: 199, y: 330, "text-anchor": "middle" }, P.t("paper"));
  // the dot cube
  T("text", { class: "lbl-m", x: 405, y: 28, "text-anchor": "middle" }, P.t("cubeLbl", { s: Math.round(CUBE_NM) }));
  cubeDots(300, 54, 210, cur.ions);
  const it = ionsText(cur.ions);
  T("text", { class: "num", x: 405, y: 292, "text-anchor": "middle" }, it[0]);
  if (it[1]) T("text", { class: "lbl-m", x: 405, y: 320, "text-anchor": "middle" }, it[1]);
  T("text", { class: "lbl", x: 405, y: 356, "text-anchor": "middle" }, cur.k ? P.t("fewer", { r: Play.fmt(cur.ratio, 1) }) : P.t("start"));
  colourBar(20, 380, 520, 20, cur.p);
  // table: last 5 rows
  const box = $("histBox");
  box.innerHTML = "";
  const tb = document.createElement("table");
  tb.className = "hist";
  const tr0 = tb.insertRow();
  ["hk", "hc", "hp", "hr"].forEach((k) => { const th = document.createElement("th"); th.textContent = P.t(k); tr0.appendChild(th); });
  rows.slice(-5).forEach((r) => {
    const tr = tb.insertRow();
    if (r === cur) tr.className = "cur";
    [String(r.k), sci(r.h, 1), f2(r.p), r.k ? "÷" + Play.fmt(r.ratio, 1) : "—"].forEach((v) => (tr.insertCell().textContent = v));
  });
  box.appendChild(tb);
  $("n").value = state.n;
  $("nVal").textContent = state.n;
  $("dil").disabled = state.n >= NMAX;
  Play.live($("live"), cur.k ? P.t("liveDil", { n: cur.k, h: sci(cur.h, 1), p: f2(cur.p), f: factorText(Math.log10(rows[0].h / cur.h)), dp: f2(cur.p - rows[0].p) })
    : P.t("liveDil0", { h: sci(cur.h, 1), p: f2(cur.p), i: group(cur.ions) }));
  $("extra").textContent = cur.k && cur.ratio < 9.5 ? P.t("near7") : "";
  $("extra").hidden = !$("extra").textContent;
}

/* ---------- step 3: log ruler + compare ---------- */
const RY0 = 40, RY1 = 352;
const yOf = (p) => RY0 + ((RY1 - RY0) * p) / 14;
const pTxt = (s) => (s.lo === s.hi ? String(s.lo) : s.lo + "–" + s.hi);
function pick(i) {
  if (state.next === "a") { state.a = i; state.next = "b"; } else { state.b = i; state.next = "a"; }
  render();
}
function drawCmp() {
  fig.setAttribute("aria-label", P.t("figCmp"));
  fig.innerHTML = "";
  const defs = S("defs", {}, fig);
  const g = S("linearGradient", { id: "uiv", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
  UI.forEach((c, i) => S("stop", { offset: i / 14, "stop-color": c }, g));
  S("rect", { x: 130, y: RY0, width: 26, height: RY1 - RY0, rx: 4, fill: "url(#uiv)" }, fig);
  T("text", { class: "lbl-m", x: 120, y: 20, "text-anchor": "end" }, P.t("phLbl"));
  T("text", { class: "lbl-m", x: 62, y: 20, "text-anchor": "end" }, P.t("hLbl"));
  for (let p = 0; p <= 14; p++) {
    const y = yOf(p);
    S("line", { class: "tick", x1: 124, x2: 130, y1: y, y2: y }, fig);
    if (p % 2 === 0) {
      T("text", { class: "num", x: 120, y: y + 7, "text-anchor": "end" }, String(p));
      T("text", { class: "lbl-m", x: 74, y: y + 7, "text-anchor": "end" }, p === 0 ? "1" : "10" + sup(-p));
    }
  }
  // labels pushed apart so they never overlap
  const ly = SUBST.map((s) => yOf(typ(s)) + 7);
  for (let i = 1; i < ly.length; i++) ly[i] = Math.max(ly[i], ly[i - 1] + 26);
  SUBST.forEach((s, i) => {
    const on = i === state.a ? "on-a" : i === state.b ? "on-b" : "";
    const gg = S("g", { class: "sub", tabindex: 0, role: "button", "aria-label": P.t(s.key) + " pH " + pTxt(s) }, fig);
    const y = yOf(typ(s));
    if (s.hi > s.lo) S("rect", { x: 158, y: yOf(s.lo), width: 6, height: yOf(s.hi) - yOf(s.lo), fill: "var(--fg)" }, gg);
    S("path", { class: "lead " + on, d: `M156,${y} L190,${y} L210,${ly[i] - 7} L218,${ly[i] - 7}`, fill: "none" }, gg);
    S("rect", { x: 216, y: ly[i] - 22, width: 330, height: 26, fill: "transparent" }, gg);
    T("text", { class: "sublbl " + on, x: 222, y: ly[i] }, P.t(s.key) + " " + P.t("approx", { v: pTxt(s) }), gg);
    gg.addEventListener("click", () => pick(i));
    gg.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i); const el = fig.querySelectorAll(".sub")[i]; if (el) el.focus(); } });
  });
  // bracket between the two picks
  const A = SUBST[state.a], B = SUBST[state.b], ya = yOf(typ(A)), yb = yOf(typ(B));
  [[ya, "pin-a"], [yb, "pin-b"]].forEach(([y, c]) => S("circle", { class: c, cx: 143, cy: y, r: 7, stroke: "var(--surface)", "stroke-width": 2 }, fig));
  if (Math.abs(ya - yb) > 1) S("path", { class: "brk", d: `M106,${ya} L96,${ya} L96,${yb} L106,${yb}` }, fig);
  const C = compare(typ(A), typ(B));
  const name = (s) => P.t(s.key);
  const mid = (s) => (P.lang === "en" ? name(s).charAt(0).toLowerCase() + name(s).slice(1) : name(s));
  T("text", { class: "lbl-m", x: 280, y: 394, "text-anchor": "middle" }, P.t("cmpLine1", { a: name(A), b: mid(B), d: +C.d.toFixed(2) }));
  const more = C.aMore ? A : B, less = C.aMore ? B : A;
  T("text", { class: "lbl", x: 280, y: 430, "text-anchor": "middle" }, C.same ? P.t("cmpSame") : P.t("cmpLine2", { m: name(more), f: factorText(C.d) }));
  Play.live($("live"), C.same ? P.t("liveSame", { p: pTxt(A) })
    : P.t("liveCmp", { m: name(more), m2: mid(more), pm: pTxt(more), l: mid(less), pl: pTxt(less), f: factorText(C.d), len: lengthText(C.d, P.lang) }));
  $("selA").value = state.a; $("selB").value = state.b;
}

function render() {
  $("dilCtl").hidden = state.step !== 1;
  $("cmpCtl").hidden = state.step !== 2;
  $("histBox").hidden = state.step !== 1;
  $("safety").hidden = state.step !== 2;
  if (state.step !== 1) { $("extra").textContent = ""; $("extra").hidden = true; }
  if (state.step === 0) drawGuess(); else if (state.step === 1) drawDil(); else drawCmp();
}

["selA", "selB"].forEach((id) => {
  const s = $(id);
  SUBST.forEach((x, i) => { const o = document.createElement("option"); o.value = i; o.textContent = P.t(x.key) + " (" + pTxt(x) + ")"; s.appendChild(o); });
});
$("selA").addEventListener("change", (e) => { state.a = +e.target.value; render(); });
$("selB").addEventListener("change", (e) => { state.b = +e.target.value; render(); });
$("swap").addEventListener("click", () => { [state.a, state.b] = [state.b, state.a]; render(); });
$("dil").addEventListener("click", () => { state.n = Math.min(NMAX, state.n + 1); render(); if ($("dil").disabled) $("n").focus(); });
$("fresh").addEventListener("click", () => { state.n = 0; render(); });
$("n").addEventListener("input", (e) => { state.n = Play.clamp(Math.round(+e.target.value) || 0, 0, NMAX); render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { state.revealed = true; render(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  state.step = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  Object.assign(state, { revealed: false, n: 0, a: 0, b: 3, next: "b" });
  pr.reset(); st.go(0);
});
</script>
</body>

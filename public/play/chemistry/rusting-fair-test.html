<script>
// CORE START — pure model, no DOM (checked in node)
// Rust growth is ILLUSTRATIVE: real rates depend on the steel, temperature and surface.
const K_BASE = 0.12;     // per day, tap water open to air
const TRACE_O2 = 0.03;   // boiled water under oil: a little oxygen still dissolves back in
const TRACE_H2O = 0.02;  // calcium chloride keeps the air very dry, but not perfectly
const SALT_X = 3;        // salt water speeds rusting
const DAY_MAX = 14;
const FACTORS = ["water", "air", "salt"];
const M_FE = 55.845, M_O = 15.999;   // IUPAC conventional atomic masses
const DEFAULTS = [
  { water: true, air: true, salt: false },   // A control
  { water: true, air: false, salt: false },  // B boiled water + oil
  { water: false, air: true, salt: false },  // C dry air + CaCl2
  { water: true, air: true, salt: true },    // D salt water
];
function norm(c) { const w = !!c.water; return { water: w, air: !!c.air, salt: w && !!c.salt }; }
function rate(c) {
  c = norm(c);
  return K_BASE * (c.water ? 1 : TRACE_H2O) * (c.air ? 1 : TRACE_O2) * (c.salt ? SALT_X : 1);
}
function rustFrac(c, d) {
  d = Number.isNaN(+d) ? 0 : Math.min(DAY_MAX, Math.max(0, +d));
  return 1 - Math.exp(-rate(c) * d);
}
function word(f) { return f < 0.005 ? "w0" : f < 0.1 ? "w1" : f < 0.4 ? "w2" : "w3"; }
function diffs(c, ref) { c = norm(c); ref = norm(ref); return FACTORS.filter((k) => c[k] !== ref[k]); }
function verdict(i, tubes) {
  if (i === 0) return { kind: "control", list: [] };
  const list = diffs(tubes[i], tubes[0]);
  return { kind: list.length === 0 ? "same" : list.length === 1 ? "fair" : "unfair", list };
}
function condKey(c) { c = norm(c); return "c" + (c.water ? "W" : "D") + (c.air ? "A" : "N") + (c.salt ? "S" : ""); }
// 4 Fe + 3 O2 -> 2 Fe2O3 : oxygen taken up per gram of iron
const O_PER_FE = (3 * M_O) / (2 * M_FE);
// CORE END

    linkAtoms: "原子只是重新组合，一个也不少",

  },

const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent);
const LET = ["A", "B", "C", "D"];
const XS = [75, 225, 375, 525];
const pct = (f) => Play.fmt(f * 100, 0) + "%";
const state = { tubes: DEFAULTS.map((c) => ({ ...c })), day: 0, step: 0, playing: false, answered: false };

function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
// fixed rust-spot layout along the shank: [dx, t along shank, radius, threshold]
const SPOTS = (() => {
  const rnd = seeded(5), out = [];
  for (let i = 0; i < 22; i++) out.push([(rnd() * 2 - 1) * 4.5, rnd(), 2.5 + rnd() * 3, (i + 0.5) / 22]);
  return out;
})();

function factorList(list) { return list.map((k) => P.t("f" + k)).join(P.t("and")); }

function drawTube(i) {
  const c = norm(state.tubes[i]), cx = XS[i], f = rustFrac(c, state.day);
  const v = verdict(i, state.tubes);
  const L = cx - 34, R = cx + 34, top = 70, bot = 290;
  const tubeD = `M${L},${top} L${L},${bot} A34,34 0 0 0 ${R},${bot} L${R},${top}`;
  if (v.kind === "unfair") S("rect", { class: "unfair", x: cx - 66, y: 6, width: 132, height: 388, rx: 12 }, fig);
  S("text", { class: "letter", x: cx, y: 36, "text-anchor": "middle" }, fig).textContent = LET[i];
  if (v.kind === "unfair") S("text", { class: "flag", x: cx + 28, y: 36, "text-anchor": "middle" }, fig).textContent = "⚠";
  const sealed = !c.air || !c.water;
  let surface = 120;
  if (c.water) {
    S("path", { class: "water" + (c.salt ? " salty" : ""), d: `M${L},${surface} L${L},${bot} A34,34 0 0 0 ${R},${bot} L${R},${surface} Z` }, fig);
    if (c.salt) for (let k = 0; k < 9; k++) S("circle", { class: "saltdot", cx: cx - 22 + (k % 3) * 22 + (k % 2) * 4, cy: 150 + Math.floor(k / 3) * 60, r: 2.2 }, fig);
    if (!c.air) S("rect", { class: "oil", x: L, y: surface - 16, width: 68, height: 16 }, fig);
  } else {
    const rnd = seeded(31 + i);
    for (let k = 0; k < 16; k++) {
      const gx = cx + (rnd() * 2 - 1) * 24, gy = 300 + rnd() * 14 - Math.abs(gx - cx) * 0.25;
      S("circle", { class: "gran", cx: gx, cy: gy, r: 5 + rnd() * 2 }, fig);
    }
  }
  S("path", { class: "glass" + (state.step === 0 && i === 1 ? " hi" : ""), d: tubeD }, fig);
  if (sealed) S("rect", { class: "stopper", x: L - 6, y: top - 18, width: 80, height: 24, rx: 4 }, fig);
  // nail: head + shank + tip; rests on the bottom in water, hangs on a thread in the dry tube
  const y0 = c.water ? 150 : 104, len = c.water ? 148 : 150;
  if (!c.water) S("line", { class: "thread", x1: cx, y1: top + 6, x2: cx, y2: y0 }, fig);
  const nailD = `M${cx - 13},${y0} L${cx + 13},${y0} L${cx + 13},${y0 + 7} L${cx + 4.5},${y0 + 7} L${cx + 4.5},${y0 + len} L${cx},${y0 + len + 14} L${cx - 4.5},${y0 + len} L${cx - 4.5},${y0 + 7} L${cx - 13},${y0 + 7} Z`;
  S("path", { class: "nail", d: nailD }, fig);
  if (f > 0.001) S("path", { class: "rustcoat", d: nailD, "fill-opacity": Play.fmt(0.85 * f, 3) }, fig);
  SPOTS.forEach(([dx, t, r, th]) => {
    if (th < f) S("circle", { class: "rustspot", cx: cx + dx, cy: y0 + 9 + t * (len - 4), r }, fig);
  });
  // readout under the tube
  S("text", { class: "pct", x: cx, y: 354, "text-anchor": "middle" }, fig).textContent = pct(f);
  S("text", { class: "word", x: cx, y: 379, "text-anchor": "middle" }, fig).textContent = P.t(word(f));
  S("rect", { class: "barbg", x: cx - 50, y: 384, width: 100, height: 6, rx: 3 }, fig);
  S("rect", { class: "barfg", x: cx - 50, y: 384, width: 100 * f, height: 6, rx: 3 }, fig);
}

function buildCards() {
  const box = $("tubes");
  box.innerHTML = "";
  state.tubes.forEach((c, i) => {
    const card = document.createElement("div");
    card.className = "tcard"; card.id = "card" + i;
    const h = document.createElement("h4");
    h.textContent = LET[i];
    if (i === 0) { const s = document.createElement("span"); s.textContent = P.t("control"); h.appendChild(s); }
    const tg = document.createElement("div"); tg.className = "tg";
    [["water", "tWater"], ["air", "tAir"], ["salt", "tSalt"]].forEach(([k, lab]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "small"; b.textContent = P.t(lab);
      b.dataset.i = i; b.dataset.k = k; b.dataset.lab = lab;
      b.addEventListener("click", () => {
        const t = state.tubes[i];
        t[k] = !t[k];
        if (!t.water) t.salt = false;
        render(); b.focus();
      });
      tg.appendChild(b);
    });
    const cond = document.createElement("p"); cond.className = "cond";
    const ver = document.createElement("p"); ver.className = "verd";
    card.append(h, tg, cond, ver);
    box.appendChild(card);
  });
}
function syncCards() {
  state.tubes.forEach((c0, i) => {
    const c = norm(c0), card = $("card" + i), v = verdict(i, state.tubes);
    card.classList.toggle("bad", v.kind === "unfair");
    card.querySelectorAll("button").forEach((b) => {
      const on = c[b.dataset.k];
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
      b.disabled = b.dataset.k === "salt" && !c.water;
      b.setAttribute("aria-label", LET[i] + " · " + P.t(on ? "tOn" : "tOff", { f: P.t(b.dataset.lab) }));
    });
    card.querySelector(".cond").textContent = P.t(condKey(c));
    card.querySelector(".verd").textContent = P.t("v" + v.kind, { f: factorList(v.list) });
  });
}

function render() {
  fig.innerHTML = "";
  fig.setAttribute("aria-label", P.t("fig"));
  for (let i = 0; i < 4; i++) drawTube(i);
  syncCards();
  $("day").value = state.day;
  $("dayVal").textContent = Play.fmt(state.day, 0);
  $("play").textContent = P.t(state.playing ? "pauseBtn" : "playBtn");
  const fr = state.tubes.map((c) => pct(rustFrac(c, state.day)));
  if (state.step === 2) {
    $("stepBody").textContent = P.t("b3", { d: Play.fmt(state.day, 0), a: fr[0], b: fr[1], c: fr[2], e: fr[3] });
  }
  const nBad = state.tubes.filter((c, i) => verdict(i, state.tubes).kind === "unfair").length;
  let msg = P.t("liveDay", { d: Play.fmt(state.day, 0), a: fr[0], b: fr[1], c: fr[2], e: fr[3] });
  if (state.step === 1 && nBad) msg += " " + P.t("liveFlag", { n: nBad });
  Play.live($("live"), state.step === 0 && !state.answered ? "" : msg);
}

/* ---------- day animation (never autoplays) ---------- */
let raf = 0, last = 0, acc = 0;
function tick(t) {
  if (!state.playing) return;
  acc += last ? Math.min(0.1, (t - last) / 1000) : 0;
  last = t;
  const d = Math.min(DAY_MAX, Math.floor(acc / 0.45));
  if (d !== state.day) { state.day = d; if (d >= DAY_MAX) state.playing = false; render(); }
  if (state.playing) raf = requestAnimationFrame(tick);
}
function stop() { state.playing = false; cancelAnimationFrame(raf); last = 0; }
$("play").addEventListener("click", () => {
  if (state.playing) { stop(); render(); return; }
  if (state.day >= DAY_MAX) state.day = 0;
  if (Play.reduced) { state.day = DAY_MAX; render(); return; }
  state.playing = true; last = 0; acc = state.day * 0.45; render();
  raf = requestAnimationFrame(tick);
});
$("day").addEventListener("input", (e) => { stop(); state.day = Play.clamp(Math.round(+e.target.value) || 0, 0, DAY_MAX); render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { state.answered = true; $("dayCtl").hidden = false; render(); });

function setB3b() {
  const p = $("stepBody2");
  p.textContent = P.t("b3b", { o: Play.fmt(O_PER_FE, 2) }) + " ";
  const a = document.createElement("a");
  a.href = "atoms-rearrange.html?lang=" + P.lang;
  a.textContent = P.t("linkAtoms");
  p.appendChild(a);
}

buildCards();
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  stop();
  state.step = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("tubes").hidden = i !== 1;
  $("dayCtl").hidden = i === 0 && !state.answered;
  $("stepBody2").hidden = i !== 2;
  if (i === 0) { state.tubes = DEFAULTS.map((c) => ({ ...c })); }
  if (i === 2) { state.tubes = DEFAULTS.map((c) => ({ ...c })); state.day = DAY_MAX; setB3b(); }
  render();
});

$("foot").textContent = P.t("foot", {
  k: Play.fmt(K_BASE, 2), s: SALT_X, po: Play.fmt(TRACE_O2 * 100, 0), pw: Play.fmt(TRACE_H2O * 100, 0),
  fe: Play.fmt(M_FE, 3), om: Play.fmt(M_O, 3),
});
$("reset").addEventListener("click", () => {
  stop();
  state.tubes = DEFAULTS.map((c) => ({ ...c })); state.day = 0; state.answered = false;
  pr.reset(); st.go(0);
});
render();
</script>
</body>
</html>

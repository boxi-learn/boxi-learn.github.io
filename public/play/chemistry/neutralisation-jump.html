// CORE START — pure chemistry, no DOM (checked in node)
const KW = 1.0e-14;     // ion product of water at 25 °C, (mol/L)²
const CA = 0.100;       // HCl in the flask, mol/L
const VA = 25.0;        // its volume, mL
const CB = 0.100;       // NaOH in the burette, mol/L
const DPM = 20;         // drops per mL (one drop ≈ 0.05 mL)
const DMAX = 1000;      // burette holds 50.00 mL = 1000 drops
const NA_MMOL = CA * VA;             // H⁺ at the start, mmol (= 2.50)
const VEQ = NA_MMOL / CB;            // base needed to pair every H⁺, mL (= 25.00)
const SLOT = 0.05;                   // one dot = 0.05 mmol (2 % of the starting H⁺)
const clampD = (d) => Math.round(Math.min(DMAX, Math.max(0, Number.isFinite(d) ? d : 0)));
// Flask after V mL of base. Charge balance: [H⁺] − [OH⁻] = e, with e the leftover strong acid
// (negative when base is left over) over the total volume; [H⁺][OH⁻] = Kw.
function mix(V) {
  V = Math.min(DMAX / DPM, Math.max(0, Number.isFinite(V) ? V : 0));
  const nB = CB * V, Vt = VA + V, e = (NA_MMOL - nB) / Vt;   // mmol/mL = mol/L
  const r = Math.sqrt(e * e / 4 + KW);
  let h, oh;
  if (e >= 0) { h = e / 2 + r; oh = KW / h; } else { oh = -e / 2 + r; h = KW / oh; }
  return { V, nB, Vt, h, oh, pH: -Math.log10(h),
    left: Math.max(0, NA_MMOL - nB), paired: Math.min(NA_MMOL, nB), extra: Math.max(0, nB - NA_MMOL) };
}
const mixD = (d) => mix(clampD(d) / DPM);
// Base volume (mL) at which the flask reaches pH p (inverse of mix, exact for this model).
function volumeAt(p) {
  if (!Number.isFinite(p)) return NaN;
  const h = Math.pow(10, -p), x = h - KW / h;       // = e
  if (x <= -CB) return Infinity;                     // never reached: the base itself is not that strong
  return Math.max(0, (NA_MMOL - x * VA) / (CB + x));
}
// Points along the curve from 0 to V mL: coarse far away, fine near the equivalence point.
function curvePts(V) {
  const vs = [];
  for (let i = 0; i <= 200; i++) vs.push(i * 0.25);
  for (let i = 0; i <= 400; i++) vs.push(24 + i * 0.005);
  return [...new Set(vs.map((v) => +v.toFixed(4)))].sort((a, b) => a - b).filter((v) => v <= V + 1e-9).concat([V])
    .map((v) => [v, mix(v).pH]);
}
// The "steady climb" guess: a straight line from the start to pH 7 at the equivalence volume.
const steadyGuess = (V) => mix(0).pH + (7 - mix(0).pH) * V / VEQ;
// Base needed for each pH step.
const STEPS = [[1, 2], [2, 3], [3, 4], [4, 7], [7, 10], [10, 11], [11, 12]];
const stepRows = () => STEPS.map(([a, b]) => { const ml = volumeAt(b) - volumeAt(a); return { a, b, ml, drops: ml * DPM }; });
// Phenolphthalein: colourless below ≈ 8.2, pink → magenta up to ≈ 10 (approximate).
function phth(p) {
  p = Number.isFinite(p) ? p : 7;
  const t = Math.min(1, Math.max(0, (p - 8.2) / 1.8));
  return t <= 0 ? null : { col: "#d6288c", op: 0.12 + 0.78 * t };
}
// Universal indicator, approximate colours at pH 0…14 (brands differ) — same as the pH page.
const UI = ["#d0213a", "#e0352b", "#ea4f24", "#f07a22", "#f6a623", "#f5cf1f", "#c8d628", "#5db84a",
  "#2fa66a", "#1f9a9a", "#2a6fb5", "#3b4fa8", "#5b3d9a", "#6e2f8a", "#6b2370"];
function universal(p) {
  p = Math.min(14, Math.max(0, Number.isFinite(p) ? p : 7));
  const i = Math.min(13, Math.floor(p)), t = p - i;
  const rgb = (h) => [1, 3, 5].map((j) => parseInt(h.slice(j, j + 2), 16));
  const a = rgb(UI[i]), b = rgb(UI[i + 1]);
  return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * t)).join(",") + ")";
}
// mmol with sensible digits: 1.25, 0.10, 0.0050, 0
function mmol(x) {
  if (!Number.isFinite(x) || x <= 1e-12) return "0";
  if (x >= 0.1) return x.toFixed(2);
  return x.toPrecision(2);
}
function pct(x) {
  if (!Number.isFinite(x) || x <= 1e-12) return "0";
  if (x >= 10) return x.toFixed(0);
  if (x >= 1) return x.toFixed(1);
  return x.toPrecision(1);
}

    foot: "模型：25 °C 下强酸加强碱，体积直接相加。[H⁺] − [OH⁻] = e，[H⁺][OH⁻] = K_w = 1.0 × 10⁻¹⁴ (mol/L)²，e = (2.50 毫摩尔 − 0.100 mol/L × V) ÷ (25.0 毫升 + V)。滴定管一滴按 0.05 毫升计（实际约 0.03–0.05 毫升）。严格说 pH 用的是活度，只在稀溶液里才和浓度很接近。酚酞变色范围约 pH 8.2–10；通用指示剂颜色是近似色，不同品牌略有差别。CC BY-SA 4.0 · Boxi Yu",
  },
});

const $ = (id) => document.getElementById(id);
{ const dq = clampD(VEQ * DPM); $("resultNote").textContent = P.t("resultNote", { p: Play.fmt(mix(VEQ / 2).pH, 2), a: Play.fmt(mixD(dq - 1).pH, 2), b: Play.fmt(mixD(dq + 1).pH, 2), v: VEQ.toFixed(2) }); }
const fig = $("fig");
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent || fig);
const T = (tag, attrs, text, parent) => { const e = S(tag, attrs, parent); e.textContent = text; return e; };
const f2 = (x) => Play.fmt(x, 2);
const mlFmt = (d) => (clampD(d) / DPM).toFixed(2);
const state = { step: 0, revealed: false, d: 0, hist: [], ind: "phth", row: 3 };

/* ---------- shared drawing ---------- */
function apparatus(m) {
  // burette: 50 mL scale, liquid level drops as base runs out
  const bx = 44, by0 = 14, by1 = 174, frac = Math.min(1, m.V / 50);
  S("rect", { class: "base", x: bx, y: by0 + (by1 - by0) * frac, width: 22, height: (by1 - by0) * (1 - frac) }, fig);
  S("path", { class: "glass", d: `M${bx},${by0} L${bx},${by1} L${bx + 8},${by1 + 8} L${bx + 8},${by1 + 18} M${bx + 22},${by0} L${bx + 22},${by1} L${bx + 14},${by1 + 8} L${bx + 14},${by1 + 18}` }, fig);
  for (let i = 0; i <= 5; i++) S("line", { class: "tickm", x1: bx, x2: bx + 7, y1: by0 + i * (by1 - by0) / 5, y2: by0 + i * (by1 - by0) / 5 }, fig);
  T("text", { class: "lbl-m", x: bx + 30, y: by0 + 22 }, P.t("burette"));
  // flask with indicator colour
  const fy = 300, top = 206;
  let fill = "var(--c)", op = 0.12;
  if (state.ind === "univ") { fill = universal(m.pH); op = 0.85; }
  else { const c = phth(m.pH); if (c) { fill = c.col; op = c.op; } }
  S("path", { d: `M18,252 L102,252 L114,${fy - 4} Q116,${fy} 110,${fy} L10,${fy} Q4,${fy} 6,${fy - 4} Z`, fill, "fill-opacity": op }, fig);
  S("path", { class: "glass", d: `M46,${top} L46,236 L6,${fy - 4} Q4,${fy} 10,${fy} L110,${fy} Q116,${fy} 114,${fy - 4} L74,236 L74,${top}` }, fig);
  T("text", { class: "lbl-m", x: 82, y: 232 }, P.t("flask"));
  T("text", { class: "big", x: 60, y: 342, "text-anchor": "middle" }, P.t("mlTxt", { v: m.V.toFixed(2) }));
  T("text", { class: "big", x: 60, y: 380, "text-anchor": "middle" }, P.t("phTxt", { p: f2(m.pH) }));
}
const PX0 = 190, PX1 = 540, PY0 = 30, PY1 = 300;
const px = (v) => PX0 + (PX1 - PX0) * v / 50;
const py = (p) => PY1 - (PY1 - PY0) * Math.min(14, Math.max(0, p)) / 14;
function axes() {
  for (let p = 0; p <= 14; p += 2) S("line", { class: "grid", x1: PX0, x2: PX1, y1: py(p), y2: py(p) }, fig);
  S("rect", { class: "band", x: PX0, y: py(10), width: PX1 - PX0, height: py(8.2) - py(10) }, fig);
  S("line", { class: "seven", x1: PX0, x2: PX1, y1: py(7), y2: py(7) }, fig);
  S("path", { class: "axis", d: `M${PX0},${PY0 - 6} L${PX0},${PY1} L${PX1},${PY1}` }, fig);
  [0, 7, 14].forEach((p) => T("text", { class: "num", x: PX0 - 8, y: py(p) + 8, "text-anchor": "end" }, String(p)));
  T("text", { class: "lbl-m", x: PX0 + 8, y: PY0 - 8 }, P.t("phAxis"));
  [0, 25, 50].forEach((v) => T("text", { class: "num", x: px(v), y: PY1 + 26, "text-anchor": v === 0 ? "start" : v === 50 ? "end" : "middle" }, String(v)));
  T("text", { class: "lbl-m", x: (PX0 + PX1) / 2, y: PY1 + 52, "text-anchor": "middle" }, P.t("vAxis"));
}
const pathOf = (pts) => pts.map(([v, p], i) => (i ? "L" : "M") + px(v).toFixed(1) + "," + py(p).toFixed(1)).join(" ");
function dots(m) {
  const x0 = 64, step = (540 - x0) / 49, y1 = 418, y2 = 446;
  T("text", { class: "lbl-m", x: 6, y: y1 + 7 }, "H⁺");
  T("text", { class: "lbl-m", x: 6, y: y2 + 7 }, "OH⁻");
  const nLeftDots = m.left / SLOT, nExtra = m.extra / SLOT;
  for (let i = 0; i < 50; i++) {
    const x = x0 + i * step;
    // dot i is H⁺ while more than i slots remain; partially used dots shrink
    const rem = Math.min(1, Math.max(0, nLeftDots - i));
    if (rem >= 0.999) S("circle", { class: "hp", cx: x, cy: y1, r: 4.2 }, fig);
    else if (rem > 0) { S("circle", { class: "pair", cx: x, cy: y1, r: 4.2 }, fig); S("circle", { class: "hp", cx: x, cy: y1, r: Math.max(1.2, 4.2 * Math.sqrt(rem)) }, fig); }
    else S("circle", { class: "pair", cx: x, cy: y1, r: 4.2 }, fig);
    const ex = Math.min(1, Math.max(0, nExtra - i));
    if (ex > 0) S("circle", { class: "oh", cx: x, cy: y2, r: Math.max(1.2, 4.2 * Math.sqrt(ex)) }, fig);
    else S("circle", { class: "slot", cx: x, cy: y2, r: 3 }, fig);
  }
}

/* ---------- step 1 ---------- */
function drawGuess() {
  fig.setAttribute("aria-label", P.t("figGuess"));
  fig.innerHTML = "";
  const m = state.revealed ? mix(VEQ / 2) : mix(0);
  apparatus(m);
  axes();
  const g0 = mix(0).pH;
  S("path", { class: "guess", d: `M${px(0)},${py(g0)} L${px(VEQ)},${py(7)}` }, fig);
  T("text", { class: "guess-t", x: px(VEQ) - 6, y: py(7) - 12, "text-anchor": "end" }, P.t("guessLbl"));
  if (!state.revealed) {
    T("text", { class: "qmark", x: px(VEQ / 2), y: py(4) + 20, "text-anchor": "middle" }, "?");
    S("circle", { class: "pt", cx: px(0), cy: py(g0), r: 7 }, fig);
  } else {
    S("path", { class: "curve", d: pathOf(curvePts(VEQ / 2)) }, fig);
    S("circle", { class: "pt", cx: px(VEQ / 2), cy: py(m.pH), r: 7 }, fig);
    T("text", { class: "num", x: px(VEQ / 2) + 10, y: py(m.pH) + 30 }, f2(m.pH));
    S("circle", { cx: px(VEQ / 2), cy: py(steadyGuess(VEQ / 2)), r: 6, fill: "var(--no)" }, fig);
    T("text", { class: "guess-t", x: px(VEQ / 2) - 12, y: py(steadyGuess(VEQ / 2)) - 10, "text-anchor": "end" }, f2(steadyGuess(VEQ / 2)));
  }
  dots(m);
  Play.live($("live"), state.revealed
    ? P.t("liveGuess", { l: mmol(m.left), n: mmol(NA_MMOL), p: f2(m.pH), g: f2(steadyGuess(VEQ / 2)) })
    : P.t("liveGuess0"));
}

/* ---------- step 2 ---------- */
function drawLab() {
  fig.setAttribute("aria-label", P.t("figLab"));
  fig.innerHTML = "";
  const m = mixD(state.d);
  apparatus(m);
  axes();
  S("path", { class: "guess", d: `M${px(0)},${py(mix(0).pH)} L${px(VEQ)},${py(7)}`, "stroke-opacity": 0.45 }, fig);
  S("path", { class: "curve", d: pathOf(curvePts(m.V)) }, fig);
  S("circle", { class: "pt", cx: px(m.V), cy: py(m.pH), r: 7 }, fig);
  // drag strip over the plot
  const hit = S("rect", { class: "hit", x: PX0 - 10, y: PY0 - 10, width: PX1 - PX0 + 20, height: PY1 - PY0 + 40 }, fig);
  hit.addEventListener("pointerdown", dragStart);
  dots(m);
  // history table
  const box = $("histBox");
  box.innerHTML = "";
  if (state.hist.length) {
    const tb = document.createElement("table");
    tb.className = "hist";
    const tr0 = tb.insertRow();
    ["hAdd", "hV", "hP", "hD"].forEach((k) => { const th = document.createElement("th"); th.textContent = P.t(k); tr0.appendChild(th); });
    state.hist.slice(-5).forEach((h, i, arr) => {
      const tr = tb.insertRow();
      if (i === arr.length - 1) tr.className = "cur";
      const dp = h.p1 - h.p0;
      [(h.d1 >= h.d0 ? "+" : "−") + mlFmt(Math.abs(h.d1 - h.d0)), mlFmt(h.d1), f2(h.p1), (dp >= 0 ? "+" : "−") + f2(Math.abs(dp))]
        .forEach((v, j) => { const c = tr.insertCell(); c.textContent = v; if (j === 3 && Math.abs(dp) >= 1) c.className = "jump"; });
    });
    box.appendChild(tb);
  }
  $("v").value = state.d;
  $("vVal").textContent = P.t("mlTxt", { v: m.V.toFixed(2) });
  $("add5").disabled = $("add1").disabled = $("addDrop").disabled = state.d >= DMAX;
  const last = state.hist[state.hist.length - 1];
  const dv = last ? mlFmt(Math.abs(last.d1 - last.d0)) : "0", dp = last ? f2(last.p1 - last.p0) : "0";
  const deq = clampD(VEQ * DPM);
  let txt;
  if (state.d === 0) txt = P.t("liveLab0", { n: mmol(NA_MMOL), p: f2(m.pH) });
  else if (state.d < deq) txt = P.t("liveLab", { v: m.V.toFixed(2), l: mmol(m.left), pc: pct(100 * m.left / NA_MMOL), p: f2(m.pH), dv, dp });
  else if (state.d === deq) txt = P.t("liveEq", { v: m.V.toFixed(2), p: f2(m.pH), dv, dp });
  else txt = P.t("liveOH", { v: m.V.toFixed(2), x: mmol(m.extra), p: f2(m.pH), dv, dp });
  Play.live($("live"), txt);
  let extra = "";
  if (state.d === deq) extra = P.t("eqNote");
  else if (state.d > deq && state.ind === "phth" && m.pH >= 8.2 && state.d <= deq + 4) extra = P.t("pinkNote", { d: (volumeAt(8.2) - VEQ).toFixed(4) });
  else if (state.d < deq && deq - state.d <= 10) extra = deq - state.d === 1 ? P.t("nearNote1") : P.t("nearNote", { k: deq - state.d });
  $("extra").textContent = extra;
  $("extra").hidden = !extra;
}
function setD(d) {
  d = clampD(d);
  if (d === state.d) return;
  state.hist.push({ d0: state.d, d1: d, p0: mixD(state.d).pH, p1: mixD(d).pH });
  if (state.hist.length > 50) state.hist.shift();
  state.d = d;
  render();
}
// drag on the graph: x → volume, snapped to whole drops
let dragging = false;
function dragTo(e) {
  const pt = Play.pointer(fig, e);
  const v = Math.min(50, Math.max(0, (pt.x - PX0) / (PX1 - PX0) * 50));
  state.dragD = clampD(v * DPM);
  // during the drag, move without logging each pixel
  const prev = state.d; state.d = state.dragD;
  render(); state.d = prev;
  state.dPending = state.dragD;
}
function dragStart(e) {
  dragging = true;
  fig.setPointerCapture && fig.setPointerCapture(e.pointerId);
  dragTo(e); e.preventDefault();
}
fig.addEventListener("pointermove", (e) => { if (dragging) dragTo(e); });
function dragEnd() {
  if (!dragging) return;
  dragging = false;
  if (state.dPending !== undefined) { const d = state.dPending; state.dPending = undefined; setD(d); }
}
fig.addEventListener("pointerup", dragEnd);
fig.addEventListener("pointercancel", dragEnd);

/* ---------- step 3 ---------- */
function drawRule() {
  fig.setAttribute("aria-label", P.t("figRule"));
  fig.innerHTML = "";
  const X0 = 64, X1 = 540, Y0 = 26, Y1 = 196;
  const qx = (v) => X0 + (X1 - X0) * v / 50, qy = (p) => Y1 - (Y1 - Y0) * p / 14;
  for (let p = 0; p <= 14; p += 7) S("line", { class: "grid", x1: X0, x2: X1, y1: qy(p), y2: qy(p) }, fig);
  S("path", { class: "axis", d: `M${X0},${Y0 - 4} L${X0},${Y1} L${X1},${Y1}` }, fig);
  [0, 7, 14].forEach((p) => T("text", { class: "num", x: X0 - 8, y: qy(p) + 8, "text-anchor": "end" }, String(p)));
  [0, 25, 50].forEach((v) => T("text", { class: "num", x: qx(v), y: Y1 + 26, "text-anchor": v === 0 ? "start" : v === 50 ? "end" : "middle" }, v === 50 ? "50 mL" : String(v)));
  const all = curvePts(50);
  S("path", { class: "curve", d: all.map(([v, p], i) => (i ? "L" : "M") + qx(v).toFixed(1) + "," + qy(p).toFixed(1)).join(" ") }, fig);
  const rows = stepRows(), sel = rows[state.row];
  const va = volumeAt(sel.a), vb = volumeAt(sel.b);
  const seg = all.filter(([v]) => v >= va - 1e-9 && v <= vb + 1e-9);
  const segPts = [[va, sel.a]].concat(seg).concat([[vb, sel.b]]);
  S("path", { class: "curve-hl", d: segPts.map(([v, p], i) => (i ? "L" : "M") + qx(v).toFixed(1) + "," + qy(p).toFixed(1)).join(" ") }, fig);
  // bars: base needed per pH step, same mL scale for all
  const B0 = 132, B1 = 400, maxMl = Math.max(...rows.map((r) => r.ml)), RY = 242, RH = 30;
  rows.forEach((r, i) => {
    const y = RY + i * RH;
    const g = S("g", { class: "row" + (i === state.row ? " on" : ""), tabindex: i === state.row ? 0 : -1, role: "button",
      "aria-label": "pH " + r.a + " → " + r.b + ": " + P.t("rowTxt", { ml: r.ml.toFixed(2) }) }, fig);
    S("rect", { x: 0, y: y - 4, width: 560, height: RH - 2, fill: "transparent" }, g);
    T("text", { class: "rowlbl", x: 8, y: y + 18 }, r.a + " → " + r.b, g);
    S("rect", { class: "rowbar", x: B0, y: y, width: Math.max(3, (B1 - B0) * r.ml / maxMl), height: RH - 10, rx: 3 }, g);
    const drops = Math.round(r.drops);
    T("text", { class: "rowlbl", x: 552, y: y + 18, "text-anchor": "end" },
      r.ml < 1 ? (drops === 1 ? P.t("dropTxt") : P.t("dropsTxt", { n: drops })) : P.t("rowTxt", { ml: r.ml.toFixed(2) }), g);
    g.addEventListener("click", () => { state.row = i; render(); focusRow(); });
    g.addEventListener("keydown", (e) => {
      let k = null;
      if (e.key === "ArrowDown" || e.key === "ArrowRight") k = Math.min(rows.length - 1, state.row + 1);
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") k = Math.max(0, state.row - 1);
      if (k !== null) { e.preventDefault(); state.row = k; render(); focusRow(); }
    });
  });
  const dr = Math.round(sel.drops);
  Play.live($("live"), P.t(state.row === 0 ? "liveRule1" : "liveRule", { a: sel.a, b: sel.b, ml: sel.ml.toFixed(2), dr: dr === 1 ? P.t("dropTxt") : P.t("dropsTxt", { n: dr }), big: rows[0].ml.toFixed(2) }));
}
function focusRow() { const el = fig.querySelectorAll(".row")[state.row]; if (el) el.focus(); }

function render() {
  $("addCtl").hidden = state.step !== 1;
  $("legend").hidden = state.step === 2;
  $("histBox").hidden = state.step !== 1;
  $("safety").hidden = state.step !== 1;
  if (state.step !== 1) { $("extra").textContent = ""; $("extra").hidden = true; }
  if (state.step === 0) drawGuess(); else if (state.step === 1) drawLab(); else drawRule();
}

[["phth", "phth"], ["univ", "univ"]].forEach(([v, k]) => { const o = document.createElement("option"); o.value = v; o.textContent = P.t(k); $("ind").appendChild(o); });
$("ind").addEventListener("change", (e) => { state.ind = e.target.value === "univ" ? "univ" : "phth"; render(); });
$("add5").addEventListener("click", () => setD(state.d + 5 * DPM));
$("add1").addEventListener("click", () => setD(state.d + DPM));
$("addDrop").addEventListener("click", () => { setD(state.d + 1); if ($("addDrop").disabled) $("v").focus(); });
$("empty").addEventListener("click", () => { state.d = 0; state.hist = []; render(); });
$("v").addEventListener("input", (e) => { const d = clampD(+e.target.value); const prev = state.d; state.d = d; render(); state.d = prev; state.dPending = d; });
$("v").addEventListener("change", () => { if (state.dPending !== undefined) { const d = state.dPending; state.dPending = undefined; setD(d); } });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { dp: f2(mix(VEQ / 2).pH - mix(0).pH) }), wrong: P.t("wrong", { p: f2(mix(VEQ / 2).pH) }),
}, () => { state.revealed = true; render(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  state.step = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, k === 3 ? { big: stepRows()[0].ml.toFixed(2), pc: pct(100 * CB / DPM / NA_MMOL) } : undefined);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  Object.assign(state, { revealed: false, d: 0, hist: [], ind: "phth", row: 3, dPending: undefined });
  $("ind").value = "phth";
  pr.reset(); st.go(0);
});
</script>
</body>
</html>

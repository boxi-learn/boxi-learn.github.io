<script>
// CORE START — pure chemistry and geometry, no DOM (checked in node)
const RADIUS = { H: 6, C: 9, O: 8.5, Fe: 10, Na: 10, I: 12 };
const ELS = ["C", "H", "O", "Na", "Fe", "I"];
const SC = 1.6;                        // drawing scale for molecule shapes
function ring(cx, cy, r, els, a0) {
  return els.map((e, k) => [e, +(cx + r * Math.cos(a0 + 2 * Math.PI * k / els.length)).toFixed(2), +(cy + r * Math.sin(a0 + 2 * Math.PI * k / els.length)).toFixed(2)]);
}
// shape: [element, x, y]; atoms: full composition (sugar is drawn as its two rings only)
const SPECIES = {
  H2O: { f: "H₂O", shape: [["H", -10, 7], ["H", 10, 7], ["O", 0, -1]] },
  CO2: { f: "CO₂", shape: [["O", -13, 0], ["O", 13, 0], ["C", 0, 0]] },
  O2: { f: "O₂", shape: [["O", -7, 0], ["O", 7, 0]] },
  CH4: { f: "CH₄", shape: [["H", -10, -8], ["H", 10, -8], ["H", -10, 8], ["H", 10, 8], ["C", 0, 0]] },
  H2O2: { f: "H₂O₂", shape: [["H", -17, -9], ["H", 17, 9], ["O", -7, -2], ["O", 7, 2]] },
  I2: { f: "I₂", shape: [["I", -9, 0], ["I", 9, 0]] },
  Fe: { f: "Fe", shape: [["Fe", 0, 0]] },
  Fe2O3: { f: "Fe₂O₃", shape: [["O", -18, 8], ["O", 18, 8], ["O", 0, -11], ["Fe", -9, 1], ["Fe", 9, 1]] },
  SUC: { f: "C₁₂H₂₂O₁₁", atoms: { C: 12, H: 22, O: 11 },
    shape: [].concat(ring(-22, 0, 18, ["O", "C", "C", "C", "C", "C"], Math.PI / 6), ring(22, 0, 15, ["C", "C", "C", "O", "C"], Math.PI), [["O", 0, 0]]) },
  AcOH: { f: "CH₃COOH", shape: [["H", -20, 0], ["H", -15, -10], ["H", -15, 10], ["H", 25, 13], ["C", -8, 0], ["C", 8, 0], ["O", 16, -9], ["O", 16, 9]] },
  NaHCO3: { f: "NaHCO₃", shape: [["H", 20, 12], ["C", 0, 0], ["O", 0, -12], ["O", -11, 7], ["O", 11, 7], ["Na", -21, 13]] },
  AcONa: { f: "CH₃COONa", shape: [["H", -20, 0], ["H", -15, -10], ["H", -15, 10], ["C", -8, 0], ["C", 8, 0], ["O", 16, -9], ["O", 16, 9], ["Na", 27, 14]] },
};
function comp(sp) {
  const s = SPECIES[sp];
  if (s.atoms) return s.atoms;
  const a = {};
  s.shape.forEach(([e]) => (a[e] = (a[e] || 0) + 1));
  return a;
}
function halfSize(sp) {
  const sh = SPECIES[sp].shape;
  return SC * Math.max(...sh.map(([e, x, y]) => Math.hypot(x, y) + RADIUS[e]));
}
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
// Place molecules in a region without overlap (keeps `avoid` discs clear); deterministic.
function scatter(list, reg, seed, avoid) {
  const rnd = seeded(seed), out = [], taken = (avoid || []).slice();
  list.forEach((sp) => {
    const r = halfSize(sp);
    let best = null, bestGap = -Infinity;
    for (let k = 0; k < 400; k++) {
      const x = reg[0] + r + rnd() * Math.max(0, reg[1] - reg[0] - 2 * r);
      const y = reg[2] + r + rnd() * Math.max(0, reg[3] - reg[2] - 2 * r);
      const gap = taken.reduce((g, q) => Math.min(g, Math.hypot(q[0] - x, q[1] - y) - q[2] - r), 1e9);
      if (gap > bestGap) { best = [x, y]; bestGap = gap; }
      if (gap > 10) break;
    }
    taken.push([best[0], best[1], r]);
    out.push([sp, best[0], best[1]]);
  });
  return out;
}
const rep = (sp, n) => Array(n).fill(sp);
const FULL = [32, 528, 56, 296], LIQ = [32, 528, 150, 296], TOP = [60, 500, 56, 140];
const occupied = (mols) => mols.map(([sp, x, y]) => [x, y, halfSize(sp)]);
function grid(sp, cx, cy, cols, rows, dx, dy, rowShift) {
  const out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    out.push([sp, cx + (c - (cols - 1) / 2) * dx + (r % 2 ? rowShift : 0), cy + (r - (rows - 1) / 2) * dy]);
  return out;
}
// Each card: hints the eye sees (b = bubbles, c = colour change, v = something vanishes), and a particle scene.
// liq: [liquid top before, liquid top after] (null = no liquid in the picture).
const CARDS = [
  { id: "ice", hints: [], liq: [null, 190], make() {
    return { before: grid("H2O", 280, 228, 4, 2, 72, 60, 20), after: scatter(rep("H2O", 8), [32, 528, 196, 296], 21) }; } },
  { id: "boil", hints: ["b"], liq: [150, null], make() {
    return { before: scatter(rep("H2O", 8), LIQ, 2), after: scatter(rep("H2O", 8), FULL, 3) }; } },
  { id: "sugar", hints: ["v"], liq: [116, 116], make() {
    const sb = [["SUC", 120, 166], ["SUC", 120, 254]], sa = [["SUC", 140, 190], ["SUC", 420, 250]];
    return { before: sb.concat(scatter(rep("H2O", 7), [210, 528, 136, 296], 4, occupied(sb))),
      after: sa.concat(scatter(rep("H2O", 7), [32, 528, 136, 296], 44, occupied(sa))) }; } },
  { id: "soda", hints: ["b"], liq: [150, 150], make() {
    const w = scatter(rep("H2O", 6), LIQ, 5), c = scatter(rep("CO2", 3), LIQ, 50, occupied(w));
    return { before: w.concat(c), after: w.concat(scatter(rep("CO2", 3), TOP, 6)) }; } },
  { id: "iodine", hints: ["c", "v"], liq: [null, null], make() {
    return { before: grid("I2", 280, 250, 3, 2, 70, 44, 0), after: scatter(rep("I2", 6), FULL, 7) }; } },
  { id: "stove", hints: [], liq: [null, null], make() {
    return { before: scatter(rep("CH4", 2).concat(rep("O2", 4)), FULL, 8), after: scatter(rep("CO2", 2).concat(rep("H2O", 4)), FULL, 9) }; } },
  { id: "rust", hints: ["c"], liq: [null, null], make() {
    const fe = [["Fe", 110, 236], ["Fe", 142, 236], ["Fe", 110, 268], ["Fe", 142, 268]];
    return { before: fe.concat(scatter(rep("O2", 3), [220, 528, 56, 296], 10)), after: [["Fe2O3", 110, 255], ["Fe2O3", 210, 255]] }; } },
  { id: "fizz", hints: ["b", "v"], liq: [150, 150], make() {
    const a = scatter(rep("AcONa", 2).concat(rep("H2O", 2)), LIQ, 12);
    return { before: scatter(rep("AcOH", 2).concat(rep("NaHCO3", 2)), LIQ, 11), after: a.concat(scatter(rep("CO2", 2), TOP, 13)) }; } },
  { id: "peroxide", hints: ["b"], liq: [150, 150], make() {
    const a = scatter(rep("H2O", 4), LIQ, 15);
    return { before: scatter(rep("H2O2", 4), LIQ, 14), after: a.concat(scatter(rep("O2", 2), TOP, 16)) }; } },
];
const HINTS = ["b", "c", "v"];
function count(mols) {
  const n = {};
  mols.forEach(([sp]) => (n[sp] = (n[sp] || 0) + 1));
  return n;
}
function atomTotals(mols) {
  const a = {};
  mols.forEach(([sp]) => { const c = comp(sp); for (const e in c) a[e] = (a[e] || 0) + c[e]; });
  return a;
}
// Verdict from the molecules alone: new substance <=> a kind of molecule appears that was not there before.
function analyse(scene) {
  const nb = count(scene.before), na = count(scene.after);
  const newKinds = Object.keys(na).filter((sp) => !(sp in nb));
  const gone = Object.keys(nb).filter((sp) => !(sp in na));
  const ab = atomTotals(scene.before), aa = atomTotals(scene.after);
  const els = ELS.filter((e) => e in ab || e in aa);
  const conserved = els.every((e) => (ab[e] || 0) === (aa[e] || 0));
  return { nb, na, newKinds, gone, ab, aa, els, conserved, chemical: newKinds.length > 0 };
}
// Atom paths: whole molecules of a kind that survives keep their atoms; the rest pair up element by element (nearest first).
function atomPaths(scene) {
  const flat = (mols) => {
    const out = [];
    mols.forEach(([sp, x, y], m) => SPECIES[sp].shape.forEach(([e, dx, dy], k) => out.push({ e, x: x + dx * SC, y: y + dy * SC, sp, m, k })));
    return out;
  };
  const A = flat(scene.before), B = flat(scene.after), paths = [], usedA = new Set(), usedB = new Set();
  const molsB = scene.after.map((q, i) => i), takenB = new Set();
  scene.before.forEach(([sp], mi) => {
    const mj = molsB.find((j) => !takenB.has(j) && scene.after[j][0] === sp);
    if (mj === undefined) return;
    takenB.add(mj);
    A.forEach((a, i) => { if (a.m !== mi) return;
      const j = B.findIndex((b) => b.m === mj && b.k === a.k);
      paths.push([a, B[j]]); usedA.add(i); usedB.add(j); });
  });
  const pairs = [];
  A.forEach((a, i) => { if (usedA.has(i)) return; B.forEach((b, j) => { if (!usedB.has(j) && b.e === a.e) pairs.push([Math.hypot(a.x - b.x, a.y - b.y), i, j]); }); });
  pairs.sort((p, q) => p[0] - q[0]);
  pairs.forEach(([, i, j]) => { if (usedA.has(i) || usedB.has(j)) return; usedA.add(i); usedB.add(j); paths.push([A[i], B[j]]); });
  return { paths, unmatched: A.length - usedA.size + B.length - usedB.size };
}
const ease = (t) => { t = Math.min(1, Math.max(0, Number.isFinite(t) ? t : 0)); return t * t * (3 - 2 * t); };
function frame(paths, t) {
  const e = ease(t);
  return paths.map(([a, b]) => ({ e: a.e, x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e }));
}
// Evidence ladder: for each clue, how many cards on each side show it.
function ladder() {
  const rows = HINTS.map((h) => ({ key: h, same: [], neu: [] }));
  const proof = { key: "m", same: [], neu: [] };
  CARDS.forEach((c) => {
    const A = analyse(c.scene), side = A.chemical ? "neu" : "same";
    rows.forEach((r) => r[side].push(c.hints.includes(r.key)));
    proof[side].push(A.newKinds.length > 0);
  });
  const all = rows.concat([proof]);
  all.forEach((r) => { r.inSame = r.same.filter(Boolean).length; r.inNew = r.neu.filter(Boolean).length;
    r.isProof = r.inSame === 0 && r.inNew === r.neu.length; });
  return all;
}
CARDS.forEach((c) => (c.scene = c.make()));
// CORE END

    colSame: "原物质", colNew: "新物质", rb: "冒泡", rc: "变色", rv: "东西不见了", rm: "生成新分子",
    proof: "证据", hint: "线索", rowLine: "{r}：没有新物质的 {ns} 张里有 {s} 张，有新物质的 {nn} 张里有 {n} 张。",
    resultTitle: "我们发现", resultMain: "化学变化 ⇔ 生成了新的分子",
    resultNote: "熔化、沸腾、溶解后还是原来的分子。冒泡、变色、东西不见了只是要去核实的线索，不是证据。原子一个也不少，化学变化里它们重新组合。",
    explainK: "说一说", explainQ: "朋友说：“糖在茶里不见了，所以溶解是化学变化。”你会拿什么证据说服他？",
    homeK: "家里做一做", homeQ: "把一小勺糖搅进少量水里，倒在小碟子上放几天。水干了以后剩下什么？再想想：醋倒在小苏打上以后，还能把小苏打变回来吗？",
    foot: "分子画成相互重叠的小球，不按比例；蔗糖（C₁₂H₂₂O₁₁）只画了两个环，原子数按完整化学式计算。图中的反应：CH₄ + 2 O₂ → CO₂ + 2 H₂O；4 Fe + 3 O₂ → 2 Fe₂O₃（真实铁锈含结晶水，生锈也需要水）；CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂（在水里部分以离子存在）；2 H₂O₂ → 2 H₂O + O₂（血液里的过氧化氢酶使它变快）。碘受热升华，碘蒸气呈紫色。CC BY 4.0 · Boxi Yu",
  },
});

const $ = (id) => document.getElementById(id);
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent);
const fig = $("fig"), tIn = $("t"), playBtn = $("play");
const byId = {};
CARDS.forEach((c) => { byId[c.id] = c; c.A = analyse(c.scene); c.P = atomPaths(c.scene).paths; });
const state = { step: 0, sel: "ice", t: 0, playing: false, answered: false, place: {}, last: null };
let raf = 0, t0 = 0;

function listMols(n) {
  return Object.keys(n).map((sp) => n[sp] + " " + SPECIES[sp].f + " (" + P.t("n_" + sp) + ")").join(" + ");
}
function atomLine(a, els) { return els.map((e) => e + " " + (a[e] || 0)).join(" · "); }

/* ---------- step 1: boiling pot + magnifier ---------- */
function drawPot() {
  fig.setAttribute("aria-label", P.t("figPot"));
  fig.innerHTML = "";
  S("rect", { class: "water", x: 60, y: 150, width: 220, height: 120 }, fig);
  S("path", { class: "pot", d: "M50,110 L50,280 L290,280 L290,110" }, fig);
  [[100, 240, 9], [140, 200, 13], [190, 245, 8], [230, 190, 11], [120, 170, 7], [250, 235, 10], [175, 160, 16]].forEach(([x, y, r]) =>
    S("circle", { class: "bub", cx: x, cy: y, r }, fig));
  for (let i = 0; i < 5; i++) {
    const x = 80 + i * 45;
    S("path", { class: "flame2", d: `M${x - 14},310 Q${x},266 ${x + 14},310 Z` }, fig);
    S("path", { class: "flame1", d: `M${x - 7},310 Q${x},286 ${x + 7},310 Z` }, fig);
  }
  const L = { x: 430, y: 150, r: 100 };
  S("line", { class: "lensline", x1: 191, y1: 160, x2: L.x - L.r, y2: L.y }, fig);
  S("circle", { class: "lens", cx: L.x, cy: L.y, r: L.r }, fig);
  S("text", { class: "lbl-m", x: L.x, y: 30, "text-anchor": "middle" }, fig).textContent = P.t("magLbl");
  if (!state.answered) {
    S("text", { class: "big", x: L.x, y: L.y + 22, "text-anchor": "middle" }, fig).textContent = "?";
  } else {
    [[L.x - 40, L.y - 45], [L.x + 45, L.y - 5], [L.x - 25, L.y + 50]].forEach(([x, y]) => molecule("H2O", x, y, fig, 2.2));
    S("text", { class: "lbl", x: L.x, y: L.y + L.r + 32, "text-anchor": "middle" }, fig).textContent = P.t("magAns");
  }
}
function molecule(sp, cx, cy, parent, k) {
  SPECIES[sp].shape.slice().sort((a, b) => RADIUS[a[0]] - RADIUS[b[0]]).forEach(([e, x, y]) =>
    S("circle", { class: "atom at-" + e, cx: cx + x * k, cy: cy + y * k, r: RADIUS[e] * k }, parent));
}

/* ---------- step 2: particle zoom + sorting ---------- */
function drawScene() {
  const c = byId[state.sel], e = ease(state.t);
  fig.setAttribute("aria-label", P.t("figScene", { name: P.t(c.id), pct: Math.round(state.t * 100) }));
  fig.innerHTML = "";
  S("rect", { class: "box", x: 20, y: 20, width: 520, height: 284, rx: 12 }, fig);
  const [lb, la] = c.liq;
  [[lb, 1 - e], [la, e]].forEach(([y, op]) => {
    if (y === null || op <= 0.001) return;
    S("rect", { class: "liquid", x: 21, y, width: 518, height: 303 - y, "fill-opacity": (0.18 * op).toFixed(3) }, fig);
  });
  frame(c.P, state.t).sort((a, b) => RADIUS[a.e] - RADIUS[b.e]).forEach((a) =>
    S("circle", { class: "atom at-" + a.e, cx: a.x.toFixed(1), cy: a.y.toFixed(1), r: RADIUS[a.e] * SC }, fig));
  S("text", { class: "lbl", x: 34, y: 48 }, fig).textContent = state.t < 0.5 ? P.t("before") : P.t("after");
  tIn.value = Math.round(state.t * 100);
  $("tVal").textContent = state.t < 0.02 ? P.t("tBefore") : state.t > 0.98 ? P.t("tAfter") : Math.round(state.t * 100) + "%";
  playBtn.textContent = state.playing ? P.t("pause") : P.t("play");
}
function buildLegend() {
  const c = byId[state.sel], els = c.A.els, box = $("legend");
  const col = { H: "var(--on-panel)", C: "var(--muted)", O: "var(--no)", Fe: "var(--b)", Na: "var(--hl)", I: "var(--h)" };
  box.innerHTML = els.map((e) => `<span><span class="dot" style="background:${col[e]}"></span>${P.t("e_" + e)}</span>`).join(" ");
}
function renderInfo() {
  const c = byId[state.sel], A = c.A, box = $("cardInfo");
  box.innerHTML = "";
  const add = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; n.textContent = text; box.appendChild(n); return n; };
  add("p", "cardname", P.t(c.id));
  add("p", "tal", P.t("sees", { s: P.t(c.id + "S") }));
  const tags = add("div", "tags", "");
  (c.hints.length ? c.hints.map((h) => ["tag", P.t("h" + h)]) : [["tag none", P.t("noHint")]]).forEach(([cls, txt]) => {
    const s = document.createElement("span"); s.className = cls; s.textContent = txt; tags.appendChild(s);
  });
  const line = (k, v) => { const p = add("p", "tal", ""); const b = document.createElement("b"); b.textContent = P.t(k) + ": "; p.append(b, v); };
  line("before", listMols(A.nb));
  line("after", listMols(A.na));
  line("atoms", atomLine(A.ab, A.els) + (A.conserved ? "  =  " : "  ≠  ") + atomLine(A.aa, A.els));
  if (state.place[c.id]) add("p", "tal", A.chemical ? P.t("vNew", { list: A.newKinds.map((s) => SPECIES[s].f).join(", ") }) : P.t("vSame"));
}
function chip(c) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (state.sel === c.id ? " sel" : "");
  const pl = state.place[c.id];
  if (pl) b.classList.add((pl === "new") === c.A.chemical ? "ok" : "bad");
  b.textContent = (pl && (pl === "new") !== c.A.chemical ? "✗ " : "") + P.t(c.id);
  b.dataset.id = c.id;
  b.setAttribute("aria-pressed", state.sel === c.id ? "true" : "false");
  b.addEventListener("click", () => { if (drag.suppress) return; select(c.id); });
  b.addEventListener("keydown", (e) => {
    const to = { ArrowLeft: "same", ArrowRight: "new", ArrowUp: null }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    select(c.id, true);
    place(c.id, to);
  });
  b.addEventListener("pointerdown", (e) => startDrag(e, c.id, b));
  return b;
}
function renderSorter(focusId) {
  const tray = $("tray"), bs = $("binSame"), bn = $("binNew");
  [tray, bs, bn].forEach((x) => (x.innerHTML = ""));
  CARDS.forEach((c) => {
    const pl = state.place[c.id];
    (pl === "same" ? bs : pl === "new" ? bn : tray).appendChild(chip(c));
  });
  if (focusId) { const f = document.querySelector(`.chip[data-id="${focusId}"]`); if (f) f.focus(); }
  renderStatus();
}
function score() {
  const placed = CARDS.filter((c) => state.place[c.id]);
  return { n: placed.length, c: placed.filter((c) => (state.place[c.id] === "new") === c.A.chemical).length, total: CARDS.length };
}
function renderStatus() {
  const st = $("status"), s = score();
  st.className = "status";
  if (s.c === s.total) { st.textContent = P.t("done", s); st.classList.add("win"); return; }
  let msg = "";
  if (state.last) {
    const c = byId[state.last], pl = state.place[c.id];
    if (pl) {
      const ok = (pl === "new") === c.A.chemical;
      msg = ok ? P.t(c.A.chemical ? "okNew" : "okSame", { name: P.t(c.id) }) : P.t(pl === "new" ? "badNew" : "badSame");
      if (!ok) st.classList.add("bad");
    }
  }
  st.textContent = (msg ? msg + " " : "") + P.t("progress", s);
}
function select(id, quiet) {
  state.sel = id;
  stopAnim();
  state.t = 0;
  buildLegend();
  renderInfo();
  document.querySelectorAll(".chip").forEach((b) => { const on = b.dataset.id === id; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  drawScene();
  const c = byId[id];
  if (!quiet) Play.live($("live"), P.t("liveCard", { name: P.t(id), b: listMols(c.A.nb), a: listMols(c.A.na) }));
  if (!Play.reduced) startAnim();
}
function place(id, bin) {
  state.place[id] = bin || undefined;
  if (!bin) delete state.place[id];
  state.last = id;
  renderSorter(id);
  renderInfo();
  Play.live($("live"), $("status").textContent);
}

/* drag: pointer events cover mouse, pen and touch */
const drag = { id: null, el: null, ghost: null, x0: 0, y0: 0, on: false, suppress: false };
function binAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return undefined;
  const b = el.closest(".bin");
  if (b) return b.dataset.bin;
  if (el.closest("#tray")) return null;
  return undefined;
}
function startDrag(e, id, el) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();          // no text selection while dragging with a mouse
  el.focus();
  Object.assign(drag, { id, el, x0: e.clientX, y0: e.clientY, on: false, suppress: false });
  try { el.setPointerCapture(e.pointerId); } catch (err) { /* old browsers */ }
  el.addEventListener("pointermove", moveDrag);
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", cancelDrag);
}
function moveDrag(e) {
  if (!drag.on && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) {
    drag.on = true;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.classList.add("ghost");
    document.body.appendChild(drag.ghost);
  }
  if (!drag.on) return;
  const g = drag.ghost;
  g.style.transform = `translate(${e.clientX - g.offsetWidth / 2}px, ${e.clientY - g.offsetHeight / 2}px)`;
  const b = binAt(e.clientX, e.clientY);
  document.querySelectorAll(".bin").forEach((x) => x.classList.toggle("over", x.dataset.bin === b));
}
function cleanupDrag() {
  if (drag.ghost) drag.ghost.remove();
  drag.ghost = null;
  document.querySelectorAll(".bin").forEach((x) => x.classList.remove("over"));
  if (drag.el) { drag.el.removeEventListener("pointermove", moveDrag); drag.el.removeEventListener("pointerup", endDrag); drag.el.removeEventListener("pointercancel", cancelDrag); }
}
function endDrag(e) {
  const was = drag.on, id = drag.id;
  cleanupDrag();
  if (!was) return;
  drag.suppress = true;
  setTimeout(() => (drag.suppress = false), 0);
  const b = binAt(e.clientX, e.clientY);
  if (b === undefined) return;
  if (state.sel !== id) select(id, true);
  place(id, b);
}
function cancelDrag() { cleanupDrag(); drag.on = false; }
document.querySelectorAll(".binhead").forEach((h) => h.addEventListener("click", () => place(state.sel, h.dataset.bin)));

/* animation (paused by default when prefers-reduced-motion) */
function tick(now) {
  if (!state.playing) return;
  state.t = Math.min(1, (now - t0) / 2400);
  drawScene();
  if (state.t >= 1) { state.playing = false; drawScene(); return; }
  raf = requestAnimationFrame(tick);
}
function startAnim() {
  if (state.t >= 1) state.t = 0;
  state.playing = true;
  t0 = performance.now() - state.t * 2400;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
  drawScene();
}
function stopAnim() { state.playing = false; cancelAnimationFrame(raf); }
playBtn.addEventListener("click", () => { if (state.playing) { stopAnim(); drawScene(); } else startAnim(); });
tIn.addEventListener("input", () => { stopAnim(); state.t = Play.clamp(+tIn.value / 100, 0, 1); drawScene(); });

/* ---------- step 3: evidence ladder ---------- */
function drawLadder() {
  fig.setAttribute("aria-label", P.t("figLadder"));
  fig.innerHTML = "";
  const rows = ladder(), x1 = 210, x2 = 370, d = 28, sz = 22;
  const ns = rows[0].same.length, nn = rows[0].neu.length;
  S("text", { class: "lbl", x: x1 + (ns * d - 6) / 2, y: 50, "text-anchor": "middle" }, fig).textContent = P.t("colSame");
  S("text", { class: "lbl", x: x2 + (nn * d - 6) / 2, y: 50, "text-anchor": "middle" }, fig).textContent = P.t("colNew");
  const label = { b: "rb", c: "rc", v: "rv", m: "rm" };
  const sameCards = CARDS.filter((c) => !c.A.chemical), newCards = CARDS.filter((c) => c.A.chemical);
  rows.forEach((r, i) => {
    const y = 100 + i * 58 + (r.key === "m" ? 20 : 0);
    if (r.key === "m") S("line", { class: "grid", x1: 20, x2: 540, y1: y - 38, y2: y - 38 }, fig);
    S("text", { class: "lbl", x: 20, y: y + 8 }, fig).textContent = P.t(label[r.key]);
    [[r.same, x1, sameCards], [r.neu, x2, newCards]].forEach(([arr, x0, cards]) => arr.forEach((on, j) => {
      const q = S("rect", { class: "sq" + (on ? " on" : ""), x: x0 + j * d, y: y - sz / 2 - 2, width: sz, height: sz, rx: 4 }, fig);
      S("title", {}, q).textContent = P.t(cards[j].id);
    }));
    S("text", { class: r.isProof ? "proof" : "hint", x: 540, y: y + 8, "text-anchor": "end" }, fig).textContent = P.t(r.isProof ? "proof" : "hint");
  });
  const box = $("cardInfo");
  box.innerHTML = "";
  rows.forEach((r) => {
    const p = document.createElement("p");
    p.className = "tal";
    p.textContent = P.t("rowLine", { r: P.t(label[r.key]), s: r.inSame, ns, n: r.inNew, nn });
    box.appendChild(p);
  });
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { state.answered = true; if (state.step === 0) drawPot(); });

function render() {
  const i = state.step;
  $("animCtl").hidden = i !== 1;
  $("sorter").hidden = i !== 1;
  $("keys").hidden = i !== 1;
  $("predict").hidden = i !== 0;
  $("status").hidden = i === 0;
  if (i !== 1) stopAnim();
  if (i === 0) { $("cardInfo").innerHTML = ""; drawPot(); }
  if (i === 1) { renderSorter(); select(state.sel, true); }
  if (i === 2) { drawLadder(); renderStatus(); }
}
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  state.step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  render();
});
$("reset").addEventListener("click", () => {
  stopAnim();
  Object.assign(state, { sel: "ice", t: 0, answered: false, place: {}, last: null });
  pr.reset();
  $("live").textContent = "";
  st.go(0);
});
</script>
</body>

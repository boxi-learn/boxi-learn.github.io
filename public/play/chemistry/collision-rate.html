    dataNote: "The model: {n} equal-mass discs in a 2D box, elastic collisions, and a gentle thermostat that now and then gives a random particle a new velocity at the set temperature. An A–B collision reacts when ½μu² ≥ Ea, where u is the approach speed along the line between the centres and μ is the reduced mass. In 2D the kinetic energy of a particle follows p(E) = e^(−E/RT)/RT (per mole), so the fraction above E is exactly e^(−E/RT); the chart uses that exact 2D formula. The same formula gives the fraction of collisions whose head-on energy is at least Ea, in 2D and in 3D (the textbook collision-theory result), which is why the measured fraction settles near it. At fixed concentration the collision frequency grows with the mean relative speed, ∝ √T. R = 8.314 J/(mol·K). The model uses Ea of 4–16 kJ/mol because most real reactions have 40–120 kJ/mol, where at 298 K only about {real} of collisions (Ea = {ea}) succeed, far too few to count in a small box. Each product pair is swapped at once for a fresh A and B with the same motion (it stays yellow for {life} model seconds so you can see it), so the supply stays steady, like a stirred flow reactor. “Twice as fast per 10 °C” is only a rule of thumb; it fits Ea ≈ 50 kJ/mol near room temperature. Sources: collision theory and the Arrhenius equation as in standard physical chemistry texts (e.g. Atkins, Physical Chemistry); IUPAC Gold Book, “activation energy”.",

    b1: "每个点是一个 A 或 B 颗粒。它们一直在互撞，但只有少数碰撞变成了产物（黄色闪光）。先选答案。",
    b1done: "从 298 K 到 308 K，颗粒只快了 {zc}%，所以碰撞也只多了 {zc}%。但对一个典型反应（Ea = {ea} kJ/mol），能量不低于 Ea 的碰撞占比变成了 ×{ff}。快一倍靠的是这个。",

const $ = (id) => document.getElementById(id);

// ---------- theory (energies in kJ/mol) ----------
const R = 8.314; // J/(mol·K)
const RT = (T) => (R * T) / 1000;
const frac = (ea, T) => Math.exp(-ea / RT(T)); // share with E ≥ Ea (2D energy; collision head-on energy in 2D and 3D)
const pE = (E, T) => Math.exp(-E / RT(T)) / RT(T); // 2D energy distribution, per kJ/mol
const collRatio = (t1, t2) => Math.sqrt(t2 / t1);
const REAL = { ea: 50, t1: 298, t2: 308, eb: 40 };
const CAT = 0.6; // catalyst multiplies the model's Ea
const CUT = 10; // 1 cm cube cut into 1 mm cubes: CUT³ pieces, each with 1/CUT² of a face area
const T_MIN = 250, T_MAX = 400, EA_MIN = 4, EA_MAX = 16, E_AX = 24;

// ---------- particle model (2D, equal masses m = 1, world units) ----------
const W = 300, H = 190, RAD = 6, V300 = 140, DT = 1 / 480, NU = 3, LIFE = 0.6;
const SIMPERKJ = (V300 * V300) / RT(300); // model energy per kJ/mol, so that kT = V300²·T/300
const sigmaV = (T) => V300 * Math.sqrt(T / 300);
let seed = 7;
const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
function gauss() { let u = 0; while (!u) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); }
const MAXN = 90;
const S = { n: 0, x: new Float64Array(MAXN), y: new Float64Array(MAXN), vx: new Float64Array(MAXN), vy: new Float64Array(MAXN),
  type: new Uint8Array(MAXN), orig: new Uint8Array(MAXN), life: new Float64Array(MAXN) };
const cnt = { coll: 0, succ: 0, time: 0, prod: 0 };
const flashes = [];
let T = 300, T1 = 300, ea = 8, cat = false, pairs = 30;
const eaEff = () => (cat ? ea * CAT : ea);

function init() {
  seed = 7;
  S.n = 2 * pairs;
  const s = sigmaV(T);
  for (let i = 0; i < S.n; i++) {
    let ok = false, tries = 0, x = 0, y = 0;
    while (!ok && tries++ < 400) {
      x = RAD + rand() * (W - 2 * RAD); y = RAD + rand() * (H - 2 * RAD); ok = true;
      for (let j = 0; j < i; j++) if ((S.x[j] - x) ** 2 + (S.y[j] - y) ** 2 < (2 * RAD + 1) ** 2) { ok = false; break; }
    }
    S.x[i] = x; S.y[i] = y; S.vx[i] = gauss() * s; S.vy[i] = gauss() * s;
    S.type[i] = S.orig[i] = i % 2; S.life[i] = 0;
  }
  flashes.length = 0; cnt.prod = 0; clearWindow();
}
function clearWindow() { cnt.coll = 0; cnt.succ = 0; cnt.time = 0; }
function setT(t) { // rescale velocities right away, the thermostat keeps it there
  const k = Math.sqrt(t / T);
  for (let i = 0; i < S.n; i++) { S.vx[i] *= k; S.vy[i] *= k; }
  T = t;
}
function step() {
  const { n, x, y, vx, vy, type, orig, life } = S, s = sigmaV(T), d2 = 4 * RAD * RAD, eaS = eaEff() * SIMPERKJ;
  for (let i = 0; i < n; i++) {
    x[i] += vx[i] * DT; y[i] += vy[i] * DT;
    if (x[i] < RAD) { x[i] = 2 * RAD - x[i]; vx[i] = Math.abs(vx[i]); } else if (x[i] > W - RAD) { x[i] = 2 * (W - RAD) - x[i]; vx[i] = -Math.abs(vx[i]); }
    if (y[i] < RAD) { y[i] = 2 * RAD - y[i]; vy[i] = Math.abs(vy[i]); } else if (y[i] > H - RAD) { y[i] = 2 * (H - RAD) - y[i]; vy[i] = -Math.abs(vy[i]); }
    if (rand() < NU * DT) { vx[i] = gauss() * s; vy[i] = gauss() * s; }
    if (type[i] === 2 && (life[i] -= DT) <= 0) type[i] = orig[i];
  }
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const dx = x[i] - x[j], dy = y[i] - y[j], r2 = dx * dx + dy * dy;
    if (r2 >= d2 || r2 === 0) continue;
    const r = Math.sqrt(r2), nx = dx / r, ny = dy / r, vn = (vx[i] - vx[j]) * nx + (vy[i] - vy[j]) * ny;
    const push = (2 * RAD - r) / 2;
    x[i] += nx * push; y[i] += ny * push; x[j] -= nx * push; y[j] -= ny * push;
    if (vn >= 0) continue; // already moving apart
    vx[i] -= vn * nx; vy[i] -= vn * ny; vx[j] += vn * nx; vy[j] += vn * ny; // equal masses: swap normal parts
    if (orig[i] + orig[j] === 1) { // an A meets a B (a just-made pair already counts as fresh A and B)
      cnt.coll++;
      if ((vn * vn) / 4 >= eaS) { // ½·μ·u² with μ = ½
        cnt.succ++; cnt.prod++;
        type[i] = type[j] = 2; life[i] = life[j] = LIFE;
        if (flashes.length < 24) flashes.push({ x: (x[i] + x[j]) / 2, y: (y[i] + y[j]) / 2, t: 0.5 });
      }
    }
  }
  for (let k = flashes.length - 1; k >= 0; k--) if ((flashes[k].t -= DT) <= 0) flashes.splice(k, 1);
  cnt.time += DT;
}

// ---------- drawing the box ----------
const cv = $("sim"), ctx = cv.getContext("2d");
let col = {}, view = { s: 1, ox: 0, oy: 0, w: 0, h: 0 };
function readColors() {
  const cs = getComputedStyle(document.body);
  ["--c", "--b", "--hl", "--muted", "--soft"].forEach((k) => (col[k] = cs.getPropertyValue(k).trim() || "#888"));
}
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (!r.width) return;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const top = 34, pad = 8, s = Math.min((r.width - 2 * pad) / W, (r.height - top - pad) / H);
  view = { s, ox: (r.width - W * s) / 2, oy: top + (r.height - top - pad - H * s) / 2, w: r.width, h: r.height };
}
function draw() {
  const { s, ox, oy } = view;
  ctx.clearRect(0, 0, view.w, view.h);
  ctx.fillStyle = col["--soft"]; ctx.fillRect(ox, oy, W * s, H * s);
  ctx.strokeStyle = col["--muted"]; ctx.lineWidth = 1.5; ctx.strokeRect(ox, oy, W * s, H * s);
  for (const f of flashes) {
    ctx.globalAlpha = f.t / 0.5; ctx.strokeStyle = col["--hl"]; ctx.lineWidth = 3; ctx.beginPath();
    ctx.arc(ox + f.x * s, oy + f.y * s, RAD * (1.2 + 2.8 * (1 - f.t / 0.5)) * s, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  [["--c", 0], ["--b", 1], ["--hl", 2]].forEach(([c, ty]) => {
    ctx.fillStyle = col[c]; ctx.beginPath();
    for (let i = 0; i < S.n; i++) if (S.type[i] === ty) { const X = ox + S.x[i] * s, Y = oy + S.y[i] * s; ctx.moveTo(X + RAD * s, Y); ctx.arc(X, Y, RAD * s, 0, 2 * Math.PI); }
    ctx.fill();
  });
}

// ---------- formatting ----------
const pct = (f) => (f >= 0.1 ? Play.fmt(f * 100, 0) : f >= 0.01 ? Play.fmt(f * 100, 1) : Play.fmt(f * 100, 2)) + "%";
const sup = (n) => String(n).replace(/-/g, "⁻").replace(/\d/g, (d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
function sci(f) { // 1.7 × 10⁻⁹
  if (!(f > 0)) return "0";
  const e = Math.floor(Math.log10(f));
  return Play.fmt(f / 10 ** e, 1) + " × 10" + sup(e);
}
const x2 = (r) => (r < 1.1 ? Play.fmt(r, 3) : r < 10 ? Play.fmt(r, 2) : Play.fmt(r, 0));
const fmtEa = (e) => Play.fmt(e, Number.isInteger(e) ? 0 : 1);

// ---------- chart: 2D energy distribution at T₁ and T ----------
const svg = $("chart"), CH = 230, CY0 = 188, CY1 = 60, CX0 = 44;
let CX1 = 580, knob;
const cx = (E) => CX0 + (E / E_AX) * (CX1 - CX0);
const PMAX = 0.15; // per kJ/mol; the curves start higher (up to 1/RT) and are clipped so the tails are visible
const cy = (p) => CY0 - (p / PMAX) * (CY0 - CY1);
function curve(t, from) { const pts = []; for (let k = 0; k <= 60; k++) { const E = from + ((E_AX - from) * k) / 60; pts.push([cx(E), cy(pE(E, t))]); } return pts; }
function drawChart() {
  const w = Math.round(svg.getBoundingClientRect().width) || 600;
  CX1 = w - 16;
  svg.setAttribute("viewBox", `0 0 ${w} ${CH}`);
  svg.innerHTML = "";
  const clip = Play.svg("clipPath", { id: "plotclip" }, Play.svg("defs", {}, svg));
  Play.svg("rect", { x: 0, y: CY1, width: w, height: CY0 - CY1 + 1 }, clip);
  const g = Play.svg("g", {}, svg), gp = Play.svg("g", { "clip-path": "url(#plotclip)" }, g), narrow = w < 460;
  const e = eaEff();
  const shade = (t, fill, op) => {
    const pts = curve(t, e);
    Play.svg("polygon", { points: [[cx(e), CY0], ...pts, [cx(E_AX), CY0]].map((p) => p.join(",")).join(" "), fill, opacity: op }, gp);
  };
  shade(T1, "var(--c)", 0.28); shade(T, "var(--a)", 0.38);
  Play.svg("line", { x1: CX0, x2: CX1, y1: CY0, y2: CY0, stroke: "var(--muted)" }, g);
  for (let E = 0; E <= E_AX; E += narrow ? 8 : 4) {
    Play.svg("line", { x1: cx(E), x2: cx(E), y1: CY0, y2: CY0 + 4, stroke: "var(--muted)" }, g);
    Play.svg("text", { x: cx(E), y: CY0 + 18, "text-anchor": "middle", "font-size": 13 }, g).textContent = E;
  }
  Play.svg("text", { x: CX1, y: CY0 + 36, "text-anchor": "end", "font-size": 13 }, g).textContent = P.t("axE");
  Play.svg("text", { x: 6, y: 16, "font-size": 13 }, g).textContent = P.t("axP") + " ↑";
  Play.svg("text", { x: CX0 + 4, y: CY1 - 8, "font-size": 13 }, g).textContent = "↑ " + P.t("axClip");
  const line = (t, stroke, dash) => Play.svg("polyline", { points: curve(t, 0).map((p) => p.join(",")).join(" "), fill: "none", stroke, "stroke-width": 2.5, "stroke-dasharray": dash || "" }, gp);
  line(T1, "var(--c)", "6 4"); line(T, "var(--a)");
  // legend with the computed shares
  const lx = CX1 - 150, lab = (y, color, dash, txt) => {
    Play.svg("line", { x1: lx, x2: lx + 22, y1: y - 4, y2: y - 4, stroke: color, "stroke-width": 2.5, "stroke-dasharray": dash }, g);
    Play.svg("text", { x: lx + 28, y, "font-size": 13, class: "fg" }, g).textContent = txt;
  };
  lab(22, "var(--c)", "6 4", `T₁ ${T1} K: ${pct(frac(e, T1))}`);
  lab(42, "var(--a)", "", `T ${T} K: ${pct(frac(e, T))}`);
  if (cat) {
    Play.svg("line", { x1: cx(ea), x2: cx(ea), y1: CY0, y2: CY1 + 20, stroke: "var(--muted)", "stroke-dasharray": "3 3" }, g);
    Play.svg("text", { x: cx(ea) + 4, y: CY1 + 32, "font-size": 13 }, g).textContent = P.t("eaChart") + " " + fmtEa(ea);
  }
  knob = Play.svg("g", { class: "knob", tabindex: 0, role: "slider", "aria-label": P.t("knobAria"), "aria-valuemin": EA_MIN, "aria-valuemax": EA_MAX, "aria-valuenow": ea, "aria-valuetext": P.t("knobVal", { ea: fmtEa(ea) }) }, svg);
  Play.svg("line", { x1: cx(e), x2: cx(e), y1: CY0, y2: CY1 - 2, stroke: "var(--fg)", "stroke-width": 2 }, knob);
  Play.svg("rect", { x: cx(e) - 7, y: CY0 - 64, width: 14, height: 30, rx: 5, fill: "var(--surface)", stroke: "var(--fg)", "stroke-width": 2 }, knob);
  const tx = Play.svg("text", { x: cx(e) + 6, y: CY1 + 12, "font-size": 13, class: "fg" }, knob);
  tx.textContent = (cat ? P.t("eaCat") : P.t("eaChart")) + " = " + fmtEa(e) + " kJ/mol";
  let len = 0; try { len = tx.getComputedTextLength(); } catch (err) { len = 0; }
  if (cx(e) - 6 - len >= 2 && (cat || cx(e) + 6 + len > w - 2)) { tx.setAttribute("x", cx(e) - 6); tx.setAttribute("text-anchor", "end"); }
  else if (cx(e) + 6 + len > w - 2) { tx.setAttribute("x", w - 2); tx.setAttribute("y", CY1 + 30); tx.setAttribute("text-anchor", "end"); }
  knob.addEventListener("keydown", (ev) => {
    const d = { ArrowRight: 0.5, ArrowUp: 0.5, ArrowLeft: -0.5, ArrowDown: -0.5, PageUp: 2, PageDown: -2 }[ev.key];
    if (d !== undefined) { setEa(ea + d); ev.preventDefault(); keepFocus(); }
    if (ev.key === "Home") { setEa(EA_MIN); ev.preventDefault(); keepFocus(); }
    if (ev.key === "End") { setEa(EA_MAX); ev.preventDefault(); keepFocus(); }
  });
}
function keepFocus() { knob.focus(); }
let dragging = false;
const eaFromEvt = (ev) => (((Play.pointer(svg, ev).x - CX0) / (CX1 - CX0)) * E_AX) / (cat ? CAT : 1);
svg.addEventListener("pointerdown", (ev) => { dragging = true; svg.setPointerCapture(ev.pointerId); setEa(eaFromEvt(ev)); keepFocus(); ev.preventDefault(); });
svg.addEventListener("pointermove", (ev) => { if (dragging) { setEa(eaFromEvt(ev)); keepFocus(); } });
["pointerup", "pointercancel"].forEach((nm) => svg.addEventListener(nm, () => (dragging = false)));

// ---------- settings ----------
const tempEl = $("temp"), eaEl = $("ea");
function setEa(v) {
  const nv = Math.round(Play.clamp(v, EA_MIN, EA_MAX) * 2) / 2;
  if (nv === ea && eaEl.value == nv) return;
  ea = nv; eaEl.value = ea; clearWindow(); refresh();
}
tempEl.addEventListener("input", () => { setT(+tempEl.value); clearWindow(); refresh(); });
eaEl.addEventListener("input", () => setEa(+eaEl.value));
$("cat").addEventListener("change", (ev) => { cat = ev.target.checked; clearWindow(); refresh(); });
document.querySelectorAll("[data-conc]").forEach((b) => b.addEventListener("click", () => { pairs = +b.dataset.conc; init(); refresh(); if (paused) draw(); }));

// ---------- text ----------
const extra = $("extra"), live = $("live");
const el = (tag, html, cls) => { const e = document.createElement(tag); if (html != null) e.innerHTML = html; if (cls) e.className = cls; return e; };
let cur = 0, answered = false, statEls = null;
const realZ = collRatio(REAL.t1, REAL.t2), realF = frac(REAL.ea, REAL.t2) / frac(REAL.ea, REAL.t1);
const zcPct = Play.fmt((realZ - 1) * 100, 1);
function measured() {
  const c = cnt.coll, f = c ? cnt.succ / c : NaN, err = c ? Math.sqrt(Math.max(cnt.succ, 1)) / c : NaN;
  return { cps: cnt.time > 0.05 ? c / cnt.time : NaN, f, err, rps: cnt.time > 0.05 ? cnt.succ / cnt.time : NaN };
}
function buildStats() {
  const box = el("div", null, "stats");
  const row = (k) => { const v = el("span", "", "v"); box.append(el("span", P.t(k)), v); return v; };
  statEls = { coll: row("stColl"), frac: row("stFrac"), theo: row("stTheo"), rate: row("stRate"), prod: row("stProd"), win: row("stWin") };
  return box;
}
function updStats() {
  if (!statEls || !statEls.coll.isConnected) return;
  const m = measured();
  statEls.coll.textContent = Play.fmt(m.cps, 1);
  statEls.frac.innerHTML = Number.isFinite(m.f) ? pct(m.f) + " <small>" + P.t("pmV", { e: pct(m.err) }) + "</small>" : "—";
  statEls.theo.textContent = pct(frac(eaEff(), T));
  statEls.rate.textContent = Play.fmt(m.rps, 2);
  statEls.prod.textContent = cnt.prod;
  statEls.win.textContent = P.t("winV", { s: Play.fmt(cnt.time, 0) });
  if (cur > 0) Play.live(live, P.t("live2", { t: T, ea: fmtEa(eaEff()), c: Play.fmt(m.cps, 0), f: Number.isFinite(m.f) ? pct(m.f) : "—", r: Play.fmt(m.rps, 1) }));
}
function ratioBox() {
  const e = eaEff(), z = collRatio(T1, T), f = frac(e, T) / frac(e, T1), r = z * f, mx = Math.max(z, f, r, 1);
  const box = el("div", null, "ratio"), hd = el("div", null, "hd");
  hd.append(el("span", P.t("ratioH", { t1: T1, t: T })));
  const b = el("button", P.t("setT1"), "small"); b.type = "button";
  b.addEventListener("click", () => { T1 = T; refresh(); });
  hd.append(b); box.append(hd);
  [[P.t("rColl"), z], [P.t("rFrac", { f1: pct(frac(e, T1)), f2: pct(frac(e, T)) }), f], [P.t("rRate"), r]].forEach(([lb, v]) => {
    const row = el("div", null, "row"), bar = el("div", null, "bar"), i = el("i");
    i.style.width = Play.clamp((v / mx) * 100, 1, 100) + "%"; bar.append(i);
    row.append(el("span", lb, "lb"), bar, el("span", "×" + x2(v), "x"));
    box.append(row);
  });
  return box;
}
function text() {
  extra.innerHTML = "";
  $("vtitle").textContent = T + " K · Ea " + fmtEa(eaEff()) + " kJ/mol";
  $("tVal").textContent = T + " K";
  $("eaVal").textContent = fmtEa(ea) + " kJ/mol";
  document.querySelectorAll("[data-conc]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.conc === pairs ? "true" : "false"));
  $("vtag").textContent = P.t("vtag", { n: S.n });
  if (cur === 0) {
    $("stepBody").textContent = answered ? P.t("b1done", { zc: zcPct, ea: REAL.ea, ff: x2(realF) }) : P.t("b1");
    Play.live(live, P.t("live1", { t: T, f: pct(frac(eaEff(), T)), ea: fmtEa(eaEff()) }));
  } else if (cur === 1) {
    $("stepBody").textContent = P.t("b2");
    extra.append(buildStats(), ratioBox());
    updStats();
  } else {
    $("stepBody").textContent = P.t("rule"); $("stepBody").className = "rule";
    extra.append(el("p", P.t("real", { ea: REAL.ea, z: x2(realZ), f: x2(realF), r: x2(realZ * realF) })));
    extra.append(el("p", "<strong>" + P.t("waysH") + "</strong>"));
    const ul = el("ul", null, "ways");
    const fc0 = frac(ea, T), fc1 = frac(ea * CAT, T), rc = frac(REAL.eb, REAL.t1) / frac(REAL.ea, REAL.t1);
    ul.append(el("li", P.t("wConc")), el("li", P.t("wArea", { a: Play.fmt(CUT ** 3 / CUT ** 2, 0) })),
      el("li", P.t("wCat", { f1: pct(fc0), f2: pct(fc1), x: x2(fc1 / fc0), ea: REAL.ea, eb: REAL.eb, rc: x2(rc) })));
    extra.append(ul, buildStats());
    updStats();
  }
  if (cur !== 2) $("stepBody").className = "";
}
function refresh() { text(); drawChart(); }

// ---------- loop ----------
let paused = Play.reduced, fast = false, raf = 0, last = 0, visible = true, acc = 0, lastStat = 0;
function tick(now) {
  raf = 0;
  if (paused || !visible || document.hidden) return;
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
  last = now;
  acc += dt * (fast ? 5 : 1);
  let k = 0;
  while (acc >= DT && k++ < 160) { step(); acc -= DT; }
  if (acc > DT) acc = 0;
  draw();
  if (now - lastStat > 300) { lastStat = now; updStats(); }
  raf = requestAnimationFrame(tick);
}
function wake() { if (!raf && !paused && visible && !document.hidden) { last = 0; raf = requestAnimationFrame(tick); } }
if ("IntersectionObserver" in window) new IntersectionObserver((es) => { visible = es[0].isIntersecting; wake(); }).observe(cv);
document.addEventListener("visibilitychange", wake);
const pauseBtn = $("pause"), fastBtn = $("fast");
function setPause(p) {
  paused = p;
  pauseBtn.textContent = P.t(p ? "play" : "pause"); pauseBtn.setAttribute("aria-pressed", p ? "true" : "false");
  if (!p) wake(); else updStats();
}
pauseBtn.addEventListener("click", () => setPause(!paused));
fastBtn.addEventListener("click", () => { fast = !fast; fastBtn.setAttribute("aria-pressed", fast ? "true" : "false"); });
$("catLabel").textContent = P.t("catLabel", { f: CAT });

const pr = Play.predict($("predict"), {
  q: P.t("q", { zc: zcPct }),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right"), wrong: P.t("wrong", { zc: zcPct }),
}, () => { answered = true; text(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  cur = i;
  $("kicker").textContent = P.t("k" + (i + 1)); $("stepTitle").textContent = P.t("t" + (i + 1));
  $("predict").hidden = i !== 0;
  $("cT").hidden = i === 0; $("c3").hidden = i !== 2;
  resize(); refresh(); draw(); wake();
});

function start() {
  T = 300; T1 = 300; ea = 8; cat = false; pairs = 30; answered = false; fast = false;
  tempEl.value = T; eaEl.value = ea; $("cat").checked = false; fastBtn.setAttribute("aria-pressed", "false");
  init();
}
$("reset").addEventListener("click", () => { pr.reset(); start(); setPause(Play.reduced); st.go(0); });
window.addEventListener("resize", () => { resize(); draw(); drawChart(); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });

$("resultNote").textContent = P.t("resultNote", { ea: REAL.ea, z: x2(realZ), f: x2(realF) });
$("data").textContent = P.t("dataNote", { n: 2 * pairs, real: sci(frac(REAL.ea, 298)), ea: REAL.ea, life: LIFE });
readColors(); start(); setPause(paused); resize(); refresh(); draw();
</script>
</body>
</html>

<script>
// CORE START — pure model, no DOM (checked in node)
const N0 = 200, MAXN = 360, COLS = 30, SEED = 20261019;
const TAGS = [21, 74, 128, 177];        // slots of the tagged particles
const AVG = 25, KEEP = 400, WIN = 150;  // averaging window, history kept, steps shown
function rng(seed) {                    // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const k01 = (k) => (Number.isFinite(k) ? Math.min(1, Math.max(0, k)) : 0);
function counts(sim) {
  let a = 0, b = 0;
  for (const p of sim.slots) if (p) { if (p.s) b++; else a++; }
  return { a, b };
}
function record(sim, f, r, mark) {
  const c = counts(sim), tags = TAGS.map(() => 0);
  sim.slots.forEach((p) => { if (p && p.tag >= 0) tags[p.tag] = p.s; });
  sim.hist.push({ t: sim.t, a: c.a, b: c.b, da: sim.det.a, db: sim.det.b, f, r, mark: !!mark, tags });
  if (sim.hist.length > KEEP) sim.hist.shift();
}
function makeSim(seed) {
  const sim = { rnd: rng(seed), slots: new Array(MAXN).fill(null), det: { a: N0, b: 0 }, hist: [], t: 0, flips: TAGS.map(() => 0) };
  for (let i = 0; i < N0; i++) sim.slots[i] = { s: 0, tag: -1, hit: false };
  TAGS.forEach((k, j) => (sim.slots[k].tag = j));
  record(sim, null, null);
  return sim;
}
// One time step: every A turns to B with probability kf, every B to A with probability kr.
function step(sim, kf, kr) {
  kf = k01(kf); kr = k01(kr);
  let f = 0, r = 0;
  for (const p of sim.slots) {
    if (!p) continue;
    const u = sim.rnd();
    p.hit = false;
    if (p.s === 0) { if (u < kf) { p.s = 1; f++; p.hit = true; } }
    else if (u < kr) { p.s = 0; r++; p.hit = true; }
    if (p.hit && p.tag >= 0) sim.flips[p.tag]++;
  }
  const a = sim.det.a, b = sim.det.b;           // expected values
  sim.det.a = a - kf * a + kr * b;
  sim.det.b = b + kf * a - kr * b;
  sim.t++;
  record(sim, f, r);
  return { f, r };
}
function addA(sim, n) {
  let added = 0;
  for (let i = 0; i < MAXN && added < n; i++) if (!sim.slots[i]) { sim.slots[i] = { s: 0, tag: -1, hit: false }; added++; }
  sim.slots.forEach((p) => p && (p.hit = false));
  sim.det.a += added;
  record(sim, null, null, true);
  return added;
}
function removeHalfB(sim) {
  const nB = counts(sim).b, want = Math.floor(nB / 2);
  const pool = [];
  sim.slots.forEach((p, i) => { if (p && p.s === 1 && p.tag < 0) pool.push(i); });   // tagged ones stay
  const n = Math.min(want, pool.length);
  for (let i = 0; i < n; i++) {                   // partial Fisher–Yates with the same seeded RNG
    const j = i + Math.floor(sim.rnd() * (pool.length - i));
    [pool[i], pool[j]] = [pool[j], pool[i]];
    sim.slots[pool[i]] = null;
  }
  sim.slots.forEach((p) => p && (p.hit = false));
  sim.det.b = Math.max(0, sim.det.b - n);
  record(sim, null, null, true);
  return n;
}
function stats(sim) {
  const steps = sim.hist.filter((e) => e.f !== null).slice(-AVG);
  const last = sim.hist[sim.hist.length - 1];
  const out = { a: last.a, b: last.b, f: null, r: null, avgF: null, avgR: null, ratio: null, n: steps.length };
  if (!steps.length) return out;
  const L = steps[steps.length - 1];
  out.f = L.f; out.r = L.r;
  const mean = (k) => steps.reduce((s, e) => s + e[k], 0) / steps.length;
  out.avgF = mean("f"); out.avgR = mean("r");
  const ma = mean("a"), mb = mean("b");
  out.ratio = ma > 0 ? mb / ma : (mb > 0 ? Infinity : null);
  return out;
}
// Equilibrium ratio B/A predicted by equal rates kf·A = kr·B.
function eqRatio(kf, kr) {
  kf = k01(kf); kr = k01(kr);
  if (kf === 0 && kr === 0) return null;
  return kr === 0 ? Infinity : kf / kr;
}
function eqB(N, kf, kr) {
  kf = k01(kf); kr = k01(kr);
  return kf + kr > 0 ? N * kf / (kf + kr) : null;
}
// Where the system is heading, judged from the expected (smooth) amounts.
function trend(sim, kf, kr) {
  kf = k01(kf); kr = k01(kr);
  if (kf === 0 && kr === 0) return "none";
  const fx = kf * sim.det.a, rx = kr * sim.det.b, d = fx - rx;
  if (Math.abs(d) <= 0.06 * (fx + rx) + 0.05) return kr === 0 ? "allB" : kf === 0 ? "allA" : "eq";
  return d > 0 ? "toB" : "toA";
}
// CORE END

const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent);
const kfEl = $("kf"), krEl = $("kr");
const state = { playing: false, tag: false, stepIdx: 0 };
let sim = makeSim(SEED);
const kf = () => k01(+kfEl.value), kr = () => k01(+krEl.value);
const f2 = (x) => (x === Infinity ? P.t("inf") : x === null ? P.t("none") : Play.fmt(x, 2));
const f1 = (x) => (x === null ? P.t("none") : Play.fmt(x, 1));

/* ---------- static SVG skeleton ---------- */
const SP = 17.6, GX = 280 - (COLS - 1) * SP / 2, GY = 50;
const CH = { x0: 52, x1: 545, top: 424, bot: 522 }, EV = { x0: 52, x1: 545, top: 572, bot: 646 };
const TG = { y: 282, h: 22, x0: 46, x1: 488 };
const gHead = S("g", {}, fig), gDots = S("g", {}, fig), gTags = S("g", {}, fig), gCh = S("g", {}, fig), gEv = S("g", {}, fig);
const dots = [];
for (let i = 0; i < MAXN; i++) {
  const c = S("circle", { cx: GX + (i % COLS) * SP, cy: GY + Math.floor(i / COLS) * SP, r: 6.2 }, gDots);
  dots.push(c);
}

function txt(cls, x, y, s, anchor, parent) {
  const t = S("text", { class: cls, x, y, "text-anchor": anchor || "start" }, parent);
  t.textContent = s;
  return t;
}

function drawHead(st) {
  gHead.innerHTML = "";
  const t1 = S("text", { class: "num", x: 12, y: 28 }, gHead);
  const a = S("tspan", { style: "fill:var(--c)" }, t1); a.textContent = "A " + st.a;
  const sp = S("tspan", {}, t1); sp.textContent = "   ";
  const b = S("tspan", { style: "fill:var(--b)" }, t1); b.textContent = "B " + st.b;
  txt("lbl-m", 548, 28, P.t("hStep", { t: sim.t }), "end", gHead);
}

function drawDots() {
  sim.slots.forEach((p, i) => {
    const c = dots[i];
    if (!p) { c.setAttribute("visibility", "hidden"); return; }
    c.setAttribute("visibility", "visible");
    const tagged = state.tag && p.tag >= 0;
    c.setAttribute("class", (p.s ? "pB" : "pA") + (tagged ? " tagged" : p.hit ? " hit" : ""));
    c.setAttribute("r", tagged ? 8.2 : 6.2);
  });
  // tagged particles on top
  if (state.tag) TAGS.forEach((k) => gDots.appendChild(dots[k]));
}

function drawTags() {
  gTags.innerHTML = "";
  if (state.stepIdx === 0) return;               // the tag switch appears in step 2
  txt("lbl", 12, TG.y - 8, P.t("hTags"), "start", gTags);
  if (!state.tag) { txt("lbl-m", 12, TG.y + 46, P.t("tagOff"), "start", gTags); return; }
  const H = sim.hist.filter((e) => !e.mark).slice(-60);
  const cw = (TG.x1 - TG.x0) / 60;
  TAGS.forEach((k, j) => {
    const y = TG.y + j * TG.h;
    txt("num", 12, y + 17, String(j + 1), "start", gTags);
    H.forEach((e, i) => S("rect", { class: e.tags[j] ? "cellB" : "cellA", x: TG.x0 + i * cw, y: y + 2, width: cw + 0.3, height: TG.h - 6 }, gTags));
    txt("num", 548, y + 17, P.t("flips", { n: sim.flips[j] }), "end", gTags);
  });
}

function lineD(pts) {
  return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
}

function drawCharts() {
  gCh.innerHTML = ""; gEv.innerHTML = "";
  const H = sim.hist, tmax = H[H.length - 1].t, tmin = Math.max(0, tmax - WIN);
  const win = H.filter((e) => e.t >= tmin);
  const X = (t, R) => R.x0 + (t - tmin) / WIN * (R.x1 - R.x0);
  // amounts
  let ym = 200;
  win.forEach((e) => (ym = Math.max(ym, e.a, e.b, e.da, e.db)));
  ym = Math.ceil(ym / 50) * 50;
  const Y = (v) => CH.bot - v / ym * (CH.bot - CH.top);
  txt("lbl", 12, CH.top - 26, P.t("hAmounts"), "start", gCh);
  S("line", { class: "axis", x1: CH.x0, x2: CH.x1, y1: CH.bot, y2: CH.bot }, gCh);
  S("line", { class: "grid", x1: CH.x0, x2: CH.x1, y1: CH.top, y2: CH.top }, gCh);
  txt("lbl-m", CH.x0 - 6, CH.bot + 6, "0", "end", gCh);
  txt("lbl-m", CH.x0 - 6, CH.top + 6, String(ym), "end", gCh);
  win.forEach((e) => { if (e.mark) S("line", { class: "mark", x1: X(e.t, CH), x2: X(e.t, CH), y1: CH.top, y2: EV.bot }, gCh); });
  [["dA", "da"], ["dB", "db"], ["lA", "a"], ["lB", "b"]].forEach(([cls, k]) =>
    S("path", { class: cls, d: lineD(win.map((e) => [X(e.t, CH), Y(e[k])])) }, gCh));
  // events per step
  const ev = win.filter((e) => e.f !== null);
  const allSteps = H.filter((e) => e.f !== null);
  const avg = (e, k) => {
    const i = allSteps.indexOf(e), w = allSteps.slice(Math.max(0, i - AVG + 1), i + 1);
    return w.reduce((s, q) => s + q[k], 0) / w.length;
  };
  let em = 10;
  ev.forEach((e) => (em = Math.max(em, e.f, e.r)));
  em = Math.ceil(em / 5) * 5;
  const YE = (v) => EV.bot - v / em * (EV.bot - EV.top);
  txt("lbl", 12, EV.top - 26, P.t("hEvents", { n: AVG }), "start", gEv);
  S("line", { class: "axis", x1: EV.x0, x2: EV.x1, y1: EV.bot, y2: EV.bot }, gEv);
  S("line", { class: "grid", x1: EV.x0, x2: EV.x1, y1: EV.top, y2: EV.top }, gEv);
  txt("lbl-m", EV.x0 - 6, EV.bot + 6, "0", "end", gEv);
  txt("lbl-m", EV.x0 - 6, EV.top + 6, String(em), "end", gEv);
  if (ev.length > 1) {
    S("path", { class: "rawF", d: lineD(ev.map((e) => [X(e.t, EV), YE(e.f)])) }, gEv);
    S("path", { class: "rawR", d: lineD(ev.map((e) => [X(e.t, EV), YE(e.r)])) }, gEv);
    S("path", { class: "lF", d: lineD(ev.map((e) => [X(e.t, EV), YE(avg(e, "f"))])) }, gEv);
    S("path", { class: "lR", d: lineD(ev.map((e) => [X(e.t, EV), YE(avg(e, "r"))])) }, gEv);
  }
}

function renderStats(st) {
  const box = $("statsBox");
  box.innerHTML = "";
  if (state.stepIdx === 0) return;
  const tb = document.createElement("table");
  tb.className = "stats";
  const row = (cells, tag) => {
    const tr = document.createElement("tr");
    cells.forEach((c) => { const td = document.createElement(tag); td.textContent = c; tr.appendChild(td); });
    tb.appendChild(tr);
  };
  row(["", P.t("thNow"), P.t("thAvg", { n: st.n })], "th");
  row([P.t("rowF"), st.f === null ? P.t("none") : st.f, f1(st.avgF)], "td");
  row([P.t("rowR"), st.r === null ? P.t("none") : st.r, f1(st.avgR)], "td");
  box.appendChild(tb);
  const p1 = document.createElement("p");
  p1.textContent = P.t("ratioLine", { a: st.a, b: st.b, m: f2(st.ratio), n: st.n, p: f2(eqRatio(kf(), kr())) });
  box.appendChild(p1);
  const N = st.a + st.b, eb = eqB(N, kf(), kr());
  if (eb !== null) {
    const p2 = document.createElement("p");
    p2.textContent = P.t("expLine", { N, eb: Math.round(eb), ea: N - Math.round(eb) });
    box.appendChild(p2);
  }
}

function render() {
  const st = stats(sim);
  drawHead(st); drawDots(); drawTags(); drawCharts();
  $("kfVal").textContent = Play.fmt(kf(), 2);
  $("krVal").textContent = Play.fmt(kr(), 2);
  $("play").textContent = P.t(state.playing ? "pauseBtn" : "playBtn");
  $("play").setAttribute("aria-pressed", String(state.playing));
  const full = sim.slots.every((p) => p);
  $("addA").disabled = full;
  $("addA").textContent = P.t(full ? "full" : "addA");
  $("cutB").disabled = st.b < 2;
  renderStats(st);
  const tr = state.stepIdx === 0 ? null : trend(sim, kf(), kr());
  const sEl = $("status");
  sEl.textContent = tr ? P.t({ eq: "stEq", toB: "stToB", toA: "stToA", none: "stNone", allB: "stAllB", allA: "stAllA" }[tr]) : "";
  sEl.classList.toggle("eq", tr === "eq");
  Play.live($("live"), st.f === null && sim.t === 0
    ? P.t("live0", { a: st.a })
    : P.t("live1", { t: sim.t, a: st.a, b: st.b, f: st.f === null ? 0 : st.f, r: st.r === null ? 0 : st.r }));
}

/* ---------- animation: never autoplays; Play/Pause and +1 step ---------- */
const STEP_MS = 120;
let raf = 0, last = 0, acc = 0;
function tick(t) {
  if (!state.playing) return;
  acc += last ? Math.min(250, t - last) : 0;
  last = t;
  let n = 0;
  while (acc >= STEP_MS && n < 3) { step(sim, kf(), kr()); acc -= STEP_MS; n++; }
  if (n) render();
  raf = requestAnimationFrame(tick);
}
function stop() { state.playing = false; cancelAnimationFrame(raf); last = 0; acc = 0; }
function start() { state.playing = true; last = 0; acc = STEP_MS; raf = requestAnimationFrame(tick); }
$("play").addEventListener("click", () => { if (state.playing) stop(); else start(); render(); });
$("one").addEventListener("click", () => { step(sim, kf(), kr()); render(); });
$("tag").addEventListener("change", (e) => { state.tag = e.target.checked; render(); });
kfEl.addEventListener("input", render);
krEl.addEventListener("input", render);
$("addA").addEventListener("click", () => { addA(sim, 50); render(); });
$("cutB").addEventListener("click", () => { removeHalfB(sim); render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  state.stepIdx = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("stepBody2").textContent = i === 2 ? P.t("b3b") : "";
  $("stepBody2").hidden = i !== 2;
  $("predict").hidden = i !== 0;
  $("kRow").hidden = $("dRow").hidden = $("tagBox").hidden = i === 0;
  if (i === 2 && !state.tag) { state.tag = true; $("tag").checked = true; }
  render();
});
$("reset").addEventListener("click", () => {
  stop();
  sim = makeSim(SEED);
  kfEl.value = 0.06; krEl.value = 0.03;
  state.tag = false; $("tag").checked = false;
  pr.reset(); stp.go(0);
});
render();
</script>
</body>
</html>

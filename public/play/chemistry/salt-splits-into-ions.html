/* SIM-BEGIN — pure model, no DOM (tests extract this block) */
const V_BAT = 6, R_BULB = 12, K_CELL = 100, M_NACL = 58.44, LAM0 = 126.4, B_FIT = 0.6, G_MAX = 36;
const KAPPA = { solid: 1e-12, water: 1e-4, sugar: 1e-4, melt: 360 }; // S/m
const P_MAX = (V_BAT * V_BAT) / R_BULB, PAIR_C = 0.36, MELT_PAIRS = 18;
function fin(x, d) { return Number.isFinite(x) ? x : d; }
function molarity(g) {
  g = Math.min(G_MAX, Math.max(0, fin(g, 0)));
  return g > 0 ? (g / M_NACL) / ((100 + 0.37 * g) / 1000) : 0;
}
function kappaSalt(c) { return c > 0 ? (LAM0 / (1 + B_FIT * Math.sqrt(c))) * c / 10 : 0; } // S/m
function kappa(sample, g) {
  if (sample === "salt") return KAPPA.water + kappaSalt(molarity(g));
  return KAPPA[sample] !== undefined ? KAPPA[sample] : KAPPA.water;
}
function pairsDrawn(sample, g) {
  if (sample === "melt") return MELT_PAIRS;
  if (sample !== "salt") return 0;
  const c = molarity(g);
  return c > 0 ? Math.min(16, Math.max(1, Math.round(c / PAIR_C))) : 0;
}
function solve(sample, g, closed) {
  const k = kappa(sample, g), Rc = K_CELL / k;
  const I = closed && k > 0 ? V_BAT / (R_BULB + Rc) : 0;
  const P = I * I * R_BULB;
  const free = sample === "salt" || sample === "melt" ? 2 * pairsDrawn(sample, g) : 0;
  return { sample, g, c: sample === "salt" ? molarity(g) : 0, k, Rc, I, P, glow: Math.sqrt(Math.min(1, P / P_MAX)), free };
}
function fmtA(I) {
  if (!Number.isFinite(I) || I < 1e-6) return "≈ 0 A";
  if (I >= 0.1) return I.toFixed(2) + " A";
  if (I >= 1e-3) return (I * 1e3).toFixed(I >= 0.01 ? 0 : 1) + " mA";
  return (I * 1e6).toFixed(0) + " µA";
}
function fmtR(R) {
  if (!Number.isFinite(R) || R > 1e9) return "> 1 GΩ";
  if (R >= 1e6) return (R / 1e6).toFixed(1) + " MΩ";
  if (R >= 1e3) return (R / 1e3).toFixed(1) + " kΩ";
  return R.toFixed(R < 10 ? 1 : 0) + " Ω";
}
/* SIM-END */

const SAMPLES = ["solid", "water", "sugar", "salt", "melt"];
const S = { sample: "salt", g: 12, closed: false, answered: false, mol: false, playing: false };
let sol = null, stp = null, raf = 0, last = 0, lastLive = "", parts = [], partsG = null, flashes = [];
const revealed = () => S.answered || (stp && stp.i > 0);

/* ---------- circuit ---------- */
const XA = 90, XC = 210, YT = 50, YW = 150, XL = 30, XR = 270, BX0 = 60, BX1 = 240, BY0 = 190, BY1 = 340;
const ZX0 = 300, ZY0 = 20, ZX1 = 590, ZY1 = 350, PX0 = 326, PX1 = 564, PY0 = 60, PY1 = 338;
function hit(parent, fid, aria, onAct) {
  const g = sv("g", { class: "hit", tabindex: 0, role: "button", "data-fid": fid, "aria-label": aria }, parent);
  g.addEventListener("click", onAct);
  g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onAct(); } });
  return g;
}
function drawCircuit() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  fig.innerHTML = "";
  const rv = revealed();
  // zoom box behind everything
  sv("polyline", { class: "zoomline", points: `${XA + 8},${BY0 + 40} ${ZX0},${ZY0}` }, fig);
  sv("polyline", { class: "zoomline", points: `${XA + 8},${BY1 - 10} ${ZX0},${ZY1}` }, fig);
  sv("rect", { class: "zoomline", x: XA + 8, y: BY0 + 40, width: XC - XA - 16, height: BY1 - BY0 - 50 }, fig);
  sv("rect", { class: "zoom", x: ZX0, y: ZY0, width: ZX1 - ZX0, height: ZY1 - ZY0, rx: 10 }, fig);
  sv("rect", { class: "elec", x: ZX0 + 2, y: ZY0 + 2, width: 14, height: ZY1 - ZY0 - 4, rx: 4 }, fig);
  sv("rect", { class: "elec", x: ZX1 - 16, y: ZY0 + 2, width: 14, height: ZY1 - ZY0 - 4, rx: 4 }, fig);
  sv("text", { class: "lblS", x: ZX0 + 24, y: ZY0 + 30 }, fig).textContent = "+";
  sv("text", { class: "lblS", x: ZX1 - 24, y: ZY0 + 30, "text-anchor": "end" }, fig).textContent = "−";
  // beaker and contents
  if (S.sample === "solid") {
    sv("path", { class: "heap", d: `M${BX0 + 4},${BY1 - 2} Q${(BX0 + BX1) / 2},${BY0 + 30} ${BX1 - 4},${BY1 - 2} Z` }, fig);
    for (let i = 0; i < 18; i++) {
      const x = BX0 + 22 + ((i * 37) % 140), y = BY1 - 14 - ((i * 23) % 70) * (1 - Math.abs(x - 150) / 110);
      sv("rect", { class: "cube", x: x.toFixed(1), y: y.toFixed(1), width: 11, height: 11, transform: `rotate(${(i * 29) % 40 - 20} ${x + 5} ${y + 5})` }, fig);
    }
  } else {
    sv("rect", { class: "liq" + (S.sample === "melt" ? " melt" : ""), x: BX0 + 2, y: BY0 + 28, width: BX1 - BX0 - 4, height: BY1 - BY0 - 30 }, fig);
    if (S.sample === "melt") sv("text", { class: "lbl", x: (BX0 + BX1) / 2, y: BY1 - 8, "text-anchor": "middle" }, fig).textContent = "≈ 850 °C";
  }
  sv("path", { class: "beaker", d: `M${BX0},${BY0} L${BX0},${BY1} L${BX1},${BY1} L${BX1},${BY0}` }, fig);
  // wires
  sv("polyline", { class: "wire", points: `${XA},${BY0 - 22} ${XA},${YW} ${XL},${YW} ${XL},${YT} ${XR},${YT} ${XR},${YW} ${XC},${YW} ${XC},${BY0 - 22}` }, fig);
  sv("rect", { class: "elec", x: XA - 6, y: BY0 - 22, width: 12, height: BY1 - BY0 + 8, rx: 3 }, fig);
  sv("rect", { class: "elec", x: XC - 6, y: BY0 - 22, width: 12, height: BY1 - BY0 + 8, rx: 3 }, fig);
  sv("text", { class: "lblS", x: XA - 14, y: BY0 - 2, "text-anchor": "end" }, fig).textContent = "+";
  sv("text", { class: "lblS", x: XC + 14, y: BY0 - 2 }, fig).textContent = "−";
  // battery on the left wire: − (short, thick) on top, + (long) below
  sv("rect", { class: "cover", x: XL - 26, y: 86, width: 52, height: 30 }, fig);
  sv("line", { class: "plate neg", x1: XL - 12, y1: 92, x2: XL + 12, y2: 92 }, fig);
  sv("line", { class: "plate", x1: XL - 24, y1: 108, x2: XL + 24, y2: 108 }, fig);
  sv("line", { class: "wire", x1: XL, y1: 86, x2: XL, y2: 92 }, fig);
  sv("line", { class: "wire", x1: XL, y1: 108, x2: XL, y2: 116 }, fig);
  sv("text", { class: "lblR", x: XL + 30, y: 108 }, fig).textContent = V_BAT + " V";
  // bulb
  const gl = rv ? sol.glow : 0, bx = 112;
  if (gl > 0.02) sv("circle", { class: "halo", cx: bx, cy: YT, r: 22 + 22 * gl, opacity: (0.25 + 0.5 * gl).toFixed(2) }, fig);
  sv("circle", { class: "bulb", cx: bx, cy: YT, r: 18, style: gl > 0.02 ? `fill: color-mix(in srgb, var(--hl) ${Math.round(20 + 80 * gl)}%, var(--surface))` : "" }, fig);
  sv("line", { class: "bulbx", x1: bx - 12, y1: YT - 12, x2: bx + 12, y2: YT + 12 }, fig);
  sv("line", { class: "bulbx", x1: bx + 12, y1: YT - 12, x2: bx - 12, y2: YT + 12 }, fig);
  // ammeter
  const ax = 200;
  sv("circle", { class: "meter", cx: ax, cy: YT, r: 19 }, fig);
  sv("text", { class: "lblM", x: ax, y: YT + 7, "text-anchor": "middle" }, fig).textContent = "A";
  sv("text", { class: "lblA", x: ax, y: YT - 26, "text-anchor": "middle" }, fig).textContent = rv ? fmtA(sol.I) : "? A";
  // switch on the right wire (vertical)
  const sx = XR, s1 = 78, s2 = 122;
  const gs = hit(fig, "sw", P.t("swAria", { s: P.t(S.closed ? "swIsClosed" : "swIsOpen") }), toggleSwitch);
  sv("rect", { class: "cover", x: sx - 10, y: s1 + 4, width: 20, height: s2 - s1 - 8, opacity: S.closed ? 0 : 1 }, gs);
  sv("rect", { class: "ring", x: sx - 30, y: s1 - 12, width: 50, height: s2 - s1 + 24, rx: 6 }, gs);
  sv("line", { class: "lever", x1: sx, y1: s2, x2: S.closed ? sx : sx - 24, y2: S.closed ? s1 : s1 + 8 }, gs);
  sv("circle", { class: "term", cx: sx, cy: s1, r: 5 }, gs);
  sv("circle", { class: "term", cx: sx, cy: s2, r: 5 }, gs);
  partsG = sv("g", {}, fig);
  buildParts();
  if (fid) { const el = fig.querySelector(`[data-fid="${fid}"]`); if (el) el.focus(); }
}

/* ---------- particles ---------- */
const R_NA = 8, R_CL = 13;
const rnd = (a, b) => a + Math.random() * (b - a);
function ionEl(type) {
  const g = sv("g", {}, partsG);
  if (type === "na") { sv("circle", { class: "na", r: R_NA }, g); sv("path", { class: "sign", d: "M-4,0H4M0,-4V4" }, g); }
  else { sv("circle", { class: "cl", r: R_CL }, g); sv("path", { class: "sign", d: "M-6,0H6" }, g); }
  return g;
}
function pairEl() {
  const g = sv("g", {}, partsG);
  sv("line", { class: "bond", x1: -10, y1: 0, x2: 10, y2: 0 }, g);
  sv("circle", { class: "cl", cx: -8, r: R_CL }, g); sv("path", { class: "sign", d: "M-14,0H-2" }, g);
  sv("circle", { class: "na", cx: 13, r: R_NA }, g); sv("path", { class: "sign", d: "M9,0H17M13,-4V4" }, g);
  return g;
}
function waterEl() {
  const g = sv("g", {}, partsG);
  sv("circle", { class: "h2o", r: 6 }, g); sv("circle", { class: "h2o", cx: -6, cy: 5, r: 3.5 }, g); sv("circle", { class: "h2o", cx: 6, cy: 5, r: 3.5 }, g);
  return g;
}
function sugarEl() {
  const g = sv("g", {}, partsG), hex = [], pen = [];
  for (let i = 0; i < 6; i++) hex.push([-9 + 10 * Math.cos(i * Math.PI / 3), 10 * Math.sin(i * Math.PI / 3)]);
  for (let i = 0; i < 5; i++) pen.push([11 + 8 * Math.cos(i * 2 * Math.PI / 5 + Math.PI), 8 * Math.sin(i * 2 * Math.PI / 5 + Math.PI)]);
  sv("polygon", { class: "sug", points: hex.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ") }, g);
  sv("polygon", { class: "sug", points: pen.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ") }, g);
  return g;
}
function addPart(type, x, y, extra) {
  const el = type === "na" || type === "cl" ? ionEl(type) : type === "pair" ? pairEl() : type === "sug" ? sugarEl() : waterEl();
  const p = Object.assign({ type, x, y, vx: 0, vy: 0, a: rnd(0, 360), el }, extra || {});
  parts.push(p);
  return p;
}
let builtKey = "";
function buildParts() {
  // Keep existing particles (positions) when only the switch or a redraw changes; rebuild on sample/model change.
  const nPairs = pairsDrawn(S.sample, S.g), key = S.sample + "|" + (S.mol ? 1 : 0);
  const old = key === builtKey ? parts : [];
  parts = []; flashes = [];
  builtKey = key;
  if (S.sample === "solid") {
    const cols = 8, rows = 9, d = 28, x0 = (PX0 + PX1) / 2 - ((cols - 1) * d) / 2, y0 = (PY0 + PY1) / 2 - ((rows - 1) * d) / 2;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) addPart((i + j) % 2 ? "na" : "cl", x0 + i * d, y0 + j * d, { hx: x0 + i * d, hy: y0 + j * d, fixed: true });
  } else {
    const keepW = old.filter((p) => p.type === "w"), nW = S.sample === "melt" ? 0 : S.sample === "water" ? 30 : 22;
    for (let i = 0; i < nW; i++) { const o = keepW[i]; addPart("w", o ? o.x : rnd(PX0, PX1), o ? o.y : rnd(PY0, PY1)); }
    if (S.sample === "sugar") for (let i = 0; i < 7; i++) addPart("sug", rnd(PX0 + 20, PX1 - 20), rnd(PY0 + 20, PY1 - 20));
    if (nPairs > 0) {
      const oldIons = old.filter((p) => p.type === "na" || p.type === "cl" || p.type === "pair");
      for (let k = 0; k < nPairs; k++) {
        if (S.mol) {
          const o = oldIons[k];
          addPart("pair", o ? o.x : rnd(PX0 + 20, PX1 - 20), o ? o.y : rnd(PY0 + 20, PY1 - 20));
        } else if (oldIons[2 * k + 1]) {
          addPart("cl", oldIons[2 * k].x, oldIons[2 * k].y); addPart("na", oldIons[2 * k + 1].x, oldIons[2 * k + 1].y);
        } else {
          // a new pair: starts touching, then the two ions split apart
          const x = rnd(PX0 + 40, PX1 - 40), y = rnd(PY0 + 20, PY1 - 20), sp = S.playing ? 0 : 50;
          addPart("cl", x - 10 - sp, y, { vx: -40, vy: rnd(-20, 20) }); addPart("na", x + 11 + sp, y, { vx: 40, vy: rnd(-20, 20) });
        }
      }
    }
  }
  placeAll();
}
function placeAll() {
  parts.forEach((p) => p.el.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})` + (p.type === "pair" || p.type === "sug" || p.type === "w" ? ` rotate(${p.a.toFixed(0)})` : "")));
  flashes.forEach((f) => { f.el.setAttribute("opacity", Math.max(0, f.t / 0.5).toFixed(2)); });
}
function driftSpeed() {
  // dots × speed ∝ current (I = nqvA): per-ion speed = K × I / number of ions drawn
  if (!revealed() || !S.closed || S.mol || sol.free <= 0) return 0;
  return Math.min(60, (2700 * sol.I) / sol.free);
}
function step(dt) {
  const vd = driftSpeed(), hot = S.sample === "melt" ? 2.2 : 1;
  parts.forEach((p) => {
    if (p.fixed) { p.x = p.hx + rnd(-1.2, 1.2); p.y = p.hy + rnd(-1.2, 1.2); return; }
    const kick = (p.type === "w" ? 260 : p.type === "sug" || p.type === "pair" ? 120 : 180) * hot;
    p.vx += rnd(-1, 1) * kick * dt; p.vy += rnd(-1, 1) * kick * dt;
    const damp = Math.exp(-3 * dt);
    p.vx *= damp; p.vy *= damp;
    const drift = p.type === "na" ? vd : p.type === "cl" ? -vd : 0;
    p.x += (p.vx + drift) * dt; p.y += p.vy * dt;
    if (p.type === "w" || p.type === "sug" || p.type === "pair") p.a += p.vx * dt * 2;
    if (p.y < PY0) { p.y = PY0; p.vy = Math.abs(p.vy); }
    if (p.y > PY1) { p.y = PY1; p.vy = -Math.abs(p.vy); }
    const ion = p.type === "na" || p.type === "cl";
    if (ion && vd > 0 && ((p.type === "na" && p.x >= PX1) || (p.type === "cl" && p.x <= PX0))) {
      // reached its electrode: it reacts there; re-place it so the count stays steady
      const f = { t: 0.5, el: sv("circle", { class: "flash", cx: p.type === "na" ? ZX1 - 18 : ZX0 + 18, cy: p.y.toFixed(1), r: 9 }, partsG) };
      flashes.push(f);
      p.x = rnd(PX0, PX1); p.y = rnd(PY0, PY1); p.vx = 0; p.vy = 0;
    }
    if (p.x < PX0) { p.x = PX0; p.vx = Math.abs(p.vx); }
    if (p.x > PX1) { p.x = PX1; p.vx = -Math.abs(p.vx); }
  });
  flashes.forEach((f) => { f.t -= dt; if (f.t <= 0) f.el.remove(); });
  flashes = flashes.filter((f) => f.t > 0);
  placeAll();
}
function tick(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
  last = ts;
  if (dt > 0) step(dt);
  raf = requestAnimationFrame(tick);
}
function setPlaying(on) {
  S.playing = on; cancelAnimationFrame(raf); last = 0;
  if (on) raf = requestAnimationFrame(tick);
  $("play").textContent = P.t(on ? "pause" : "play");
  $("play").setAttribute("aria-pressed", on ? "true" : "false");
}

/* ---------- chart (current vs salt) ---------- */
const CX0 = 46, CX1 = 326, CY0 = 14, CY1 = 118, IMAX = 0.5;
const cx = (g) => CX0 + (g / G_MAX) * (CX1 - CX0), cy = (I) => CY1 - (Math.min(I, IMAX) / IMAX) * (CY1 - CY0);
function drawChart() {
  const ch = $("chart");
  ch.innerHTML = "";
  const show = stp && stp.i > 0 && S.sample === "salt";
  ch.style.display = show ? "" : "none";
  if (!show) return;
  sv("line", { class: "ax", x1: CX0, y1: CY1, x2: CX1, y2: CY1 }, ch);
  sv("line", { class: "ax", x1: CX0, y1: CY0, x2: CX0, y2: CY1 }, ch);
  [0, 12, 24, 36].forEach((g) => { sv("text", { class: "tk", x: cx(g), y: CY1 + 16, "text-anchor": "middle" }, ch).textContent = g; });
  [0, 0.25, 0.5].forEach((I) => { sv("text", { class: "tk", x: CX0 - 6, y: cy(I) + 4, "text-anchor": "end" }, ch).textContent = I; });
  sv("text", { class: "tk", x: (CX0 + CX1) / 2, y: CY1 + 36, "text-anchor": "middle" }, ch).textContent = P.t("axX");
  sv("text", { class: "tk", x: CX0 + 6, y: CY0 + 2 }, ch).textContent = P.t("axY");
  const pts = [];
  for (let g = 0; g <= G_MAX; g += 0.5) pts.push(cx(g).toFixed(1) + "," + cy(solve("salt", g, true).I).toFixed(1));
  sv("polyline", { class: "curve", points: pts.join(" ") }, ch);
  sv("circle", { class: "mark", cx: cx(S.g), cy: cy(solve("salt", S.g, true).I), r: 6 }, ch);
}

/* ---------- panel ---------- */
function bulbWord(s) { return s.glow > 0.15 ? P.t("lit") : s.glow > 0.02 ? P.t("dim") : P.t("dark"); }
function panel() {
  const rv = revealed();
  sampleBtns.forEach((b, i) => { const on = SAMPLES[i] === S.sample; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  $("sw").textContent = P.t(S.closed ? "swClosed" : "swOpen");
  $("salt").value = S.g;
  $("saltVal").textContent = P.t("gUnit", { g: S.g });
  $("spoon").disabled = !(S.sample === "water" || S.sample === "salt") || S.g >= G_MAX && S.sample === "salt";
  $("molRow").hidden = !stp || stp.i === 0;
  $("mol").checked = S.mol;
  // readout: this sample now (steps 1–2) or all samples (step 3)
  const i = stp ? stp.i : 0;
  let h = "";
  if (i < 2) {
    h = `<tr><td>${P.t("rI")}</td><td>${rv ? fmtA(sol.I) : P.t("hidden")}</td></tr>`;
    h += `<tr><td>${P.t("rBulb")}</td><td>${rv ? bulbWord(sol) : P.t("hidden")}</td></tr>`;
    if (i === 1) h += `<tr><td>${P.t("rCell")}</td><td>${fmtR(sol.Rc)}</td></tr>`;
  } else {
    h = `<tr><th>${P.t("thS")}</th><th>${P.t("thIons")}</th><th>${P.t("thI")}</th></tr>`;
    SAMPLES.forEach((s) => {
      const r = solve(s, S.g, true), ions = "ions" + s[0].toUpperCase() + s.slice(1);
      h += `<tr class="${s === S.sample ? "cur" : ""}"><td>${P.t(s)}${s === "salt" ? " (" + P.t("gUnit", { g: S.g }) + ")" : ""}</td><td>${P.t(ions)}</td><td>${fmtA(r.I)}</td></tr>`;
    });
  }
  $("readout").innerHTML = h;
  let w = "";
  if (!rv && i === 0 && S.warnPick) w = P.t("warnPick");
  else if (S.mol && i > 0 && (S.sample === "salt" || S.sample === "melt")) w = P.t("warnMol", { I: fmtA(sol.I) });
  $("warn").textContent = w;
  drawChart();
  const box = $("rule");
  if (i !== 2) box.innerHTML = "";
  else {
    const out = [P.t("ruleMain")];
    if (!S.closed) out.push(P.t("ruleOff"));
    else if (sol.free <= 0) out.push(P.t("ruleNone", { name: P.t(S.sample), Rc: fmtR(sol.Rc), I: fmtA(sol.I) }));
    else out.push(P.t("ruleNow", {
      name: P.t(S.sample), gpart: S.sample === "salt" ? P.t("gPart", { g: S.g, c: Play.fmt(sol.c, 2) }) : "",
      n: S.mol ? 0 : sol.free, Rc: fmtR(sol.Rc), I: fmtA(sol.I),
    }));
    if (S.sample === "salt") out.push(P.t("ruleMore"));
    box.innerHTML = out.map((p) => "<p>" + p + "</p>").join("");
  }
  const msg = !rv ? "" : S.closed ? P.t("liveOn", { name: P.t(S.sample), I: fmtA(sol.I), b: bulbWord(sol) }) : P.t("liveOff");
  if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); }
}
function update() {
  sol = solve(S.sample, S.g, S.closed);
  drawCircuit(); panel();
}

/* ---------- controls ---------- */
const sampleBtns = SAMPLES.map((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(k);
  b.addEventListener("click", () => { S.sample = k; update(); });
  $("samples").appendChild(b);
  return b;
});
function toggleSwitch() {
  if (!revealed()) { S.warnPick = true; panel(); return; }
  S.closed = !S.closed; update();
}
$("sw").addEventListener("click", toggleSwitch);
$("play").addEventListener("click", () => setPlaying(!S.playing));
$("salt").addEventListener("input", () => {
  const v = Math.round(+$("salt").value);
  S.g = Number.isFinite(v) ? Play.clamp(v, 0, G_MAX) : 12;
  S.sample = "salt"; update();
});
$("spoon").addEventListener("click", () => {
  if (S.sample === "water") { S.sample = "salt"; S.g = 3; builtKey = "salt|" + (S.mol ? 1 : 0); }
  else if (S.sample === "salt") S.g = Math.min(G_MAX, S.g + 3);
  else return;
  update();
});
$("mol").addEventListener("change", () => { S.mol = $("mol").checked; update(); });

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
}, () => { S.answered = true; S.closed = true; S.warnPick = false; update(); });
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (i > 0 && !S.answered && !S.closed) S.closed = true;
  if (sol) update();
});
function resetAll() {
  Object.assign(S, { sample: "salt", g: 12, closed: false, answered: false, mol: false, warnPick: false });
  builtKey = "";
  pr.reset(); stp.go(0); update();
  setPlaying(!Play.reduced);
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

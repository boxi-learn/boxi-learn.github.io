<script>
// CORE START — pure chemistry, no DOM (checked in node)
const MASS = { H: 1.008, C: 12.011, N: 14.007, O: 15.999 };
const ORDER = ["C", "H", "N", "O"];
// shape: [element, x, y] in molecule units; heavy atoms last so they sit on top
const SPECIES = {
  H2: { f: "H₂", atoms: { H: 2 }, shape: [["H", -5, 0], ["H", 5, 0]] },
  O2: { f: "O₂", atoms: { O: 2 }, shape: [["O", -7, 0], ["O", 7, 0]] },
  N2: { f: "N₂", atoms: { N: 2 }, shape: [["N", -7, 0], ["N", 7, 0]] },
  H2O: { f: "H₂O", atoms: { H: 2, O: 1 }, shape: [["H", -10, 7], ["H", 10, 7], ["O", 0, -1]] },
  CH4: { f: "CH₄", atoms: { C: 1, H: 4 }, shape: [["H", -10, -8], ["H", 10, -8], ["H", -10, 8], ["H", 10, 8], ["C", 0, 0]] },
  CO2: { f: "CO₂", atoms: { C: 1, O: 2 }, shape: [["O", -13, 0], ["O", 13, 0], ["C", 0, 0]] },
  NH3: { f: "NH₃", atoms: { N: 1, H: 3 }, shape: [["H", -11, 7], ["H", 11, 7], ["H", 0, -12], ["N", 0, 0]] },
};
const RADIUS = { H: 6, C: 9, N: 8.5, O: 8.5 };
const RX = [
  { key: "rx1", L: ["H2", "O2"], R: ["H2O"], answer: [2, 1, 2] },
  { key: "rx2", L: ["CH4", "O2"], R: ["CO2", "H2O"], answer: [1, 2, 1, 2] },
  { key: "rx3", L: ["N2", "H2"], R: ["NH3"], answer: [1, 3, 2] },
];
const CMIN = 1, CMAX = 9;
const molMass = (atoms) => Object.keys(atoms).reduce((s, e) => s + MASS[e] * atoms[e], 0);
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
function tally(rx, co) {
  const L = {}, R = {};
  const side = (list, off, into) => list.forEach((sp, i) => {
    const c = co[off + i];
    for (const e in SPECIES[sp].atoms) into[e] = (into[e] || 0) + c * SPECIES[sp].atoms[e];
  });
  side(rx.L, 0, L);
  side(rx.R, rx.L.length, R);
  const els = ORDER.filter((e) => e in L || e in R);
  const mL = els.reduce((s, e) => s + (L[e] || 0) * MASS[e], 0);
  const mR = els.reduce((s, e) => s + (R[e] || 0) * MASS[e], 0);
  const bad = els.filter((e) => (L[e] || 0) !== (R[e] || 0));
  return { L, R, els, mL, mR, bad, balanced: bad.length === 0, g: co.reduce(gcd) };
}
// Paper modelled as cellulose units: C6H10O5 + 6 O2 -> 6 CO2 + 5 H2O
const PAPER = { C: 6, H: 10, O: 5 };
const N_PAPER = 0.01, N_O2_FLASK = 0.075;   // mol
function burn(f, sealed) {
  f = Math.min(1, Math.max(0, Number.isFinite(f) ? f : 0));
  const paper = N_PAPER * (1 - f) * molMass(PAPER);
  const o2used = 6 * N_PAPER * f * molMass({ O: 2 });
  const co2 = 6 * N_PAPER * f * molMass({ C: 1, O: 2 });
  const h2o = 5 * N_PAPER * f * molMass({ H: 2, O: 1 });
  const o2 = sealed ? N_O2_FLASK * molMass({ O: 2 }) - o2used : 0;
  const start = N_PAPER * molMass(PAPER) + (sealed ? N_O2_FLASK * molMass({ O: 2 }) : 0);
  const reading = sealed ? paper + o2 + co2 + h2o : paper;
  return { f, paper, o2, o2used, co2, h2o, start, reading, escaped: sealed ? 0 : co2 + h2o };
}
// CORE END

const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = (tag, attrs, parent) => Play.svg(tag, attrs, parent);
const g2 = (x) => Play.fmt(x, 2);
const state = { scene: "burn", rx: 0, co: [1, 1, 1], f: 0, sealed: false, playing: false };

function molecule(sp, cx, cy, s, parent) {
  SPECIES[sp].shape.forEach(([e, x, y]) => S("circle", { class: "atom at-" + e, cx: cx + x * s, cy: cy + y * s, r: RADIUS[e] * s }, parent));
}

/* ---------- scene: balancing workbench ---------- */
function drawSide(list, co, x0, y0, w, h) {
  const n = list.length, sh = h / n;
  list.forEach((sp, i) => {
    if (i > 0) S("line", { class: "sep", x1: x0 + 8, x2: x0 + w - 8, y1: y0 + i * sh, y2: y0 + i * sh }, fig);
    const cols = n === 1 ? 3 : 5, rows = Math.ceil(CMAX / cols);
    const cw = w / cols, chh = sh / rows;
    const ext = (k) => 2 * Math.max(...SPECIES[sp].shape.map((q) => Math.abs(q[k]) + RADIUS[q[0]]));
    const s = Math.min(n === 1 ? 1.9 : 1.3, 0.82 * cw / ext(1), 0.82 * chh / ext(2));
    const k = co[i];
    const usedRows = Math.ceil(k / cols);
    for (let j = 0; j < k; j++) {
      const r = Math.floor(j / cols), inRow = Math.min(cols, k - r * cols), c = j - r * cols;
      const cx = x0 + w / 2 + (c - (inRow - 1) / 2) * cw;
      const cy = y0 + i * sh + sh / 2 + (r - (usedRows - 1) / 2) * chh;
      molecule(sp, cx, cy, s, fig);
    }
  });
}
function drawBench() {
  const rx = RX[state.rx], co = state.co, T = tally(rx, co);
  fig.setAttribute("aria-label", P.t("figBench"));
  fig.innerHTML = "";
  S("text", { class: "lbl", x: 135, y: 26, "text-anchor": "middle" }, fig).textContent = P.t("before");
  S("text", { class: "lbl", x: 425, y: 26, "text-anchor": "middle" }, fig).textContent = P.t("after");
  S("rect", { class: "box", x: 10, y: 38, width: 250, height: 200, rx: 12 }, fig);
  S("rect", { class: "box", x: 300, y: 38, width: 250, height: 200, rx: 12 }, fig);
  S("text", { class: "lbl", x: 280, y: 146, "text-anchor": "middle" }, fig).textContent = "→";
  drawSide(rx.L, co.slice(0, rx.L.length), 10, 38, 250, 200);
  drawSide(rx.R, co.slice(rx.L.length), 300, 38, 250, 200);
  // balance scale: tilt grows with mass difference, saturates at 12°
  const diff = T.mL - T.mR;
  const deg = Math.abs(diff) < 1e-9 ? 0 : 12 * Math.tanh(diff / 12);
  const th = deg * Math.PI / 180, px = 280, py = 290, arm = 200;
  const lx = px - arm * Math.cos(th), ly = py + arm * Math.sin(th);
  const rxx = px + arm * Math.cos(th), ry = py - arm * Math.sin(th);
  S("path", { class: "post", d: `M${px - 34},404 L${px + 34},404 L${px + 6},${py} L${px - 6},${py} Z` }, fig);
  [[lx, ly, T.mL], [rxx, ry, T.mR]].forEach(([x, y, m]) => {
    S("line", { class: "string", x1: x, y1: y, x2: x - 40, y2: y + 40 }, fig);
    S("line", { class: "string", x1: x, y1: y, x2: x + 40, y2: y + 40 }, fig);
    S("path", { class: "pan", d: `M${x - 54},${y + 40} L${x + 54},${y + 40} Q${x},${y + 66} ${x - 54},${y + 40} Z` }, fig);
    S("text", { class: "num", x, y: y + 88, "text-anchor": "middle" }, fig).textContent = g2(m) + " u";
  });
  S("line", { class: "beam", x1: lx, y1: ly, x2: rxx, y2: ry }, fig);
  S("circle", { class: T.balanced ? "level" : "post", cx: px, cy: py, r: 8 }, fig);
  return T;
}
function sub(el, n) { return el + ": " + n; }
function renderTally(T) {
  const box = $("tallyBox");
  box.innerHTML = "";
  const tb = document.createElement("table");
  tb.className = "tally";
  const row = (cells, tag, cls) => {
    const tr = document.createElement("tr");
    cells.forEach((c, i) => { const td = document.createElement(tag); td.textContent = c; if (cls && cls[i]) td.className = cls[i]; tr.appendChild(td); });
    tb.appendChild(tr);
  };
  row([P.t("tAtom"), P.t("before"), P.t("after"), ""], "th");
  T.els.forEach((e) => {
    const a = T.L[e] || 0, b = T.R[e] || 0, ok = a === b;
    row([e, a, b, ok ? "✓" : "✗"], "td", ["", "", "", ok ? "ok" : "bad"]);
  });
  const mok = Math.abs(T.mL - T.mR) < 1e-9;
  row([P.t("tMass"), g2(T.mL), g2(T.mR), mok ? "✓" : "✗"], "td", ["", "", "", mok ? "ok" : "bad"]);
  box.appendChild(tb);
  const st = $("status");
  st.classList.toggle("win", T.balanced);
  if (T.balanced) st.textContent = T.g > 1 ? P.t("balancedG", { g: T.g }) : P.t("balanced");
  else st.textContent = P.t("unbalanced", { list: T.bad.join(", "), d: g2(Math.abs(T.mL - T.mR)) });
  const list = (side) => T.els.map((e) => sub(e, side[e] || 0)).join(", ");
  Play.live($("live"), P.t("liveBench", { l: list(T.L), r: list(T.R) }));
}
function buildPicker() {
  const pick = $("rxPick");
  pick.innerHTML = "";
  RX.forEach((r, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (i === state.rx ? " on" : ""); b.textContent = P.t(r.key);
    b.setAttribute("aria-pressed", i === state.rx ? "true" : "false");
    b.addEventListener("click", () => { state.rx = i; state.co = r.L.concat(r.R).map(() => 1); buildPicker(); buildEq(); render(); });
    pick.appendChild(b);
  });
}
function buildEq() {
  const eq = $("eq"), rx = RX[state.rx], all = rx.L.concat(rx.R);
  eq.innerHTML = "";
  all.forEach((sp, i) => {
    if (i > 0) {
      const op = document.createElement("span");
      op.className = "op"; op.textContent = i === rx.L.length ? "→" : "+";
      eq.appendChild(op);
    }
    const t = document.createElement("span");
    t.className = "term";
    const mk = (txt, d, key) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = txt; b.setAttribute("aria-label", P.t(key, { f: SPECIES[sp].f }));
      b.addEventListener("click", () => { state.co[i] = Play.clamp(state.co[i] + d, CMIN, CMAX); render(); b.focus(); });
      return b;
    };
    const minus = mk("−", -1, "fewer"), plus = mk("+", 1, "more");
    const c = document.createElement("span"); c.className = "coef"; c.dataset.i = i;
    const f = document.createElement("span"); f.className = "formula"; f.textContent = SPECIES[sp].f;
    minus.dataset.i = i; plus.dataset.i = i; minus.dataset.k = "m"; plus.dataset.k = "p";
    t.append(minus, c, plus, f);
    eq.appendChild(t);
  });
}
function syncEq() {
  document.querySelectorAll("#eq .coef").forEach((c) => (c.textContent = state.co[+c.dataset.i]));
  document.querySelectorAll("#eq button").forEach((b) => {
    const v = state.co[+b.dataset.i];
    b.disabled = b.dataset.k === "m" ? v <= CMIN : v >= CMAX;
  });
}

/* ---------- scene: burning paper on a scale ---------- */
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const FLASK = { cx: 160, cy: 262, r: 88 };
const PTS_IN = (() => {
  const rnd = seeded(7), out = [];
  while (out.length < 40) {
    const x = FLASK.cx + (rnd() * 2 - 1) * 72, y = FLASK.cy + (rnd() * 2 - 1) * 72;
    if (Math.hypot(x - FLASK.cx, y - FLASK.cy) > 70) continue;
    if (x > 118 && x < 202 && y > 268) continue;          // keep clear of the paper
    if (out.some((p) => Math.hypot(p[0] - x, p[1] - y) < 19)) { if (rnd() < 0.97) continue; }
    out.push([x, y]);
  }
  return out;
})();
const PTS_UP = (() => {
  const rnd = seeded(11), out = [];
  while (out.length < 24) {
    const x = 50 + rnd() * 220, y = 50 + rnd() * 220;
    if (out.some((p) => Math.hypot(p[0] - x, p[1] - y) < 26)) { if (rnd() < 0.98) continue; }
    out.push([x, y]);
  }
  return out;
})();
function drawBurn() {
  const B = burn(state.f, state.sealed), f = B.f;
  fig.setAttribute("aria-label", P.t("figBurn"));
  fig.innerHTML = "";
  const nCO2 = Math.round(12 * f), nH2O = Math.round(10 * f);
  const paperH = 50 * (1 - f), base = state.sealed ? 344 : 336;
  if (state.sealed) {
    const ny = FLASK.cy - Math.sqrt(FLASK.r * FLASK.r - 400);
    S("path", { class: "glass", d: `M140,128 L140,${ny} A${FLASK.r},${FLASK.r} 0 1 0 180,${ny} L180,128 Z` }, fig);
    S("rect", { class: "stopper", x: 134, y: 112, width: 52, height: 20, rx: 4 }, fig);
    const nO2 = Math.max(0, Math.round(15 - 12 * f));
    const kinds = [].concat(Array(nO2).fill("O2"), Array(nCO2).fill("CO2"), Array(nH2O).fill("H2O"));
    kinds.forEach((k, i) => { const p = PTS_IN[i % PTS_IN.length]; molecule(k, p[0], p[1], 0.62, fig); });
  } else {
    S("path", { class: "glass", d: "M60,326 L260,326 L246,352 L74,352 Z" }, fig);
    const kinds = [].concat(Array(nCO2).fill("CO2"), Array(nH2O).fill("H2O"));
    kinds.forEach((k, i) => {
      const p = PTS_UP[i % PTS_UP.length];
      const g = S("g", { opacity: 0.85 }, fig);
      molecule(k, p[0], p[1] - 30 * f, 0.62, g);
    });
    if (f > 0) S("text", { class: "lbl-m", x: 160, y: 30, "text-anchor": "middle" }, fig).textContent = P.t("toRoom");
  }
  if (paperH > 0.5) S("rect", { class: "paper", x: 135, y: base - paperH, width: 50, height: paperH, rx: 2 }, fig);
  if (f > 0 && f < 1) {
    const ty = base - paperH;
    S("path", { class: "flame1", d: `M148,${ty} Q146,${ty - 22} 160,${ty - 40} Q174,${ty - 22} 172,${ty} Z` }, fig);
    S("path", { class: "flame2", d: `M154,${ty} Q154,${ty - 12} 160,${ty - 22} Q166,${ty - 12} 166,${ty} Z` }, fig);
  }
  // digital scale (zeroed with the empty container)
  S("rect", { class: "scaletop", x: 40, y: 354, width: 240, height: 10, rx: 3 }, fig);
  S("rect", { class: "scalebody", x: 56, y: 364, width: 208, height: 56, rx: 8 }, fig);
  S("text", { class: "readout", x: 160, y: 401, "text-anchor": "middle" }, fig).textContent = g2(B.reading) + " g";
  // bars: what is on the scale, and either the start or what went into the air
  const k = 64, bottom = 360;
  S("line", { class: "axis", x1: 322, x2: 548, y1: bottom, y2: bottom }, fig);
  const stack = (x, parts, ghost) => {
    let y = bottom;
    parts.forEach(([cls, m]) => {
      const h = Math.max(0, m * k);
      if (h > 0.01) S("rect", { class: cls + (ghost ? " ghost" : ""), x, y: y - h, width: 80, height: h }, fig);
      y -= h;
    });
    return y;
  };
  const top1 = stack(335, [["seg-paper", B.paper], ["seg-o2", B.o2], ["seg-co2", state.sealed ? B.co2 : 0], ["seg-h2o", state.sealed ? B.h2o : 0]]);
  S("text", { class: "num", x: 375, y: top1 - 8, "text-anchor": "middle" }, fig).textContent = g2(B.reading);
  S("text", { class: "lbl-m", x: 375, y: 388, "text-anchor": "middle" }, fig).textContent = P.t("onScale");
  let top2, v2;
  if (state.sealed) { top2 = stack(455, [["seg-paper", N_PAPER * molMass(PAPER)], ["seg-o2", N_O2_FLASK * molMass({ O: 2 })]], true); v2 = B.start; }
  else { top2 = stack(455, [["seg-co2", B.co2], ["seg-h2o", B.h2o]], true); v2 = B.escaped; }
  S("text", { class: "num", x: 495, y: top2 - 8, "text-anchor": "middle" }, fig).textContent = g2(v2);
  S("text", { class: "lbl-m", x: 495, y: 388, "text-anchor": "middle" }, fig).textContent = P.t(state.sealed ? "atStart" : "inAir");
  $("fVal").textContent = Math.round(f * 100) + "%";
  $("cOpen").classList.toggle("on", !state.sealed); $("cOpen").setAttribute("aria-pressed", String(!state.sealed));
  $("cSealed").classList.toggle("on", state.sealed); $("cSealed").setAttribute("aria-pressed", String(state.sealed));
  $("play").textContent = P.t(state.playing ? "pauseBtn" : "burnBtn");
  const msg = state.sealed
    ? P.t("liveSealed", { s: g2(B.start), r: g2(B.reading), p: g2(B.paper), o: g2(B.o2), c: g2(B.co2), w: g2(B.h2o) })
    : f === 0 ? P.t("liveOpen0", { r: g2(B.reading) }) : P.t("liveOpen", { r: g2(B.reading), e: g2(B.escaped), p: g2(N_PAPER * molMass(PAPER) - B.paper), o: g2(B.o2used) });
  Play.live($("live"), msg);
}

function render() {
  $("benchCtl").hidden = state.scene !== "bench";
  $("burnCtl").hidden = state.scene !== "burn";
  $("tallyBox").hidden = $("status").hidden = state.scene !== "bench";
  if (state.scene === "bench") { const T = drawBench(); syncEq(); renderTally(T); }
  else drawBurn();
}

/* ---------- burn animation (never autoplays) ---------- */
let raf = 0, last = 0;
function tick(t) {
  if (!state.playing) return;
  const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
  last = t;
  state.f = Math.min(1, state.f + dt / 6);
  $("f").value = Math.round(state.f * 100);
  if (state.f >= 1) state.playing = false;
  render();
  if (state.playing) raf = requestAnimationFrame(tick);
}
function stop() { state.playing = false; cancelAnimationFrame(raf); last = 0; }
$("play").addEventListener("click", () => {
  if (state.playing) { stop(); render(); return; }
  if (state.f >= 1) { state.f = 0; $("f").value = 0; }
  state.playing = true; last = 0; render();
  raf = requestAnimationFrame(tick);
});
$("f").addEventListener("input", (e) => { stop(); state.f = Play.clamp(+e.target.value / 100, 0, 1); render(); });
$("cOpen").addEventListener("click", () => { state.sealed = false; render(); });
$("cSealed").addEventListener("click", () => { state.sealed = true; render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  stop();
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("stepBody2").textContent = i === 2 ? P.t("b3b") : "";
  $("stepBody2").hidden = i !== 2;
  $("predict").hidden = i !== 0;
  $("contPick").hidden = i === 0;
  if (i === 0) { state.scene = "burn"; state.sealed = false; }
  else if (i === 1) state.scene = "bench";
  else { state.scene = "burn"; state.sealed = true; }
  render();
});
buildPicker();
buildEq();
$("reset").addEventListener("click", () => {
  stop();
  state.rx = 0; state.co = [1, 1, 1]; state.f = 0; state.sealed = false;
  $("f").value = 0;
  pr.reset(); buildPicker(); buildEq(); st.go(0);
});
render();
</script>

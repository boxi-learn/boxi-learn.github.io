<script id="logic">
/* Pure logic (no DOM). Grid 7×7, x right, y down; d: 0 up, 1 right, 2 down, 3 left. Grid edge = outer wall. */
const N = 7, CAP = 300;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const SIDE = { ahead: 0, right: 1, left: 3 };
const MAZES = {
  A: { rows: ["#######", "#....*#", "#.#####", "#.#####", "#.#####", "#.#####", "#######"], start: [1, 5, 0] },
  B: { rows: ["#######", "#######", "##...*#", "##.####", "##.####", "##....#", "#######"], start: [5, 5, 3] },
  C: { rows: ["#######", "#.....#", "#.###.#", "#.#*#.#", "#.#.#.#", "#.#...#", "#######"], start: [1, 5, 0] },
  D: { rows: ["#######", "###..*#", "###.###", "#...###", "#.#####", "#.#####", "#######"], start: [1, 5, 0] },
  E: { rows: ["...#..*", ".#.#.##", ".#...#.", ".###.#.", "...#...", "##.#.#.", "...#.#."], start: [0, 6, 0] },
  F: { rows: [".......", ".##.##.", ".#...#.", ".#.#.#.", ".#.#*#.", ".#####.", "......."], start: [3, 6, 1] },
};
for (const k in MAZES) {
  const m = MAZES[k];
  m.key = k;
  m.walls = new Set();
  m.rows.forEach((r, y) => [...r].forEach((c, x) => { if (c === "#") m.walls.add(x + "," + y); if (c === "*") m.goal = [x, y]; }));
  m.start = { x: m.start[0], y: m.start[1], d: m.start[2] };
}
function blocked(m, x, y) { return x < 0 || y < 0 || x >= N || y >= N || m.walls.has(x + "," + y); }
function sense(m, s, side) { const d = DIRS[(s.d + SIDE[side]) % 4]; return blocked(m, s.x + d[0], s.y + d[1]); }
function apply(m, s, op) {
  if (op === "L") return { s: { x: s.x, y: s.y, d: (s.d + 3) % 4 } };
  if (op === "R") return { s: { x: s.x, y: s.y, d: (s.d + 1) % 4 } };
  const nx = s.x + DIRS[s.d][0], ny = s.y + DIRS[s.d][1];
  if (blocked(m, nx, ny)) return { s, bump: true };
  return { s: { x: nx, y: ny, d: s.d } };
}
const atGoal = (m, s) => s.x === m.goal[0] && s.y === m.goal[1];
/* Run a program to the end. prog = {kind:"list", ops:[…]} or {kind:"if", cond, a:[…], b:[…]} (inside "repeat until at ★").
   Returns {ev:[{op, br, k, round, s, bump}], end:"goal"|"bump"|"miss"|"loop"|"cap", first, round}. */
function run(m, prog) {
  let s = { ...m.start };
  const ev = [];
  const step = (op, br, k, round) => {
    const r = apply(m, s, op);
    ev.push({ op, br, k, round, s: r.s, bump: !!r.bump });
    s = r.s;
    return r.bump ? "bump" : op === "F" && atGoal(m, s) ? "goal" : ev.length >= CAP ? "cap" : "";
  };
  if (prog.kind === "list") {
    for (let k = 0; k < prog.ops.length; k++) { const e = step(prog.ops[k], "list", k, 0); if (e) return { ev, end: e }; }
    return { ev, end: atGoal(m, s) ? "goal" : "miss" };
  }
  const seen = {};
  let last = null;
  for (let round = 1; ; round++) {
    if (atGoal(m, s)) return { ev, end: "goal", round };
    const key = s.x + "," + s.y + "," + s.d;
    if (key in seen) return { ev, end: "loop", first: seen[key], round, empty: last && !prog[last].length ? last : null };
    seen[key] = round;
    const br = sense(m, s, prog.cond) ? "a" : "b", list = prog[br];
    last = br;
    for (let k = 0; k < list.length; k++) { const e = step(list[k], br, k, round); if (e) return { ev, end: e, round }; }
  }
}
/* Shortest straight list of commands to the star (breadth-first search over x, y, facing). */
function shortestList(m) {
  const key = (s) => s.x + "," + s.y + "," + s.d;
  const prev = { [key(m.start)]: null };
  const q = [m.start];
  while (q.length) {
    const s = q.shift();
    if (atGoal(m, s)) { const ops = []; let k = key(s); while (prev[k]) { ops.unshift(prev[k].op); k = prev[k].from; } return ops; }
    for (const op of ["F", "L", "R"]) {
      const r = apply(m, s, op);
      if (r.bump || key(r.s) in prev) continue;
      prev[key(r.s)] = { op, from: key(s) };
      q.push(r.s);
    }
  }
  return null;
}
const moves = (r) => r.ev.filter((e) => !e.bump).map((e) => e.op).join("");
if (typeof module !== "undefined") module.exports = { N, CAP, MAZES, blocked, sense, apply, run, shortestList, moves };
</script>

    allSome: "{n} 个迷宫里到达 ★ 的有 {k} 个。运行一个红色的，看看哪里出了错。",
    allF: "迷宫 E：到达 ★。迷宫 F：永远绕圈——右手一直扶着外墙，碰不到星星旁边那座墙岛。",
    hintD: "迷宫 D 左右都会拐。提示：让机器人的右手一直扶着墙——看「右边有墙」。",
    sep: "，", movesN: "{m} {n} 步", never: "{m} 永远到不了",
    ruleTxt: "同一段两部分的程序，六个迷宫——步数：{list}。循环里放一个「如果」，机器人就能按看到的情况决定每一步，所以步子随迷宫而变。",
    keys: "键盘：先点一下迷宫，↑ 前进，← 左转，→ 右转（加到高亮的那部分），退格键删除，回车运行，空格单步。",
    resultTitle: "我们发现", resultMain: "同一段程序 + 不同迷宫 = 不同步子",
    resultNote: "直接列出的步骤每次都走一样的步子，只适合一个迷宫。循环里的「如果」让机器人按看到的情况选每一步。局限：星星挨着一座墙岛时，扶墙走可能永远绕圈。",
    explainK: "说一说",
    explainQ: "朋友说「程序每次都做一模一样的事」。用会看墙的机器人跟他讲讲：什么时候是这样（直接列步骤），什么时候不是（循环里放「如果」）。",
    homeK: "家里做一做",
    homeQ: "在方格纸上画一个迷宫。铅笔从起点出发，始终让墙在它右边。能走到终点吗？再画一个带「墙岛」的迷宫，让它永远走不到。",
    foot: "沿墙走（「右手法则」）：在通道都只有一格宽、所有墙都连着外墙的迷宫里，它会经过每一格，所以一定找到星星。格子 7 × 7，边界算墙。机器人站上 ★、走满 300 步，或某一圈开始时回到以前的格子且朝向相同，就停下。CC BY-SA 4.0 · Boxi Yu",
  },
});

const $ = (id) => document.getElementById(id);
const fig = $("fig"), progEl = $("prog"), msg = $("live");
const C = 48, O = 12, cx = (v) => O + v * C + C / 2;
const ICON = { F: "↑", L: "↺", R: "↻" }, CONDS = ["ahead", "right", "left"], MAXB = 3;
const SETS = [["A", "B", "C"], ["A", "B", "C", "D"], ["E", "F"]];
const RH = () => ({ kind: "if", cond: "right", a: ["L"], b: ["R", "F"] });
const LIST_A = { kind: "list", ops: shortestList(MAZES.A) };

/* ---------- state ---------- */
let step = 0, lvIdx, lv, progs, kind1, tgt, results, picked = false, fast = false;
let ex = null, timer = null, running = false, anim = null;
function freshState() {
  progs = [null, { kind: "if", cond: "ahead", a: [], b: [] }, RH()];
  kind1 = "if"; tgt = ["a", "a", "a"]; lvIdx = [0, 0, 0]; results = [{}, {}, {}];
}
const prog = () => (step === 0 ? (kind1 === "list" ? LIST_A : { kind: "if", cond: "ahead", a: ["R"], b: ["F"] }) : progs[step]);
const editable = () => step > 0;

/* ---------- drawing ---------- */
let gTrail, gRobot, gProbe;
function drawMaze() {
  fig.innerHTML = "";
  const g = Play.svg("g", {}, fig);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    Play.svg("rect", { class: "cell", x: O + x * C, y: O + y * C, width: C, height: C }, g);
    if (lv.walls.has(x + "," + y)) Play.svg("rect", { class: "wall", x: O + x * C + 2, y: O + y * C + 2, width: C - 4, height: C - 4, rx: 5 }, g);
  }
  Play.svg("rect", { class: "frame", x: O - 3, y: O - 3, width: N * C + 6, height: N * C + 6, rx: 4 }, g);
  Play.svg("rect", { class: "startc", x: O + lv.start.x * C + 5, y: O + lv.start.y * C + 5, width: C - 10, height: C - 10, rx: 7 }, g);
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 8 : 18, a = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push((cx(lv.goal[0]) + r * Math.cos(a)).toFixed(1) + "," + (cx(lv.goal[1]) + r * Math.sin(a)).toFixed(1));
  }
  Play.svg("polygon", { class: "star", points: pts.join(" ") }, g);
  gProbe = Play.svg("g", {}, fig);
  gTrail = Play.svg("polyline", { class: "trail", points: "" }, fig);
  gRobot = Play.svg("g", {}, fig);
  Play.svg("circle", { class: "rbody", cx: 0, cy: 0, r: 15 }, gRobot);
  Play.svg("polygon", { class: "rbody", points: "0,-21 8,-11 -8,-11" }, gRobot);
  Play.svg("polygon", { class: "rnose", points: "0,-10 7,5 0,2 -7,5" }, gRobot);
}
function placeRobot(x, y, a) {
  gRobot.setAttribute("transform", `translate(${(O + x * C + C / 2).toFixed(1)} ${(O + y * C + C / 2).toFixed(1)}) rotate(${a.toFixed(1)})`);
}
function drawTrail(path) { gTrail.setAttribute("points", path.map(([x, y]) => cx(x) + "," + cx(y)).join(" ")); }
function drawProbe(s, cond) {
  gProbe.innerHTML = "";
  if (!cond) return;
  const d = DIRS[(s.d + SIDE[cond]) % 4], x = s.x + d[0], y = s.y + d[1];
  const w = blocked(lv, x, y);
  Play.svg("rect", { class: "probe " + (w ? "w" : "o"), x: O + x * C + 4, y: O + y * C + 4, width: C - 8, height: C - 8, rx: 6 }, gProbe);
}

/* ---------- program view + editor ---------- */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function chip(op, br, k) {
  const b = el("button", "cmd");
  b.type = "button";
  b.innerHTML = `<span class="ic">${ICON[op]}</span> `;
  b.appendChild(document.createTextNode(P.t("name" + op)));
  const ev = ex && ex.i > 0 ? ex.res.ev[ex.i - 1] : null;
  if (ev && ev.br === br && ev.k === k) b.classList.add(ev.bump ? "bad" : "cur");
  if (editable() && br !== "list") {
    b.setAttribute("aria-label", P.t("removeAria", { c: P.t("name" + op) }));
    b.addEventListener("click", () => { prog()[br].splice(k, 1); tgt[step] = br; edited(); });
  } else b.disabled = true;
  return b;
}
function branch(br) {
  const p = prog(), box = el("div", "br");
  const ev = ex && ex.i > 0 ? ex.res.ev[ex.i - 1] : null;
  if ((ev && ev.br === br) || (ex && ex.sensed === br)) box.classList.add("live");
  p[br].forEach((op, k) => box.appendChild(chip(op, br, k)));
  if (!p[br].length) box.appendChild(el("span", "empty", P.t("emptyBr")));
  if (editable()) {
    const on = tgt[step] === br, t = el("button", "tg" + (on ? " on" : ""), P.t(on ? "addingHere" : "addHere"));
    t.type = "button";
    t.setAttribute("aria-pressed", on ? "true" : "false");
    t.addEventListener("click", () => { tgt[step] = br; renderProg(); });
    box.appendChild(t);
  }
  return box;
}
function renderProg() {
  const p = prog();
  progEl.innerHTML = "";
  if (p.kind === "list") {
    progEl.appendChild(el("div", "kw", P.t("listHead")));
    const box = el("div", "br");
    p.ops.forEach((op, k) => box.appendChild(chip(op, "list", k)));
    progEl.appendChild(box);
  } else {
    progEl.appendChild(el("div", "kw", P.t("repeatUntil")));
    const ind = el("div", "ind"), head = el("div", "row");
    head.appendChild(el("span", "kw", P.t("ifW")));
    const cb = el("button", "cond", P.t("cond" + p.cond));
    cb.type = "button";
    cb.setAttribute("aria-label", P.t("condAria", { c: P.t("cond" + p.cond) }));
    if (editable()) cb.addEventListener("click", () => { p.cond = CONDS[(CONDS.indexOf(p.cond) + 1) % 3]; edited(); });
    else cb.disabled = true;
    head.append(cb, el("span", "kw", "{"));
    const mid = el("div", "row");
    mid.append(el("span", "kw", "} " + P.t("elseW") + " {"));
    ind.append(head, branch("a"), mid, branch("b"), el("span", "kw", "}"));
    progEl.append(ind, el("div", "kw", "}"));
  }
  $("clr").disabled = !editable() || (!p.a.length && !p.b.length);
}
function add(op) {
  if (!editable()) return;
  const list = prog()[tgt[step]];
  if (list.length >= MAXB) { setMsg(P.t("full"), "no"); return; }
  list.push(op);
  edited();
}
function removeLast() {
  if (!editable()) return;
  const p = prog(), br = p[tgt[step]].length ? tgt[step] : p.a.length ? "a" : "b";
  if (p[br].length) { p[br].pop(); edited(); }
}
function edited() { stopRun(); ex = null; results[step] = {}; showStart(); renderProg(); renderTable(); setMsg(""); }

/* ---------- results table ---------- */
const rowKey = (m, k) => m + "·" + k;
const mvText = (r) => { const s = moves(r).replace(/[FLR]/g, (c) => ICON[c]); return s.length > 48 ? s.slice(0, 48) + "…" : s; };
function resCell(r) {
  if (!r) return el("span", "", P.t("notYet"));
  const n = r.ev.filter((e) => !e.bump).length;
  const k = { goal: "rGoal", bump: "rBump", miss: "rMiss", loop: "rLoop", cap: "rCap" }[r.end];
  return el("span", r.end === "goal" ? "y" : "n", P.t(k, { n }));
}
function renderTable() {
  const t = $("tbl");
  t.innerHTML = "";
  [P.t("hMaze"), P.t("hRes"), P.t("hMoves")].forEach((h) => t.appendChild(el("span", "h", h)));
  const rows = [];
  SETS[step].forEach((m) => {
    if (step === 0) rows.push([m, "list", P.t("labList", { m })], [m, "if", P.t("labIf", { m })]);
    else rows.push([m, "if", m]);
  });
  rows.forEach(([m, k, lab]) => {
    const r = results[step][rowKey(m, k)];
    t.append(el("span", "", lab), resCell(r), el("span", "mv", r ? mvText(r) : ""));
  });
}
function record(m, k, r) { results[step][rowKey(m, k)] = r; renderTable(); renderLevels(); }

/* ---------- running ---------- */
const curKind = () => (step === 0 ? kind1 : "if");
function begin() {
  ex = { res: run(lv, prog()), i: 0, s: { ...lv.start }, ang: lv.start.d * 90, path: [[lv.start.x, lv.start.y]], sensed: null };
}
function showStart() {
  cancelAnim();
  gRobot.classList.remove("rbump");
  placeRobot(lv.start.x, lv.start.y, lv.start.d * 90);
  drawTrail([[lv.start.x, lv.start.y]]);
  drawProbe(null);
  $("where").textContent = "";
}
function cancelAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } }
function tween(from, to, ms, done) {
  cancelAnim();
  if (ms <= 0) { placeRobot(to.x, to.y, to.a); done(); return; }
  const t0 = performance.now();
  anim = { raf: 0 };
  const f = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    placeRobot(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e, from.a + (to.a - from.a) * e);
    if (k < 1) anim.raf = requestAnimationFrame(f); else { anim = null; done(); }
  };
  anim.raf = requestAnimationFrame(f);
}
const dur = (op) => (Play.reduced ? 0 : (op === "F" ? 300 : 200) / (fast ? 4 : 1));
function doOne(after) {
  if (!ex || ex.done) { begin(); showStart(); setMsg(""); }
  const p = prog();
  if (p.kind === "if" && !p.a.length && !p.b.length) { ex = null; setMsg(P.t("noProg"), "no"); stopRun(); return; }
  if (ex.i >= ex.res.ev.length) { finish(); return; }
  const e = ex.res.ev[ex.i], from = { x: ex.s.x, y: ex.s.y, a: ex.ang };
  if (e.br === "list") $("where").textContent = P.t("listInfo", { k: e.k + 1, n: p.ops.length });
  else if (e.k === 0) {
    ex.sensed = e.br;
    drawProbe(ex.s, p.cond);
    $("where").textContent = P.t("roundInfo", { r: e.round, c: P.t("cond" + p.cond), yn: P.t(e.br === "a" ? "yes" : "no"), part: P.t(e.br === "a" ? "partA" : "partB") });
  }
  ex.i++;
  renderProg();
  if (e.bump) {
    gRobot.classList.add("rbump");
    const dx = DIRS[ex.s.d][0] * .22, dy = DIRS[ex.s.d][1] * .22, mid = { x: from.x + dx, y: from.y + dy, a: from.a };
    tween(from, mid, dur("F") / 2, () => tween(mid, from, dur("F") / 2, finish));
    return;
  }
  ex.ang += e.op === "L" ? -90 : e.op === "R" ? 90 : 0;
  ex.s = e.s;
  if (e.op === "F") { ex.path.push([e.s.x, e.s.y]); drawProbe(null); }
  tween(from, { x: e.s.x, y: e.s.y, a: ex.ang }, dur(e.op), () => {
    drawTrail(ex.path);
    if (ex.i >= ex.res.ev.length) finish();
    else if (after) after();
  });
}
function finish() {
  const r = ex.res, n = r.ev.filter((e) => !e.bump).length, last = r.ev[r.ev.length - 1];
  ex.done = true;
  stopRun();
  drawProbe(null);
  if (r.end !== "goal" && r.end !== "bump") gRobot.classList.add("rbump");
  record(lv.key, curKind(), r);
  const nm = last ? P.t("name" + last.op) : "";
  if (r.end === "goal") setMsg(r.ev.length && last.br === "list" ? P.t("goalList", { n }) : P.t("goal", { n, r: last ? last.round : 0 }), "ok");
  else if (r.end === "bump") setMsg(last.br === "list" ? P.t("bumpList", { k: last.k + 1, c: nm }) : P.t("bump", { r: last.round, c: nm }), "no");
  else if (r.end === "miss") setMsg(P.t("miss"), "no");
  else if (r.end === "loop") setMsg(r.empty ? P.t("loopEmpty", { part: P.t(r.empty === "a" ? "partA" : "partB") }) : P.t("loop", { r: r.round, f: r.first }), "no");
  else setMsg(P.t("cap", { n }), "no");
  renderProg();
}
function setMsg(t, cls) { msg.className = "msg" + (cls ? " " + cls : ""); Play.live(msg, t); }
function loop() {
  if (!running) return;
  doOne(() => { timer = setTimeout(loop, Play.reduced ? (fast ? 60 : 250) : 50); });
}
function canRun() {
  if (step === 0 && !picked) { setMsg(P.t("pickFirst"), "no"); return false; }
  return true;
}
function runBtn() {
  if (running) { stopRun(); return; }
  if (anim || !canRun()) return;
  if (!ex || ex.done) { begin(); showStart(); setMsg(""); }
  running = true;
  $("run").textContent = P.t("pause");
  loop();
}
function stopRun() { running = false; clearTimeout(timer); $("run").textContent = P.t("run"); }
function stepOnce() { if (running) stopRun(); if (anim || !canRun()) return; doOne(); }
function backToStart() { stopRun(); ex = null; showStart(); renderProg(); setMsg(""); }
function testAll() {
  if (!canRun()) return;
  const p = prog();
  if (p.kind === "if" && !p.a.length && !p.b.length) { setMsg(P.t("noProg"), "no"); return; }
  stopRun();
  const ms = SETS[step], k = curKind();
  const rs = ms.map((m) => [m, run(MAZES[m], p)]);
  rs.forEach(([m, r]) => (results[step][rowKey(m, k)] = r));
  renderTable(); renderLevels();
  const ok = rs.filter(([, r]) => r.end === "goal");
  if (ok.length === ms.length) setMsg(P.t("allOk", { list: ok.map(([m, r]) => P.t("movesN", { m, n: moves(r).length })).join(P.t("sep")) }), "ok");
  else {
    if (step === 2 && rs[0][1].end === "goal" && rs[1][1].end === "loop" && p.cond === "right") { setMsg(P.t("allF"), "no"); return; }
    const dOnly = step === 1 && ok.length === 3 && rs[3][1].end !== "goal";
    setMsg(P.t("allSome", { k: ok.length, n: ms.length }) + (dOnly ? " " + P.t("hintD") : ""), "no");
  }
}

/* ---------- mazes and steps ---------- */
function renderLevels() {
  const row = $("lvlRow");
  row.innerHTML = "";
  SETS[step].forEach((m, i) => {
    const b = el("button", "small", P.t("maze", { m }));
    b.type = "button";
    const r = results[step][rowKey(m, curKind())];
    b.classList.toggle("on", lv.key === m);
    b.classList.toggle("done", !!r && r.end === "goal");
    b.setAttribute("aria-pressed", lv.key === m ? "true" : "false");
    b.addEventListener("click", () => { lvIdx[step] = i; setMaze(m); });
    row.appendChild(b);
  });
}
function setMaze(m) {
  stopRun();
  lv = MAZES[m]; ex = null;
  drawMaze(); showStart(); renderLevels(); renderProg(); setMsg("");
}
function markKind(k) {
  kind1 = k;
  $("kList").classList.toggle("on", k === "list"); $("kIf").classList.toggle("on", k === "if");
  $("kList").setAttribute("aria-pressed", k === "list"); $("kIf").setAttribute("aria-pressed", k === "if");
}
function setKind(k) {
  markKind(k);
  stopRun(); ex = null; showStart(); renderProg(); renderLevels(); setMsg("");
}
/* Rule line: the right-hand program on all six mazes, computed. */
function ruleText() {
  const parts = Object.keys(MAZES).map((m) => {
    const r = run(MAZES[m], RH());
    return r.end === "goal" ? P.t("movesN", { m, n: moves(r).length }) : P.t("never", { m });
  });
  return P.t("ruleTxt", { list: parts.join(P.t("sep")) });
}
freshState();
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("oYes") }, { label: P.t("oNo"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
}, () => { picked = true; if (msg.textContent === P.t("pickFirst")) setMsg(""); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("kindRow").hidden = i !== 0;
  $("pal").hidden = i === 0;
  $("ans").textContent = P.t(i === 1 ? "ansShow" : "ansRH");
  $("rule").hidden = i !== 2;
  $("tbl").hidden = false;
  if (i === 0) markKind(kind1);
  setMaze(SETS[i][lvIdx[i]]);
  renderTable();
});
$("rule").textContent = ruleText();

/* ---------- wiring ---------- */
document.querySelectorAll("#pal [data-op]").forEach((b) => b.addEventListener("click", () => add(b.dataset.op)));
$("clr").addEventListener("click", () => { const p = prog(); p.a = []; p.b = []; tgt[step] = "a"; edited(); });
$("ans").addEventListener("click", () => { progs[step] = RH(); edited(); });
$("kList").addEventListener("click", () => setKind("list"));
$("kIf").addEventListener("click", () => setKind("if"));
$("run").addEventListener("click", runBtn);
$("stepBtn").addEventListener("click", stepOnce);
$("back").addEventListener("click", backToStart);
$("all").addEventListener("click", testAll);
$("fast").addEventListener("click", () => { fast = !fast; $("fast").classList.toggle("on", fast); $("fast").setAttribute("aria-pressed", fast); });
fig.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowUp") add("F");
  else if (k === "ArrowLeft") add("L");
  else if (k === "ArrowRight") add("R");
  else if (k === "Backspace" || k === "Delete") removeLast();
  else if (k === "Enter") runBtn();
  else if (k === " ") stepOnce();
  else return;
  e.preventDefault();
});
$("reset").addEventListener("click", () => {
  stopRun(); freshState(); picked = false; fast = false;
  $("fast").classList.remove("on"); $("fast").setAttribute("aria-pressed", "false");
  pr.reset(); st.go(0);
});
</script>
</body>
</html>

<script id="logic">
/* Pure logic (no DOM) so it can be checked in node. Grid 5×5, x right, y down; d: 0 up, 1 right, 2 down, 3 left.
   Same robot rules as robot-commands.html: forward into a wall or the edge = bump, and the program stops there. */
const N = 5;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const DEMO = { key: "demo", start: { x: 0, y: 4, d: 0 }, goal: [4, 0], walls: [[4, 1], [2, 3], [3, 3]],
  bug: "FFFRFFFF", plan: "FFFFRFFFF" };
const PUZZLES = [
  { key: "p1", kind: "turn", start: { x: 0, y: 4, d: 0 }, goal: [3, 1], walls: [[1, 3], [2, 3], [4, 0]],
    bug: "FFRFFFRF", plan: "FFRFFFLF" },
  { key: "p2", kind: "missing", start: { x: 4, y: 4, d: 0 }, goal: [0, 1], walls: [[2, 2], [1, 3], [3, 3]],
    bug: "FFLFFFF", plan: "FFFLFFFF" },
  { key: "p3", kind: "extra", start: { x: 0, y: 0, d: 1 }, goal: [3, 3], walls: [[1, 2], [0, 3], [4, 1]],
    bug: "FFFRFFFLF", plan: "FFRFFFLF" },
  { key: "p4", kind: "order", start: { x: 1, y: 4, d: 0 }, goal: [3, 1], walls: [[4, 2], [0, 2], [2, 1]],
    bug: "RFFFLFF", plan: "FRFFLFF" },
];
function blocked(lv, x, y) {
  return x < 0 || y < 0 || x >= N || y >= N || lv.walls.some((w) => w[0] === x && w[1] === y);
}
function apply(lv, s, op) {
  if (op === "L") return { s: { x: s.x, y: s.y, d: (s.d + 3) % 4 } };
  if (op === "R") return { s: { x: s.x, y: s.y, d: (s.d + 1) % 4 } };
  const nx = s.x + DIRS[s.d][0], ny = s.y + DIRS[s.d][1];
  if (blocked(lv, nx, ny)) return { s, bump: true };
  return { s: { x: nx, y: ny, d: s.d } };
}
/* State after each command; a bump adds one entry {…, bump:true} and stops. */
function trace(lv, ops) {
  let s = { ...lv.start };
  const out = [];
  for (const op of ops) {
    const r = apply(lv, s, op);
    if (r.bump) { out.push({ ...s, bump: true }); break; }
    s = r.s;
    out.push({ ...s });
  }
  return out;
}
function run(lv, ops) {
  const t = trace(lv, ops), last = t.length ? t[t.length - 1] : { ...lv.start };
  const bump = t.length && last.bump ? t.length - 1 : -1;
  const ok = bump < 0 && last.x === lv.goal[0] && last.y === lv.goal[1];
  return { end: last, bump, ok };
}
/* First step (0-based) where what happens differs from what was expected.
   Expected after step k = the reader's dot k if they placed one (place only), else the plan (place and facing). */
function firstDiff(lv, ops, dots) {
  const real = trace(lv, ops), want = trace(lv, lv.plan);
  for (let k = 0; k < real.length; k++) {
    const r = real[k];
    if (r.bump) return { k, why: "bump" };
    const dot = dots && dots[k];
    if (dot) { if (dot[0] !== r.x || dot[1] !== r.y) return { k, why: "dot" }; continue; }
    const w = want[k];
    if (!w) return { k, why: "extra" };
    if (w.x !== r.x || w.y !== r.y) return { k, why: "place" };
    if (w.d !== r.d) return { k, why: "face" };
  }
  if (!run(lv, ops).ok && real.length < want.length) return { k: real.length, why: "short" };
  return { k: -1, why: "" };
}
/* Fewest single-command edits (change, add, remove, swap two neighbours) from a to b. */
function edits(a, b) {
  const m = a.length, n = b.length, D = [];
  for (let i = 0; i <= m; i++) { D.push([]); for (let j = 0; j <= n; j++) D[i].push(i === 0 ? j : j === 0 ? i : 0); }
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) D[i][j] = Math.min(D[i][j], D[i - 2][j - 2] + 1);
  }
  return D[m][n];
}
if (typeof module !== "undefined") module.exports = { N, DEMO, PUZZLES, apply, trace, run, firstDiff, edits };
</script>

    keys: "键盘：用 Tab 走到一条指令，按回车选中它。在格子上：空格 = 单步，回车 = 全部运行。标猜测时，方向键移动黄框，回车放一个点。",
    resultTitle: "我们发现", resultMain: "猜 → 单步 → 对比 → 修",
    resultNote: "错误通常只是一条指令。一次执行一步，找到第一个和你想的不一样的步骤，只改它。",
    explainK: "说一说",
    explainQ: "朋友的机器人程序停在离星星一格的地方，他想全部删掉重写。跟他说说怎样找到错的那一条。",
    homeK: "家里做一做",
    homeQ: "写一份从床边走到厨房的路线。请家人一行一行照着走，你在旁边看。他第一次走错是在哪一行？只改那一行。",
    foot: "CC BY-SA 4.0 · Boxi Yu · 每条指令只做一件事：前进走一格，转弯是原地转四分之一圈。走进墙或出了边界就是撞墙，程序停止。「改动的指令」是从出错程序改到你的程序最少要几次单独修改（改一条、加一条、删一条、相邻两条换位置）。",
  },
});

const $ = (id) => document.getElementById(id);
const fig = $("fig"), progEl = $("prog"), msg = $("live");
const C = 56, O = 10, cx = (v) => O + v * C + C / 2;
const ICON = { F: "↑", L: "↺", R: "↻" };
const MAXLEN = 14;
const SP = P.lang === "zh" ? "" : " ";  // sentence joiner

/* ---------- state ---------- */
let step = 0, pIdx = 0, lv = DEMO;
let progs = {}, dots = {}, sel = null, solved = {};
let marking = false, cursor = { x: 0, y: 0 };
let ex = null, fd = null, shownDiff = false;
let timer = null, running = false, anim = null, picked = false;

function freshState() {
  progs = { demo: DEMO.bug.split("") };
  dots = { demo: [] };
  PUZZLES.forEach((p) => { progs[p.key] = p.bug.split(""); dots[p.key] = []; });
  solved = {}; sel = null; marking = false;
}
const prog = () => progs[lv.key];
const myDots = () => dots[lv.key];

/* ---------- drawing ---------- */
let gTrail, gRobot, gGhost, gDots, gCur;
function robotShape(g) {
  Play.svg("circle", { class: "rbody", cx: 0, cy: 0, r: 17 }, g);
  Play.svg("polygon", { class: "rbody", points: "0,-24 9,-13 -9,-13" }, g);
  Play.svg("polygon", { class: "rnose", points: "0,-11 8,6 0,2 -8,6" }, g);
}
function drawLevel() {
  fig.innerHTML = "";
  fig.setAttribute("aria-label", P.t("figAria"));
  const g = Play.svg("g", {}, fig);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    Play.svg("rect", { class: "cell", x: O + x * C, y: O + y * C, width: C, height: C }, g);
  lv.walls.forEach(([x, y]) => {
    Play.svg("rect", { class: "wall", x: O + x * C + 3, y: O + y * C + 3, width: C - 6, height: C - 6, rx: 6 }, g);
    Play.svg("path", { class: "wallx", d: `M${O + x * C + 6} ${O + y * C + C / 2}H${O + x * C + C - 6}M${O + x * C + C / 2} ${O + y * C + 6}V${O + y * C + C / 2}`, fill: "none" }, g);
  });
  const [gx, gy] = lv.goal, pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 9 : 21, a = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push((cx(gx) + r * Math.cos(a)).toFixed(1) + "," + (cx(gy) + r * Math.sin(a)).toFixed(1));
  }
  Play.svg("polygon", { class: "star", points: pts.join(" ") }, g);
  gTrail = Play.svg("polyline", { class: "trail", points: "" }, fig);
  gDots = Play.svg("g", {}, fig);
  gGhost = Play.svg("g", { class: "ghost" }, fig);
  robotShape(gGhost);
  gGhost.style.display = "none";
  gRobot = Play.svg("g", {}, fig);
  robotShape(gRobot);
  gCur = Play.svg("rect", { class: "cursor", x: 0, y: 0, width: C - 4, height: C - 4, rx: 6 }, fig);
  drawCursor();
}
function drawCursor() {
  gCur.style.display = marking && document.activeElement === fig ? "" : "none";
  gCur.setAttribute("x", O + cursor.x * C + 2);
  gCur.setAttribute("y", O + cursor.y * C + 2);
}
function placeAt(g, x, y, ang) {
  g.setAttribute("transform", `translate(${(O + x * C + C / 2).toFixed(1)} ${(O + y * C + C / 2).toFixed(1)}) rotate(${ang.toFixed(1)})`);
}
function drawTrail(path) { gTrail.setAttribute("points", path.map(([x, y]) => cx(x) + "," + cx(y)).join(" ")); }
/* Guess dots: one circle per square, labelled with every step number guessed there. */
function drawDots() {
  gDots.innerHTML = "";
  const by = {};
  myDots().forEach((d, k) => { if (!d) return; const key = d[0] + "," + d[1]; (by[key] = by[key] || []).push(k); });
  const done = ex ? ex.i : 0, real = ex ? ex.states : [];
  Object.entries(by).forEach(([key, ks]) => {
    const [x, y] = key.split(",").map(Number);
    const label = ks.map((k) => k + 1).join("·");
    let cls = "gdot";
    const checked = ks.filter((k) => k < done && real[k] && !real[k].bump);
    if (checked.length) cls += checked.every((k) => real[k].x === x && real[k].y === y) ? " ok" : " no";
    const w = Math.max(24, 9 * label.length + 8);
    Play.svg("rect", { class: cls, x: cx(x) - w / 2, y: cx(y) + 6, width: w, height: 20, rx: 10 }, gDots);
    Play.svg("text", { class: "gdottx", x: cx(x), y: cx(y) + 16 }, gDots).textContent = label;
  });
}
function drawGhost() {
  // the faded robot = where the plan says the robot should be after the steps run so far (only when no guess dot for that step)
  const k = ex ? ex.i - 1 : -1;
  if (!ex || k < 0 || myDots()[k] || step === 2) { gGhost.style.display = "none"; return; }
  const want = trace(lv, lv.plan), w = want[Math.min(k, want.length - 1)];
  if (!w) { gGhost.style.display = "none"; return; }
  gGhost.style.display = "";
  placeAt(gGhost, w.x, w.y, w.d * 90);
}

/* ---------- step 3 chart ---------- */
function drawChart() {
  fig.innerHTML = "";
  fig.setAttribute("aria-label", P.t("chartAria"));
  const max = Math.max(...PUZZLES.map((p) => p.plan.length)), x0 = 70, W = 210;
  PUZZLES.forEach((p, i) => {
    const y = 26 + i * 70, fixed = solved[p.key], all = p.plan.length;
    const e = fixed != null ? fixed : edits(p.bug.split(""), p.plan.split("")), bw = Math.max(4, (W * e) / max);
    Play.svg("text", { class: "bartx", x: 10, y: y + 12 }, fig).textContent = P.t("bug" + (i + 1));
    Play.svg("rect", { class: "barfix", x: x0, y: y + 2, width: bw, height: 20, rx: 4 }, fig);
    Play.svg("text", { class: "bartx", x: x0 + bw + 6, y: y + 12 }, fig).textContent = e + SP + P.t(fixed != null ? "chFix" : "chFew");
    Play.svg("rect", { class: "barall", x: x0, y: y + 28, width: (W * all) / max, height: 20, rx: 4 }, fig);
    Play.svg("text", { class: "barmu", x: x0 + 6, y: y + 38 }, fig).textContent = all + SP + P.t("chAll");
  });
}

/* ---------- program editor ---------- */
function chip(op, i) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cmd";
  b.innerHTML = `<span class="n">${i + 1}</span><span class="ic">${ICON[op]}</span> `;
  b.appendChild(document.createTextNode(P.t("name" + op)));
  if (step !== 1) b.disabled = true;
  else b.addEventListener("click", () => { sel = sel === i ? null : i; renderProg(); progEl.children[i] && progEl.children[i].focus(); });
  if (step === 1 && sel === i) b.classList.add("sel");
  return b;
}
function renderProg() {
  progEl.innerHTML = "";
  const p = prog();
  if (!p.length) { const e = document.createElement("span"); e.className = "empty"; e.textContent = P.t("emptyProg"); progEl.appendChild(e); }
  const cur = ex && ex.i > 0 ? ex.i - 1 : -1;
  const bad = shownDiff && fd && fd.k >= 0 ? fd.k : -1;
  p.forEach((op, i) => {
    const b = chip(op, i);
    if (i === bad) b.classList.add("bad");
    else if (i === cur && !(ex && ex.bumped)) b.classList.add("cur");
    progEl.appendChild(b);
  });
  if (sel != null && sel >= p.length) sel = p.length ? p.length - 1 : null;
  const has = sel != null;
  $("chgLbl").textContent = has ? P.t("chgLbl", { n: sel + 1 }) : P.t("chgNone");
  document.querySelectorAll("[data-chg]").forEach((b) => (b.disabled = !has));
  $("addLbl").textContent = has ? P.t("addLbl", { n: sel + 1 }) : P.t("addEnd");
  document.querySelectorAll("[data-add]").forEach((b) => (b.disabled = p.length >= MAXLEN));
  $("del").disabled = !has;
  $("swapNext").disabled = !has || sel >= p.length - 1;
  const orig = lv.bug.split(""), e = edits(orig, p);
  $("restore").disabled = e === 0;
  $("count").textContent = step === 1 ? P.t("count", { e }) : "";
  const cmp = $("cmp");
  cmp.hidden = step !== 1;
  if (step === 1) {
    cmp.innerHTML = "";
    [["cmpE", e], ["cmpA", lv.plan.length]].forEach(([k, v]) => {
      const a = document.createElement("span"); a.textContent = P.t(k);
      const b = document.createElement("b"); b.textContent = v + SP + P.t("cmpU");
      cmp.append(a, b);
    });
  }
  renderGuessRow();
}
function renderGuessRow() {
  const n = myDots().length, full = n >= prog().length;
  $("markBtn").classList.toggle("on", marking);
  $("markBtn").classList.toggle("mark", marking);
  $("markBtn").setAttribute("aria-pressed", marking ? "true" : "false");
  $("clearDots").disabled = !n;
  $("guessTip").textContent = !marking ? P.t("tipOff") : full ? P.t("tipFull") : P.t("tipOn", { n: n + 1 });
}
function edited() { stopRun(); ex = null; fd = null; shownDiff = false; showAtStart(); renderProg(); setMsg(""); }
function change(op) { if (sel == null) return; prog()[sel] = op; edited(); }
function addOp(op) {
  const p = prog();
  if (p.length >= MAXLEN) return;
  if (sel == null) p.push(op); else p.splice(sel, 0, op);
  edited();
}
function removeSel() { if (sel == null) return; prog().splice(sel, 1); if (!prog().length) sel = null; else sel = Math.min(sel, prog().length - 1); edited(); }
function swapNext() {
  const p = prog();
  if (sel == null || sel >= p.length - 1) return;
  [p[sel], p[sel + 1]] = [p[sel + 1], p[sel]];
  sel++;
  edited();
}
function restore() { progs[lv.key] = lv.bug.split(""); sel = null; edited(); }

/* ---------- guesses ---------- */
function placeDot(x, y) {
  const d = myDots();
  if (d.length >= prog().length) return;
  d.push([x, y]);
  ex = null; fd = null; shownDiff = false; showAtStart(); renderProg(); setMsg("");
}
function clearDots() { dots[lv.key] = []; ex = null; fd = null; shownDiff = false; showAtStart(); renderProg(); setMsg(""); }
fig.addEventListener("click", (e) => {
  if (!marking || step !== 1) return;
  const p = Play.pointer(fig, e), x = Math.floor((p.x - O) / C), y = Math.floor((p.y - O) / C);
  if (x < 0 || y < 0 || x >= N || y >= N) return;
  cursor = { x, y };
  placeDot(x, y);
});

/* ---------- running ---------- */
function startExec() {
  const p = prog();
  ex = { ops: p.slice(), states: trace(lv, p), i: 0, s: { ...lv.start }, angle: lv.start.d * 90, path: [[lv.start.x, lv.start.y]], bumped: false, over: false };
  // a program that reaches the star has nothing to debug, even if it differs from the plan
  fd = run(lv, p).ok ? { k: -1, why: "" } : firstDiff(lv, p, myDots());
  shownDiff = false;
}
function showAtStart() {
  cancelAnim();
  if (step === 2) return;
  gRobot.classList.remove("rbump");
  placeAt(gRobot, lv.start.x, lv.start.y, lv.start.d * 90);
  drawTrail([[lv.start.x, lv.start.y]]);
  drawDots(); drawGhost();
}
function cancelAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } }
function tween(from, to, ms, done) {
  cancelAnim();
  if (ms <= 0) { placeAt(gRobot, to.x, to.y, to.a); done(); return; }
  const t0 = performance.now();
  anim = { raf: 0 };
  const f = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    placeAt(gRobot, from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e, from.a + (to.a - from.a) * e);
    if (k < 1) anim.raf = requestAnimationFrame(f); else { anim = null; done(); }
  };
  anim.raf = requestAnimationFrame(f);
}
const cname = (k) => P.t("name" + ex.ops[k]);
function revealDiff(k) {
  if (shownDiff || !fd || fd.k !== k) return false;
  shownDiff = true;
  const key = { place: "diffPlace", face: "diffFace", dot: "diffDot", extra: "diffExtra" }[fd.why];
  if (key) setMsg(P.t(key, { k: k + 1, c: cname(k) }), "no");
  return true;
}
function doOne(ms, after) {
  if (!ex || ex.over) { startExec(); showAtStart(); setMsg(""); }
  if (!ex.ops.length) { setMsg(P.t("noProg"), "no"); stopRun(); return; }
  const k = ex.i, o = ex.ops[k], r = apply(lv, ex.s, o);
  const from = { x: ex.s.x, y: ex.s.y, a: ex.angle };
  if (r.bump) {
    ex.bumped = ex.over = true;
    ex.i = k + 1;
    if (fd && fd.k === k) shownDiff = true;
    renderProg(); drawDots(); drawGhost();
    gRobot.classList.add("rbump");
    const dx = DIRS[ex.s.d][0] * .22, dy = DIRS[ex.s.d][1] * .22;
    tween(from, { x: from.x + dx, y: from.y + dy, a: from.a }, ms / 2, () => tween({ x: from.x + dx, y: from.y + dy, a: from.a }, from, ms / 2, () => {}));
    const earlier = shownDiff && fd && fd.k >= 0 && fd.k < k ? SP + P.t("bumpEarlier", { k: fd.k + 1 }) : "";
    setMsg(P.t("bump", { k: k + 1, c: P.t("name" + o) }) + earlier + (step === 0 ? SP + P.t("demoEnd") : ""), "no");
    stopRun();
    return;
  }
  ex.angle += o === "L" ? -90 : o === "R" ? 90 : 0;
  ex.s = r.s;
  if (o === "F") ex.path.push([ex.s.x, ex.s.y]);
  ex.i = k + 1;
  ex.over = ex.i >= ex.ops.length;
  const said = revealDiff(k);
  renderProg();
  tween(from, { x: ex.s.x, y: ex.s.y, a: ex.angle }, ms, () => {
    drawTrail(ex.path); drawDots(); drawGhost();
    if (ex.over) { finish(said); stopRun(); }
    else if (after) after();
  });
}
function finish(said) {
  const p = prog(), res = run(lv, p);
  if (res.ok) {
    if (step === 0) return;
    const e = edits(lv.bug.split(""), p), m = edits(lv.bug.split(""), lv.plan.split(""));
    gGhost.style.display = "none";
    if (e <= m) {
      solved[lv.key] = e;
      const all = PUZZLES.every((q) => solved[q.key] != null);
      setMsg(P.t("win", { e, n: p.length, kind: P.t("k" + lv.kind) }) + (all ? SP + P.t("allDone") : ""), "ok");
    } else {
      if (solved[lv.key] == null) solved[lv.key] = e;
      setMsg(P.t("winMore", { e, m }), "ok");
    }
    renderLevels();
    return;
  }
  if (fd && fd.why === "short") { shownDiff = true; setMsg(P.t("short"), "no"); renderProg(); return; }
  if (step === 0) { setMsg(P.t("demoEnd"), "no"); return; }
  if (!said) setMsg(P.t("miss"), "no");
  renderProg();
}
function setMsg(t, cls) { msg.className = "msg" + (cls ? " " + cls : ""); Play.live(msg, t); }
const SPEED = 420;
function loop() { if (!running) return; doOne(Play.reduced ? 0 : SPEED, () => { timer = setTimeout(loop, Play.reduced ? 380 : 90); }); }
function canRun() {
  if (step === 0 && !picked) { setMsg(P.t("pickFirst"), "no"); return false; }
  return step !== 2;
}
function runAll() {
  if (running) { stopRun(); return; }
  if (anim || !canRun()) return;
  if (!ex || ex.over) { startExec(); showAtStart(); renderProg(); setMsg(""); }
  if (!ex.ops.length) { setMsg(P.t("noProg"), "no"); return; }
  running = true;
  $("run").textContent = P.t("pause");
  loop();
}
function stopRun() { running = false; clearTimeout(timer); $("run").textContent = P.t("run"); }
function stepOnce() {
  if (running) stopRun();
  if (!canRun() || anim) return;
  doOne(Play.reduced ? 0 : 260);
}
function backToStart() { stopRun(); ex = null; fd = null; shownDiff = false; showAtStart(); renderProg(); setMsg(""); }

/* ---------- puzzles and steps ---------- */
function renderLevels() {
  const row = $("lvlRow");
  row.innerHTML = "";
  row.hidden = step !== 1;
  if (step !== 1) return;
  PUZZLES.forEach((l, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small";
    b.textContent = P.t("bug" + (i + 1));
    b.classList.toggle("on", lv === l);
    b.classList.toggle("done", solved[l.key] != null);
    b.setAttribute("aria-pressed", lv === l ? "true" : "false");
    b.addEventListener("click", () => { pIdx = i; setLevel(l); });
    row.appendChild(b);
  });
}
function setLevel(l) {
  stopRun();
  lv = l; ex = null; fd = null; shownDiff = false; sel = null;
  if (step === 2) drawChart(); else drawLevel();
  showAtStart();
  renderLevels(); renderProg(); setMsg("");
  const edit = step === 1;
  ["guessRow", "editRow1", "editRow2", "editRow3"].forEach((id) => ($(id).hidden = !edit));
  $("pane").hidden = step === 2;
  $("keys").hidden = step === 2;
}
freshState();
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { picked = true; if (msg.textContent === P.t("pickFirst")) setMsg(""); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("checklist").hidden = i !== 2;
  marking = false;
  setLevel(i === 0 ? DEMO : PUZZLES[pIdx]);
});

/* ---------- wiring ---------- */
document.querySelectorAll("[data-chg]").forEach((b) => b.addEventListener("click", () => change(b.dataset.chg)));
document.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => addOp(b.dataset.add)));
$("del").addEventListener("click", removeSel);
$("swapNext").addEventListener("click", swapNext);
$("restore").addEventListener("click", restore);
$("markBtn").addEventListener("click", () => { marking = !marking; renderGuessRow(); drawCursor(); });
$("clearDots").addEventListener("click", clearDots);
$("run").addEventListener("click", runAll);
$("stepBtn").addEventListener("click", stepOnce);
$("back").addEventListener("click", backToStart);
fig.addEventListener("focus", drawCursor);
fig.addEventListener("blur", drawCursor);
fig.addEventListener("keydown", (e) => {
  const k = e.key;
  if (step === 2) return;
  if (marking && step === 1 && k.startsWith("Arrow")) {
    const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[k];
    cursor = { x: Play.clamp(cursor.x + d[0], 0, N - 1), y: Play.clamp(cursor.y + d[1], 0, N - 1) };
    drawCursor();
  } else if (marking && step === 1 && k === "Enter") placeDot(cursor.x, cursor.y);
  else if (marking && step === 1 && k === "Backspace") { myDots().pop(); ex = null; fd = null; shownDiff = false; showAtStart(); renderProg(); }
  else if (k === "Enter") runAll();
  else if (k === " ") stepOnce();
  else return;
  e.preventDefault();
});
progEl.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const bs = [...progEl.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
  if (i < 0) return;
  const j = Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, bs.length - 1);
  bs[j].focus();
  e.preventDefault();
});
$("reset").addEventListener("click", () => {
  stopRun(); freshState(); picked = false; pIdx = 0; pr.reset(); st.go(0);
});
</script>
</body>
</html>

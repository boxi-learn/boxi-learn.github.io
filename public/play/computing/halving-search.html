<script id="logic">
/* Pure search logic (no DOM), checked in node.
   Binary search is the standard version on a sorted array a:
     low = 0, high = n − 1; while low ≤ high: mid = ⌊(low + high) / 2⌋, compare a[mid] with x
     (one three-way comparison = one "look"); equal → found; a[mid] < x → low = mid + 1; else high = mid − 1.
   Worst case, found or not: ⌊log₂ n⌋ + 1 looks = bitLen(n). Linear search looks left to right: up to n looks. */
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* ⌊log₂ m⌋ + 1 for m ≥ 1 (number of binary digits), 0 for m < 1; exact for any safe integer. */
function bitLen(m) { let k = 0; m = Math.floor(m); while (m >= 1) { m = Math.floor(m / 2); k++; } return k; }
/* n distinct whole numbers from 1…maxV, sorted ascending, from a seeded generator. */
function makeSorted(n, seed, maxV) {
  const r = mulberry32(seed), s = new Set();
  n = Math.min(n, maxV);
  while (s.size < n) s.add(1 + Math.floor(r() * maxV));
  return [...s].sort((p, q) => p - q);
}
function binInit(a, x) { return { a, x, lo: 0, hi: a.length - 1, mid: -1, last: null, cmp: 0, found: -1, done: a.length === 0 }; }
function binStep(s) {
  if (s.done) return false;
  const mid = (s.lo + s.hi) >> 1, v = s.a[mid];
  s.mid = mid; s.cmp++;
  if (v === s.x) { s.found = mid; s.last = 0; s.done = true; }
  else if (v < s.x) { s.lo = mid + 1; s.last = -1; }
  else { s.hi = mid - 1; s.last = 1; }
  if (s.lo > s.hi) s.done = true;
  return true;
}
function linInit(a, x) { return { a, x, i: -1, cmp: 0, found: -1, done: a.length === 0 }; }
function linStep(s) {
  if (s.done) return false;
  s.i++; s.cmp++;
  if (s.a[s.i] === s.x) { s.found = s.i; s.done = true; }
  else if (s.i === s.a.length - 1) s.done = true;
  return true;
}
function binarySearch(a, x) { const s = binInit(a, x); while (binStep(s)); return { found: s.found, cmp: s.cmp }; }
function linearSearch(a, x) { const s = linInit(a, x); while (linStep(s)); return { found: s.found, cmp: s.cmp }; }
/* Guessing game: the halving guess for the still possible range lo…hi. */
const halvingGuess = (lo, hi) => Math.floor((lo + hi) / 2);
/* Halving ladder: how many numbers can still be possible before guess 1, 2, … (worst case). */
function ladder(n) { const out = []; for (let m = Math.floor(n); m >= 1; m = Math.floor(m / 2)) out.push(m); return out; }
/* Race: A = one by one at 1 ns per look (n looks), B = halving at R ns per look (bitLen(n) looks). */
const timeA = (n) => n;
const timeB = (n, R) => bitLen(n) * R;
/* Smallest n0 such that B is strictly faster for every n ≥ n0. On each block [2^b, 2^(b+1) − 1]
   bitLen is b + 1, so B wins exactly for n > R(b + 1) inside it. */
function crossover(R) {
  let start = null;
  for (let b = 0; b < 52; b++) {
    const lo = Math.pow(2, b), hi = Math.pow(2, b + 1) - 1, c = Math.max(lo, Math.floor(R * (b + 1)) + 1);
    if (c > hi) start = null;
    else if (c === lo) { if (start === null) start = lo; }
    else start = c;
    if (start !== null && lo > R * (b + 2) * 2) break;   // later blocks all win
  }
  return start;
}
/* Time in ns → [value, unit] with 3 significant digits. */
function timeParts(ns) {
  if (!Number.isFinite(ns) || ns < 0) return [NaN, "ns"];
  const u = [[1e9, "s"], [1e6, "ms"], [1e3, "µs"], [1, "ns"]].find(([f]) => ns >= f) || [1, "ns"];
  return [ns / u[0], u[1]];
}
if (typeof module !== "undefined") module.exports = { mulberry32, bitLen, makeSorted, binInit, binStep, linInit, linStep, binarySearch, linearSearch, halvingGuess, ladder, timeA, timeB, crossover, timeParts };
</script>

function newGame() {

  $("gIn").min = 1; $("gIn").max = gN; $("gIn").value = "";

function guess(g) {
  if (gDone) return;
  g = Math.round(Play.clamp(g, 1, gN));
  if (!Number.isFinite(g)) return;
  gK++; guesses.push(g);
  const out = g < gLo || g > gHi, lo0 = gLo, hi0 = gHi;
  let t;
  if (g === secret) { gDone = true; gLo = gHi = secret; t = P.t("got", { g: nf(g), k: gK }); }
  else if (g < secret) { gLo = Math.max(gLo, g + 1); t = P.t("higher", { g: nf(g) }); }
  else { gHi = Math.min(gHi, g - 1); t = P.t("lower", { g: nf(g) }); }
  if (out && !gDone) t += P.t("wasted", { g: nf(g), lo: nf(lo0), hi: nf(hi0) });
  if (gDone) { const w = bitLen(gN); t += " " + P.t(gK <= w ? "gBeat" : "gOver", { w }); }
  setMsg($("gMsg"), t, gDone ? "ok" : "");

}

}
function setTarget(x) {
  target = Math.round(Play.clamp(x, 0, MAXV + 1));
  $("tIn").value = target;
  restartSearch();
}
function restartSearch() {
  stopPlay();
  bs = binInit(list, target); ls = linInit(list, target);
  setMsg($("sMsg"), P.t("ready", { x: target }));
  renderSearch();
}
function tickSearch() {
  const a = binStep(bs), b = linStep(ls);
  renderSearch();
  return a || b;
}
function renderSearch() {
  cellsB.forEach((c, i) => {
    const out = bs.done ? i !== bs.found : (i < bs.lo || i > bs.hi) && !(bs.cmp > 0 && i === bs.mid);
    c.className = "cell" + (out ? " out" : "") + (list[i] === target ? " tgt" : "") +
      (i === bs.found ? " won" : !bs.done && bs.cmp > 0 && i === bs.mid ? " cmp" : "") +
      (!bs.done && i === bs.lo ? " lo" : "") + (!bs.done && i === bs.hi ? " hi" : "");
  });
  cellsL.forEach((c, i) => {
    const out = i < ls.i && i !== ls.found;
    c.className = "cell" + (out ? " out" : "") + (list[i] === target ? " tgt" : "") +
      (i === ls.found ? " won" : i === ls.i && !ls.done ? " cmp" : ls.done && ls.found < 0 ? " out" : "");
  });
  const lane = (el, s, txt) => {
    el.innerHTML = "";
    const b = document.createElement("b"); b.textContent = s.cmp;
    el.append(b, " " + P.t(s.cmp === 1 ? "look1" : "looksL") + (txt ? " · " + txt : ""));
  };
  let tb = "";
  if (bs.cmp > 0) {
    const m = Math.max(0, bs.hi - bs.lo + 1), vars = { i: bs.mid + 1, v: bs.a[bs.mid], x: target, m };
    tb = bs.last === 0 ? P.t("bHit", vars) : bs.done ? P.t(bs.last < 0 ? "bLess" : "bMore", vars) + " " + P.t("bNone", vars) : P.t(bs.last < 0 ? "bLess" : "bMore", vars);
  }
  let tl = "";
  if (ls.cmp > 0) { const v = { i: ls.i + 1, v: list[ls.i], x: target, n: LISTN }; tl = ls.found >= 0 ? P.t("lHit", v) : ls.done ? P.t("lNone", v) : P.t("lMiss", v); }
  lane($("lcB"), bs, tb); lane($("lcL"), ls, tl);
  $("laneB").classList.toggle("fin", bs.done); $("laneL").classList.toggle("fin", ls.done);
  const all = bs.done && ls.done;
  if (all) { stopPlay(); setMsg($("sMsg"), P.t("listDone", { b: bs.cmp, l: ls.cmp, w: bitLen(LISTN) }), "ok"); }
  $("stepBtn").disabled = $("finish").disabled = all;
}
function stopPlay() { if (timer) clearTimeout(timer); timer = 0; playing = false; $("play").textContent = P.t("play"); }
function playSearch() {
  if (playing) { stopPlay(); return; }
  if (bs.done && ls.done) restartSearch();
  playing = true; $("play").textContent = P.t("pause");
  const go = () => { if (!playing) return; if (tickSearch() && !(bs.done && ls.done)) timer = setTimeout(go, 160); else stopPlay(); };
  timer = setTimeout(go, 120);
}
$("play").addEventListener("click", playSearch);
$("stepBtn").addEventListener("click", () => { stopPlay(); tickSearch(); });
$("finish").addEventListener("click", () => { stopPlay(); while (tickSearch()); });
$("restart").addEventListener("click", restartSearch);
$("tIn").addEventListener("keydown", (e) => { if (e.key === "Enter") { const v = parseFloat($("tIn").value); if (Number.isFinite(v)) setTarget(v); e.preventDefault(); } });
$("tIn").addEventListener("change", () => { const v = parseFloat($("tIn").value); if (Number.isFinite(v)) setTarget(v); });
$("tInList").addEventListener("click", () => setTarget(list[Math.floor(Math.random() * LISTN)]));
$("tNotIn").addEventListener("click", () => {
  const have = new Set(list), free = [];
  for (let v = 1; v <= MAXV; v++) if (!have.has(v)) free.push(v);
  setTarget(free[Math.floor(Math.random() * free.length)]);
});
$("newList").addEventListener("click", () => newList(1 + Math.floor(Math.random() * 9999)));

const modeBtns = [["modeG", "g"], ["modeL", "l"]].map(([k, m]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "preset"; b.textContent = P.t(k);
  b.addEventListener("click", () => setMode(m));
  $("modes").appendChild(b);
  return [b, m];
});
function setMode(m) {
  mode = m;
  modeBtns.forEach(([b, x]) => { b.classList.toggle("on", x === m); b.setAttribute("aria-pressed", String(x === m)); });
  $("gGame").hidden = m !== "g"; $("gList").hidden = m !== "l";
  if (m !== "l") stopPlay();
  if (step === 1) { $("stepBody").textContent = P.t(m === "g" ? "b2g" : "b2l"); $("keys").textContent = P.t(m === "g" ? "keys2g" : "keys2l"); }
  if (m === "g") renderGame();
}

/* ================= step 3: race chart ================= */
const chart = $("chart");
let rk = 3, selX = 6;   // R = 10^rk; selected n = 10^selX
const Rv = () => Math.pow(10, rk);
const nAt = (x) => Math.max(1, Math.round(Math.pow(10, x)));
function shortN(n) {
  if (P.lang === "zh") return n >= 1e8 ? n / 1e8 + "亿" : n >= 1e4 ? n / 1e4 + "万" : n >= 1e3 ? n / 1e3 + "千" : String(n);
  return n >= 1e9 ? n / 1e9 + "B" : n >= 1e6 ? n / 1e6 + "M" : n >= 1e3 ? n / 1e3 + "k" : String(n);
}
const shortT = (ns) => { const [v, u] = timeParts(ns); return Math.round(v) + " " + u; };
function renderChart() {
  const W = svgW(chart, 600), H = svgH(chart, 340), R = Rv(), c = crossover(R);
  chart.setAttribute("viewBox", `0 0 ${W} ${H}`);
  chart.innerHTML = "";
  const L = W < 420 ? 54 : 64, Rm = 14, T = 32, B = 40;
  const X = (lx) => L + ((lx - 1) / 8) * (W - L - Rm);
  const Y = (ns) => H - B - (Math.log10(Math.max(ns, 1)) / 10) * (H - B - T);
  for (let e = 0; e <= 10; e++) {
    Play.svg("line", { class: "ax", x1: L, x2: W - Rm, y1: Y(Math.pow(10, e)), y2: Y(Math.pow(10, e)) }, chart);
    if (H >= 320 || e % 2 === 0) Play.svg("text", { class: "axt", x: L - 6, y: Y(Math.pow(10, e)) + 4, "text-anchor": "end" }, chart).textContent = shortT(Math.pow(10, e));
  }
  for (let e = 1; e <= 9; e++) if (W >= 420 || e % 2 === 1) Play.svg("text", { class: "axt", x: X(e), y: H - B + 18, "text-anchor": "middle" }, chart).textContent = shortN(Math.pow(10, e));
  Play.svg("text", { class: "axt", x: W - Rm, y: H - 4, "text-anchor": "end" }, chart).textContent = P.t("axN");
  Play.svg("text", { class: "axt", x: 4, y: 14 }, chart).textContent = P.t("axT");
  const ptsA = [], ptsB = [];
  for (let px = 0; px <= W - L - Rm; px += 2) {
    const lx = 1 + (px / (W - L - Rm)) * 8, n = Math.floor(Math.pow(10, lx));
    ptsA.push((L + px).toFixed(1) + "," + Y(timeA(n)).toFixed(1));
    ptsB.push((L + px).toFixed(1) + "," + Y(timeB(n, R)).toFixed(1));
  }
  Play.svg("polyline", { class: "serA", points: ptsA.join(" ") }, chart);
  Play.svg("polyline", { class: "serB", points: ptsB.join(" ") }, chart);
  if (c !== null && c >= 10 && c <= 1e9) {
    const xc = X(Math.log10(c));
    Play.svg("line", { class: "xline", x1: xc, x2: xc, y1: T, y2: H - B }, chart);
    const anc = xc > W - 120 ? "end" : "start";
    Play.svg("text", { class: "xlab", x: xc + (anc === "start" ? 5 : -5), y: T + 12, "text-anchor": anc }, chart).textContent = P.t("xLab", { c: nf(c) });
  }
  const n = nAt(selX), xs = X(selX);
  Play.svg("line", { class: "guide", x1: xs, x2: xs, y1: T, y2: H - B }, chart);
  Play.svg("circle", { class: "ptA", cx: xs, cy: Y(timeA(n)), r: 5.5 }, chart);
  Play.svg("circle", { class: "ptB", cx: xs, cy: Y(timeB(n, R)), r: 5.5 }, chart);
  renderRule();
}
function renderRule() {
  const R = Rv(), c = crossover(R), n = nAt(selX), ta = timeA(n), tb = timeB(n, R);
  $("rVal").textContent = P.t("rTimes", { r: nf(R) });
  $("perStep").textContent = P.t("perStep", { t: tf(R) });
  $("big").textContent = P.t("cross", { c: nf(c) });
  const w = tb < ta ? P.t("wB", { x: ratio(ta, tb) }) : ta < tb ? P.t("wA", { x: ratio(tb, ta) }) : P.t("wT");
  $("stepBody").textContent = P.t("b3") + " " + P.t("atN", { n: nf(n), lb: bitLen(n), tb: tf(tb), la: nf(n), ta: tf(ta), w });
  const t = $("table");
  t.innerHTML = "";
  addRow(t, [P.t("thN"), P.t("thB"), P.t("thA")], "th");
  for (let e = 1; e <= 9; e++) {
    const m = Math.pow(10, e), a = timeA(m), b = timeB(m, R);
    const tr = addRow(t, [nf(m), tf(b), tf(a)], "td", Math.round(selX) === e);
    tr.children[b < a ? 1 : 2].className = a === b ? "" : "w";
    tr.dataset.k = e;
    tr.addEventListener("click", () => { selX = e; renderChart(); });
  }
  const sn = $("sortNote");
  sn.innerHTML = "";
  const s = Math.round(n * Math.log2(n)), gain = n - bitLen(n);
  const a = document.createElement("a");
  a.href = "sorting-race.html" + (P.lang === "zh" ? "?lang=zh" : ""); a.textContent = P.t("sortLink");
  sn.append(P.t("sortA"), a, P.t("sortB", { n: nf(n), s: sig(s), n2: nf(n), k: gain > 0 ? nf(Math.ceil(s / gain)) : "—" }));
}
function chartPick(e) {
  const p = Play.pointer(chart, e), W = svgW(chart, 600), L = W < 420 ? 54 : 64;
  selX = Math.round(Play.clamp(1 + ((p.x - L) / (W - L - 14)) * 8, 1, 9) * 20) / 20;
  renderChart();
}
let chDrag = false;
chart.addEventListener("pointerdown", (e) => { chDrag = true; try { chart.setPointerCapture(e.pointerId); } catch (err) { /* ok */ } chartPick(e); });
chart.addEventListener("pointermove", (e) => { if (chDrag) chartPick(e); });
chart.addEventListener("pointerup", () => (chDrag = false));
chart.addEventListener("pointercancel", () => (chDrag = false));
chart.addEventListener("keydown", (e) => {
  const d = { ArrowLeft: -0.25, ArrowRight: 0.25, ArrowDown: -0.25, ArrowUp: 0.25 }[e.key];
  if (d) selX = Play.clamp(Math.round((selX + d) * 4) / 4, 1, 9);
  else if (e.key === "Home") selX = 1;
  else if (e.key === "End") selX = 9;
  else return;
  renderChart(); e.preventDefault();
});
$("rIn").addEventListener("input", () => { rk = +$("rIn").value; renderChart(); renderResult(); });
if ("ResizeObserver" in window) new ResizeObserver(() => { if (step === 2) renderChart(); if (step === 1 && mode === "g") renderGame(); if (step === 0) renderLadder(); }).observe(document.querySelector(".stage"));

function renderResult() {
  $("resultNote").textContent = P.t("resultNote", { h: bitLen(MILLION), r: nf(Rv()), c: nf(crossover(Rv())) });
}

/* ================= steps ================= */
const avg = MILLION / 2;   // one by one: (n + 1) / 2 on average, shown as “about n / 2”
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o20"), right: true }, { label: P.t("o1k") }, { label: P.t("o500k") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => setMsg($("pNums"), P.t("pNums", { h: bitLen(MILLION), n: nf(MILLION), avg: nf(avg) })));
const R0 = 1000, v2 = { r: nf(R0), tb: tf(timeB(MILLION, R0)), ta: tf(timeA(MILLION)) };
const pr2 = Play.predict($("predict2"), {
  q: P.t("q2", v2),
  options: [{ label: P.t("oA") }, { label: P.t("oB"), right: true }, { label: P.t("oT") }],
  right: P.t("right2", v2), wrong: P.t("wrong2", v2),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = i === 1 ? P.t(mode === "g" ? "b2g" : "b2l") : P.t("b" + k);
  $("keys").textContent = i === 1 ? P.t(mode === "g" ? "keys2g" : "keys2l") : P.t("keys" + k);
  $("predict").hidden = $("pNums").hidden = $("predict2").hidden = i !== 0;
  $("vLadder").hidden = i !== 0; $("vTry").hidden = i !== 1; $("vRace").hidden = i !== 2;
  $("sortNote").hidden = i !== 2;
  if (i !== 1) stopPlay();
  $("big").textContent = ""; $("table").innerHTML = "";
  if (i === 0) renderLadder();
  if (i === 1) setMode(mode);
  if (i === 2) renderChart();
});
$("reset").addEventListener("click", () => {
  stopPlay(); pr.reset(); pr2.reset(); setMsg($("pNums"), "");
  ladN = MILLION; ladShown = 1;
  gN = 100; $("coachOn").checked = true; newGame();
  newList(1); setMode("g");
  rk = 3; $("rIn").value = 3; selX = 6; renderResult();
  st.go(0);
});
newGame();
newList(1);
setMode("g");
renderResult();
renderLadder();
</script>
</body>

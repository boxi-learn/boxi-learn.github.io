<script id="logic">
/* Pure sorting logic (no DOM), checked in node.
   Every sort is a generator over an array a and a counter st = {cmp, mv}.
   It adds 1 to st.cmp and yields [i, j] (the two positions being compared) right before it
   reads the result of that comparison, so one next() = exactly one comparison. */
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* A list of the numbers 1…n: shuffled (Fisher–Yates), sorted, reversed, or nearly sorted
   (sorted, then about n/10 random neighbour swaps). */
function makeList(n, seed, kind) {
  const a = Array.from({ length: n }, (_, i) => i + 1);
  if (kind === "sorted") return a;
  if (kind === "reversed") return a.reverse();
  const r = mulberry32(seed);
  if (kind === "nearly") {
    if (n < 2) return a;
    const k = Math.max(1, Math.round(n / 10));
    for (let t = 0; t < k; t++) { const i = Math.floor(r() * (n - 1)); [a[i], a[i + 1]] = [a[i + 1], a[i]]; }
    return a;
  }
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Bubble sort: passes left to right swapping neighbours; each pass is one shorter;
   stops after a pass with no swap. */
function* bubble(a, st) {
  for (let end = a.length - 1; end > 0; end--) {
    let swapped = false;
    for (let i = 0; i < end; i++) {
      st.cmp++; yield [i, i + 1];
      if (a[i] > a[i + 1]) { [a[i], a[i + 1]] = [a[i + 1], a[i]]; st.mv++; swapped = true; }
    }
    if (!swapped) return;
  }
}
/* Insertion sort: take the next item and swap it left while its left neighbour is bigger. */
function* insertion(a, st) {
  for (let i = 1; i < a.length; i++) {
    for (let j = i; j > 0; j--) {
      st.cmp++; yield [j - 1, j];
      if (a[j - 1] > a[j]) { [a[j - 1], a[j]] = [a[j], a[j - 1]]; st.mv++; } else break;
    }
  }
}
/* Selection sort: find the smallest of the rest, swap it to the front of the rest. */
function* selection(a, st) {
  for (let i = 0; i < a.length - 1; i++) {
    let m = i;
    for (let j = i + 1; j < a.length; j++) { st.cmp++; yield [m, j]; if (a[j] < a[m]) m = j; }
    if (m !== i) { [a[i], a[m]] = [a[m], a[i]]; st.mv++; }
  }
}
/* Merge sort (top-down): sort each half, then merge by comparing the two front items.
   Drawn in place: when the right front item wins, the rest of the left half slides one
   place right so both fronts stay visible. The comparisons are exactly those of the usual
   merge; st.mv counts its writes (one per item placed). */
function* merge(a, st) {
  function* ms(lo, hi) {
    if (hi <= lo) return;
    const mid = (lo + hi) >> 1;
    yield* ms(lo, mid);
    yield* ms(mid + 1, hi);
    let i = lo, m = mid, j = mid + 1;
    while (i <= m && j <= hi) {
      st.cmp++; yield [i, j];
      if (a[j] < a[i]) { const v = a[j]; for (let t = j; t > i; t--) a[t] = a[t - 1]; a[i] = v; m++; j++; }
      i++; st.mv++;
    }
    st.mv += (m - i + 1) + (hi - j + 1);
  }
  yield* ms(0, a.length - 1);
}
const SORTS = { bubble, insertion, selection, merge };
const NAMES = ["bubble", "insertion", "selection", "merge"];
/* Run one sort to the end on a copy; returns { cmp, mv, out }. */
function count(name, list) {
  const a = list.slice(), st = { cmp: 0, mv: 0 };
  const g = SORTS[name](a, st);
  while (!g.next().done);
  return { cmp: st.cmp, mv: st.mv, out: a };
}
const isSorted = (a) => a.every((v, i) => i === 0 || a[i - 1] <= v);
const NS_CHART = [8, 16, 32, 64, 128, 256, 512, 1024];
const TRIALS = 3;
/* Measured comparisons for each n (mean of TRIALS seeded lists; sorted/reversed need one). */
function measure(kind) {
  const tr = kind === "random" || kind === "nearly" ? TRIALS : 1;
  const res = {};
  NAMES.forEach((s) => (res[s] = []));
  for (const n of NS_CHART) {
    const sum = { bubble: 0, insertion: 0, selection: 0, merge: 0 };
    for (let t = 0; t < tr; t++) {
      const list = makeList(n, 1000 + 7919 * t + n, kind);
      for (const s of NAMES) sum[s] += count(s, list).cmp;
    }
    for (const s of NAMES) res[s].push(Math.round(sum[s] / tr));
  }
  return res;
}
/* Fewest comparisons any method can promise for n items: ⌈log₂ n!⌉. */
function lowerBound(n) { let s = 0; for (let k = 2; k <= n; k++) s += Math.log2(k); return Math.ceil(s - 1e-9); }
const refSq = (n) => (n * n) / 2;
const refNlog = (n) => n * Math.log2(n);
/* Nice linear ticks from 0 to ≥ max. */
function niceTicks(max, want) {
  if (!(max > 0)) return [0, 1];
  const raw = max / want, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
  const out = [];
  for (let v = 0; v < max + step * 0.999; v += step) out.push(v);
  return out;
}
if (typeof module !== "undefined") module.exports = { mulberry32, makeList, SORTS, NAMES, count, isSorted, measure, lowerBound, refSq, refNlog, niceTicks, NS_CHART };
</script>

const $ = (id) => document.getElementById(id);
const LOC = P.lang === "zh" ? "zh-CN" : "en-US";
const nf = (x) => (Number.isFinite(x) ? Math.round(x).toLocaleString(LOC) : "—");
const ratio = (a, b) => (b > 0 ? Play.fmt(a / b, a / b >= 10 ? 0 : 1) : "—");
const LETTERS = "ABCDEFGH";
let step = 0;

/* ================= step 1: cards ================= */
let deck = [], dealSeed = 1, cmpK = 0, sel = -1, just = [], solved = false, dealList = [];
function deal(seed) {
  dealSeed = seed;
  const r = mulberry32(seed * 101 + 7), vals = new Set();
  while (vals.size < 8) vals.add(1 + Math.floor(r() * 99));
  const vs = [...vals];
  deck = vs.map((v, i) => ({ c: LETTERS[i], v }));
  dealList = vs.slice();
  cmpK = 0; sel = -1; just = []; solved = isSorted(vs);
  if (solved) return deal(seed + 1);   // never deal an already sorted row
  setMsg($("cMsg"), "");
  renderDeck();
  if (step === 0) renderCardTable();
}
function renderDeck() {
  const box = $("deck"), focusIdx = [...box.children].indexOf(document.activeElement);
  box.innerHTML = "";
  deck.forEach((d, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card8";
    b.classList.toggle("sel", i === sel);
    b.classList.toggle("just", just.includes(i));
    b.classList.toggle("won", solved);
    b.innerHTML = '<span class="lt"></span><span class="vv"></span>';
    b.firstChild.textContent = d.c;
    b.lastChild.textContent = solved ? d.v : "?";
    b.setAttribute("aria-label", P.t(solved ? "cardAriaV" : "cardAria", { c: d.c, v: d.v, p: i + 1 }));
    b.setAttribute("aria-pressed", i === sel ? "true" : "false");
    b.tabIndex = i === (focusIdx >= 0 ? focusIdx : 0) ? 0 : -1;
    b.addEventListener("click", () => pickCard(i));
    b.addEventListener("keydown", (e) => {
      const k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!k) return;
      const j = Play.clamp(i + k, 0, 7);
      [...box.children].forEach((x, m) => (x.tabIndex = m === j ? 0 : -1));
      box.children[j].focus();
      e.preventDefault();
    });
    box.appendChild(b);
  });
  if (focusIdx >= 0) box.children[focusIdx].focus();
  $("cCount").textContent = cmpK;
}
function pickCard(i) {
  if (solved) return;
  if (sel < 0) { sel = i; just = []; setMsg($("cMsg"), P.t("pickTwo", { c: deck[i].c })); renderDeck(); return; }
  if (sel === i) { sel = -1; setMsg($("cMsg"), ""); renderDeck(); return; }
  const lo = Math.min(sel, i), hi = Math.max(sel, i);
  cmpK++;
  const L = deck[lo], R = deck[hi];
  if (L.v > R.v) { deck[lo] = R; deck[hi] = L; setMsg($("cMsg"), P.t("swapped", { l: L.c, r: R.c })); }
  else setMsg($("cMsg"), P.t("kept", { l: L.c, r: R.c }));
  sel = -1; just = [lo, hi];
  solved = isSorted(deck.map((d) => d.v));
  if (solved) { just = []; setMsg($("cMsg"), P.t("sortedMsg", { k: cmpK }), "ok"); }
  renderDeck();
  renderCardTable();
}
function renderCardTable() {
  const t = $("table");
  t.innerHTML = "";
  if (!solved) { $("big").textContent = ""; return; }
  const rows = [[P.t("you"), cmpK, null]].concat(NAMES.map((s) => { const r = count(s, dealList); return [P.t(s), r.cmp, r.mv]; }));
  addRow(t, [P.t("thSort"), P.t("thCmp")], "th");
  rows.forEach((r, k) => addRow(t, [r[0], nf(r[1])], "td", k === 0));
  $("big").textContent = "";
  const p = document.createElement("p"); p.className = "note"; p.textContent = P.t("lbNote", { lb: lowerBound(8), f: nf([2, 3, 4, 5, 6, 7, 8].reduce((x, y) => x * y, 1)) });
  const tr = document.createElement("tr"), td = document.createElement("td"); td.colSpan = 2; td.style.whiteSpace = "normal"; td.style.textAlign = "left"; td.appendChild(p); tr.appendChild(td); t.appendChild(tr);
}
function addRow(t, cells, tag, on) {
  const tr = document.createElement("tr");
  if (on) tr.className = "on";
  cells.forEach((c) => { const x = document.createElement(tag); x.textContent = c; tr.appendChild(x); });
  t.appendChild(tr);
  return tr;
}
function setMsg(el, t, cls) { el.className = "msg" + (cls ? " " + cls : ""); Play.live(el, t); }

/* ================= step 2: race ================= */
let raceSeed = 1, raceKind = "random", raceN = 32, base = [], lanes = [], tick = 0, finCount = 0;
let playing = false, raf = 0, lastT = 0, acc = 0;
const raceBox = $("race");
NAMES.forEach((s) => {
  const lane = document.createElement("div");
  lane.className = "lane k-" + s;
  lane.innerHTML = '<div class="lh"><span class="dot k"></span><b></b><span class="tag"></span></div><svg preserveAspectRatio="none" aria-hidden="true"></svg><div class="lc"></div>';
  lane.querySelector("b").textContent = P.t(s);
  raceBox.appendChild(lane);
  lanes.push({ s, el: lane, svg: lane.querySelector("svg"), tag: lane.querySelector(".tag"), lc: lane.querySelector(".lc"), rects: [] });
});
function speed() { return Math.round(Math.pow(10, 0.3 + (+$("spIn").value / 100) * 2.4)); }  // 2 … 500 comparisons a second
function newRace() {
  stop();
  raceN = +$("nIn").value;
  base = makeList(raceN, raceSeed, raceKind);
  tick = 0; finCount = 0; acc = 0;
  lanes.forEach((L) => {
    L.a = base.slice(); L.st = { cmp: 0, mv: 0 }; L.g = SORTS[L.s](L.a, L.st); L.cur = null; L.done = false; L.rank = 0;
    L.svg.setAttribute("viewBox", `0 0 ${raceN * 10} 100`);
    L.svg.innerHTML = ""; L.rects = [];
    for (let i = 0; i < raceN; i++) L.rects.push(Play.svg("rect", { class: "bar", x: i * 10 + 1, width: 8 }, L.svg));
  });
  $("nVal").textContent = raceN;
  setMsg($("rMsg"), "");
  renderLists();
  renderRace();
}
function advance() {
  if (finCount === lanes.length) return false;
  tick++;
  let finishedNow = [];
  lanes.forEach((L) => {
    if (L.done) return;
    const r = L.g.next();
    if (r.done) { L.done = true; L.cur = null; finishedNow.push(L); } else L.cur = r.value;
  });
  // Lanes that finish on the same tick made the same number of comparisons, so they share a rank.
  if (finishedNow.length) { const r = finCount + 1; finishedNow.forEach((L) => (L.rank = r)); finCount += finishedNow.length; }
  return true;
}
function renderRace() {
  lanes.forEach((L) => {
    const c = L.cur || [];
    L.rects.forEach((rc, i) => {
      const h = (L.a[i] / raceN) * 96;
      rc.setAttribute("y", (100 - h).toFixed(2)); rc.setAttribute("height", h.toFixed(2));
      rc.classList.toggle("cmp", i === c[0] || i === c[1]);
    });
    L.el.classList.toggle("fin", L.done);
    L.tag.textContent = L.done ? "✓ " + P.t("done", { r: L.rank }) : "";
    L.lc.innerHTML = "";
    const b1 = document.createElement("b"); b1.textContent = nf(L.st.cmp);
    const b2 = document.createElement("b"); b2.textContent = nf(L.st.mv);
    L.lc.append(b1, " " + P.t("cmpL") + " · ", b2, " " + P.t(L.s === "merge" ? "wrL" : "swL"));
  });
  if (finCount === lanes.length) {
    const by = lanes.slice().sort((x, y) => x.st.cmp - y.st.cmp), best = by[0], worst = by[by.length - 1];
    let hint = { sorted: "hSorted", reversed: "hReversed", nearly: "hNearly", random: "hRandom" }[raceKind];
    if (raceKind === "random" && best.s !== "merge") hint = "hSmall";
    setMsg($("rMsg"), P.t("raceDone", { best: P.t(best.s), bc: nf(best.st.cmp), worst: P.t(worst.s), wc: nf(worst.st.cmp), x: ratio(worst.st.cmp, best.st.cmp) }) + " " + P.t(hint, { n1: nf(raceN - 1) }), "ok");
  } else if (tick > 0 && !playing) setMsg($("rMsg"), P.t("raceRun", { t: nf(tick) }));
  $("finish").disabled = $("stepBtn").disabled = finCount === lanes.length;
}
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; playing = false; $("play").textContent = P.t("play"); }
function play() {
  if (playing) { stop(); renderRace(); return; }
  if (finCount === lanes.length) newRace();
  playing = true; $("play").textContent = P.t("pause"); lastT = performance.now(); acc = 0;
  const frame = (now) => {
    acc += ((now - lastT) / 1000) * speed(); lastT = now;
    let k = Math.floor(acc); acc -= k;
    while (k-- > 0) if (!advance()) break;
    renderRace();
    if (finCount === lanes.length) { stop(); renderRace(); return; }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}
function stepRace() { stop(); advance(); renderRace(); }
function finishRace() { stop(); while (advance()); renderRace(); }
const LISTS = [["lRandom", "random"], ["lSorted", "sorted"], ["lReversed", "reversed"], ["lNearly", "nearly"]];
const listBtns = LISTS.map(([k, kind]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small preset"; b.textContent = P.t(k);
  b.addEventListener("click", () => { if (kind === "random" || kind === "nearly") raceSeed = 1 + Math.floor(Math.random() * 9999); raceKind = kind; newRace(); });
  $("lists").appendChild(b);
  return [b, kind];
});
const seedTag = document.createElement("span"); seedTag.className = "lbl"; $("lists").appendChild(seedTag);
function renderLists() {
  listBtns.forEach(([b, kind]) => { b.classList.toggle("on", kind === raceKind); b.setAttribute("aria-pressed", kind === raceKind ? "true" : "false"); });
  seedTag.textContent = raceKind === "random" || raceKind === "nearly" ? P.t("listNo", { s: raceSeed }) : "";
}
$("nIn").addEventListener("input", newRace);
$("spIn").addEventListener("input", () => ($("spVal").textContent = P.t("perSec", { v: speed() })));
$("play").addEventListener("click", play);
$("stepBtn").addEventListener("click", stepRace);
$("finish").addEventListener("click", finishRace);
$("restart").addEventListener("click", newRace);
raceBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") play(); else if (e.key === " ") stepRace(); else return;
  e.preventDefault();
});

/* ================= step 3: chart ================= */
const chart = $("chart"), cache = {};
let chartKind = "random", logY = false, selN = NS_CHART.length - 1;
function data() { return cache[chartKind] || (cache[chartKind] = measure(chartKind)); }
function renderChart() {
  const d = data();
  const W = Math.max(300, Math.round(chart.getBoundingClientRect().width) || 600), H = Math.max(260, Math.round(chart.getBoundingClientRect().height) || 340);
  chart.setAttribute("viewBox", `0 0 ${W} ${H}`);
  chart.innerHTML = "";
  const L = W < 420 ? 52 : 70, R = 16, T = 34, B = 40;
  const n0 = Math.log2(NS_CHART[0]), n1 = Math.log2(NS_CHART[NS_CHART.length - 1]);
  const X = (n) => L + ((Math.log2(n) - n0) / (n1 - n0)) * (W - L - R);
  let maxV = refSq(1024);
  NAMES.forEach((s) => d[s].forEach((v) => (maxV = Math.max(maxV, v))));
  const lo = 4, hi = Math.pow(10, Math.ceil(Math.log10(maxV)));
  const ticks = logY ? [10, 100, 1e3, 1e4, 1e5, 1e6].filter((v) => v <= hi) : niceTicks(maxV, W < 420 ? 4 : 5);
  const top = logY ? hi : ticks[ticks.length - 1];
  const Y = logY ? (v) => H - B - ((Math.log10(Math.max(v, lo)) - Math.log10(lo)) / (Math.log10(top) - Math.log10(lo))) * (H - B - T)
                 : (v) => H - B - (v / top) * (H - B - T);
  const short = (v) => P.lang === "zh" && v >= 1e4 ? v / 1e4 + "万" : v >= 1e6 ? v / 1e6 + "M" : v >= 1e3 ? v / 1e3 + "k" : String(v);
  ticks.forEach((v) => {
    Play.svg("line", { class: "ax", x1: L, x2: W - R, y1: Y(v), y2: Y(v) }, chart);
    Play.svg("text", { class: "axt", x: L - 6, y: Y(v) + 4, "text-anchor": "end" }, chart).textContent = short(v);
  });
  NS_CHART.forEach((n, k) => {
    const show = W >= 420 || k % 2 === 0 || n === 1024;
    if (show) Play.svg("text", { class: "axt", x: X(n), y: H - B + 18, "text-anchor": "middle" }, chart).textContent = n;
  });
  Play.svg("text", { class: "axt", x: W - R, y: H - 4, "text-anchor": "end" }, chart).textContent = P.t("axN");
  Play.svg("text", { class: "axt", x: 4, y: 16 }, chart).textContent = P.t("axC");
  // reference curves
  const curve = (f) => { const pts = []; for (let t = n0; t <= n1 + 1e-9; t += 0.05) { const n = Math.pow(2, t); pts.push(X(n).toFixed(1) + "," + Y(f(n)).toFixed(1)); } return pts.join(" "); };
  Play.svg("polyline", { class: "ref", points: curve(refSq) }, chart);
  Play.svg("polyline", { class: "ref", points: curve(refNlog) }, chart);
  const lab = (txt, n, f, dy) => Play.svg("text", { class: "reflab", x: X(n) - 4, y: Y(f(n)) + dy, "text-anchor": "end" }, chart).textContent = txt;
  lab("n²/2", logY ? 362 : 724, refSq, logY ? -10 : 0);
  lab("n·log₂n", logY ? 362 : 1024, refNlog, logY ? 20 : -8);
  // guide at the selected n
  const sn = NS_CHART[selN];
  Play.svg("line", { class: "guide", x1: X(sn), x2: X(sn), y1: T, y2: H - B }, chart);
  NAMES.forEach((s) => {
    const g = Play.svg("g", { class: "k-" + s }, chart);
    Play.svg("polyline", { class: "ser", points: NS_CHART.map((n, k) => X(n).toFixed(1) + "," + Y(d[s][k]).toFixed(1)).join(" ") }, g);
    NS_CHART.forEach((n, k) => Play.svg("circle", { class: "pt", cx: X(n), cy: Y(d[s][k]), r: k === selN ? 5.5 : 3.5 }, g));
  });
  chart.dataset.x = JSON.stringify(NS_CHART.map((n) => X(n) / W));
  renderRule();
}
function renderRule() {
  const d = data(), n = NS_CHART[selN], k = selN;
  const [sa, sb] = chartKind === "nearly" ? ["merge", "insertion"] : ["bubble", "merge"];
  $("big").textContent = P.t("bigRule", { n, an: P.t("sh_" + sa), bn: P.t("sh_" + sb), b: nf(d[sa][k]), m: nf(d[sb][k]), x: ratio(d[sa][k], d[sb][k]) });
  const t = $("table");
  t.innerHTML = "";
  addRow(t, ["n"].concat(NAMES.map((s) => P.t("sh_" + s))), "th");
  NS_CHART.forEach((nn, j) => {
    const tr = addRow(t, [nn].concat(NAMES.map((s) => nf(d[s][j]))), "td", j === selN);
    tr.dataset.n = j;
    tr.addEventListener("click", () => { selN = j; renderChart(); });
  });
  let body = P.t("b3") + " " + P.t("atN", { n, x: ratio(d.bubble[k], d.merge[k]) });
  if (chartKind === "nearly") body = P.t("b3") + " " + P.t("atNearly", { n, i: nf(d.insertion[k]), m: nf(d.merge[k]), b: nf(d.bubble[k]) });
  if (chartKind === "reversed") body = P.t("b3") + " " + P.t("atRev", { n, s: nf((n * (n - 1)) / 2) });

}
function chartPick(e) {
  const r = chart.getBoundingClientRect(), xs = JSON.parse(chart.dataset.x || "[]");
  const src = e.touches ? e.touches[0] : e, f = (src.clientX - r.left) / r.width;
  let best = 0;
  xs.forEach((x, k) => { if (Math.abs(x - f) < Math.abs(xs[best] - f)) best = k; });
  if (best !== selN) { selN = best; renderChart(); }
}
chart.addEventListener("pointerdown", chartPick);
chart.addEventListener("pointermove", (e) => { if (e.buttons) chartPick(e); });
chart.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  selN = Play.clamp(selN + (e.key === "ArrowRight" ? 1 : -1), 0, NS_CHART.length - 1);
  renderChart(); e.preventDefault();
});
const KINDS = [["kRandom", "random"], ["kNearly", "nearly"], ["kReversed", "reversed"]];
const kindBtns = KINDS.map(([k, kind]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small preset"; b.textContent = P.t(k);

}
$("sLin").addEventListener("click", () => { logY = false; renderKinds(); renderChart(); });
$("sLog").addEventListener("click", () => { logY = true; renderKinds(); renderChart(); });
NAMES.forEach((s) => {
  const sp = document.createElement("span"); sp.className = "k-" + s;
  sp.innerHTML = '<span class="dot k"></span>'; sp.appendChild(document.createTextNode(P.t(s)));
  $("legend").appendChild(sp);
});
const refL = document.createElement("span"); refL.innerHTML = '<span class="dash"></span>n²/2, n·log₂n'; $("legend").appendChild(refL);
if ("ResizeObserver" in window) new ResizeObserver(() => { if (step === 2) renderChart(); }).observe(chart);

/* ================= steps ================= */
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("oB") }, { label: P.t("oM"), right: true }, { label: P.t("oS") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => {
  const list = makeList(100, 100, "random"), b = count("bubble", list).cmp, m = count("merge", list).cmp;
  setMsg($("pNums"), P.t("pNums", { b: nf(b), m: nf(m), x: ratio(b, m) }));
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("keys").textContent = P.t("keys" + k);
  $("predict").hidden = $("pNums").hidden = i !== 0;
  $("vCards").hidden = i !== 0; $("vRace").hidden = i !== 1; $("vChart").hidden = i !== 2;
  if (i !== 1) stop();
  $("big").textContent = ""; $("table").innerHTML = "";
  if (i === 0) renderCardTable();
  if (i === 1) renderRace();
  if (i === 2) { renderKinds(); renderChart(); }
});
$("deal").addEventListener("click", () => deal(dealSeed + 1));
$("reset").addEventListener("click", () => {
  stop(); pr.reset(); setMsg($("pNums"), "");
  raceSeed = 1; raceKind = "random"; $("nIn").value = 32; $("spIn").value = 45;
  $("spVal").textContent = P.t("perSec", { v: speed() });
  chartKind = "random"; logY = false; selN = NS_CHART.length - 1;
  deal(1); newRace(); st.go(0);
});
$("spVal").textContent = P.t("perSec", { v: speed() });
deal(1);
newRace();
</script>
</body>
</html>

<script id="logic">
/* Pure logic (no DOM) so it can be checked in node. */
const MIN_CARDS = 5, MAX_CARDS = 8, MAX_DEC = 2 ** MAX_CARDS - 1;
const cleanN = (n) => (Number.isFinite(+n) ? Math.min(MAX_CARDS, Math.max(MIN_CARDS, Math.round(+n))) : MIN_CARDS);
const maxFor = (n) => 2 ** cleanN(n) - 1;
/* Place values, left card first: n = 5 → [16, 8, 4, 2, 1]. */
const placeValues = (n) => Array.from({ length: cleanN(n) }, (_, i) => 2 ** (cleanN(n) - 1 - i));
const cleanV = (v, n) => (Number.isFinite(+v) ? Math.min(maxFor(n), Math.max(0, Math.floor(+v))) : 0);
const toBin = (v, n) => cleanV(v, n).toString(2).padStart(cleanN(n), "0");
const bitsNeeded = (v) => (Number.isFinite(+v) && +v > 0 ? Math.floor(+v).toString(2).length : 1);
/* Cards that are face up for value v, biggest first: 13 → [8, 4, 1]. */
function partsOf(v) {
  const out = [];
  let x = Number.isFinite(+v) && +v > 0 ? Math.floor(+v) : 0;
  for (let p = 2 ** bitsNeeded(x) / 2; p >= 1; p /= 2) if (x >= p) { out.push(p); x -= p; }
  return out;
}
const sumText = (v) => { const p = partsOf(v); return p.length ? p.join(" + ") : "0"; };
/* +1 on the cards: which cards go down (the trailing 1s) and which goes up (the first 0). */
function increment(v, n) {
  const x = cleanV(v, n), max = maxFor(n);
  if (x >= max) return { next: x, up: [], down: [], overflow: true };
  const changed = x ^ (x + 1), up = [], down = [];
  placeValues(n).forEach((p) => { if (changed & p) (x & p ? down : up).push(p); });
  return { next: x + 1, up, down, overflow: false };
}
/* Converter input. Decimal: whole number 0–255. Binary: only 0/1, 1–8 digits (spaces ignored). */
function parseDec(s) {
  const t = String(s == null ? "" : s).trim();
  if (t === "") return { empty: true };
  if (!/^[0-9]{1,3}$/.test(t) || +t > MAX_DEC) return { ok: false };
  return { ok: true, v: +t };
}
function parseBin(s) {
  const t = String(s == null ? "" : s).replace(/\s+/g, "");
  if (t === "") return { empty: true };
  if (!/^[01]+$/.test(t) || t.length > MAX_CARDS) return { ok: false };
  return { ok: true, v: parseInt(t, 2), bits: t };
}
/* Decimal digits with their place values: 205 → [[2,100],[0,10],[5,1]] (always 3 places for 0–255). */
function decDigits(v) {
  const x = Number.isFinite(+v) ? Math.min(MAX_DEC, Math.max(0, Math.floor(+v))) : 0;
  return [100, 10, 1].map((p) => [Math.floor(x / p) % 10, p]);
}
/* Dots on a card: try every column count that fills whole rows (easy to count), keep the biggest cell. */
function dotGrid(count, w, h) {
  let best = { cols: 1, rows: Math.max(1, count), cell: 0 };
  for (let cols = 1; cols <= Math.max(1, count); cols++) {
    if (count % cols) continue;
    const rows = Math.ceil(count / cols), cell = Math.min(w / cols, h / rows);
    if (cell > best.cell + 1e-9) best = { cols, rows, cell };
  }
  return best;
}
function dotPositions(count, x, y, w, h) {
  if (!(count > 0) || !(w > 0) || !(h > 0)) return [];
  const g = dotGrid(count, w, h), r = Math.min(14, g.cell * 0.38);
  const ox = x + (w - g.cols * g.cell) / 2, oy = y + (h - g.rows * g.cell) / 2, out = [];
  for (let i = 0; i < count; i++) {
    const c = i % g.cols, rw = Math.floor(i / g.cols);
    out.push({ cx: ox + (c + 0.5) * g.cell, cy: oy + (rw + 0.5) * g.cell, r });
  }
  return out;
}
if (typeof module !== "undefined") module.exports = { MIN_CARDS, MAX_CARDS, MAX_DEC, cleanN, maxFor, placeValues, cleanV, toBin, bitsNeeded, partsOf, sumText, increment, parseDec, parseBin, decDigits, dotGrid, dotPositions };
</script>

const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = Play.svg;
const START_N = 5;
const CHALLENGES = [13, 21, 31];
const VH = 330, PAD = 14, CARD_Y = 54, CARD_H = 210, BIT_Y = 306;

let VW = 600, n = START_N, value = maxFor(START_N), step = 0, focusIdx = 0, target = null, timer = null;
const done = new Set();
let cards = [];
if (Play.reduced) document.body.classList.add("noanim");

/* ---------- figure ---------- */
/* Narrow screens get a narrower viewBox, so labels stay at least ~13 px on a phone. */
function fitWidth() {
  const r = fig.getBoundingClientRect();
  return r.width > 0 && r.height > 0 ? Math.round(Play.clamp((r.width * VH) / r.height, 360, 600)) : 600;
}
function build() {
  VW = fitWidth();
  fig.setAttribute("viewBox", `0 0 ${VW} ${VH}`);
  fig.innerHTML = "";
  const pv = placeValues(n), slot = (VW - 2 * PAD) / n, cw = Math.min(96, slot - 12);
  cards = pv.map((p, i) => {
    const cx = PAD + slot * (i + 0.5), x = cx - cw / 2;
    if (i > 0) S("text", { class: "x2", x: PAD + slot * i, y: 22 }, fig).textContent = "←×2";
    const g = S("g", { class: "cd", tabindex: i === focusIdx ? 0 : -1, role: "switch" }, fig);
    S("text", { class: "lab", x: cx, y: 44 }, g).textContent = p;
    S("rect", { class: "flash", x: x - 6, y: CARD_Y - 6, width: cw + 12, height: CARD_H + 12, rx: 13 }, g);
    const f = S("g", { class: "face-f" }, g);
    S("rect", { x, y: CARD_Y, width: cw, height: CARD_H, rx: 9 }, f);
    const ip = Math.min(7, cw * 0.12);
    dotPositions(p, x + ip, CARD_Y + 8, cw - 2 * ip, CARD_H - 16).forEach((d) => S("circle", { cx: d.cx, cy: d.cy, r: d.r }, f));
    const b = S("g", { class: "face-b" }, g);
    S("rect", { x, y: CARD_Y, width: cw, height: CARD_H, rx: 9 }, b);
    S("rect", { class: "pat", x: x + 8, y: CARD_Y + 8, width: cw - 16, height: CARD_H - 16, rx: 5 }, b);
    const m = Math.min(cw - 16, 60) / 2;
    S("path", { class: "pat", d: `M${cx} ${CARD_Y + CARD_H / 2 - m}L${cx + m} ${CARD_Y + CARD_H / 2}L${cx} ${CARD_Y + CARD_H / 2 + m}L${cx - m} ${CARD_Y + CARD_H / 2}Z` }, b);
    S("rect", { class: "ring", x: x - 4, y: CARD_Y - 4, width: cw + 8, height: CARD_H + 8, rx: 11 }, g);
    const bit = S("text", { class: "bit", x: cx, y: BIT_Y }, g);
    g.addEventListener("click", () => { focusIdx = i; flip(i); });
    g.addEventListener("keydown", (e) => onKey(e, i));
    return { g, bit, p };
  });
}
function paint() {
  cards.forEach((c, i) => {
    const up = (value & c.p) !== 0;
    c.g.classList.toggle("up", up);
    c.g.setAttribute("aria-checked", up ? "true" : "false");
    c.g.setAttribute("aria-label", P.t("cardAria", { p: c.p, dir: P.t(up ? "up" : "down") }));
    c.g.setAttribute("tabindex", i === focusIdx ? 0 : -1);
    c.bit.textContent = up ? "1" : "0";
  });
  $("dots").textContent = value;
  $("bin").textContent = toBin(value, n);
  $("sum").textContent = partsOf(value).length > 1 ? sumText(value) + " = " + value : "";
  $("ncards").value = n;
  $("ncardsV").textContent = P.t("cardsVal", { n, max: maxFor(n) });
  $("byte").hidden = !(n === MAX_CARDS && step === 1);
  paintChallenges();
  if (step === 2) paintRule();
}
function clearFlash() { cards.forEach((c) => c.g.classList.remove("just")); }
const msg = $("live");
const say = (t) => Play.live(msg, t);

/* ---------- actions ---------- */
function stopPlay() {
  if (timer) clearInterval(timer);
  timer = null;
  $("play").textContent = P.t("playB");
  $("play").setAttribute("aria-pressed", "false");
}
function checkTarget() {
  if (target === null || value !== target) return false;
  done.add(target);
  say(P.t("chalDone", { t: target, sum: sumText(target), bin: toBin(target, n) }));
  return true;
}
function setCard(i, up) {
  const p = cards[i].p, was = (value & p) !== 0;
  if (was === up) return;
  stopPlay(); clearFlash();
  value = up ? value | p : value & ~p;
  paint();
  if (!checkTarget() && step > 0) say(P.t("liveFlip", { p, dir: P.t(up ? "up" : "down"), v: value, bin: toBin(value, n) }));
}
const flip = (i) => setCard(i, (value & cards[i].p) === 0);
function onKey(e, i) {
  const k = e.key;
  const moveTo = (j) => { focusIdx = Play.clamp(j, 0, n - 1); paint(); cards[focusIdx].g.focus(); };
  if (k === "ArrowLeft") moveTo(i - 1);
  else if (k === "ArrowRight") moveTo(i + 1);
  else if (k === "Home") moveTo(0);
  else if (k === "End") moveTo(n - 1);
  else if (k === " " || k === "Enter") flip(i);
  else if (k === "ArrowUp") setCard(i, true);
  else if (k === "ArrowDown") setCard(i, false);
  else return;
  e.preventDefault();
}
function plusOne() {
  const r = increment(value, n);
  clearFlash();
  if (r.overflow) { stopPlay(); say(P.t("full", { n, max: maxFor(n), next: maxFor(n) + 1 })); return false; }
  const a = value;
  value = r.next;
  paint();
  r.down.concat(r.up).forEach((p) => cards[n - 1 - Math.log2(p)].g.classList.add("just"));
  if (checkTarget()) return true;
  const list = r.down.slice().reverse().map((p) => P.t("flipDown", { p })).concat(r.up.map((p) => P.t("flipUp", { p })));
  say(P.t("liveCount", { a, b: value, list: list.join(P.lang === "zh" ? "，" : ", ") }) + (r.down.length ? P.t("ripple") : ""));
  return true;
}
function setN(k) {
  const nn = cleanN(k);
  if (nn === n) return;
  stopPlay();
  n = nn;
  value = cleanV(value & maxFor(n), n);
  focusIdx = Math.min(focusIdx, n - 1);
  build(); paint();
}
function setValue(v) {
  stopPlay(); clearFlash();
  if (bitsNeeded(v) > n) { n = cleanN(bitsNeeded(v)); build(); }
  value = cleanV(v, n);
  paint();
}

$("plus1").addEventListener("click", () => { stopPlay(); plusOne(); });
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  if (value >= maxFor(n)) { value = 0; paint(); }
  $("play").textContent = P.t("pauseB");
  $("play").setAttribute("aria-pressed", "true");
  timer = setInterval(() => { if (!plusOne() || value >= maxFor(n)) { if (timer) { clearInterval(timer); timer = null; } $("play").textContent = P.t("playB"); $("play").setAttribute("aria-pressed", "false"); } }, Play.reduced ? 1200 : 800);
});
$("zero").addEventListener("click", () => { setValue(0); say(P.t("liveZero", { bin: toBin(0, n) })); });
$("ncards").addEventListener("input", () => setN($("ncards").value));

/* challenges */
const chalBtns = CHALLENGES.map((t) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = t;
  b.addEventListener("click", () => { target = t; paintChallenges(); if (!checkTarget()) say(P.t("chalStart", { t })); });
  $("chalRow").appendChild(b);
  return [t, b];
});
function paintChallenges() {
  chalBtns.forEach(([t, b]) => {
    b.classList.toggle("done", done.has(t));
    b.classList.toggle("on", t === target && !done.has(t));
    b.setAttribute("aria-pressed", t === target ? "true" : "false");
  });
}

/* ---------- step 3: place values + converter ---------- */
function gridRow(el, places, digits) {
  el.innerHTML = "";
  el.style.gridTemplateColumns = `repeat(${places.length}, minmax(0, 1fr))`;
  places.forEach((p) => { const s = document.createElement("span"); s.className = "pl"; s.textContent = p; el.appendChild(s); });
  digits.forEach((d) => { const s = document.createElement("span"); s.className = "dg" + (d ? " one" : ""); s.textContent = d; el.appendChild(s); });
}
function paintRule() {
  const dd = decDigits(value);
  gridRow($("decGrid"), dd.map((x) => x[1]), dd.map((x) => x[0]));
  $("decEx").textContent = value + " = " + dd.map(([d, p]) => d + " × " + p).join(" + ");
  const pv = placeValues(n), bits = toBin(value, n).split("").map(Number);
  gridRow($("binGrid"), pv, bits);
  $("binEx").textContent = value + " = " + pv.map((p, i) => bits[i] + " × " + p).join(" + ");
}
function showOut(el, input, text, err) {
  el.textContent = text;
  el.classList.toggle("err", !!err);
  input.setAttribute("aria-invalid", err ? "true" : "false");
}
$("decIn").addEventListener("input", () => {
  const r = parseDec($("decIn").value);
  if (r.empty) return showOut($("decOut"), $("decIn"), "", false);
  if (!r.ok) return showOut($("decOut"), $("decIn"), P.t("errDec", { max: MAX_DEC }), true);
  setValue(r.v);
  showOut($("decOut"), $("decIn"), P.t("okDec", { d: r.v, b: r.v.toString(2), sum: sumText(r.v) }), false);
});
$("binIn").addEventListener("input", () => {
  const r = parseBin($("binIn").value);
  if (r.empty) return showOut($("binOut"), $("binIn"), "", false);
  if (!r.ok) return showOut($("binOut"), $("binIn"), P.t("errBin", { n: MAX_CARDS }), true);
  setValue(r.v);
  showOut($("binOut"), $("binIn"), P.t("okBin", { b: r.bits, d: r.v, sum: sumText(r.v) }), false);
});

/* ---------- byte note with link to the pixels page ---------- */
(function () {
  const el = $("byte"), a = document.createElement("a");
  el.textContent = P.t("byte", { n: MAX_CARDS, max: MAX_DEC });
  a.href = "pixels-rgb.html?lang=" + P.lang;
  a.target = "_blank"; a.rel = "noopener";
  a.textContent = P.t("byteLink");
  el.append(a, P.lang === "zh" ? "。" : ".");
})();

/* ---------- steps ---------- */
const list5 = placeValues(START_N).join(", ");
const pr = Play.predict($("predict"), {
  q: P.t("q", { n: START_N }),
  options: [{ label: String(START_N) }, { label: String(placeValues(START_N)[0]) }, { label: String(maxFor(START_N)), right: true }, { label: P.t("oMis") }],
  right: P.t("right", { sum: placeValues(START_N).join(" + "), max: maxFor(START_N) }),
  wrong: P.t("wrong"),
}, (i) => { if (i === 3) $("predict").querySelector(".fb").textContent = P.t("wrongMis"); });
const top5 = placeValues(START_N)[0];
const nq = Play.predict($("nextQ"), {
  q: P.t("nextQ", { top: top5 }),
  options: [top5 + 1, top5 + 4, 2 * top5, 4 * top5].map((v) => ({ label: String(v), right: v === 2 * top5 })),
  right: P.t("nextRight", { top: top5, next: 2 * top5 }),
  wrong: P.t("nextWrong", { list: placeValues(START_N).slice().reverse().join(", ") }),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  stopPlay(); clearFlash();
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, { list: list5 });
  $("predict").hidden = i !== 0;
  $("pane").hidden = i === 0;
  $("countRow").hidden = $("chalRow").hidden = $("nextQ").hidden = i !== 1;
  $("ruleBox").hidden = i !== 2;
  $("keys").textContent = P.t("keys");
  say("");
  paint();
});

const exV = parseInt("10110", 2);
$("resultMain").textContent = P.t("resultMain", { list: "…, " + placeValues(START_N).join(", ") });
$("resultNote").textContent = P.t("resultNote", { ex: "10110 = " + sumText(exV) + " = " + exV });
$("foot").textContent = P.t("foot", { n: MAX_CARDS, count: MAX_DEC + 1, max: MAX_DEC });

function fresh() {
  stopPlay();
  n = START_N; value = maxFor(START_N); focusIdx = 0; target = null; done.clear();
  ["decIn", "binIn"].forEach((id) => { $(id).value = ""; });
  showOut($("decOut"), $("decIn"), "", false); showOut($("binOut"), $("binIn"), "", false);
  build();
}
$("reset").addEventListener("click", () => { fresh(); pr.reset(); nq.reset(); say(""); st.go(0); });
fresh();
paint();
if ("ResizeObserver" in window) new ResizeObserver(() => { if (fitWidth() !== VW) { build(); paint(); } }).observe(fig);
</script>
</body>

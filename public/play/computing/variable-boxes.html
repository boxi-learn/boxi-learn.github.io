<script id="logic">
/* Pure logic (no DOM), testable in node. A tiny interpreter for programs like
     a = 3          (put a number in a box)
     a = b          (copy what is in b into a; b keeps it)
     score = score + 1
     repeat 3:      (the indented lines below run 3 times)
       score = score + 1
   A box holds one value. Assigning throws the old value away. Reading an empty box is an error. */
const NAME = /^[a-z][a-z0-9_]*$/;
const MAXOPS = 200;
function parseLine(src) {
  const indent = src.match(/^ */)[0].length, s = src.trim(), bad = { indent, kind: "bad" };
  let m = s.match(/^repeat\s+(\d+)\s*:$/);
  if (m) return { indent, kind: "repeat", n: +m[1] };
  m = s.match(/^([a-z][a-z0-9_]*)\s*=\s*(.+)$/);
  if (!m) return bad;
  const toks = m[2].match(/[a-z][a-z0-9_]*|\d+|\S/g) || [], terms = [], ops = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (i % 2 === 0) {
      if (/^\d+$/.test(t)) terms.push({ num: +t });
      else if (NAME.test(t)) terms.push({ v: t });
      else return bad;
    } else if (t === "+" || t === "-") ops.push(t);
    else return bad;
  }
  if (!terms.length || terms.length !== ops.length + 1) return bad;
  return { indent, kind: "set", target: m[1], terms, ops };
}
/* Flatten into the list of assignments actually executed, unrolling repeat blocks. */
function compile(lines) {
  const L = lines.map(parseLine), out = [];
  function block(from, to, loop) {
    for (let i = from; i < to && out.length < MAXOPS;) {
      const p = L[i];
      if (p.kind === "repeat") {
        let j = i + 1;
        while (j < to && L[j].indent > p.indent) j++;
        for (let r = 0; r < p.n && out.length < MAXOPS; r++) block(i + 1, j, { line: i, k: r + 1, n: p.n });
        i = j;
      } else { out.push(Object.assign({ line: i, loop }, p)); i++; }
    }
  }
  block(0, L.length, null);
  return out;
}
/* Value of the right-hand side, or the name of the empty box it tried to read. */
function evalExpr(op, env) {
  let v = 0;
  for (let k = 0; k < op.terms.length; k++) {
    const t = op.terms[k];
    let x;
    if ("num" in t) x = t.num;
    else { if (env[t.v] == null) return { err: "empty", name: t.v }; x = env[t.v]; }
    v = k === 0 ? x : op.ops[k - 1] === "+" ? v + x : v - x;
  }
  return { v };
}
const isCopy = (op) => op.terms.length === 1 && "v" in op.terms[0];
/* One entry per executed line: { op, value, old, env (after), gone (all thrown-away values so far) }.
   An error adds one entry { op, err, name } and stops. */
function trace(lines, init) {
  let env = Object.assign({}, init || {}), gone = [];
  const out = [];
  for (const op of compile(lines)) {
    if (op.kind === "bad") { out.push({ op, err: "syntax", env, gone }); break; }
    const r = evalExpr(op, env);
    if (r.err) { out.push({ op, err: r.err, name: r.name, env, gone }); break; }
    const old = env[op.target];
    env = Object.assign({}, env, { [op.target]: r.v });
    if (old != null) gone = gone.concat([{ v: old, from: op.target, line: op.line }]);
    out.push({ op, value: r.v, old, env, gone });
  }
  return out;
}
function finalEnv(lines, init) {
  const t = trace(lines, init), last = t[t.length - 1];
  return { env: last ? last.env : Object.assign({}, init || {}), err: last && last.err ? last : null };
}
const meets = (env, goal) => Object.keys(goal).every((k) => env[k] === goal[k]);
/* First executed line (from index `from` on) after which some needed value is no longer in any box. */
function lostAt(states, needed, from) {
  for (let k = from || 0; k < states.length; k++) {
    if (states[k].err) return null;
    const have = Object.values(states[k].env);
    const v = needed.find((x) => !have.includes(x));
    if (v !== undefined) return { k, v, line: states[k].op.line };
  }
  return null;
}
/* Every arrangement reachable with copy lines "x = y" between the given boxes (breadth first).
   Returns [{ env, dist, prog }]; reading an empty box is not allowed. */
function reach(vars, start) {
  const key = (e) => vars.map((v) => (e[v] == null ? "_" : e[v])).join(",");
  const seen = new Map([[key(start), { env: start, dist: 0, prog: [] }]]), queue = [start];
  while (queue.length) {
    const e = queue.shift(), node = seen.get(key(e));
    for (const t of vars) for (const s of vars) {
      if (t === s || e[s] == null) continue;
      const n = Object.assign({}, e, { [t]: e[s] }), kk = key(n);
      if (!seen.has(kk)) { seen.set(kk, { env: n, dist: node.dist + 1, prog: node.prog.concat([t + " = " + s]) }); queue.push(n); }
    }
  }
  return [...seen.values()];
}
function shortest(vars, start, goal) {
  const hits = reach(vars, start).filter((r) => meets(r.env, goal));
  return hits.length ? hits.reduce((a, b) => (b.dist < a.dist ? b : a)) : null;
}
const DEMO = ["a = 3", "b = 5", "a = b", "b = a"];
const SCORE = ["score = 0", "repeat 3:", "  score = score + 1"];
const LEVELS = [
  { key: "swap", vars: ["a", "b", "temp"], init: { a: 3, b: 5 } },
  { key: "rotate", vars: ["a", "b", "c", "temp"], init: { a: 4, b: 7, c: 2 } },
];
LEVELS[0].goal = { a: LEVELS[0].init.b, b: LEVELS[0].init.a };
LEVELS[1].goal = { a: LEVELS[1].init.b, b: LEVELS[1].init.c, c: LEVELS[1].init.a };
LEVELS.forEach((l) => { l.locked = Object.keys(l.init).map((k) => k + " = " + l.init[k]); });
const MAXUSER = 8;
if (typeof module !== "undefined") module.exports = { parseLine, compile, evalExpr, trace, finalEnv, meets, lostAt, reach, shortest, DEMO, SCORE, LEVELS, MAXUSER, isCopy };
</script>

    resultNote: "变量一次只装一个值。放进新值，旧值就被扔掉——所以要交换两个盒子，得先把一个值存进第三个盒子。",
    explainK: "说一说",
    explainQ: "朋友想交换两个数，写了 a = b 再写 b = a，结果两个数一样了。跟他讲讲第一个数去哪了，第三个盒子为什么能解决问题。",
    homeK: "家里做一做",
    homeQ: "两个杯子，一杯水，一杯果汁。把两杯里的东西对调。你需要什么？把每一步写成一行，比如「空杯 = 水杯」。",
    foot: "CC BY 4.0 · Boxi Yu · 这里的程序像 Python 等很多语言一样用「=」，意思是「存进去」，不是「相等」（有的语言写成 := 或 ←）。这里读空盒子会出错；很多真实的语言（比如 Python）用一个从没赋过值的变量也会报错，也有的语言（比如 C）不报错，只拿出里面留下的随机值。第 3 步的数字是把所有只含复制行的程序都试一遍（广度优先搜索）得出的。关于变量的常见误解（一个盒子装两个值、把「=」当方程、以为 a = b; b = a 能交换）见 du Boulay（1986）《Some difficulties of learning to program》，Journal of Educational Computing Research 第 2 卷第 1 期。",
  },
});

const $ = (id) => document.getElementById(id);
const fig = $("fig"), codeEl = $("code"), msg = $("live");
const SP = P.lang === "zh" ? "" : " ", LS = P.lang === "zh" ? "，" : ", ";
const W = 420, BW = 80, BH = 78, BY = 52;

/* ---------- state ---------- */
let step = 0, lvIdx = 0, picked = false, sel = null;
let user = {}, solved = {};
let ex = null, running = false, timer = null, anim = null;

function fresh() { user = { swap: [], rotate: [] }; solved = {}; sel = null; }
const lv = () => LEVELS[lvIdx];
function program() {
  if (step === 0) return { lines: DEMO, locked: 0, vars: ["a", "b"] };
  if (step === 2) return { lines: SCORE, locked: 0, vars: ["score"] };
  return { lines: lv().locked.concat(user[lv().key]), locked: lv().locked.length, vars: lv().vars };
}

/* ---------- execution ---------- */
function prepare() {
  const pg = program(), states = trace(pg.lines, {});
  let i0 = 0;
  while (i0 < states.length && states[i0].op.line < pg.locked && !states[i0].err) i0++;
  ex = { pg, states, i: i0, i0 };
}
const envAt = (i) => (i > 0 ? ex.states[i - 1].env : {});
const goneAt = (i) => (i > 0 ? ex.states[i - 1].gone : []);

/* ---------- drawing ---------- */
function boxX(k, n) { const gap = (W - n * BW) / (n + 1); return gap + k * (BW + gap); }
function centre(name) {
  const vars = ex.pg.vars, k = vars.indexOf(name);
  return { x: boxX(k, vars.length) + BW / 2, y: BY + BH / 2 + 4 };
}
let gVals = {};
function draw(i, hiName, hideName) {
  fig.innerHTML = "";
  const vars = ex.pg.vars, env = envAt(i), goal = step === 1 ? lv().goal : null;
  gVals = {};
  vars.forEach((name, k) => {
    const x = boxX(k, vars.length);
    Play.svg("rect", { class: "boxfill" + (name === hiName ? " hi" : ""), x, y: BY, width: BW, height: BH, rx: 4 }, fig);
    Play.svg("path", { class: "boxedge", d: `M${x} ${BY - 6}V${BY + BH}H${x + BW}V${BY - 6}` }, fig);
    const tw = Math.max(46, 12 * name.length + 18);
    Play.svg("rect", { class: "tag", x: x + BW / 2 - tw / 2, y: BY + BH + 8, width: tw, height: 26, rx: 6 }, fig);
    Play.svg("text", { class: "tagtx", x: x + BW / 2, y: BY + BH + 21 }, fig).textContent = name;
    const v = env[name], c = centre(name);
    if (name !== hideName) {
      const t = Play.svg("text", { class: v == null ? "emptytx" : "valtx", x: c.x, y: c.y }, fig);
      t.textContent = v == null ? P.t("empty") : v;
      gVals[name] = t;
    }
    if (goal && name in goal) {
      Play.svg("text", { class: "wanttx" + (env[name] === goal[name] ? " ok" : ""), x: c.x, y: BY + BH + 52 }, fig)
        .textContent = P.t("want", { v: goal[name] }) + (env[name] === goal[name] ? " ✓" : "");
    }
  });
  const gone = goneAt(i);
  Play.svg("text", { class: "gonelbl", x: 14, y: 222 }, fig).textContent = P.t("gone");
  const show = gone.slice(-7), x0 = P.lang === "zh" ? 92 : 128;
  show.forEach((g, k) => {
    const x = x0 + k * 40;
    Play.svg("text", { class: "gonetx", x, y: 222 }, fig).textContent = g.v;
    Play.svg("line", { class: "gonex", x1: x - 13, y1: 230, x2: x + 13, y2: 214 }, fig);
  });
  const cur = i > 0 ? ex.states[i - 1] : null;
  if (cur && cur.op.loop) Play.svg("text", { class: "iter", x: W / 2, y: 20 }, fig).textContent = P.t("times", { k: cur.op.loop.k, n: cur.op.loop.n });
}
function exprText(op, env) {
  return op.terms.map((t, k) => (k ? op.ops[k - 1] + " " : "") + ("num" in t ? t.num : env[t.v])).join(" ");
}
function cancelAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
/* Animate state i-1 → i: the new value flies into the target box, the old value drops to the "thrown away" row. */
function animate(i, ms, done) {
  cancelAnim();
  const s = ex.states[i - 1];
  if (ms <= 0 || s.err) { draw(i, s.err ? null : s.op.target); done(); return; }
  const op = s.op, before = envAt(i - 1), to = centre(op.target);
  draw(i - 1, op.target, op.target);
  let from;
  if (isCopy(op)) from = centre(op.terms[0].v);
  else {
    from = { x: Play.clamp(to.x, 70, W - 70), y: 24 };
    const txt = op.terms.length > 1 ? exprText(op, before) + " = " + s.value : String(s.value), w = 10 * txt.length + 20;
    Play.svg("rect", { class: "bubble", x: from.x - w / 2, y: from.y - 15, width: w, height: 30, rx: 15 }, fig);
    Play.svg("text", { class: "bubtx", x: from.x, y: from.y }, fig).textContent = txt;
    from = { x: from.x, y: from.y + 22 };
  }
  let oldT = null;
  if (s.old != null) { oldT = Play.svg("text", { class: "valtx", x: to.x, y: to.y }, fig); oldT.textContent = s.old; }
  const fly = Play.svg("text", { class: "fly", x: from.x, y: from.y }, fig);
  fly.textContent = s.value;
  const t0 = performance.now();
  const f = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const lift = isCopy(op) ? -70 * Math.sin(Math.PI * e) : 0;
    fly.setAttribute("x", from.x + (to.x - from.x) * e);
    fly.setAttribute("y", from.y + (to.y - from.y) * e + lift);
    if (oldT) { oldT.setAttribute("y", to.y + (222 - to.y) * e); oldT.setAttribute("opacity", 1 - .7 * e); }
    if (k < 1) anim = requestAnimationFrame(f);
    else { anim = null; draw(i, op.target); done(); }
  };
  anim = requestAnimationFrame(f);
}

/* ---------- messages ---------- */
function setMsg(t, cls) { msg.className = "msg" + (cls ? " " + cls : ""); Play.live(msg, t); }
function lineMsg(s) {
  const l = s.op.line + 1;
  if (s.err === "syntax") return P.t("mSyntax", { l });
  if (s.err) return P.t("mEmpty", { l, n: s.name });
  const op = s.op, t = op.target, before = Object.assign({}, s.env, { [t]: s.old });
  let m = isCopy(op) ? P.t("mCopy", { l, s: op.terms[0].v, v: s.value, t })
    : op.terms.length > 1 ? P.t("mExpr", { l, e: op.terms.map((x, k) => (k ? op.ops[k - 1] + " " : "") + ("num" in x ? x.num : x.v)).join(" ") + " = " + exprText(op, before), v: s.value, t })
    : P.t("mNum", { l, v: s.value, t });
  if (s.old != null) m += SP + P.t("mOld", { o: s.old, t });
  return m;
}
function goalList(env) {
  const g = lv().goal;
  return Object.keys(g).map((k) => k + " = " + (env[k] == null ? P.t("empty") : env[k])).join(LS);
}
function finish() {
  const last = ex.states[ex.states.length - 1];
  if (!last || last.err) return;
  const env = last.env;
  if (step === 0) {
    const g = last.gone.find((x) => !Object.values(env).includes(x.v)) || last.gone[0];
    setMsg(P.t("demoEnd", { a: env.a, b: env.b, o: g ? g.v : "" }), env.a === env.b ? "no" : "");
  } else if (step === 2) {
    setMsg(P.t("scoreEnd", { seq: scoreSeq() }), "ok");
  } else {
    const L = lv(), n = user[L.key].length;
    if (meets(env, L.goal)) {
      const m = shortest(L.vars, L.init, L.goal).dist;
      solved[L.key] = true;
      const all = LEVELS.every((x) => solved[x.key]);
      setMsg(P.t("win", { list: goalList(env), n, extra: n <= m ? P.t("winShort") : P.t("winLong", { m }) }) + (all ? SP + P.t("allDone") : ""), "ok");
      renderLevels();
    } else {
      const lost = lostAt(ex.states, Object.values(L.goal), ex.i0);
      setMsg(P.t("miss", { list: goalList(env) }) + (lost ? SP + P.t("lost", { l: lost.line + 1, v: lost.v }) : ""), "no");
    }
  }
}
function scoreSeq() { return trace(SCORE, {}).map((s) => s.value).join(" → "); }

/* ---------- running ---------- */
function canRun() {
  if (step === 0 && !picked) { setMsg(P.t("pickFirst"), "no"); return false; }
  if (step === 1 && !user[lv().key].length) { setMsg(P.t("noLines"), "no"); return false; }
  return true;
}
function doOne(ms, after) {
  if (ex.i >= ex.states.length) { ex.i = ex.i0; draw(ex.i); }
  ex.i++;
  const s = ex.states[ex.i - 1];
  renderCode();
  setMsg(lineMsg(s), s.err ? "no" : "");
  animate(ex.i, ms, () => {
    if (s.err) { stopRun(); return; }
    if (ex.i >= ex.states.length) { stopRun(); setTimeout(finish, 0); return; }
    if (after) after();
  });
}
function loop() { if (!running) return; doOne(Play.reduced ? 0 : 520, () => { timer = setTimeout(loop, Play.reduced ? 500 : 260); }); }
function runAll() {
  if (running) { stopRun(); return; }
  if (anim || !canRun()) return;
  if (ex.i >= ex.states.length) { ex.i = ex.i0; draw(ex.i); renderCode(); }
  running = true;
  $("run").textContent = P.t("pause");
  loop();
}
function stopRun() { running = false; clearTimeout(timer); $("run").textContent = P.t("run"); }
function stepOnce() { if (running) stopRun(); if (anim || !canRun()) return; doOne(Play.reduced ? 0 : 360); }
function backToStart() { stopRun(); cancelAnim(); prepare(); draw(ex.i); renderCode(); setMsg(""); }

/* ---------- program listing + editor ---------- */
function renderCode() {
  codeEl.innerHTML = "";
  const pg = ex.pg, edit = step === 1;
  const cur = ex.i > ex.i0 ? ex.states[ex.i - 1] : null;
  pg.lines.forEach((src, li) => {
    const mine = edit && li >= pg.locked, b = document.createElement(mine ? "button" : "div");
    b.className = "ln";
    if (mine) {
      b.type = "button";
      const ui = li - pg.locked;
      if (sel === ui) b.classList.add("sel");
      b.setAttribute("aria-pressed", sel === ui ? "true" : "false");
      b.addEventListener("click", () => { sel = sel === ui ? null : ui; renderCode(); focusLine(ui); });
    }
    if (cur && cur.op.line === li) b.classList.add(cur.err ? "bad" : "cur");
    const n = document.createElement("span"); n.className = "n"; n.textContent = li + 1;
    const c = document.createElement("span"); c.textContent = src; c.style.whiteSpace = "pre";
    b.append(n, c);
    if (edit && li < pg.locked) { const k = document.createElement("span"); k.className = "lock"; k.textContent = P.t("locked"); b.appendChild(k); }
    codeEl.appendChild(b);
  });
  if (edit && !user[lv().key].length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = P.t("noLines"); codeEl.appendChild(e); }
  const u = edit ? user[lv().key] : [];
  if (sel != null && sel >= u.length) sel = u.length ? u.length - 1 : null;
  $("up").disabled = sel == null || sel === 0;
  $("down").disabled = sel == null || sel >= u.length - 1;
  $("del").disabled = sel == null;
  $("clear").disabled = !u.length;
  document.querySelectorAll("#palRow .blk").forEach((b) => (b.disabled = u.length >= MAXUSER));
}
function focusLine(ui) { const bs = codeEl.querySelectorAll("button.ln"); if (bs[ui]) bs[ui].focus(); }
function edited() { stopRun(); cancelAnim(); prepare(); draw(ex.i); renderCode(); setMsg(""); }
function addLine(src) {
  const u = user[lv().key];
  if (u.length >= MAXUSER) { setMsg(P.t("full", { n: MAXUSER }), "no"); return; }
  if (sel == null) u.push(src); else { u.splice(sel + 1, 0, src); sel++; }
  edited();
}
function moveSel(d) {
  const u = user[lv().key], j = sel + d;
  if (sel == null || j < 0 || j >= u.length) return;
  [u[sel], u[j]] = [u[j], u[sel]];
  sel = j; edited(); focusLine(sel);
}
function renderPalette() {
  const row = $("palRow");
  row.querySelectorAll(".blk").forEach((b) => b.remove());
  $("palLbl").textContent = P.t("palLbl");
  if (step !== 1) return;
  const vars = lv().vars;
  vars.forEach((t) => vars.forEach((s) => {
    if (t === s) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "blk mono";
    b.textContent = t + " = " + s;
    b.addEventListener("click", () => addLine(t + " = " + s));
    row.appendChild(b);
  }));
}
function renderLevels() {
  const row = $("lvlRow");
  row.innerHTML = "";
  row.hidden = step !== 1;
  if (step !== 1) return;
  LEVELS.forEach((l, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small";
    b.textContent = P.t("lv_" + l.key);
    b.classList.toggle("on", i === lvIdx);
    b.classList.toggle("done", !!solved[l.key]);
    b.setAttribute("aria-pressed", i === lvIdx ? "true" : "false");
    b.addEventListener("click", () => { lvIdx = i; sel = null; setScene(); });
    row.appendChild(b);
  });
}

/* ---------- step 3 facts (all computed) ---------- */
function renderFacts() {
  const ul = $("facts");
  ul.innerHTML = "";
  const S = LEVELS[0], R = LEVELS[1];
  const two = reach(["a", "b"], S.init);
  const list = two.map((r) => "(" + r.env.a + ", " + r.env.b + ")").join(LS);
  const sw = shortest(S.vars, S.init, S.goal), ro = shortest(R.vars, R.init, R.goal);
  const roNo = reach(["a", "b", "c"], R.init), roNoHit = roNo.some((r) => meets(r.env, R.goal));
  const items = [
    P.t("f1", { n: two.length, list, a: S.init.a, b: S.init.b }),
    P.t("f2", { n: sw.dist, prog: sw.prog.join("; ") }),
    roNoHit ? null : P.t("f3", { n: ro.dist, prog: ro.prog.join("; "), m: roNo.length }),
    P.t("f4", { seq: scoreSeq() }),
  ];
  items.filter(Boolean).forEach((t) => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
}

/* ---------- steps ---------- */
function setScene() {
  stopRun(); cancelAnim();
  prepare(); draw(ex.i); renderCode(); renderPalette(); renderLevels();
  $("palRow").hidden = $("editRow").hidden = step !== 1;
  let body = P.t("b" + (step + 1));
  if (step === 1) { const g = lv().goal; body += SP + P.t("task_" + lv().key, { ga: g.a, gb: g.b, gc: g.c }); }
  $("stepBody").textContent = body;
  setMsg("");
}
fresh();
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { picked = true; if (msg.textContent === P.t("pickFirst")) setMsg(""); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  $("kicker").textContent = P.t("k" + (i + 1));
  $("stepTitle").textContent = P.t("t" + (i + 1));
  $("predict").hidden = i !== 0;
  $("rule").hidden = $("facts").hidden = i !== 2;
  if (i === 2) renderFacts();
  sel = null;
  setScene();
});

/* ---------- wiring ---------- */
$("stepBtn").addEventListener("click", stepOnce);
$("run").addEventListener("click", runAll);
$("back").addEventListener("click", backToStart);
$("up").addEventListener("click", () => moveSel(-1));
$("down").addEventListener("click", () => moveSel(1));
$("del").addEventListener("click", () => { if (sel == null) return; user[lv().key].splice(sel, 1); edited(); });
$("clear").addEventListener("click", () => { user[lv().key] = []; sel = null; edited(); });
fig.addEventListener("keydown", (e) => {
  if (e.key === " ") stepOnce();
  else if (e.key === "Enter") runAll();
  else return;
  e.preventDefault();
});
codeEl.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  const bs = [...codeEl.querySelectorAll("button.ln")], i = bs.indexOf(document.activeElement);
  if (i < 0) return;
  bs[Play.clamp(i + (e.key === "ArrowDown" ? 1 : -1), 0, bs.length - 1)].focus();
  e.preventDefault();
});
$("reset").addEventListener("click", () => { stopRun(); fresh(); picked = false; lvIdx = 0; pr.reset(); st.go(0); });
$("run").textContent = P.t("run");
</script>
</body>
</html>

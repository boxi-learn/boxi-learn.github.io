<script id="logic">
/* Pure logic (no DOM) so it can be checked in node. */
const SIZE = 16;
/* Original 16×16 motif: a house, a sun, grass. "." is sky (a gradient, computed per row). */
const ART = [
  "................",
  "............SS..",
  "...........SSSS.",
  ".......RR..SSSS.",
  "....C.RRRR..SS..",
  "....CRRRRRR.....",
  "....RRRRRRRR....",
  "...RRRRRRRRRR...",
  "..RRRRRRRRRRRR..",
  "...WWWWWWWWWW...",
  "...WBBWWWWBBW...",
  "...WBBWDDWBBW...",
  "...WWWWDDWWWW...",
  "GGGWWWWDDWWWWGGG",
  "GgGGgGGGGGgGGgGG",
  "gGGgGGgGGgGGgGGg",
];
const PAL = {
  S: [255, 214, 64], R: [196, 60, 48], C: [128, 84, 70], W: [240, 222, 184],
  B: [110, 172, 232], D: [116, 70, 40], G: [76, 164, 72], g: [52, 132, 58],
};
const sky = (row) => [110 + 6 * row, 170 + 4 * row, 255 - 2 * row];
const clampByte = (v) => (Number.isFinite(+v) ? Math.min(255, Math.max(0, Math.round(+v))) : 0);
function makeImage() {
  const img = [];
  for (let y = 0; y < SIZE; y++) {
    if (ART[y].length !== SIZE) throw new Error("ART row " + y);
    for (let x = 0; x < SIZE; x++) {
      const ch = ART[y][x];
      img.push((ch === "." ? sky(y) : PAL[ch]).map(clampByte));
    }
  }
  return img;
}
/* sRGB relative luminance (WCAG); text is black on light colours, white on dark ones.
   0.179 is where black and white text have equal contrast. */
function luminance(c) {
  const lin = (v) => { const s = clampByte(v) / 255; return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
}
const darkText = (c) => luminance(c) > 0.179;
const hex = (c) => "#" + c.map((v) => clampByte(v).toString(16).padStart(2, "0")).join("").toUpperCase();
const bytesFor = (w, h) => w * h * 3;
const cleanDim = (v) => (Number.isFinite(+v) && +v >= 1 ? Math.min(20000, Math.round(+v)) : 1);
/* Human size in decimal units (1 KB = 1000 bytes, 1 MB = 1 000 000 bytes). */
function niceSize(n) {
  if (!Number.isFinite(n) || n < 0) return { v: "0", u: "B" };
  if (n < 1000) return { v: String(n), u: "B" };
  if (n < 1e6) return { v: (n / 1e3).toFixed(1), u: "KB" };
  if (n < 1e9) return { v: (n / 1e6).toFixed(1), u: "MB" };
  return { v: (n / 1e9).toFixed(2), u: "GB" };
}
/* Zoom slider 0…100 → size of one picture pixel on screen (CSS px), exponential. */
const CMIN = 6, CMAX = 84, NUMCELL = 48;
const cellSize = (z) => CMIN * Math.pow(CMAX / CMIN, Math.min(100, Math.max(0, +z || 0)) / 100);
const zoomForCell = (c) => Math.ceil((100 * Math.log(c / CMIN)) / Math.log(CMAX / CMIN));
/* Keep the view centre inside the picture: centred when it fits, edges never past the canvas otherwise. */
function clampView(v, cell, W) {
  const span = SIZE * cell;
  if (span <= W) return SIZE / 2;
  const half = W / 2 / cell;
  return Math.min(SIZE - half, Math.max(half, v));
}
if (typeof module !== "undefined") module.exports = { SIZE, ART, PAL, makeImage, luminance, darkText, hex, bytesFor, cleanDim, niceSize, cellSize, zoomForCell, clampView, clampByte, NUMCELL };
</script>

const $ = (id) => document.getElementById(id);
const fig = $("fig"), ctx = fig.getContext("2d");
const nf = (n) => n.toLocaleString(P.lang === "zh" ? "zh-CN" : "en-US");
const SL = [$("rr"), $("gg"), $("bb")], SLV = [$("rrV"), $("ggV"), $("bbV")];
const START_SEL = { x: 12, y: 2 }, START_MIX = [255, 255, 0];
const SIZES = [["sz16", 16, 16], ["szVGA", 640, 480], ["szHD", 1920, 1080], ["sz12", 4000, 3000]];
const PRESETS = [["pRG", [255, 255, 0]], ["pGB", [0, 255, 255]], ["pRB", [255, 0, 255]], ["pW", [255, 255, 255]], ["pK", [0, 0, 0]], ["pGrey", [128, 128, 128]]];

let img, sel, mix, vx, vy, step = 0, numbers = false, W = 600, H = 360;

function fresh() {
  img = makeImage();
  sel = { ...START_SEL };
  mix = START_MIX.slice();
  vx = vy = SIZE / 2;
  numbers = false;
  $("nums").checked = false;
  $("zoom").value = 0;
  $("wIn").value = 1920; $("hIn").value = 1080;
}

/* ---------- drawing ---------- */
const css = (k) => getComputedStyle(document.body).getPropertyValue(k).trim() || "#888";
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
function fitCanvas() {
  const r = fig.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  fig.width = Math.round(W * dpr); fig.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const cell = () => cellSize($("zoom").value);
function origin() {
  const c = cell();
  vx = clampView(vx, c, W); vy = clampView(vy, c, H);
  return { c, ox: W / 2 - vx * c, oy: H / 2 - vy * c };
}
function drawPixels() {
  const { c, ox, oy } = origin();
  ctx.fillStyle = css("--soft");
  ctx.fillRect(0, 0, W, H);
  const x0 = Math.max(0, Math.floor(-ox / c)), x1 = Math.min(SIZE - 1, Math.floor((W - ox) / c));
  const y0 = Math.max(0, Math.floor(-oy / c)), y1 = Math.min(SIZE - 1, Math.floor((H - oy) / c));
  const showNums = c >= NUMCELL, fg = css("--fg"), surf = css("--surface"), line = css("--line");
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "600 13px " + css("--font");
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const p = img[y * SIZE + x], px = ox + x * c, py = oy + y * c;
    ctx.fillStyle = numbers ? surf : rgb(p);
    // 0.5 px overlap hides hairline seams between squares at the "picture" zoom
    ctx.fillRect(px, py, c + 0.5, c + 0.5);
    if (showNums) {
      ctx.fillStyle = numbers ? fg : darkText(p) ? "#111" : "#fff";
      const lh = Math.min(17, c / 3.4);
      for (let k = 0; k < 3; k++) ctx.fillText(String(p[k]), px + c / 2, py + c / 2 + (k - 1) * lh);
    }
  }
  if (c >= 12 || numbers) {
    ctx.strokeStyle = numbers ? line : "rgba(0,0,0,.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = x0; x <= x1 + 1; x++) { ctx.moveTo(Math.round(ox + x * c) + .5, Math.max(0, oy + y0 * c)); ctx.lineTo(Math.round(ox + x * c) + .5, Math.min(H, oy + (y1 + 1) * c)); }
    for (let y = y0; y <= y1 + 1; y++) { ctx.moveTo(Math.max(0, ox + x0 * c), Math.round(oy + y * c) + .5); ctx.lineTo(Math.min(W, ox + (x1 + 1) * c), Math.round(oy + y * c) + .5); }
    ctx.stroke();
  }
  if (step === 1) {
    // selected pixel: dark + light double outline, visible on any colour
    const sx = ox + sel.x * c, sy = oy + sel.y * c, w = Math.max(c, 6);
    ctx.lineWidth = 3; ctx.strokeStyle = "#111"; ctx.strokeRect(sx - 1.5, sy - 1.5, w + 3, w + 3);
    ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.strokeRect(sx - 4, sy - 4, w + 8, w + 8);
  }
  if (numbers && !showNums) {
    const msg = P.t("zoomIn");
    ctx.font = "650 14px " + css("--font");
    const tw = ctx.measureText(msg).width + 24;
    ctx.fillStyle = css("--ink-panel");
    ctx.fillRect(W / 2 - tw / 2, H - 46, tw, 32);
    ctx.fillStyle = css("--on-panel");
    ctx.fillText(msg, W / 2, H - 30);
  }
}
/* Light mixing: three discs of red, green and blue light on black, added together ("lighter"). */
function drawMix() {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const R = Math.min(W, H) * 0.24, cx = W / 2, cy = H / 2 + R * 0.08, d = R * 0.62;
  const spots = [[0, -1, [mix[0], 0, 0]], [-0.866, 0.5, [0, mix[1], 0]], [0.866, 0.5, [0, 0, mix[2]]]];
  ctx.globalCompositeOperation = "lighter";
  spots.forEach(([dx, dy, col]) => {
    ctx.beginPath(); ctx.arc(cx + dx * d, cy + dy * d, R, 0, Math.PI * 2);
    ctx.fillStyle = rgb(col); ctx.fill();
  });
  ctx.globalCompositeOperation = "source-over";
  ctx.font = "650 14px " + css("--font");
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const labels = [[P.t("red"), mix[0], 0, -1], [P.t("green"), mix[1], -0.866, 0.5], [P.t("blue"), mix[2], 0.866, 0.5]];
  labels.forEach(([name, v, dx, dy]) => {
    const lx = cx + dx * (d + R * 0.62), ly = cy + dy * (d + R * 0.62);
    const t = name + " " + v, tw = ctx.measureText(t).width + 14;
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(lx - tw / 2, ly - 12, tw, 24);
    ctx.fillStyle = "#fff";
    ctx.fillText(t, lx, ly);
  });
}
function draw() { if (step === 2) drawMix(); else drawPixels(); }

/* ---------- panel ---------- */
function target() { return step === 2 ? mix : img[sel.y * SIZE + sel.x]; }
function syncSliders() {
  const c = target();
  SL.forEach((s, k) => { s.value = c[k]; SLV[k].textContent = c[k]; });
}
function paintChip(el, c) {
  el.style.background = rgb(c);
  el.style.color = darkText(c) ? "#111" : "#fff";
}
function renderInfo() {
  const c = cell();
  $("zoomVal").textContent = "×" + Play.fmt(c / CMIN, c / CMIN < 10 ? 1 : 0);
  if (step === 1) {
    const p = target();
    const who = $("who");
    who.innerHTML = "";
    const lab = document.createElement("span"); lab.textContent = P.t("pixel", { x: sel.x, y: sel.y });
    const ch = document.createElement("span"); ch.className = "chip"; ch.textContent = p.join(", ");
    paintChip(ch, p);
    who.append(lab, ch);
    const f = $("facts");
    f.innerHTML = "";
    [["fPix", `${SIZE} × ${SIZE} = ${nf(SIZE * SIZE)}`], ["fNum", `${nf(SIZE * SIZE)} × 3 = ${nf(bytesFor(SIZE, SIZE))}`], ["fSel", `(${p.join(", ")})`]]
      .forEach(([k, v]) => { const a = document.createElement("span"); a.textContent = P.t(k); const b = document.createElement("b"); b.textContent = v; f.append(a, b); });
  }
  if (step === 2) {
    const h = hex(mix), sw = $("swatch");
    paintChip(sw, mix);
    $("hex").textContent = h;
    $("trip").textContent = P.t("trip", { r: mix[0], g: mix[1], b: mix[2] });
  }
}
function renderSize() {
  const w = cleanDim($("wIn").value), h = cleanDim($("hIn").value), b = bytesFor(w, h), s = niceSize(b);
  $("sizeEq").textContent = P.t("sizeEq", { w: nf(w), h: nf(h), b: nf(b) });
  $("sizeBig").textContent = s.u === "B" ? nf(b) + " B" : P.t("sizeBig", { v: s.v, u: s.u });
  document.querySelectorAll("#sizePresets button").forEach((bt) => {
    const on = +bt.dataset.w === w && +bt.dataset.h === h;
    bt.classList.toggle("on", on); bt.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
const msg = $("live");
function announce() {
  const c = target();
  if (step === 1) Play.live(msg, P.t("liveSel", { x: sel.x, y: sel.y, r: c[0], g: c[1], b: c[2] }));
  else if (step === 2) Play.live(msg, P.t("liveMix", { r: c[0], g: c[1], b: c[2], h: hex(c) }));
  else Play.live(msg, "");
}
function refresh() { draw(); renderInfo(); }

/* ---------- interactions ---------- */
function setZoom(z, keepSel) {
  $("zoom").value = Play.clamp(Math.round(z), 0, 100);
  if (keepSel !== false) { vx = sel.x + 0.5; vy = sel.y + 0.5; }
  refresh();
}
function select(x, y) {
  sel = { x: Play.clamp(x, 0, SIZE - 1), y: Play.clamp(y, 0, SIZE - 1) };
  // keep the selected pixel on screen
  const { c } = origin(), hw = W / 2 / c, hh = H / 2 / c;
  if (sel.x + 1 > vx + hw) vx = sel.x + 1 - hw; if (sel.x < vx - hw) vx = sel.x + hw;
  if (sel.y + 1 > vy + hh) vy = sel.y + 1 - hh; if (sel.y < vy - hh) vy = sel.y + hh;
  syncSliders(); refresh(); announce();
}
function setNumbers(on) {
  numbers = on;
  $("nums").checked = on;
  if (on && cell() < NUMCELL) setZoom(zoomForCell(NUMCELL));
  else refresh();
}
SL.forEach((s, k) => s.addEventListener("input", () => {
  const c = target();
  c[k] = clampByte(s.value);
  SLV[k].textContent = c[k];
  refresh(); announce();
}));
$("zoom").addEventListener("input", () => setZoom($("zoom").value));
$("nums").addEventListener("change", () => setNumbers($("nums").checked));

let drag = null;
fig.addEventListener("pointerdown", (e) => {
  if (step === 2) return;
  drag = { x: e.clientX, y: e.clientY, vx, vy, moved: false };
  try { fig.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
fig.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true;
  const c = cell();
  vx = drag.vx - dx / c; vy = drag.vy - dy / c;
  draw();
});
fig.addEventListener("pointerup", (e) => {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.moved || step !== 1) return;
  const r = fig.getBoundingClientRect(), { c, ox, oy } = origin();
  const x = Math.floor((e.clientX - r.left - ox) / c), y = Math.floor((e.clientY - r.top - oy) / c);
  if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return;
  select(x, y);
});
fig.addEventListener("pointercancel", () => { drag = null; });
fig.addEventListener("keydown", (e) => {
  if (step === 2) return;
  const k = e.key, z = +$("zoom").value;
  if (k === "+" || k === "=") setZoom(z + 10);
  else if (k === "-" || k === "_") setZoom(z - 10);
  else if (step !== 1) return;
  else if (k === "ArrowLeft") select(sel.x - 1, sel.y);
  else if (k === "ArrowRight") select(sel.x + 1, sel.y);
  else if (k === "ArrowUp") select(sel.x, sel.y - 1);
  else if (k === "ArrowDown") select(sel.x, sel.y + 1);
  else if (k === "n" || k === "N") setNumbers(!numbers);
  else return;
  e.preventDefault();
});

/* presets */
PRESETS.forEach(([k, c]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(k);
  b.addEventListener("click", () => { mix = c.slice(); syncSliders(); refresh(); announce(); });
  $("presetRow").appendChild(b);
});
SIZES.forEach(([k, w, h]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.dataset.w = w; b.dataset.h = h;
  b.textContent = P.t(k) + " " + w + "×" + h;
  b.addEventListener("click", () => { $("wIn").value = w; $("hIn").value = h; renderSize(); });
  $("sizePresets").appendChild(b);
});
["wIn", "hIn"].forEach((id) => {
  $(id).addEventListener("input", renderSize);
  $(id).addEventListener("change", () => { $(id).value = cleanDim($(id).value); renderSize(); });
});

/* ---------- steps ---------- */
fresh();
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, { total: nf(256 * 256 * 256) });
  $("predict").hidden = i !== 0;
  $("zoomRow").hidden = i === 2;
  $("viewRow").hidden = $("facts").hidden = i !== 1;
  $("sliders").hidden = i === 0;
  $("presetRow").hidden = $("mixBox").hidden = i !== 2;
  $("keys").textContent = i === 2 ? P.t("keysMix") : i === 1 ? P.t("keysPix") : "";
  fig.style.cursor = i === 2 ? "default" : "";
  if (i !== 1 && numbers) { numbers = false; $("nums").checked = false; }
  syncSliders(); refresh(); renderSize(); announce();
});
$("resultNote").textContent = P.t("resultNote", { n: nf(bytesFor(SIZE, SIZE)) });
$("reset").addEventListener("click", () => { fresh(); pr.reset(); st.go(0); });

fitCanvas();
if ("ResizeObserver" in window) new ResizeObserver(() => { fitCanvas(); draw(); }).observe(fig);
else addEventListener("resize", () => { fitCanvas(); draw(); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw); } catch (err) { /* old browser: colours update on next draw */ }
refresh();
</script>
</body>
</html>

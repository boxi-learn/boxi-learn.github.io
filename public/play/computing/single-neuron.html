<script id="logic">
/* Pure neuron logic (no DOM), checked in node.
   Inputs: x = sweetness, y = size, both on a 0–10 scale. Target t = 1 (like) or 0 (don't like).
   Neuron: s = w1·x + w2·y + b; output o = 1 when s > 0, else 0 (a step at threshold 0; b = −threshold).
   Perceptron rule (Rosenblatt 1958), one point at a time: w1 += η(t − o)x, w2 += η(t − o)y, b += η(t − o).
   On data that one line can separate it stops making mistakes after finitely many updates (Novikoff 1962);
   on XOR it never does (Minsky & Papert 1969). */
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ETA = 0.1, LO = 0, HI = 10;
const r1 = (v) => Math.round(v * 10) / 10;           // inputs live on a 0.1 grid
const rw = (v) => Math.round(v * 1e6) / 1e6;          // weights: kill float dust (η·x is on a 0.01 grid)
const sum = (w, p) => w.w1 * p.x + w.w2 * p.y + w.b;
const out = (w, p) => (sum(w, p) > 1e-9 ? 1 : 0);
function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* n points one straight line can separate, with a gap of ≥ gap around a hidden "taste" line. */
function makeFruit(seed, n = 16, gap = 0.8) {
  const rnd = mulberry32(seed);
  const ang = (0.08 + 0.27 * rnd()) * Math.PI;         // normal direction: sweeter → like, bigger → less so
  const nx = Math.cos(ang), ny = -Math.sin(ang);
  const cx = 4.2 + 1.6 * rnd(), cy = 4.2 + 1.6 * rnd();
  const pts = [];
  let guard = 0;
  while (pts.length < n && guard++ < 5000) {
    const x = r1(0.6 + 8.8 * rnd()), y = r1(0.6 + 8.8 * rnd());
    const d = (x - cx) * nx + (y - cy) * ny;
    if (Math.abs(d) < gap) continue;
    const t = d > 0 ? 1 : 0;
    const k = pts.filter((p) => p.t === t).length;
    if (k >= Math.ceil(n * 0.6)) continue;               // keep the two kinds roughly balanced
    if (pts.some((p) => Math.hypot(p.x - x, p.y - y) < 0.9)) continue;
    pts.push({ x, y, t });
  }
  return pts;
}
/* XOR: like = sweet-and-small or sour-and-big; dislike = both high or both low. */
function makeXor(seed, n = 16) {
  const rnd = mulberry32(seed);
  const C = [[2.5, 2.5, 0], [7.5, 7.5, 0], [2.5, 7.5, 1], [7.5, 2.5, 1]];
  const pts = [];
  for (let i = 0; i < n; i++) {
    const [cx, cy, t] = C[i % 4];
    pts.push({ x: r1(cx + (rnd() * 2 - 1) * 1.6), y: r1(cy + (rnd() * 2 - 1) * 1.6), t });
  }
  return shuffle(pts, rnd);
}
/* One learning step on point p. Mutates w; returns what happened. */
function learnOne(w, p, eta = ETA) {
  const s = sum(w, p), o = out(w, p), d = p.t - o, before = { w1: w.w1, w2: w.w2, b: w.b };
  if (d !== 0) { w.w1 = rw(w.w1 + eta * d * p.x); w.w2 = rw(w.w2 + eta * d * p.y); w.b = rw(w.b + eta * d); }
  return { s, o, d, before, after: { w1: w.w1, w2: w.w2, b: w.b } };
}
/* One pass over all points in order; returns the number of mistakes made during the pass. */
function onePass(w, pts, eta = ETA) { let m = 0; for (const p of pts) if (learnOne(w, p, eta).d !== 0) m++; return m; }
/* Train until a pass has no mistakes or maxPasses is reached. */
function train(w, pts, eta = ETA, maxPasses = 100) {
  const per = [];
  let updates = 0;
  while (per.length < maxPasses) {
    const m = onePass(w, pts, eta);
    per.push(m); updates += m;
    if (m === 0) break;
  }
  return { per, updates, converged: per.length > 0 && per[per.length - 1] === 0 };
}
const wrongCount = (w, pts) => pts.filter((p) => out(w, p) !== p.t).length;
/* Part of the box [LO,HI]² where s > 0, as a polygon (Sutherland–Hodgman with one half-plane). */
function yesRegion(w) {
  const box = [[LO, LO], [HI, LO], [HI, HI], [LO, HI]], f = (q) => w.w1 * q[0] + w.w2 * q[1] + w.b, res = [];
  for (let i = 0; i < 4; i++) {
    const a = box[i], c = box[(i + 1) % 4], fa = f(a), fc = f(c);
    if (fa > 0) res.push(a);
    if ((fa > 0) !== (fc > 0) && fa !== fc) { const k = fa / (fa - fc); res.push([a[0] + k * (c[0] - a[0]), a[1] + k * (c[1] - a[1])]); }
  }
  return res;
}
/* The line s = 0 inside the box, as [[x,y],[x,y]], or null if it misses the box or w1 = w2 = 0. */
function lineInBox(w) {
  if (Math.abs(w.w1) < 1e-12 && Math.abs(w.w2) < 1e-12) return null;
  const P = [];
  const add = (x, y) => { if (x >= LO - 1e-9 && x <= HI + 1e-9 && y >= LO - 1e-9 && y <= HI + 1e-9 && !P.some((q) => Math.hypot(q[0] - x, q[1] - y) < 1e-7)) P.push([x, y]); };
  if (Math.abs(w.w2) > 1e-12) { add(LO, -(w.w1 * LO + w.b) / w.w2); add(HI, -(w.w1 * HI + w.b) / w.w2); }
  if (Math.abs(w.w1) > 1e-12) { add(-(w.w2 * LO + w.b) / w.w1, LO); add(-(w.w2 * HI + w.b) / w.w1, HI); }
  return P.length >= 2 ? [P[0], P[1]] : null;
}
/* Fewest mistakes of any straight line, by search: 180 directions (1° apart), and for each every cut
   between the points' positions along it, both ways round. A search, not a proof. */
function bestLine(pts) {
  let best = pts.length;
  for (let a = 0; a < 180 && best > 0; a++) {
    const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
    const proj = pts.map((p) => ({ v: c * p.x + s * p.y, t: p.t })).sort((u, v) => u.v - v.v);
    for (let k = 0; k <= proj.length; k++) {              // cut between sorted projections, both orientations
      let m1 = 0;
      for (let i = 0; i < proj.length; i++) m1 += (i < k ? proj[i].t : 1 - proj[i].t);
      best = Math.min(best, m1, proj.length - m1);
    }
  }
  return best;
}
if (typeof module !== "undefined") module.exports = { mulberry32, ETA, r1, rw, sum, out, makeFruit, makeXor, learnOne, onePass, train, wrongCount, yesRegion, lineInBox, bestLine };
</script>

    k2: "动手", t2: "转三个旋钮，直到没有点站错边",
    b2: "神经元把甜度乘 w₁、大小乘 w₂，再加 b，总数大于 0 就答「是」。不管你怎么调，「是」和「否」的分界都是一条直线。点一下某个点，看它的总数；拖动它可以移动。",
    k3: "动手", t3: "让它从错误里学",
    b3: "它一次看一个水果。答对了：什么也不改。把喜欢的答成「否」：每个权重加上 0.1 × 对应的输入，b 加 0.1。把不喜欢的答成「是」：改成减。一轮 = 把 16 个水果都看一遍。",
    k4: "规律", t4: "一个神经元 = 一条直线",
    b4: "神经元把每个输入乘上权重再相加，超过 0 就答「是」，所以它用一条直线把平面分成两边。学习就是每错一次把权重挪一点。只要有一条直线能分开这些点，挪来挪去一定会停在零错误。换成「异或水果」：没有任何一条直线能分开，它就永远停不下来。",
    keys: "键盘：Tab 到图上，N / P 选点，方向键移动（按住 Shift 走得多）。滑块也能用方向键调。",
    wrongN: "现在分错：{n} / {m}", allRight: "{m} 个全部站对了边。", noLine: "权重全是 0，没有直线：每个点的总数都只是 b。",
    said: "答了「{o}」，应该是「{t}」", ok: "答对了（{s}）：什么也不改。",
    upd: "答错了（{s}），所以{act}：", addX: "加上 0.1 × 输入", subX: "减去 0.1 × 输入",
    convMsg: "第 {k} 轮：一次也没错。每个点都站对了边，学习停止。",
    capSep: "已经 {k} 轮，最后一轮还错 {m} 次。确实有直线能分开，所以它会停下，接着学。",
    capXor: "已经 {k} 轮，最后一轮还错 {m} 次。它永远到不了 0：没有一条直线能分开这些点。",
    running: "第 {k} 轮进行中：已经错 {m} 次。", afterK: "已学 {k} 轮，最后一轮错 {m} 次。", pressLearn: "按一个「学」按钮。每轮犯错的次数画在下面。",
    sumIs: "总数", shouldBe: "应该：{c}",
    sepRun: "这组数据，从权重全为 0 开始：规则一共调整 {u} 次，第 {p} 轮一次也没错。",
    xorRun: "异或水果，从权重全为 0 开始：学了 {p} 轮，最后一轮还错 {m} 次。任何一条直线在这里最少也要错 {best} 个。用两层神经元就能分开：那就是神经网络。",
    storyNote: "把故事换成「植物」：同样的点现在表示日照和浇水，权重一个数都不变。神经元从来不知道自己在分水果。",
    resultTitle: "我们发现", resultMain: "w₁x₁ + w₂x₂ + b > 0 时答「是」",
    resultNote: "错一次：w ← w + 0.1·(t − o)·x。只要有直线能分开，错误一定会停（Novikoff 1962）；异或永远停不下（Minsky 与 Papert 1969）。",
    explainK: "说一说", explainQ: "跟别人讲讲：这个神经元不知道水果是什么，为什么还能把 16 个水果全部分对？再用「直线」说明它为什么永远分不对异或水果。",
    homeK: "家里做一做", homeQ: "给 10 种零食的甜度和脆度各打 0 到 10 分，画在方格纸上：家人喜欢的画圆、不喜欢的画方块。能用尺子画一条直线把圆和方块分开吗？试着找出四种零食，让任何直线都分不开。",
    foot: "神经元：s = w₁·x₁ + w₂·x₂ + b；只有 s > 0 才输出「是」（1），s = 0 算「否」。感知机学习规则（Rosenblatt 1958，《心理学评论》）：每看一个点，w₁ += η(t − o)·x₁，w₂ += η(t − o)·x₂，b += η(t − o)，t、o ∈ {0, 1}，学习率 η = 0.1。线性可分数据上必定收敛：Novikoff 1962。异或的局限：Minsky 与 Papert《感知机》1969；用反向传播训练的多层网络（Rumelhart、Hinton、Williams 1986）能学会异或。水果和植物数据是用带种子的随机数编的（水果种子 {fs}，异或种子 {xs}）；「换一组」只给出规则从 0 开始 4–30 轮能学会的水果数据。自动学习最多 {cap} 轮。「任何直线最少错几个」是在 180 个方向、每个方向所有切法里搜出来的。CC BY-SA 4.0 · Boxi Yu",
  },
});

const $ = (id) => document.getElementById(id);
const f2 = (v) => Play.fmt(v, 2).replace("-", "−"), f1 = (v) => Play.fmt(v, 1);
const CAP = 100, W0 = { w1: 0.5, w2: 0.5, b: -5 }, SEED_F = 10, SEED_X = 1;
let kind = "fruit", seedF = SEED_F, seedX = SEED_X, story = "Fruit", step = 0;
let pts = [], w = { ...W0 }, sel = 0, drag = false;
let idx = 0, curMis = 0, per = [], nudges = 0, last = null, timer = null;
const S = (k) => P.t(k + story);

/* ---------- data ---------- */
function goodSeed(s) {
  for (let k = 1; k < 400; k++) {
    const r = train({ w1: 0, w2: 0, b: 0 }, makeFruit(s + k), ETA, 40);
    if (r.converged && r.per.length >= 4 && r.per.length <= 30) return s + k;
  }
  return s + 1;
}
function setData(k, seedChange) {
  kind = k;
  if (seedChange) { if (k === "fruit") seedF = goodSeed(seedF); else seedX++; }
  pts = k === "fruit" ? makeFruit(seedF) : makeXor(seedX);
  sel = 0;
  resetLearn();
  renderAll();
}
function resetLearn() { stopAuto(); idx = 0; curMis = 0; per = []; nudges = 0; last = null; }

/* ---------- sliders ---------- */
const SL = { w1: [-2, 2, 0.01], w2: [-2, 2, 0.01], b: [-15, 15, 0.1] };
for (const k in SL) { const e = $(k); [e.min, e.max, e.step] = SL[k]; e.addEventListener("input", () => { w[k] = +e.value; resetLearn(); renderAll(); }); }
function syncSliders() {
  for (const k in SL) {
    const e = $(k), v = w[k], lim = Math.max(SL[k][1], Math.ceil(Math.abs(v)));   // widen if learning goes past the end
    e.min = -lim; e.max = lim; e.value = v;
    $(k + "v").textContent = f2(v);
  }
}

/* ---------- plot ---------- */
const plot = $("plot");
let geo = null;
function renderPlot() {
  const W = Math.max(280, Math.round(plot.getBoundingClientRect().width) || 600), H = Math.max(200, Math.round(plot.getBoundingClientRect().height) || 340);
  const L = 46, R = 12, T = 10, B = 40, sx = (x) => L + (x / 10) * (W - L - R), sy = (y) => H - B - (y / 10) * (H - T - B);
  geo = { sx, sy, ix: (px) => ((px - L) / (W - L - R)) * 10, iy: (py) => ((H - B - py) / (H - T - B)) * 10 };
  plot.setAttribute("viewBox", `0 0 ${W} ${H}`);
  plot.innerHTML = "";
  const reg = yesRegion(w);
  if (reg.length >= 3) Play.svg("polygon", { class: "yes", points: reg.map((q) => sx(q[0]) + "," + sy(q[1])).join(" ") }, plot);
  for (let v = 0; v <= 10; v += 2) {
    Play.svg("line", { class: v ? "ax" : "axs", x1: sx(v), x2: sx(v), y1: sy(0), y2: sy(10) }, plot);
    Play.svg("line", { class: v ? "ax" : "axs", x1: sx(0), x2: sx(10), y1: sy(v), y2: sy(v) }, plot);
    Play.svg("text", { class: "axt", x: sx(v), y: sy(0) + 16, "text-anchor": "middle" }, plot).textContent = v;
    Play.svg("text", { class: "axt", x: sx(0) - 6, y: sy(v) + 4, "text-anchor": "end" }, plot).textContent = v;
  }
  Play.svg("text", { class: "axl", x: (sx(0) + sx(10)) / 2, y: H - 6, "text-anchor": "middle" }, plot).textContent = "x₁ = " + S("ax1") + " →";
  const yl = Play.svg("text", { class: "axl", x: 0, y: 0, "text-anchor": "middle", transform: `translate(14 ${(sy(0) + sy(10)) / 2}) rotate(-90)` }, plot);
  yl.textContent = "x₂ = " + S("ax2") + " →";
  const seg = lineInBox(w);
  if (seg) Play.svg("line", { class: "bline", x1: sx(seg[0][0]), y1: sy(seg[0][1]), x2: sx(seg[1][0]), y2: sy(seg[1][1]) }, plot);
  pts.forEach((p, i) => {
    const x = sx(p.x), y = sy(p.y);
    if (p.t) Play.svg("circle", { class: "pt1", cx: x, cy: y, r: 7.5 }, plot);
    else Play.svg("rect", { class: "pt0", x: x - 6.5, y: y - 6.5, width: 13, height: 13, rx: 1.5 }, plot);
    if (out(w, p) !== p.t) Play.svg("circle", { class: "wrongring", cx: x, cy: y, r: 11.5 }, plot);
    if (i === sel && step > 0) Play.svg("circle", { class: "selring", cx: x, cy: y, r: 15.5 }, plot);
  });
}
function nearest(px, py) {
  let bi = -1, bd = 22;
  pts.forEach((p, i) => { const d = Math.hypot(geo.sx(p.x) - px, geo.sy(p.y) - py); if (d < bd) { bd = d; bi = i; } });
  return bi;
}
function movePoint(i, x, y) {
  const p = pts[i];
  p.x = r1(Play.clamp(x, 0.2, 9.8)); p.y = r1(Play.clamp(y, 0.2, 9.8));
  resetLearn();
}
plot.addEventListener("pointerdown", (e) => {
  if (!geo || step === 0) return;
  const q = Play.pointer(plot, e), i = nearest(q.x, q.y);
  if (i < 0) return;
  sel = i; drag = true; last = null;
  try { plot.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  e.preventDefault();
  renderAll();
});
plot.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const q = Play.pointer(plot, e);
  movePoint(sel, geo.ix(q.x), geo.iy(q.y));
  renderAll();
});
const endDrag = () => { drag = false; };
plot.addEventListener("pointerup", endDrag);
plot.addEventListener("pointercancel", endDrag);
plot.addEventListener("keydown", (e) => {
  if (step === 0 || !pts.length) return;
  const n = pts.length, k = e.key.toLowerCase(), d = e.shiftKey ? 1 : 0.1;
  const mv = { arrowleft: [-d, 0], arrowright: [d, 0], arrowup: [0, d], arrowdown: [0, -d] }[k];
  if (k === "n" || k === "]") sel = (sel + 1) % n;
  else if (k === "p" || k === "[") sel = (sel + n - 1) % n;
  else if (mv) movePoint(sel, pts[sel].x + mv[0], pts[sel].y + mv[1]);
  else return;
  last = null;
  e.preventDefault();
  renderAll();
});

/* ---------- neuron diagram for the chosen point ---------- */
function renderCalc() {
  const c = $("calc");
  c.innerHTML = "";
  const p = pts[sel];
  if (!p) return;
  const s = sum(w, p), o = out(w, p);
  const T = (cls, x, y, txt, anchor) => { Play.svg("text", { class: cls, x, y, "text-anchor": anchor || "middle" }, c).textContent = txt; };
  [[p.x, 30, "ax1", "w1"], [p.y, 102, "ax2", "w2"]].forEach(([v, y, ax, wk]) => {
    Play.svg("line", { class: "ed", x1: 54, y1: y, x2: 180, y2: 66 }, c);
    Play.svg("circle", { class: "nd", cx: 32, cy: y, r: 22 }, c);
    T("ctb", 32, y + 5, f1(v));
    T("ct", 62, y < 66 ? y - 12 : y + 22, S(ax), "start");
    T("ct", 118, y < 66 ? 56 : 92, "× " + f2(w[wk]));
  });
  Play.svg("circle", { class: "nd", cx: 202, cy: 66, r: 24 }, c);
  T("ctb", 202, 71, "Σ");
  T("ct", 202, 28, "+ b (" + f2(w.b) + ")");
  T("ct", 202, 110, P.t("sumIs") + " = " + f2(s));
  Play.svg("line", { class: "ed", x1: 226, y1: 66, x2: 262, y2: 66 }, c);
  Play.svg("path", { d: "M262 60 L272 66 L262 72 Z", fill: "currentColor", class: "ed" }, c);
  Play.svg("rect", { class: "nd" + (o ? " on" : ""), x: 274, y: 50, width: 82, height: 32, rx: 8 }, c);
  T(o ? "cto" : "ctb", 315, 71, (s > 0 ? "> 0 " : "≤ 0 ") + (o ? "✓" : "✗"));
  T("ct", 315, 104, S(o ? "yes" : "no"));
  T(o === p.t ? "ct" : "ctb", 315, 124, P.t("shouldBe", { c: S(p.t ? "yes" : "no") }));
}

/* ---------- learning ---------- */
function learnPoint() {
  if (!pts.length) return;
  const p = pts[idx];
  last = learnOne(w, p);
  sel = idx;
  if (last.d) { curMis++; nudges++; }
  idx++;
  if (idx >= pts.length) { per.push(curMis); curMis = 0; idx = 0; }
}
const converged = () => per.length > 0 && per[per.length - 1] === 0;
function learnPass() { do learnPoint(); while (idx !== 0); }
function tick() {
  if (Play.reduced || per.length >= 2) learnPass(); else learnPoint();
  if (converged() || per.length >= CAP) stopAuto();
  else timer = setTimeout(tick, Play.reduced ? 500 : per.length >= 2 ? 160 : 70);
  renderAll();
}
function stopAuto() { if (timer) clearTimeout(timer); timer = null; $("auto").textContent = P.t("play"); }
$("auto").addEventListener("click", () => {
  if (timer) { stopAuto(); return; }
  if (converged() || per.length >= CAP) resetLearn();
  $("auto").textContent = P.t("pause");
  timer = setTimeout(tick, 0);
});
$("one").addEventListener("click", () => { stopAuto(); learnPoint(); renderAll(); });
$("pass").addEventListener("click", () => { stopAuto(); learnPass(); renderAll(); });
$("zero").addEventListener("click", () => { w = { w1: 0, w2: 0, b: 0 }; resetLearn(); renderAll(); });

function renderPasses() {
  const svg = $("passes"), W = Math.max(260, Math.round(svg.getBoundingClientRect().width) || 500), H = 96;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const n = Math.max(1, pts.length), show = Math.max(12, per.length + 1), x0 = 26, bw = (W - x0 - 4) / show, base = H - 6, top = 18;
  Play.svg("line", { class: "axs", x1: x0, x2: W - 2, y1: base, y2: base }, svg);
  Play.svg("text", { class: "axt", x: x0 - 4, y: top + 4, "text-anchor": "end" }, svg).textContent = n;
  Play.svg("text", { class: "axt", x: x0 - 4, y: base, "text-anchor": "end" }, svg).textContent = 0;
  const bars = per.concat(idx > 0 ? [curMis] : []);
  bars.forEach((m, i) => {
    const h = (m / n) * (base - top), x = x0 + i * bw + bw * 0.12;
    if (m === 0 && i < per.length) Play.svg("text", { class: "zlab", x: x + bw * 0.38, y: base - 4, "text-anchor": "middle" }, svg).textContent = "0";
    else Play.svg("rect", { class: "bar", x, y: base - h, width: Math.max(1, bw * 0.76), height: Math.max(0, h), opacity: i < per.length ? 1 : 0.45 }, svg);
  });
}

/* ---------- text ---------- */
function setMsg(el, t, cls) { el.className = "msg" + (cls ? " " + cls : ""); Play.live(el, t); }
function renderText() {
  const nW = wrongCount(w, pts), noLine = !lineInBox(w) && w.w1 === 0 && w.w2 === 0;
  setMsg($("wrongMsg"), noLine ? P.t("noLine") : nW ? P.t("wrongN", { n: nW, m: pts.length }) : P.t("allRight", { m: pts.length }), nW || noLine ? "" : "ok");
  $("leg1").textContent = S("c1"); $("leg0").textContent = S("c0");
  const sgn = (v) => (v < 0 ? " − " + f2(-v) : " + " + f2(v));
  $("big").textContent = "s = " + f2(w.w1) + "·x₁" + sgn(w.w2) + "·x₂" + sgn(w.b);
  // update line for the last learned point
  const u = $("upd");
  u.innerHTML = "";
  if (last && step >= 2) {
    const p = pts[sel], said = P.t("said", { o: S(last.o ? "yes" : "no"), t: S(p.t ? "yes" : "no") });
    if (!last.d) u.textContent = P.t("ok", { s: said });
    else {
      u.append(P.t("upd", { s: said, act: P.t(last.d > 0 ? "addX" : "subX") }));
      [["w₁", "w1", p.x], ["w₂", "w2", p.y], ["b", "b", 1]].forEach(([nm, k, x]) => {
        const br = document.createElement("br"), b = document.createElement("b");
        b.textContent = nm + ": " + f2(last.before[k]) + (last.d > 0 ? " + " : " − ") + "0.1 × " + f1(x) + " = " + f2(last.after[k]);
        u.append(br, b);
      });
    }
  }
  // learn status
  let lm = "", lc = "";
  if (converged()) { lm = P.t("convMsg", { k: per.length }); lc = "ok"; }
  else if (per.length >= CAP) lm = P.t(bestLine(pts) > 0 ? "capXor" : "capSep", { k: per.length, m: per[per.length - 1] });
  else if (idx > 0) lm = P.t("running", { k: per.length + 1, m: curMis });
  else if (per.length) lm = P.t("afterK", { k: per.length, m: per[per.length - 1] });
  else lm = P.t("pressLearn");
  setMsg($("learnMsg"), lm, lc);
  $("nPass").textContent = per.length; $("nNudge").textContent = nudges;
  // step 4 summary, computed from a fresh run starting at 0
  if (step === 3) {
    const r = train({ w1: 0, w2: 0, b: 0 }, pts, ETA, CAP), best = bestLine(pts);
    const txt = r.converged ? P.t("sepRun", { u: r.updates, p: r.per.length })
      : P.t("xorRun", { p: r.per.length, m: r.per[r.per.length - 1], best });
    $("extra").textContent = txt + " " + P.t("storyNote");
  }
}
function renderButtons() {
  dataBtns.forEach(([b, k]) => { b.classList.toggle("on", k === kind); b.setAttribute("aria-pressed", String(k === kind)); });
  storyBtns.forEach(([b, k]) => { b.classList.toggle("on", k === story); b.setAttribute("aria-pressed", String(k === story)); });
}
function renderAll() {
  syncSliders(); renderButtons(); renderPlot(); renderCalc(); renderText();
  if (step >= 2) renderPasses();
}
function mkBtns(box, list, onPick) {
  return list.map(([k, key]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small preset"; b.textContent = P.t(key);
    b.addEventListener("click", () => onPick(k));
    $(box).append(b, " ");
    return [b, k];
  });
}
const dataBtns = mkBtns("dataBtns", [["fruit", "fruitBtn"], ["xor", "xorBtn"]], (k) => setData(k, false));
const storyBtns = mkBtns("storyBtns", [["Fruit", "storyFruit"], ["Plant", "storyPlant"]], (k) => { story = k; renderAll(); });
$("newData").addEventListener("click", () => setData(kind, true));
$("foot").textContent = P.t("foot", { fs: SEED_F, xs: SEED_X, cap: CAP });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("dataRow").hidden = i === 0;
  $("storyRow").hidden = i !== 3;
  $("sliders").hidden = i === 0;
  $("learnBox").hidden = i < 2;
  $("calc").style.display = i === 0 ? "none" : "";
  $("upd").hidden = i < 2;
  $("big").hidden = i === 0;
  $("extra").hidden = i !== 3;
  $("keys").hidden = i === 0;
  if (i === 0) { stopAuto(); if (kind !== "fruit") setData("fruit", false); story = "Fruit"; }
  if (i < 2) stopAuto();
  renderAll();
});
$("resultNote").textContent = P.t("resultNote");
$("reset").addEventListener("click", () => {
  stopAuto(); seedF = SEED_F; seedX = SEED_X; w = { ...W0 }; story = "Fruit";
  setData("fruit", false); pr.reset(); st.go(0);
});
let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(renderAll); });
setData("fruit", false);
</script>
</body>
</html>

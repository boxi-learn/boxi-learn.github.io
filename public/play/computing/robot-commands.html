<script id="logic">
/* Pure logic (no DOM) so it can be checked in node. Grid 6×6, x right, y down; d: 0 up, 1 right, 2 down, 3 left. */
const N = 6;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const PRE = { key: "pre", kind: "pre", start: { x: 1, y: 4, d: 0 }, walls: [], marks: { A: [1, 1], B: [2, 2], C: [4, 4] },
  prog: ["F", "F", "R", "F"], swapped: ["R", "F", "F", "F"] };
const LEVELS = [
  { key: "l1", kind: "star", start: { x: 1, y: 5, d: 0 }, goal: [3, 3], walls: [[2, 5], [3, 5], [3, 4]] },
  { key: "l2", kind: "star", start: { x: 0, y: 5, d: 0 }, goal: [2, 5], walls: [[1, 5], [1, 4], [1, 3], [3, 1], [2, 1]] },
  { key: "l3", kind: "star", start: { x: 0, y: 5, d: 0 }, goal: [1, 0],
    walls: [[0, 3], [1, 3], [2, 3], [2, 1], [3, 1], [4, 1], [5, 1], [0, 1], [4, 3], [5, 3]] },
  { key: "sq1", kind: "tour", start: { x: 2, y: 3, d: 0 }, walls: [[5, 0], [0, 5]],
    dots: [[2, 2], [3, 2], [3, 3], [2, 3]], budget: 3 },
  { key: "sq2", kind: "tour", start: { x: 1, y: 4, d: 0 }, walls: [[2, 2], [3, 2], [2, 3], [3, 3]],
    dots: [[1, 3], [1, 2], [1, 1], [2, 1], [3, 1], [4, 1], [4, 2], [4, 3], [4, 4], [3, 4], [2, 4], [1, 4]], budget: 5 },
];
function blocked(lv, x, y) {
  return x < 0 || y < 0 || x >= N || y >= N || lv.walls.some((w) => w[0] === x && w[1] === y);
}
/* One command → new state; bump = forward into a wall or the edge (state unchanged). */
function apply(lv, s, op) {
  if (op === "L") return { s: { x: s.x, y: s.y, d: (s.d + 3) % 4 } };
  if (op === "R") return { s: { x: s.x, y: s.y, d: (s.d + 1) % 4 } };
  const nx = s.x + DIRS[s.d][0], ny = s.y + DIRS[s.d][1];
  if (blocked(lv, nx, ny)) return { s, bump: true };
  return { s: { x: nx, y: ny, d: s.d } };
}
/* Program items: {op:"F"|"L"|"R"} or {op:"rep", n, body:[…]}. Flatten into the run order. */
function flatten(prog, out, rep, lap) {
  out = out || [];
  for (const it of prog) {
    if (it.op === "rep") { for (let k = 0; k < it.n; k++) flatten(it.body, out, it, k); }
    else out.push({ op: it.op, item: it, rep: rep || null, lap: lap || 0 });
  }
  return out;
}
function written(prog) { return prog.reduce((a, it) => a + (it.op === "rep" ? 1 + written(it.body) : 1), 0); }
function simulate(lv, prog) {
  let s = { ...lv.start };
  const path = [[s.x, s.y]];
  const ops = flatten(prog);
  for (let i = 0; i < ops.length; i++) {
    const r = apply(lv, s, ops[i].op);
    if (r.bump) return { s, path, bump: i };
    s = r.s;
    if (ops[i].op === "F") path.push([s.x, s.y]);
  }
  return { s, path, bump: -1 };
}
/* Verdict after a full run. */
function judge(lv, prog, res) {
  if (res.bump >= 0) return { ok: false, why: "bump" };
  if (lv.kind === "star" || lv.kind === "pre") {
    if (!lv.goal) return { ok: true };
    return res.s.x === lv.goal[0] && res.s.y === lv.goal[1] ? { ok: true } : { ok: false, why: "miss" };
  }
  const missed = lv.dots.filter((d) => !res.path.some((p) => p[0] === d[0] && p[1] === d[1])).length;
  if (missed) return { ok: false, why: "dots", missed };
  if (res.s.x !== lv.start.x || res.s.y !== lv.start.y) return { ok: false, why: "home" };
  if (written(prog) > lv.budget) return { ok: false, why: "budget", works: true };
  return { ok: true };
}
/* Shortest straight-line program (no loops) to the star: breadth-first search over (x, y, facing). */
function shortest(lv) {
  const key = (s) => s.x + "," + s.y + "," + s.d;
  const seen = { [key(lv.start)]: 0 };
  const q = [lv.start];
  while (q.length) {
    const s = q.shift(), k = seen[key(s)];
    if (s.x === lv.goal[0] && s.y === lv.goal[1]) return k;
    for (const op of ["F", "L", "R"]) {
      const r = apply(lv, s, op);
      if (r.bump || key(r.s) in seen) continue;
      seen[key(r.s)] = k + 1;
      q.push(r.s);
    }
  }
  return Infinity;
}
if (typeof module !== "undefined") module.exports = { PRE, LEVELS, apply, flatten, written, simulate, judge, shortest };
</script>

const $ = (id) => document.getElementById(id);
const fig = $("fig"), progEl = $("prog");
const C = 56, O = 12, cx = (x) => O + x * C + C / 2;
const ICON = { F: "↑", L: "↺", R: "↻" };
let uid = 1;
const mk = (op) => (op === "rep" ? { id: uid++, op, n: 4, body: [] } : { id: uid++, op });

/* ---------- state ---------- */
let step = 0, lvIdx = { star: 0, tour: 3 }, lv = PRE;
let progs = {}, sel = {}, solved = {};
let ex = null;          // execution: {ops, i, s, angle, path, status}
let timer = null, running = false, anim = null;
let preRuns = 0, picked = false, swapMode = false;

function freshState() {
  progs = { pre: PRE.prog.map(mk), preSwap: PRE.swapped.map(mk) };
  LEVELS.forEach((l) => (progs[l.key] = []));
  sel = {}; solved = {};
}

/* ---------- drawing ---------- */
let gTrail, gRobot, dotEls = [];
function drawLevel() {
  fig.innerHTML = "";
  const g = Play.svg("g", {}, fig);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    Play.svg("rect", { class: "cell", x: O + x * C, y: O + y * C, width: C, height: C }, g);
  lv.walls.forEach(([x, y]) => {
    Play.svg("rect", { class: "wall", x: O + x * C + 3, y: O + y * C + 3, width: C - 6, height: C - 6, rx: 6 }, g);
    Play.svg("path", { class: "wallx", d: `M${O + x * C + 6} ${O + y * C + C / 2}H${O + x * C + C - 6}M${O + x * C + C / 2} ${O + y * C + 6}V${O + y * C + C / 2}`, fill: "none" }, g);
  });
  if (lv.marks) Object.entries(lv.marks).forEach(([k, [x, y]]) => {
    Play.svg("rect", { class: "mark", x: O + x * C + 4, y: O + y * C + 4, width: C - 8, height: C - 8, rx: 8 }, g);
    Play.svg("text", { class: "marktx", x: O + x * C + 13, y: O + y * C + 14 }, g).textContent = k;
  });
  if (lv.kind === "tour") Play.svg("rect", { class: "home", x: O + lv.start.x * C + 4, y: O + lv.start.y * C + 4, width: C - 8, height: C - 8, rx: 8 }, g);
  if (lv.goal) {
    const [gx, gy] = lv.goal, pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 9 : 21, a = -Math.PI / 2 + (i * Math.PI) / 5;
      pts.push((cx(gx) + r * Math.cos(a)).toFixed(1) + "," + (cx(gy) + r * Math.sin(a)).toFixed(1));
    }
    Play.svg("polygon", { class: "star", points: pts.join(" ") }, g);
  }
  dotEls = (lv.dots || []).map(([x, y]) => Play.svg("circle", { class: "dot", cx: cx(x), cy: cx(y), r: 8 }, g));
  gTrail = Play.svg("polyline", { class: "trail", points: "" }, fig);
  gRobot = Play.svg("g", {}, fig);
  Play.svg("circle", { class: "rbody", cx: 0, cy: 0, r: 17 }, gRobot);
  Play.svg("polygon", { class: "rbody", points: "0,-24 9,-13 -9,-13" }, gRobot);
  Play.svg("polygon", { class: "rnose", points: "0,-11 8,6 0,2 -8,6" }, gRobot);
}
function placeRobot(x, y, ang) {
  gRobot.setAttribute("transform", `translate(${(O + x * C + C / 2).toFixed(1)} ${(O + y * C + C / 2).toFixed(1)}) rotate(${ang.toFixed(1)})`);
}
function drawTrail(path) {
  gTrail.setAttribute("points", path.map(([x, y]) => cx(x) + "," + cx(y)).join(" "));
  dotEls.forEach((el, i) => {
    const d = lv.dots[i];
    el.classList.toggle("got", path.some((p) => p[0] === d[0] && p[1] === d[1]));
  });
}

/* ---------- program editor ---------- */
const prog = () => (lv.kind === "pre" && swapMode ? progs.preSwap : progs[lv.key]);
function locate(id, list = prog(), parent = null) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { list, i, parent };
    if (list[i].op === "rep") { const r = locate(id, list[i].body, list[i]); if (r) return r; }
  }
  return null;
}
function edited() { stopRun(); ex = null; showRobotAtStart(); renderProg(); setMsg(""); }
function add(op) {
  if (lv.kind === "pre") return;
  const it = mk(op), s = sel[lv.key], at = s != null && locate(s);
  if (op === "rep") {
    // a repeat goes at the top level, after the selected top-level item
    let i = prog().length;
    if (at) { const top = at.parent ? locate(at.parent.id) : at; i = top.i + 1; }
    prog().splice(i, 0, it);
  } else if (at && at.list[at.i].op === "rep") at.list[at.i].body.push(it);
  else if (at) at.list.splice(at.i + 1, 0, it);
  else prog().push(it);
  sel[lv.key] = it.id;
  edited();
}
function move(dir) {
  const at = locate(sel[lv.key]);
  if (!at) return;
  const j = at.i + dir;
  if (j < 0 || j >= at.list.length) return;
  [at.list[at.i], at.list[j]] = [at.list[j], at.list[at.i]];
  edited();
}
function removeSel() {
  const at = locate(sel[lv.key]);
  if (!at) return;
  at.list.splice(at.i, 1);
  sel[lv.key] = at.i > 0 ? at.list[at.i - 1].id : at.parent ? at.parent.id : null;
  edited();
}
function removeLast() {
  const p = prog();
  if (!p.length) return;
  const last = p[p.length - 1];
  if (last.op === "rep" && last.body.length) last.body.pop(); else p.pop();
  sel[lv.key] = null;
  edited();
}
function chip(it, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cmd";
  b.dataset.id = it.id;
  b.innerHTML = `<span class="n">${label}</span>` + (it.op === "rep" ? `<span class="ic">⟳</span> ` : `<span class="ic">${ICON[it.op]}</span> `);
  b.appendChild(document.createTextNode(P.t("name" + (it.op === "rep" ? "Rep" : it.op))));
  if (lv.kind === "pre") b.disabled = true;
  else b.addEventListener("click", () => { sel[lv.key] = sel[lv.key] === it.id ? null : it.id; renderProg(); });
  if (sel[lv.key] === it.id) b.classList.add("sel");
  return b;
}
function renderProg() {
  progEl.innerHTML = "";
  const p = prog();
  if (!p.length) {
    const e = document.createElement("span");
    e.className = "empty"; e.textContent = P.t("emptyProg");
    progEl.appendChild(e);
  }
  const cur = ex && ex.i > 0 && ex.status !== "fresh" ? ex.ops[ex.i - 1] : null;
  const bad = ex && ex.status === "bump" ? ex.ops[ex.i] : null;
  const mark = (b, it) => {
    if (bad && bad.item === it) b.classList.add("bad");
    else if (cur && cur.item === it && !bad) b.classList.add("cur");
  };
  p.forEach((it, i) => {
    if (it.op !== "rep") { const b = chip(it, i + 1); mark(b, it); progEl.appendChild(b); return; }
    const box = document.createElement("div");
    box.className = "rep" + (sel[lv.key] === it.id ? " sel" : "");
    const head = document.createElement("div");
    head.className = "rh";
    head.appendChild(chip(it, i + 1));
    const minus = document.createElement("button"), plus = document.createElement("button"), nn = document.createElement("span");
    minus.type = plus.type = "button"; minus.className = plus.className = "nb";
    minus.textContent = "−"; plus.textContent = "+";
    minus.setAttribute("aria-label", "−1"); plus.setAttribute("aria-label", "+1");
    nn.className = "rn"; nn.textContent = it.n;
    minus.disabled = it.n <= 2; plus.disabled = it.n >= 9;
    minus.addEventListener("click", () => { it.n = Play.clamp(it.n - 1, 2, 9); edited(); });
    plus.addEventListener("click", () => { it.n = Play.clamp(it.n + 1, 2, 9); edited(); });
    const tm = document.createElement("span"); tm.className = "lap"; tm.textContent = P.t("times") + " {";
    head.append(minus, nn, plus, tm);
    const lapOp = cur && cur.rep === it ? cur : bad && bad.rep === it ? bad : null;
    if (lapOp) { const l = document.createElement("span"); l.className = "lap"; l.textContent = "· " + P.t("lap", { k: lapOp.lap + 1, n: it.n }); head.appendChild(l); }
    const body = document.createElement("div");
    body.className = "body";
    if (!it.body.length) { const e = document.createElement("span"); e.className = "lap"; e.textContent = P.t("emptyRep"); body.appendChild(e); }
    it.body.forEach((b2, j) => { const b = chip(b2, (i + 1) + "." + (j + 1)); mark(b, b2); body.appendChild(b); });
    const foot = document.createElement("span"); foot.className = "lap"; foot.textContent = "}";
    box.append(head, body, foot);
    progEl.appendChild(box);
  });
  // where new commands go, edit buttons, counts
  const at = sel[lv.key] != null ? locate(sel[lv.key]) : null;
  if (!at) sel[lv.key] = null;
  const selIt = at && at.list[at.i];
  $("where").textContent = !at ? P.t("whereEnd") : selIt.op === "rep" || at.parent ? P.t("whereIn")
    : P.t("whereAfter", { n: at.i + 1 });
  $("mvL").disabled = !at || at.i === 0;
  $("mvR").disabled = !at || at.i === at.list.length - 1;
  $("del").disabled = !at;
  $("clr").disabled = !p.length;
  const w = written(p), u = flatten(p).length;
  $("count").textContent = lv.kind === "tour" ? P.t("countLoop", { w, u, b: lv.budget }) : lv.kind === "star" ? P.t("count", { w }) : "";
  const cmp = $("cmp");
  cmp.hidden = lv.kind !== "tour";
  if (lv.kind === "tour") {
    cmp.innerHTML = "";
    [["cmpW", w], ["cmpU", u], ["cmpB", lv.budget]].forEach(([k, v]) => {
      const a = document.createElement("span"); a.textContent = P.t(k);
      const b = document.createElement("b"); b.textContent = v;
      cmp.append(a, b);
    });
  }
}

/* ---------- running ---------- */
function startExec(list) {
  ex = { ops: flatten(list), i: 0, s: { ...lv.start }, angle: lv.start.d * 90, path: [[lv.start.x, lv.start.y]], status: "fresh" };
}
function showRobotAtStart() {
  cancelAnim();
  gRobot.classList.remove("rbump");
  placeRobot(lv.start.x, lv.start.y, lv.start.d * 90);
  drawTrail([[lv.start.x, lv.start.y]]);
}
function cancelAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } }
function tween(from, to, ms, done) {
  cancelAnim();
  if (ms <= 0) { placeRobot(to.x, to.y, to.a); done(); return; }
  const t0 = performance.now();
  anim = { raf: 0 };
  const f = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    placeRobot(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e, from.a + (to.a - from.a) * e);
    if (k < 1) anim.raf = requestAnimationFrame(f); else { anim = null; done(); }
  };
  anim.raf = requestAnimationFrame(f);
}
const list = prog;
/* Execute one command; calls after() when its animation is done. */
function doOne(ms, after) {
  if (!ex || ex.status === "done" || ex.status === "bump") { startExec(list()); showRobotAtStart(); setMsg(""); }
  if (!ex.ops.length) { setMsg(P.t("noProg"), "no"); stopRun(); return; }
  const o = ex.ops[ex.i], r = apply(lv, ex.s, o.op);
  const from = { x: ex.s.x, y: ex.s.y, a: ex.angle };
  if (r.bump) {
    ex.status = "bump";
    renderProg();
    gRobot.classList.add("rbump");
    const dx = DIRS[ex.s.d][0] * .22, dy = DIRS[ex.s.d][1] * .22;
    tween(from, { x: from.x + dx, y: from.y + dy, a: from.a }, ms / 2, () => tween({ x: from.x + dx, y: from.y + dy, a: from.a }, from, ms / 2, () => {}));
    setMsg(P.t("bump", { n: opNumber(o), c: P.t("name" + o.op) }), "no");
    stopRun();
    return;
  }
  ex.angle += o.op === "L" ? -90 : o.op === "R" ? 90 : 0;
  ex.s = r.s;
  if (o.op === "F") ex.path.push([ex.s.x, ex.s.y]);
  ex.i++;
  ex.status = ex.i >= ex.ops.length ? "done" : "mid";
  renderProg();
  tween(from, { x: ex.s.x, y: ex.s.y, a: ex.angle }, ms, () => {
    drawTrail(ex.path);
    if (ex.status === "done") { finish(); stopRun(); renderProg(); }
    else if (after) after();
  });
}
function opNumber(o) {
  const p = list();
  for (let i = 0; i < p.length; i++) {
    if (p[i] === o.item) return String(i + 1);
    if (p[i].op === "rep") { const j = p[i].body.indexOf(o.item); if (j >= 0) return (i + 1) + "." + (j + 1); }
  }
  return "?";
}
function finish() {
  const res = { s: ex.s, path: ex.path, bump: -1 };
  if (lv.kind === "pre") {
    const m = Object.entries(PRE.marks).find(([, [x, y]]) => x === ex.s.x && y === ex.s.y);
    setMsg(P.t(swapMode ? "swapDone" : "preDone", { m: m ? m[0] : "?" }), "ok");
    if (!swapMode) { preRuns++; $("swap").hidden = false; }
    return;
  }
  const p = prog(), v = judge(lv, p, res), w = written(p), u = flatten(p).length;
  if (v.ok) {
    solved[lv.key] = true;
    if (lv.kind === "star") { const m = shortest(lv); setMsg(P.t(w <= m ? "winBest" : "win", { w, m }), "ok"); }
    else setMsg(P.t("winLoop", { w, u }), "ok");
    renderLevels();
  } else if (v.why === "miss") setMsg(P.t("miss"), "no");
  else if (v.why === "dots") setMsg(P.t("dots", { k: v.missed }), "no");
  else if (v.why === "home") setMsg(P.t("home"), "no");
  else if (v.why === "budget") setMsg(P.t("budget", { w, b: lv.budget }), "no");
}
const msg = $("live");
function setMsg(t, cls) { msg.className = "msg" + (cls ? " " + cls : ""); Play.live(msg, t); }
const SPEED = 420;
function loop() { if (!running) return; doOne(Play.reduced ? 0 : SPEED, () => { timer = setTimeout(loop, Play.reduced ? 380 : 90); }); }
function canRun() {
  if (lv.kind === "pre" && !picked) { setMsg(P.t("pickFirst"), "no"); return false; }
  return true;
}
function run(swapped) {
  if (running) { stopRun(); return; }
  if (anim || !canRun()) return;
  if (lv.kind === "pre" && swapped !== swapMode) { swapMode = swapped; ex = null; showRobotAtStart(); renderProg(); }
  if (!ex || ex.status !== "mid") { startExec(list()); showRobotAtStart(); renderProg(); setMsg(""); }
  if (!ex.ops.length) { setMsg(P.t("noProg"), "no"); return; }
  running = true;
  $("run").textContent = P.t("pause");
  loop();
}
function stopRun() {
  running = false;
  clearTimeout(timer);
  $("run").textContent = P.t("run");
}
function stepOnce() {
  if (running) stopRun();
  if (!canRun()) return;
  if (anim) return;
  if (!ex || ex.status === "fresh") setMsg("");
  doOne(Play.reduced ? 0 : 260);
}
function backToStart() { stopRun(); ex = null; showRobotAtStart(); renderProg(); setMsg(""); }

/* ---------- levels and steps ---------- */
function renderLevels() {
  const row = $("lvlRow");
  row.innerHTML = "";
  row.hidden = step === 0;
  if (step === 0) return;
  const keys = step === 1 ? [0, 1, 2] : [3, 4];
  keys.forEach((i) => {
    const l = LEVELS[i], b = document.createElement("button");
    b.type = "button"; b.className = "small";
    b.textContent = P.t(l.key === "sq1" || l.key === "sq2" ? l.key : "lv" + (i + 1));
    b.classList.toggle("on", lv === l);
    b.classList.toggle("done", !!solved[l.key]);
    b.setAttribute("aria-pressed", lv === l ? "true" : "false");
    b.addEventListener("click", () => { lvIdx[l.kind] = i; setLevel(l); });
    row.appendChild(b);
  });
}
function setLevel(l) {
  stopRun();
  lv = l; ex = null;
  drawLevel(); showRobotAtStart();
  renderLevels(); renderProg(); setMsg("");
  $("pal").hidden = $("editRow").hidden = lv.kind === "pre";
  $("addRep").hidden = lv.kind !== "tour";
  $("swap").hidden = lv.kind !== "pre" || preRuns === 0;
}
freshState();
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("oA") }, { label: P.t("oB"), right: true }, { label: P.t("oC") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { picked = true; if (msg.textContent === P.t("pickFirst")) setMsg(""); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  swapMode = false;
  setLevel(i === 0 ? PRE : LEVELS[i === 1 ? lvIdx.star : lvIdx.tour]);
});

/* ---------- wiring ---------- */
document.querySelectorAll("#pal [data-op]").forEach((b) => b.addEventListener("click", () => add(b.dataset.op)));
$("mvL").addEventListener("click", () => move(-1));
$("mvR").addEventListener("click", () => move(1));
$("del").addEventListener("click", removeSel);
$("clr").addEventListener("click", () => { progs[lv.key] = []; sel[lv.key] = null; edited(); });
$("run").addEventListener("click", () => run(false));
$("swap").addEventListener("click", () => run(true));
$("stepBtn").addEventListener("click", stepOnce);
$("back").addEventListener("click", backToStart);
fig.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowUp") add("F");
  else if (k === "ArrowLeft") add("L");
  else if (k === "ArrowRight") add("R");
  else if (k === "Backspace" || k === "Delete") removeLast();
  else if (k === "Enter") run(false);
  else if (k === " ") stepOnce();
  else return;
  e.preventDefault();
});
$("reset").addEventListener("click", () => {
  stopRun(); freshState(); preRuns = 0; picked = false; swapMode = false;
  lvIdx = { star: 0, tour: 3 }; pr.reset(); st.go(0);
});
st.go(0);
</script>
</body>
</html>

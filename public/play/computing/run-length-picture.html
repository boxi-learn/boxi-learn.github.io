<script id="logic">
/* Pure logic (no DOM) so it can be checked in node. 1 = black square, 0 = white square. */
const N = 10;
const ART = {
  heart: ["..........", ".##....##.", "####..####", "##########", "##########",
          ".########.", "..######..", "...####...", "....##....", ".........."],
  boat: [".....#....", ".....##...", ".....###..", ".....####.", ".....#....",
         "##########", ".########.", "..######..", "..........", ".........."],
  blank: Array(N).fill(".........."),
  stripes: Array(N).fill("##..##..##"),
  checker: Array.from({ length: N }, (_, y) => (y % 2 ? "#.#.#.#.#." : ".#.#.#.#.#")),
};
function parse(rows) {
  return rows.map((r, y) => {
    if (r.length !== N) throw new Error("row " + y + " has " + r.length + " squares");
    return [...r].map((ch) => (ch === "#" ? 1 : 0));
  });
}
const copyGrid = (g) => g.map((r) => r.slice());
const emptyGrid = () => Array.from({ length: N }, () => Array(N).fill(0));
/* One row → counts, always starting with white (a 0 when the row starts black). */
function encodeRow(row) {
  const out = [];
  let colour = 0, n = 0;
  for (const v of row) {
    if (v === colour) n++;
    else { out.push(n); colour = v; n = 1; }
  }
  out.push(n);
  return out;
}
/* Counts → one row. Returns null if the counts are not whole numbers or do not add up to `width`. */
function decodeRow(code, width) {
  const out = [];
  let colour = 0;
  for (const c of code) {
    if (!Number.isInteger(c) || c < 0) return null;
    for (let i = 0; i < c; i++) out.push(colour);
    colour = 1 - colour;
  }
  return out.length === width ? out : null;
}
const encode = (g) => g.map(encodeRow);
const decode = (codes) => codes.map((c) => decodeRow(c, N));
const countNumbers = (g) => encode(g).reduce((s, c) => s + c.length, 0);
/* How many squares of b equal those of a. */
function sameSquares(a, b) {
  let k = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (a[y] && b[y] && a[y][x] === b[y][x]) k++;
  return k;
}
const rowEq = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
/* For each square of a row: its place inside its run (1, 2, 3 …), to count along. */
function runPlaces(row) {
  const out = [];
  let n = 0;
  row.forEach((v, i) => { n = i > 0 && v === row[i - 1] ? n + 1 : 1; out.push(n); });
  return out;
}
if (typeof module !== "undefined") module.exports = { N, ART, parse, copyGrid, emptyGrid, encodeRow, decodeRow, encode, decode, countNumbers, sameSquares, rowEq, runPlaces };
</script>

const $ = (id) => document.getElementById(id);
const nf = (n) => n.toLocaleString(P.lang === "zh" ? "zh-CN" : "en-US");
const SQ = N * N;
const PIC = { heart: parse(ART.heart), boat: parse(ART.boat), blank: parse(ART.blank), stripes: parse(ART.stripes), checker: parse(ART.checker) };
const BOAT_CODE = encode(PIC.boat);
const PICS = [["heart", "pHeart"], ["boat", "pBoat"], ["blank", "pBlank"], ["stripes", "pStripes"], ["checker", "pChecker"], ["yours", "pYours"]];
const board = $("board"), msg = $("live");

let step = 0, mine, guess, seen, cur, pick, fillTimer = null;
function fresh() {
  mine = copyGrid(PIC.heart);   // step 2: the heart (paintable)
  guess = emptyGrid();          // step 3: the child's rebuild
  seen = Array(N).fill(false);
  cur = { x: 0, y: 0 };
  pick = "heart";
  $("paint").checked = false;
  stopFill();
}
const edited = () => sameSquares(mine, PIC.heart) !== SQ;
/* Grid shown in the current step. */
function shown() {
  if (step === 2) return guess;
  if (step === 3) return pick === "yours" ? mine : pick === "heart" ? PIC.heart : PIC[pick];
  return mine;
}
const codeText = (c) => c.join(", ");
function runsText(code) {
  const parts = [];
  code.forEach((n, i) => { if (n > 0 || i === 0) parts.push(P.t(i % 2 ? "runB" : "runW", { n })); });
  return parts.join(P.lang === "zh" ? "、" : ", ");
}

/* ---------- board ---------- */
const rowEls = [], cellEls = [];
for (let y = 0; y < N; y++) {
  const r = document.createElement("div"); r.className = "brow";
  const cs = document.createElement("div"); cs.className = "cells";
  const cells = [];
  for (let x = 0; x < N; x++) {
    const c = document.createElement("div"); c.className = "cell"; c.dataset.x = x; c.dataset.y = y;
    cs.appendChild(c); cells.push(c);
  }
  const mk = document.createElement("span"); mk.className = "mark"; mk.setAttribute("aria-hidden", "true");
  const code = document.createElement("div"); code.className = "code";
  r.append(cs, mk, code);
  board.appendChild(r);
  rowEls.push({ r, code, mk }); cellEls.push(cells);
}
function chips(el, code, hide) {
  el.innerHTML = "";
  code.forEach((n, i) => {
    const s = document.createElement("span");
    s.className = "chip" + (hide ? " q" : i % 2 ? " k" : "");
    s.textContent = hide ? "?" : n;
    el.appendChild(s);
  });
}
function renderBoard() {
  const g = shown();
  const places = runPlaces(g[cur.y]);
  for (let y = 0; y < N; y++) {
    const showCount = step === 1 && y === cur.y;
    for (let x = 0; x < N; x++) {
      const c = cellEls[y][x];
      c.classList.toggle("k", g[y][x] === 1);
      c.classList.toggle("cur", x === cur.x && y === cur.y);
      c.textContent = showCount ? places[x] : "";
    }
    const R = rowEls[y];
    R.r.classList.toggle("sel", step !== 0 && y === cur.y);
    const good = step === 2 && rowEq(encodeRow(guess[y]), BOAT_CODE[y]);
    R.r.classList.toggle("good", good);
    R.mk.textContent = good ? "✓" : "";
    if (step === 0) R.code.innerHTML = "";
    else if (step === 1) { if (seen[y]) chips(R.code, encodeRow(g[y])); else chips(R.code, [0], true); }
    else if (step === 2) chips(R.code, BOAT_CODE[y]);
    else chips(R.code, encodeRow(g[y]));
  }
  rowEls.forEach((R) => R.code.classList.toggle("cut", R.code.scrollWidth > R.code.clientWidth + 1));
  board.classList.toggle("paint", step === 2 || (step === 1 && $("paint").checked));
}

/* ---------- side panel ---------- */
function sayRow(box, label, code) {
  const d = document.createElement("div"); d.className = "say";
  const l = document.createElement("span"); l.textContent = label; d.appendChild(l);
  const c = document.createElement("span"); c.className = "say"; chips(c, code); d.appendChild(c);
  box.appendChild(d);
}
function line(box, text, cls) {
  const d = document.createElement("div"); d.textContent = text; if (cls) d.className = cls; box.appendChild(d); return d;
}
function renderInfo() {
  const box = $("info");
  box.innerHTML = "";
  if (step === 1) {
    const code = encodeRow(mine[cur.y]);
    line(box, P.t("rowSay", { r: cur.y + 1 }) + " " + runsText(code));
    sayRow(box, P.t("nums", { code: "" }), code);
    const r = seen.filter(Boolean).length;
    const n = mine.reduce((s, row, y) => s + (seen[y] ? encodeRow(row).length : 0), 0);
    if (r === N) line(box, P.t("done", { n: countNumbers(mine), sq: SQ }), "big");
    else line(box, P.t("soFar", { n, r }));
  } else if (step === 2) {
    line(box, P.t("rowSay", { r: cur.y + 1 }));
    sayRow(box, P.t("sent"), BOAT_CODE[cur.y]);
    sayRow(box, P.t("yourRow"), encodeRow(guess[cur.y]));
    const k = guess.filter((row, y) => rowEq(encodeRow(row), BOAT_CODE[y])).length;
    if (k === N) line(box, P.t("solved", { same: sameSquares(guess, PIC.boat), sq: SQ, n: countNumbers(PIC.boat) }), "big ok");
    else line(box, P.t("rowsOk", { k }));
  } else if (step === 3) {
    const g = shown(), back = decode(encode(g));
    line(box, P.t("back", { n: countNumbers(g), same: sameSquares(g, back), sq: SQ }), "ok");
  }
}
function renderBars() {
  const box = $("bars");
  box.innerHTML = "";
  if (step !== 3) return;
  line(box, P.t("barsT"), "bt");
  const list = PICS.filter(([id]) => id !== "yours" || edited());
  const vals = list.map(([id]) => countNumbers(id === "yours" ? mine : PIC[id]));
  const max = Math.max(110, ...vals);
  list.forEach(([id, key], i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "bar" + (id === pick ? " on" : "");
    b.setAttribute("aria-pressed", id === pick ? "true" : "false");
    const nm = document.createElement("span"); nm.textContent = P.t(key);
    const tr = document.createElement("span"); tr.className = "track";
    const fl = document.createElement("span"); fl.className = "fill" + (vals[i] > SQ ? " over" : "");
    fl.style.width = (100 * vals[i] / max).toFixed(1) + "%";
    const h = document.createElement("span"); h.className = "hund"; h.style.left = (100 * SQ / max).toFixed(1) + "%";
    tr.append(fl, h);
    const n = document.createElement("span"); n.className = "n"; n.textContent = vals[i];
    b.append(nm, tr, n);
    b.addEventListener("click", () => choose(id));
    box.appendChild(b);
  });
}
function renderPicRow() {
  const row = $("picRow");
  row.querySelectorAll("button").forEach((b) => b.remove());
  PICS.forEach(([id, key]) => {
    if (id === "yours" && !edited()) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (id === pick ? " on" : "");
    b.setAttribute("aria-pressed", id === pick ? "true" : "false");
    b.textContent = P.t(key);
    b.addEventListener("click", () => choose(id));
    row.appendChild(b);
  });
}
function choose(id) {
  pick = id;
  refresh();
  const g = shown();
  Play.live(msg, P.t(PICS.find((p) => p[0] === id)[1]) + ": " + P.t("back", { n: countNumbers(g), same: sameSquares(g, decode(encode(g))), sq: SQ }));
}
function refresh() {
  renderBoard(); renderInfo(); renderBars();
  if (step === 3) renderPicRow();
}
function announceRow() {
  const code = encodeRow(shown()[cur.y]);
  Play.live(msg, P.t("liveRow", { r: cur.y + 1, runs: runsText(code), code: codeText(code) }));
}

/* ---------- interactions ---------- */
function canPaint() { return step === 2 || (step === 1 && $("paint").checked); }
function moveTo(x, y) {
  cur = { x: Play.clamp(x, 0, N - 1), y: Play.clamp(y, 0, N - 1) };
  if (step === 1) seen[cur.y] = true;
  refresh();
}
function setCell(x, y, v) {
  const g = shown();
  if (g[y][x] === v) return;
  g[y][x] = v;
  if (step === 1) seen[y] = true;
}
let drag = null;
board.addEventListener("pointerdown", (e) => {
  const c = e.target.closest(".cell");
  if (!c) return;
  const x = +c.dataset.x, y = +c.dataset.y;
  if (step === 0 || step === 3) { if (step === 3) { cur = { x, y }; refresh(); } return; }
  stopFill();
  cur = { x, y };
  if (step === 1) seen[y] = true;
  if (canPaint()) {
    const v = 1 - shown()[y][x];
    setCell(x, y, v);
    drag = { v };
    if (e.pointerType !== "mouse") e.preventDefault();
  }
  refresh();
  if (canPaint()) Play.live(msg, P.t("liveFlip", { r: y + 1, code: codeText(encodeRow(shown()[y])) }));
  else announceRow();
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const c = el && el.closest && el.closest("#board .cell");
  if (!c) return;
  const x = +c.dataset.x, y = +c.dataset.y;
  if (shown()[y][x] === drag.v && cur.x === x && cur.y === y) return;
  cur = { x, y };
  setCell(x, y, drag.v);
  refresh();
});
const endDrag = () => {
  if (!drag) return;
  drag = null;
  Play.live(msg, P.t("liveFlip", { r: cur.y + 1, code: codeText(encodeRow(shown()[cur.y])) }));
};
addEventListener("pointerup", endDrag);
addEventListener("pointercancel", endDrag);
board.addEventListener("focus", () => { board.classList.add("focus"); });
board.addEventListener("blur", () => board.classList.remove("focus"));
board.addEventListener("keydown", (e) => {
  if (step === 0) return;
  const k = e.key;
  if (k === "ArrowLeft") moveTo(cur.x - 1, cur.y);
  else if (k === "ArrowRight") moveTo(cur.x + 1, cur.y);
  else if (k === "ArrowUp") { moveTo(cur.x, cur.y - 1); announceRow(); }
  else if (k === "ArrowDown") { moveTo(cur.x, cur.y + 1); announceRow(); }
  else if ((k === " " || k === "Enter") && canPaint()) {
    stopFill();
    setCell(cur.x, cur.y, 1 - shown()[cur.y][cur.x]); refresh();
    Play.live(msg, P.t("liveFlip", { r: cur.y + 1, code: codeText(encodeRow(shown()[cur.y])) }));
  } else if ((k === "f" || k === "F") && step === 2) fillRow();
  else return;
  e.preventDefault();
});
$("paint").addEventListener("change", refresh);
$("allBtn").addEventListener("click", () => { seen.fill(true); refresh(); Play.live(msg, P.t("done", { n: countNumbers(mine), sq: SQ })); });

/* Step 3 helper: decode the selected row square by square (instantly when motion is reduced). */
function stopFill() { if (fillTimer) { clearInterval(fillTimer); fillTimer = null; } }
function fillRow() {
  stopFill();
  const y = cur.y, row = decodeRow(BOAT_CODE[y], N);
  if (!row) return;
  const done = () => { refresh(); Play.live(msg, P.t("liveFlip", { r: y + 1, code: codeText(encodeRow(guess[y])) })); };
  if (Play.reduced) { guess[y] = row.slice(); done(); return; }
  let x = 0;
  fillTimer = setInterval(() => {
    if (step !== 2 || x >= N) { stopFill(); done(); return; }
    guess[y][x] = row[x]; cur = { x, y }; x++;
    refresh();
  }, 90);
}
$("fillBtn").addEventListener("click", fillRow);
$("clearBtn").addEventListener("click", () => { stopFill(); guess = emptyGrid(); refresh(); Play.live(msg, ""); });

/* ---------- steps ---------- */
fresh();
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  stopFill();
  drag = null;
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("info").hidden = i === 0;
  $("bars").hidden = $("lossy").hidden = $("picRow").hidden = i !== 3;
  $("pane").hidden = i === 0;
  $("row2").hidden = i !== 1;
  $("row3").hidden = i !== 2;
  $("keys").textContent = i ? P.t("keys" + k) : "";
  if (i === 1) seen[cur.y] = true;
  refresh();
  Play.live(msg, "");
});
const heartN = countNumbers(PIC.heart), checkN = countNumbers(PIC.checker);
$("resultMain").textContent = P.t("resultMain", { sq: SQ, n: heartN });
$("resultNote").textContent = P.t("resultNote", { c: checkN, sq: SQ });
$("reset").addEventListener("click", () => { fresh(); pr.reset(); st.go(0); });
addEventListener("resize", renderBoard);
</script>
</body>
</html>

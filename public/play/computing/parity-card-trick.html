<script id="logic">
/* Pure logic (no DOM) so it can be checked in node. Grids are arrays of rows, 1 = black side up. */
const N = 5, M = N + 1;
/* mulberry32: small seeded RNG, same cards for the same seed. */
function rng(seed) {
  let a = Number.isFinite(+seed) ? (+seed | 0) : 1;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function deal(seed, n = N) {
  const r = rng(seed);
  return Array.from({ length: n }, () => Array.from({ length: n }, () => (r() < 0.5 ? 1 : 0)));
}
const rowCounts = (g) => g.map((row) => row.reduce((s, v) => s + v, 0));
const colCounts = (g) => (g.length ? g[0].map((_, c) => g.reduce((s, row) => s + row[c], 0)) : []);
/* The magician's move: one extra card per row, then one extra row, so every row and column is even. */
function withParity(g) {
  const rows = g.map((row) => row.concat(row.reduce((s, v) => s + v, 0) % 2));
  const last = colCounts(rows).map((s) => s % 2);
  return rows.concat([last]);
}
const allEven = (g) => rowCounts(g).every((v) => v % 2 === 0) && colCounts(g).every((v) => v % 2 === 0);
const flipCell = (g, r, c) => g.map((row, i) => row.map((v, j) => (i === r && j === c ? 1 - v : v)));
/* What the magician sees: which rows and columns are odd, and what that means. */
function diagnose(g) {
  const rows = [], cols = [];
  rowCounts(g).forEach((v, i) => { if (v % 2) rows.push(i); });
  colCounts(g).forEach((v, j) => { if (v % 2) cols.push(j); });
  const kind = !rows.length && !cols.length ? "clean" : rows.length === 1 && cols.length === 1 ? "one" : "many";
  return { kind, rows, cols, cell: kind === "one" ? [rows[0], cols[0]] : null, candidates: rows.length * cols.length };
}
/* Four corners of a random rectangle: flipping all four keeps every row and column even. */
function corners(r, m = M) {
  const pick2 = () => { const a = Math.floor(r() * m); let b = Math.floor(r() * (m - 1)); if (b >= a) b++; return [Math.min(a, b), Math.max(a, b)]; };
  const [r1, r2] = pick2(), [c1, c2] = pick2();
  return [[r1, c1], [r1, c2], [r2, c1], [r2, c2]];
}
const randCell = (r, m = M) => [Math.floor(r() * m), Math.floor(r() * m)];
if (typeof module !== "undefined") module.exports = { N, M, rng, deal, rowCounts, colCounts, withParity, allEven, flipCell, diagnose, corners, randCell };
</script>

let seed = START_SEED, base = withParity(deal(seed)), cur = base, flips = new Map();
let step = 0, mode = "a", focus = [0, 0], showCounts = true;
let secret = null, solved = false, score = { f: 0, n: 0, t: 0 }, pick = rng(seed * 7919 + 13), hideTimer = null, demo = null;
let cells = [], rowBands = [], colBands = [], rowBadges = [], colBadges = [], badgeLayer = null, curtain = null;
if (Play.reduced) document.body.classList.add("noanim");

/* ---------- figure ---------- */
function badge(parent, x, y) {
  const g = S("g", { class: "badge" }, parent);
  S("rect", { x: x - 18, y: y - 16, width: 36, height: 32, rx: 8 }, g);
  const t = S("text", { x, y: y + 6 }, g);
  return { g, t };
}
function build() {
  fig.innerHTML = "";
  const bandW = M * CELL + GAP;
  rowBands = Array.from({ length: M }, (_, i) => S("rect", { class: "band", x: X0 - 4, y: cy(i), width: bandW + 4, height: CELL - 2, rx: 6 }, fig));
  colBands = Array.from({ length: M }, (_, j) => S("rect", { class: "band", x: cx(j), y: Y0 - 4, width: CELL - 2, height: bandW + 4, rx: 6 }, fig));
  for (let k = 0; k < M; k++) {
    S("text", { class: "idx", x: cx(k) + CELL / 2 - 1, y: Y0 - 8 }, fig).textContent = k + 1;
    S("text", { class: "idx", x: X0 - 13, y: cy(k) + CELL / 2 + 4 }, fig).textContent = k + 1;
  }
  S("rect", { class: "zone", x: cx(N) - 4, y: Y0 - 3, width: CELL + 6, height: M * CELL + GAP + 4, rx: 8 }, fig);
  S("rect", { class: "zone", x: X0 - 3, y: cy(N) - 4, width: N * CELL + 2, height: CELL + 6, rx: 8 }, fig);
  cells = [];
  for (let i = 0; i < M; i++) {
    const rowArr = [];
    for (let j = 0; j < M; j++) {
      const x = cx(j) + (CELL - CARD) / 2 - 1, y = cy(i) + (CELL - CARD) / 2 - 1;
      const g = S("g", { class: "cell", role: "button", tabindex: -1 }, fig);
      S("rect", { class: "face", x, y, width: CARD, height: CARD, rx: 6 }, g);
      S("circle", { class: "mark", cx: x + CARD - 8, cy: y + 8, r: 4.5 }, g);
      S("rect", { class: "hit", x: x - 3, y: y - 3, width: CARD + 6, height: CARD + 6, rx: 8 }, g);
      S("rect", { class: "miss", x: x - 3, y: y - 3, width: CARD + 6, height: CARD + 6, rx: 8 }, g);
      S("rect", { class: "ring", x: x - 5, y: y - 5, width: CARD + 10, height: CARD + 10, rx: 9 }, g);
      g.addEventListener("click", () => { focus = [i, j]; act(i, j); });
      g.addEventListener("keydown", (e) => onKey(e, i, j));
      g.addEventListener("animationend", () => g.classList.remove("spin"));
      rowArr.push(g);
    }
    cells.push(rowArr);
  }
  badgeLayer = S("g", { class: "badges" }, fig);
  rowBadges = Array.from({ length: M }, (_, i) => badge(badgeLayer, GRID_END + 28, cy(i) + CELL / 2 - 1));
  colBadges = Array.from({ length: M }, (_, j) => badge(badgeLayer, cx(j) + CELL / 2 - 1, GRID_END + 26));
  curtain = S("g", { visibility: "hidden" }, fig);
  S("rect", { class: "curtain", x: X0 - 6, y: Y0 - 6, width: M * CELL + GAP + 10, height: M * CELL + GAP + 10, rx: 10 }, curtain);
  S("text", { class: "curtain-t", x: X0 + (M * CELL + GAP) / 2, y: Y0 + (M * CELL + GAP) / 2 + 6 }, curtain).textContent = P.t("curtain");
}

const interactive = () => step > 0;
function paint() {
  const d = diagnose(cur), rc = rowCounts(cur), cc = colCounts(cur);
  const guessing = step === 1 && mode === "b" && secret && !solved;
  const countsOn = step > 0 && (showCounts || step === 3);
  const bandsOn = countsOn && !(guessing && !showCounts);
  fig.classList.toggle("live", interactive());
  for (let i = 0; i < M; i++) for (let j = 0; j < M; j++) {
    const g = cells[i][j], black = cur[i][j] === 1, extra = i === N || j === N;
    g.classList.toggle("b", black);
    g.classList.toggle("w", !black);
    g.classList.toggle("mine", step > 0 && !(step === 1 && mode === "b") && flips.has(i + "," + j));
    g.classList.toggle("found", step > 0 && !!d.cell && d.cell[0] === i && d.cell[1] === j && !guessing);
    g.setAttribute("tabindex", interactive() && focus[0] === i && focus[1] === j ? 0 : -1);
    g.setAttribute("aria-label", P.t("cellAria", { r: i + 1, c: j + 1, side: P.t(black ? "black" : "white"), extra: extra ? P.t("extraCard") : "" }));
  }
  rowBands.forEach((b, i) => b.classList.toggle("on", bandsOn && rc[i] % 2 === 1));
  colBands.forEach((b, j) => b.classList.toggle("on", bandsOn && cc[j] % 2 === 1));
  rowBadges.forEach((b, i) => { b.t.textContent = rc[i]; b.g.classList.toggle("odd", rc[i] % 2 === 1); });
  colBadges.forEach((b, j) => { b.t.textContent = cc[j]; b.g.classList.toggle("odd", cc[j] % 2 === 1); });
  badgeLayer.classList.toggle("off", !countsOn);
  $("lgOdd").hidden = !countsOn;
  $("score").textContent = step === 1 && mode === "b" ? P.t("score", score) : "";
  if (step === 3) paintRule();
}
const msg = $("live");
const say = (t) => Play.live(msg, t);
function spin(i, j) {
  if (Play.reduced) return;
  const g = cells[i][j];
  g.classList.remove("spin"); void g.getBBox(); g.classList.add("spin");
  clearTimeout(g._t); g._t = setTimeout(() => g.classList.remove("spin"), 400); /* in case animationend never fires */
}
function clearMarks() { cells.flat().forEach((g) => g.classList.remove("missed")); }

/* ---------- actions ---------- */
function toggle(i, j, anim = true) {
  cur = flipCell(cur, i, j);
  const k = i + "," + j;
  if (flips.has(k)) flips.delete(k); else flips.set(k, [i, j]);
  if (anim) spin(i, j);
}
function restore() { cur = base; flips = new Map(); secret = null; solved = false; clearMarks(); }
function stopHide() { if (hideTimer) clearTimeout(hideTimer); hideTimer = null; curtain && curtain.setAttribute("visibility", "hidden"); }

function diagText() {
  const d = diagnose(cur), k = flips.size;
  if (k === 0) return P.t("cClean0");
  if (d.kind === "clean") return P.t("cClean", { k });
  if (d.kind === "one") {
    const real = k === 1 && flips.has(d.cell.join(","));
    return P.t(real ? "cOne" : "cFooled", { k, r: d.cell[0] + 1, c: d.cell[1] + 1 });
  }
  return P.t(d.candidates ? "cMany" : "cManyLine", { k, nr: d.rows.length, nc: d.cols.length, cand: d.candidates });
}
const sayDiag = () => say(diagText());
function act(i, j) {
  if (!interactive() || hideTimer) return;
  if (step === 1 && mode === "a") {
    /* One flip at a time here: tapping another card moves the flip. */
    const prev = [...flips.values()][0];
    if (prev) toggle(prev[0], prev[1], false);
    if (!prev || prev[0] !== i || prev[1] !== j) toggle(i, j);
    paint();
    const d = diagnose(cur);
    if (d.cell) say(P.t("aFound", { r: d.cell[0] + 1, c: d.cell[1] + 1, rc: rowCounts(cur)[d.cell[0]], cc: colCounts(cur)[d.cell[1]] }));
    else say(P.t("aStart"));
  } else if (step === 1 && mode === "b") {
    if (!secret || solved) { say(P.t(solved ? "bDone" : "bStart")); return; }
    score.t++;
    clearMarks();
    if (i === secret[0] && j === secret[1]) {
      solved = true; score.f++;
      paint();
      say(P.t("bRight", { r: i + 1, c: j + 1, rc: rowCounts(cur)[i], cc: colCounts(cur)[j] }));
    } else {
      cells[i][j].classList.add("missed");
      paint();
      say(P.t("bWrong"));
    }
  } else if (step === 2) {
    toggle(i, j); paint(); sayDiag();
  } else if (step === 3) {
    showDemo(i, j);
  }
}
function onKey(e, i, j) {
  const k = e.key;
  const moveTo = (a, b) => { focus = [Play.clamp(a, 0, M - 1), Play.clamp(b, 0, M - 1)]; paint(); cells[focus[0]][focus[1]].focus(); };
  if (k === "ArrowLeft") moveTo(i, j - 1);
  else if (k === "ArrowRight") moveTo(i, j + 1);
  else if (k === "ArrowUp") moveTo(i - 1, j);
  else if (k === "ArrowDown") moveTo(i + 1, j);
  else if (k === "Home") moveTo(i, 0);
  else if (k === "End") moveTo(i, M - 1);
  else if (k === " " || k === "Enter") act(i, j);
  else return;
  e.preventDefault();
}
function hideAndFlip() {
  stopHide(); restore(); paint();
  const [i, j] = randCell(pick);
  curtain.setAttribute("visibility", "visible");
  say(P.t("bHiding"));
  hideTimer = setTimeout(() => {
    hideTimer = null;
    toggle(i, j, false);
    secret = [i, j]; solved = false; score.n++;
    curtain.setAttribute("visibility", "hidden");
    paint();
    say(P.t("bHidden"));
  }, Play.reduced ? 0 : 700);
}
function newDeal() {
  stopHide();
  seed++;
  base = withParity(deal(seed)); pick = rng(seed * 7919 + 13);
  restore();
  if (step === 3) { const [i, j] = randCell(pick); showDemo(i, j); }
  paint(); paintFoot();
  if (step !== 3) say(P.t("dealt", { d: seed }));
}
function showDemo(i, j) {
  restore(); demo = [i, j];
  toggle(i, j); paint();
  say(P.t("aFound", { r: i + 1, c: j + 1, rc: rowCounts(cur)[i], cc: colCounts(cur)[j] }));
}
function paintRule() {
  const fmtList = (arr, odd) => arr.map((v, k) => (odd && v % 2 ? "<span class=\"odd\">" + v + "</span>" : v)).join(" · ");
  $("before").innerHTML = P.t("rowsL") + ": " + fmtList(rowCounts(base)) + "<br>" + P.t("colsL") + ": " + fmtList(colCounts(base));
  $("afterHd").textContent = demo ? P.t("afterHd", { r: demo[0] + 1, c: demo[1] + 1 }) : "";
  $("after").innerHTML = P.t("rowsL") + ": " + fmtList(rowCounts(cur), true) + "<br>" + P.t("colsL") + ": " + fmtList(colCounts(cur), true);
}

$("modeA").addEventListener("click", () => setMode("a"));
$("modeB").addEventListener("click", () => setMode("b"));
function setMode(m) {
  stopHide(); mode = m; restore();
  showCounts = m === "a"; $("counts").checked = showCounts;
  $("modeA").classList.toggle("on", m === "a"); $("modeA").setAttribute("aria-pressed", m === "a");
  $("modeB").classList.toggle("on", m === "b"); $("modeB").setAttribute("aria-pressed", m === "b");
  $("hide").hidden = m !== "b";
  paint();
  say(P.t(m === "a" ? "aStart" : "bStart"));
}
$("hide").addEventListener("click", hideAndFlip);
$("deal").addEventListener("click", newDeal);
$("undo").addEventListener("click", () => { restore(); paint(); sayDiag(); });
$("again").addEventListener("click", () => {
  let c = randCell(pick);
  if (demo && c[0] === demo[0] && c[1] === demo[1]) c = [(c[0] + 1) % M, c[1]];
  showDemo(c[0], c[1]);
});
$("corners").addEventListener("click", () => {
  const cs = corners(pick);
  cs.forEach(([i, j]) => toggle(i, j));
  paint();
  say(P.t("cornersSay", { r1: cs[0][0] + 1, r2: cs[3][0] + 1, c1: cs[0][1] + 1, c2: cs[3][1] + 1 }) + " " + diagText());
});
$("counts").addEventListener("change", () => { showCounts = $("counts").checked; paint(); });

/* ---------- steps ---------- */
build();
fresh();
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("oMis") }, { label: P.t("oLuck") }, { label: P.t("oYes"), right: true }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i; stopHide(); restore(); demo = null;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("modeRow").hidden = i !== 1;
  $("hide").hidden = !(i === 1 && mode === "b");
  $("corners").hidden = $("undo").hidden = i !== 2;
  $("again").hidden = i !== 3;
  $("deal").hidden = i === 0;
  $("counts").parentElement.hidden = i !== 1;
  $("ruleBox").hidden = $("uses").hidden = i !== 3;
  $("keys").hidden = i === 0;
  if (i === 1) showCounts = mode === "a" ? true : $("counts").checked;
  if (i === 2) showCounts = true;
  if (i === 3) { const [a, b] = randCell(pick); showDemo(a, b); }
  paint();
  if (i === 0) say("");
  else if (i === 1) say(P.t(mode === "a" ? "aStart" : "bStart"));
  else if (i === 2) sayDiag();
});
$("uses").textContent = P.t("uses");
$("keys").textContent = P.t("keys");
$("resultMain").textContent = P.t("resultMain");
$("resultNote").textContent = P.t("resultNote", { n: N, k: M * M - N * N, lines: 2 * M });
function paintFoot() { $("foot").textContent = P.t("foot", { n: N, nn: N * N, k: M * M - N * N, mm: M * M, d: seed }); }

function fresh() {
  stopHide();
  seed = START_SEED; base = withParity(deal(seed)); pick = rng(seed * 7919 + 13);
  mode = "a"; showCounts = true; $("counts").checked = true; focus = [0, 0];
  score = { f: 0, n: 0, t: 0 }; demo = null;
  $("modeA").classList.add("on"); $("modeA").setAttribute("aria-pressed", "true");
  $("modeB").classList.remove("on"); $("modeB").setAttribute("aria-pressed", "false");
  restore(); paintFoot();
}
$("reset").addEventListener("click", () => { fresh(); pr.reset(); st.go(0); });
</script>
</body>
</html>

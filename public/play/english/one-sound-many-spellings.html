<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One sound, several spellings</title>
<link rel="stylesheet" href="../play.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  .visual { padding: 14px 12px 12px; }
  .sounds { display: flex; gap: 6px; flex-wrap: wrap; }
  .sounds button { flex: 1 1 0; min-width: 0; font-size: 14px; padding: 6px 6px; line-height: 1.3; }
  .sounds button .ex { display: block; font-family: var(--serif); font-size: 13px; opacity: .8; }
  .hearrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 8px; font-size: 14px; }
  .score { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .bin { border: 2px dashed var(--line); border-radius: 12px; background: var(--soft); min-height: 150px; display: flex; flex-direction: column; transition: border-color .15s, background .15s; }
  .bin.ready { border-color: var(--a); }
  .bin.over { border-style: solid; border-color: var(--a); background: var(--surface); }
  .bin.bad { border-color: var(--no); border-style: solid; }
  .binhead { border: 0; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; background: transparent; padding: 6px 4px 4px; width: 100%; text-align: center; }
  .binhead .pat { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.15; color: var(--a); }
  .binhead .cnt { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .got { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-content: flex-start; }
  .got button { font-family: var(--serif); font-size: 15px; padding: 1px 7px; border-radius: 999px; }
  .m { color: var(--a); font-weight: 750; text-decoration: underline; text-underline-offset: 3px; }
  .fb { font-size: 14px; min-height: 2.6em; margin: 8px 2px 6px; color: var(--muted); }
  .fb.ok { color: var(--a); }
  .fb.no { color: var(--no); }
  .deck { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px 0 2px; border-top: 1px solid var(--line); min-height: 56px; }
  .card { font-family: var(--serif); font-size: 21px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.08); touch-action: none; user-select: none; -webkit-user-select: none; position: relative; }
  .card.sel { border-color: var(--a); box-shadow: 0 0 0 3px var(--a); }
  .card.drag { z-index: 10; cursor: grabbing; box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: none; }
  .card.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .card.shake { animation: none; } }
  .done { text-align: center; font-size: 14px; color: var(--muted); padding: 6px; }
  .ex1 { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .ex1 button, .exc button { font-family: var(--serif); font-size: 17px; }
  table.counts { width: 100%; border-collapse: collapse; font-size: 14px; margin: 2px 0 10px; }
  table.counts th, table.counts td { border-bottom: 1px solid var(--line); padding: 4px 4px; text-align: left; vertical-align: top; }
  table.counts th { color: var(--muted); font-weight: 600; font-size: 13px; }
  table.counts td.p { font-family: var(--serif); font-size: 17px; color: var(--a); white-space: nowrap; }
  table.counts td.n { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--fg); }
  table.counts .w { display: block; white-space: normal; overflow-wrap: anywhere; font-family: var(--serif); color: var(--muted); font-size: 13px; }
  .rule { color: var(--fg) !important; font-weight: 600; }
  .exc { display: grid; gap: 6px; margin: 4px 0 10px; }
  .exc .row { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--muted); }
  .exc button { min-width: 70px; flex: none; }
  .play .note { font-size: 14px !important; }
  .result .math { font-family: var(--serif); white-space: normal; overflow-wrap: anywhere; }
  .foot { font-size: 13px; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .binhead .pat { font-size: 22px; }
    .card { font-size: 19px; padding: 5px 11px; }
    .got button { font-size: 14px; }
  }
</style>
</head>
<body data-subject="english">

  <div class="navrow">

</div>
<script src="../play.js"></script>

    foot: "Sound marks follow phonics books (/ā/ = long a as in rain), not IPA. The spellings are the alternative vowel spellings taught in UK Letters and Sounds (2007), Phase 5, and in US first-grade phonics. Counts are of the cards on this page only, not of all English words; a word made from a shorter one (player) is counted where the letters sit. Long o is /oʊ/ in American and /əʊ/ in southern British English. Speech uses your browser's built-in voice. CC BY-SA 4.0 · Boxi Yu",
  },

    q: "ai、ay、a_e 长得不一样。在 rain、play、cake 里它们读什么音？",
    o1: "三个不同的音——字母不同，音就不同", o2: "同一个音，三种写法", o3: "只有 ai 读长音 a，另外两个不发音",
    right: "对！三个都读长音 a /ā/。一个音可以有不止一种写法。",

    ruleBoth: "数一数：{A} 在词尾 {ea}/{na} 个，{B} 在词尾 {eb}/{nb} 个。两种在词尾、词中都有，这里位置定不了——这些词要记。",

// ---- data: every word says the set's long vowel; the bin is computed by spellingOf() ----
const SOUNDS = [
  { id: "a", v: "a", ex: ["rain", "play", "cake"], pats: [
    { p: "ai", type: "team", words: ["rain", "tail", "train", "paint", "snail", "wait"] },
    { p: "ay", type: "team", words: ["play", "day", "say", "tray", "stay", "way", "player"] },
    { p: "a_e", type: "split", words: ["cake", "game", "name", "gate", "lake", "plane"] },
  ] },
  { id: "e", v: "e", ex: ["tree", "sea", "me"], pats: [
    { p: "ee", type: "team", words: ["tree", "see", "bee", "feet", "green", "sleep"] },
    { p: "ea", type: "team", words: ["sea", "tea", "eat", "leaf", "beach", "dream"] },
    { p: "e", type: "single", words: ["me", "he", "we", "she", "be"] },
  ] },
  { id: "o", v: "o", ex: ["boat", "snow", "home"], pats: [
    { p: "oa", type: "team", words: ["boat", "coat", "road", "soap", "goat", "toast"] },
    { p: "ow", type: "team", words: ["snow", "grow", "show", "slow", "blow", "bowl"] },
    { p: "o_e", type: "split", words: ["home", "bone", "rope", "nose", "stone", "note"] },
  ] },
];
const VOW = /[aeiou]/g;
// Which spelling of sound s does word w use? Teams first, then vowel-consonant-e, then a lone vowel at the end.
function spellingOf(w, s) {
  for (const q of s.pats) if (q.type === "team" && w.includes(q.p)) return q.p;
  for (const q of s.pats) if (q.type === "split" && new RegExp(s.v + "[^aeiou]e$").test(w)) return q.p;
  for (const q of s.pats) if (q.type === "single" && w.endsWith(s.v) && (w.match(VOW) || []).length === 1) return q.p;
  return null;
}
// Where the spelling sits: "start" | "middle" | "end".
function positionOf(w, q) {
  if (q.type !== "team") return "end";
  const i = w.indexOf(q.p);
  if (i < 0) return null;
  if (i + q.p.length === w.length) return "end";
  return i === 0 ? "start" : "middle";
}
function countSound(s) {
  return s.pats.map((q) => {
    const c = { p: q.p, type: q.type, n: 0, end: 0, inside: 0, endW: [], inW: [] };
    s.pats.forEach((q2) => q2.words.forEach((w) => {
      if (spellingOf(w, s) !== q.p) return;
      c.n++;
      if (positionOf(w, q) === "end") { c.end++; c.endW.push(w); } else { c.inside++; c.inW.push(w); }
    }));
    return c;
  });
}
// Compare the two letter-team spellings of a sound by how often they end the word.
function ruleOf(s) {
  const t = countSound(s).filter((c) => c.type === "team" && c.n > 0);
  if (t.length < 2) return null;
  t.sort((x, y) => y.end / y.n - x.end / x.n);
  const [A, B] = t, rA = A.end / A.n, rB = B.end / B.n;
  return { kind: rA >= 0.75 && rB <= 0.25 ? "ruleSplit" : "ruleBoth", A: A.p, B: B.p, ea: A.end, na: A.n, eb: B.end, nb: B.n };
}
// The marked letters of w for spelling q (indexes).
function markIdx(w, q) {
  if (q.type === "team") { const i = w.indexOf(q.p); return i < 0 ? [] : [i, i + 1]; }
  if (q.type === "split") return [w.length - 3, w.length - 1];
  return [w.length - 1];
}
if (typeof module !== "undefined") module.exports = { SOUNDS, spellingOf, positionOf, countSound, ruleOf, markIdx };

// ---- state ----
const $ = (id) => document.getElementById(id);
let cur = 0, state, sel = null;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh() {
  state = SOUNDS.map((s) => ({ deck: shuffle(s.pats.flatMap((q) => q.words)), placed: {}, first: 0, missed: new Set() }));
  sel = null;
}
const total = (i) => SOUNDS[i].pats.reduce((k, q) => k + q.words.length, 0);
const nPlaced = (i) => Object.keys(state[i].placed).length;

function marked(w, q) {
  const idx = markIdx(w, q), frag = document.createDocumentFragment();
  [...w].forEach((ch, i) => {
    if (idx.includes(i)) { const s = document.createElement("span"); s.className = "m"; s.textContent = ch; frag.appendChild(s); }
    else frag.appendChild(document.createTextNode(ch));
  });
  return frag;
}

// ---- sound tabs ----
const sBtns = SOUNDS.map((s, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = "";
  b.append(P.t("snd_" + s.id));
  const ex = document.createElement("span"); ex.className = "ex"; ex.lang = "en"; ex.textContent = s.ex.join(" · ");
  b.appendChild(ex);
  b.addEventListener("click", () => { cur = i; sel = null; setFb("", ""); draw(); });
  $("sounds").appendChild(b);
  return b;
});
$("hearS").addEventListener("click", () => Play.speak(SOUNDS[cur].ex.join(". ") + ".", "en-US"));

// ---- bins ----
let binEls = [];
function buildBins() {
  $("bins").innerHTML = "";
  binEls = SOUNDS[cur].pats.map((q, k) => {
    const bin = document.createElement("div");
    bin.className = "bin"; bin.dataset.k = k;
    const head = document.createElement("button");
    head.type = "button"; head.className = "binhead";
    head.innerHTML = '<span class="pat" lang="en"></span><span class="cnt"></span>';
    head.querySelector(".pat").textContent = (k + 1) + " · " + q.p;
    head.addEventListener("click", (e) => {
      if (!sel) { setFb(P.t("pickFirst"), ""); return; }
      place(sel, k, e.detail === 0);
    });
    const got = document.createElement("div"); got.className = "got"; got.lang = "en";
    bin.append(head, got);
    $("bins").appendChild(bin);
    return { bin, head, got };
  });
}

// ---- cards (tap, drag, keyboard) ----
let drag = null, suppressClick = false;
function cardEl(w) {
  const c = document.createElement("button");
  c.type = "button"; c.className = "card"; c.textContent = w; c.dataset.w = w;
  c.setAttribute("aria-pressed", "false");
  c.setAttribute("aria-label", P.t("cardAria", { w }));
  c.addEventListener("click", () => {
    if (suppressClick) { suppressClick = false; return; }
    pick(w);
  });
  c.addEventListener("keydown", (e) => {
    const k = ["1", "2", "3"].indexOf(e.key);
    if (k >= 0 && k < SOUNDS[cur].pats.length) { place(w, k, true); e.preventDefault(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const cs = [...$("deck").querySelectorAll(".card")], i = cs.indexOf(c);
      const j = Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, cs.length - 1);
      cs[j].focus(); e.preventDefault();
    }
    if (e.key === "Escape") { sel = null; markSel(); }
  });
  c.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { c, w, x: e.clientX, y: e.clientY, id: e.pointerId, on: false };
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  c.addEventListener("pointermove", (e) => {
    if (!drag || drag.c !== c) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) > 8) { drag.on = true; c.classList.add("drag"); }
    if (!drag.on) return;
    c.style.transform = "translate(" + dx + "px," + dy + "px)";
    const k = binAt(e.clientX, e.clientY);
    binEls.forEach((b, i) => b.bin.classList.toggle("over", i === k));
  });
  const end = (e, cancel) => {
    if (!drag || drag.c !== c) return;
    const d = drag; drag = null;
    if (!d.on) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    c.classList.remove("drag"); c.style.transform = "";
    binEls.forEach((b) => b.bin.classList.remove("over"));
    const k = cancel ? -1 : binAt(e.clientX, e.clientY);
    if (k >= 0) place(d.w, k, false);
  };
  c.addEventListener("pointerup", (e) => end(e, false));
  c.addEventListener("pointercancel", (e) => end(e, true));
  return c;
}
function binAt(x, y) {
  const els = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
  for (const el of els) { const b = el.closest && el.closest(".bin"); if (b) return +b.dataset.k; }
  return -1;
}
function pick(w) {
  sel = w;
  Play.speak(w, "en-US");
  markSel();
  setFb(P.t("pick", { w }), "");
}
function markSel() {
  $("deck").querySelectorAll(".card").forEach((c) => {
    const on = c.dataset.w === sel;
    c.classList.toggle("sel", on); c.setAttribute("aria-pressed", on ? "true" : "false");
  });
  binEls.forEach((b, k) => {
    b.bin.classList.toggle("ready", !!sel);
    const q = SOUNDS[cur].pats[k];
    b.head.setAttribute("aria-label", sel ? P.t("binPut", { w: sel, p: q.p }) : P.t("binAria", { p: q.p, n: countIn(k), m: q.words.length }));
  });
}
const countIn = (k) => Object.values(state[cur].placed).filter((x) => x === k).length;

function place(w, k, fromKey) {
  const s = SOUNDS[cur], st = state[cur], q = s.pats[k];
  if (!q || !st.deck.includes(w)) return;
  const right = spellingOf(w, s);
  if (right === q.p) {
    const i = st.deck.indexOf(w);
    st.deck.splice(i, 1);
    st.placed[w] = k;
    if (!st.missed.has(w)) st.first++;
    sel = null;
    Play.speak(w, "en-US");
    setFb(P.t("okMsg", { w, p: q.p }), "ok");
    draw();
    if (fromKey) {
      const cs = $("deck").querySelectorAll(".card");
      if (cs.length) cs[Math.min(i, cs.length - 1)].focus(); else binEls[k].head.focus();
    }
  } else {
    st.missed.add(w);
    sel = null;
    setFb(P.t("noMsg", { w, p: right, b: q.p }), "no");
    const b = binEls[k].bin;
    b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 600);
    const c = $("deck").querySelector('.card[data-w="' + w + '"]');
    if (c && !Play.reduced) { c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
    Play.speak(w, "en-US");
    markSel(); score();
  }
}
function setFb(text, cls) { const f = $("fb"); f.textContent = text; f.className = "fb" + (cls ? " " + cls : ""); }
function score() {
  const n = nPlaced(cur), m = total(cur);
  $("score").textContent = P.t("score", { n, m, f: state[cur].first });
  Play.live($("live"), P.t("liveS", { snd: P.t("snd_" + SOUNDS[cur].id), n, m }));
}

// ---- step 3: counts ----
function drawCounts() {
  const s = SOUNDS[cur], cs = countSound(s), tb = $("counts");
  tb.innerHTML = "";
  const hr = tb.insertRow();
  [P.t("thP"), P.t("thEnd"), P.t("thIn")].forEach((h) => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  cs.forEach((c) => {
    const r = tb.insertRow();
    const p = r.insertCell(); p.className = "p"; p.textContent = c.p; p.lang = "en";
    if (c.type === "team") {
      [[c.end, c.endW], [c.inside, c.inW]].forEach(([n, ws]) => {
        const td = r.insertCell(); td.className = "n";
        td.textContent = n + " / " + c.n;
        const sp = document.createElement("span"); sp.className = "w"; sp.lang = "en"; sp.textContent = ws.join(" · ");
        td.appendChild(sp);
      });
    } else {
      const td = r.insertCell(); td.colSpan = 2; td.className = "n";
      td.textContent = P.t(c.type === "split" ? "splitN" : "singleN", { e: c.end, n: c.n });
      const sp = document.createElement("span"); sp.className = "w"; sp.lang = "en"; sp.textContent = c.endW.join(" · ");
      td.appendChild(sp);
    }
  });
  const r = ruleOf(s);
  $("rule").textContent = r ? P.t(r.kind, r) : "";
  $("resultMain").textContent = cs.filter((c) => c.type === "team").map((c) => P.t("resEnd", { p: c.p, e: c.end, n: c.n })).join("  ·  ");
}
[["they", "xThey"], ["great", "xGreat"], ["eight", "xEight"], ["player", "xPlayer"], ["bread", "xBread"], ["cow", "xCow"]].forEach(([w, key]) => {
  const row = document.createElement("div"); row.className = "row";
  const b = document.createElement("button"); b.type = "button"; b.textContent = w; b.lang = "en";
  b.addEventListener("click", () => Play.speak(w, "en-US"));
  const sp = document.createElement("span"); sp.textContent = P.t(key);
  row.append(b, sp); $("exc").appendChild(row);
});

// ---- draw ----
let builtFor = -1;
function draw() {
  const s = SOUNDS[cur], st = state[cur];
  sBtns.forEach((b, i) => { b.classList.toggle("on", i === cur); b.setAttribute("aria-pressed", i === cur ? "true" : "false"); });
  $("hearS").textContent = P.t("hearS", { w: s.ex.join(", ") });
  if (builtFor !== cur) { buildBins(); builtFor = cur; }
  binEls.forEach((b, k) => {
    const q = s.pats[k];
    b.got.innerHTML = "";
    q.words.filter((w) => st.placed[w] === k).forEach((w) => {
      const c = document.createElement("button"); c.type = "button";
      c.appendChild(marked(w, q));
      c.setAttribute("aria-label", w);
      c.addEventListener("click", () => Play.speak(w, "en-US"));
      b.got.appendChild(c);
    });
    b.head.querySelector(".cnt").textContent = countIn(k) + " / " + q.words.length;
  });
  const deck = $("deck");
  deck.innerHTML = "";
  st.deck.forEach((w) => deck.appendChild(cardEl(w)));
  if (!st.deck.length) {
    const d = document.createElement("div"); d.className = "done"; d.textContent = P.t("doneDeck"); deck.appendChild(d);
    if (!$("fb").textContent || $("fb").classList.contains("ok")) setFb(P.t("done", { m: total(cur), f: st.first }), "ok");
  }
  markSel(); score(); drawCounts();
}

// ---- steps ----
SOUNDS[0].ex.forEach((w) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = "▶ " + w;
  b.addEventListener("click", () => Play.speak(w, "en-US"));
  $("ex1").appendChild(b);
});
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => Play.speak("rain. play. cake.", "en-US"));
const stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ex1").hidden = i !== 0;
  $("countsBox").hidden = i !== 2;
});
$("reset").addEventListener("click", () => {
  if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  fresh(); cur = 0; builtFor = -1; setFb("", ""); pr.reset(); stp.go(0); draw();
});
fresh();
draw();
</script>

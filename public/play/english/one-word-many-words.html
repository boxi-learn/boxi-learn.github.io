  { id: "meeting", zh: "开会", py: "kāi huì", v: "have", en: "have a meeting", also: "alsoMeeting" },
  { id: "party", zh: "开派对", py: "kāi pàiduì", v: "have", en: "have a party", also: "alsoParty" },
  { id: "joke", zh: "开玩笑", py: "kāi wánxiào", v: "make", en: "make a joke" },
  { id: "flower", zh: "开花", py: "kāi huā", v: "bloom", en: "the flowers bloom", soft: ["open"] },
];
// English open → Chinese. ok = Chinese verbs that work; zh = the usual phrase; alt = another usual phrase.
const CHIPS = [
  { c: "开", py: "kāi" }, { c: "打开", py: "dǎkāi" }, { c: "睁", py: "zhēng" }, { c: "张", py: "zhāng" }, { c: "拆", py: "chāi" },
];
const REV = [
  { id: "door", en: "open the door", ok: ["开", "打开"], zh: "开门", alt: "打开门" },
  { id: "window", en: "open the window", ok: ["开", "打开"], zh: "开窗", alt: "打开窗户" },
  { id: "shop", en: "open a shop", ok: ["开"], zh: "开店" },
  { id: "book", en: "open a book", ok: ["打开"], zh: "打开书" },
  { id: "present", en: "open a present", ok: ["拆", "打开"], zh: "拆礼物", alt: "打开礼物" },
  { id: "eyes", en: "open your eyes", ok: ["睁"], zh: "睁眼", alt: "睁开眼睛" },
  { id: "mouth", en: "open your mouth", ok: ["张"], zh: "张嘴", alt: "张开嘴" },
];
// Wrong-verb phrase, built from the card's object: "open" + "the light".
function objOf(card) {
  const v = VERBS.find((x) => x.id === card.v);
  return card.v === "bloom" ? "" : card.en.slice(v.en.split(" / ")[0].length).trim();
}
function badPhrase(card, verbId) {
  const v = VERBS.find((x) => x.id === verbId).en.split(" / ")[0];
  if (card.v === "bloom") return "the flowers " + v;
  return v + " " + objOf(card);
}
function judge(card, verbId) {
  if (card.v === verbId) return "ok";
  if ((card.soft || []).includes(verbId)) return "soft";
  return "no";
}
const usesKai = (r) => r.ok.some((c) => c.includes("开"));
// The three parts of the picture, by id: 开 only, both, open only.
function regions() {
  const kai = [], both = [], open = [];
  CARDS.forEach((c) => (c.v === "open" ? null : kai.push(c.id)));
  REV.forEach((r) => (usesKai(r) ? both : open).push(r.id));
  CARDS.forEach((c) => { if (c.v === "open" && !both.includes(c.id)) both.push(c.id); });
  return { kai, both, open };
}
function tallies() {
  const R = regions();
  return {
    a: CARDS.filter((c) => c.v === "open").length, n: CARDS.length,
    b: REV.filter(usesKai).length, m: REV.length,
    kai: R.kai.length, both: R.both.length, open: R.open.length,
  };
}
if (typeof module !== "undefined") module.exports = { VERBS, CARDS, REV, CHIPS, judge, badPhrase, regions, tallies, usesKai };

// ---- state ----
const $ = (id) => document.getElementById(id);
let st, sel = null;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh() {
  st = { deck: shuffle(CARDS.map((c) => c.id)), placed: {}, first: 0, missed: new Set(), rev: {}, revWrong: {}, region: -1 };
  sel = null;
}
const card = (id) => CARDS.find((c) => c.id === id);
const zhLang = P.lang === "zh";

// ---- step 1 ----
$("heroIco").appendChild(icon("light"));
if (zhLang) $("heroPy").hidden = true;
function showSay() {
  const box = $("say");
  box.innerHTML = "";
  [["ok", "sayOk", "✓"], ["no", "sayNo", "✗"]].forEach(([cls, key, m]) => {
    const row = document.createElement("div"); row.className = "row " + cls;
    const mk = document.createElement("span"); mk.className = "mark"; mk.textContent = m;
    const b = document.createElement("button"); b.type = "button"; b.lang = "en"; b.textContent = "▶ " + P.t(key);
    b.addEventListener("click", () => Play.speak(P.t(key), "en-US"));
    row.append(mk, b); box.appendChild(row);
  });
  box.hidden = false;
}

// ---- step 2: bins ----
const binEls = VERBS.map((v, k) => {
  const bin = document.createElement("div");
  bin.className = "bin"; bin.dataset.k = k;
  const head = document.createElement("button");
  head.type = "button"; head.className = "binhead";
  head.innerHTML = '<span class="v" lang="en"></span><span class="k"></span>';
  head.querySelector(".v").textContent = v.en;
  head.addEventListener("click", () => {
    if (!sel) { setFb(P.t("pickFirst"), ""); return; }
    place(sel, k, true);
  });
  const got = document.createElement("div"); got.className = "got"; got.lang = "en";
  bin.append(head, got);
  $("bins").appendChild(bin);
  return { bin, head, got };
});

let drag = null, suppressClick = false;
function cardEl(id) {
  const c = card(id);
  const b = document.createElement("button");
  b.type = "button"; b.className = "pc"; b.dataset.id = id;
  b.appendChild(icon(id));
  const z = document.createElement("span"); z.className = "zh"; z.lang = "zh-CN"; z.textContent = c.zh;
  b.appendChild(z);
  if (!zhLang) { const p = document.createElement("span"); p.className = "py"; p.textContent = c.py; b.appendChild(p); }
  b.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-label", P.t("cardAria", { zh: c.zh, py: c.py }));
  b.addEventListener("click", () => { if (suppressClick) { suppressClick = false; return; } pick(id); });
  b.addEventListener("keydown", (e) => {
    const k = "123456".indexOf(e.key);
    if (e.key.length === 1 && k >= 0) { place(id, k, true); e.preventDefault(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const cs = [...$("deck").querySelectorAll(".pc")], i = cs.indexOf(b);
      cs[Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, cs.length - 1)].focus(); e.preventDefault();
    }
    if (e.key === "Escape") { sel = null; markSel(); }
  });
  b.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { b, id, x: e.clientX, y: e.clientY, on: false };
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  b.addEventListener("pointermove", (e) => {
    if (!drag || drag.b !== b) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) > 8) { drag.on = true; b.classList.add("drag"); }
    if (!drag.on) return;
    b.style.transform = "translate(" + dx + "px," + dy + "px)";
    const k = binAt(e.clientX, e.clientY);
    binEls.forEach((x, i) => x.bin.classList.toggle("over", i === k));
  });
  const end = (e, cancel) => {
    if (!drag || drag.b !== b) return;
    const d = drag; drag = null;
    if (!d.on) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    b.classList.remove("drag"); b.style.transform = "";
    binEls.forEach((x) => x.bin.classList.remove("over"));
    const k = cancel ? -1 : binAt(e.clientX, e.clientY);
    if (k >= 0) place(d.id, k, false);
  };
  b.addEventListener("pointerup", (e) => end(e, false));
  b.addEventListener("pointercancel", (e) => end(e, true));
  return b;
}
function binAt(x, y) {
  const els = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
  for (const el of els) { const b = el.closest && el.closest(".bin"); if (b) return +b.dataset.k; }
  return -1;
}
function pick(id) {
  sel = id;
  Play.speak(card(id).zh, "zh-CN");
  markSel();
  setFb(P.t("pick", { zh: card(id).zh }), "");
}
const countIn = (k) => Object.values(st.placed).filter((x) => x === k).length;
function markSel() {
  $("deck").querySelectorAll(".pc").forEach((c) => {
    const on = c.dataset.id === sel;
    c.classList.toggle("sel", on); c.setAttribute("aria-pressed", on ? "true" : "false");
  });
  binEls.forEach((b, k) => {
    b.bin.classList.toggle("ready", !!sel);
    b.head.setAttribute("aria-label", sel ? P.t("binPut", { zh: card(sel).zh, v: VERBS[k].en }) : P.t("binAria", { v: VERBS[k].en, n: countIn(k) }));
  });
}
function place(id, k, fromKey) {
  const c = card(id), v = VERBS[k];
  if (!v || !st.deck.includes(id)) return;
  const j = judge(c, v.id);
  if (j === "ok") {
    const i = st.deck.indexOf(id);
    st.deck.splice(i, 1);
    st.placed[id] = k;
    if (!st.missed.has(id)) st.first++;
    sel = null;
    Play.speak(c.en, "en-US");
    setFb(P.t("okMsg", { zh: c.zh, en: c.en }) + (c.also ? " " + P.t(c.also) : ""), "ok");
    drawSort();
    if (fromKey) {
      const cs = $("deck").querySelectorAll(".pc");
      if (cs.length) cs[Math.min(i, cs.length - 1)].focus(); else binEls[k].head.focus();
    }
    return;
  }
  sel = null;
  if (j === "no") st.missed.add(id);
  setFb(j === "soft" ? P.t("softMsg") : P.t("noMsg", { v: v.en, bad: badPhrase(c, v.id), zh: c.zh }), "no");
  const bin = binEls[k].bin;
  bin.classList.add("bad"); setTimeout(() => bin.classList.remove("bad"), 600);
  const el = $("deck").querySelector('.pc[data-id="' + id + '"]');
  if (el && !Play.reduced) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  if (el && fromKey) el.focus();
  markSel(); score();
}
function setFb(text, cls) { const f = $("fb"); f.textContent = text; f.className = "fb" + (cls ? " " + cls : ""); }
function score() {
  const n = Object.keys(st.placed).length, m = CARDS.length;
  $("score").textContent = P.t("score", { n, m, f: st.first });
  if (stp && stp.i === 1) Play.live($("live"), P.t("liveS", { n, m }));
}
function drawSort() {
  binEls.forEach((b, k) => {
    b.got.innerHTML = "";
    CARDS.filter((c) => st.placed[c.id] === k).forEach((c) => {
      const x = document.createElement("button"); x.type = "button"; x.textContent = c.en;
      x.addEventListener("click", () => Play.speak(c.en, "en-US"));
      b.got.appendChild(x);
    });
    b.head.querySelector(".k").textContent = countIn(k) ? "× " + countIn(k) : "";
  });
  const deck = $("deck");
  deck.innerHTML = "";
  st.deck.forEach((id) => deck.appendChild(cardEl(id)));
  if (!st.deck.length) {
    const d = document.createElement("div"); d.className = "done"; d.textContent = P.t("doneDeck"); deck.appendChild(d);
    setFb(P.t("done", { m: CARDS.length, f: st.first }), "ok");
  }
  markSel(); score();
}

// ---- step 3: English open → Chinese verb ----
const revEls = REV.map((r) => {
  const box = document.createElement("div"); box.className = "ri";
  const top = document.createElement("div"); top.className = "top";
  top.appendChild(icon(r.id));
  const say = document.createElement("button"); say.type = "button"; say.lang = "en"; say.textContent = "▶ " + r.en;
  say.addEventListener("click", () => Play.speak(r.en, "en-US"));
  top.appendChild(say);
  const chips = document.createElement("div"); chips.className = "chips"; chips.setAttribute("role", "group"); chips.setAttribute("aria-label", r.en);
  const btns = CHIPS.map((ch) => {
    const b = document.createElement("button"); b.type = "button"; b.lang = "zh-CN";
    b.textContent = zhLang ? ch.c : ch.c + " " + ch.py;
    b.addEventListener("click", () => choose(r, ch.c));
    chips.appendChild(b);
    return b;
  });
  const ans = document.createElement("div"); ans.className = "ans"; ans.setAttribute("aria-live", "polite");
  box.append(top, chips, ans);
  $("rev").appendChild(box);
  return { r, box, btns, ans };
});
function choose(r, c) {
  if (st.rev[r.id]) return;
  if (r.ok.includes(c)) { st.rev[r.id] = c; Play.speak(r.zh, "zh-CN"); }
  else { (st.revWrong[r.id] = st.revWrong[r.id] || new Set()).add(c); }
  drawRev(r.id, c);
}
function drawRev(lastId, lastC) {
  revEls.forEach((e) => {
    const done = st.rev[e.r.id], wrong = st.revWrong[e.r.id] || new Set();
    e.box.classList.toggle("ok", !!done);
    e.btns.forEach((b, i) => {
      const c = CHIPS[i].c;
      b.classList.toggle("right", !!done && e.r.ok.includes(c));
      b.classList.toggle("wrong", wrong.has(c) && !done);
    });
    if (done) e.ans.textContent = P.t("revOk", { en: e.r.en, zh: e.r.zh }) + (e.r.alt ? " · " + P.t("revAlso", { zh: e.r.alt }) : "");
    else if (e.r.id === lastId) e.ans.textContent = P.t("revNo", { c: lastC });
    else e.ans.textContent = "";
  });
  const n = Object.keys(st.rev).length, m = REV.length;
  $("score3").textContent = P.t("score3", { n, m });
  if (stp && stp.i === 2) Play.live($("live"), P.t("live3", { n, m }));
}

// ---- step 4: two circles ----
const RKEYS = ["kai", "both", "open"], RLAB = ["rKai", "rBoth", "rOpen"];
function phraseOf(id, where) {
  const c = CARDS.find((x) => x.id === id), r = REV.find((x) => x.id === id);
  if (where === "open") return { zh: r.zh, en: r.en };
  if (c) return { zh: c.zh, en: c.en };
  return { zh: r.zh.includes("开") ? r.zh : r.alt, en: r.en };
}
function drawVenn() {
  const R = regions(), T = tallies(), svg = $("venn");
  svg.innerHTML = "";
  const cx = [230, 370], rr = 110, cy = 115;
  Play.svg("circle", { cx: cx[0], cy, r: rr, fill: "var(--a)", "fill-opacity": .16, stroke: "var(--a)", "stroke-width": 3 }, svg);
  Play.svg("circle", { cx: cx[1], cy, r: rr, fill: "var(--b)", "fill-opacity": .16, stroke: "var(--b)", "stroke-width": 3 }, svg);
  const xs = [185, 300, 415];
  RKEYS.forEach((key, i) => {
    const g = Play.svg("g", { class: "rg" + (st.region === i ? " on" : ""), tabindex: 0, role: "button", "aria-label": P.t(RLAB[i]) + ": " + R[key].length }, svg);
    Play.svg("circle", { class: "ring", cx: xs[i], cy, r: 34, fill: "var(--surface)", stroke: "var(--line)", "stroke-width": 2 }, g);
    const t = Play.svg("text", { x: xs[i], y: cy + 14, "text-anchor": "middle", "font-size": 40, "font-weight": 700, fill: "var(--fg)" }, g);
    t.textContent = R[key].length;
    g.addEventListener("click", () => setRegion(i));
    g.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { setRegion(i); e.preventDefault(); }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        const j = Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, 2);
        setRegion(j); svg.querySelectorAll(".rg")[j].focus(); e.preventDefault();
      }
    });
  });
  [[62, "vKai", "var(--a)"], [538, "vOpen", "var(--b)"]].forEach(([x, k, col]) => {
    const t = Play.svg("text", { x, y: cy + 11, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: col }, svg);
    t.textContent = P.t(k);
  });
  const cols = $("cols");
  cols.innerHTML = "";
  RKEYS.forEach((key, i) => {
    const col = document.createElement("div"); col.className = "col c" + i + (st.region === i ? " on" : "");
    const h = document.createElement("h3"); h.textContent = P.t(RLAB[i]) + " · " + R[key].length;
    col.appendChild(h);
    R[key].forEach((id) => {
      const ph = phraseOf(id, key);
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = '<span lang="zh-CN"></span><span class="e" lang="en"></span>';
      b.firstChild.textContent = ph.zh; b.lastChild.textContent = ph.en;
      b.addEventListener("click", () => Play.speak(ph.en, "en-US"));
      col.appendChild(b);
    });
    cols.appendChild(col);
  });
  $("rule").textContent = P.t("ruleTxt", T);
  $("resultMain").textContent = P.t("resKai", T) + "  ·  " + P.t("resOpen", T);
}
function setRegion(i) {
  st.region = i;
  const R = regions();
  document.querySelectorAll("#venn .rg").forEach((g, j) => g.classList.toggle("on", j === i));
  document.querySelectorAll("#cols .col").forEach((c, j) => c.classList.toggle("on", j === i));
  Play.live($("live"), P.t("live4", { r: P.t(RLAB[i]), n: R[RKEYS[i]].length }));
}

// ---- steps ----
let stp = null;
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { showSay(); Play.speak(P.t("sayOk"), "en-US"); });
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("rule").hidden = i !== 3;
  ["v1", "v2", "v3", "v4"].forEach((v, j) => { $(v).hidden = j !== i; });
  $("live").textContent = "";
  if (i === 1) score();
  if (i === 2) drawRev();
});
$("reset").addEventListener("click", () => {
  if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  fresh(); pr.reset(); $("say").hidden = true; setFb("", "");
  drawSort(); drawRev(); drawVenn(); stp.go(0);
});
fresh();
drawSort(); drawRev(); drawVenn();
</script>

// ---- logic (pure) ----
// Pairs: a countable noun and an uncountable noun that can name the same things. unit = container word, or "" if none.
const PAIRS = [
  { c: "chair", u: "furniture", unit: "piece", ic: "🪑" },
  { c: "suggestion", u: "advice", unit: "piece", ic: "💬" },
  { c: "coin", u: "money", unit: "", ic: "🪙" },
  { c: "fact", u: "information", unit: "piece", ic: "📌" },
  { c: "assignment", u: "homework", unit: "piece", ic: "📝" },
  { c: "bag", u: "luggage", unit: "piece", ic: "🧳" },
  { c: "song", u: "music", unit: "piece", ic: "🎵" },
  { c: "tool", u: "equipment", unit: "piece", ic: "🔧" },
];
// Uncountable food nouns with their usual container (no countable partner).
const FOOD = [
  { c: "", u: "bread", unit: "slice", ic: "🍞" },
  { c: "", u: "rice", unit: "bowl", ic: "🍚" },
  { c: "", u: "milk", unit: "glass", ic: "🥛" },
];
const ITEMS = PAIRS.concat(FOOD);
const NUM = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
function plural(w) {
  if (/(s|x|z|ch|sh)$/.test(w)) return w + "es";
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + "ies";
  return w + "s";
}
const art = (w) => (/^[aeiou]/.test(w) ? "an " : "a ") + w;
const numw = (n) => NUM[Math.max(0, Math.min(10, Math.round(n)))] || String(n);
// Counted phrase for n things (n ≥ 1): "a chair", "three chairs".
const countC = (c, n) => (n === 1 ? art(c) : numw(n) + " " + plural(c));
// Uncountable counted through its container: "a piece of furniture", "three pieces of furniture".
const countU = (it, n) => (it.unit ? (n === 1 ? art(it.unit) : numw(n) + " " + plural(it.unit)) + " of " + it.u : "");
// The quantity-word table: rows of [phrase, ok, fix] for the countable and uncountable noun.
const DETS = ["a", "num", "many", "a few", "much", "a little", "some"];
function qRow(it, d, n) {
  const c = it.c, u = it.u, unitPl = it.unit ? plural(it.unit) + " of " + u : "";
  let C = null, U;
  if (c) {
    if (d === "a") C = [art(c), true];
    else if (d === "num") C = [countC(c, n), true];
    else if (d === "much") C = ["much " + plural(c), false, "many " + plural(c)];
    else if (d === "a little") C = ["a little " + plural(c), false, "a few " + plural(c)];
    else C = [d + " " + plural(c), true];
  }
  if (d === "a") U = [art(u), false, it.unit ? countU(it, 1) : "some " + u];
  else if (d === "num") U = [n === 1 ? "one " + u : numw(n) + " " + plural(u), false, it.unit ? countU(it, n) : c ? countC(c, n) : "some " + u];
  else if (d === "many") U = ["many " + plural(u), false, "much " + u + (it.unit ? " / many " + unitPl : "")];
  else if (d === "a few") U = ["a few " + plural(u), false, "a little " + u + (it.unit ? " / a few " + unitPl : "")];
  else U = [d + " " + u, true];
  return { C, U };
}
// Sorting deck: every noun of every pair, in a fixed order where partners are never next to each other.
const DECK = ("chair advice coin information bag equipment suggestion money assignment furniture song luggage fact music tool homework")
  .split(" ").map((w) => { const pair = PAIRS.findIndex((p) => p.c === w || p.u === w); return { w, kind: PAIRS[pair].c === w ? "C" : "U", pair }; });
const N_U = DECK.filter((d) => d.kind === "U").length;

// ---- ui ----
const $ = (id) => document.getElementById(id);
const START_N = 3;
let cur = 0, n = START_N, answered = false, stepI = 0;
let placed = {}, missed = new Set(), errU = 0, sel = null, drag = null, suppressClick = false;

// Insert English words as spans into a translated template; keys in plain stay as plain text.
function frag(key, vars, plain) {
  const f = document.createDocumentFragment();
  P.t(key).split(/(\{\w+\})/).forEach((piece) => {
    const m = piece.match(/^\{(\w+)\}$/);
    if (m && m[1] in vars) {
      if (plain && plain.includes(m[1])) { f.append(String(vars[m[1]])); return; }
      const s = document.createElement("span");
      s.className = "w"; s.lang = "en"; s.textContent = vars[m[1]];
      f.append(s);
    } else if (piece) f.append(piece);
  });
  return f;
}
function mark(ok) { const s = document.createElement("span"); s.className = ok ? "ok" : "bad"; s.textContent = ok ? " ✓" : " ✗"; return s; }
function wspan(t, cls) { const s = document.createElement("span"); s.className = "w" + (cls ? " " + cls : ""); s.lang = "en"; s.textContent = t; return s; }
// Correct phrases for the current item and n.
function goodLines(it, k) {
  const out = [];
  if (it.c) out.push(countC(it.c, k));
  if (it.unit) out.push(countU(it, k));
  return out;
}
const badLine = (it, k) => (k === 1 ? art(it.u) : numw(k) + " " + plural(it.u));

function drawPic() {
  const it = ITEMS[cur], svg = $("pic");
  svg.innerHTML = "";
  const perRow = 5, rows = Math.ceil(n / perRow);
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / perRow), inRow = Math.min(perRow, n - r * perRow), col = i % perRow;
    const x = 300 + (col - (inRow - 1) / 2) * 92, y = rows === 1 ? 100 : 55 + r * 90;

  }
  svg.setAttribute("aria-label", n + " × " + (it.c || it.u));
  $("pName").textContent = it.c ? it.c + " / " + it.u : it.u;
  $("nVal").textContent = n;
  $("n").value = n;
  // phrase lines
  const L = $("lines");
  L.innerHTML = "";
  if (stepI === 0 && !answered) {
    const d = document.createElement("div"); d.className = "hide"; d.lang = P.lang === "zh" ? "zh-CN" : "en";
    d.textContent = P.t("hidden"); L.append(d);
  } else {
    goodLines(it, n).forEach((g) => { const d = document.createElement("div"); d.append(wspan(g), mark(true)); L.append(d); });
    const d = document.createElement("div"); d.append(wspan(badLine(it, n), "x"), mark(false)); L.append(d);
  }
  // quantity table
  const T = $("qtab");
  T.innerHTML = "";
  if (stepI === 2) {
    const hr = document.createElement("tr");
    if (it.c) { const th = document.createElement("th"); th.textContent = P.t("colC"); hr.append(th); }
    const th2 = document.createElement("th"); th2.textContent = P.t("colU"); hr.append(th2);
    T.append(hr);
    DETS.forEach((d) => {
      const row = qRow(it, d, n), tr = document.createElement("tr");
      [row.C, row.U].forEach((cell) => {
        if (!cell) return;
        const td = document.createElement("td"), b = document.createElement("button");
        b.type = "button";
        b.append(wspan(cell[0], cell[1] ? "" : "x"), mark(cell[1]));
        if (!cell[1]) {
          const f = document.createElement("span"); f.className = "fix";
          f.append(P.t("fixT") + " ", wspan(cell[2]));
          b.append(f);
        }
        b.addEventListener("click", () => Play.speak(cell[1] ? cell[0] : cell[2].split(" / ")[0], "en-US"));
        td.append(b); tr.append(td);
      });
      T.append(tr);
    });
  }
  if (stepI === 0 && !answered) { $("resultMain").textContent = "?"; Play.live($("live"), ""); }
  else if (stepI !== 1) {
    const lines = goodLines(it, n);
    $("resultMain").textContent = lines.join(" = ") + (answered || stepI ? "  ·  " + badLine(it, n) + " ✗" : "");
    Play.live($("live"), P.t("liveN", { n, line: lines.join(", ") }));
  }
  if (stepI === 2) { $("ruleLine").textContent = P.t("rule", { n: numw(n) }); }
}

// ---- sorter ----
const BINS = [{ k: "C", name: "binC", sub: "binCs" }, { k: "U", name: "binU", sub: "binUs" }];
const binEls = BINS.map((B, bi) => {
  const box = document.createElement("div"); box.className = "bin"; box.dataset.k = B.k;
  const h = document.createElement("button"); h.type = "button"; h.className = "bh";
  h.append(P.t(B.name));
  const sm = document.createElement("small"); sm.lang = "en"; sm.textContent = P.t(B.sub); h.append(sm);
  h.addEventListener("click", () => { if (sel) place(sel, B.k, true); });
  const ol = document.createElement("ol");
  box.append(h, ol);
  $("bins").append(box);
  return { box, h, ol, bi };
});
function cardEl(d) {
  const c = document.createElement("button");
  c.type = "button"; c.className = "card" + (missed.has(d.w) ? " missed" : "") + (sel === d.w ? " sel" : "");
  c.lang = "en"; c.textContent = d.w; c.dataset.w = d.w;
  c.setAttribute("aria-label", P.t("cardAria", { w: d.w }));
  c.setAttribute("aria-pressed", sel === d.w ? "true" : "false");
  c.addEventListener("click", () => {
    if (suppressClick) { suppressClick = false; return; }
    sel = sel === d.w ? null : d.w; Play.speak(d.w, "en-US");
    if (sel) setFb(frag("pick", { w: d.w })); drawSort();
    const again = $("pool").querySelector('[data-w="' + d.w + '"]'); if (again) again.focus();
  });
  c.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { place(d.w, "C", true); e.preventDefault(); }
    else if (e.key === "ArrowRight") { place(d.w, "U", true); e.preventDefault(); }
    else if (e.key === "Escape") { sel = null; drawSort(); }
  });
  c.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { c, w: d.w, x: e.clientX, y: e.clientY, on: false };
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  c.addEventListener("pointermove", (e) => {
    if (!drag || drag.c !== c) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) > 8) { drag.on = true; c.classList.add("drag"); }
    if (!drag.on) return;
    c.style.transform = "translate(" + dx + "px," + dy + "px)";
    const k = binAt(e.clientX, e.clientY);
    binEls.forEach((b) => b.box.classList.toggle("over", b.box.dataset.k === k));
  });
  const end = (e, cancel) => {
    if (!drag || drag.c !== c) return;
    const dd = drag; drag = null;
    if (!dd.on) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    c.classList.remove("drag"); c.style.transform = "";
    binEls.forEach((b) => b.box.classList.remove("over"));
    const k = cancel ? null : binAt(e.clientX, e.clientY);
    if (k) place(dd.w, k, false);
  };
  c.addEventListener("pointerup", (e) => end(e, false));
  c.addEventListener("pointercancel", (e) => end(e, true));
  return c;
}
function binAt(x, y) {
  const els = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
  for (const el of els) { const b = el.closest && el.closest(".bin"); if (b) return b.dataset.k; }
  return null;
}
function setFb(content, cls) {
  const f = $("sfb"); f.className = "sfb" + (cls ? " " + cls : ""); f.innerHTML = ""; f.append(content);
}
function place(w, k, fromKey) {
  const d = DECK.find((x) => x.w === w);
  if (!d || placed[w]) return;
  const pr = PAIRS[d.pair];
  if (d.kind === k) {
    placed[w] = k; sel = null;
    if (k === "C") setFb(frag("okC", { w, w1: w, w2: plural(w) }), "ok");
    else setFb(frag("okU", { w, w2: plural(w), fix: pr.unit ? countU(pr, 2) : "some " + w }), "ok");
    Play.speak(w, "en-US");
  } else {
    if (!missed.has(w) && d.kind === "U") errU++;
    missed.add(w);
    if (d.kind === "C") setFb(frag("noC", { w, w2: plural(w) }), "no");
    else setFb(frag("noU", { w, w2: plural(w), p: pr.c }), "no");
  }
  const left = DECK.filter((x) => !placed[x.w]);
  if (!left.length) setFb(document.createTextNode(P.t("allDone", { m: DECK.length })), "ok");
  drawSort();
  if (!placed[w] && !Play.reduced) {
    const c = $("pool").querySelector('[data-w="' + w + '"]');
    if (c) { c.classList.add("shake"); setTimeout(() => c.classList.remove("shake"), 400); }
  }
  if (fromKey) {
    const next = $("pool").querySelector(placed[w] ? ".card" : '[data-w="' + w + '"]');
    if (next) next.focus(); else binEls[0].h.focus();
  }
}
function drawSort() {
  const pool = $("pool");
  pool.innerHTML = "";
  const left = DECK.filter((d) => !placed[d.w]);
  left.forEach((d) => pool.append(cardEl(d)));
  if (!left.length) { const s = document.createElement("span"); s.className = "pooldone"; s.textContent = P.t("poolDone"); pool.append(s); }
  binEls.forEach((b) => {
    b.ol.innerHTML = "";
    let cnt = 0;
    PAIRS.forEach((p) => {
      const w = b.box.dataset.k === "C" ? p.c : p.u, li = document.createElement("li");
      if (placed[w]) {
        cnt++;
        li.append(wspan(w));
        const ex = document.createElement("span"); ex.lang = "en";
        ex.textContent = b.box.dataset.k === "C" ? plural(w) : p.unit ? plural(p.unit) + " of …" : "some …";
        li.append(ex);
      } else li.className = "empty";
      b.ol.append(li);
    });
    b.box.classList.toggle("ready", !!sel);
    b.h.setAttribute("aria-label", P.t("binAria", { bin: P.t(BINS[b.bi].name), n: cnt, m: PAIRS.length }));
  });
  const k = Object.keys(placed).length;
  const note = k ? P.t("sortNote", { k, m: DECK.length, e: errU }) : P.t("sortNone", { m: DECK.length });
  if (stepI === 1) {
    $("resultMain").textContent = binEls.map((b) => PAIRS.filter((p) => placed[b.box.dataset.k === "C" ? p.c : p.u]).map((p) => (b.box.dataset.k === "C" ? p.c : p.u)).join(", ") || "…").join("  |  ");
    Play.live($("live"), note);
  }
  $("resultNote").textContent = note + " " + P.t("rnote", { p: PAIRS.length });
}

// ---- wiring ----
$("pPrev").addEventListener("click", () => { cur = (cur - 1 + ITEMS.length) % ITEMS.length; drawPic(); });
$("pNext").addEventListener("click", () => { cur = (cur + 1) % ITEMS.length; drawPic(); });
$("n").addEventListener("input", (e) => { n = Play.clamp(Math.round(+e.target.value) || 1, 1, 10); drawPic(); });
$("say").addEventListener("click", () => Play.speak(goodLines(ITEMS[cur], n).join(", or "), "en-US"));
[["coffee", "bCoffee"], ["paper", "bPaper"], ["hair", "bHair"]].forEach(([w, key]) => {
  const row = document.createElement("div"); row.className = "row";
  const bt = document.createElement("button"); bt.type = "button"; bt.textContent = w; bt.lang = "en";
  bt.addEventListener("click", () => Play.speak(w + ". a " + w, "en-US"));
  const sp = document.createElement("span"); sp.textContent = P.t(key);
  row.append(bt, sp); $("bothList").append(row);
});
$("foot").textContent = P.t("foot", { p: PAIRS.length, f: FOOD.length });

const pr = Play.predict($("predict"), {
  q: P.t("q", { n: START_N }),
  options: [{ label: P.t("o1", { n3: numw(START_N) }) }, { label: P.t("o2", { n3: numw(START_N) }), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong", { n3: numw(START_N) }),
}, () => { answered = true; cur = 0; n = START_N; drawPic(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  stepI = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k, { m: DECK.length });
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ruleBox").hidden = i !== 2;
  $("picBox").hidden = i === 1;
  $("sortBox").hidden = i !== 1;
  $("picNav").hidden = i !== 2;
  $("nRow").hidden = i !== 2;
  if (i === 0) { cur = 0; n = START_N; }
  if (i === 1) drawSort(); else drawPic();
});
$("reset").addEventListener("click", () => {
  if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  cur = 0; n = START_N; answered = false; placed = {}; missed = new Set(); errU = 0; sel = null;
  setFb(document.createTextNode(""), ""); pr.reset(); st.go(0); drawSort(); drawPic();
});
drawSort();
drawPic();
</script>

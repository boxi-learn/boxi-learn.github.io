const L = P.lang;
const $ = (id) => document.getElementById(id);
const sentEl = $("sent"), readout = $("readout"), treeEl = $("tree"), rulesEl = $("rules"), fb3 = $("fb3"), liveEl = $("live");
const MODELS = SENTS.map(build), QM = build(QUIZ);

let step = 0, si = 0, guess = -1;
let hidC = new Set(), hidW = new Set();
let qPhase = 0, qVerb = -1, qBad = -1;

function shake(el) { if (!Play.reduced && el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }
const tyName = (ty) => P.t(ty);

// Render tokens a..b of model m into box. mode: "edit" (step 2), "show" (static brackets), "plain", "quiz".
function renderRange(m, box, a, b, mode, first, scope) {
  let isFirst = first;
  const sp = (i) => { if (!isFirst && !/^[,.;:]$/.test(m.toks[i])) box.appendChild(document.createTextNode(" ")); isFirst = false; };
  for (let i = a; i <= b; i++) {
    const c = mode === "edit" || mode === "show" ? m.chunks.find((d) => d.a === i && d.parent === scope) : null;
    if (c) {
      sp(i);
      const k = m.chunks.indexOf(c);
      const el = document.createElement("span");
      el.className = "ck " + c.ty + (mode === "show" ? " static" : "");
      if (mode === "edit") {
        el.tabIndex = 0;
        el.setAttribute("role", "button");
        el.dataset.k = k;
        el.setAttribute("aria-pressed", hidC.has(k) ? "false" : "true");
        el.setAttribute("aria-label", tyName(c.ty) + ": " + ownText(m, c));
      }
      if (mode === "edit" && hidC.has(k)) {
        el.classList.add("off");
        el.textContent = "[… " + P.t("tg_" + c.ty) + "]";
      } else {
        const tg = document.createElement("span");
        tg.className = "tg";
        tg.textContent = P.t("tg_" + c.ty);
        tg.setAttribute("aria-hidden", "true");
        el.appendChild(tg);
        renderRange(m, el, c.a, c.b, mode, true, c);
      }
      box.appendChild(el);
      i = c.b;
      continue;
    }
    sp(i);
    const t = m.toks[i], r = coreRole(m, i);
    if (mode === "quiz") {
      if (/^[,.;:]$/.test(t)) { box.appendChild(document.createTextNode(t)); continue; }
      const q = document.createElement("button");
      q.type = "button";
      q.className = "q" + ((qPhase >= 1 && i === qVerb) || (qPhase >= 2 && r === "S") ? " good" : i === qBad ? " bad" : "");
      q.dataset.i = i;
      q.textContent = t;
      box.appendChild(q);
      continue;
    }
    const w = document.createElement("span");
    w.className = "wd";
    w.textContent = t;
    if (r && mode !== "plain") {
      w.classList.add("core");
      if (mode === "edit") {
        w.tabIndex = 0;
        w.setAttribute("role", "button");
        w.dataset.w = i;
        w.setAttribute("aria-label", t + " · " + P.t(r));
        if (hidW.has(i)) w.classList.add("off");
      }
    } else if (mode === "show" && m.s.verbs.includes(t) && chunkAt(m, i)) w.classList.add("vtrap");
    box.appendChild(w);
  }
}
function drawSentence(m, box, mode) { box.innerHTML = ""; renderRange(m, box, 0, m.toks.length - 1, mode, true, null); }

function drawTree(m, hc) {
  treeEl.innerHTML = "";
  const node = (n, ul, off) => {
    const li = document.createElement("li");
    const dim = off || hc.has(n.k);
    if (dim) li.classList.add("dim");
    const ty = document.createElement("span");
    ty.className = "ty " + n.c.ty;
    ty.textContent = tyName(n.c.ty);
    const w = document.createElement("span");
    w.className = "w";
    w.lang = "en";
    w.textContent = ownText(m, n.c);
    const gl = document.createElement("span");
    gl.className = "gl";
    if (L === "zh") gl.textContent = n.c.zh;
    else gl.textContent = P.t("about", { h: m.toks[n.c.head] });
    li.append(ty, w, gl);
    if (n.kids.length) { const u = document.createElement("ul"); n.kids.forEach((x) => node(x, u, dim)); li.appendChild(u); }
    ul.appendChild(li);
  };
  outline(m).forEach((o) => {
    const li = document.createElement("li");
    const r = document.createElement("span");
    r.className = "role";
    r.textContent = P.t(o.core.r);
    const w = document.createElement("span");
    w.className = "cw";
    w.lang = "en";
    w.textContent = o.core.text;
    li.append(r, w);
    if (o.kids.length) { const u = document.createElement("ul"); o.kids.forEach((x) => node(x, u)); li.appendChild(u); }
    treeEl.appendChild(li);
  });
}

function setReadout(text, status, cls, zh) {
  readout.innerHTML = "";
  const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = P.t("now");
  const nw = document.createElement("div"); nw.className = "now"; nw.lang = "en"; nw.textContent = text || "…";
  const st = document.createElement("div"); st.className = "status " + cls; st.textContent = status;
  readout.append(lab, nw, st);
  if (zh) { const z = document.createElement("div"); z.className = "zh"; z.lang = "zh-CN"; z.textContent = zh; readout.appendChild(z); }
}

// ---- picker ----
const pick = $("pick");
const pickBtns = MODELS.map((m, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = String(i + 1);
  b.setAttribute("aria-label", m.s.text);
  b.addEventListener("click", () => { si = i; hidC = new Set(); hidW = new Set(); fb3.textContent = ""; render(); });
  pick.appendChild(b);
  return b;
});

function renderEdit() {
  const m = MODELS[si];
  drawSentence(m, sentEl, "edit");
  drawTree(m, hidC);
  const n = wordCount(m, new Set(), new Set()), k = wordCount(m, hidC, hidW);
  const miss = missingRoles(m, hidW);
  const text = visibleText(m, hidC, hidW);
  const topOff = m.chunks.every((c, j) => c.parent || hidC.has(j));
  if (miss.length) setReadout(text, P.t("broken", { miss: miss.map((r) => P.t(r)).join(P.t("and")) }), "no", "");
  else if (!hidC.size && !hidW.size) setReadout(text, P.t("okFull", { n }), "ok", "");
  else if (topOff) setReadout(text, P.t("okSkel", { k, n }), "ok", L === "zh" ? m.s.skZh : "");
  else setReadout(text, P.t("ok", { k, n }), "ok", "");
  const strip = $("strip");
  strip.setAttribute("aria-pressed", topOff ? "true" : "false");
  strip.textContent = P.t(topOff ? "stripOn" : "strip");
}

function toggleChunk(k) {
  const m = MODELS[si];
  if (hidC.has(k)) { hidC.delete(k); Play.live(liveEl, P.t("shown", { ty: tyName(m.chunks[k].ty) })); }
  else { hidC.add(k); Play.live(liveEl, P.t("hidden", { ty: tyName(m.chunks[k].ty), t: ownText(m, m.chunks[k]) })); }
  render();
  const el = sentEl.querySelector('[data-k="' + k + '"]');
  if (el) el.focus();
}
function toggleCore(i) {
  const m = MODELS[si];
  if (hidW.has(i)) { hidW.delete(i); fb3.textContent = ""; }
  else { hidW.add(i); fb3.textContent = P.t("hideCore", { w: m.toks[i], role: P.t(coreRole(m, i)) }); }
  render();
  const el = sentEl.querySelector('[data-w="' + i + '"]');
  if (el) { el.focus(); if (hidW.has(i)) shake(el); }
}

// ---- quiz (step 3) ----
function quizTap(i) {
  const m = QM, t = m.toks[i], r = coreRole(m, i), c = chunkAt(m, i);
  const vIdx = m.core.find((k) => k.r === "V").a;
  qBad = -1;
  if (qPhase === 0) {
    if (r === "V") { qPhase = 1; qVerb = i; fb3.textContent = P.t("quizS", { v: t }); }
    else if (m.s.verbs.includes(t) && c) { qBad = i; fb3.textContent = P.t("qInChunk", { w: t, ty: tyName(c.ty), c: ownText(m, c) }); }
    else { qBad = i; fb3.textContent = P.t("qNotVerb", { w: t }); }
  } else if (qPhase === 1) {
    if (r === "S") { qPhase = 2; const s = m.core.find((k) => k.r === "S").text; fb3.textContent = P.t("quizO", { s, sk: m.s.sk }); }
    else if (c) { const o = outerAt(m, i); qBad = i; fb3.textContent = P.t("qSubjChunk", { w: t, ty: tyName(o.ty), c: ownText(m, o) }) + (i === vIdx - 1 ? P.t("qTrap", { w: t, v: m.toks[vIdx] }) : ""); }
    else if (r && r !== "V") { qBad = i; fb3.textContent = P.t("qSubjRole", { w: t, role: P.t(r), v: m.toks[vIdx] }); }
    else return;
  }
  render();
  const again = sentEl.querySelector('[data-i="' + i + '"]');
  if (again) { again.focus(); if (qBad === i) shake(again); }
}

function renderRule() {
  if (qPhase < 2) drawSentence(QM, sentEl, "quiz");
  else { drawSentence(QM, sentEl, "show"); drawTree(QM, new Set()); }
  if (qPhase === 2) setReadout(QM.s.sk, P.t("okSkel", { k: wordCount(QM, new Set(QM.chunks.map((_, j) => j)), new Set()), n: wordCount(QM, new Set(), new Set()) }), "ok", L === "zh" ? QM.s.skZh : "");
  const cl = $("checklist");
  cl.innerHTML = "";
  ["c1", "c2", "c3"].forEach((key, j) => { const li = document.createElement("li"); li.textContent = P.t(key); if (qPhase > j || qPhase === 2) li.classList.add("done"); cl.appendChild(li); });
  rulesEl.innerHTML = "";
  let words = 0, kept = 0, whole = 0;
  MODELS.forEach((m, i) => {
    const all = new Set(m.chunks.map((_, j) => j));
    const w = wordCount(m, new Set(), new Set()), k = wordCount(m, all, new Set());
    words += w; kept += k;
    if (!missingRoles(m, new Set()).length && visibleText(m, all, new Set()) === m.s.sk) whole++;
    const d = document.createElement("div");
    d.className = "pair";
    d.appendChild(document.createTextNode(P.t("ruleLine", { i: i + 1, w, k })));
    const b = document.createElement("b"); b.lang = "en"; b.textContent = visibleText(m, all, new Set());
    d.appendChild(b);
    if (L === "zh") d.appendChild(document.createTextNode("（" + m.s.skZh.replace("。", "") + "）"));
    rulesEl.appendChild(d);
  });
  const c = document.createElement("div");
  c.className = "status";
  c.textContent = P.t("ruleCount", { n: MODELS.length, w: words, k: kept, p: Play.fmt((100 * kept) / words, 0), s: whole });
  rulesEl.appendChild(c);
}

function renderGuess() {
  const m = MODELS[0];
  drawSentence(m, sentEl, guess < 0 ? "plain" : "show");
  if (guess >= 0) {
    const v = m.core.find((k) => k.r === "V");
    sentEl.querySelectorAll(".wd").forEach((el) => { if (el.textContent === m.toks[v.a]) el.classList.add("mv"); });
    setReadout(m.s.sk, P.t("after1"), "ok", L === "zh" ? m.s.skZh : "");
  }
}

function legend() {
  const lg = $("legend");
  lg.innerHTML = "";
  [["core", "V"], ["rel", "rel"], ["pp", "pp"], ["part", "part"], ["adv", "adv"]].forEach(([c, k]) => {
    const s = document.createElement("span");
    s.innerHTML = '<span class="dot ' + c + '"></span>';
    s.appendChild(document.createTextNode(c === "core" ? P.t("S") + " / " + P.t("V") + " / " + P.t("O") : c === "adv" ? P.t("adv") + " / " + P.t("advc") : P.t(k)));
    lg.appendChild(s);
  });
}

function render() {
  pickBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === si ? "true" : "false"));
  pick.hidden = step !== 1;
  $("tools2").hidden = step !== 1;
  readout.hidden = (step === 0 && guess < 0) || (step === 2 && qPhase < 2);
  $("outline").hidden = !(step === 1 || (step === 2 && qPhase === 2));
  rulesEl.hidden = step !== 2;
  $("checklist").hidden = step !== 2;
  if (step === 0) renderGuess();
  else if (step === 1) renderEdit();
  else renderRule();
}

// one delegated handler for clicks and keys on the sentence
sentEl.addEventListener("click", (e) => {
  const q = e.target.closest("[data-i]");
  if (q && step === 2) { quizTap(+q.dataset.i); return; }
  if (step !== 1) return;
  const w = e.target.closest("[data-w]");
  if (w) { toggleCore(+w.dataset.w); return; }
  const c = e.target.closest("[data-k]");
  if (c) toggleChunk(+c.dataset.k);
});
sentEl.addEventListener("keydown", (e) => {
  const items = [...sentEl.querySelectorAll("[data-k],[data-w],[data-i]")];
  const i = items.indexOf(document.activeElement);
  if (i < 0) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    items[Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, items.length - 1)].focus();
    e.preventDefault();
  } else if ((e.key === "Enter" || e.key === " ") && !document.activeElement.matches("button")) {
    e.preventDefault();
    document.activeElement.click();
  }
});
$("strip").addEventListener("click", () => {
  const m = MODELS[si];
  const topOff = m.chunks.every((c, j) => c.parent || hidC.has(j));
  hidC = topOff ? new Set() : new Set(m.chunks.map((c, j) => (c.parent ? -1 : j)).filter((j) => j >= 0));
  fb3.textContent = "";
  render();
  Play.live(liveEl, visibleText(m, hidC, hidW));
});
$("say").addEventListener("click", () => Play.speak(visibleText(MODELS[si], hidC, hidW), "en-US"));

const OPTS = ["designed", "won", "rejected"];
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: OPTS.map((w) => ({ label: w, right: w === MODELS[0].toks[MODELS[0].core.find((k) => k.r === "V").a] })),
  right: P.t("p_won"), wrong: "",
}, (i) => {
  guess = i;
  $("predict").querySelector(".fb").textContent = P.t("p_" + OPTS[i]);
  render();
});

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  fb3.textContent = i === 2 && qPhase < 2 ? P.t(qPhase ? "quizS" : "quizV", { v: qVerb >= 0 ? QM.toks[qVerb] : "" }) : "";
  render();
});
$("reset").addEventListener("click", () => {
  si = 0; guess = -1; hidC = new Set(); hidW = new Set(); qPhase = 0; qVerb = -1; qBad = -1;
  pr.reset(); fb3.textContent = ""; st.go(0);
});
legend();
render();
})();
</script>
</body>
</html>

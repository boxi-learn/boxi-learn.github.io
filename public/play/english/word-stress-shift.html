  const n = d.n.st === p, v = d.v.st === p;
  return n && v ? "both" : n ? "n" : v ? "v" : "odd";

function drawFig() {
  const d = cur(), form = formAt(d, stress), odd = form === "odd";
  const f = form === "v" ? d.v : d.n; // which IPA row to show under the tiles
  fig.innerHTML = "";
  const sizes = d.syl.map((_, i) => (i === stress ? BIG : SMALL));
  const ws = d.syl.map((s, i) => sylWidth(s, sizes[i]));
  const total = ws.reduce((a, b) => a + b, 0) + GAP * (ws.length - 1);
  let x = 300 - total / 2;
  const centers = [];
  const beats = [];
  ws.forEach((w, i) => {
    const cx = x + w / 2, isSt = i === stress;
    centers.push(cx);
    const g = Play.svg("g", { class: "syl" + (isSt ? " st" : "") + (odd ? " odd" : ""), tabindex: "0", role: "button" }, fig);
    g.setAttribute("aria-pressed", isSt ? "true" : "false");
    g.setAttribute("aria-label", P.t("sylAria", { s: d.syl[i], st: isSt ? P.t("sylSt") : "" }));
    const h = isSt ? 150 : 110, y = 170 - h / 2;
    Play.svg("rect", { class: "box", x: x, y: y, width: w, height: h, rx: 20 }, g);
    const tx = Play.svg("text", { class: "sp", x: cx, y: 170 }, g);
    tx.setAttribute("font-size", sizes[i]);
    tx.setAttribute("lang", "en");
    tx.textContent = d.syl[i];
    g.addEventListener("click", () => setStress(i, true));
    g.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { setStress(i, true); e.preventDefault(); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        const j = Play.clamp(i + (e.key === "ArrowLeft" ? -1 : 1), 0, d.syl.length - 1);
        setStress(j, true); e.preventDefault();
      }
    });
    // beat: big and high on the stressed syllable
    beats.push({ cx, cy: isSt ? 40 : 66, r: isSt ? 24 : 10 });
    // IPA syllable under the tile (not shown for a stress English doesn't use)
    if (!odd) {
      const weak = f.wk === i;
      const ip = Play.svg("text", { class: "ipa" + (weak ? " weak" : ""), x: cx, y: 286 }, fig);
      ip.textContent = (i === f.st ? "ˈ" : "") + f.ipa[i];
      if (weak) Play.svg("text", { class: "wtag", x: cx, y: 318 }, fig).textContent = P.t("weak");
    }
    x += w + GAP;
  });
  Play.svg("path", { class: "beatline", d: "M " + beats.map((b) => b.cx + " " + b.cy).join(" L ") }, fig);
  beats.forEach((b) => Play.svg("circle", { class: "beat" + (odd ? " odd" : ""), cx: b.cx, cy: b.cy, r: b.r }, fig));
  if (odd) Play.svg("text", { class: "hint", x: 300, y: 290 }, fig).textContent = P.t("hint");
  return centers;
}

// ---- panel ----
function markSent(s) {
  const frag = document.createDocumentFragment();
  s.split(/(\[[^\]]*\])/).forEach((part) => {
    if (part.startsWith("[")) { const b = document.createElement("b"); b.textContent = part.slice(1, -1); frag.appendChild(b); }
    else if (part) frag.appendChild(document.createTextNode(part));
  });
  return frag;
}
function statusText(d, form) {
  if (form === "odd") return P.t("pillOdd", { w: d.w });
  if (form === "both") return P.t("pillBoth");
  return P.t(form === "n" ? "pillN" : "pillV", { w: capsOf(d, stress), art: art(d) });
}
function draw() {
  const d = cur(), form = formAt(d, stress);
  drawFig();
  const pill = $("pill");
  pill.textContent = statusText(d, form);
  pill.className = "pill" + (form === "odd" ? " odd" : form === "n" ? " n" : "");
  const ipl = $("ipaline");
  if (form === "odd") ipl.textContent = P.t("ipaOdd", { w: d.w, k: d.n.st + 1 });
  else if (form === "both") ipl.textContent = P.t("ipaBoth", { ipa: ipaOf(d.n) });
  else ipl.textContent = P.t(form === "n" ? "ipaN" : "ipaV", { ipa: ipaOf(form === "n" ? d.n : d.v) });
  const s = $("sent");
  s.innerHTML = "";
  if (form === "odd") s.textContent = "";
  else if (form === "both") s.append(markSent(d.ns), " ", markSent(d.vs));
  else s.appendChild(markSent(form === "n" ? d.ns : d.vs));
  $("say").disabled = form === "odd";
  $("sayBoth").hidden = !d.both;
  // form buttons
  fb.forEach(([b, k]) => {
    const f = d[k];
    b.innerHTML = "";
    const [pre, post] = P.t(k === "n" ? "btnN" : "btnV", { w: "\u0000", art: art(d) }).split("\u0000");
    const w = document.createElement("span");
    w.className = "w"; w.lang = "en"; w.textContent = capsOf(d, f.st);
    b.append(pre, w, post);
    b.classList.toggle("on", form !== "odd" && f.st === stress);
  });
  [...$("chipsP").children, ...$("chipsS").children].forEach((c) => c.classList.toggle("now", c.dataset.w === d.w));
  // result bar
  $("resultMain").textContent = shifts(d)
    ? art(d) + " " + capsOf(d, d.n.st) + " " + ipaOf(d.n) + " · to " + capsOf(d, d.v.st) + " " + ipaOf(d.v)
    : capsOf(d, d.n.st) + " " + ipaOf(d.n);
  $("resultNote").textContent = P.t(shifts(d) ? "rnPair" : "rnSame");
  Play.live($("live"), P.t("liveW", { w: capsOf(d, stress), status: statusText(d, form) }));
}
function setStress(i, focus) {
  stress = Play.clamp(i, 0, cur().syl.length - 1);
  draw();
  if (focus) { const g = fig.querySelectorAll(".syl")[stress]; if (g) g.focus(); }
}
function setWord(i) { wi = i; stress = WORDS[i].n.st; draw(); }

// form buttons
const fb = ["n", "v"].map((k) => {
  const b = document.createElement("button");
  b.type = "button";
  b.addEventListener("click", () => setStress(cur()[k].st));
  $("forms").appendChild(b);
  return [b, k];
});
// chips
WORDS.forEach((d, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = d.w; b.dataset.w = d.w;
  if (!shifts(d)) b.className = "same";
  b.addEventListener("click", () => setWord(i));
  $(shifts(d) ? "chipsP" : "chipsS").appendChild(b);
});
$("say").addEventListener("click", () => {
  const d = cur(), form = formAt(d, stress);
  if (form === "odd") return;
  Play.speak(form === "both" ? plainSent(d.ns) + " " + plainSent(d.vs) : plainSent(form === "n" ? d.ns : d.vs), "en-US");
});
$("sayBoth").addEventListener("click", () => { if (cur().both) Play.speak(cur().both, "en-US"); });

// ---- rule step: tally + quiz ----
function buildTally() {
  const t = $("tally");
  t.innerHTML = "";
  const head = document.createElement("tr");
  [P.t("thPattern"), P.t("thWords"), P.t("thCount")].forEach((h) => { const th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
  t.appendChild(head);
  const rows = [
    ["rowShift", WORDS.filter((d) => d.n.st === 0 && d.v.st === 1)],
    ["rowSame2", SAME.filter((d) => d.n.st === 1)],
    ["rowSame1", SAME.filter((d) => d.n.st === 0)],
  ];
  rows.forEach(([k, list]) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = P.t(k);
    const b = document.createElement("td"); b.className = "w"; b.lang = "en"; b.textContent = list.map((d) => d.w).join(", ");
    const c = document.createElement("td"); c.className = "n"; c.textContent = list.length + " / " + WORDS.length;
    tr.append(a, b, c);
    t.appendChild(tr);
  });
}
// quiz items: every pair word × noun / verb sentence, in a fixed shuffled order
const QUIZ = [];
PAIRS.forEach((d) => { QUIZ.push({ d, k: "n" }); QUIZ.push({ d, k: "v" }); });
(function shuffle(a, seed) { // small LCG so the order is the same on every load
  for (let i = a.length - 1; i > 0; i--) { seed = (seed * 1103515245 + 12345) % 2147483648; const j = seed % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
})(QUIZ, 7);
let qi = 0, qScore = 0, qDone = 0, qAnswered = false;
function showQuiz() {
  const item = QUIZ[qi % QUIZ.length], d = item.d;
  qAnswered = false;
  $("qs").innerHTML = "";
  $("qs").appendChild(markSent(item.k === "n" ? d.ns : d.vs));
  $("qf").textContent = "";
  const qb = $("qb");
  qb.innerHTML = "";
  [0, 1].forEach((p) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = capsOf(d, p);
    b.addEventListener("click", () => {
      if (qAnswered) return;
      qAnswered = true;
      const want = d[item.k].st, ok = p === want;
      qDone++; if (ok) qScore++;
      b.classList.add(ok ? "right" : "wrong");
      if (!ok) qb.children[want].classList.add("right");
      const vars = { form: P.t(item.k === "n" ? "noun" : "verb"), w: capsOf(d, want) + " " + ipaOf(d[item.k]), s: qScore, n: qDone };
      $("qf").textContent = P.t(ok ? "qRight" : "qWrong", vars);
      // show it in the figure too
      wi = WORDS.indexOf(d); stress = want; draw();
    });
    qb.appendChild(b);
  });
}
$("qnext").addEventListener("click", () => { qi++; showQuiz(); });
$("qsay").addEventListener("click", () => { const it = QUIZ[qi % QUIZ.length]; Play.speak(plainSent(it.k === "n" ? it.d.ns : it.d.vs), "en-US"); });

// ---- steps ----
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { wi = 0; stress = 1; draw(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ruleBox").hidden = i !== 2;
});
$("reset").addEventListener("click", () => {
  if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  wi = START.wi; stress = START.st; qi = 0; qScore = 0; qDone = 0;
  pr.reset(); st.go(0); showQuiz(); draw();
});
buildTally();
showQuiz();
draw();
</script>
</body>

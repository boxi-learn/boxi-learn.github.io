    case "presS": return { aux: [], main: he ? f.s : f.base };

// Sentence as segments [text, class]; classes: su subject, vp verb, tw time word, "" other.
function sentence(v, subj, tense, tw) {

  const seg = [[subj === "I" ? "I" : subj[0].toUpperCase() + subj.slice(1), "su"]];

    if (p.aux.length) { seg.push([p.aux[0], "vp"], [tw, "tw"]); p.aux.slice(1).forEach((a) => seg.push([a, "vp"])); }

    case "futS": return shape === "habit" ? "every day" : x > 410 ? "next year" : "tomorrow";
    case "presC": return "now";
    case "pastC": return "when you called";
    case "futC": return x > 410 ? "next year" : "tomorrow";

      return { lvl: "clash", key: tense === "presP" ? "clashPerf" : "clash" };
    case "every day":
      return ["presS", "pastS", "futS"].includes(tense) ? { lvl: "fit" } : { lvl: "odd", key: "oddEvery" };
    case "now":
      if (tense === "presC") return { lvl: "fit" };
      if (tense === "presS") return { lvl: "odd", key: "oddNowS" };
      if (tense === "futS") return { lvl: "odd", key: "oddNowF" };
      if (tense === "presP") return { lvl: "odd", key: "oddGen" };
      return { lvl: "clash", key: "clash" };
    case "tomorrow": case "next year":
      if (tense === "futS" || tense === "futC") return { lvl: "fit" };
      if (tense === "presC") return { lvl: "fit", key: "plan" };
      if (tense === "presS") return { lvl: "odd", key: "oddTable" };
      return { lvl: "clash", key: "clash" };
    case "already": case "just":
      if (tense === "presP") return { lvl: "fit" };
      return { lvl: "odd", key: tense === "pastS" ? "oddUS" : "oddGen" };

      if (tense === "presP") return v.dur ? { lvl: "fit" } : { lvl: "odd", key: "oddSince" };

// Chinese equivalent as [text, class]: mk marker (了 过 正在 会 要 已经 刚 一直), zv the verb (never changes), twz time word.
// Only called with no time word or a fitting one.
function zhParts(v, subj, tense, tw, shape) {
  const out = [], V = [v.zv, "zv"], O = [v.zo, ""];

  if (tw === "when you called") out.push(["你打电话来的时候，", "twz"]);
  out.push([ZS[subj], ""]);

      adv(); out.push(V, ["了", "mk"], O); break;
    case "presS": if (T) out.push(T); adv(); out.push(V, O); break;
    case "futS":
      if (habit) { out.push(["以后", "twz"], ["会", "mk"]); if (T) out.push(T); out.push(V, O); break; }
      if (T) out.push(T);
      out.push(["会", "mk"], V, O); break;
    case "presC":
      if (T) out.push(T);
      out.push([tw === "tomorrow" || tw === "next year" ? "要" : "正在", "mk"], V, O); break;
    case "pastC":
      if (T) out.push(T); else if (tw !== "when you called") out.push(["那时", "twz"]);

    case "presP":
      if (tw === "since 2020") { out.push(["从 2020 年起", "twz"], ["一直", "mk"], V, O); break; }

  { shape: "prog", x: NOW, subj: "they", v: 6, opts: ["presS", "pastS", "presC", "pastC"] },
  { shape: "perf", x: 120, subj: "I", v: 7, opts: ["pastS", "presP", "presC", "futS"] },
  { shape: "prog", x: 215, subj: "I", v: 1, opts: ["pastS", "pastC", "presC", "presP"] },

  if (guess < 0) return;
  const rows = el("div", "rows");
  [["yesterday", "pastS", "once"], ["now", "presC", "prog"], ["tomorrow", "futS", "once"]].forEach(([tw, t, sh]) => {
    const r = el("div", "r");
    const e = el("div", "sent"); e.lang = "en";
    segsTo(e, sentence(VERBS[0], "I", t, tw), "fit");
    r.appendChild(e);
    if (L === "zh") { const z = el("div", "zh"); z.lang = "zh-CN"; zhTo(z, zhParts(VERBS[0], "I", t, tw, sh)); r.appendChild(z); }
    rows.appendChild(r);
  });
  readout.appendChild(rows);
  readout.appendChild(el("div", "status fit", P.t("after1")));
  if (L === "en") readout.appendChild(el("div", "tn", P.t("after1en")));
}

// ---- step 3 ----
function miniPic(shape, x) {
  const s = S("svg", { viewBox: "0 0 120 36", "aria-hidden": "true" });
  const m = (vx) => 6 + ((vx - 20) / 560) * 108, nx = m(NOW), X = m(x);
  S("line", { x1: 4, y1: 22, x2: 116, y2: 22, class: "axis", "stroke-width": 1.5 }, s);
  S("line", { x1: nx, y1: 4, x2: nx, y2: 34, class: "nowl", "stroke-width": 1.5, "stroke-dasharray": "3 2" }, s);
  if (shape === "once") S("circle", { cx: X, cy: 22, r: 5, class: "ev" }, s);
  if (shape === "habit") for (let i = -2; i <= 2; i++) S("circle", { cx: X + i * 5.5, cy: 22, r: 2.6, class: "ev" }, s);
  if (shape === "prog") { S("rect", { x: X - 10, y: 19, width: 20, height: 6, rx: 3, class: "evs" }, s); S("path", { d: `M${X} 15 l6 7 l-6 7 l-6 -7 z`, class: "ref", "stroke-width": 1.5 }, s); }
  if (shape === "perf") { S("line", { x1: X, y1: 22, x2: nx - 4, y2: 22, class: "evb" }, s); S("path", { d: `M${nx} 22 l-7 -5 v10 z`, class: "ev" }, s); S("circle", { cx: X, cy: 22, r: 4, class: "ev" }, s); }
  return s;
}
const PICS = { pastS: ["once", 200], presS: ["habit", NOW], futS: ["once", 400], presC: ["prog", NOW], pastC: ["prog", 200], presP: ["perf", 120] };
function renderRuleTable() {
  const tb = $("tenseTbl"); tb.innerHTML = "";
  const hr = el("tr"); ["thTense", "thPic", "thForm"].forEach((k) => hr.appendChild(el("th", "", P.t(k)))); tb.appendChild(hr);
  const v = V();
  TENSES.forEach((t) => {
    const tr = el("tr");
    tr.appendChild(el("td", "", tn(t)));
    const pc = el("td"); pc.appendChild(miniPic(...PICS[t])); tr.appendChild(pc);
    const f = el("td", "f", (st.subj === "I" ? "I" : st.subj) + " " + vpText(v, st.subj, t)); f.lang = "en";
    tr.appendChild(f);
    tb.appendChild(tr);
  });
}
function renderQuiz() {
  const n = QUIZ.length;
  $("qScore").textContent = P.t("qScore", { k: qScore });
  const btn = $("qNext");
  if (qDone) {
    $("qNum").textContent = P.t("qDone", { k: qScore, n });
    $("qfig").innerHTML = ""; $("qfig").setAttribute("viewBox", "0 0 600 1");
    $("qSent").textContent = ""; $("qOpts").innerHTML = ""; $("qFb").textContent = "";
    btn.textContent = P.t("again");
    btn.hidden = false;
    return;
  }
  const q = QUIZ[qi], v = VERBS[q.v], ans = tenseAt(q.shape, q.x);
  const solved = qPicked.includes(ans);
  $("qNum").textContent = P.t("qNum", { i: qi + 1, n });
  drawTL($("qfig"), q.shape, q.x, solved ? vpText(v, q.subj, ans) : "?", false, false);
  $("qfig").setAttribute("aria-label", td(ans));
  const s = $("qSent"); s.innerHTML = "";
  s.append((q.subj === "I" ? "I" : q.subj[0].toUpperCase() + q.subj.slice(1)) + " ");
  s.appendChild(el("span", "gap", solved ? vpText(v, q.subj, ans) : " "));
  s.append(" " + v.o + ".");
  const box = $("qOpts"); box.innerHTML = "";
  q.opts.forEach((t) => {
    const b = el("button", "", vpText(v, q.subj, t)); b.type = "button"; b.lang = "en";
    if (qPicked.includes(t)) b.classList.add(t === ans ? "right" : "wrong");
    b.addEventListener("click", () => quizPick(t));
    box.appendChild(b);
  });
  btn.textContent = P.t("next");
  btn.hidden = !solved;
}
function quizPick(t) {
  const q = QUIZ[qi], v = VERBS[q.v], ans = tenseAt(q.shape, q.x);
  if (qPicked.includes(ans)) return;
  if (!qPicked.length && t === ans) qScore++;
  if (!qPicked.includes(t)) qPicked.push(t);
  const vars = { f: vpText(v, q.subj, t), tn: tn(t), td: td(t) };
  renderQuiz();
  const fb = $("qFb");
  fb.textContent = P.t(t === ans ? "qRight" : "qWrong", vars);
  fb.className = "qfb" + (t === ans ? "" : " no");
  if (t === ans) $("qNext").focus();
}
$("qNext").addEventListener("click", () => {
  if (qDone) { qi = 0; qScore = 0; qDone = false; }
  else if (qi + 1 >= QUIZ.length) qDone = true;
  else qi++;
  qPicked = []; $("qFb").textContent = "";
  renderQuiz();
  const first = $("qOpts").querySelector("button");
  if (first) first.focus();
});

// ---- forms table ----
(function () {
  const tb = $("formsTbl");
  const hr = el("tr"); ["fBase", "fS", "fPast", "fPp", "fIng"].forEach((k) => { const th = el("th", "", P.t(k)); th.lang = L === "zh" ? "zh-CN" : "en"; hr.appendChild(th); }); tb.appendChild(hr);
  VERBS.forEach((v) => {
    const f = forms(v), tr = el("tr");
    [f.base, f.s, f.past, f.pp, f.ing].forEach((w) => tr.appendChild(el("td", "", w)));
    if (v.irr) tr.style.fontWeight = "700";
    tb.appendChild(tr);
  });
})();
$("resultMain").textContent = "play → " + TENSES.map((t) => vpText(VERBS[0], "she", t)).join(" · ");

function render() {
  $("pickers").hidden = step !== 1;
  $("pTw").hidden = step !== 1;
  tl.hidden = step === 2;
  readout.hidden = step === 2;
  $("quiz").hidden = step !== 2;
  $("ruleBox").hidden = step !== 2;
  $("formsBox").hidden = step !== 1;
  tl.classList.toggle("live", step === 1);
  tl.tabIndex = step === 1 ? 0 : -1;
  if (step === 0) renderGuess();
  else if (step === 1) renderTimeline();
  else { renderRuleTable(); renderQuiz(); }
}

const OPTS = ["play", "played", "playing"];
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: OPTS.map((o) => ({ label: P.t("o_" + o), right: o === forms(VERBS[0]).past })),
  right: P.t("p_played"), wrong: "",
}, (i) => {
  guess = i;
  $("predict").querySelector(".fb").textContent = P.t("p_" + OPTS[i]);
  render();
});
$("predict").querySelectorAll("button").forEach((b) => (b.lang = "en"));

const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("stepBody").className = i === 2 ? "rule" : "";
  $("predict").hidden = i !== 0;
  if (i === 2) $("qFb").textContent = qDone ? "" : P.t("qAsk");
  render();
});
$("reset").addEventListener("click", () => {
  st = fresh(); guess = -1; qi = 0; qScore = 0; qDone = false; qPicked = [];
  pr.reset(); $("qFb").textContent = ""; liveEl.textContent = ""; steps.go(0);
});
let rt = 0;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
render();
})();
</script>
</body>
</html>

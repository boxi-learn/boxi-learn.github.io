<script>
// All messages are original, written for this page. The English stays English in both UI languages.
// Levels: 0 casual, 1 neutral, 2 formal. Each message has 5 slots x 3 variants.
// Markup {tag|text} marks a register feature: ct contraction, pv phrasal verb, tx texting / slang,
// lv Latinate (single, formal-sounding) verb, ps passive, hg hedge. "\n" is a line break.
const SLOTS = ["greet", "reason", "request", "soft", "close"];
const CASUAL = ["ct", "pv", "tx"], FORMAL = ["lv", "ps", "hg"], TAGS = CASUAL.concat(FORMAL);
const MSGS = [
  { id: "teacher", aud: "teacher", v: {

    reason: ["{ct|I've} been super sick all week so {ct|I'm} way behind on the essay.",

    request: ["Can I {pv|hand it in} Monday?",
      "Could I {pv|hand it in} on Monday instead of Friday?",
      "{hg|I was wondering whether it might be possible} to {lv|submit} it on Monday rather than Friday."],
    soft: ["No worries if not {tx|lol}", "I understand if {ct|that's} not possible.", "I fully understand if this cannot {ps|be arranged}."],
    close: ["{tx|thx}\nSam", "Thanks,\nSam", "Kind regards,\nSam Chen"] } },
  { id: "friend", aud: "friend", v: {
    greet: ["{tx|heyy} Jo", "Hi Jo,", "Dear Jo,"],
    reason: ["my mum just {pv|signed me up} for extra maths on {tx|sat} {tx|ugh}",
      "My mum has {pv|signed me up} for an extra maths class on Saturday.",
      "My mother has {lv|enrolled} me in an additional mathematics class on Saturday."],
    request: ["can we do the cinema {tx|sun} instead?", "Could we {pv|put off} the cinema until Sunday?",
      "{hg|Would it be possible} to {lv|postpone} our cinema trip until Sunday?"],
    soft: ["{tx|sooo} sorry", "{ct|I'm} really sorry about this!", "I {lv|apologise} for any inconvenience this may cause."],
    close: ["{tx|ttyl}", "See you soon,\nAlex", "With best wishes,\nAlex"] } },
  { id: "shop", aud: "company", v: {
    greet: ["Hi there,", "Hello,", "Dear Sir or Madam,"],
    reason: ["the headphones I got off {tx|u} last week have already {pv|packed up}",
      "The left side of the headphones I bought from your shop last week has {pv|cut out}.",
      "The headphones I {lv|purchased} from your store last week {ps|were found} to be faulty: the left speaker no longer {lv|functions}."],
    request: ["can {tx|u} {pv|sort out} a refund?", "Could you replace them or {pv|pay me back}?",
      "{hg|I would be grateful if} you could {lv|arrange} a replacement or a full refund."],
    soft: ["{tx|cheers}, got the receipt if {tx|u} need it", "Thanks for your help. {ct|I've} kept the receipt.",
      "Thank you in advance for your assistance. A copy of the receipt {ps|is attached}."],
    close: ["Priya", "Thanks,\nPriya Shah", "Yours faithfully,\nPriya Shah"] } },
  { id: "host", aud: "grandparent", v: {
    greet: ["Hi {tx|guys}!!", "Hi Anna and Tom,", "Dear Mr and Mrs Baker,"],
    reason: ["Just wanted to say thanks {tx|sooo} much for {pv|putting me up} last week!",
      "Thank you so much for having me to stay last week. I had a wonderful time.",
      "I am writing to {lv|express} my sincere gratitude for your hospitality during my stay."],
    request: ["{tx|u} have to come and visit me next summer!", "I hope you can {pv|come over} and visit me next summer.",
      "It would be a great pleasure to {lv|receive} you in my home city next summer."],
    soft: ["{ct|I'll} miss Biscuit loads {tx|lol}", "{ct|I'll} really miss the walks with Biscuit.",
      "Please {lv|convey} my warmest regards to Biscuit as well."],
    close: ["Love, Mei {tx|xx}", "Best wishes,\nMei", "Yours sincerely,\nMei Wong"] } },
];
// Expected register range for each reader, on the 0 (casual) – 2 (formal) scale. A teaching heuristic.
const AUD = { friend: [0, 0.6], grandparent: [0.6, 1.4], teacher: [1, 1.8], company: [1.4, 2] };
const AUDS = ["friend", "grandparent", "teacher", "company"];
const K_DIST = 75, K_SPREAD = 20; // fit = 100 − 75 × distance outside the range − 20 × spread
// Predict step: three ways to ask a close friend for a charger.
const PRED = [
  { s: "I would be grateful if you could lend me your phone charger.", lv: 2 },
  { s: "Could you lend me your phone charger?", lv: 1 },
  { s: "Can u lend me ur charger?", lv: 0 },
];

// ---- pure logic (also tested in node) ----
function parse(s) { // → [{t, tag|null}]
  const out = [], re = /\{(\w+)\|([^{}]*)\}/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ t: s.slice(last, m.index), tag: null });
    out.push({ t: m[2], tag: m[1] });
    last = re.lastIndex;
  }
  if (last < s.length) out.push({ t: s.slice(last), tag: null });
  return out;
}
const plain = (s) => parse(s).map((p) => p.t).join("");
function stats(levels) {
  const n = levels.length;
  if (!n) return { mean: 1, spread: 0, lo: 1, hi: 1 };
  const lv = levels.map((x) => Play2.clamp(+x || 0, 0, 2));
  const mean = lv.reduce((a, b) => a + b, 0) / n;
  return { mean, lo: Math.min(...lv), hi: Math.max(...lv), spread: Math.max(...lv) - Math.min(...lv) };
}
function distance(mean, range) { return mean < range[0] ? range[0] - mean : mean > range[1] ? mean - range[1] : 0; }
function fit(levels, aud) {
  const st = stats(levels), r = AUD[aud] || AUD.teacher;
  const d = distance(st.mean, r);
  return { score: Play2.clamp(Math.round(100 - K_DIST * d - K_SPREAD * st.spread), 0, 100), d, mean: st.mean, spread: st.spread, min: st.lo, max: st.hi };
}
function features(msg, levels) {
  const c = {};
  TAGS.forEach((t) => (c[t] = 0));
  SLOTS.forEach((k, i) => parse(msg.v[k][levels[i]]).forEach((p) => { if (p.tag) c[p.tag]++; }));
  return c;
}
// Best uniform level (all slots the same) for a message and reader; ties → all of them.
function bestUniform(aud) {
  const sc = [0, 1, 2].map((l) => fit([l, l, l, l, l], aud).score), top = Math.max(...sc);
  return { sc, best: [0, 1, 2].filter((l) => sc[l] === top) };
}
function validate() {
  const errs = [];
  MSGS.forEach((m) => {
    if (!AUD[m.aud]) errs.push(m.id + ": bad audience");
    SLOTS.forEach((k) => {
      const v = m.v[k];
      if (!v || v.length !== 3) { errs.push(m.id + "." + k + ": needs 3 variants"); return; }
      v.forEach((s) => {
        if (/[{}|]/.test(s.replace(/\{(\w+)\|([^{}]*)\}/g, ""))) errs.push(m.id + "." + k + ": bad markup " + s);
        parse(s).forEach((p) => { if (p.tag && !TAGS.includes(p.tag)) errs.push("unknown tag " + p.tag); });
        if (!plain(s).trim()) errs.push(m.id + "." + k + ": empty");
      });
    });
    const f0 = features(m, [0, 0, 0, 0, 0]), f2 = features(m, [2, 2, 2, 2, 2]);
    const cas = (f) => CASUAL.reduce((a, t) => a + f[t], 0), frm = (f) => FORMAL.reduce((a, t) => a + f[t], 0);
    if (!(cas(f0) > cas(f2))) errs.push(m.id + ": casual version should have more casual features");
    if (!(frm(f2) > frm(f0))) errs.push(m.id + ": formal version should have more formal features");
  });
  return errs;
}
const Play2 = typeof Play !== "undefined" ? Play : { clamp: (x, a, b) => Math.min(b, Math.max(a, x)) };
if (typeof module !== "undefined") module.exports = { MSGS, AUD, AUDS, PRED, parse, plain, stats, fit, features, bestUniform, validate, distance };

    p2: "对，对好朋友这样很自然。但「看对象」：同样的话发给公司就很不合适。比较它下面的两个分数。",
    forAud: "给{a}", fitWord: "合适度",
    fitLine: "给{a}的合适度：{s} / 100。平均语域 {m}（0 随意 – 2 正式），期望 {lo}–{hi}；偏离 {d}；前后落差 {sp}。",
    featT: "这条消息里的语言特征", ftotal: "{n}",
    f_ct: "缩写（I'm, I've）", f_pv: "短语动词（hand in, put off）", f_tx: "网络用语（u, thx, lol）",
    f_lv: "拉丁来源动词（submit, postpone）", f_ps: "被动语态（be arranged）", f_hg: "委婉语（I was wondering whether…）",
    n0: "随意：用缩写、短语动词、网络缩写，句子短。只对很熟的人用。随手的消息里省掉词（Can I hand it in Monday?）很常见。",
    n1: "中性：句子完整，礼貌地说 Could you…?，可以有少量缩写。对稍微认识的人大多都安全。",
    n2: "正式：用单个的拉丁来源动词（submit, postpone, purchase）、被动语态、I was wondering whether… 这样的委婉说法，以及固定的开头结尾（Dear… / Yours faithfully）。用于机构和陌生人。",
    nmix: "混搭：各部分不在同一档。前面很正式、结尾来个 lol，读起来就别扭，所以前后落差要扣分。",
    liveSet: "{a}：合适度 {s}。",
    tooT: "太正式也不对：跟好朋友改约",
    tooF: "正式版，对好朋友的合适度：{s} / 100",
    tooC: "随意版，对好朋友的合适度：{s} / 100",
    gridT: "每类读者最合适的一档（五个部分同一档），按规则算出",
    pairsT: "同一个意思，两种语域",
    resultTitle: "我们发现", resultMain: "合适的语域 = 这位读者期待的那一档，并且前后一致",
    resultNote: "没有哪个版本处处都对。同一句话对一个人合适，对另一个人就会出错，两个方向都会：太随意显得没礼貌，太正式显得冷淡。",
    explainK: "说一说", explainQ: "把同一个小请求（比如借一本书）用英语写三遍：给好朋友、给老师、给图书馆。跟别人讲讲每次改了什么，为什么最正式的那版不是「最好」的。",
    homeK: "家里做一做", homeQ: "找三条这周收到的英文消息（朋友的短信、学校通知、广告邮件），划出缩写、短语动词和被动语态。猜猜每条是谁写给谁的？",
    foot: "合适度是教学用的简化规则，不是测量：合适度 = 100 − 75 ×（平均语域超出读者期望范围的距离）− 20 ×（最随意和最正式部分之间的落差），限制在 0–100。期望范围（0 随意 – 2 正式）：好朋友 0–0.6，爷爷奶奶 0.6–1.4，老师 1–1.8，公司 1.4–2；真实的期待因人、文化和媒介而不同。「拉丁来源动词」指多来自拉丁语或法语的正式单个动词（submit, postpone），对应的短语动词（hand in, put off）更日常。Dear Sir or Madam … Yours faithfully 是英式书信的常见惯例。所有消息和人名均为原创。CC BY-SA 4.0 · Boxi Yu",
  },
});
const $ = (id) => document.getElementById(id);
const msgEl = $("msg"), slotsEl = $("slots"), meter = $("meter"), reg = $("reg"), liveEl = $("live");
let step = 0, mi = 0, aud = MSGS[0].aud, levels = [1, 1, 1, 1, 1], guess = -1, focusSlot = -1;
const f1 = (x) => Play.fmt(x, 1);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function renderText(box, s) {
  parse(s).forEach((p) => {
    p.t.split("\n").forEach((part, j) => {
      if (j) box.appendChild(document.createElement("br"));
      if (!part) return;
      if (p.tag) { const sp = el("span", "ft " + p.tag, part); sp.title = P.t("f_" + p.tag); box.appendChild(sp); }
      else box.appendChild(document.createTextNode(part));
    });
  });
}
function messageText(m, lv) { return SLOTS.map((k, i) => plain(m.v[k][lv[i]]).replace(/\n/g, " ")).join(" "); }
function drawMessage(box, m, lv, cur) {
  box.innerHTML = "";
  const parts = SLOTS.map((k, i) => { const s = el("span", "sg" + (i === cur ? " cur" : "")); renderText(s, m.v[k][lv[i]]); return s; });
  const g = el("span", "ln"); g.appendChild(parts[0]);
  const b = el("span", "body"); [1, 2, 3].forEach((i, j) => { if (j) b.appendChild(document.createTextNode(" ")); b.appendChild(parts[i]); });
  const c = el("span", "ln"); c.appendChild(parts[4]);
  box.append(g, b, c);
}

// ---- meter ----
const X = (v) => 20 + v * 150;
function drawMeter(f, a) {
  meter.innerHTML = "";
  const r = AUD[a];
  Play.svg("rect", { class: "band", x: X(r[0]), y: 30, width: Math.max(4, X(r[1]) - X(r[0])), height: 34, rx: 6 }, meter);
  Play.svg("text", { class: "rng", x: Play.clamp((X(r[0]) + X(r[1])) / 2, 80, 260), y: 22, "text-anchor": "middle" }, meter).textContent = P.t("forAud", { a: P.t("a_" + a) });
  Play.svg("line", { class: "axis", x1: X(0), y1: 47, x2: X(2), y2: 47 }, meter);
  [0, 1, 2].forEach((l) => {
    Play.svg("line", { class: "axis", x1: X(l), y1: 40, x2: X(l), y2: 54 }, meter);
    Play.svg("text", { class: "tick", x: X(l), y: 78, "text-anchor": l === 0 ? "start" : l === 2 ? "end" : "middle" }, meter).textContent = l + " " + P.t("L" + l);
  });
  if (f.spread > 0) Play.svg("line", { class: "spread", x1: X(f.min), y1: 47, x2: X(f.max), y2: 47 }, meter);
  Play.svg("circle", { class: "dotm", cx: X(f.mean), cy: 47, r: 9 }, meter);
  Play.svg("text", { class: "big", x: 170, y: 106, "text-anchor": "middle" }, meter).textContent = P.t("fitWord") + " " + f.score + " / 100";
}

// ---- pickers ----
function pickRow(box, keys, label, cur, on) {
  box.querySelectorAll("button").forEach((b) => b.remove());
  keys.forEach((k) => {
    const b = el("button", "small", P.t(label + k));
    b.type = "button";
    b.setAttribute("aria-pressed", k === cur ? "true" : "false");
    b.addEventListener("click", () => on(k));
    box.appendChild(b);
  });
}
function setAll(l) { levels = levels.map(() => l); }
function drawSlots(m) {
  slotsEl.innerHTML = "";
  SLOTS.forEach((k, i) => {
    const row = el("div", "slot");
    row.appendChild(el("span", "nm", P.t(k)));
    const g = el("span", "lv3");
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", P.t(k));
    [0, 1, 2].forEach((l) => {
      const b = el("button", "", P.t("Ls" + l));
      b.type = "button";
      b.dataset.slot = i; b.dataset.l = l;
      b.setAttribute("aria-pressed", levels[i] === l ? "true" : "false");
      b.setAttribute("aria-label", P.t(k) + ": " + P.t("L" + l));
      g.appendChild(b);
    });
    row.appendChild(g);
    const t = el("span", "tx2", plain(m.v[k][levels[i]]).replace(/\n/g, " "));
    t.lang = "en";
    row.appendChild(t);
    slotsEl.appendChild(row);
  });
}
slotsEl.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-slot]");
  if (!b) return;
  setSlot(+b.dataset.slot, +b.dataset.l);
});
slotsEl.addEventListener("keydown", (e) => {
  const b = e.target.closest("button[data-slot]");
  if (!b || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  const i = +b.dataset.slot, l = Play.clamp(levels[i] + (e.key === "ArrowRight" ? 1 : -1), 0, 2);
  e.preventDefault();
  setSlot(i, l);
});
function setSlot(i, l) {
  levels[i] = l; focusSlot = i;
  render();
  Play.live(liveEl, P.t("liveSet", { a: P.t("a_" + aud), s: fit(levels, aud).score }));
  const nb = slotsEl.querySelector('button[data-slot="' + i + '"][data-l="' + l + '"]');
  if (nb) nb.focus();
}

function regLabel() {
  const st = stats(levels);
  if (st.spread === 0) { reg.value = st.lo; return P.t("L" + st.lo); }
  reg.value = Math.round(st.mean);
  return P.t("mixed") + " " + f1(st.mean);
}
function drawFeatures(m) {
  const f = features(m, levels), ul = $("feat");
  ul.innerHTML = "";
  const h = el("li"); h.appendChild(el("b", "", P.t("featT"))); ul.appendChild(h);
  ["ct", "pv", "tx", "lv", "ps", "hg"].forEach((t) => {
    const li = el("li");
    const s = el("span"); const sw = el("span", "sw"); sw.style.borderColor = swColor(t); sw.style.borderBottomStyle = swStyle(t);
    s.append(sw, document.createTextNode(P.t("f_" + t)));
    li.append(s, el("b", "", P.t("ftotal", { n: f[t] })));
    ul.appendChild(li);
  });
}
const swColor = (t) => ({ ct: "var(--a)", pv: "var(--b)", tx: "var(--h)", lv: "var(--c)", ps: "var(--no)", hg: "var(--hl)" })[t];
const swStyle = (t) => ({ tx: "dotted", lv: "double", ps: "dashed", hg: "dotted" })[t] || "solid";

function renderEdit() {
  const m = MSGS[mi];
  pickRow($("pickMsg"), MSGS.map((x) => x.id), "m_", m.id, (k) => { mi = MSGS.findIndex((x) => x.id === k); aud = MSGS[mi].aud; focusSlot = -1; render(); });
  pickRow($("pickAud"), AUDS, "a_", aud, (k) => { aud = k; render(); Play.live(liveEl, P.t("liveSet", { a: P.t("a_" + aud), s: fit(levels, aud).score })); });
  $("regVal").textContent = regLabel();
  drawMessage(msgEl, m, levels, focusSlot);
  drawSlots(m);
  const f = fit(levels, aud), r = AUD[aud];
  drawMeter(f, aud);
  $("fitline").textContent = P.t("fitLine", { a: P.t("a_" + aud), s: f.score, m: f1(f.mean), lo: f1(r[0]), hi: f1(r[1]), d: f1(f.d), sp: f1(f.spread) });
  drawFeatures(m);
  const st = stats(levels);
  $("lnote").textContent = st.spread ? P.t("nmix") : P.t("n" + st.lo);
}

function renderGuess() {
  const box = $("v1");
  box.innerHTML = "";
  PRED.forEach((p, i) => {
    const c = el("div", "c3");
    const s = el("div", "s", p.s); s.lang = "en";
    c.appendChild(s);
    if (guess >= 0) {
      const sc = el("div", "sc");
      ["friend", "company"].forEach((a) => {
        const v = fit([p.lv], a).score;
        const sp = el("span");
        sp.append(document.createTextNode(P.t("forAud", { a: P.t("a_" + a) }) + ": "), el("b", "", String(v)));
        const bw = el("span", "barw"); const bi = el("i"); bi.style.width = v + "%"; bw.appendChild(bi);
        sp.appendChild(bw);
        sc.appendChild(sp);
      });
      c.appendChild(sc);
    }
    if (i === guess) c.style.borderColor = "var(--a)";
    box.appendChild(c);
  });
}

function renderRule() {
  const box = $("v3"), m = MSGS[1];
  box.innerHTML = "";
  box.appendChild(el("div", "ttl", P.t("tooT")));
  const all2 = [2, 2, 2, 2, 2], all0 = [0, 0, 0, 0, 0];
  const m2 = el("div", "msg"); m2.lang = "en"; drawMessage(m2, m, all2, -1);
  box.append(el("p", "fitline", P.t("tooF", { s: fit(all2, "friend").score })), m2);
  const m0 = el("div", "msg"); m0.lang = "en"; drawMessage(m0, m, all0, -1);
  box.append(el("p", "fitline", P.t("tooC", { s: fit(all0, "friend").score })), m0);
  box.appendChild(el("div", "ttl", P.t("gridT")));
  const tb = el("table", "grid"), tr = el("tr");
  ["", "L0", "L1", "L2"].forEach((k) => tr.appendChild(el("th", "", k ? P.t(k) : P.t("audLabel"))));
  tb.appendChild(tr);
  AUDS.forEach((a) => {
    const row = el("tr"), b = bestUniform(a);
    row.appendChild(el("td", "", P.t("a_" + a)));
    b.sc.forEach((v, l) => row.appendChild(el("td", b.best.includes(l) ? "best" : "", (b.best.includes(l) ? "✓ " : "") + v)));
    tb.appendChild(row);
  });
  box.appendChild(tb);
  const pl = $("pairs");
  pl.innerHTML = "";
  pl.appendChild(el("li", "ttl", P.t("pairsT")));
  [["find out", "ascertain"], ["hand in", "submit"], ["put off", "postpone"], ["sign up", "enrol"], ["sort out", "resolve"], ["Can you…?", "I was wondering whether you could…"]].forEach(([a, b]) => {
    const li = el("li");
    const x = el("b", "", a), y = el("b", "", b); x.lang = y.lang = "en";
    li.append(x, document.createTextNode(" → "), y);
    pl.appendChild(li);
  });
}

function legend() {
  const lg = $("legend");
  lg.innerHTML = "";
  ["ct", "pv", "tx", "lv", "ps", "hg"].forEach((t) => {
    const s = el("span"), sw = el("span", "sw");
    sw.style.borderColor = swColor(t); sw.style.borderBottomStyle = swStyle(t);
    s.append(sw, document.createTextNode(P.t("f_" + t).replace(/\s*[（(].*$/, "")));
    lg.appendChild(s);
  });
}

function render() {
  const s2 = step === 1;
  $("v1").hidden = step !== 0;
  $("v2").hidden = !s2;
  $("sliderRow").hidden = !s2;
  msgEl.hidden = !s2; slotsEl.hidden = !s2; meter.toggleAttribute("hidden", !s2); // SVG has no .hidden property
  $("say").parentNode.hidden = !s2;
  $("v3").hidden = step !== 2;
  $("legend").hidden = step === 0;
  ["fitline", "feat", "lnote"].forEach((id) => ($(id).hidden = !s2));
  $("pairs").hidden = step !== 2;
  if (step === 0) renderGuess();
  else if (s2) renderEdit();
  else renderRule();
}

reg.addEventListener("input", () => { setAll(Play.clamp(Math.round(+reg.value), 0, 2)); focusSlot = -1; render(); Play.live(liveEl, P.t("liveSet", { a: P.t("a_" + aud), s: fit(levels, aud).score })); });
$("hl").addEventListener("change", (e) => $("board").classList.toggle("nohl", !e.target.checked));
$("say").addEventListener("click", () => Play.speak(messageText(MSGS[mi], levels), "en-GB"));

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: PRED.map((p) => ({ label: p.s, right: p.lv < 2 })), right: "", wrong: "",
}, (i) => { guess = i; $("predict").querySelector(".fb").textContent = P.t("p" + i); render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  mi = 0; aud = MSGS[0].aud; levels = [1, 1, 1, 1, 1]; guess = -1; focusSlot = -1;
  $("hl").checked = true; $("board").classList.remove("nohl");
  pr.reset(); liveEl.textContent = ""; st.go(0);
});
legend();
const errs = validate();
if (errs.length) console.error(errs);
render();
})();
</script>
</body>
</html>

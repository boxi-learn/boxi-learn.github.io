const QUIZ = { det: "a", noun: "boat", adj: [W("little", "size"), W("old", "age"), W("wooden", "material")],

// ---- pure logic (also tested in node) ----
const AN_EXCEPT = new Set(["one", "once", "useful", "used", "unique", "european", "university"]);
const HOUR = new Set(["honest", "hour", "honour", "honor", "heir"]);
function article(det, first) {
  if (det !== "a") return det;
  const f = String(first || "").toLowerCase();
  if (HOUR.has(f)) return "an";
  if (AN_EXCEPT.has(f)) return "a";
  return /^[aeiou]/.test(f) ? "an" : "a";
}

function arrange(p, words) {
  return words.map((w) => { const a = p.adj.find((x) => x.w === w); if (!a) throw new Error("unknown word " + w); return a; });
}
const usual = (p) => p.adj.slice().sort((x, y) => x.c - y.c);
// pairs (i < j) where the earlier word sits lower on the ladder than a later one
function inversions(list) {
  let n = 0;
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) if (list[i].c > list[j].c) n++;
  return n;
}
// marks between neighbours: true = steps forward (or same rung), false = steps back
const steps = (list) => list.slice(1).map((x, i) => list[i].c <= x.c);
function phrase(p, list) {
  const ws = list.map((x) => x.w);
  return [article(p.det, ws[0] || p.noun), ...ws, p.noun].join(" ");
}
function moveItem(arr, from, to) {
  const a = arr.slice();
  if (from < 0 || from >= a.length) return a;
  to = Math.max(0, Math.min(a.length - 1, to));
  const [x] = a.splice(from, 1);
  a.splice(to, 0, x);
  return a;
}
function swapItems(arr, i, j) { const a = arr.slice(); [a[i], a[j]] = [a[j], a[i]]; return a; }
// Problems in the data; [] when consistent.
function validate() {
  const errs = [];
  PUZZLES.concat([BALL, QUIZ]).forEach((p) => {
    if (p.adj.length < 2 || p.adj.length > 4) errs.push(p.noun + ": want 2–4 adjectives");
    if (p.adj.some((a) => a.c < 0)) errs.push(p.noun + ": unknown category");
    if (new Set(p.adj.map((a) => a.c)).size !== p.adj.length) errs.push(p.noun + ": two adjectives share a rung");
    if (p.adj.some((a) => a.c === 2) && p.adj.some((a) => a.c === 3)) errs.push(p.noun + ": age + shape together (grammars differ)");
    if (p.start) {
      const s = arrange(p, p.start);
      if (s.length !== p.adj.length || new Set(p.start).size !== p.start.length) errs.push(p.noun + ": start is not a permutation");
      if (inversions(s) === 0) errs.push(p.noun + ": start is already in order");
    }
  });
  return errs;
}
// ladder: for each category, the words from all puzzles on that rung
function ladderWords() { return CATS.map((_, c) => [...new Set(PUZZLES.flatMap((p) => p.adj.filter((a) => a.c === c).map((a) => a.w)))]); }
function totals() {
  let adj = 0, back = 0, after = 0;
  PUZZLES.forEach((p) => { adj += p.adj.length; back += inversions(arrange(p, p.start)); after += inversions(usual(p)); });
  return { n: PUZZLES.length, adj, back, after };
}
if (typeof module !== "undefined") module.exports = { CATS, PUZZLES, BALL, QUIZ, article, arrange, usual, inversions, steps, phrase, moveItem, swapItems, validate, ladderWords, totals };

    resultNote: "惯常顺序，不是铁律：同类形容词用逗号隔开，重读对比时可以挪动，固定说法自有顺序；一般两三个形容词就够了。",
    explainK: "说一说", explainQ: "同学说成了 “a wooden old lovely table”。不要只说「听着不对」，用这把梯子给他讲清楚：哪几个词放错了位置，为什么。",
    homeK: "家里做一做", homeQ: "在家里挑一样东西，给它想三个英文形容词，分别写在小纸条上（比如 small、old、metal）。把纸条打乱，再按惯常顺序摆在这样东西的英文名字前面，读出来。和家人交换东西再试。",
    foot: "顺序采用常见的英语学习语法书的说法（观点、大小、新旧、形状、颜色、来源、材料、用途）；有的书把形状放在新旧前面，或在大小后面加一级「物理性质」（hot、soft），所以本页的练习不把新旧和形状放在一起。它描述的是大多数母语者的习惯，不是他们背过的规则。running、sleeping、sports 这类词说明东西的用途，紧挨着名词。发音用浏览器自带的语音。所有短语均为原创。CC BY 4.0 · Boxi Yu",
  },
});
const $ = (id) => document.getElementById(id);
const L = P.lang;
const rowEl = $("row"), readout = $("readout"), fb3 = $("fb3"), liveEl = $("live");
const catName = (c) => P.t("cat_" + CATS[c]);
const errs = validate();
if (errs.length) console.error("adjective-order data:", errs);

let step = 0, pi = 0, guess = -1, sel = -1;
let orders = PUZZLES.map((p) => p.start.slice());
let solved = new Set();

function shake(el) { if (!Play.reduced && el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }

function tileEl(a, i, m, active) {
  const b = document.createElement(active ? "button" : "span");
  if (active) { b.type = "button"; b.dataset.i = i; b.setAttribute("aria-label", P.t("tileAria", { w: a.w, k: catName(a.c), n: a.c + 1, i: i + 1, m })); }
  b.className = "tile c" + a.c + (active ? "" : " static") + (active && sel === i ? " sel" : "");
  const w = document.createElement("span"); w.className = "w"; w.textContent = a.w;
  const k = document.createElement("span"); k.className = "k"; k.lang = L === "zh" ? "zh-CN" : "en";
  const n = document.createElement("span"); n.className = "n"; n.textContent = a.c + 1;
  k.append(n, document.createTextNode(catName(a.c)));
  b.append(w, k);
  return b;
}
// det + tiles (with ✓/✗ marks between them) + noun
function drawRow(p, list, active) {
  rowEl.innerHTML = "";
  const det = document.createElement("span"); det.className = "fixed"; det.textContent = article(p.det, list[0] ? list[0].w : p.noun);
  rowEl.appendChild(det);
  const ok = steps(list);
  list.forEach((a, i) => {
    if (i > 0) { const mk = document.createElement("span"); mk.className = "mk" + (ok[i - 1] ? "" : " bad"); mk.setAttribute("aria-hidden", "true"); mk.textContent = ok[i - 1] ? "›" : "✗"; rowEl.appendChild(mk); }
    rowEl.appendChild(tileEl(a, i, list.length, active));
  });
  const nn = document.createElement("span"); nn.className = "fixed noun"; nn.textContent = p.noun;
  rowEl.appendChild(nn);
}
function drawLadder(p) {
  const lad = $("ladder"); lad.innerHTML = "";
  const used = new Set(p.adj.map((a) => a.c));
  CATS.forEach((_, c) => { const r = document.createElement("span"); r.className = "rung c" + c + (used.has(c) ? " use" : ""); r.innerHTML = "<b>" + (c + 1) + "</b> "; r.appendChild(document.createTextNode(catName(c))); lad.appendChild(r); });
}
function setReadout(text, status, cls, zh, labKey) {
  readout.innerHTML = "";
  const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = P.t(labKey || "now");
  const nw = document.createElement("div"); nw.className = "now"; nw.lang = "en"; nw.textContent = text;
  const st = document.createElement("div"); st.className = "status " + cls; st.textContent = status;
  readout.append(lab, nw, st);
  if (zh) { const z = document.createElement("div"); z.className = "zh"; z.lang = "zh-CN"; z.textContent = zh; readout.appendChild(z); }
}
const cur = () => arrange(PUZZLES[pi], orders[pi]);
function statusText(list) {
  const n = inversions(list);
  if (n) return P.t(n === 1 ? "bad1" : "badN", { n });
  return P.t("good", { k: solved.size, m: PUZZLES.length });
}

// ---- step 1 ----
const hear1 = $("hear1");
[["oBR"], ["oRB"]].forEach(([k]) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "small"; b.lang = "en";
  b.textContent = P.t("hearIt", { p: P.t(k) });
  b.addEventListener("click", () => Play.speak(P.t(k), "en-US"));
  hear1.appendChild(b);
});
$("ballL").textContent = "?";
function renderGuess() {
  const list = usual(BALL);
  $("ballL").textContent = guess < 0 ? "?" : phrase(BALL, list);
  if (guess >= 0) { drawRow(BALL, list, false); drawLadder(BALL); setReadout(phrase(BALL, list), P.t("after1"), "ok", ""); }
}

// ---- step 2 ----
const pick = $("pick");
const pickBtns = PUZZLES.map((p, i) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "small"; b.textContent = String(i + 1);
  b.setAttribute("aria-label", p.noun);
  b.addEventListener("click", () => { pi = i; sel = -1; fb3.textContent = ""; render(); });
  pick.appendChild(b);
  return b;
});
function renderEdit() {
  const p = PUZZLES[pi], list = cur();
  if (!inversions(list)) solved.add(pi);
  drawLadder(p);
  drawRow(p, list, true);
  const n = inversions(list);
  setReadout(phrase(p, list), statusText(list), n ? "no" : "ok", !n && L === "zh" ? p.zh : "");
  if (!n && solved.size === PUZZLES.length) fb3.textContent = P.t("allDone", { m: PUZZLES.length });
  pickBtns.forEach((b, i) => { b.setAttribute("aria-pressed", i === pi ? "true" : "false"); b.classList.toggle("solved", solved.has(i)); });
}
function setOrder(next, focusIdx, msgWord) {
  const before = inversions(cur());
  orders[pi] = next;
  sel = -1;
  render();
  const list = cur();
  if (msgWord) Play.live(liveEl, P.t("moved", { w: msgWord, i: focusIdx + 1, s: statusText(list) }));
  const el = rowEl.querySelector('[data-i="' + focusIdx + '"]');
  if (el) { el.focus(); if (inversions(list) > before) shake(el); }
}
function tapTile(i) {
  const w = orders[pi][i];
  if (sel < 0) { sel = i; render(); Play.live(liveEl, P.t("picked", { w })); }
  else if (sel === i) { sel = -1; render(); Play.live(liveEl, P.t("unpicked", { w })); }
  else { setOrder(swapItems(orders[pi], sel, i), i, orders[pi][sel]); return; }
  const el = rowEl.querySelector('[data-i="' + i + '"]'); if (el) el.focus();
}

// drag: pointer events on the tiles; a short press without movement counts as a tap
let drag = null;
rowEl.addEventListener("pointerdown", (e) => {
  const t = e.target.closest(".tile[data-i]");
  if (!t || step !== 1) return;
  const tiles = [...rowEl.querySelectorAll(".tile[data-i]")];
  drag = { el: t, i: +t.dataset.i, x: e.clientX, y: e.clientY, moved: false, target: -1,
    centers: tiles.map((el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }), tiles };
  t.setPointerCapture(e.pointerId);
});
rowEl.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true;
  drag.el.classList.add("drag");
  drag.el.style.transform = "translate(" + dx + "px," + dy + "px)";
  let best = drag.i, bd = Infinity;
  drag.centers.forEach((c, j) => { const d = Math.hypot(e.clientX - c.x, (e.clientY - c.y) * 1.6); if (d < bd) { bd = d; best = j; } });
  drag.target = best;
  drag.tiles.forEach((el, j) => el.classList.toggle("target", j === best && j !== drag.i));
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  d.el.style.transform = ""; d.el.classList.remove("drag");
  d.tiles.forEach((el) => el.classList.remove("target"));
  if (cancel) return;
  if (!d.moved) { tapTile(d.i); return; }
  if (d.target >= 0 && d.target !== d.i) setOrder(moveItem(orders[pi], d.i, d.target), d.target, orders[pi][d.i]);
  e.preventDefault();
}
rowEl.addEventListener("pointerup", (e) => endDrag(e, false));
rowEl.addEventListener("pointercancel", (e) => endDrag(e, true));
// keyboard: Enter/Space = tap (pointer events don't fire for keys), ←/→ = move
rowEl.addEventListener("click", (e) => { if (e.detail === 0 && step === 1) { const t = e.target.closest(".tile[data-i]"); if (t) tapTile(+t.dataset.i); } });
rowEl.addEventListener("keydown", (e) => {
  const t = e.target.closest(".tile[data-i]");
  if (!t || step !== 1) return;
  const i = +t.dataset.i;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const j = Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, orders[pi].length - 1);
    if (j !== i) setOrder(moveItem(orders[pi], i, j), j, orders[pi][i]);
  } else if (e.key === "Escape" && sel >= 0) { sel = -1; render(); const f = rowEl.querySelector('[data-i="' + i + '"]'); if (f) f.focus(); }
});
$("say").addEventListener("click", () => Play.speak(phrase(PUZZLES[pi], cur()), "en-US"));
$("again").addEventListener("click", () => { orders[pi] = PUZZLES[pi].start.slice(); sel = -1; fb3.textContent = ""; render(); });
$("next").addEventListener("click", () => {
  const order = PUZZLES.map((_, k) => (pi + 1 + k) % PUZZLES.length);
  pi = order.find((k) => !solved.has(k)) ?? (pi + 1) % PUZZLES.length;
  sel = -1; fb3.textContent = ""; render();
  const f = rowEl.querySelector(".tile[data-i]"); if (f) f.focus();
});

// ---- step 3 ----
let quizPick = -1;
function renderRule() {
  const vl = $("vlad"); vl.innerHTML = "";
  ladderWords().forEach((ws, c) => {
    const li = document.createElement("li"); li.className = "c" + c;
    const k = document.createElement("span"); k.className = "cat"; k.textContent = (c + 1) + " " + catName(c);
    const w = document.createElement("span"); w.className = "ws"; w.lang = "en"; w.textContent = ws.join(", ");
    li.append(k, w); vl.appendChild(li);
  });
  const tt = totals();
  const usualP = PUZZLES.map((p) => phrase(p, usual(p)));
  setReadout(usualP.join(" · "), P.t("ladT", { n: tt.n, a: tt.adj, b: tt.back, z: tt.after }), "ok", "", "allUsual");
  const ex = $("exc"); ex.innerHTML = "";
  ["e1", "e2", "e3", "e4"].forEach((k) => { const li = document.createElement("li"); li.innerHTML = P.t(k); ex.appendChild(li); });
}
const quizBox = $("quiz");
function buildQuiz() {
  quizBox.innerHTML = "";
  quizBox.className = "predict";
  const q = document.createElement("div"); q.className = "q"; q.textContent = P.t("quizQ");
  const row = document.createElement("div"); row.className = "choices";
  QUIZ.orders.forEach((o, i) => {
    const list = arrange(QUIZ, o), right = inversions(list) === 0;
    const b = document.createElement("button"); b.type = "button"; b.lang = "en"; b.textContent = phrase(QUIZ, list);
    if (quizPick === i) b.classList.add("on", right ? "right" : "wrong");
    b.addEventListener("click", () => {
      quizPick = i;
      Play.speak(phrase(QUIZ, list), "en-US");
      if (right) fb3.textContent = P.t("quizOk");
      else {
        const s = steps(list), j = s.indexOf(false), a = list[j], b2 = list[j + 1];
        fb3.textContent = P.t("quizNo", { w: a.w, k: catName(a.c), n: a.c + 1, w2: b2.w, k2: catName(b2.c), n2: b2.c + 1 });
      }
      buildQuiz();
      quizBox.querySelectorAll("button")[i].focus();
    });
    row.appendChild(b);
  });
  quizBox.append(q, row);
}

function render() {
  $("g1").hidden = step !== 0;
  pick.hidden = step !== 1;
  $("tools2").hidden = step !== 1;
  $("g3").hidden = step !== 2;
  quizBox.hidden = step !== 2;
  $("exc").hidden = step !== 2;
  const showRow = step === 1 || (step === 0 && guess >= 0);
  rowEl.hidden = !showRow;
  $("ladder").hidden = !showRow;
  readout.hidden = step === 0 && guess < 0;
  if (step === 0) renderGuess();
  else if (step === 1) renderEdit();
  else renderRule();
}

const OPTS = ["oRB", "oBR", "oAny"];
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: OPTS.map((k) => ({ label: P.t(k), right: k === "oBR" })),
  right: P.t("pBR"), wrong: "",
}, (i) => {
  guess = i;
  $("predict").querySelector(".fb").textContent = P.t(i === 1 ? "pBR" : OPTS[i] === "oRB" ? "pRB" : "pAny");
  render();
});
$("predict").querySelectorAll(".choices button").forEach((b, i) => { if (i < 2) b.lang = "en"; });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  fb3.textContent = "";
  sel = -1;
  if (i === 2) buildQuiz();
  render();
});
$("reset").addEventListener("click", () => {
  pi = 0; guess = -1; sel = -1; quizPick = -1;
  orders = PUZZLES.map((p) => p.start.slice()); solved = new Set();
  pr.reset(); fb3.textContent = ""; liveEl.textContent = ""; st.go(0);
});
})();
</script>
</body>
</html>

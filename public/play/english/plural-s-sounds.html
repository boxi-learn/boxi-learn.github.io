<style>
  .visual { padding: 14px 12px 12px; }
  .hearrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; font-size: 14px; }
  .score { color: var(--muted); font-variant-numeric: tabular-nums; }
  .insp { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 6px 10px; margin-bottom: 8px; min-height: 76px; }
  .insp svg { width: 92px; height: 64px; flex: none; }
  .insp .txt { font-size: 14px; color: var(--muted); min-width: 0; }

  .insp .ph { font-family: var(--math); color: var(--a); font-weight: 700; }
  .neck { fill: none; stroke: var(--muted); stroke-width: 2; }
  .buzz { fill: none; stroke: var(--a); stroke-width: 2.4; stroke-linecap: round; }
  .hiss { fill: none; stroke: var(--b); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 3 4; }
  .shake .buzz { animation: buzz .12s linear infinite alternate; }
  @keyframes buzz { to { transform: translateX(1.5px); } }
  .lbl { font-size: 13px; fill: var(--muted); }
  .bins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .bin { border: 2px dashed var(--line); border-radius: 12px; background: var(--soft); min-height: 140px; display: flex; flex-direction: column; transition: border-color .15s, background .15s; }
  .bin.ready { border-color: var(--a); }
  .bin.over { border-style: solid; border-color: var(--a); background: var(--surface); }
  .bin.bad { border-color: var(--no); border-style: solid; }
  .binhead { border: 0; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; background: transparent; padding: 6px 4px 4px; width: 100%; text-align: center; }
  .binhead .pat { display: block; font-family: var(--math); font-size: 24px; line-height: 1.15; color: var(--a); }
  .binhead .cnt { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .got { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-content: flex-start; }
  .got button { font-family: var(--serif); font-size: 15px; padding: 1px 7px; border-radius: 999px; }
  .m { color: var(--a); font-weight: 750; }
  .fb { font-size: 14px; min-height: 2.6em; margin: 8px 2px 6px; color: var(--muted); }
  .fb.ok { color: var(--a); }
  .fb.no { color: var(--no); }
  .deck { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px 0 2px; border-top: 1px solid var(--line); min-height: 56px; }
  .card { font-family: var(--serif); font-size: 20px; padding: 5px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.08); touch-action: none; user-select: none; -webkit-user-select: none; position: relative; line-height: 1.25; }
  .card .tg { display: block; font-family: var(--font); font-size: 13px; color: var(--muted); }
  .card .tg.buzz-t { color: var(--a); }
  .card .tg.hiss-t { color: var(--b); }
  .card.sel { border-color: var(--a); box-shadow: 0 0 0 3px var(--a); }
  .card.drag { z-index: 10; cursor: grabbing; box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: none; }
  .card.shk { animation: shk .35s; }
  @keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .card.shk, .shake .buzz { animation: none; } }
  .done { text-align: center; font-size: 14px; color: var(--muted); padding: 6px; }
  .ex1 { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .ex1 button, .more button { font-family: var(--serif); font-size: 16px; }
  table.counts { width: 100%; border-collapse: collapse; font-size: 14px; margin: 2px 0 10px; }
  table.counts th, table.counts td { border-bottom: 1px solid var(--line); padding: 4px 4px; text-align: left; vertical-align: top; }
  table.counts th { color: var(--muted); font-weight: 600; font-size: 13px; }
  table.counts td.p { font-family: var(--math); font-size: 18px; color: var(--a); white-space: nowrap; }
  table.counts td.n { color: var(--fg); }
  table.counts .w { display: block; white-space: normal; overflow-wrap: anywhere; font-family: var(--serif); color: var(--muted); font-size: 13px; }
  table.counts .snd { font-family: var(--math); }
  .rule { color: var(--fg) !important; font-weight: 600; }
  .more { display: grid; gap: 6px; margin: 4px 0 10px; }
  .more .row { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--muted); }
  .more button { min-width: 92px; flex: none; }
  .play .note { font-size: 14px !important; }
  .result .math { font-family: var(--math); white-space: normal; overflow-wrap: anywhere; }
  .foot { font-size: 13px; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .binhead .pat { font-size: 20px; }
    .card { font-size: 18px; padding: 4px 10px; }
    .got button { font-size: 14px; }
    .insp svg { width: 72px; height: 50px; }
  }
</style>

// ---- data: the bin comes from each word's final SOUND (looked up in ENDS), never from its spelling ----
// ENDS: final sound → [voiced, sibilant]
const ENDS = {
  p: [0, 0], t: [0, 0], k: [0, 0], f: [0, 0], "θ": [0, 0],
  b: [1, 0], d: [1, 0], g: [1, 0], v: [1, 0], "ð": [1, 0], m: [1, 0], n: [1, 0], "ŋ": [1, 0], l: [1, 0],
  "iː": [1, 0], "uː": [1, 0], "eɪ": [1, 0], "aɪ": [1, 0], "ɔɪ": [1, 0], "aʊ": [1, 0],
  s: [0, 1], z: [1, 1], "ʃ": [0, 1], "ʒ": [1, 1], "tʃ": [0, 1], "dʒ": [1, 1],
};
const VOWELS = ["iː", "uː", "eɪ", "aɪ", "ɔɪ", "aʊ"];
const KINDS = ["q", "b", "h"]; // quiet, buzzing, hissing
const ENDING = { q: "/s/", b: "/z/", h: "/ɪz/" };
function kindOf(e) {
  const x = ENDS[e];
  if (!x) return null;
  return x[1] ? "h" : x[0] ? "b" : "q";
}
// Regular plural spelling (no -y or -f words on this page).
function plural(w) { return /(s|x|z|sh|ch)$/.test(w) ? w + "es" : w + "s"; }
// e = final sound of the base word, same in General American and Standard Southern British.
const WORDS = [
  { w: "cat", e: "t" }, { w: "cup", e: "p" }, { w: "book", e: "k" }, { w: "cake", e: "k" }, { w: "kite", e: "t" }, { w: "giraffe", e: "f" },
  { w: "dog", e: "g" }, { w: "bed", e: "d" }, { w: "bee", e: "iː" }, { w: "ball", e: "l" }, { w: "phone", e: "n" }, { w: "cave", e: "v" },
  { w: "bus", e: "s" }, { w: "box", e: "s" }, { w: "dish", e: "ʃ" }, { w: "watch", e: "tʃ" }, { w: "judge", e: "dʒ" }, { w: "rose", e: "z" },
];
const MORE = [
  { w: "eat", f: "eats", e: "t", t: "verb" }, { w: "run", f: "runs", e: "n", t: "verb" }, { w: "watch", f: "watches", e: "tʃ", t: "verb" },
  { w: "Mark", f: "Mark's", e: "k", t: "poss" }, { w: "Tom", f: "Tom's", e: "m", t: "poss" }, { w: "Liz", f: "Liz's", e: "z", t: "poss" },
];
const binOf = (x) => KINDS.indexOf(kindOf(x.e));
function tally(list) {
  const c = { q: 0, b: 0, h: 0, m: list.length };
  list.forEach((x) => { const k = kindOf(x.e); if (k) c[k]++; });
  return c;
}
// Where the added ending starts in the plural spelling (for highlighting).
const endStart = (w) => w.length;
if (typeof module !== "undefined") module.exports = { VOWELS, ENDS, WORDS, MORE, kindOf, plural, binOf, tally, ENDING };

// ---- state ----
const $ = (id) => document.getElementById(id);
let state, sel = null;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh() { state = { deck: shuffle(WORDS.map((x) => x.w)), placed: {}, first: 0, missed: new Set() }; sel = null; }
const byW = (w) => WORDS.find((x) => x.w === w);
const sayPair = (w) => Play.speak(w + ". " + plural(w) + ".", "en-US");
const kName = (k) => P.t("k" + k);

function marked(w) {
  const pl = plural(w), frag = document.createDocumentFragment();
  frag.appendChild(document.createTextNode(pl.slice(0, endStart(w))));
  const s = document.createElement("span"); s.className = "m"; s.textContent = pl.slice(endStart(w)); frag.appendChild(s);
  return frag;
}

// ---- throat inspector ----
function drawNeck(k) {
  const g = $("neck");
  g.innerHTML = "";
  g.classList.toggle("shake", k === "b" && !Play.reduced);
  Play.svg("path", { class: "neck", d: "M30 4 Q20 4 20 16 L20 60 M62 4 Q72 4 72 16 L72 60" }, g);
  Play.svg("circle", { cx: 46, cy: 34, r: 5, fill: "none", stroke: "var(--muted)", "stroke-width": 1.5 }, g);
  if (k === "b") {
    [10, 82].forEach((x) => Play.svg("path", { class: "buzz", d: "M" + x + " 20 l-4 5 l4 5 l-4 5 l4 5 l-4 5" }, g));
    Play.svg("path", { class: "buzz", d: "M38 34 l3 -4 l3 8 l3 -8 l3 8 l3 -4" }, g);
  } else if (k === "h") {
    Play.svg("path", { class: "hiss", d: "M46 4 Q56 10 46 16 Q36 22 46 28" }, g);
  }
  const lab = Play.svg("text", { class: "lbl", x: 46, y: 62, "text-anchor": "middle" }, g);
  lab.textContent = k ? P.t(k === "b" ? "neckB" : k === "h" ? "neckH" : "neckQ") : "";
}
function inspect(w) {
  const box = $("inspTxt");
  box.innerHTML = "";
  if (!w) { box.textContent = P.t("inspNone"); drawNeck(null); return; }
  const x = byW(w), k = kindOf(x.e);
  const parts = P.t("insp", { w: "\u0001", l: "\u0002", e: "\u0003", k: kName(k) }).split(/([\u0001-\u0003])/);
  parts.forEach((p) => {
    if (p === "\u0001") { const b = document.createElement("b"); b.lang = "en"; b.textContent = w; box.appendChild(b); }
    else if (p === "\u0002") { const b = document.createElement("b"); b.lang = "en"; b.textContent = w.slice(-1); box.appendChild(b); }
    else if (p === "\u0003") { const s = document.createElement("span"); s.className = "ph"; s.textContent = "/" + x.e + "/"; box.appendChild(s); }
    else box.appendChild(document.createTextNode(p));
  });
  drawNeck(k);
}

// ---- bins ----
const binEls = KINDS.map((k, i) => {
  const bin = document.createElement("div");
  bin.className = "bin"; bin.dataset.k = i;
  const head = document.createElement("button");
  head.type = "button"; head.className = "binhead";
  head.innerHTML = '<span class="pat"></span><span class="cnt"></span>';
  head.querySelector(".pat").textContent = (i + 1) + " · " + ENDING[k];
  head.addEventListener("click", () => {
    if (!sel) { setFb(P.t("pickFirst"), ""); return; }
    place(sel, i, false);
  });
  const got = document.createElement("div"); got.className = "got"; got.lang = "en";
  bin.append(head, got);
  $("bins").appendChild(bin);
  return { bin, head, got };
});

// ---- cards (tap, drag, keyboard) ----
let drag = null, suppressClick = false;
function cardEl(w) {
  const c = document.createElement("button");
  c.type = "button"; c.className = "card"; c.dataset.w = w;
  c.textContent = plural(w);
  if ($("throat").checked) {
    const k = kindOf(byW(w).e), tg = document.createElement("span");
    tg.className = "tg" + (k === "b" ? " buzz-t" : k === "h" ? " hiss-t" : "");
    tg.lang = P.lang === "zh" ? "zh-CN" : "en";
    tg.textContent = (k === "b" ? "≋ " : k === "h" ? "~ " : "· ") + P.t("t" + k);
    c.appendChild(tg);
  }
  c.setAttribute("aria-pressed", "false");
  c.setAttribute("aria-label", P.t("cardAria", { w: plural(w) }));
  c.addEventListener("click", () => { if (suppressClick) { suppressClick = false; return; } pick(w); });
  c.addEventListener("keydown", (e) => {
    const k = ["1", "2", "3"].indexOf(e.key);
    if (k >= 0) { place(w, k, true); e.preventDefault(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const cs = [...$("deck").querySelectorAll(".card")], i = cs.indexOf(c);
      cs[Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, cs.length - 1)].focus(); e.preventDefault();
    }
    if (e.key === "Escape") { sel = null; markSel(); inspect(null); }
  });
  c.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { c, w, x: e.clientX, y: e.clientY, on: false };
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  c.addEventListener("pointermove", (e) => {
    if (!drag || drag.c !== c) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.hypot(dx, dy) > 8) { drag.on = true; c.classList.add("drag"); inspect(w); }
    if (!drag.on) return;
    c.style.transform = "translate(" + dx + "px," + dy + "px)";
    const k = binAt(e.clientX, e.clientY);
    binEls.forEach((b, i) => b.bin.classList.toggle("over", i === k));
  });
  const end = (e, cancel) => {
    if (!drag || drag.c !== c) return;
    const d = drag; drag = null;
    if (!d.on) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    c.classList.remove("drag"); c.style.transform = "";
    binEls.forEach((b) => b.bin.classList.remove("over"));
    const k = cancel ? -1 : binAt(e.clientX, e.clientY);
    if (k >= 0) place(d.w, k, false);
  };
  c.addEventListener("pointerup", (e) => end(e, false));
  c.addEventListener("pointercancel", (e) => end(e, true));
  return c;
}
function binAt(x, y) {
  const els = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
  for (const el of els) { const b = el.closest && el.closest(".bin"); if (b) return +b.dataset.k; }
  return -1;
}
function pick(w) { sel = w; sayPair(w); markSel(); inspect(w); setFb(P.t("pick", { w: plural(w) }), ""); }
const countIn = (k) => Object.values(state.placed).filter((x) => x === k).length;
const inBin = (k) => WORDS.filter((x) => binOf(x) === k).length;
function markSel() {
  $("deck").querySelectorAll(".card").forEach((c) => {
    const on = c.dataset.w === sel;
    c.classList.toggle("sel", on); c.setAttribute("aria-pressed", on ? "true" : "false");
  });
  binEls.forEach((b, k) => {
    b.bin.classList.toggle("ready", !!sel);
    const p = ENDING[KINDS[k]];
    b.head.setAttribute("aria-label", sel ? P.t("binPut", { w: plural(sel), p }) : P.t("binAria", { p, n: countIn(k), m: inBin(k) }));
  });
}
function place(w, k, fromKey) {
  const x = byW(w);
  if (!x || !state.deck.includes(w) || k < 0 || k >= KINDS.length) return;
  const rk = kindOf(x.e), right = binOf(x);
  const vars = { w, pl: plural(w), e: "/" + x.e + "/", k: kName(rk), p: ENDING[rk], b: ENDING[KINDS[k]] };
  inspect(w);
  if (right === k) {
    const i = state.deck.indexOf(w);
    state.deck.splice(i, 1);
    state.placed[w] = k;
    if (!state.missed.has(w)) state.first++;
    sel = null;
    Play.speak(plural(w), "en-US");
    setFb(P.t("okMsg", vars), "ok");
    draw();
    if (fromKey) {
      const cs = $("deck").querySelectorAll(".card");
      if (cs.length) cs[Math.min(i, cs.length - 1)].focus(); else binEls[k].head.focus();
    }
  } else {
    state.missed.add(w);
    sel = null;
    setFb(P.t("noMsg", vars), "no");
    const b = binEls[k].bin;
    b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 600);
    const c = $("deck").querySelector('.card[data-w="' + w + '"]');
    if (c && !Play.reduced) { c.classList.remove("shk"); void c.offsetWidth; c.classList.add("shk"); }
    sayPair(w);
    markSel(); score();
  }
}
function setFb(text, cls) { const f = $("fb"); f.textContent = text; f.className = "fb" + (cls ? " " + cls : ""); }
function score() {
  const n = Object.keys(state.placed).length, m = WORDS.length;
  $("score").textContent = P.t("score", { n, m, f: state.first });
  Play.live($("live"), P.t("liveS", { n, m }));
}

// ---- step 3: table + more examples (all computed from ENDS) ----
function drawRule() {
  const c = tally(WORDS), tb = $("counts");
  tb.innerHTML = "";
  const hr = tb.insertRow();
  [P.t("thK"), P.t("thS"), P.t("thE"), P.t("thW")].forEach((h) => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  KINDS.forEach((k) => {
    const r = tb.insertRow();
    r.insertCell().textContent = kName(k);
    const s = r.insertCell(); s.className = "snd"; s.textContent = Object.keys(ENDS).filter((e) => kindOf(e) === k && !VOWELS.includes(e)).join(" ") + (k === "b" ? " + " + P.t("vowels") : "");
    const p = r.insertCell(); p.className = "p"; p.textContent = ENDING[k];
    const n = r.insertCell(); n.className = "n"; n.textContent = c[k] + " / " + c.m;
    const sp = document.createElement("span"); sp.className = "w"; sp.lang = "en";
    sp.textContent = WORDS.filter((x) => kindOf(x.e) === k).map((x) => plural(x.w)).join(" · ");
    n.appendChild(sp);
  });
  $("rule").textContent = P.t("rule", c);
  $("resultMain").textContent = P.t("resMain", c);
  $("resultTitle").textContent = P.t("resultTitle", c);
  $("resultNote").textContent = P.t("resNote", c);
}
MORE.forEach((x) => {
  const k = kindOf(x.e), txt = P.t(x.t === "verb" ? "verb" : "poss", { f: x.f });
  const row = document.createElement("div"); row.className = "row";
  const b = document.createElement("button"); b.type = "button"; b.textContent = txt; b.lang = "en";
  b.addEventListener("click", () => Play.speak(txt + ".", "en-US"));
  const sp = document.createElement("span"); sp.textContent = P.t("moreRow", { w: x.w, e: "/" + x.e + "/", k: kName(k), p: ENDING[k] });
  row.append(b, sp); $("more").appendChild(row);
});

// ---- draw ----
function draw() {
  binEls.forEach((b, k) => {
    b.got.innerHTML = "";
    WORDS.filter((x) => state.placed[x.w] === k).forEach((x) => {
      const c = document.createElement("button"); c.type = "button";
      c.appendChild(marked(x.w));
      c.setAttribute("aria-label", plural(x.w));
      c.addEventListener("click", () => { sayPair(x.w); inspect(x.w); });
      b.got.appendChild(c);
    });
    b.head.querySelector(".cnt").textContent = countIn(k) + " / " + inBin(k);
  });
  const deck = $("deck");
  deck.innerHTML = "";
  state.deck.forEach((w) => deck.appendChild(cardEl(w)));
  if (!state.deck.length) {
    const d = document.createElement("div"); d.className = "done"; d.textContent = P.t("doneDeck"); deck.appendChild(d);
    if (!$("fb").textContent || $("fb").classList.contains("ok")) setFb(P.t("done", { m: WORDS.length, f: state.first }), "ok");
  }
  markSel(); score();
}
$("throat").addEventListener("change", () => { draw(); if (sel) markSel(); });

// ---- steps ----
["cats", "dogs"].forEach((w) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = "▶ " + w;
  b.addEventListener("click", () => { Play.speak(w, "en-US"); inspect(w.slice(0, -1)); });
  $("ex1").appendChild(b);
});
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => Play.speak("cats. dogs.", "en-US"));
const stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ex1").hidden = i !== 0;
  $("ruleBox").hidden = i !== 2;
});
$("reset").addEventListener("click", () => {
  if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  $("throat").checked = false;
  fresh(); setFb("", ""); pr.reset(); stp.go(0); inspect(null); draw();
});
fresh();
inspect(null);
drawRule();
draw();
</script>
</body>

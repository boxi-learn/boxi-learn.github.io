<style>

  .result .math { white-space: normal; font-size: 20px; }
  table.cmp { border-collapse: collapse; width: 100%; font-size: 14px; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  table.cmp th, table.cmp td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.cmp th { color: var(--muted); font-weight: 600; }
  table.cmp thead th { color: var(--fg); }
  .types { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .types button.right { background: var(--a); border-color: var(--a); color: var(--surface); }
  .types button.wrong { background: var(--no); border-color: var(--no); color: var(--surface); }
  .gfb { font-size: 14px; min-height: 1.4em; margin: 0 0 8px; }
  .gfb strong { color: var(--fg); }
  .grow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .key { display: grid; gap: 6px; margin: 4px 0 10px; }
  .key > div { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .key > div.hit { border-color: var(--a); box-shadow: inset 4px 0 0 var(--a); }
  .key b { color: var(--fg); }
  .key span { color: var(--muted); display: block; }
  .legend .sw { display: inline-block; width: 12px; height: 10px; margin-right: 5px; vertical-align: 0; border-radius: 2px; }
  @container (max-width: 640px) {
    .panes { grid-template-columns: 1fr; }
    .pane { max-width: 440px; margin: 0 auto; width: 100%; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }

};
const ORDER = ["bj", "li", "sf", "sg", "ca", "mo"];
const NAMEK = { bj: "cBj", li: "cLi", sf: "cSf", sg: "cSg", ca: "cCa", mo: "cMo" };
const TYPES = ["med", "mon", "des", "equ", "con"];
const TYK = { med: "tyMed", mon: "tyMon", des: "tyDes", equ: "tyEqu", con: "tyCon", none: "tyNone" };
const GAME = ["ca", "sg", "li", "mo", "bj", "sf"];

/* ---------- pure logic ---------- */
const sum = (a) => a.reduce((s, x) => s + x, 0);
function features(c) {
  const north = c.lat >= 0;
  const summer = north ? [5, 6, 7] : [11, 0, 1], winter = north ? [11, 0, 1] : [5, 6, 7];
  const minT = Math.min(...c.T), maxT = Math.max(...c.T);
  let wet = 0, dry = 0;
  c.R.forEach((r, i) => { if (r > c.R[wet]) wet = i; if (r < c.R[dry]) dry = i; });
  const s = sum(summer.map((i) => c.R[i])), w = sum(winter.map((i) => c.R[i]));
  return { tot: sum(c.R), minT, maxT, range: maxT - minT, wet, dry, s, w, mean: sum(c.T) / 12 };
}
function classify(f) {
  if (f.tot < 250) return { type: "des", why: "rDes" };
  if (f.minT >= 18 && f.tot >= 1500) return { type: "equ", why: "rEqu" };
  if (f.w >= 3 * f.s && f.minT > 0) return { type: "med", why: "rMed" };
  if (f.s >= 10 * Math.max(f.w, 1)) return { type: "mon", why: "rMon" };
  if (f.minT < 0) return { type: "con", why: "rCon" };
  return { type: "none", why: "rNone" };
}

const $ = (id) => document.getElementById(id);
const MONTHS = P.t("months").split(","), INI = P.t("ini").split(",");
const S = { step: 0, a: "bj", b: "li", m: 6, revealed: false };
const G = { i: 0, pick: null, right: 0, asked: 0 };
const latStr = (v) => P.t("deg", { v: Play.fmt(Math.abs(v), 1), h: P.lang === "zh" ? (v >= 0 ? "北" : "南") : v >= 0 ? "N" : "S" });
const typeName = (k) => P.t(TYK[k]);
const cname = (id) => P.t(NAMEK[id]);

/* ---------- chart ---------- */
const CH = { l: 38, r: 282, t: 48, b: 200, tMin: -10, tMax: 30, rMax: 400 };
const bw = (CH.r - CH.l) / 12;
const xM = (i) => CH.l + bw * (i + 0.5);
const yT = (t) => CH.b - (CH.b - CH.t) * (Play.clamp(t, CH.tMin, CH.tMax) - CH.tMin) / (CH.tMax - CH.tMin);
const yR = (r) => CH.b - (CH.b - CH.t) * Play.clamp(r, 0, CH.rMax) / CH.rMax;
function txt(parent, x, y, s, cls, anchor) {
  const t = Play.svg("text", { x, y, class: cls || "lb", "text-anchor": anchor || "start" }, parent);
  t.textContent = s;
  return t;
}
function drawChart(svg, id, mode) { // mode: "show" | "hidden" | "mystery"
  svg.innerHTML = "";
  const c = CITIES[id];
  txt(svg, 160, 18, mode === "mystery" ? P.t("mystery") : mode === "hidden" ? "?" : cname(id) + " · " + latStr(c.lat), "ttl", "middle");
  for (let k = 0; k <= 8; k++) {
    const y = CH.b - (CH.b - CH.t) * k / 8;
    Play.svg("line", { x1: CH.l, x2: CH.r, y1: y, y2: y, stroke: "var(--line)", "stroke-width": k === 2 ? 1.6 : 1 }, svg);
    if (k % 2 === 0) {
      txt(svg, CH.l - 5, y + 4, String(CH.tMin + 5 * k), "lb", "end");
      txt(svg, CH.r + 5, y + 4, String(50 * k), "lb");
    }
  }
  txt(svg, CH.l - 5, CH.t - 10, "°C", "lb", "end");
  txt(svg, CH.r + 5, CH.t - 10, "mm", "lb");
  for (let i = 0; i < 12; i++) txt(svg, xM(i), CH.b + 16, INI[i], "lb", "middle");
  if (mode === "hidden") {
    txt(svg, 160, (CH.t + CH.b) / 2 + 5, P.t("hidden"), "lbf halo", "middle");
    svg.setAttribute("aria-valuetext", P.t("hidden"));
    return;
  }
  Play.svg("rect", { x: CH.l + bw * S.m, y: CH.t, width: bw, height: CH.b - CH.t, fill: "var(--hl)", opacity: 0.22 }, svg);
  c.R.forEach((r, i) => {
    const y = yR(r);
    Play.svg("rect", { x: xM(i) - bw * 0.36, y, width: bw * 0.72, height: Math.max(0, CH.b - y), fill: "var(--c)", opacity: 0.75 }, svg);
  });
  let d = "";
  c.T.forEach((t, i) => (d += (i ? "L" : "M") + xM(i).toFixed(1) + " " + yT(t).toFixed(1)));
  Play.svg("path", { d, fill: "none", stroke: "var(--no)", "stroke-width": 2.5, "stroke-linejoin": "round" }, svg);
  c.T.forEach((t, i) => Play.svg("circle", { cx: xM(i), cy: yT(t), r: i === S.m ? 4.5 : 2.5, fill: "var(--no)", stroke: "var(--surface)", "stroke-width": 1 }, svg));
  const read = P.t("readM", { m: MONTHS[S.m], t: c.T[S.m], r: c.R[S.m] });
  txt(svg, 160, 36, read, "lbf", "middle");
  svg.setAttribute("aria-valuemin", 1); svg.setAttribute("aria-valuemax", 12);
  svg.setAttribute("aria-valuenow", S.m + 1); svg.setAttribute("aria-valuetext", read);
}

/* ---------- side panel ---------- */
function cmpTable(ids, showType) {
  const fs = ids.map((id) => features(CITIES[id]));
  const rows = [
    ["rowTot", (f) => P.t("vMm", { v: f.tot })],
    ["rowRange", (f) => P.t("vC", { v: f.range })],
    ["rowMinMax", (f) => P.t("vMinMax", { a: f.minT, b: f.maxT })],
    ["rowSeason", (f) => P.t("vSeason", { s: f.s, w: f.w })],
    ["rowWet", (f) => P.t("vMonth", { m: MONTHS[f.wet], v: CITIES[ids[fs.indexOf(f)]].R[f.wet] })],
    ["rowDry", (f) => P.t("vMonth", { m: MONTHS[f.dry], v: CITIES[ids[fs.indexOf(f)]].R[f.dry] })],
  ];
  if (showType) rows.push(["rowType", (f) => "<b>" + typeName(classify(f).type) + "</b>"]);
  const tb = $("cmp");
  let h = "<thead><tr><th></th>" + ids.map((id, j) => "<th>" + (S.step === 1 && !G.pick ? P.t("mystery") : cname(id)) + "</th>").join("") + "</tr></thead><tbody>";
  rows.forEach(([k, fn]) => (h += "<tr><th scope=\"row\">" + P.t(k) + "</th>" + fs.map((f) => "<td>" + fn(f) + "</td>").join("") + "</tr>"));
  tb.innerHTML = h + "</tbody>";
}
function reason(f) {
  const c = classify(f);
  return P.t(c.why, { tot: f.tot, min: f.minT, rg: f.range, s: f.s, w: f.w, x: Play.fmt(f.s / Math.max(f.w, 1), 0) });
}
function drawKey(hits) {
  const box = $("key");
  box.innerHTML = "";
  [["med", "keyMed"], ["mon", "keyMon"], ["des", "keyDes"], ["equ", "keyEqu"], ["con", "keyCon"]].forEach(([ty, k]) => {
    const d = document.createElement("div");
    if (hits.includes(ty)) d.className = "hit";
    const b = document.createElement("b"); b.textContent = P.t(k);
    const r = document.createElement("span"); r.textContent = P.t(k + "R");
    const g = document.createElement("span"); g.textContent = P.t(k + "G");
    d.append(b, r, g);
    box.appendChild(d);
  });
}

/* ---------- game ---------- */
const typeBtns = TYPES.map((ty) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = typeName(ty);
  b.addEventListener("click", () => {
    if (G.pick) return;
    G.pick = ty; G.asked++;
    const f = features(CITIES[GAME[G.i]]), ans = classify(f).type;
    if (ty === ans) G.right++;
    render();
  });
  $("gTypes").appendChild(b);
  return b;
});
$("gNext").addEventListener("click", () => {
  if (G.i === GAME.length - 1) Object.assign(G, { i: 0, pick: null, right: 0, asked: 0 });
  else { G.i++; G.pick = null; }
  render();
  typeBtns[0].focus();
});
function renderGame() {
  const id = GAME[G.i], f = features(CITIES[id]), ans = classify(f).type;
  $("gProg").textContent = P.t("gProg", { i: G.i + 1, n: GAME.length });
  $("gScore").textContent = P.t("gScore", { r: G.right, a: G.asked });
  typeBtns.forEach((b, j) => {
    const ty = TYPES[j];
    b.classList.toggle("right", !!G.pick && ty === ans);
    b.classList.toggle("wrong", !!G.pick && ty === G.pick && ty !== ans);
    b.setAttribute("aria-pressed", G.pick === ty ? "true" : "false");
  });
  $("gFb").textContent = G.pick ? (G.pick === ans ? P.t("gRight", { city: cname(id) }) : P.t("gWrong", { city: cname(id), type: typeName(ans) })) + reason(f) : "";
  $("gNext").hidden = !G.pick;
  $("gNext").textContent = G.i === GAME.length - 1 ? P.t("gAgain") : P.t("gNext");
}

/* ---------- city pickers ---------- */
function pickers(box, slot) {
  return ORDER.map((id) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small"; b.textContent = cname(id);
    b.addEventListener("click", () => { S[slot] = id; render(); });
    box.appendChild(b);
    return b;
  });
}
const pkA = pickers($("pickA"), "a"), pkB = pickers($("pickB"), "b");

/* ---------- render ---------- */
function render() {
  const game = S.step === 1, hide = S.step === 0 && !S.revealed;
  $("panes").classList.toggle("one", game);
  $("paneB").hidden = game;
  $("pickA").hidden = game || hide;
  $("pickB").hidden = hide;
  pkA.forEach((b, j) => { b.classList.toggle("on", ORDER[j] === S.a); b.setAttribute("aria-pressed", ORDER[j] === S.a ? "true" : "false"); });
  pkB.forEach((b, j) => { b.classList.toggle("on", ORDER[j] === S.b); b.setAttribute("aria-pressed", ORDER[j] === S.b ? "true" : "false"); });
  const aId = game ? GAME[G.i] : S.a;
  drawChart($("chA"), aId, hide ? "hidden" : game && !G.pick ? "mystery" : "show");
  if (!game) drawChart($("chB"), S.b, hide ? "hidden" : "show");
  $("game").hidden = !game;
  if (game) renderGame();
  $("stepBody").textContent = S.step === 0 ? P.t(S.revealed ? "b1after" : "b1")
    : S.step === 1 ? P.t("b2")
    : P.t("b3", { sfJ: CITIES.sf.T[6], liJ: CITIES.li.T[6] });
  $("cmp").hidden = hide;
  if (!hide) cmpTable(game ? [aId] : [S.a, S.b], S.step === 2 || (game && !!G.pick));
  $("key").hidden = $("why").hidden = S.step !== 2;
  if (S.step === 2) $("why").innerHTML = [S.a, S.b].filter((id, j, a) => a.indexOf(id) === j)
    .map((id) => "<strong>" + cname(id) + "</strong>" + (P.lang === "zh" ? "：" : ": ") + reason(features(CITIES[id]))).join("<br>");
  if (S.step === 2) drawKey([S.a, S.b].map((id) => classify(features(CITIES[id])).type));
  const live = hide ? "" : (game ? [aId] : [S.a, S.b]).map((id) =>
    P.t("liveRead", { city: game && !G.pick ? P.t("mystery") : cname(id), m: MONTHS[S.m], t: CITIES[id].T[S.m], r: CITIES[id].R[S.m] })).join(" ");
  Play.live($("live"), live);
}
function resultNote() {
  const bj = features(CITIES.bj), li = features(CITIES.li);
  $("resultNote").textContent = P.t("resultNote", {
    bjT: bj.tot, liT: li.tot, bjP: Play.fmt(100 * bj.s / bj.tot, 0), liP: Play.fmt(100 * li.s / li.tot, 0),
  });
}

/* ---------- month reading: drag / click / keys ---------- */
[$("chA"), $("chB")].forEach((svg) => {
  let drag = false;
  const at = (e) => {
    const p = Play.pointer(svg, e);
    const m = Play.clamp(Math.floor((p.x - CH.l) / bw), 0, 11);
    if (m !== S.m) { S.m = m; render(); }
  };
  svg.addEventListener("pointerdown", (e) => { drag = true; svg.setPointerCapture(e.pointerId); at(e); });
  svg.addEventListener("pointermove", (e) => { if (drag) at(e); });
  svg.addEventListener("pointerup", () => (drag = false));
  svg.addEventListener("pointercancel", () => (drag = false));
  svg.addEventListener("keydown", (e) => {
    const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    let m = S.m;
    if (step) m = (S.m + step + 12) % 12;
    else if (e.key === "Home") m = 0;
    else if (e.key === "End") m = 11;
    else return;
    e.preventDefault();
    S.m = m; render();
  });
});

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
}, () => { S.revealed = true; render(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  S.step = i;
  if (i > 0) S.revealed = true;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  Object.assign(S, { a: "bj", b: "li", m: 6, revealed: false });
  Object.assign(G, { i: 0, pick: null, right: 0, asked: 0 });
  pr.reset(); st.go(0);
});
resultNote();
render();
</script>
</body>
</html>

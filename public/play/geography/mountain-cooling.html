/* ---------- constants ---------- */
const LAPSE = 6.5, DRY = 9.8;          // °C per km
const SUN_D = 149600000;               // km, mean Earth–Sun distance
const SUN_PERI = 147100000, SUN_APH = 152100000;
const ORBIT_SWING = SUN_APH - SUN_PERI; // km per year
const TF = 8, TM = 3;                  // schematic belt limits (°C): forest > 8, meadow 3–8, rock 0–3, snow ≤ 0
const MTS = {
  gen: { H: 3, T0: 25, k: "mGen" },
  ev: { H: 8.849, T0: 25, k: "mEv" },
  ki: { H: 5.895, T0: 27, k: "mKi" },
  ts: { H: 1.545, T0: 14, k: "mTs" },
};
const ORDER = ["gen", "ev", "ki", "ts"];

/* ---------- pure logic ---------- */
const tempAt = (t0, h, r) => t0 - r * h;
const heightOf = (t0, t, r) => (t0 - t) / r;            // height (km) where the air is t °C
function belt(t) { return t <= 0 ? "snow" : t < TM ? "rock" : t < TF ? "meadow" : "forest"; }
function snowLine(t0, r) { return t0 <= 0 ? 0 : heightOf(t0, 0, r); }
function sunPct(h) { return (h / SUN_D) * 100; }
function sunIntensityPct(h) { const q = SUN_D / (SUN_D - h); return (q * q - 1) * 100; }
function sig(x, n) {                                      // decimal string with n significant digits
  if (!Number.isFinite(x)) return "—";
  if (x === 0) return "0";
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x))));
  return x.toFixed(Math.min(d, 20));
}
function round2sig(x) { if (!(x > 0)) return 0; const p = Math.pow(10, Math.floor(Math.log10(x)) - 1); return Math.round(x / p) * p; }

/* ---------- formatting ---------- */
const $ = (id) => document.getElementById(id);
const neg = (s) => s.replace(/^-/, "−");
function fT(t) { const s = Play.fmt(t, 1); return neg(s === "-0.0" ? "0.0" : s); }
function group(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function fM(km) { const m = Math.round(km * 1000); return P.lang === "zh" ? String(m) : group(m); }
function fBig(n) {
  if (P.lang !== "zh") return group(n);
  if (n >= 1e8) return String(Number(sig(n / 1e8, 3))) + "亿";
  if (n >= 1e4) return String(Number(sig(n / 1e4, 2))) + "万";
  return String(Math.round(n));
}
const fM10 = (km) => fM(Math.round(km * 100) / 100);  // snow-line heights: nearest 10 m
const beltName = (b) => P.t({ forest: "bForest", meadow: "bMeadow", rock: "bRock", snow: "bSnow" }[b]);
const mtName = (id) => P.t(MTS[id].k, { H: fM(MTS[id].H) });

/* ---------- state ---------- */
const S = { step: 0, mt: "gen", H: 3, t0: 25, h: 0, rate: LAPSE, revealed: false };

/* ---------- geometry ---------- */
const BASE = 300, PX = 28, HMAX = 9.3;          // y of sea level, px per km
const XL = 50, XP = 175, XR = 290;             // mountain foot, peak, foot
const TX0 = 306, TX1 = 392, TMIN = -70, TMAX = 40;
const yH = (h) => BASE - h * PX;
const xT = (t) => TX0 + (TX1 - TX0) * (Play.clamp(t, TMIN, TMAX) - TMIN) / (TMAX - TMIN);
const LEFT = [[0, 0], [0.2, 0.12], [0.35, 0.3], [0.5, 0.42], [0.62, 0.6], [0.78, 0.74], [0.9, 0.9], [1, 1]];
const RIGHT = [[0, 1], [0.12, 0.86], [0.3, 0.7], [0.45, 0.62], [0.6, 0.4], [0.8, 0.22], [1, 0]];
function profile(H) {
  const pts = LEFT.map(([fx, fy]) => [XL + fx * (XP - XL), yH(fy * H)]);
  RIGHT.slice(1).forEach(([fx, fy]) => pts.push([XP + fx * (XR - XP), yH(fy * H)]));
  return pts;
}
function climberX(h, H) {                       // x on the left slope at height h
  const f = H > 0 ? Play.clamp(h / H, 0, 1) : 0;
  for (let i = 1; i < LEFT.length; i++) {
    const [x0, y0] = LEFT[i - 1], [x1, y1] = LEFT[i];
    if (f <= y1) { const u = y1 > y0 ? (f - y0) / (y1 - y0) : 0; return XL + (x0 + u * (x1 - x0)) * (XP - XL); }
  }
  return XP;
}

/* ---------- drawing ---------- */
const fig = $("fig");
function txt(x, y, s, cls, anchor, parent) {
  const t = Play.svg("text", { x, y, class: cls || "lb", "text-anchor": anchor || "start" }, parent || fig);
  t.textContent = s;
  return t;
}
function draw() {
  fig.innerHTML = "";
  const show = S.revealed, H = S.H, r = S.rate;
  const pts = profile(H);
  const poly = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const defs = Play.svg("defs", {}, fig);
  const cp = Play.svg("clipPath", { id: "mclip" }, defs);
  Play.svg("polygon", { points: poly }, cp);
  const cg = Play.svg("clipPath", { id: "tclip" }, defs);
  Play.svg("rect", { x: TX0, y: yH(HMAX), width: TX1 - TX0, height: BASE - yH(HMAX) }, cg);

  // sun hint
  Play.svg("circle", { cx: 60, cy: 17, r: 9, fill: "var(--hl)" }, fig);
  txt(76, 22, P.t("sunLabel"), "lb");

  // height axis
  for (let k = 0; k <= 9; k++) {
    const y = yH(k);
    Play.svg("line", { x1: 40, x2: XR, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 1 }, fig);
    if (k % 3 === 0) txt(34, y + 5, String(k), "lb", "end");
  }
  txt(34, yH(HMAX) - 4, "km", "lb", "end");

  // mountain
  Play.svg("polygon", { points: poly, fill: "var(--soft)" }, fig);
  if (show) {
    const g = Play.svg("g", { "clip-path": "url(#mclip)" }, fig);
    const bands = [
      [0, heightOf(S.t0, TF, r), "var(--a)", 0.6],
      [heightOf(S.t0, TF, r), heightOf(S.t0, TM, r), "var(--hl)", 0.7],
      [heightOf(S.t0, TM, r), heightOf(S.t0, 0, r), "var(--muted)", 0.55],
      [heightOf(S.t0, 0, r), HMAX, "var(--on-panel)", 1],
    ];
    bands.forEach(([a, b, fill, op]) => {
      const lo = Play.clamp(a, 0, HMAX), hi = Play.clamp(b, 0, HMAX);
      if (hi > lo) Play.svg("rect", { x: XL, y: yH(hi), width: XR - XL, height: (hi - lo) * PX, fill, opacity: op }, g);
    });
  }
  Play.svg("polygon", { points: poly, fill: "none", stroke: "var(--fg)", "stroke-width": 1.6, "stroke-linejoin": "round" }, fig);
  Play.svg("line", { x1: 40, x2: TX1, y1: BASE, y2: BASE, stroke: "var(--c)", "stroke-width": 2 }, fig);

  // snow line
  const hs = snowLine(S.t0, r);
  if (show && hs <= HMAX) {
    const y = yH(hs);
    Play.svg("line", { x1: XL - 8, x2: TX1, y1: y, y2: y, stroke: "var(--c)", "stroke-width": 1.8, "stroke-dasharray": "6 4" }, fig);
    const ly = hs > H - 0.2 && hs < H + 0.8 ? y + 17 : y - 5;
    txt(XL - 6, Play.clamp(ly, 40, BASE - 4), P.t("snowLabel", { h: fM10(hs) }), "lb halo", "start");
  }

  // temperature-height line (right)
  Play.svg("line", { x1: xT(0), x2: xT(0), y1: yH(HMAX), y2: BASE, stroke: "var(--muted)", "stroke-dasharray": "3 3" }, fig);
  txt(xT(-40), BASE + 18, "−40", "lb", "middle");
  txt(xT(0), BASE + 18, "0", "lb", "middle");
  txt(xT(30), BASE + 18, "30", "lb", "middle");
  txt((TX0 + TX1) / 2, BASE + 36, "°C", "lb", "middle");
  if (show) {
    const tg = Play.svg("g", { "clip-path": "url(#tclip)" }, fig);
    Play.svg("line", { x1: xT(S.t0), y1: BASE, x2: TX0 + (TX1 - TX0) * (tempAt(S.t0, HMAX, r) - TMIN) / (TMAX - TMIN), y2: yH(HMAX), stroke: "var(--no)", "stroke-width": 2.5 }, tg);
  }

  // peak label
  const tp = tempAt(S.t0, H, r);
  txt(XP + 12, Math.max(yH(H) + 2, 40), fM(H) + (P.lang === "zh" ? " 米 · " : " m · ") + (show ? P.t("c", { v: fT(tp) }) : "? °C"), "lbf halo", "start");
  txt(XL - 6, BASE + 18, P.t("seaLabel", { t: fT(S.t0) }), "lb");

  // climber
  const h = S.h, cx = climberX(h, H), cy = yH(h), t = tempAt(S.t0, h, r);
  if (show) {
    Play.svg("line", { x1: cx, x2: xT(t), y1: cy, y2: cy, stroke: "var(--no)", "stroke-width": 1, "stroke-dasharray": "2 3" }, fig);
    Play.svg("circle", { cx: xT(t), cy, r: 5, fill: "var(--no)", stroke: "var(--surface)", "stroke-width": 1.5 }, fig);
  }
  const g = Play.svg("g", { transform: "translate(" + cx.toFixed(1) + " " + cy.toFixed(1) + ")" }, fig);
  Play.svg("circle", { cx: 0, cy: -24, r: 5, fill: "var(--no)" }, g);
  Play.svg("path", { d: "M0 -19 L0 -8 M0 -8 L-5 0 M0 -8 L5 0 M-6 -15 L6 -13 M6 -13 L9 -3", stroke: "var(--no)", "stroke-width": 2.5, "stroke-linecap": "round", fill: "none" }, g);
  Play.svg("circle", { cx: 0, cy: -10, r: 16, fill: "transparent" }, g);   // larger touch target
  if (show && h > 0.05 && H - h > 0.6) {
    txt(cx + 12, cy - 10, fM(h) + (P.lang === "zh" ? " 米 · " : " m · ") + P.t("c", { v: fT(t) }), "lbf halo", "start");
  }
  fig.setAttribute("aria-valuemin", 0);
  fig.setAttribute("aria-valuemax", Math.round(H * 1000));
  fig.setAttribute("aria-valuenow", Math.round(h * 1000));
  fig.setAttribute("aria-valuetext", show ? P.t("liveRead", { h: fM(h), t: fT(t), belt: beltName(belt(t)) }) : P.t("liveHidden", { t: fT(S.t0) }));
  fig.classList.toggle("locked", !show);
}

/* ---------- side panel ---------- */
function panel() {
  const r = S.rate, h = S.h, t = tempAt(S.t0, h, r), hs = snowLine(S.t0, r);
  const sTxt = S.t0 <= 0 ? P.t("sAll") : hs > S.H ? P.t("sAbove", { h: fM10(hs) }) : P.t("sAt", { h: fM10(hs) });
  const sep = P.lang === "zh" ? "：" : ": ";
  $("read").innerHTML = "";
  [["rH", P.t("m", { v: fM(h) })], ["rT", P.t("c", { v: fT(t) })], ["rD", P.t("c", { v: fT(S.t0 - t) })], ["rB", beltName(belt(t))], ["rS", sTxt]].forEach(([k, v]) => {
    const d = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = v;
    d.append(P.t(k) + sep, b);
    $("read").appendChild(d);
  });
  const kick = '<div class="kicker">' + P.t("sunK") + "</div>";
  $("sun").innerHTML = kick + (h < 0.005 ? P.t("sun0") : P.t("sun", {
    km: Play.fmt(h, 2), pct: sig(sunPct(h), 2), inten: sig(sunIntensityPct(h), 2), ratio: fBig(round2sig(ORBIT_SWING / h)),
  }));
  // step 3: table for the current mountain
  const hs3 = [];
  const stepKm = S.H > 4 ? 2 : S.H > 2 ? 1 : 0.5;
  for (let k = 0; k < S.H - 1e-9; k += stepKm) hs3.push(k);
  hs3.push(S.H);
  let html = "<thead><tr><th>" + P.t("tH") + "</th><th>" + P.t("tT") + "</th><th></th></tr></thead><tbody>";
  hs3.forEach((x) => { const tt = tempAt(S.t0, x, r); html += "<tr><td>" + P.t("m", { v: fM(x) }) + "</td><td>" + P.t("c", { v: fT(tt) }) + "</td><td>" + beltName(belt(tt)) + "</td></tr>"; });
  $("tbl").innerHTML = html + "</tbody>";
  rateBtns.forEach((b, j) => { const on = [LAPSE, DRY][j] === r; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
}
function bodyText() {
  if (S.step === 0) return P.t(S.revealed ? "b1after" : "b1");
  if (S.step === 1) return P.t("b2");
  const ki = MTS.ki, r = S.rate;
  return P.t("b3", { t0: fT(ki.T0), r: Play.fmt(r, 1), hs: fM10(snowLine(ki.T0, r)), H: fM(ki.H) }) + " " + P.t("b3rate");
}

/* ---------- render ---------- */
function render() {
  $("t0").value = S.t0;
  $("t0Val").textContent = P.t("c", { v: fT(S.t0) });
  pickBtns.forEach((b, j) => { const on = ORDER[j] === S.mt; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  draw();
  $("stepBody").textContent = bodyText();
  $("read").hidden = !S.revealed;
  $("sun").hidden = S.step !== 1;
  $("rates").hidden = $("tbl").hidden = S.step !== 2;
  $("legend").hidden = !S.revealed;
  if (S.revealed) panel();
  const t = tempAt(S.t0, S.h, S.rate);
  Play.live($("live"), S.revealed ? P.t("liveRead", { h: fM(S.h), t: fT(t), belt: beltName(belt(t)) }) : P.t("liveHidden", { t: fT(S.t0) }));
}

/* ---------- controls ---------- */
const pickBtns = ORDER.map((id) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small";
  b.textContent = id === "gen" ? mtName(id) : P.t("pick", { name: mtName(id), H: fM(MTS[id].H) });
  b.addEventListener("click", () => { S.mt = id; S.H = MTS[id].H; S.t0 = MTS[id].T0; S.h = S.H; render(); });
  $("picks").appendChild(b);
  return b;
});
const rateBtns = [["rAvg", LAPSE], ["rDry", DRY]].map(([k, v]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(k);
  b.addEventListener("click", () => { S.rate = v; render(); });
  $("rates").appendChild(b);
  return b;
});
$("t0").addEventListener("input", (e) => { const v = +e.target.value; S.t0 = Number.isFinite(v) ? Play.clamp(v, -10, 35) : 25; render(); });

function setH(h) {
  const v = Play.clamp(Math.round(h * 100) / 100, 0, S.H);
  if (v !== S.h) { S.h = v; render(); }
}
let drag = false;
fig.addEventListener("pointerdown", (e) => {
  if (!S.revealed) return;
  drag = true; fig.setPointerCapture(e.pointerId);
  setH((BASE - Play.pointer(fig, e).y) / PX);
  e.preventDefault();
});
fig.addEventListener("pointermove", (e) => { if (drag) setH((BASE - Play.pointer(fig, e).y) / PX); });
fig.addEventListener("pointerup", () => (drag = false));
fig.addEventListener("pointercancel", () => (drag = false));
fig.addEventListener("keydown", (e) => {
  if (!S.revealed) return;
  const d = { ArrowUp: 0.1, ArrowRight: 0.1, ArrowDown: -0.1, ArrowLeft: -0.1, PageUp: 1, PageDown: -1 }[e.key];
  if (d !== undefined) setH(S.h + d);
  else if (e.key === "Home") setH(0);
  else if (e.key === "End") setH(S.H);
  else return;
  e.preventDefault();
});

function predictCfg() {
  const g = MTS.gen, d = LAPSE * g.H, tTop = tempAt(g.T0, g.H, LAPSE);
  const v = { t0: fT(g.T0), H: fM(g.H), d: Play.fmt(d, 0), t: fT(tTop) };
  return {
    q: P.t("q", v),
    options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3", v), right: true }],
    right: P.t("right", v), wrong: P.t("wrong", v),
  };
}
const pr = Play.predict($("predict"), predictCfg(), () => { if (!S.revealed) { S.revealed = true; S.h = S.H; } render(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  S.step = i;
  if (i > 0 && !S.revealed) { S.revealed = true; S.h = S.H; }
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  Object.assign(S, { mt: "gen", H: MTS.gen.H, t0: MTS.gen.T0, h: 0, rate: LAPSE, revealed: false });
  pr.reset(); st.go(0);
});
(function resultNote() {
  const ev = MTS.ev;
  $("resultNote").textContent = P.t("resultNote", { H: Play.fmt(ev.H, 3), d: Play.fmt(LAPSE * ev.H, 1), pct: sig(sunPct(ev.H), 2) });
})();
render();
</script>
</body>
</html>

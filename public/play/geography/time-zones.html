/* ---------- model (pure functions) ---------- */
const DAY_H = 24, DEG_PER_H = 360 / DAY_H; // 15
const mod = (x, m) => ((x % m) + m) % m;
const CITIES = [ // standard-time UTC offsets (h); lat/lon in degrees (E and N positive)
  { id: "BJ", lat: 39.9, lon: 116.4, off: 8 },
  { id: "LO", lat: 51.5, lon: 0, off: 0 },
  { id: "NY", lat: 40.7, lon: -74.0, off: -5 },
  { id: "SY", lat: -33.9, lon: 151.2, off: 10 },
  { id: "NA", lat: -1.3, lon: 36.8, off: 3 },
  { id: "SP", lat: -23.6, lon: -46.6, off: -3 },
];
const KASHGAR = { id: "KA", lat: 39.5, lon: 76.0, off: 8 };
const sunTime = (T, lon) => mod(T + lon / DEG_PER_H, DAY_H);          // mean solar time, h
const isDay = (T, lon) => { const s = sunTime(T, lon); return s >= 6 && s < 18; }; // equinox terminator
const subsolarLon = (T) => mod(180 - DEG_PER_H * T + 180, 360) - 180;  // where the Sun is at noon
const clockH = (T, off) => mod(T + off, DAY_H);
const dayIdx = (T, off) => Math.floor((T + off) / DAY_H);               // T in [0,24): −1, 0 or +1
const solarNoonClock = (c) => mod(12 - c.lon / DEG_PER_H + c.off, DAY_H); // clock reading at solar noon
function hhmm(h) { const m = mod(Math.round(h * 60), 1440); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function signedHM(h) { const m = Math.round(Math.abs(h) * 60); return (h < -1 / 120 ? "−" : "+") + Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); }
const zoneStr = (off) => P.t("zone", { z: off === 0 ? "+0" : (off > 0 ? "+" : "−") + Math.abs(off) });

/* ---------- state ---------- */
const $ = (id) => document.getElementById(id);
const globe = $("globe"), utcEl = $("utc");
const T0 = 4; // 12:00 in Beijing
const S = { T: T0, me: "BJ", step: 0, shown: false }; // shown: other cities appear after the guess
const cityName = (c) => P.t("c" + c.id);
const lonStr = (v) => (Math.abs(v) < 0.05 ? P.t("lon0") : Math.abs(Math.abs(v) - 180) < 0.05 ? P.t("lon180") : P.t(v > 0 ? "lonE" : "lonW", { v: Play.fmt(Math.abs(v), Number.isInteger(v) ? 0 : 1) }));

/* ---------- globe: view from above the North Pole, Sun on the left ---------- */
const G = { x: 232, y: 196, R: 116 };
// screen angle (deg, counter-clockwise from +x, y up) of a meridian: noon faces the Sun (180°)
const theta = (lon, T) => lon + DEG_PER_H * T;
function polar(angDeg, r) { const a = angDeg * Math.PI / 180; return [G.x + r * Math.cos(a), G.y - r * Math.sin(a)]; }
const rLat = (lat) => G.R * (90 - lat) / 180;
function txt(parent, x, y, s, cls, anchor) {
  const t = Play.svg("text", { x, y, class: cls || "lb", "text-anchor": anchor || "start" }, parent);
  t.textContent = s;
  return t;
}
const fixedBoxes = [];
function boxOf(el) { try { const b = el.getBBox(); return { x: b.x, y: b.y, width: b.width, height: b.height }; } catch (e) { return null; } }
const overlap = (A, B) => Math.max(0, Math.min(A.x + A.width, B.x + B.width) - Math.max(A.x, B.x)) * Math.max(0, Math.min(A.y + A.height, B.y + B.height) - Math.max(A.y, B.y));
const hit = (A, B) => A.x < B.x + B.width && B.x < A.x + A.width && A.y < B.y + B.height && B.y < A.y + A.height;
function spread(labels, dots) { // try spots around each dot until the label clears dots, ring labels and earlier labels
  const placed = [];
  labels.forEach((el, i) => {
    const d = dots[i], obs = fixedBoxes.concat(placed, dots.filter((q, k) => k !== i).map((q) => ({ x: q.x - 7, y: q.y - 7, width: 14, height: 14 })));
    const out = el.getAttribute("text-anchor");
    const spots = [[el.getAttribute("x"), el.getAttribute("y"), out], [d.x + 12, d.y + 4, "start"], [d.x - 12, d.y + 4, "end"], [d.x, d.y - 11, "middle"], [d.x, d.y + 21, "middle"]];
    let best = null;
    search: for (const dy of [0, 4, -4, 8, -8, 12, -12, 16, -16, 20, -20, 24, -24, 28, -28]) {
      for (const [x, y, an] of spots) {
        el.setAttribute("x", x); el.setAttribute("y", +y + dy); el.setAttribute("text-anchor", an);
        const b = boxOf(el);
        if (!b) return;
        const bad = (b.x < 0 || b.x + b.width > 440 ? 1e6 : 0) + obs.reduce((s, B) => s + overlap(b, B), 0) + Math.abs(dy) * 0.01;
        if (!best || bad < best.bad) best = { bad, x, y: +y + dy, an, b };
        if (bad < 1) break search;
      }
    }
    el.setAttribute("x", best.x); el.setAttribute("y", best.y); el.setAttribute("text-anchor", best.an);
    const A = best.b;
    if (A) placed.push(A);
  });
}
function drawGlobe() {
  globe.innerHTML = "";
  const { x: cx, y: cy, R } = G;
  // sunlight from the left
  for (let k = -3; k <= 3; k++) {
    const y = cy + k * 28;
    Play.svg("line", { x1: 8, y1: y, x2: 30, y2: y, stroke: "var(--hl)", "stroke-width": 2, "stroke-linecap": "round" }, globe);
    Play.svg("path", { d: `M30 ${y - 4} L37 ${y} L30 ${y + 4}Z`, fill: "var(--hl)" }, globe);
  }
  const ringLabels = [txt(globe, 8, cy - 3 * 28 - 12, P.t("sunlight") + " →", "lbf")];
  // fixed ring of sun time (noon toward the Sun)
  Play.svg("circle", { cx, cy, r: R + 30, fill: "none", stroke: "var(--line)", "stroke-width": 1 }, globe);
  for (let h = 0; h < 24; h++) {
    const a = 180 + (h - 12) * DEG_PER_H, major = h % 6 === 0;
    const [x1, y1] = polar(a, R + 30 - (major ? 6 : 3)), [x2, y2] = polar(a, R + 30 + (major ? 6 : 3));
    Play.svg("line", { x1, y1, x2, y2, stroke: "var(--muted)", "stroke-width": major ? 1.6 : 1 }, globe);
    if (h % 3 === 0) {
      const [lx, ly] = polar(a, R + 55);
      ringLabels.push(txt(globe, lx, ly + 4, hhmm(h), major ? "lbf" : "lbs", "middle"));
    }
  }
  txt(globe, 434, 386, P.t("sunTime") + " ↻", "lb", "end");
  // Earth disc, night half on the right (away from the Sun)
  Play.svg("circle", { cx, cy, r: R, fill: "var(--c)", opacity: 0.22 }, globe);
  Play.svg("path", { d: `M${cx} ${cy - R} A${R} ${R} 0 0 1 ${cx} ${cy + R} Z`, fill: "#000", opacity: 0.36 }, globe); // night: darker in light and dark themes
  Play.svg("path", { d: `M${cx} ${cy - R} A${R} ${R} 0 0 0 ${cx} ${cy + R} Z`, fill: "var(--hl)", opacity: 0.14 }, globe); // day side
  Play.svg("circle", { cx, cy, r: R, fill: "none", stroke: "var(--c)", "stroke-width": 1.5 }, globe);
  Play.svg("circle", { cx, cy, r: R / 2, fill: "none", stroke: "var(--muted)", "stroke-dasharray": "3 4", "stroke-width": 1 }, globe);
  // rotating meridians every 15°; the prime meridian's label is fixed, the others give way to city labels
  const lonLabels = [];
  for (let lon = -165; lon <= 180; lon += 15) {
    const a = theta(lon, S.T), [x, y] = polar(a, R), prime = lon === 0, dl = lon === 180;
    Play.svg("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: prime ? "var(--a)" : "var(--fg)", "stroke-width": prime ? 2.4 : 0.8, opacity: prime ? 1 : 0.35, "stroke-dasharray": dl ? "4 3" : "none" }, globe);
    if (lon % 45 === 0) {
      const [lx, ly] = polar(a, R + 14);
      lonLabels.push(txt(globe, lx, ly + 4, lonStr(lon), prime ? "lbf halo" : "lbs halo", "middle"));
    }
  }
  // terminator (sunrise at top, sunset at bottom)
  Play.svg("line", { x1: cx, y1: cy - R, x2: cx, y2: cy + R, stroke: "var(--hl)", "stroke-width": 2 }, globe);
  ringLabels.push(txt(globe, cx - 70, 30, "☀ " + P.t("day"), "lbf", "end"), txt(globe, cx + 70, 30, P.t("night") + " ☾", "lbf", "start"));
  Play.svg("circle", { cx, cy, r: 3, fill: "var(--fg)" }, globe);
  // cities
  const labels = [], dots = [];
  const list = S.step === 2 ? CITIES.concat([KASHGAR]) : S.shown ? CITIES : CITIES.filter((c) => c.id === S.me);
  list.forEach((c) => {
    const a = theta(c.lon, S.T), r = rLat(c.lat), [x, y] = polar(a, r), day = isDay(S.T, c.lon), me = c.id === S.me;
    const g = Play.svg("g", { class: "city", "data-id": c.id }, globe);
    if (me) Play.svg("circle", { cx: x, cy: y, r: 9, fill: "none", stroke: "var(--a)", "stroke-width": 2.5 }, g);
    Play.svg("circle", { cx: x, cy: y, r: 5.5, fill: day ? "var(--hl)" : "var(--c)", stroke: "var(--surface)", "stroke-width": 1.5 }, g);
    Play.svg("circle", { cx: x, cy: y, r: 16, fill: "transparent" }, g);
    dots.push({ x, y });
    const ca = Math.cos(a * Math.PI / 180), sa = Math.sin(a * Math.PI / 180);
    const anchor = Math.abs(ca) < 0.35 ? "middle" : ca > 0 ? "start" : "end";
    const lx = x + ca * 12, ly = y - sa * 12 + (sa > 0.35 ? -6 : sa < -0.35 ? 14 : 4);
    const label = c.id === "KA" || narrow.matches ? cityName(c) : cityName(c) + " " + hhmm(clockH(S.T, c.off)); // phones: clocks are in the table
    labels.push(txt(g, lx, ly, label, "lbf halo", anchor));
  });
  fixedBoxes.length = 0;
  ringLabels.forEach((el) => { const b = boxOf(el); if (b) fixedBoxes.push(b); });
  fixedBoxes.push({ x: 0, y: cy - 90, width: 40, height: 180 }); // sunlight arrows
  spread(labels, dots);
  const cityBoxes = labels.map(boxOf).filter(Boolean).concat(dots.map((q) => ({ x: q.x - 7, y: q.y - 7, width: 14, height: 14 })));
  lonLabels.forEach((el) => { const b = boxOf(el); if (b && cityBoxes.concat(fixedBoxes).some((B) => hit(b, B))) el.remove(); });
  globe.setAttribute("aria-valuemin", 0); globe.setAttribute("aria-valuemax", 23.75);
  globe.setAttribute("aria-valuenow", S.T); globe.setAttribute("aria-valuetext", hhmm(S.T) + " UTC");
}

/* ---------- table ---------- */
function cell(tr, tag, html, cls) { const e = document.createElement(tag); e.innerHTML = html; if (cls) e.className = cls; tr.appendChild(e); return e; }
const esc = (s) => String(s).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
function drawTable() {
  const tb = $("tbl"); tb.innerHTML = "";
  const me = CITIES.find((c) => c.id === S.me), meDay = dayIdx(S.T, me.off);
  const rrule = S.step === 2, head = document.createElement("tr");
  (rrule ? ["hCity", "hLon", "hClock", "hSun", "hGap"] : ["hCity", "hClock", "hSky"]).forEach((k) => cell(head, "th", esc(P.t(k))));
  tb.appendChild(head);
  (rrule ? CITIES.concat([KASHGAR]) : CITIES).forEach((c) => {
    const tr = document.createElement("tr");
    if (c.id === S.me) tr.className = "me";
    const dd = dayIdx(S.T, c.off) - meDay;
    const dStr = dd > 0 ? P.t("dPlus") : dd < 0 ? P.t("dMinus") : "";
    cell(tr, "td", esc(cityName(c)));
    if (rrule) cell(tr, "td", esc(lonStr(c.lon)));
    cell(tr, "td", esc(hhmm(clockH(S.T, c.off))) + " <span class=\"lbs\">" + esc(zoneStr(c.off)) + "</span>" + (dStr ? '<span class="dd">' + esc(dStr) + "</span>" : ""));
    if (rrule) {
      cell(tr, "td", esc(hhmm(sunTime(S.T, c.lon))));
      cell(tr, "td", esc(signedHM(c.off - c.lon / DEG_PER_H)), "gap");
    } else {
      const day = isDay(S.T, c.lon);
      cell(tr, "td", esc(P.t(day ? "day" : "night")), day ? "sun" : "moon");
    }
    tb.appendChild(tr);
  });
  const cap = document.createElement("caption");
  cap.style.cssText = "caption-side: bottom; text-align: left; font-size: 12px; color: var(--muted); padding-top: 4px;";
  cap.textContent = P.t("vsMe", { c: cityName(me) });
  tb.appendChild(cap);
}

/* ---------- render ---------- */
const meBtns = [];
const narrow = matchMedia("(max-width: 560px)");
if (narrow.addEventListener) narrow.addEventListener("change", () => render());
function render() {
  S.T = mod(S.T, DAY_H);
  utcEl.value = S.T;
  $("utcVal").textContent = hhmm(S.T);
  drawGlobe(); drawTable();
  const hide = !S.shown && S.step === 0;
  $("tbl").hidden = hide; $("readout").hidden = hide; $("live").hidden = hide; $("meBox").hidden = hide;
  meBtns.forEach((b) => b.classList.toggle("on", b.dataset.me === S.me));
  const lit = CITIES.filter((c) => isDay(S.T, c.lon));
  $("oTurn").textContent = P.t("vTurn", { d: Play.fmt(DEG_PER_H * S.T, 2).replace(/\.?0+$/, "") });
  $("oNoon").textContent = lonStr(subsolarLon(S.T));
  $("oLit").textContent = P.t("vLit", { n: lit.length, m: CITIES.length });
  const sep = P.lang === "zh" ? "、" : ", ";
  const dark = CITIES.filter((c) => !isDay(S.T, c.lon));
  let note = P.t("liveSum", { utc: hhmm(S.T), day: lit.map(cityName).join(sep) || P.t("noneLit"), night: dark.map(cityName).join(sep) || P.t("noneLit") });
  note += " " + (lit.length === CITIES.length ? P.t("allLit") : P.t("halfNote"));
  Play.live($("live"), note);
}

/* ---------- interaction ---------- */
let anim = 0, last = 0;
const playBtn = $("playBtn");
function stop() { if (anim) cancelAnimationFrame(anim); anim = 0; last = 0; playBtn.textContent = P.t("play"); }
function tick(ts) {
  if (last) S.T += Math.min(100, ts - last) * 24 / 16000; // one day in 16 s
  last = ts; render(); anim = requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => {
  if (anim) { stop(); return; }
  if (Play.reduced) { S.T = Math.round(S.T + 1); render(); return; } // reduced motion: one-hour steps
  playBtn.textContent = P.t("pause"); anim = requestAnimationFrame(tick);
});

const angAt = (p) => Math.atan2(G.y - p.y, p.x - G.x) * 180 / Math.PI;
let drag = null;
globe.addEventListener("pointerdown", (e) => {
  stop();
  const hit = e.target.closest && e.target.closest(".city");
  if (hit && CITIES.some((c) => c.id === hit.dataset.id)) S.me = hit.dataset.id;
  drag = { a: angAt(Play.pointer(globe, e)) };
  globe.setPointerCapture(e.pointerId);
  render();
});
globe.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const a = angAt(Play.pointer(globe, e));
  const d = mod(a - drag.a + 180, 360) - 180; // unwrap across ±180°
  drag.a = a;
  S.T += d / DEG_PER_H;
  render();
});
const endDrag = () => { if (drag) { drag = null; S.T = Math.round(S.T * 4) / 4; render(); } };
globe.addEventListener("pointerup", endDrag);
globe.addEventListener("pointercancel", endDrag);
globe.addEventListener("keydown", (e) => {
  const step = { ArrowRight: 0.25, ArrowUp: 0.25, ArrowLeft: -0.25, ArrowDown: -0.25, PageUp: 1, PageDown: -1 }[e.key];
  if (step) { stop(); S.T = Math.round((S.T + step * (e.shiftKey ? 4 : 1)) * 4) / 4; render(); e.preventDefault(); }
});
utcEl.addEventListener("input", () => { stop(); S.T = Play.clamp(+utcEl.value, 0, 23.75); render(); });
CITIES.forEach((c) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.dataset.me = c.id; b.textContent = cityName(c);
  b.addEventListener("click", () => { S.me = c.id; render(); });
  $("meBox").appendChild(b); meBtns.push(b);
});

const NY = CITIES.find((c) => c.id === "NY");
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { t: hhmm(clockH(T0, NY.off)) }), wrong: P.t("wrong"),
}, () => { S.shown = true; render(); });
const DEG = Play.fmt(DEG_PER_H, 0);
$("resultMain").textContent = P.t("resultMain", { deg: DEG });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  S.step = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, { deg: DEG, k: hhmm(solarNoonClock(KASHGAR)) });
  $("predict").hidden = i !== 0;
  if (i === 0) { stop(); S.T = T0; } else S.shown = true;
  if (i === 2) { stop(); S.T = mod(12 - KASHGAR.lon / DEG_PER_H, DAY_H); } // solar noon in Kashgar
  render();
});
$("reset").addEventListener("click", () => { stop(); Object.assign(S, { T: T0, me: "BJ", shown: false }); pr.reset(); st.go(0); });
stop();
render();
</script>
</body>
</html>

/* ---------- model (pure functions; schematic but self-consistent) ---------- */
const RAD = Math.PI / 180, NS = 240, ITCZ_MEAN = 4;
const itczLat = (m) => ITCZ_MEAN + 6 * Math.cos(2 * Math.PI * (m - 8) / 12);
function bounds(m) {
  const it = itczLat(m), dev = it - ITCZ_MEAN;
  return { it, n30: 30 + 0.6 * dev, s30: -30 + 0.6 * dev, n60: 60 + 0.3 * dev, s60: -60 + 0.3 * dev };
}
function cellsFor(m) {
  const B = bounds(m);
  return [
    { kind: "polar", hemi: "S", a: -90, b: B.s60, rise: "R", top: 8 },
    { kind: "ferrel", hemi: "S", a: B.s60, b: B.s30, rise: "L", top: 10 },
    { kind: "hadley", hemi: "S", a: B.s30, b: B.it, rise: "R", top: 14 },
    { kind: "hadley", hemi: "N", a: B.it, b: B.n30, rise: "L", top: 14 },
    { kind: "ferrel", hemi: "N", a: B.n30, b: B.n60, rise: "R", top: 10 },
    { kind: "polar", hemi: "N", a: B.n60, b: 90, rise: "L", top: 8 },
  ];
}
const sq = (v) => Math.sign(v) * Math.pow(Math.abs(v), 0.3); // squarish loop
const frac = (u) => ((u % 1) + 1) % 1;
function pos(c, u) {
  const lc = (c.a + c.b) / 2, rl = (c.b - c.a) / 2 - 2.5, zb = 0.4, zc = (zb + c.top) / 2, rz = (c.top - zb) / 2;
  const th = c.rise === "L" ? Math.PI + 0.6 - 2 * Math.PI * frac(u) : -0.6 + 2 * Math.PI * frac(u); // u = 0: foot of the rising leg
  return { lat: lc + rl * sq(Math.cos(th)), z: zc + rz * sq(Math.sin(th)), th };
}
function leg(c, th) {
  const s = Math.sin(th), co = Math.cos(th);
  if (s > 0.6) return "aloft";
  if (s < -0.6) return "surface";
  return (c.rise === "L" ? co < 0 : co > 0) ? "up" : "down";
}
const surfT = (lat) => -20 + 47 * Math.pow(Math.max(0, Math.cos(lat * RAD)), 1.2); // °C, yearly, schematic
const tempAt = (lat, z) => surfT(lat) - 6.5 * z;

/* ---------- tracker chart: temperature and vapour round the loop ---------- */
let WT = 600;

  }

    Play.svg("line", { x1: TL, x2: WT - TR, y1: r[1], y2: r[1], stroke: "var(--line)" }, trk);
    txt(trk, TL - 5, r[0] + 9, f(hi), "lb", "end");

  tr.forEach((s, i) => {

    dQ += (i ? "L" : "M") + XU(s.u).toFixed(1) + " " + yQ(s.q).toFixed(1);
    if (s.rain > 0.01) {

      Play.svg("line", { x1: XU(s.u), x2: XU(s.u), y1: TQ[1] - 6, y2: TQ[1], stroke: "var(--c)", "stroke-width": 1.5 }, trk);
    }

}

/* ---------- readout ---------- */
function doing(c, tr, i) {
  const s = tr[i], n = tr[(i + 1) % NS];
  if (s.leg === "up") return P.t(tr.slice(Math.max(0, i - 3), i + 1).some((x) => x.rain > 0.01) ? "dUpRain" : "dUp");
  if (s.leg === "down") return P.t("dDown");
  const pole = Math.abs(n.lat) > Math.abs(s.lat);
  if (s.leg === "aloft") return P.t(pole ? "dAloftPole" : "dAloftEq");
  if (c.kind === "hadley") return P.t("dTrades");
  if (pole && tr.slice(Math.max(0, i - 3), i + 1).some((x) => x.rain > 0.01)) return P.t("dSurfRain");
  return P.t(pole ? "dSurfPole" : "dSurfEq");
}
function readout() {
  const ci = cellIdx(), c = cells[ci], tr = tracks[ci], i = Math.floor(frac(S.u) * NS) % NS, s = tr[i];
  $("oCell").textContent = P.t("cellName", { cell: P.t("n" + c.kind[0].toUpperCase() + c.kind.slice(1)), hemi: P.t(c.hemi === "N" ? "hemN" : "hemS") });
  $("oWhere").textContent = P.t("vWhere", { lat: latStr(s.lat), z: Play.fmt(s.z, 1) });
  $("oDoing").textContent = doing(c, tr, i);
  $("oT").textContent = P.t("vT", { t: Play.fmt(s.T, 0).replace("-", "−") });
  $("oQ").textContent = P.t("vQ", { q: Play.fmt(s.q, s.q < 1 ? 2 : 1) });
  $("oRH").textContent = P.t("vRH", { rh: Play.fmt(100 * s.rh, 0) });

}

/* ---------- interaction ---------- */
DESERTS.forEach((d, i) => {

  b.type = "button"; b.className = "small";

let anim = 0, last = 0;
function stop() { if (anim) cancelAnimationFrame(anim); anim = 0; playBtn.textContent = P.t("play"); }
function tick(ts) {
  if (last) S.u = frac(S.u + Math.min(0.1, (ts - last) / 1000) / 16); // one loop per 16 s
  last = ts; frame(); anim = requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => (anim ? stop() : start()));

document.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => { S.kind = b.dataset.kind; render(); }));

fig.addEventListener("pointerdown", (e) => {

    let best = -1, bd = 1e9;
    ORDER.forEach((d, i) => {
      const cy = STRIP + ROWS[i] * ROWH + 3, dx = p.x < X(d.lo) ? X(d.lo) - p.x : p.x > X(d.hi) ? p.x - X(d.hi) : 0, dist = dx + Math.abs(p.y - cy);

    });
    if (best >= 0 && bd < 30) { S.desert = DESERTS.indexOf(ORDER[best]); render(); }
    return;
  }
  let best = null, bd = 26;
  cells.forEach((c, i) => dots[i].forEach((el, k) => {
    const dist = Math.hypot(+el.getAttribute("cx") - p.x, +el.getAttribute("cy") - p.y);
    if (dist < bd) { bd = dist; best = [i, k]; }
  }));
  if (!best && p.y < Y0) { const i = cells.findIndex((c) => p.x >= X(c.a) && p.x <= X(c.b)); if (i >= 0) best = [i, 0]; }
  if (!best) return;
  const c = cells[best[0]];
  S.kind = c.kind; S.hemi = c.hemi; S.u = frac(S.u + best[1] / PER);
  render();
});
fig.addEventListener("keydown", (e) => {
  const kinds = ["polar", "ferrel", "hadley"];
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { stop(); S.u = frac(S.u + (e.key === "ArrowRight" ? 1 : -1) / 50); frame(); e.preventDefault(); }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") { // walk through the six cells from south to north
    const order = [...kinds.map((k) => ["S", k]), ...[...kinds].reverse().map((k) => ["N", k])];
    let i = order.findIndex(([h, k]) => h === S.hemi && k === S.kind);
    i = Play.clamp(i + (e.key === "ArrowUp" ? 1 : -1), 0, 5);
    [S.hemi, S.kind] = order[i]; render(); e.preventDefault();
  }
});
function measure() {

  if (Math.abs(w1 - W) > 1 || Math.abs(w2 - WT) > 1) { W = Math.max(280, w1); WT = Math.max(260, w2); drawFig(); drawTrk(); frame(); }

    foot: "模型：海上空气出发时 20 °C，露点 16 °C（湿度 78%）。没成云时每千米降 9.8 °C（干绝热直减率）；露点每千米降 1.8 °C，所以云底高度是 (20 − 16) ÷ (9.8 − 1.8) 千米 = 500 米。在云里每千米降 6 °C（湿绝热直减率的取整值，实际约 4–7 °C）。超出空气容量的水汽在上山时全部变成雨落下；下山时每千米升温 9.8 °C。空气能装多少水汽：饱和水汽压用 Magnus 公式，气压按 8 千米标高随高度减小。真实的背风坡也会有其他天气带来的雨，真实的直减率也随气温和湿度变化。年降水取整：马哈巴莱什瓦尔约 5600 毫米，浦那约 700 毫米；雷尼尔山天堂站约 3000 毫米，亚基马约 200 毫米。页面上的数都由这些值算出。CC BY 4.0 · Boxi Yu",

/* ---------- constants ---------- */
const T0 = 20, TD0 = 16;                  // sea air: temperature and dew point (°C)
const DRY = 9.8, MOIST = 6, DEW = 1.8;    // °C per km: dry adiabatic, rounded moist adiabatic, dew-point fall
const P0 = 1013.25, SCALE_H = 8;          // hPa at sea level, km scale height
const REAL = [
  { k: "gh", w: "ghW", d: "ghD", wet: 5600, dry: 700 },
  { k: "cs", w: "csW", d: "csD", wet: 3000, dry: 200 },
];

/* ---------- pure logic ---------- */
const es = (t) => 6.112 * Math.exp((17.67 * t) / (t + 243.5));              // saturation vapour pressure, hPa
const pres = (z) => P0 * Math.exp(-z / SCALE_H);
const wsat = (t, z) => { const e = es(t), p = pres(z); return (622 * e) / Math.max(p - e, 1); }; // g per kg
const W0 = wsat(TD0, 0);                                                     // water the sea air carries
const HC = (T0 - TD0) / (DRY - DEW);                                         // cloud base, km
const tRise = (z) => (z <= HC ? T0 - DRY * z : T0 - DRY * HC - MOIST * (z - HC));
const wTop = (H) => (H > HC ? Math.min(W0, wsat(tRise(H), H)) : W0);
const rainOut = (H) => Math.max(0, W0 - wTop(H));
function rhOf(w, t, z) { const p = pres(z), e = (w * p) / (622 + w); return Math.min(100, (100 * e) / es(t)); }
function parcel(z, after, H) {                                               // state of the air at height z
  z = Play.clamp(z, 0, Math.max(H, 0));
  if (!after) {
    const t = tRise(z), cloud = H > HC && z > HC;
    const w = cloud ? Math.min(W0, wsat(t, z)) : W0;
    return { t, w, ws: wsat(t, z), rh: cloud ? 100 : rhOf(w, t, z), phase: z < 5e-4 ? "flat" : cloud ? "cloud" : "rise" };
  }
  const t = tRise(H) + DRY * (H - z), w = wTop(H);
  return { t, w, ws: wsat(t, z), rh: rhOf(w, t, z), phase: z < 5e-4 ? "flat" : "sink" };
}
const RATE = { flat: 0, rise: -DRY, cloud: -MOIST, sink: DRY };

/* ---------- geometry ---------- */
const BASE = 220, PX = 38, XC = 200, HALF = 100, LAND0 = 30, LAND1 = 370, X0 = 12, X1 = 388, LIFT = 14;
const yH = (h) => BASE - h * PX;
function ground(x, H) { const d = Math.abs(x - XC) / HALF; return d < 1 ? H * Math.cos((Math.PI * d) / 2) ** 2 : 0; }
const pathX = (u, dir) => (dir > 0 ? X0 + (X1 - X0) * u : X1 - (X1 - X0) * u);
const uOfX = (x, dir) => Play.clamp(dir > 0 ? (x - X0) / (X1 - X0) : (X1 - x) / (X1 - X0), 0, 1);
const isAfter = (x, dir) => (dir > 0 ? x > XC : x < XC);
function xAtHeight(h, H, dir) {                                              // windward x where the ground is h
  if (!(H > 0) || h >= H) return XC;
  const d = (2 / Math.PI) * Math.acos(Math.sqrt(Play.clamp(h / H, 0, 1)));
  return XC - dir * d * HALF;
}

/* ---------- formatting ---------- */
const $ = (id) => document.getElementById(id);
const neg = (s) => s.replace(/^-/, "−");
function fT(t) { const s = Play.fmt(t, 1); return P.t("c", { v: neg(s === "-0.0" ? "0.0" : s) }); }
function group(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
const fM = (km) => P.t("m", { v: P.lang === "zh" ? String(Math.round(km * 1000)) : group(km * 1000) });
const f1 = (x) => Play.fmt(x, 1);
const fRH = (x) => Play.fmt(x, 0);
const low = (s) => s.toLowerCase();
const sideName = (s) => P.t(s < 0 ? "west" : "east");                        // s = −1 west, +1 east

/* ---------- state ---------- */
const S = { step: 0, H: 2, dir: 1, u: 0, revealed: false, playing: false };
function now() {
  const x = pathX(S.u, S.dir), z = ground(x, S.H), af = isAfter(x, S.dir);
  return Object.assign({ x, z }, parcel(z, af, S.H));
}
function feet() {
  return { w: parcel(0, false, S.H), top: parcel(S.H, false, S.H), l: parcel(0, true, S.H), rain: rainOut(S.H) };
}

/* ---------- drawing ---------- */
const fig = $("fig");
function txt(x, y, s, cls, anchor) {
  const t = Play.svg("text", { x, y, class: cls || "lb", "text-anchor": anchor || "start" }, fig);
  t.textContent = s;
  return t;
}
function draw() {
  fig.innerHTML = "";
  const H = S.H, dir = S.dir, show = S.revealed, F = feet();
  const cloudy = H > HC;
  // height grid
  for (let k = 1; k <= 3; k++) {
    Play.svg("line", { x1: 0, x2: 400, y1: yH(k), y2: yH(k), stroke: "var(--line)", "stroke-width": 1 }, fig);
    txt(4, yH(k) - 4, k + " km", "lb");
  }
  // wind arrow
  const ax0 = XC - 60 * dir, ax1 = XC + 60 * dir;
  Play.svg("path", { d: `M${ax0} 34 L${ax1} 34 M${ax1 - 9 * dir} 28 L${ax1} 34 L${ax1 - 9 * dir} 40`, stroke: "var(--fg)", "stroke-width": 2, fill: "none", "stroke-linecap": "round" }, fig);
  txt(XC, 24, P.t("wind"), "lbf", "middle");
  // sea and land
  Play.svg("rect", { x: 0, y: BASE, width: 400, height: 16, fill: "var(--c)", opacity: 0.35 }, fig);
  const pts = [];
  for (let x = LAND0; x <= LAND1; x += 5) pts.push([x, yH(ground(x, H))]);
  const top = pts.map((p) => p[0] + "," + p[1].toFixed(1)).join(" ");
  Play.svg("polygon", { points: `${LAND0},${BASE + 16} ${top} ${LAND1},${BASE + 16}`, fill: "var(--soft)" }, fig);
  // wet and dry slopes
  if (show && cloudy) {
    [[-dir, "var(--a)", 0.5], [dir, "var(--hl)", 0.55]].forEach(([s, fill, op]) => {
      const sp = pts.filter((p) => (p[0] - XC) * s >= 0);
      const xa = sp[0][0], xb = sp[sp.length - 1][0];
      Play.svg("polygon", { points: `${xa},${BASE} ` + sp.map((p) => p[0] + "," + p[1].toFixed(1)).join(" ") + ` ${xb},${BASE}`, fill, opacity: op }, fig);
    });
  }
  Play.svg("polyline", { points: top, fill: "none", stroke: "var(--fg)", "stroke-width": 1.6, "stroke-linejoin": "round" }, fig);
  Play.svg("line", { x1: 0, x2: 400, y1: BASE, y2: BASE, stroke: "var(--c)", "stroke-width": 2 }, fig);
  // path of the air
  if (show) {
    const pp = [];
    for (let x = X0; x <= X1; x += 4) pp.push(x + "," + (yH(ground(x, H)) - LIFT).toFixed(1));
    Play.svg("polyline", { points: pp.join(" "), fill: "none", stroke: "var(--muted)", "stroke-dasharray": "3 4" }, fig);
  }
  // cloud base and cloud + rain on the windward slope
  if (show && cloudy) {
    const xb = xAtHeight(HC, H, dir);
    for (let x = xb; (x - XC) * dir <= 12; x += 7 * dir) {
      const g = ground(x, H), f = (g - HC) / Math.max(H - HC, 1e-6);
      const r = 8 + 9 * Play.clamp(f, 0, 1), cy = yH(g) - LIFT - 3;
      Play.svg("circle", { cx: x, cy, r, fill: "var(--muted)", opacity: 0.28 }, fig);
    }
    for (let x = xb + 5 * dir; (x - XC) * dir < -4; x += 10 * dir) {
      const yg = yH(ground(x, H));
      Play.svg("line", { x1: x + 2 * dir, y1: yg - LIFT + 4, x2: x, y2: yg - 2, stroke: "var(--c)", "stroke-width": 1.6, "stroke-linecap": "round" }, fig);
    }
  }
  // height of the range, under the summit
  Play.svg("line", { x1: XC, x2: XC, y1: BASE + 2, y2: BASE + 20, stroke: "var(--muted)", "stroke-dasharray": "2 2" }, fig);
  txt(XC, BASE + 36, "▲ " + fM(H), "lb", "middle");
  // side labels
  [[-1, 85], [1, 315]].forEach(([s, x]) => {
    const wind = s === -dir;
    txt(x, BASE + 36, show ? P.t("sideL", { side: sideName(s), role: P.t(wind ? "wwd" : "lwd") }) : sideName(s), "lbf", "middle");
    if (!show) { txt(x, BASE + 56, "?", "lb", "middle"); return; }
    const p = wind ? F.w : F.l;
    txt(x, BASE + 56, P.t("sideV", { t: fT(p.t), rh: fRH(p.rh) }), "lb", "middle");
    txt(x, BASE + 75, P.t("rainV", { g: f1(wind ? F.rain : 0) }), wind && F.rain > 0.05 ? "lbf" : "lb", "middle");
  });
  // the parcel
  const n = now(), py = yH(n.z) - LIFT;
  Play.svg("circle", { cx: n.x, cy: py, r: 9, fill: n.phase === "cloud" ? "var(--muted)" : "var(--surface)", stroke: "var(--no)", "stroke-width": 2.5 }, fig);
  Play.svg("circle", { cx: n.x, cy: py, r: 20, fill: "transparent" }, fig);
  if (show) {
    const lx = Play.clamp(n.x, 40, 360);
    txt(lx, py - 15, fT(n.t), "lbf halo", "middle");
  }
  fig.setAttribute("aria-valuemin", 0);
  fig.setAttribute("aria-valuemax", 100);
  fig.setAttribute("aria-valuenow", Math.round(S.u * 100));
  fig.setAttribute("aria-valuetext", show ? liveText(n) : P.t("liveHidden", { t: fT(T0) }));
  fig.classList.toggle("locked", !show);
}
const phaseName = (ph) => P.t({ flat: "phFlat", rise: "phRise", cloud: "phCloud", sink: "phSink" }[ph]);
function liveText(n) {
  const side = sideName(n.x < XC ? -1 : 1);
  return P.t("liveRead", { x: side, h: fM(n.z), t: fT(n.t), rh: fRH(n.rh), ph: phaseName(n.phase) });
}

/* ---------- side panel ---------- */
function panel() {
  const n = now(), sep = P.lang === "zh" ? "：" : ": ", r = RATE[n.phase];
  const rateTxt = r === 0 ? P.t("rate0") : P.t("rateV", { v: (r > 0 ? "+" : "−") + f1(Math.abs(r)) });
  $("read").innerHTML = "";
  [["rWhere", phaseName(n.phase)], ["rH", fM(n.z)], ["rT", fT(n.t)], ["rRate", rateTxt], ["rW", P.t("g", { v: f1(n.w) })], ["rWs", P.t("g", { v: f1(n.ws) })], ["rRH", fRH(n.rh) + "%"]].forEach(([k, v]) => {
    const d = document.createElement("div"), b = document.createElement("b");
    b.textContent = v;
    d.append(P.t(k) + sep, b);
    $("read").appendChild(d);
  });
  const SCALE = 25;                                                          // g/kg at full bar width
  $("wbar").innerHTML = P.t("wbarL") + '<div class="track"><div class="fill" style="width:' + Play.clamp((100 * n.w) / SCALE, 0, 100).toFixed(1) +
    '%"></div><div class="cap" style="width:' + Play.clamp((100 * n.ws) / SCALE, 0, 100).toFixed(1) + '%"></div></div>';
}
function tables() {
  const F = feet(), ws = sideName(-S.dir), ls = sideName(S.dir);
  const row = (a, p) => "<tr><td>" + a + "</td><td>" + fT(p.t) + "</td><td>" + P.t("g", { v: f1(p.w) }) + "</td><td>" + fRH(p.rh) + "%</td></tr>";
  $("tbl").innerHTML = "<thead><tr><th>" + P.t("tPlace") + "</th><th>" + P.t("tT") + "</th><th>" + P.t("tW") + "</th><th>" + P.t("tRH") + "</th></tr></thead><tbody>" +
    row(P.t("pWfoot", { side: ws }), F.w) + row(P.t("pTop", { H: fM(S.H) }), F.top) + row(P.t("pLfoot", { side: ls }), F.l) + "</tbody>";
  const mm = (v) => P.t("rMm", { v: P.lang === "zh" ? String(v) : group(v) });
  let html = "<thead><tr><th>" + P.t("realH") + "</th><th>" + P.t("realW") + "</th><th>" + P.t("realD") + "</th></tr></thead><tbody>";
  REAL.forEach((r) => {
    html += "<tr><td>" + P.t(r.k) + "<br>" + P.t("ratio", { v: Play.fmt(r.wet / r.dry, 0) }) + "</td><td>" + P.t(r.w) + "<br>" + mm(r.wet) + "</td><td>" + P.t(r.d) + "<br>" + mm(r.dry) + "</td></tr>";
  });
  $("real").innerHTML = html + "</tbody>";
  $("link").innerHTML = P.t("linkTxt", { dry: f1(DRY), moist: Play.fmt(MOIST, 0) });
}
function bodyText() {
  if (S.step === 0) return P.t(S.revealed ? "b1after" : "b1");
  if (S.step === 1) return P.t("b2");
  const F = feet();
  if (!(S.H > HC)) return P.t("b3low", { H: fM(S.H), hc: fM(HC) });
  return P.t("b3", { dry: f1(DRY), moist: Play.fmt(MOIST, 0), hc: fM(HC), rain: f1(F.rain), lee: low(sideName(S.dir)), d: f1(F.l.t - F.w.t), rh: fRH(F.l.rh) });
}
function resultNote() {
  const F = feet(), v = { H: fM(S.H), hc: fM(HC), wind: low(sideName(-S.dir)), lee: low(sideName(S.dir)), tw: fT(F.w.t), rhw: fRH(F.w.rh), tl: fT(F.l.t), rhl: fRH(F.l.rh), rain: f1(F.rain) };
  return P.t(S.H > HC ? "noteRain" : "noteLow", v);
}

/* ---------- render ---------- */
let lastLive = "";
function render() {
  $("hgt").value = S.H;
  $("hVal").textContent = fM(S.H);
  $("wind").textContent = P.t(S.dir > 0 ? "windW" : "windE");
  $("play").textContent = P.t(S.playing ? "pause" : "play");
  $("play").setAttribute("aria-pressed", S.playing ? "true" : "false");
  $("play").disabled = $("wind").disabled = $("hgt").disabled = !S.revealed;
  draw();
  $("stepBody").textContent = bodyText();
  $("read").hidden = $("wbar").hidden = !(S.revealed && S.step === 1);
  $("tbl").hidden = $("real").hidden = $("link").hidden = S.step !== 2;
  if (S.revealed && S.step === 1) panel();
  if (S.step === 2) tables();
  $("resultNote").textContent = resultNote();
  const n = now(), text = S.revealed ? liveText(n) : P.t("liveHidden", { t: fT(T0) });
  const key = S.playing ? n.phase + (n.x < XC) : text;                       // while playing, announce phase changes only
  if (key !== lastLive) { lastLive = key; Play.live($("live"), text); }
}

/* ---------- animation ---------- */
const LOOP_MS = 9000, HOLD_MS = 1200;
let last = 0, hold = 0;
function tick(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(ts - last, 100) : 0;
  last = ts;
  if (S.u >= 1) { hold += dt; if (hold > HOLD_MS) { hold = 0; S.u = 0; } }
  else S.u = Math.min(1, S.u + dt / LOOP_MS);
  render();
  requestAnimationFrame(tick);
}
function setPlaying(on) {
  S.playing = on && S.revealed;
  last = 0; hold = 0;
  if (S.playing) requestAnimationFrame(tick);
  render();
}
function reveal() {
  if (S.revealed) return;
  S.revealed = true; S.u = 0;
  setPlaying(!Play.reduced);
}

/* ---------- controls ---------- */
$("hgt").addEventListener("input", (e) => { const v = +e.target.value; S.H = Number.isFinite(v) ? Play.clamp(v, 0, 3.5) : 2; render(); });
$("wind").addEventListener("click", () => { S.dir = -S.dir; S.u = 0; hold = 0; render(); });
$("play").addEventListener("click", () => { if (!S.playing && S.u >= 1) S.u = 0; setPlaying(!S.playing); });
function setU(u) { const v = Play.clamp(u, 0, 1); if (v !== S.u) { S.u = v; render(); } }
let drag = false;
fig.addEventListener("pointerdown", (e) => {
  if (!S.revealed) return;
  drag = true; fig.setPointerCapture(e.pointerId);
  if (S.playing) setPlaying(false);
  setU(uOfX(Play.pointer(fig, e).x, S.dir));
  e.preventDefault();
});
fig.addEventListener("pointermove", (e) => { if (drag) setU(uOfX(Play.pointer(fig, e).x, S.dir)); });
fig.addEventListener("pointerup", () => (drag = false));
fig.addEventListener("pointercancel", () => (drag = false));
fig.addEventListener("keydown", (e) => {
  if (!S.revealed) return;
  const d = { ArrowRight: 0.02 * S.dir, ArrowLeft: -0.02 * S.dir, ArrowUp: 0.02, ArrowDown: -0.02, PageUp: 0.1, PageDown: -0.1 }[e.key];
  if (d === undefined && e.key !== "Home" && e.key !== "End") return;
  if (S.playing) setPlaying(false);
  if (d !== undefined) setU(S.u + d);
  else setU(e.key === "Home" ? 0 : 1);
  e.preventDefault();
});

function predictCfg() {
  const F = feet(), v = { H: fM(S.H), d: f1(F.l.t - F.w.t), rh: fRH(F.l.rh) };
  return {
    q: P.t("q", v),
    options: [{ label: P.t("o1"), right: true }, { label: P.t("o2") }, { label: P.t("o3") }],
    right: P.t("right", v), wrong: P.t("wrong", v),
  };
}
const pr = Play.predict($("predict"), predictCfg(), () => reveal());
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  S.step = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("predict").hidden = i !== 0;
  if (i > 0 && !S.revealed) reveal(); else render();
});
$("reset").addEventListener("click", () => {
  S.playing = false;
  Object.assign(S, { H: 2, dir: 1, u: 0, revealed: false });
  pr.reset(); st.go(0);
});
render();
</script>
</body>
</html>

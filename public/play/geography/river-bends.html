/* ===== MODEL START (pure; tested in node) ===== */
// View: 600 × 360 units, 1 unit = 10 m. Channel centre line = points DS apart; flow runs left → right.
const VW = 600, VH = 360, YC = 180, M_PER_U = 10;
const W = 12, DS = 5;                       // channel width 120 m; point spacing
const OMEGA = -1, GAMMA = 2.5, LD = 2 * W;  // Howard & Knutson (1984): local + upstream-lagged curvature, decay length 2 widths
const KMAX = Math.ceil(3 * LD / DS), WTS = Array.from({ length: KMAX }, (_, k) => Math.exp(-(k + 1) * DS / LD));
const RATE = 0.5, CAP = 0.6;                // bank shift per year (units) per unit of C·W, capped
const NEAR = 1.6 * W;                       // a neck narrower than this is breached in a flood → cut-off
const STEPS = 1000, EVERY = 2, SMOOTH = 24, SPIN = 300; // years simulated (after SPIN warm-up years); keep a frame every 2 years; curvature smoothing passes
const X0 = -260, X1 = VW + 260, AMP = 14, LAM = 150;
const clampN = (x, a, b) => Math.min(b, Math.max(a, x));
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function resample(pts) { // equal spacing DS along the line
  const out = [pts[0].slice()];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let s = DS - carry;
    while (s <= L) { const f = s / L; out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); s += DS; }
    carry = L - (s - DS);
  }
  const last = pts[pts.length - 1], tail = out[out.length - 1];
  if (Math.hypot(last[0] - tail[0], last[1] - tail[1]) > DS * 0.4) out.push(last.slice()); else out[out.length - 1] = last.slice();
  return out;
}
function initial(seed) { // gently wavy channel that starts and ends well outside the view
  const r = rng(seed), ph = [r() * 6.28, r() * 6.28, r() * 6.28], pts = [];
  for (let x = X0; x <= X1; x += DS) {
    const taper = Math.min(1, (x - X0) / 120, (X1 - x) / 120), k = 2 * Math.PI * x / LAM;
    pts.push([x, YC + taper * AMP * (Math.sin(k + ph[0]) + 0.35 * Math.sin(k / 1.7 + ph[1]) + 0.2 * Math.sin(k / 0.63 + ph[2]))]);
  }
  return resample(pts);
}
function curvature(pts) { // signed, per unit; + = turning toward the right bank (screen y points down)
  const n = pts.length, c = new Array(n).fill(0);
  for (let i = 1; i < n - 1; i++) {
    const ax = pts[i][0] - pts[i - 1][0], ay = pts[i][1] - pts[i - 1][1], bx = pts[i + 1][0] - pts[i][0], by = pts[i + 1][1] - pts[i][1];
    const L = (Math.hypot(ax, ay) + Math.hypot(bx, by)) / 2 || 1;
    c[i] = Math.atan2(ax * by - ay * bx, ax * bx + ay * by) / L;
  }
  for (let p = 0; p < SMOOTH; p++) { const d = c.slice(); for (let i = 1; i < n - 1; i++) c[i] = (d[i - 1] + 2 * d[i] + d[i + 1]) / 4; }
  return c;
}
function lagged(c) { // what the banks feel: this bend plus the push still carried from upstream bends
  const n = c.length, out = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    let s = 0, w = 0;
    for (let k = 0; k < KMAX && i - k - 1 >= 0; k++) { s += WTS[k] * c[i - k - 1]; w += WTS[k]; }
    out[i] = OMEGA * c[i] + GAMMA * (w ? s / w : c[i]);
  }
  return out;
}
function normals(pts) { // unit normal to the RIGHT bank (looking downstream)
  const n = pts.length;
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const tx = b[0] - a[0], ty = b[1] - a[1], L = Math.hypot(tx, ty) || 1;
    return [-ty / L, tx / L];
  });
}
function bankShift(pts) { // per point: shift (units/yr) of the channel, + = toward the right bank; and the asymmetry a in [-0.75, 0.75]
  const c = curvature(pts), cl = lagged(c), nr = normals(pts), n = pts.length, m = new Array(n), a = new Array(n);
  for (let i = 0; i < n; i++) {
    const x = pts[i][0], y = pts[i][1];
    const ends = clampN(Math.min((x - X0) / 100, (X1 - x) / 100), 0, 1);
    let v = -RATE * clampN(cl[i] * W, -CAP, CAP) * ends; // a right turn (c > 0) pushes water to the LEFT (outer) bank
    if (nr[i][1] * v * (y - YC) > 0) v *= clampN((VH / 2 - 12 - Math.abs(y - YC)) / 30, 0, 1); // valley sides hold the river in
    m[i] = v;
    a[i] = clampN(-1.6 * cl[i] * W, -0.75, 0.75); // + = water piled toward the right bank
  }
  return { c, m, a, nr };
}
function step(pts, stats) {
  const n = pts.length, { c, m, nr } = bankShift(pts), out = new Array(n);
  for (let i = 0; i < n; i++) {
    out[i] = [pts[i][0] + nr[i][0] * m[i], pts[i][1] + nr[i][1] * m[i]];
    if (Math.abs(c[i] * W) > 0.04) { const w = Math.abs(m[i]) * DS; stats.all += w; if (m[i] * c[i] < 0) stats.outer += w; }
    if (pts[i][0] > 0 && pts[i][0] < VW) stats.peak = Math.max(stats.peak, Math.abs(m[i]));
  }
  out[0] = pts[0].slice(); out[n - 1] = pts[n - 1].slice();
  return resample(out);
}
function cutoff(pts) { // first neck where the river nearly meets itself → [new channel, abandoned loop] or null
  const n = pts.length, M = Math.ceil(5 * W / DS), N2 = NEAR * NEAR;

  xctx.strokeStyle = rgb(COL.c); xctx.lineWidth = 1.5; xctx.beginPath(); xctx.moveTo(X(-1), Y(0)); xctx.lineTo(X(1), Y(0)); xctx.stroke();
  const n = S.probe.n, d = depthAt(a, n);
  xctx.strokeStyle = rgb(COL.fg); xctx.lineWidth = 1.5; xctx.setLineDash([3, 3]); xctx.beginPath(); xctx.moveTo(X(n), Y(0)); xctx.lineTo(X(n), Y(d)); xctx.stroke(); xctx.setLineDash([]);
  xctx.fillStyle = rgb(COL.hl); xctx.strokeStyle = rgb(COL.fg); xctx.beginPath(); xctx.arc(X(n), Y(0) - 1, 5, 0, 7); xctx.fill(); xctx.stroke();
  xctx.font = `13px ${COL.font}`; xctx.textBaseline = "top"; xctx.fillStyle = rgb(COL.fg);
  if (Math.abs(a) > 0.2) {
    const deepRight = a > 0;
    xctx.textAlign = deepRight ? "right" : "left"; xctx.fillStyle = rgb(COL.no); xctx.fillText(P.t("lCliff"), deepRight ? w - 6 : 6, 3);
    xctx.textAlign = deepRight ? "left" : "right"; xctx.fillStyle = rgb(COL.b); xctx.fillText(P.t("lBar"), deepRight ? 6 : w - 6, 3);
  }
}

/* ---------- text panel ---------- */
const row = (dt, dd) => `<dt>${dt}</dt><dd>${dd}</dd>`;
const yr = (f) => f * EVERY;
function probeInfo() {
  const pts = frame(), i = Play.clamp(S.probe.i, 0, pts.length - 1), { a, m } = shiftOf(pts, S.seedI + ":" + (S.step < 2 ? 0 : S.f)), n = S.probe.n;
  const v = speedAt(a[i], n), d = depthAt(a[i], n), bend = Math.abs(a[i]) > 0.2, outerSide = Math.sign(a[i]);
  const w = !bend ? "wStraight" : Math.abs(n) < 0.3 ? "wMid" : Math.sign(n) === outerSide ? "wOuter" : "wInner";
  const mv = m[i], bank = Math.abs(mv) < 0.12 * RATE * CAP || Math.abs(n) < 0.3 ? "bCalm" : Math.sign(mv) === Math.sign(n) ? "bErode" : "bBuild";
  return { v, d, w, bank };
}
function houseText(h) {
  if (h.fall >= 0 && h.fall <= S.f) return P.t("hFell", { y: yr(h.fall) });
  const d = Math.max(0, nearest(SIM.frames[S.f], h.x, h.y).d - W / 2);
  return P.t("hStand", { d: Play.fmt(d * M_PER_U, 0), d0: Play.fmt(h.d0 * M_PER_U, 0) });
}
function legend() {
  const L = [];
  if (S.step >= 1) L.push(`<span><span class="grad"></span>${P.t("gSpeed")}</span>`);
  if (S.step >= 2) {
    L.push(`<span><span class="line" style="background:var(--no)"></span>${P.t("gErode")}</span>`, `<span><span class="line" style="background:var(--b)"></span>${P.t("gBuild")}</span>`);
    L.push(`<span><span class="sq" style="background:color-mix(in srgb, var(--b) 30%, var(--soft))"></span>${P.t("gLand")}</span>`, `<span><span class="line" style="background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)"></span>${P.t("gOld")}</span>`);
    if (OXV.some((o) => o.frame <= S.f)) L.push(`<span><span class="sq" style="background:color-mix(in srgb, var(--c) 55%, var(--soft))"></span>${P.t("gOx")}</span>`);
  }
  $("legend").innerHTML = L.join("");
}
let lastLive = "";
function text(liveMsg) {
  yearEl.value = S.f;
  $("yearVal").textContent = P.t("yearVal", { y: yr(S.f) });
  $("rowFlow").hidden = S.step === 0;
  $("rowYear").hidden = S.step < 2;
  $("xsWrap").hidden = S.step !== 1;
  $("flowBtn").textContent = P.t(S.flow ? "flowOn" : "flowOff");
  $("playBtn").textContent = P.t(S.playing ? "pause" : "play");
  let html = "", live = "";
  if (S.step === 1) {
    const q = probeInfo();
    html = row(P.t("rSpeed"), P.t("vSpeed", { v: Play.fmt(q.v, 2) })) + row(P.t("rDepth"), P.t("vDepth", { d: Play.fmt(q.d, 1) })) + row(P.t("rWhere"), P.t(q.w)) + row(P.t("rBank"), P.t(q.bank));
    live = P.t("liveProbe", { v: Play.fmt(q.v, 2), d: Play.fmt(q.d, 1), w: P.t(q.w) });
  }
  if (S.step >= 2) {
    const nox = OXV.filter((o) => o.frame <= S.f).length;
    html = row(P.t("rYear"), String(yr(S.f))) + row(P.t("rSin"), Play.fmt(SIM.sin[S.f], 2)) + row(P.t("rOx"), String(nox));
    S.houses.forEach((h, k) => (html += row(P.t("rH", { k: k + 1 }), houseText(h))));
    if (S.step === 3) html += row(P.t("rShare"), Number.isFinite(SIM.share[S.f]) ? P.t("pct", { p: Play.fmt(SIM.share[S.f], 0) }) : P.t("none"));
    live = liveMsg || (S.step === 3 ? P.t("liveRule") : P.t("liveYear", { y: yr(S.f) }));
  }
  $("read").innerHTML = html; $("read").hidden = !html;
  if (live !== lastLive) { Play.live($("live"), live); lastLive = live; }
  cv.setAttribute("aria-valuetext", live);
  legend();
  const last = SIM.frames.length - 1;
  $("resultMain").textContent = P.t("resultMain", { p: Play.fmt(SIM.share[last], 0), s: Play.fmt(SIM.sin[last], 1), n: OXV.length, lakes: P.t(OXV.length === 1 ? "oxOne" : "oxMany", { n: OXV.length }) });
  $("foot").textContent = P.t("foot", { r: Play.fmt(SIM.peak * M_PER_U, 1), u: Play.fmt(U0, 1), h: Play.fmt(MAXH, 1) });
}
function render(liveMsg) { text(liveMsg); draw(); if (S.step === 1) drawXS(); }

/* ---------- time + animation ---------- */
let raf = 0, lastT = 0, acc = 0;
function setFrame(f) {
  const old = S.f;
  S.f = Play.clamp(Math.round(f), 0, NF);
  let msg = "";
  S.houses.forEach((h, k) => { if (h.fall >= 0 && h.fall > old && h.fall <= S.f) msg = P.t("liveFell", { k: k + 1, y: yr(h.fall) }); });
  if (!msg && OXV.some((o) => o.frame > old && o.frame <= S.f)) msg = P.t("liveOx");
  return msg;
}
function loop(t) {
  raf = 0;
  const dt = lastT ? Math.min(60, t - lastT) : 16; lastT = t;
  let msg = "";
  if (S.playing && S.step >= 2) {
    acc += dt;
    while (acc >= 30) { acc -= 30; msg = setFrame(S.f + 1) || msg; if (S.f >= NF) { S.playing = false; break; } }
  }
  const moving = S.flow && S.step >= 1; // starts off when Play.reduced; the viewer can still switch it on
  if (moving) {
    const pts = frame(), { a } = shiftOf(pts, S.seedI + ":" + (S.step < 2 ? 0 : S.f)), span = Math.max(1, visIdx.hi - visIdx.lo);
    PARTS.forEach((p) => { const i = Play.clamp(Math.floor(visIdx.lo + p.s * span), 0, a.length - 1); p.s += 0.12 * dt / 16 * speedAt(a[i], p.n) / span; if (p.s >= 1) p.s -= 1; });
  }
  if (S.playing || msg) render(msg); else draw();
  if (moving || S.playing) raf = requestAnimationFrame(loop); else lastT = 0;
}
function kick() { if (!raf) raf = requestAnimationFrame(loop); }
$("playBtn").addEventListener("click", () => {
  if (S.playing) { S.playing = false; render(); return; }
  if (S.f >= NF) setFrame(0);
  if (Play.reduced) { const msg = setFrame(NF); render(msg); return; } // no animation: jump to the end
  S.playing = true; acc = 0; render(); kick();
});
yearEl.addEventListener("input", () => { S.playing = false; render(setFrame(+yearEl.value)); });
$("flowBtn").addEventListener("click", () => { S.flow = !S.flow; render(); kick(); });
$("newRiver").addEventListener("click", () => { S.playing = false; load((S.seedI + 1) % SEEDS.length); render(); });

/* ---------- pointer + keyboard ---------- */
function moveProbe(x, y) { const pts = frame(), q = nearest(pts, x, y); S.probe = { i: q.i, n: Play.clamp(q.off / (W / 2), -0.95, 0.95) }; }
function pickHouse(x, y) { let best = -1, bd = 22; S.houses.forEach((h, k) => { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = k; } }); return best; }
cv.addEventListener("pointerdown", (e) => {
  const [x, y] = toView(e);
  S.kb = false;
  if (S.step === 1) { S.drag = 9; moveProbe(x, y); }
  else if (S.step >= 2) { const k = pickHouse(x, y); if (k < 0) return; S.drag = k; S.sel = k; }
  else return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic or ended pointer */ }
  e.preventDefault(); render();
});
cv.addEventListener("pointermove", (e) => {
  if (S.drag < 0) return;
  const [x, y] = toView(e);
  if (S.drag === 9) moveProbe(x, y);
  else { const h = S.houses[S.drag]; h.x = Play.clamp(x, 8, VW - 8); h.y = Play.clamp(y, 10, VH - 8); h.fall = -2; }
  render();
});
function endDrag() { if (S.drag >= 0 && S.drag !== 9) { const h = S.houses[S.drag]; S.houses[S.drag] = house(h.x, h.y); } S.drag = -1; render(); }
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("keydown", (e) => {
  const dir = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (S.step === 1 && dir) {
    const pts = frame(), big = e.shiftKey ? 6 : 1;
    S.probe = { i: Play.clamp(S.probe.i + dir[0] * big * 2, visIdx.lo, visIdx.hi), n: Play.clamp(S.probe.n + dir[1] * 0.15, -0.95, 0.95) };
    S.probe.i = Play.clamp(S.probe.i, 0, pts.length - 1);
    S.kb = true; render(); e.preventDefault();
  } else if (S.step >= 2 && dir) {
    const h = S.houses[S.sel], st = e.shiftKey ? 15 : 4;
    S.houses[S.sel] = house(h.x + dir[0] * st, h.y + dir[1] * st); S.kb = true; render(); e.preventDefault();
  } else if (S.step >= 2 && (e.key === "Enter" || e.key === " ")) { S.sel = 1 - S.sel; S.kb = true; render(); e.preventDefault(); }
});
cv.addEventListener("blur", () => { if (S.kb) { S.kb = false; render(); } });

/* ---------- steps ---------- */
readColours();
load(0);
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }, { label: P.t("o4") }], right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  const k = i + 1;
  S.step = i;
  if (i < 2) S.playing = false;
  if (i === 3) { const first = OXV[0]; if (first && S.f < first.frame + 20) setFrame(Math.min(NF, first.frame + 20)); if (!first && S.f < NF / 2) setFrame(NF); }
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  render(); kick();
});
$("reset").addEventListener("click", () => {
  S.playing = false; S.flow = !Play.reduced; S.sel = 0; S.kb = false;
  load(0); pr.reset(); st.go(0);
});
function themeChange() { readColours(); swept.upTo = -1; render(); }
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeChange); } catch (e) { /* old browsers */ }
if ("ResizeObserver" in window) new ResizeObserver(() => { swept.upTo = -1; render(); }).observe(cv);
</script>
</body>
</html>

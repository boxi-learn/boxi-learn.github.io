  .read { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0 10px; font-size: 14px; }

</style>
</head>

  },

/* ---------- model (pure functions, no NaN at φ = ±90° or tilt = 0) ---------- */
const YEAR = 365, ECC = 0.0167, PERI = 3, APH = 185, TILT0 = 23.44, RAD = Math.PI / 180;
const decl = (N, tilt) => -tilt * Math.cos(2 * Math.PI * (N + 10) / YEAR);
const dist = (N) => (1 - ECC * ECC) / (1 + ECC * Math.cos(2 * Math.PI * (N - PERI) / YEAR)); // AU
const noonElev = (phi, d) => 90 - Math.abs(phi - d);
function halfDay(phi, d) { // sunrise hour angle H0 in [0, π]
  const num = -Math.sin(phi * RAD) * Math.sin(d * RAD), den = Math.cos(phi * RAD) * Math.cos(d * RAD);
  if (den < 1e-9) return num < -1e-12 ? Math.PI : num > 1e-12 ? 0 : Math.PI / 2;
  return Math.acos(Play.clamp(num / den, -1, 1));
}
const dayLen = (phi, d) => 24 * halfDay(phi, d) / Math.PI;
function daily(phi, d, r) { // whole-day sunlight, equator at equinox (1 AU) = 100
  const H = halfDay(phi, d);
  const q = H * Math.sin(phi * RAD) * Math.sin(d * RAD) + Math.cos(phi * RAD) * Math.cos(d * RAD) * Math.sin(H);
  return Math.max(0, 100 * q / (r * r));
}

/* ---------- state ---------- */
const $ = (id) => document.getElementById(id);
const dayEl = $("day"), latEl = $("lat"), tiltEl = $("tilt");
const S = { N: 172, phi: 40, tilt: TILT0 };
const MLEN = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const MONTHS = P.t("months").split(","), INI = P.t("ini").split(",");
function md(N) { let n = Math.round(N), m = 0; while (m < 11 && n > MLEN[m]) { n -= MLEN[m]; m++; } return [m, Math.max(1, n)]; }
const dateStr = (N) => { const [m, d] = md(N); return P.t("date", { m: MONTHS[m], d }); };
const latStr = (v) => (Math.abs(v) < 0.5 ? P.t("lat0") : P.t(v > 0 ? "latN" : "latS", { v: Math.round(Math.abs(v)) }));
const wrapN = (N) => ((Math.round(N) - 1) % YEAR + YEAR) % YEAR + 1;

/* ---------- top view ---------- */
const topv = $("top"), side = $("side"), chart = $("chart");
const TC = { x: 150, y: 128, a: 92 };
const theta = (N) => Math.PI + 2 * Math.PI * (N - 172) / YEAR; // Jun solstice on the left, counter-clockwise
function orbitXY(N, k = 1) { const r = dist(N) * TC.a * k, t = theta(N); return [TC.x + r * Math.cos(t), TC.y - r * Math.sin(t)]; }
function txt(parent, x, y, s, cls, anchor) {
  const t = Play.svg("text", { x, y, class: cls || "lb", "text-anchor": anchor || "start" }, parent);
  t.textContent = s;
  return t;
}
function drawTop() {
  topv.innerHTML = "";
  txt(topv, 8, 18, P.t("topTitle"), "lbf");
  let d = "";
  for (let N = 0; N <= YEAR; N += 3) { const [x, y] = orbitXY(N); d += (N ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }
  Play.svg("path", { d: d + "Z", fill: "none", stroke: "var(--line)", "stroke-width": 2 }, topv);
  [[PERI, "var(--no)"], [APH, "var(--c)"]].forEach(([N, c]) => { const [x, y] = orbitXY(N); Play.svg("circle", { cx: x, cy: y, r: 3.5, fill: c }, topv); });
  [[172, "mJun", "middle", 0, -16], [355, "mDec", "middle", 0, 26], [80, "mMar", "end", -16, 5], [264, "mSep", "end", -16, 5]].forEach(([N, k, an, dx, dy]) => {
    const [x, y] = orbitXY(N); txt(topv, x + dx, y + dy, P.t(k), "lb", an);
  });
  Play.svg("circle", { cx: TC.x, cy: TC.y, r: 15, fill: "var(--hl)" }, topv);
  const [ex, ey] = orbitXY(S.N), t = theta(S.N);
  // Earth: day side faces the Sun
  const ux = -Math.cos(t), uy = Math.sin(t); // unit vector Earth → Sun (screen)
  const g = Play.svg("g", {}, topv);
  Play.svg("circle", { cx: ex, cy: ey, r: 10, fill: "var(--c)" }, g);
  const px = -uy * 10, py = ux * 10; // perpendicular
  // night half: the arc that bulges away from the Sun (through E − u·10)
  const sweep = px * -uy - py * -ux < 0 ? 1 : 0;
  Play.svg("path", { d: `M${ex + px} ${ey + py} A10 10 0 0 ${sweep} ${ex - px} ${ey - py} Z`, fill: "var(--fg)", opacity: 0.45 }, g);
  // north-pole lean: fixed direction in space (toward the Sun at the June solstice = screen right)
  const L = 28 * Math.sin(S.tilt * RAD);
  if (L > 1) {
    Play.svg("line", { x1: ex, y1: ey, x2: ex + L, y2: ey, stroke: "var(--fg)", "stroke-width": 2.5, "stroke-linecap": "round" }, g);
    txt(g, ex + L + 4, ey + 4, P.t("north"), "lbf halo");
  }
  Play.svg("circle", { cx: ex, cy: ey, r: 20, fill: "transparent" }, g); // larger touch target
  txt(topv, TC.x, 264, P.t("peri"), "lb", "middle");
  topv.setAttribute("aria-valuemin", 1); topv.setAttribute("aria-valuemax", YEAR);
  topv.setAttribute("aria-valuenow", S.N); topv.setAttribute("aria-valuetext", dateStr(S.N));
}

/* ---------- side view (Sun to the left, axis leans toward it by δ) ---------- */
const SC = { x: 176, y: 132, R: 76 };
function drawSide(d) {
  side.innerHTML = "";
  const { x: cx, y: cy, R } = SC, dr = d * RAD, pr = S.phi * RAD;
  const uN = [-Math.sin(dr), -Math.cos(dr)], uE = [-Math.cos(dr), Math.sin(dr)]; // north, equator toward Sun
  const at = (lat, sgn) => [cx + R * (Math.cos(lat) * uE[0] * sgn + Math.sin(lat) * uN[0]), cy + R * (Math.cos(lat) * uE[1] * sgn + Math.sin(lat) * uN[1])];
  txt(side, 8, 18, P.t("sideTitle"), "lbf");
  for (let y = cy - R + 10; y <= cy + R - 10; y += 15) {
    const xs = cx - Math.sqrt(R * R - (y - cy) * (y - cy));
    Play.svg("line", { x1: 6, y1: y, x2: xs, y2: y, stroke: "var(--hl)", "stroke-width": Math.abs(y - cy) < 8 ? 2.4 : 1.2, opacity: 0.85 }, side);
  }
  txt(side, 8, cy - R - 8, P.t("sunlight") + " →", "lb");
  Play.svg("circle", { cx, cy, r: R, fill: "var(--c)", opacity: 0.25, stroke: "var(--c)", "stroke-width": 1.5 }, side);
  Play.svg("path", { d: `M${cx} ${cy - R} A${R} ${R} 0 0 1 ${cx} ${cy + R} Z`, fill: "var(--fg)", opacity: 0.28 }, side);
  const [e1, e2] = [at(0, 1), at(0, -1)];
  Play.svg("line", { x1: e1[0], y1: e1[1], x2: e2[0], y2: e2[1], stroke: "var(--muted)", "stroke-dasharray": "4 4", "stroke-width": 1.2 }, side);
  const n1 = [cx + uN[0] * (R + 16), cy + uN[1] * (R + 16)], n2 = [cx - uN[0] * (R + 16), cy - uN[1] * (R + 16)];
  Play.svg("line", { x1: n2[0], y1: n2[1], x2: n1[0], y2: n1[1], stroke: "var(--fg)", "stroke-width": 2 }, side);
  txt(side, n1[0] + uN[0] * 8, n1[1] + uN[1] * 8 + 4, P.t("north"), "lbf halo", "middle");
  const a = at(pr, 1), b = at(pr, -1);
  Play.svg("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "var(--b)", "stroke-width": 3, "stroke-linecap": "round" }, side);
  Play.svg("circle", { cx: a[0], cy: a[1], r: 5, fill: "var(--b)", stroke: "var(--surface)", "stroke-width": 1.5 }, side);
  const el = noonElev(S.phi, d);
  const lab = el > -0.05 ? P.t("sunAt", { e: Play.fmt(Math.max(0, el), 0) }) : P.t("noSun");
  txt(side, a[0] - 10, a[1] + 4, lab, "lbf halo", "end");
  txt(side, 150, 264, P.t("latCap", { lat: latStr(S.phi) }), "lb", "middle");
}

/* ---------- chart: day length over the year ---------- */
const CH = { l: 30, r: 332, t: 44, b: 160 };
const cxN = (N) => CH.l + (CH.r - CH.l) * (N - 1) / (YEAR - 1), cyH = (h) => CH.b - (CH.b - CH.t) * h / 24;
function drawChart() {
  chart.innerHTML = "";
  txt(chart, CH.l, 14, P.t("chartTitle", { lat: latStr(S.phi) }), "lbf");
  [0, 6, 12, 18, 24].forEach((h) => {
    Play.svg("line", { x1: CH.l, x2: CH.r, y1: cyH(h), y2: cyH(h), stroke: "var(--line)", "stroke-width": 1 }, chart);
    txt(chart, CH.l - 5, cyH(h) + 4, String(h), "lb", "end");
  });
  let start = 1;
  for (let m = 0; m < 12; m++) {
    if (m % 2 === 0 || P.lang === "en") txt(chart, cxN(start + MLEN[m] / 2), CH.b + 16, INI[m], "lb", "middle");
    start += MLEN[m];
  }
  [[PERI, "closest", "var(--no)", "start"], [APH, "farthest", "var(--c)", "middle"]].forEach(([N, k, c, an]) => {
    Play.svg("line", { x1: cxN(N), x2: cxN(N), y1: CH.t - 8, y2: CH.b, stroke: c, "stroke-dasharray": "3 3", "stroke-width": 1.2 }, chart);
    txt(chart, cxN(N) + (an === "start" ? 2 : 0), CH.t - 12, P.t(k), "lb", an);
  });
  let d = "";
  for (let N = 1; N <= YEAR; N += 2) d += (N > 1 ? "L" : "M") + cxN(N).toFixed(1) + " " + cyH(dayLen(S.phi, decl(N, S.tilt))).toFixed(1);
  Play.svg("path", { d, fill: "none", stroke: "var(--a)", "stroke-width": 2.5, "stroke-linejoin": "round" }, chart);
  const h = dayLen(S.phi, decl(S.N, S.tilt));
  Play.svg("line", { x1: cxN(S.N), x2: cxN(S.N), y1: CH.t, y2: CH.b, stroke: "var(--fg)", "stroke-width": 1, opacity: 0.5 }, chart);
  Play.svg("circle", { cx: cxN(S.N), cy: cyH(h), r: 5, fill: "var(--a)", stroke: "var(--surface)", "stroke-width": 2 }, chart);
  txt(chart, CH.r, 14, Play.fmt(h, 1) + " " + P.t("hrs"), "lbf", "end");
}

/* ---------- readout ---------- */
function dayText(h) {
  if (h >= 23.99) return P.t("vDay24");
  if (h <= 0.01) return P.t("vDay0");
  let H = Math.floor(h), M = Math.round((h - H) * 60);
  if (M === 60) { H++; M = 0; }
  return P.t("vDay", { h: H, m: M });
}
function render() {
  const d = decl(S.N, S.tilt), r = dist(S.N), el = noonElev(S.phi, d), h = dayLen(S.phi, d);
  dayEl.value = S.N; latEl.value = S.phi; tiltEl.value = S.tilt;
  $("dayVal").textContent = dateStr(S.N);
  $("latVal").textContent = latStr(S.phi);
  $("tiltVal").textContent = P.t("deg", { v: Play.fmt(S.tilt, S.tilt % 1 ? 2 : 0) });
  drawTop(); drawSide(d); drawChart();
  const p = (r - 1) * 100;
  $("oDate").textContent = dateStr(S.N);
  $("oDist").textContent = P.t("vDist", { r: Play.fmt(r, 3), p: (p >= 0 ? "+" : "−") + Play.fmt(Math.abs(p), 1) + "%" });
  $("oElev").textContent = el > -0.05 ? P.t("vElev", { e: Play.fmt(Math.max(0, el), 1) }) : P.t("vBelow");
  $("oDay").textContent = dayText(h);
  $("oNoon").textContent = P.t("vNoon", { s: Play.fmt(100 * Math.max(0, Math.sin(el * RAD)), 0) });
  $("oDaily").textContent = P.t("vDaily", { q: Play.fmt(daily(S.phi, d, r), 0) });
  let note = P.t("liveSum", { date: dateStr(S.N), lat: latStr(S.phi), e: el > -0.05 ? Play.fmt(Math.max(0, el), 0) + "°" : "—", d: dayText(h) });
  const lean = d * Math.sign(S.phi); // >0: this hemisphere leans toward the Sun
  if (S.tilt < 0.5) note += " " + P.t("noteFlat");
  else if (Math.abs(S.phi) >= 15 && r < 0.986 && lean < -15) note += " " + P.t("noteClose");
  else if (Math.abs(S.phi) >= 15 && r > 1.014 && lean > 15) note += " " + P.t("noteFar");
  Play.live($("live"), note);
}

/* ---------- interaction ---------- */
let anim = 0, last = 0;
const playBtn = $("playBtn");
function stop() { if (anim) cancelAnimationFrame(anim); anim = 0; playBtn.textContent = P.t("play"); }
function tick(ts) {
  if (last) S.N = wrapN(S.N + Math.max(1, Math.round((ts - last) * 0.03)));
  last = ts; render(); anim = requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => { if (anim) stop(); else { last = 0; playBtn.textContent = P.t("pause"); anim = requestAnimationFrame(tick); } });

function fromPointer(e) {
  const p = Play.pointer(topv, e);
  const t = Math.atan2(TC.y - p.y, p.x - TC.x);
  S.N = wrapN(172 + (t - Math.PI) * YEAR / (2 * Math.PI));
  render();
}
let dragging = false;
topv.addEventListener("pointerdown", (e) => { stop(); dragging = true; topv.setPointerCapture(e.pointerId); fromPointer(e); });
topv.addEventListener("pointermove", (e) => { if (dragging) fromPointer(e); });
topv.addEventListener("pointerup", () => (dragging = false));
topv.addEventListener("pointercancel", () => (dragging = false));
topv.addEventListener("keydown", (e) => {
  const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 30, PageDown: -30 }[e.key];
  if (step) { stop(); S.N = wrapN(S.N + step * (e.shiftKey ? 10 : 1)); render(); e.preventDefault(); }
});
dayEl.addEventListener("input", () => { stop(); S.N = Play.clamp(+dayEl.value, 1, YEAR); render(); });
latEl.addEventListener("input", () => { S.phi = Play.clamp(+latEl.value, -90, 90); render(); });
tiltEl.addEventListener("input", () => { S.tilt = Play.clamp(+tiltEl.value, 0, 40); render(); });
tiltEl.addEventListener("keydown", (e) => { // whole degrees from the keyboard
  const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 5, PageDown: -5 }[e.key];
  if (step) { S.tilt = Play.clamp(Math.round(S.tilt) + step, 0, 40); render(); e.preventDefault(); }
});
document.querySelectorAll("[data-lat]").forEach((b) => b.addEventListener("click", () => { S.phi = +b.dataset.lat; render(); }));
$("tEarth").addEventListener("click", () => { S.tilt = TILT0; render(); });
$("tZero").addEventListener("click", () => { S.tilt = 0; render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
});
$("reset").addEventListener("click", () => { stop(); Object.assign(S, { N: 172, phi: 40, tilt: TILT0 }); pr.reset(); st.go(0); render(); });
stop();
render();
</script>
</body>
</html>

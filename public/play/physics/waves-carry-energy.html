/* SIM-BEGIN — pure physics, no DOM (tests extract this block) */
const G = 9.81, VIEW = 6;                       // metres of medium shown
const F_RANGE = { rope: [0.25, 2], spring: [0.25, 2], water: [0.5, 1] }, L_RANGE = [0.5, 4];
const lamWater = (f) => G / (2 * Math.PI * f * f);                // deep-water dispersion ω² = g·k
function amp(mode, lam) {
  const k = 2 * Math.PI / lam;
  if (mode === "rope") return 0.45;
  if (mode === "spring") return Math.min(0.3, 0.6 / k);           // kA ≤ 0.6: coils never cross
  return Math.min(0.35, 0.4 / k);                                  // water: steep but not breaking
}
// Displacement of the bit whose rest position is (x0, z) at time t. Rope/spring start from rest at t = 0.
function disp(mode, x0, z, t, f, lam) {
  const w = 2 * Math.PI * f, k = 2 * Math.PI / lam, A = amp(mode, lam);
  if (mode === "water") {
    const ph = k * x0 - w * t, e = Math.exp(k * z);
    return { dx: -A * e * Math.sin(ph), dy: A * e * Math.cos(ph) };
  }
  if (x0 > f * lam * t) return { dx: 0, dy: 0 };                   // the front has not arrived
  const s = A * Math.sin(w * t - k * x0);
  return mode === "rope" ? { dx: 0, dy: s } : { dx: s, dy: 0 };
}
// Leading crest (rope), squeeze (spring) or crest (water) inside [0, VIEW]; null if none.
function leadCrest(mode, t, f, lam) {
  const v = f * lam;
  if (mode === "water") {                                          // crests where kx − ωt = 2πn
    const x = VIEW - (((VIEW - v * t) % lam) + lam) % lam;
    return x >= 0 ? x : null;
  }
  const first = v * t - (mode === "rope" ? lam / 4 : lam);         // rope: phase π/2; spring: phase 2π
  if (first < 0) return null;
  const n = Math.max(0, Math.ceil((first - VIEW) / lam));
  const x = first - n * lam;
  return x >= 0 ? x : null;
}
// Lock the speed: move f (or λ), keep v = fλ, stay inside both slider ranges.
function lockFit(v, f, lam, moved, fr) {
  const fmin = Math.max(fr[0], v / L_RANGE[1]), fmax = Math.min(fr[1], v / L_RANGE[0]);
  let ff = moved === "f" ? f : v / lam;
  ff = Math.min(fmax, Math.max(fmin, ff));
  return { f: ff, lam: v / ff };
}
const soundSpeed = (c) => 331.3 * Math.sqrt(1 + c / 273.15);
const echoDist = (v, t) => v * t / 2;
const swellLam = (T) => G * T * T / (2 * Math.PI);
/* SIM-END */

const $ = (id) => document.getElementById(id);
const scene = $("scene"), sv = Play.svg;
const X0 = 30, S = 90;                                             // px for x = 0, px per metre
const BASE = { rope: 165, spring: 165, water: 100 };
const sx = (x) => X0 + S * x;
const f2 = (x) => Play.fmt(x, 2);
let mode = "water", f = 0.7, lam = lamWater(0.7), t = 0, playing = false, raf = 0, last = 0, speed = 1, lock = false, vLock = 2;
let sel = { i: 8, row: 0 }, trail = [], maxD = 0, prevFront = 0, lastLive = "";

/* ---------- particles ---------- */
function rests() {
  const out = [];
  if (mode === "water") { for (let r = 0; r <= 4; r++) for (let i = 0; i <= 12; i++) out.push({ i, row: r, x0: i * 0.5, z: -r * 0.5 }); }
  else for (let i = 0; i <= 48; i++) out.push({ i, row: 0, x0: i * 0.125, z: 0 });
  return out;
}
const restOf = (s) => (mode === "water" ? { x0: s.i * 0.5, z: -s.row * 0.5 } : { x0: s.i * 0.125, z: 0 });
function posPx(x0, z) {
  const d = disp(mode, x0, z, t, f, lam);
  return { x: sx(x0 + d.dx), y: BASE[mode] - S * (z + d.dy), d };
}

/* ---------- controls ---------- */
const MODES = [["rope", "mRope"], ["spring", "mSpring"], ["water", "mWater"]];
$("modes").innerHTML = MODES.map(([m, k]) => `<button type="button" data-m="${m}">${P.t(k)}</button>`).join("");
$("modes").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.m)));
function setMode(m) {
  mode = m;
  const fr = F_RANGE[m];
  $("fS").min = fr[0] * 100; $("fS").max = fr[1] * 100; $("fS").step = m === "water" ? 2 : 5;
  if (m === "water") { f = Play.clamp(f, fr[0], fr[1]); lam = lamWater(f); }
  else { if (!(lam >= L_RANGE[0] && lam <= L_RANGE[1])) lam = 2; f = Play.clamp(f, fr[0], fr[1]); }
  sel = m === "water" ? { i: 8, row: 0 } : { i: 32, row: 0 };
  vLock = f * lam;
  restart();
}
$("fS").addEventListener("input", () => {
  const nf = Play.clamp(+$("fS").value / 100, F_RANGE[mode][0], F_RANGE[mode][1]);
  if (mode === "water") { f = nf; lam = lamWater(f); }
  else if (lock) ({ f, lam } = lockFit(vLock, nf, lam, "f", F_RANGE[mode]));
  else f = nf;
  restart();
});
$("lS").addEventListener("input", () => {
  if (mode === "water") return;
  const nl = Play.clamp(+$("lS").value / 10, L_RANGE[0], L_RANGE[1]);
  if (lock) ({ f, lam } = lockFit(vLock, f, nl, "l", F_RANGE[mode]));
  else lam = nl;
  restart();
});
$("lock").addEventListener("change", () => { lock = $("lock").checked; vLock = f * lam; syncControls(); });
$("play").addEventListener("click", () => (playing ? pause() : start()));
$("restart").addEventListener("click", () => restart());
$("speed").addEventListener("change", () => { speed = +$("speed").value || 1; });
function start() { playing = true; last = 0; raf = requestAnimationFrame(tick); syncPlay(); }
function pause() { playing = false; cancelAnimationFrame(raf); syncPlay(); }
function syncPlay() { $("play").textContent = P.t(playing ? "pause" : "play"); }
function say(msg) { if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); } }
function syncControls() {
  $("modes").querySelectorAll("button").forEach((b) => { const on = b.dataset.m === mode; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  $("fS").value = Math.round(f * 100); $("fV").textContent = f2(f) + " Hz";
  $("lS").value = Math.round(Play.clamp(lam, L_RANGE[0], L_RANGE[1]) * 10); $("lV").textContent = f2(lam) + " " + P.t("unitM");
  $("lS").disabled = mode === "water"; $("lock").disabled = mode === "water";
  $("lockBox").lastElementChild.textContent = P.t(mode === "water" ? "lockWater" : "lockLabel");
  $("lockBox").firstElementChild.hidden = mode === "water";
  $("cap").textContent = P.t({ rope: "capRope", spring: "capSpring", water: "capWater" }[mode]);
}

/* ---------- pick a bit: tap, or arrow keys on the figure ---------- */
scene.addEventListener("pointerdown", (e) => {
  const p = Play.pointer(scene, e);
  let best = null, bd = Infinity;
  rests().forEach((r) => {
    const q = posPx(r.x0, r.z), d = mode === "water" ? Math.hypot(q.x - p.x, q.y - p.y) : Math.abs(q.x - p.x);
    if (d < bd) { bd = d; best = r; }
  });
  if (best && bd < 40) { select(best.i, best.row); e.preventDefault(); }
});
scene.addEventListener("keydown", (e) => {
  const nI = mode === "water" ? 12 : 48, nR = mode === "water" ? 4 : 0;
  const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (m) { select(Play.clamp(sel.i + m[0], 0, nI), Play.clamp(sel.row + m[1], 0, nR)); e.preventDefault(); }
  if (e.key === " " || e.key === "Enter") { $("play").click(); e.preventDefault(); }
});
function select(i, row) {
  sel = { i, row }; trail = []; maxD = 0;
  const r = restOf(sel);
  say(P.t("liveSel", { x: f2(r.x0), d: mode === "water" && r.z < 0 ? P.t("depth", { z: Play.fmt(-r.z, 1) }) : "" }));
  draw();
}

/* ---------- time ---------- */
function restart() {
  t = 0; prevFront = 0; trail = []; maxD = 0;
  syncControls(); draw(); syncPlay(); drawRule();
}
function tick(ts) {
  if (!playing) return;
  if (last) {
    t += Math.min(0.1, (ts - last) / 1000) * speed;
    const front = f * lam * t, r = restOf(sel);
    if (mode !== "water" && prevFront < r.x0 && front >= r.x0 && r.x0 > 0) say(P.t("liveArrive", { t: f2(r.x0 / (f * lam)), x: f2(r.x0), v: f2(f * lam) }));
    prevFront = front;
  }
  last = ts;
  draw();
  raf = requestAnimationFrame(tick);
}

/* ---------- drawing ---------- */
function draw() {
  scene.innerHTML = "";
  const B = BASE[mode], A = amp(mode, lam), v = f * lam;
  // ruler 0 … 6 m
  sv("line", { class: "ax", x1: sx(0), y1: 296, x2: sx(VIEW), y2: 296 }, scene);
  for (let m = 0; m <= VIEW; m++) {
    sv("line", { class: "tick", x1: sx(m), y1: 290, x2: sx(m), y2: 302 }, scene);
    sv("text", { class: "lbl", x: sx(m), y: 324, "text-anchor": "middle" }, scene).textContent = m === VIEW ? m + " " + P.t("unitM") : m;
  }
  const R = rests();
  if (mode === "water") {
    const surf = [];
    for (let x = -0.5; x <= VIEW + 0.5 + 1e-9; x += 0.05) { const q = posPx(x, 0); surf.push(q.x.toFixed(1) + "," + q.y.toFixed(1)); }
    sv("polygon", { class: "sea", points: `${sx(-0.5)},282 ${surf.join(" ")} ${sx(VIEW + 0.5)},282` }, scene);
    sv("polyline", { class: "surf", points: surf.join(" ") }, scene);
    R.forEach((r) => { const q = posPx(r.x0, r.z); sv("circle", { class: "pt", cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: 4.5 }, scene); });
  } else if (mode === "rope") {
    const pts = R.map((r) => posPx(r.x0, 0));
    sv("polyline", { class: "rope", points: pts.map((q) => q.x.toFixed(1) + "," + q.y.toFixed(1)).join(" ") }, scene);
    pts.forEach((q) => sv("circle", { class: "pt", cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: 3.5 }, scene));
  } else {
    R.forEach((r) => { const q = posPx(r.x0, 0); sv("line", { class: "coil", x1: q.x.toFixed(1), y1: B - 42, x2: q.x.toFixed(1), y2: B + 42 }, scene); });
  }
  // wave source label, front, leading crest and one wavelength
  if (mode !== "water") {
    sv("text", { class: "lbl", x: 6, y: 245 }, scene).textContent = P.t("src");
    const fx = v * t;
    if (fx > 0 && fx < VIEW) {
      sv("line", { class: "front", x1: sx(fx), y1: 64, x2: sx(fx), y2: 262 }, scene);
      sv("text", { class: "lblB", x: sx(fx), y: 284, "text-anchor": fx > VIEW - 0.6 ? "end" : "middle" }, scene).textContent = P.t("frontL");
    }
  }
  const cx = leadCrest(mode, t, f, lam);
  if (cx !== null) {
    const top = mode === "rope" ? B - S * A - 12 : mode === "spring" ? B - 50 : posPx(cx, 0).y - 10;
    const px = mode === "spring" ? sx(cx + disp(mode, cx, 0, t, f, lam).dx) : sx(cx);
    sv("polygon", { class: "crest", points: `${px - 9},${top - 14} ${px + 9},${top - 14} ${px},${top}` }, scene);
    const by = Math.max(30, top - 44);
    sv("text", { class: "lblA", x: px > 480 ? px - 14 : px + 14, y: top - 2, "text-anchor": px > 480 ? "end" : "start" }, scene).textContent = P.t(mode === "spring" ? "squeezeL" : "crestL");
    const bx = cx - lam;
    if (bx >= 0 && (mode === "water" || bx <= v * t)) {
      const x1 = sx(bx), x2 = sx(cx), yb = Math.min(by, 52);
      sv("path", { class: "brk", d: `M${x1},${yb + 8} V${yb} H${x2} V${yb + 8}` }, scene);
      sv("text", { class: "lblA", x: (x1 + x2) / 2, y: yb - 6, "text-anchor": "middle" }, scene).textContent = "λ = " + f2(lam) + " " + P.t("unitM");
    }
  }
  // the marked bit: home cross, trail, dot
  const r = restOf(sel), hx = sx(r.x0), hy = B - S * r.z, q = posPx(r.x0, r.z);
  const dist = Math.hypot(q.d.dx, q.d.dy);
  maxD = Math.max(maxD, dist);
  if (playing) { trail.push(q.x.toFixed(1) + "," + q.y.toFixed(1)); if (trail.length > 400) trail.shift(); }
  if (trail.length > 1) sv("polyline", { class: "trail", points: trail.join(" ") }, scene);
  sv("path", { class: "home", d: `M${hx - 7},${hy} H${hx + 7} M${hx},${hy - 7} V${hy + 7}` }, scene);
  if (mode === "spring") sv("line", { class: "markL", x1: q.x.toFixed(1), y1: B - 46, x2: q.x.toFixed(1), y2: B + 46 }, scene);
  else sv("circle", { class: "mark", cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: 8 }, scene);
  drawReadout(r, dist);
}
function drawReadout(r, dist) {
  const v = f * lam, M = " " + P.t("unitM");
  const row = (k, val, key) => `<tr${key ? ' class="key"' : ""}><td>${P.t(k)}</td><td>${val}</td></tr>`;
  const arrived = mode === "water" || v * t >= r.x0;
  $("readout").innerHTML =
    row("rF", f2(f) + " Hz") + row("rT", f2(1 / f) + " s") + row("rL", f2(lam) + M) + row("rV", f2(v) + " m/s", true) +
    row("rt", Play.fmt(t, 1) + " s") + row("rGo", f2(v * t) + M, true) +
    row("rHome", f2(r.x0) + M + (r.z < 0 ? " · z = " + Play.fmt(r.z, 1) + M : "")) +
    row("rNow", arrived ? f2(dist) + M : P.t("notYet")) + row("rMax", f2(maxD) + M, true);
}

/* ---------- step 3: the rule, with sound and swell ---------- */
let soundState = { c: 20, fHz: 440, e: 1 };
const pitchOf = (u) => 20 * Math.pow(1000, u / 1000);             // slider 0…1000 → 20 Hz … 20 kHz
const uOf = (fHz) => Math.round(1000 * Math.log(fHz / 20) / Math.log(1000));
function drawRule() {
  const box = $("rule");
  if (!stp || stp.i !== 2) { box.innerHTML = ""; return; }
  if (!box.firstChild) {
    box.innerHTML = "<p>" + P.t("ruleMain") + '</p><p id="ruleNow"></p><p id="ruleDeep"></p>' +
      "<h3>" + P.t("soundH") + "</h3>" +
      `<span class="pair"><label for="tc">${P.t("tempL")}</label><input type="range" id="tc" min="-20" max="40" step="1"><span class="val" id="tcV"></span></span>` +
      '<p id="sV"></p>' +
      `<span class="pair"><label for="pf">${P.t("pitchL")}</label><input type="range" id="pf" min="0" max="1000" step="1"><span class="val" id="pfV"></span></span>` +
      `<p><button type="button" class="small" id="a440">${P.t("a440")}</button></p><p id="sL"></p>` +
      `<span class="pair"><label for="ec">${P.t("echoL")}</label><input type="range" id="ec" min="10" max="300" step="5"><span class="val" id="ecV"></span></span>` +
      '<p id="sE"></p><h3>' + P.t("swellH") + '</h3><p id="sw"></p>';
    $("tc").value = soundState.c; $("pf").value = uOf(soundState.fHz); $("ec").value = Math.round(soundState.e * 100);
    $("tc").addEventListener("input", () => { soundState.c = Play.clamp(+$("tc").value, -20, 40); fillSound(); });
    $("pf").addEventListener("input", () => { soundState.fHz = pitchOf(Play.clamp(+$("pf").value, 0, 1000)); fillSound(); });
    $("ec").addEventListener("input", () => { soundState.e = Play.clamp(+$("ec").value / 100, 0.1, 3); fillSound(); });
    $("a440").addEventListener("click", () => { soundState.fHz = 440; $("pf").value = uOf(440); fillSound(); });
    fillSound();
  }
  const v = f * lam;
  $("ruleNow").textContent = P.t("ruleNow", { l: f2(lam), T: f2(1 / f), v: f2(v), f: f2(f) });
  $("ruleDeep").innerHTML = mode === "water" ? P.t("ruleDeep", { p: Play.fmt(Math.exp(-Math.PI) * 100, 1) }) : "";
}
function fillSound() {
  const s = soundState, v = soundSpeed(s.c), fHz = s.fHz, l = v / fHz;
  const fTxt = Play.fmt(fHz, fHz >= 100 ? 0 : 1);
  const lTxt = l >= 0.5 ? f2(l) + " " + P.t("unitM") : Play.fmt(l * 100, l < 0.1 ? 2 : 1) + " " + P.t("unitCm");
  $("tcV").textContent = String(s.c).replace("-", "−") + " °C"; $("pfV").textContent = fTxt + " Hz"; $("ecV").textContent = Play.fmt(s.e, 2) + " s";
  $("sV").textContent = P.t("soundV", { c: String(s.c).replace("-", "−"), v: Play.fmt(v, 1) });
  $("sL").textContent = P.t("soundL", { f: fTxt, l: lTxt });
  $("sE").textContent = P.t("echoD", { t: Play.fmt(s.e, 2), d: Play.fmt(echoDist(v, s.e), 0) });
  const T = 10, L = swellLam(T), vs = L / T;
  $("sw").textContent = P.t("swell", { T, l: Play.fmt(L, 0), v: Play.fmt(vs, 1), k: Play.fmt(vs * 3.6, 0) });
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
});
let stp = null;
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("readout").hidden = i === 2;
  $("rule").innerHTML = "";
  drawRule();
});
function resetAll() {
  pause();
  speed = 1; $("speed").value = "1"; lock = false; $("lock").checked = false;
  f = 0.7; lam = 2; soundState = { c: 20, fHz: 440, e: 1 };
  lastLive = ""; $("live").textContent = "";
  pr.reset(); stp.go(0); setMode("water");
}
$("reset").addEventListener("click", resetAll);
resetAll();
// No autoplay (with or without Play.reduced): the reader predicts first, then presses Play.
</script>
</body>
</html>

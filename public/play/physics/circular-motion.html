/* SIM-BEGIN — pure kinematics, no DOM (tests extract this block) */
const LIM = 3.6;                                  // flight ends this far from the pin (m): off the picture
const num = (x, a, b, d) => (Number.isFinite(x) ? Math.min(b, Math.max(a, x)) : d);
const omega = (v, r) => num(v, 0.1, 100, 1) / num(r, 0.05, 100, 1);
const force = (m, v, r) => num(m, 0, 100, 0) * num(v, 0, 100, 0) ** 2 / num(r, 0.05, 100, 1);
const lapTime = (v, r) => 2 * Math.PI / omega(v, r);
const dotGap = (v, r) => lapTime(v, r) / 16;
const flightTime = (v, r) => Math.sqrt(Math.max(0, LIM * LIM - num(r, 0, LIM, 1) ** 2)) / num(v, 0.1, 100, 1);
const wrap = (a) => { const t = 2 * Math.PI; return ((a % t) + t) % t; };
// state: {v, r, th0 (angle at t = 0), cut: null | {tc, th}}
function angleAt(s, t) { return s.th0 + omega(s.v, s.r) * t; }
function posAt(s, t) {
  if (!s.cut || t <= s.cut.tc) {
    const th = angleAt(s, t);
    return { x: s.r * Math.cos(th), y: s.r * Math.sin(th), vx: -s.v * Math.sin(th), vy: s.v * Math.cos(th), on: true, th };
  }
  const th = s.cut.th, u = Math.min(t - s.cut.tc, flightTime(s.v, s.r));
  return { x: s.r * Math.cos(th) - s.v * u * Math.sin(th), y: s.r * Math.sin(th) + s.v * u * Math.cos(th), vx: -s.v * Math.sin(th), vy: s.v * Math.cos(th), on: false, th, u };
}
// angle of the frame that turns with the string (the string points straight up in it)
const frameAngle = (s, t) => angleAt(s, t) - Math.PI / 2;
const turn = (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a) });
// first time ≥ t0 at which the ball is at the top (θ ≡ 90°)
function nextTop(s, t0) {
  const w = omega(s.v, s.r), n = Math.ceil((angleAt(s, t0) - Math.PI / 2) / (2 * Math.PI) - 1e-12);
  return Math.max(t0, (Math.PI / 2 + 2 * Math.PI * n - s.th0) / w);
}
// does the straight flight from angle th pass within tol of target T? returns miss distance (m), 0 = hit
function missBy(r, th, T, tol) {
  const px = r * Math.cos(th), py = r * Math.sin(th), dx = -Math.sin(th), dy = Math.cos(th);
  const wx = T.x - px, wy = T.y - py, along = wx * dx + wy * dy;
  const d = along > 0 ? Math.abs(wx * dy - wy * dx) : Math.hypot(wx, wy);
  return d <= tol ? 0 : d - tol;
}
// cut angle whose tangent (anticlockwise motion) points straight at T
function bestAngle(r, T) {
  const D = Math.hypot(T.x, T.y);
  if (!(D > r)) return NaN;
  return wrap(Math.atan2(T.y, T.x) - Math.acos(r / D));
}
/* SIM-END */

const $ = (id) => document.getElementById(id);
const sv = Play.svg;
const CX = 300, CY = 230, SC = 110;
const X = (p) => CX + p.x * SC, Y = (p) => CY - p.y * SC;
const TGT = { x: 2.1, y: 1.3 }, TOL = 0.16;
const DEF = { v: 3, r: 1, m: 0.2 };
const S = { v: DEF.v, r: DEF.r, m: DEF.m, th0: -Math.PI / 2, cut: null, t: 0, playing: false, slow: 0.5, rot: false, armTop: false, shotDone: false };
let raf = 0, last = 0, step = 0, lastLive = "", pick = -1;
const f2 = (x) => Play.fmt(Math.abs(x) < 5e-4 ? 0 : x, 2);
const say = (m) => { if (m !== lastLive) { lastLive = m; Play.live($("live"), m); } };
const deg = (a) => Math.round(wrap(a) * 180 / Math.PI) % 360;

// arrow of length len starting at the rim of the ball (radius off)
function arrow(g, p, dx, dy, len, cls, off) {
  if (len < 4) return;
  const n = Math.hypot(dx, dy) || 1, ux = dx / n, uy = dy / n, o = off || 0, x2 = p.x + ux * (o + len), y2 = p.y + uy * (o + len);
  sv("line", { class: cls[0], x1: p.x + ux * o, y1: p.y + uy * o, x2: x2 - ux * 10, y2: y2 - uy * 10 }, g);
  sv("path", { class: cls[1], d: `M${x2},${y2} L${x2 - ux * 15 - uy * 8},${y2 - uy * 15 + ux * 8} L${x2 - ux * 15 + uy * 8},${y2 - uy * 15 - ux * 8} Z` }, g);
  return { x: x2 + ux * 16, y: y2 + uy * 16 };
}
function text(g, x, y, s, cls, anchor) { sv("text", { class: cls, x, y: y + 8, "text-anchor": anchor || "middle" }, g).textContent = s; }

function draw() {
  const g = $("fig"); g.innerHTML = "";
  const rot = S.rot && step > 0;
  const fa = rot ? frameAngle(S, S.t) : 0;
  const V = (p, t) => (rot ? turn(p, -(t === undefined ? fa : frameAngle(S, t))) : p);   // view of an inertial point at time t
  const sc = (p) => ({ x: X(p), y: Y(p) });
  // the room: table outline, ticks, door — fixed in the room, so they turn when riding along
  const corners = [[-2.6, -1.8], [2.6, -1.8], [2.6, 1.8], [-2.6, 1.8]].map(([x, y]) => sc(V({ x, y })));
  sv("path", { class: "tbl", d: "M" + corners.map((c) => c.x.toFixed(1) + "," + c.y.toFixed(1)).join("L") + "Z" }, g);
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6, p1 = sc(V({ x: 1.65 * Math.cos(a), y: 1.65 * Math.sin(a) })), p2 = sc(V({ x: 1.78 * Math.cos(a), y: 1.78 * Math.sin(a) }));
    sv("line", { class: "tick", x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y }, g);
  }
  const dr = sc(V({ x: 2.45, y: 0 }));
  sv("circle", { class: "door", cx: dr.x, cy: dr.y, r: 7 }, g);
  // orbit circle (same in both views)
  sv("circle", { class: "orbit", cx: CX, cy: CY, r: S.r * SC }, g);
  // target (step 3)
  if (step === 2) {
    const tp = sc(V(TGT));
    if (S.cut && S.shotDone && missBy(S.r, S.cut.th, TGT, TOL) === 0) sv("circle", { class: "tgtHit", cx: tp.x, cy: tp.y, r: TOL * SC }, g);
    sv("circle", { class: "tgt", cx: tp.x, cy: tp.y, r: TOL * SC }, g);
    if (S.shotDone && missBy(S.r, S.cut.th, TGT, TOL) > 0) {
      const b = bestAngle(S.r, TGT);
      if (Number.isFinite(b)) { const bp = sc(V({ x: S.r * Math.cos(b), y: S.r * Math.sin(b) })); sv("path", { class: "best", d: `M${bp.x},${bp.y - 2} l-9,-15 h18 z` }, g); }
    }
  }
  // step 1: candidate paths from the top
  if (step === 0) {
    const r = S.r, top = { x: 0, y: r };
    const A = [top, { x: 0, y: Math.max(r + 0.3, Math.min(r + 0.85, 1.95)) }], C = [top, { x: -2.3, y: r }];
    const B = [];
    for (let i = 0; i <= 24; i++) { const a = Math.PI / 2 + i * 0.07, rr = r * (1 + 0.55 * i * 0.07); B.push({ x: rr * Math.cos(a), y: rr * Math.sin(a) }); }
    [[A, 0], [B, 1], [C, 2]].forEach(([pts, i]) => {
      sv("path", { class: "cand" + (pick === i ? " candOn" : ""), d: "M" + pts.map((p) => X(p).toFixed(1) + "," + Y(p).toFixed(1)).join("L") }, g);
      const e = pts[pts.length - 1];
      text(g, X(e) + (i === 2 ? -16 : i === 1 ? -14 : 0), Math.max(14, Y(e) + (i === 0 ? -18 : i === 1 ? 14 : 0)), P.t(["candA", "candB", "candC"][i]), "lblK");
    });
  }
  // dots: equal times apart, from the start of the current lap view to now
  const gap = dotGap(S.v, S.r), cur = posAt(S, S.t);
  if (S.cut) {
    const tc = S.cut.tc;
    if (!rot) { const a = sc(posAt(S, tc)), e = sc(posAt(S, tc + flightTime(S.v, S.r))); sv("line", { class: "tan", x1: a.x, y1: a.y, x2: e.x, y2: e.y }, g); }
    for (let k = 1; k <= 8; k++) { const p = sc(V(posAt(S, tc - k * gap), tc - k * gap)); sv("circle", { class: "ghost", cx: p.x, cy: p.y, r: 4.5 }, g); }
    if (rot) {   // the curved path seen while riding along
      let d = "";
      const n = 60, span = S.t - tc;
      for (let i = 0; i <= n && span > 0; i++) { const t = tc + span * i / n, p = sc(V(posAt(S, t), t)); d += (i ? "L" : "M") + p.x.toFixed(1) + "," + p.y.toFixed(1); }
      if (d) sv("path", { class: "cand candOn", d, style: "stroke-dasharray:none;stroke-width:2;opacity:.8" }, g);
    }
    for (let k = 0; tc + k * gap <= S.t + 1e-9 && k < 200; k++) {
      const t = tc + k * gap, p = sc(V(posAt(S, t), t));
      sv("circle", { class: "dotA", cx: p.x, cy: p.y, r: 5 }, g);
    }
  } else if (!rot) {
    for (let k = 1; k <= 8; k++) { const p = sc(posAt(S, S.t - k * gap)); sv("circle", { class: "ghost", cx: p.x, cy: p.y, r: 4.5 }, g); }
  }
  // string, pin, ball
  const bp = sc(V(cur)), rad = 8 + 8 * Math.sqrt(S.m);
  if (!S.cut) sv("line", { class: "string", x1: CX, y1: CY, x2: bp.x, y2: bp.y }, g);
  else { const th = S.cut.th, st = sc(V({ x: 0.25 * S.r * Math.cos(th), y: 0.25 * S.r * Math.sin(th) }, S.cut.tc)); const s2 = rot ? sc(V({ x: 0.25 * S.r * Math.cos(angleAt(S, S.t)), y: 0.25 * S.r * Math.sin(angleAt(S, S.t)) })) : st; sv("line", { class: "stub", x1: CX, y1: CY, x2: s2.x, y2: s2.y }, g); }
  sv("circle", { class: "pin", cx: CX, cy: CY, r: 6 }, g);
  // arrows: screen directions
  if (!rot) {
    const L = 24 * S.v;
    const tip = arrow(g, bp, cur.vx, -cur.vy, L, ["va", "vh"], rad);
    if (tip) text(g, tip.x, tip.y, P.t("lblV"), "lblA");
    if (!S.cut) {
      const F = force(S.m, S.v, S.r), Lf = Math.min(S.r * SC - rad - 12, 20 + 12 * F);
      const tf = arrow(g, bp, CX - bp.x, CY - bp.y, Lf, ["fa", "fh"], rad);
      if (tf) {
        // label beside the middle of the force arrow, on the side away from the velocity arrow
        const dx = CX - bp.x, dy = CY - bp.y, n = Math.hypot(dx, dy) || 1;
        let nx = -dy / n, ny = dx / n;
        if (nx * cur.vx - ny * cur.vy > 0) { nx = -nx; ny = -ny; }
        text(g, bp.x + dx / n * (rad + Lf / 2) + nx * 20, bp.y + dy / n * (rad + Lf / 2) + ny * 20 - 4, P.t("lblF"), "lblF");
      }
    }
  } else if (!S.cut) {
    const F = force(S.m, S.v, S.r), Lf = Math.min(S.r * SC - rad - 12, 20 + 12 * F);
    arrow(g, bp, CX - bp.x, CY - bp.y, Lf, ["fa", "fh"], rad);
    const tc2 = arrow(g, bp, bp.x - CX, bp.y - CY, Lf, ["ca", "ch"], rad);
    text(g, bp.x + 26, bp.y - 6, P.t("lblF"), "lblF", "start");
    if (tc2) text(g, tc2.x + 4, tc2.y + 4, P.t("lblCf"), "lblC", "start");
  }
  sv("circle", { class: "ball", cx: bp.x, cy: bp.y, r: rad, id: "ballEl" }, g);
  text(g, CX + 12, CY + 22, P.t("pin"), "lbl", "start");
  // captions
  $("cap").textContent = P.t(rot ? "capRot" : "capGround");
  const sl = $("slow").selectedOptions[0].textContent;
  $("tag").textContent = S.cut ? P.t("tagFly", { slow: sl }) : P.t("tagSpin", { rev: Play.fmt(1 / lapTime(S.v, S.r), 2), slow: sl });
  $("legC").hidden = !rot;
  drawReadout();
  syncCtl();
}

function drawReadout() {
  const F = force(S.m, S.v, S.r), on = !S.cut, p = posAt(S, S.t);
  const rows = [
    [P.t("rF"), on ? P.t("fIn", { F: f2(F) }) : P.t("zero") + " N"],
    [P.t("rV"), on ? Play.fmt(S.v, 1) + " m/s" : P.t("same", { v: Play.fmt(S.v, 1) })],
    [P.t("rDir"), on ? P.t("turning", { w: Play.fmt(omega(S.v, S.r) * 180 / Math.PI, 0) }) : P.t("fixed")],
    [P.t("rD"), f2(Math.hypot(p.x, p.y)) + " m"],
    [P.t("rT"), on ? Play.fmt(lapTime(S.v, S.r), 2) + " s" : "—"],
    [P.t("rA"), on ? "v²/r = " + f2(S.v * S.v / S.r) + " m/s²" : P.t("zero") + " m/s²"],
  ];
  $("readout").innerHTML = rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
}

function syncCtl() {
  $("vVal").textContent = Play.fmt(S.v, 1) + " m/s";
  $("rVal").textContent = Play.fmt(S.r, 1) + " m";
  $("mVal").textContent = Play.fmt(S.m, 2) + " kg";
  const done = S.cut && S.t >= S.cut.tc + flightTime(S.v, S.r) - 1e-9;
  $("play").textContent = P.t(S.playing ? "pause" : "play");
  $("play").disabled = !!done;
  $("cut").textContent = S.cut ? P.t("tie") : P.t(step === 0 ? "cutTop" : "cutNow");
  $("rot").checked = S.rot;
  if (step === 2) {
    const aim = $("aim");
    if (S.shotDone && S.cut) { const d = missBy(S.r, S.cut.th, TGT, TOL); aim.textContent = d === 0 ? P.t("aimHit") : P.t("aimMiss", { d: f2(d) }); }
    else aim.textContent = P.t("aimTry");
  }
}

function landed() {
  S.shotDone = true;
  const p = posAt(S, S.t);
  if (step === 2) { const d = missBy(S.r, S.cut.th, TGT, TOL); say(d === 0 ? P.t("liveHit") : P.t("liveMiss", { d: f2(d) })); }
  else say(P.t("liveGone", { s: Play.fmt(p.u, 2), d: f2(Math.hypot(p.x, p.y)) }));
}
function doCut(t) {
  const th = angleAt(S, t);
  S.cut = { tc: t, th }; S.t = t; S.armTop = false; S.shotDone = false;
  say(P.t("liveCut", { deg: deg(th), F: f2(force(S.m, S.v, S.r)), v: Play.fmt(S.v, 1) }));
}
function pause() { S.playing = false; cancelAnimationFrame(raf); }
function start() { if (S.playing) return; S.playing = true; last = 0; raf = requestAnimationFrame(tick); }
function finishFlight() { S.t = S.cut.tc + flightTime(S.v, S.r); pause(); landed(); }
function tick(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(0.1, (ts - last) / 1000) * S.slow : 0;
  last = ts;
  let t = S.t + dt;
  if (!S.cut && S.armTop) { const tt = nextTop(S, S.t); if (t >= tt) doCut(tt); }
  if (S.cut && t >= S.cut.tc + flightTime(S.v, S.r)) { S.t = S.cut.tc + flightTime(S.v, S.r); S.playing = false; draw(); landed(); return; }
  S.t = Math.max(S.t, t);
  draw();
  if (S.playing) raf = requestAnimationFrame(tick);
}
function tie() {
  // tie again where the string was cut, keep the clock
  const th = S.cut ? S.cut.th : angleAt(S, S.t);
  S.cut = null; S.armTop = false; S.shotDone = false;
  S.th0 = th - omega(S.v, S.r) * S.t;
}
function cutAction() {
  if (S.cut) { tie(); if (!Play.reduced) start(); draw(); return; }
  if (step === 0) {
    if (Play.reduced || !S.playing) {
      // move straight to the top and cut there
      S.th0 = Math.PI / 2 - omega(S.v, S.r) * S.t;
      doCut(S.t);
      if (Play.reduced) finishFlight(); else start();
    } else S.armTop = true;
  } else {
    doCut(S.t);
    if (Play.reduced) finishFlight(); else start();
  }
  draw();
}
$("cut").addEventListener("click", cutAction);
$("play").addEventListener("click", () => { if (S.playing) pause(); else start(); draw(); });
$("slow").addEventListener("change", () => { S.slow = num(+$("slow").value, 0.05, 1, 0.5); draw(); });
$("rot").addEventListener("change", () => { S.rot = $("rot").checked; say(P.t(S.rot ? "liveRot" : "liveGround")); draw(); drawRule(); });
function setParam(k, val) {
  const th = S.cut ? S.cut.th : angleAt(S, S.t);
  S[k] = val;
  if (k !== "m") { if (S.cut) { S.cut = null; S.shotDone = false; S.armTop = false; } S.th0 = th - omega(S.v, S.r) * S.t; }
  draw(); drawRule();
}
$("v").addEventListener("input", () => setParam("v", num(+$("v").value, 1, 6, DEF.v)));
$("r").addEventListener("input", () => setParam("r", num(+$("r").value, 0.3, 1.5, DEF.r)));
$("m").addEventListener("input", () => setParam("m", num(+$("m").value, 0.05, 1, DEF.m)));

// direct manipulation: drag the ball round its circle; tap the string to cut
const fig = $("fig");
let dragging = false;
function moveTo(th) {
  if (S.cut) tie();
  S.th0 = th - omega(S.v, S.r) * S.t;
}
fig.addEventListener("pointerdown", (e) => {
  const p = Play.pointer(fig, e), cur = posAt(S, S.t);
  const b = S.rot && step > 0 ? turn(cur, -frameAngle(S, S.t)) : cur;
  const bx = X(b), by = Y(b);
  if (!S.cut && !(S.rot && step > 0) && Math.hypot(p.x - bx, p.y - by) < 34) {
    dragging = true; pause(); fig.setPointerCapture && fig.setPointerCapture(e.pointerId); e.preventDefault(); draw(); return;
  }
  // distance to the string segment pin→ball
  if (!S.cut) {
    const dx = bx - CX, dy = by - CY, L2 = dx * dx + dy * dy || 1;
    const u = Play.clamp(((p.x - CX) * dx + (p.y - CY) * dy) / L2, 0, 1);
    if (Math.hypot(p.x - CX - u * dx, p.y - CY - u * dy) < 22 && u > 0.08) { e.preventDefault(); cutAction(); }
  }
});
fig.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const p = Play.pointer(fig, e), q = { x: (p.x - CX) / SC, y: (CY - p.y) / SC };
  if (Math.hypot(q.x, q.y) < 0.05) return;
  moveTo(Math.atan2(q.y, q.x)); draw();
});
["pointerup", "pointercancel"].forEach((ev) => fig.addEventListener(ev, () => { if (dragging) { dragging = false; draw(); } }));
fig.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cutAction(); return; }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault(); pause();
    const th = S.cut ? S.cut.th : angleAt(S, S.t);
    moveTo(th + (e.key === "ArrowLeft" ? 1 : -1) * Math.PI / 12); draw();
  }
});

function drawRule() {
  const box = $("rule");
  if (step !== 2) { box.innerHTML = ""; return; }
  const F = force(S.m, S.v, S.r);
  box.innerHTML =
    '<p class="big">' + P.t("ruleBig") + "</p>" +
    '<p class="mathline">F = m·v² / r</p>' +
    "<p>" + P.t("ruleNow", { m: Play.fmt(S.m, 2), v: Play.fmt(S.v, 1), r: Play.fmt(S.r, 1), F: f2(F) }) + "</p>" +
    "<p>" + P.t("ruleTwice", { F2: f2(force(S.m, 2 * S.v, S.r)), F3: f2(force(S.m, S.v, 2 * S.r)), F4: f2(force(2 * S.m, S.v, S.r)) }) + "</p>" +
    "<p>" + P.t("ruleMass") + "</p>" +
    "<p>" + P.t("ruleFrames") + "</p>";
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { pick = i; draw(); });
const stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, { v: Play.fmt(S.v, 1) });
  $("predict").hidden = i !== 0;
  $("aim").hidden = i !== 2;
  $("rotWrap").hidden = i === 0;
  if (i === 2) S.rot = false;
  if (S.cut) tie();
  if (i === 2) S.th0 = -Math.PI / 2 - omega(S.v, S.r) * S.t;
  if (!Play.reduced) start(); else pause();
  draw(); drawRule();
});
function resetAll() {
  pause();
  Object.assign(S, { v: DEF.v, r: DEF.r, m: DEF.m, th0: -Math.PI / 2, cut: null, t: 0, slow: 0.5, rot: false, armTop: false, shotDone: false });
  $("v").value = DEF.v; $("r").value = DEF.r; $("m").value = DEF.m; $("slow").value = "0.5";
  pick = -1; lastLive = ""; $("live").textContent = "";
  pr.reset(); stp.go(0);
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

/* SIM-BEGIN — pure circuit model, no DOM (tests extract this block) */
const R_BULB = 6, V_MAX = 9, P_REF = (V_MAX * V_MAX) / R_BULB;
function solve(V, R, n, mode, closed, inOk) {
  V = Number.isFinite(V) && V > 0 ? V : 0;
  R = Number.isFinite(R) && R > 0 ? R : R_BULB;
  n = Number.isFinite(n) ? Math.max(0, Math.min(3, Math.round(n))) : 0;
  inOk = Array.isArray(inOk) ? inOk : [];
  const isIn = (i) => inOk[i] !== false;
  const bulbs = [];
  let total = 0, why = null;
  if (!closed) why = "switch";
  if (mode === "series") {
    let allIn = true;
    for (let i = 0; i < n; i++) if (!isIn(i)) allIn = false;
    if (closed && !allIn) why = "bulb";
    const I = closed && allIn && n > 0 ? V / (n * R) : 0;
    for (let i = 0; i < n; i++) bulbs.push({ in: isIn(i), I, V: I * R, P: I * I * R });
    total = I;
  } else {
    for (let i = 0; i < n; i++) {
      const I = closed && isIn(i) ? V / R : 0;
      bulbs.push({ in: isIn(i), I, V: closed && isIn(i) ? V : 0, P: I * I * R });
      total += I;
    }
    if (closed && n > 0 && total === 0) why = "bulb";
  }
  const b = (k) => (k < bulbs.length ? bulbs[k].I : null);
  const meters = mode === "series" ? [total, total, total, total] : [total, b(0), b(1), b(2)];
  return { V, R, n, total, bulbs, meters, power: V * total, why };
}
const glow = (P) => (Number.isFinite(P) && P > 0 ? Math.sqrt(Math.min(1, P / P_REF)) : 0);
/* SIM-END */

const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = { V: 6, n: 1, mode: "series", closed: true, inOk: [true, true, true], meters: [true, true, false, false], playing: false, answered: false };
let sol = null, segs = [], phases = [], raf = 0, last = 0, lastLive = "", stp = null, dotsG = null;
const fmtI = (x) => Play.fmt(x, x > 0 && x < 0.1 ? 3 : 2);
const fmtP = (x) => Play.fmt(x, x > 0 && x < 0.1 ? 3 : 2);
const fmtV = (x) => Play.fmt(x, 1);
const revealed = () => S.answered || (stp && stp.i > 0);

/* ---------- geometry ---------- */
const XL = 60, XR = 540, YT = 70, YB = 290, BT = 165, BB = 195, YBULB = 205, YMET = 128, SWX = 300, SWX_P = 150;
const xsSeries = (n) => (n === 1 ? [300] : n === 2 ? [220, 380] : [180, 310, 440]);
const xsPar = (n) => (n === 1 ? [420] : n === 2 ? [300, 460] : [205, 345, 485]);
function layout() {
  const n = S.n, L = { bulbs: [], slots: [], segs: [], wires: [], sw: null };
  if (S.mode === "series") {
    const xs = xsSeries(n);
    const loop = [[XL, BT], [XL, YT], [XR, YT], [XR, YB], [XL, YB], [XL, BB], [XL, BT]];
    L.wires.push(loop);
    L.segs.push({ pts: loop, I: sol.total });
    xs.forEach((x, i) => L.bulbs.push({ x, y: YT, i, dir: "h" }));
    const a2 = (xs[0] + (n > 1 ? xs[1] : XR)) / 2;
    L.slots = [{ x: 118, y: YT, ty: "up" }, { x: a2, y: YT, ty: "up" }, { x: XR, y: 180, ty: "left" }, { x: 160, y: YB, ty: "down" }];
    L.sw = { x: SWX, y: YB };
  } else {
    const xs = xsPar(n), xe = xs[n - 1], br = sol.bulbs.map((b) => b.I);
    const main = [[xs[0], YB], [XL, YB], [XL, BB], [XL, BT], [XL, YT], [xs[0], YT]];
    L.wires.push([[xe, YB], [XL, YB], [XL, YT], [xe, YT]]);
    L.segs.push({ pts: main, I: sol.total });
    xs.forEach((x, i) => {
      L.wires.push([[x, YT], [x, YB]]);
      L.segs.push({ pts: [[x, YT], [x, YB]], I: br[i] });
      if (i < n - 1) {
        const rest = br.slice(i + 1).reduce((a, c) => a + c, 0);
        L.segs.push({ pts: [[x, YT], [xs[i + 1], YT]], I: rest });
        L.segs.push({ pts: [[xs[i + 1], YB], [x, YB]], I: rest });
      }
      L.bulbs.push({ x, y: YBULB, i, dir: "v" });
    });
    L.slots = [{ x: 150, y: YT, ty: "up" }];
    for (let k = 0; k < 3; k++) L.slots.push(k < n ? { x: xs[k], y: YMET, ty: "right" } : null);
    L.sw = { x: SWX_P + 10, y: YB };
  }
  return L;
}

/* ---------- drawing ---------- */
function polyLen(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; }
function pointAt(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d <= l || i === pts.length - 1) { const f = l > 0 ? Play.clamp(d / l, 0, 1) : 0; return [pts[i - 1][0] + f * (pts[i][0] - pts[i - 1][0]), pts[i - 1][1] + f * (pts[i][1] - pts[i - 1][1])]; }
    d -= l;
  }
  return pts[0];
}
const SP = 24, KSPEED = 50; // dot spacing (px), px/s per ampere
function drawDots() {
  if (!dotsG) return;
  dotsG.innerHTML = "";
  segs.forEach((s, k) => {
    if (!(s.I > 0)) return;
    const L = polyLen(s.pts), ph = phases[k] || 0;
    for (let d = ph; d < L - 2; d += SP) { const p = pointAt(s.pts, d); Play.svg("circle", { class: "chg", cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: 4.5 }, dotsG); }
  });
}
function hit(parent, fid, aria, onAct) {
  const g = Play.svg("g", { class: "hit", tabindex: 0, role: "button", "data-fid": fid, "aria-label": aria }, parent);
  g.addEventListener("click", onAct);
  g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onAct(); } });
  return g;
}
function draw() {
  const sv = Play.svg, fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  sol = solve(S.V, R_BULB, S.n, S.mode, S.closed, S.inOk);
  const L = layout();
  if (segs.length !== L.segs.length) phases = L.segs.map(() => 0);
  segs = L.segs;
  fig.innerHTML = "";
  L.wires.forEach((w) => sv("polyline", { class: "wire", points: w.map((p) => p.join(",")).join(" ") }, fig));
  dotsG = sv("g", {}, fig);
  drawDots();
  // battery (+ on top)
  sv("rect", { class: "cover", x: XL - 26, y: BT - 4, width: 52, height: BB - BT + 8 }, fig);
  sv("line", { class: "plate", x1: XL - 24, y1: BT + 6, x2: XL + 24, y2: BT + 6 }, fig);
  sv("line", { class: "plate neg", x1: XL - 12, y1: BB - 6, x2: XL + 12, y2: BB - 6 }, fig);
  sv("line", { class: "wire", x1: XL, y1: BT, x2: XL, y2: BT + 6 }, fig);
  sv("line", { class: "wire", x1: XL, y1: BB - 6, x2: XL, y2: BB }, fig);
  sv("text", { class: "lbl", x: XL - 30, y: BT + 4, "text-anchor": "end" }, fig).textContent = "+";
  sv("text", { class: "lblR", x: XL + 34, y: (BT + BB) / 2 + 8 }, fig).textContent = fmtV(S.V) + " V";
  // switch
  const sw = L.sw, gs = hit(fig, "sw", P.t("swAria", { s: P.t(S.closed ? "swIsClosed" : "swIsOpen") }), toggleSwitch);
  sv("rect", { class: "cover", x: sw.x - 30, y: sw.y - 34, width: 60, height: 44, opacity: S.closed ? 0 : 1 }, gs);
  sv("rect", { class: "ring", x: sw.x - 30, y: sw.y - 34, width: 60, height: 46, rx: 6 }, gs);
  sv("line", { class: "lever", x1: sw.x - 22, y1: sw.y, x2: S.closed ? sw.x + 22 : sw.x + 16, y2: S.closed ? sw.y : sw.y - 26 }, gs);
  sv("circle", { class: "term", cx: sw.x - 22, cy: sw.y, r: 5 }, gs);
  sv("circle", { class: "term", cx: sw.x + 22, cy: sw.y, r: 5 }, gs);
  // bulbs
  L.bulbs.forEach((b) => {
    const bs = sol.bulbs[b.i], isIn = S.inOk[b.i];
    const st = !isIn ? P.t("bulbOut") : bs.P > 0 ? P.t("bulbIn", { P: fmtP(bs.P) }) : P.t("bulbDark");
    const g = hit(fig, "b" + b.i, P.t("bulbAria", { k: b.i + 1, s: st }), () => { S.inOk[b.i] = !S.inOk[b.i]; update(); });
    const h = b.dir === "h";
    if (isIn) {
      const gl = glow(bs.P);
      if (gl > 0) sv("circle", { class: "halo", cx: b.x, cy: b.y, r: 22 + 22 * gl, opacity: (0.25 + 0.5 * gl).toFixed(2) }, g);
      sv("circle", { class: "bulb", cx: b.x, cy: b.y, r: 20, style: gl > 0 ? `fill: color-mix(in srgb, var(--hl) ${Math.round(20 + 80 * gl)}%, var(--surface))` : "" }, g);
      sv("line", { class: "bulbx", x1: b.x - 14, y1: b.y - 14, x2: b.x + 14, y2: b.y + 14 }, g);
      sv("line", { class: "bulbx", x1: b.x + 14, y1: b.y - 14, x2: b.x - 14, y2: b.y + 14 }, g);
    } else {
      sv("rect", { class: "cover", x: b.x - 22, y: b.y - 22, width: 44, height: 44 }, g);
      sv("circle", { class: "term", cx: h ? b.x - 18 : b.x, cy: h ? b.y : b.y - 18, r: 4 }, g);
      sv("circle", { class: "term", cx: h ? b.x + 18 : b.x, cy: h ? b.y : b.y + 18, r: 4 }, g);
      const ox = h ? 0 : 40, oy = h ? 42 : 0;
      sv("circle", { class: "bulb out", cx: b.x + ox, cy: b.y + oy, r: 18 }, g);
    }
    sv("rect", { class: "ring", x: b.x - 26, y: b.y - 26, width: 52, height: 52, rx: 26 }, g);
    const lx = h ? b.x : b.x - 30, ly = h ? b.y + (isIn ? 50 : 92) : b.y + 8;
    sv("text", { class: "lbl", x: lx, y: ly, "text-anchor": h ? "middle" : "end" }, g).textContent = "L" + (b.i + 1);
  });
  // ammeters
  L.slots.forEach((s, k) => {
    if (!s) return;
    const name = "A" + (k + 1), on = S.meters[k], v = sol.meters[k];
    const txt = revealed() ? fmtI(v) + " A" : "? A";
    const g = hit(fig, "m" + k, on ? P.t("meterAria", { m: name, v: revealed() ? fmtI(v) + " A" : P.t("hidden") }) : P.t("slotAria", { m: name }), () => { S.meters[k] = !S.meters[k]; update(); });
    g.setAttribute("aria-pressed", on ? "true" : "false");
    if (on) {
      sv("circle", { class: "meter", cx: s.x, cy: s.y, r: 21 }, g);
      sv("text", { class: "lblM", x: s.x, y: s.y + 7, "text-anchor": "middle" }, g).textContent = name;
      const tp = s.ty === "up" ? [s.x, s.y - 30, "middle"] : s.ty === "down" ? [s.x, s.y + 46, "middle"] : s.ty === "left" ? [s.x - 30, s.y + 8, "end"] : [s.x + 26, s.y + 8, "start"];
      sv("text", { class: "lblA", x: tp[0], y: tp[1], "text-anchor": tp[2] }, g).textContent = txt;
    } else {
      sv("circle", { class: "slot", cx: s.x, cy: s.y, r: 14 }, g);
      sv("text", { class: "lbl", x: s.x, y: s.y + 7, "text-anchor": "middle" }, g).textContent = "+";
    }
    sv("circle", { class: "ring", cx: s.x, cy: s.y, r: 26 }, g);
  });
  if (fid) { const el = fig.querySelector(`[data-fid="${fid}"]`); if (el) el.focus(); }
}

/* ---------- panel ---------- */
function panel() {
  $("voltVal").textContent = fmtV(S.V) + " V";
  $("nbVal").textContent = S.n;
  $("volt").value = S.V; $("nb").value = S.n;
  $("tag").textContent = P.t(S.mode === "series" ? "tagSeries" : "tagParallel", { R: R_BULB });
  Object.keys(modeBtns).forEach((k) => { modeBtns[k].classList.toggle("on", S.mode === k); modeBtns[k].setAttribute("aria-pressed", S.mode === k ? "true" : "false"); });
  $("sw").textContent = P.t(S.closed ? "swClosed" : "swOpen");
  $("play").textContent = P.t(S.playing ? "pause" : "play");
  $("play").setAttribute("aria-pressed", S.playing ? "true" : "false");
  const rv = revealed(), cell = (b, f) => (!b.in ? P.t("out") : rv ? f(b) : "?");
  let h = "<tr><th></th>" + sol.bulbs.map((b, i) => `<th>L${i + 1}</th>`).join("") + "</tr>";
  h += `<tr><td>${P.t("rI")}</td>` + sol.bulbs.map((b) => `<td>${cell(b, (x) => fmtI(x.I) + " A")}</td>`).join("") + "</tr>";
  h += `<tr><td>${P.t("rV")}</td>` + sol.bulbs.map((b) => `<td>${cell(b, (x) => fmtV(x.V) + " V")}</td>`).join("") + "</tr>";
  h += `<tr><td>${P.t("rP")}</td>` + sol.bulbs.map((b) => `<td>${cell(b, (x) => fmtP(x.P) + " W")}</td>`).join("") + "</tr>";
  $("readout").innerHTML = h;
  // rule (step 3)
  const box = $("rule");
  if (!stp || stp.i !== 2) box.innerHTML = "";
  else {
    const why = sol.why ? P.t(sol.why === "switch" ? "whySwitch" : "whyBulb") : "";
    const parts = [];
    if (S.mode === "series") {
      if (sol.total > 0) { const b = sol.bulbs[0]; parts.push(P.t("ruleSeries", { n: S.n, V: fmtV(S.V), R: R_BULB, I: fmtI(sol.total), Vb: fmtV(b.V), P: fmtP(b.P) })); }
      else parts.push(P.t("ruleBroken", { why }));
    } else if (sol.total > 0) {
      const lit = sol.bulbs.find((b) => b.I > 0);
      parts.push(P.t("ruleParallel", { V: fmtV(S.V), R: R_BULB, Ib: fmtI(lit.I), sum: sol.bulbs.map((b) => fmtI(b.I)).join(" + "), I: fmtI(sol.total), P: fmtP(lit.P) }));
      const off = sol.bulbs.findIndex((b) => !b.in);
      if (off >= 0) parts.push(P.t("ruleParOut", { k: off + 1 }));
    } else parts.push(P.t("ruleBroken", { why }));
    const k = sol.bulbs.findIndex((b) => b.I > 0);
    parts.push(k >= 0 ? P.t("ruleEnergy", { I: fmtI(sol.bulbs[k].I), k: k + 1, Vb: fmtV(sol.bulbs[k].V), P: fmtP(sol.bulbs[k].P) }) : P.t("ruleEnergy0"));
    box.innerHTML = parts.map((p) => "<p>" + p + "</p>").join("");
  }
  let msg;
  if (!rv) msg = "";
  else if (sol.total === 0) msg = P.t("liveOff", { why: P.t(sol.why === "switch" ? "whySwitch" : "whyBulb") });
  else if (S.mode === "series") msg = P.t("liveSeries", { V: fmtV(S.V), I: fmtI(sol.total) });
  else msg = P.t("liveParallel", { V: fmtV(S.V), I: fmtI(sol.total), br: sol.bulbs.map((b) => fmtI(b.I)).join(" / ") });
  if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); }
}
function update() { draw(); panel(); }

/* ---------- animation ---------- */
function tick(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0;
  last = ts;
  segs.forEach((s, k) => { if (s.I > 0) phases[k] = ((phases[k] || 0) + KSPEED * s.I * dt) % SP; });
  drawDots();
  raf = requestAnimationFrame(tick);
}
function setPlaying(on) {
  S.playing = on; cancelAnimationFrame(raf); last = 0;
  if (on) raf = requestAnimationFrame(tick);
  panel();
}

/* ---------- controls ---------- */
const modeBtns = {};
["series", "parallel"].forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(k);
  b.addEventListener("click", () => { S.mode = k; update(); });
  $("modes").appendChild(b); modeBtns[k] = b;
});
function toggleSwitch() { S.closed = !S.closed; update(); }
$("sw").addEventListener("click", toggleSwitch);
$("play").addEventListener("click", () => setPlaying(!S.playing));
$("volt").addEventListener("input", () => { const v = +$("volt").value; S.V = Number.isFinite(v) ? Play.clamp(v, 1.5, 9) : 6; update(); });
$("nb").addEventListener("input", () => { const v = Math.round(+$("nb").value); S.n = Number.isFinite(v) ? Play.clamp(v, 1, 3) : 1; update(); });

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
}, () => { S.answered = true; update(); });
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (sol) update();
});
function resetAll() {
  Object.assign(S, { V: 6, n: 1, mode: "series", closed: true, inOk: [true, true, true], meters: [true, true, false, false], answered: false });
  phases = []; segs = [];
  pr.reset(); stp.go(0); update();
  setPlaying(!Play.reduced);
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

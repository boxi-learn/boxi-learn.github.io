/* SIM-BEGIN — pure physics, no DOM (tests extract this block) */
const RHO = 1.2, CD = 1.0, G_EARTH = 9.81, G_MOON = 1.62, TCAP = 300, SAMPLE = 0.01;
function simulate(m, A, h, g, air) {
  const ok = (x, lo) => (Number.isFinite(x) && x >= lo ? x : lo);
  m = ok(m, 1e-4); A = ok(A, 1e-4); h = ok(h, 0.1); g = ok(g, 0.1);
  const c = air ? (0.5 * RHO * CD * A) / m : 0;     // drag per unit mass per v²
  const vt = c > 0 ? Math.sqrt(g / c) : Infinity;     // terminal velocity
  let dt = 0.001;
  if (c > 0) dt = Math.min(dt, vt / g / 5);           // keep dt well under the drag time scale
  const ns = Math.min(2000, Math.max(1, Math.ceil(SAMPLE / dt)));
  dt = SAMPLE / ns;
  const acc = (v) => g - c * v * v;
  const maxN = Math.round(TCAP / SAMPLE);
  const ys = [0], vs = [0];
  let y = 0, v = 0, tg = null, vg = null;
  outer: for (let i = 0; i < maxN; i++) {
    for (let j = 0; j < ns; j++) {
      const a1 = acc(v), v2 = v + 0.5 * dt * a1, a2 = acc(v2), v3 = v + 0.5 * dt * a2, a3 = acc(v3), v4 = v + dt * a3, a4 = acc(v4);
      let ny = y + (dt / 6) * (v + 2 * v2 + 2 * v3 + v4);
      let nv = v + (dt / 6) * (a1 + 2 * a2 + 2 * a3 + a4);
      if (!Number.isFinite(nv)) nv = Number.isFinite(vt) ? vt : v + g * dt;
      if (nv > vt) nv = vt;
      if (!Number.isFinite(ny)) ny = y + v * dt;
      if (ny >= h) {                                   // lands inside this step: solve y + vτ + ½aτ² = h
        const a0 = acc(v), d = h - y;
        let tau = a0 > 1e-12 ? (-v + Math.sqrt(v * v + 2 * a0 * d)) / a0 : d / Math.max(v, 1e-12);
        if (!Number.isFinite(tau)) tau = dt;
        tau = Math.min(dt, Math.max(0, tau));
        tg = i * SAMPLE + j * dt + tau;
        vg = v + a0 * tau;
        break outer;
      }
      y = ny; v = nv;
    }
    ys.push(y); vs.push(v);
  }
  let vmax = 0;
  for (const s of vs) if (s > vmax) vmax = s;
  if (vg !== null && vg > vmax) vmax = vg;
  return { h, tg, vg, ys, vs, vt, vmax };
}
function stateAt(sim, t) {
  if (sim.tg !== null && t >= sim.tg) return { y: sim.h, v: sim.vg, landed: true };
  const n = sim.ys.length - 1, x = Math.max(0, t / SAMPLE), i = Math.min(n, Math.floor(x)), f = i < n ? x - i : 0;
  const y = i < n ? sim.ys[i] + (sim.ys[i + 1] - sim.ys[i]) * f : sim.ys[n];
  const v = i < n ? sim.vs[i] + (sim.vs[i + 1] - sim.vs[i]) * f : sim.vs[n];
  return { y: Math.min(y, sim.h), v, landed: false };
}
/* SIM-END */

const PRESETS = {
  bowling: { m: 7.0, A: Math.PI * 0.109 * 0.109 },
  tennis: { m: 0.058, A: Math.PI * 0.0335 * 0.0335 },
  crumpled: { m: 0.005, A: Math.PI * 0.03 * 0.03 },
  flat: { m: 0.005, A: 0.0624 },
  feather: { m: 0.0005, A: 0.01 },
};
const PKEYS = { bowling: "pBowling", tennis: "pTennis", crumpled: "pCrumpled", flat: "pFlat", feather: "pFeather", custom: "pCustom" };
const $ = (id) => document.getElementById(id);
const fig = $("fig");
const S = { env: "vac", h: 20, t: 0, playing: false, speed: 1, envTouched: false,
  obj: { A: { preset: "bowling", m: 7, A: 0.0373 }, B: { preset: "feather", m: 0.0005, A: 0.01 } } };
let sims = {}, tEnd = 1, strobe = 0.2, raf = 0, last = 0, lastLive = "";

const envG = () => (S.env === "moon" ? G_MOON : G_EARTH);
const fmtT = (tg) => (tg === null ? P.t("never", { cap: TCAP }) : Play.fmt(tg, tg < 10 ? 3 : tg < 100 ? 2 : 1));
const fmtV = (v) => Play.fmt(v, v < 1 ? 3 : v < 100 ? 2 : 1);
function fmtMass(m) {
  if (m >= 1) return Play.fmt(m, 2) + " kg";
  const g = m * 1000;
  return Play.fmt(g, g < 1 ? 2 : g < 10 ? 1 : 0) + " g";
}
function fmtArea(A) {
  if (A >= 0.1) return Play.fmt(A, 2) + " m²";
  const c = A * 1e4;
  return Play.fmt(c, c < 10 ? 1 : 0) + " cm²";
}
const massToS = (m) => Math.round((Math.log10(m) + 4) * 100);   // 0..500 → 0.1 g … 10 kg
const sToMass = (s) => Math.pow(10, -4 + s / 100);
const areaToS = (A) => Math.round((Math.log10(A) + 4) * 100);   // 0..400 → 1 cm² … 1 m²
const sToArea = (s) => Math.pow(10, -4 + s / 100);

/* ---------- controls ---------- */
const ui = {};
["A", "B"].forEach((w) => {
  const g = $("grp" + w);
  const who = document.createElement("span");
  who.className = "who who" + w; who.textContent = w;
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", P.t("presetAria", { w }));
  Object.keys(PKEYS).forEach((k) => { const o = document.createElement("option"); o.value = k; o.textContent = P.t(PKEYS[k]); sel.appendChild(o); });
  const mk = (min, max, aria) => { const r = document.createElement("input"); r.type = "range"; r.min = min; r.max = max; r.step = 1; r.setAttribute("aria-label", aria); return r; };
  const ml = document.createElement("span"); ml.textContent = P.t("mass");
  const mr = mk(0, 500, P.t("massAria", { w }));
  const mv = document.createElement("span"); mv.className = "val";
  const al = document.createElement("span"); al.textContent = P.t("area");
  const ar = mk(0, 400, P.t("areaAria", { w }));
  const av = document.createElement("span"); av.className = "val";
  const p1 = document.createElement("span"), p2 = document.createElement("span");
  p1.className = p2.className = "pair";
  p1.append(ml, mr, mv); p2.append(al, ar, av);
  g.append(who, sel, p1, p2);
  ui[w] = { sel, mr, mv, ar, av };
  sel.addEventListener("change", () => { if (sel.value !== "custom") setPreset(w, sel.value); else { S.obj[w].preset = "custom"; } });
  mr.addEventListener("input", () => { const o = S.obj[w]; o.m = sToMass(+mr.value); o.preset = "custom"; recompute(); });
  ar.addEventListener("input", () => { const o = S.obj[w]; o.A = sToArea(+ar.value); o.preset = "custom"; recompute(); });
});
function setPreset(w, k, quiet) {
  const p = PRESETS[k];
  S.obj[w] = { preset: k, m: p.m, A: p.A };
  if (!quiet) recompute();
}
const envBtns = {};
[["air", "envAir"], ["vac", "envVac"], ["moon", "envMoon"]].forEach(([k, key]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(key);
  b.addEventListener("click", () => { S.env = k; S.envTouched = true; recompute(); });
  $("envs").appendChild(b); envBtns[k] = b;
});
$("height").addEventListener("input", () => { S.h = Play.clamp(+$("height").value, 1, 100); recompute(); });
$("speed").addEventListener("change", () => { S.speed = +$("speed").value || 1; });
$("time").addEventListener("input", () => { pause(); S.t = (+$("time").value / 1000) * tEnd; draw(); syncPlay(); });
$("play").addEventListener("click", () => {
  if (S.playing) { pause(); return; }
  if (S.t >= tEnd - 1e-9) S.t = 0;
  S.playing = true; last = 0; raf = requestAnimationFrame(tick); syncPlay();
});
function pause() { S.playing = false; cancelAnimationFrame(raf); syncPlay(); }
function syncPlay() { $("play").textContent = P.t(S.playing ? "pause" : S.t >= tEnd - 1e-9 && S.t > 0 ? "replay" : "play"); }
function tick(ts) {
  if (!S.playing) return;
  if (last) S.t += Math.min(0.1, (ts - last) / 1000) * S.speed;
  last = ts;
  if (S.t >= tEnd) { S.t = tEnd; S.playing = false; }
  draw(); syncPlay();
  if (S.playing) raf = requestAnimationFrame(tick);
}

/* ---------- physics ---------- */
function niceUp(x, list) { for (const s of list) if (s >= x) return s; return list[list.length - 1]; }
const NICE = [0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];
function recompute() {
  pause();
  const g = envG(), air = S.env === "air";
  ["A", "B"].forEach((w) => {
    const o = S.obj[w];
    sims[w] = simulate(o.m, o.A, S.h, g, air);
    sims[w + "vac"] = simulate(o.m, o.A, S.h, g, false);
    sims[w + "air"] = simulate(o.m, o.A, S.h, G_EARTH, true);
  });
  const ta = sims.A.tg === null ? TCAP : sims.A.tg, tb = sims.B.tg === null ? TCAP : sims.B.tg;
  tEnd = Math.max(ta, tb, 0.05);
  strobe = niceUp(tEnd / 14, NICE);
  S.t = 0;
  syncControls(); draw(); syncPlay();
}
function syncControls() {
  ["A", "B"].forEach((w) => {
    const o = S.obj[w], u = ui[w];
    u.sel.value = o.preset; u.mr.value = massToS(o.m); u.ar.value = areaToS(o.A);
    u.mv.textContent = fmtMass(o.m); u.av.textContent = fmtArea(o.A);
  });
  Object.keys(envBtns).forEach((k) => { envBtns[k].classList.toggle("on", S.env === k); envBtns[k].setAttribute("aria-pressed", S.env === k ? "true" : "false"); });
  $("height").value = S.h; $("heightVal").textContent = S.h + " m";
  $("envTag").textContent = P.t(S.env === "air" ? "tagAir" : S.env === "vac" ? "tagVac" : "tagMoon");
  $("cap").textContent = P.t("cap", { s: strobe });
}

/* ---------- drawing ---------- */
const Y0 = 56, YG = 312, RX = 72, LANE = { A: 140, B: 240 }, GX0 = 350, GX1 = 585, GY0 = 76, GY1 = 312;
const radius = (A) => Play.clamp(4 + 40 * Math.sqrt(A), 5, 24);
const yPix = (y) => Y0 + (Play.clamp(y / S.h, 0, 1)) * (YG - Y0);
function draw() {
  const sv = Play.svg;
  fig.innerHTML = "";
  // ruler + ground
  sv("line", { class: "ax", x1: RX, y1: Y0, x2: RX, y2: YG }, fig);
  [0, 0.5, 1].forEach((f) => sv("line", { class: "ax", x1: RX - 8, y1: Y0 + f * (YG - Y0), x2: RX, y2: Y0 + f * (YG - Y0) }, fig));
  sv("text", { class: "lbl", x: RX - 12, y: Y0 + 8, "text-anchor": "end" }, fig).textContent = "0 m";
  sv("text", { class: "lbl", x: RX - 12, y: YG + 4, "text-anchor": "end" }, fig).textContent = S.h + " m";
  sv("line", { class: "ground", x1: RX, y1: YG, x2: 292, y2: YG }, fig);
  // objects, strobe ghosts
  ["A", "B"].forEach((w) => {
    const sim = sims[w], r = radius(S.obj[w].A), x = LANE[w];
    sv("text", { class: "lbl" + w, x, y: 344, "text-anchor": "middle" }, fig).textContent = w;
    const tStop = sim.tg === null ? S.t : Math.min(S.t, sim.tg);
    for (let k = 1; k * strobe <= tStop + 1e-9 && k < 400; k++) {
      const s = stateAt(sim, k * strobe);
      sv("circle", { class: "ghost" + w, cx: x, cy: yPix(s.y) - r, r }, fig);
    }
    const s = stateAt(sim, S.t);
    sv("circle", { class: "obj" + w, cx: x, cy: yPix(s.y) - r, r }, fig);
  });
  // speed–time graph
  const vTop = niceUp(Math.max(sims.A.vmax, sims.B.vmax, 0.05) * 1.05, NICE);
  sv("polyline", { class: "ax", points: `${GX0},${GY0} ${GX0},${GY1} ${GX1},${GY1}` }, fig);
  sv("text", { class: "lbl", x: GX0 + 6, y: GY0 - 14 }, fig).textContent = "↑ " + vTop + " m/s";
  sv("text", { class: "lbl", x: GX1, y: 344, "text-anchor": "end" }, fig).textContent = Play.fmt(tEnd, tEnd < 10 ? 2 : 0) + " s →";
  sv("text", { class: "lbl", x: GX0, y: 344, "text-anchor": "middle" }, fig).textContent = "0";
  const gx = (t) => GX0 + (Play.clamp(t / tEnd, 0, 1)) * (GX1 - GX0), gy = (v) => GY1 - Play.clamp(v / vTop, 0, 1) * (GY1 - GY0);
  ["A", "B"].forEach((w) => {
    const sim = sims[w], n = sim.vs.length, step = Math.max(1, Math.ceil(n / 240)), pts = [];
    for (let i = 0; i < n; i += step) pts.push(gx(i * SAMPLE).toFixed(1) + "," + gy(sim.vs[i]).toFixed(1));
    if (sim.tg !== null) pts.push(gx(sim.tg).toFixed(1) + "," + gy(sim.vg).toFixed(1));
    else pts.push(gx((n - 1) * SAMPLE).toFixed(1) + "," + gy(sim.vs[n - 1]).toFixed(1));
    sv("polyline", { class: "line" + w, points: pts.join(" ") }, fig);
  });
  const cx = gx(S.t);
  sv("line", { class: "cursor", x1: cx, y1: GY0, x2: cx, y2: GY1 }, fig);
  // time slider + readouts
  $("time").value = Math.round((S.t / tEnd) * 1000);
  $("timeVal").textContent = Play.fmt(S.t, 2) + " s";
  const st = { A: stateAt(sims.A, S.t), B: stateAt(sims.B, S.t) };
  const cell = (w, txt) => `<td class="who${w}">${txt}</td>`;
  const name = (w) => P.t(PKEYS[S.obj[w].preset]);
  const spd = (x) => (x.landed ? P.t("landedAt", { v: fmtV(x.v) }) : fmtV(x.v) + " " + P.t("unitMS"));
  $("readout").innerHTML =
    `<tr><th></th><th class="whoA">A · ${name("A")}</th><th class="whoB">B · ${name("B")}</th></tr>` +
    `<tr><td>${P.t("rTime")}</td>${cell("A", fmtT(sims.A.tg) + " " + P.t("unitS"))}${cell("B", fmtT(sims.B.tg) + " " + P.t("unitS"))}</tr>` +
    `<tr><td>${P.t("rFallen")}</td>${cell("A", Play.fmt(st.A.y, 2) + " " + P.t("unitM"))}${cell("B", Play.fmt(st.B.y, 2) + " " + P.t("unitM"))}</tr>` +
    `<tr><td>${P.t("rSpeed")}</td>${cell("A", spd(st.A))}${cell("B", spd(st.B))}</tr>`;
  drawRule();
  const same = sims.A.tg !== null && sims.B.tg !== null && Math.abs(sims.A.tg - sims.B.tg) < 0.0005;
  const msg = same ? P.t("liveSame", { ta: fmtT(sims.A.tg) }) : P.t("liveBoth", { ta: fmtT(sims.A.tg), tb: fmtT(sims.B.tg) });
  if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); }
}
function drawRule() {
  const box = $("rule");
  if (stp && stp.i !== 2) { box.innerHTML = ""; return; }
  const g = envG(), tf = Math.sqrt((2 * S.h) / g);
  const vac = P.t("ruleVac", { g: g.toFixed(2), h: S.h, tf: Play.fmt(tf, 3), ta: fmtT(sims.Avac.tg), tb: fmtT(sims.Bvac.tg) });
  const air = P.t("ruleAir", { va: fmtV(sims.Aair.vt), vb: fmtV(sims.Bair.vt), h: S.h, ma: fmtV(sims.Aair.vmax), mb: fmtV(sims.Bair.vmax), ta: fmtT(sims.Aair.tg), tb: fmtT(sims.Bair.tg) });
  box.innerHTML = "<p>" + vac + "</p><p>" + air + "</p>";
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
});
let stp = null;
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (i === 1 && !S.envTouched && S.env === "vac") { S.env = "air"; S.envTouched = true; recompute(); return; }
  if (sims.A) drawRule();
});
function resetAll() {
  S.env = "vac"; S.h = 20; S.envTouched = false; S.speed = 1; $("speed").value = "1";
  setPreset("A", "bowling", true); setPreset("B", "feather", true);
  pr.reset(); stp.go(0); recompute();
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

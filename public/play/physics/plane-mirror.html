/* SIM-BEGIN — pure plane-mirror model, no DOM (tests extract this block). Units: cm.
   From above: mirror on the line x = 0, |y| ≤ MH; the room is x < 0.
   From the side: wall at x = 0, mirror from height b to t; you stand at x = −D, eyes at H − EYE_DROP. */
const MH = 15, EYE_DROP = 11, DEG = 180 / Math.PI;
const OBJ = { xMin: -45, xMax: -2, yMin: -27, yMax: 27 }, EYE = { xMin: -76, xMax: -2, yMin: -27, yMax: 27 };
const D_MIN = 40, D_MAX = 220, H_MIN = 100, H_MAX = 200, Z_MAX = 200, GAP = 5;
const num = (x, dflt) => (Number.isFinite(x) ? x : dflt);
const cl = (x, a, b) => Math.min(b, Math.max(a, x));
/* Image of a point: reflect across the mirror line. */
const mirrorPt = (p) => ({ x: -p.x, y: p.y });
/* The ray that reaches the eye: aim from the eye at the image; where that line crosses x = 0 is the hit point. */
function topView(o, e) {
  const I = mirrorPt(o), d = -o.x, de = -e.x;
  const yP = e.y + ((I.y - e.y) * de) / (de + I.x);
  const inc = Math.atan2(Math.abs(yP - o.y), d) * DEG;   // angle from the normal, candle side
  const ref = Math.atan2(Math.abs(e.y - yP), de) * DEG;  // angle from the normal, eye side
  return { d, v: I.x, img: I, yP, inc, ref, seen: Math.abs(yP) <= MH + 1e-9 };
}
/* A ray from the candle hitting the mirror at height ym is reflected: its x-direction flips. */
function reflectRay(o, ym, xEnd) { // returns the end point of the reflected ray at x = xEnd (< 0)
  const dx = -o.x, dy = ym - o.y, s = -xEnd / dx;
  return { x: xEnd, y: ym + dy * s };
}
/* Side view: the sight line from the eye (−D, he) to the image point (D, z) crosses the wall at this height. */
const hitY = (D, he, z) => he + ((z - he) * D) / (D + D);
function sideView(H, D, b, t) {
  const he = H - EYE_DROP;
  const zLo = Math.max(0, 2 * b - he), zHi = Math.min(H, 2 * t - he);
  const vis = Math.max(0, zHi - zLo);
  return { he, zLo, zHi, vis, empty: !(zHi > zLo), full: zLo <= 0 && zHi >= H,
    needTop: (H + he) / 2, needBot: he / 2, need: H / 2 };
}
/* Same answer by brute force: trace a sight line to every 0.1 cm of the image and keep those that hit the glass. */
function scanVisible(H, D, b, t) {
  const he = H - EYE_DROP, n = Math.round(H * 10);
  let lo = null, hi = null;
  for (let k = 0; k <= n; k++) {
    const z = k / 10, y = hitY(D, he, z);
    if (y >= b - 1e-9 && y <= t + 1e-9) { if (lo === null) lo = z; hi = z; }
  }
  return lo === null ? { vis: 0, lo: null, hi: null } : { vis: hi - lo, lo, hi };
}
/* SIM-END */

const $ = (id) => document.getElementById(id);
const fig = $("fig"), sv = Play.svg;
/* top view: 5 px per cm, mirror at x = 400 */
const TX = 400, TY = 150, TK = 5;
const tx = (x) => TX + x * TK, ty = (y) => TY - y * TK;
/* side view: 1.25 px per cm, wall at x = 320, floor at y = 270 */
const SX = 320, SF = 270, SK = 1.25;
const sx = (x) => SX + x * SK, sy = (z) => SF - z * SK;
const DEF = { view: "top", o: { x: -20, y: 6 }, e: { x: -50, y: -14 }, fan: true, H: 160, D: 80, t: 155, b: 115, a1: false, a2: false, walking: false };
const S = JSON.parse(JSON.stringify(DEF));
let stp = null, raf = 0, last = 0, lastLive = "", drag = null;
const nf = (x, d = 1) => Play.fmt(x, d).replace("-", "−");
const n0 = (x) => nf(x, 0);
const nn = (x) => (Math.abs(x - Math.round(x)) < 1e-9 ? n0(x) : nf(x));

function line(parent, cls, x1, y1, x2, y2) { return sv("line", { class: cls, x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1) }, parent); }
function text(parent, cls, x, y, s, anchor) { const n = sv("text", { class: cls, x: x.toFixed(1), y: y.toFixed(1), "text-anchor": anchor || "middle" }, parent); n.textContent = s; return n; }
function handle(fid, aria, txt) {
  return sv("g", { class: "hit", tabindex: 0, role: "slider", "data-fid": fid, "aria-label": aria, "aria-valuetext": txt }, fig);
}
function arcPath(cx, cy, r, a1, a2) { // angles in radians, SVG coordinates
  const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1), x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
  const sweep = ((a2 - a1 + 3 * Math.PI) % (2 * Math.PI)) - Math.PI > 0 ? 1 : 0;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 ${sweep} ${x2.toFixed(1)},${y2.toFixed(1)}`;
}

function drawTop(g) {
  const R = topView(S.o, S.e), o = S.o, e = S.e, show = S.a1 || stp.i !== 0;
  sv("rect", { class: "behind", x: TX, y: 0, width: 240, height: 300 }, g);
  text(g, "lbl", 630, 28, P.t("lBehind"), "end");
  line(g, "plane", TX, 0, TX, 300);
  if (show) {
    if (S.fan) {
      for (let k = -3; k <= 3; k++) {
        const ym = (k * MH) / 3, end = reflectRay(o, ym, -90);
        line(g, "fan", tx(o.x), ty(o.y), tx(0), ty(ym));
        line(g, "fan", tx(0), ty(ym), tx(end.x), ty(end.y));
        line(g, "fanx", tx(0), ty(ym), tx(R.img.x), ty(R.img.y));
      }
    }
    // distance guide along the normal through the candle
    line(g, "dim", tx(o.x), ty(o.y), tx(R.img.x), ty(R.img.y));
    if (R.d >= 15) {
      const yl = o.y > 18 ? ty(o.y) - 14 : ty(o.y) + 34; // names go on the other side
      text(g, "lbl", tx(-R.d / 2), yl, nn(R.d) + " cm");
      text(g, "lblI", tx(R.v / 2), yl, nn(R.v) + " cm");
    }
    if (R.seen) {
      const P0 = { x: tx(0), y: ty(R.yP) };
      line(g, "normal", P0.x, P0.y, tx(-16), P0.y);
      line(g, "pr r1", tx(o.x), ty(o.y), P0.x, P0.y);
      line(g, "pr r2", P0.x, P0.y, tx(e.x), ty(e.y));
      line(g, "ext r2", P0.x, P0.y, tx(R.img.x), ty(R.img.y));
      const aO = Math.atan2(ty(o.y) - P0.y, tx(o.x) - P0.x), aE = Math.atan2(ty(e.y) - P0.y, tx(e.x) - P0.x);
      if (R.inc > 2) sv("path", { class: "arc r1", d: arcPath(P0.x, P0.y, 46, Math.PI, aO) }, g);
      if (R.ref > 2) sv("path", { class: "arc r2", d: arcPath(P0.x, P0.y, 38, Math.PI, aE) }, g);
      const mid = (a, r) => { const m = (Math.PI + (a < 0 ? a + 2 * Math.PI : a)) / 2; return { x: P0.x + r * Math.cos(m), y: P0.y + r * Math.sin(m) + 8 }; };
      if (R.inc > 8) { const q = mid(aO, 66); text(g, "lblA r1", q.x, q.y, P.t("lI")); }
      if (R.ref > 8) { const q = mid(aE, 60); text(g, "lblA r2", q.x, q.y, P.t("lR")); }
    } else {
      line(g, "miss", tx(e.x), ty(e.y), tx(R.img.x), ty(R.img.y));
    }
    // the image of the candle
    sv("circle", { class: "imgC", cx: tx(R.img.x), cy: ty(R.img.y), r: 11 }, g);
    text(g, "lblI", tx(R.img.x), ty(R.img.y) + (R.img.y > 18 ? 40 : -20), P.t("lImg"));
  }
  // the mirror itself, silvered side hatched
  line(g, "mirror", TX, ty(MH), TX, ty(-MH));
  for (let y = -MH + 1.5; y <= MH; y += 3) line(g, "hatch", TX + 4, ty(y), TX + 12, ty(y - 2));
  // draggables: candle and eye
  const gc = handle("o", P.t("aCandle"), P.t("vtPos", { d: nf(-o.x), y: nf(o.y) }));
  sv("rect", { class: "ring", x: tx(o.x) - 22, y: ty(o.y) - 22, width: 44, height: 44, rx: 10 }, gc);
  sv("circle", { class: "candle", cx: tx(o.x), cy: ty(o.y), r: 11 }, gc);
  sv("circle", { class: "wick", cx: tx(o.x), cy: ty(o.y), r: 3 }, gc);
  text(g, "lbl", tx(o.x), ty(o.y) + (o.y > 18 ? 40 : -20), P.t("lCandle"));
  const ge = handle("e", P.t("aEye"), P.t("vtPos", { d: nf(-e.x), y: nf(e.y) }));
  const ex = tx(e.x), ey = ty(e.y);
  sv("rect", { class: "ring", x: ex - 24, y: ey - 22, width: 48, height: 44, rx: 10 }, ge);
  sv("path", { class: "eyeW", d: `M${ex - 18},${ey} Q${ex},${ey - 16} ${ex + 18},${ey} Q${ex},${ey + 16} ${ex - 18},${ey}Z` }, ge);
  sv("circle", { class: "eyeP", cx: ex + 5, cy: ey, r: 5 }, ge);
  text(g, "lbl", ex, ey + (e.y < -18 ? -22 : 38), P.t("lEye"));
  return R;
}

function person(g, xf, H, dir, img) { // xf = front surface x (cm), dir = +1 faces right
  const sp = xf - dir * 7, he = H - EYE_DROP, bc = img ? "ibody" : "body";
  const p = (x, z) => [sx(x), sy(z)];
  const L = (a, b) => line(g, bc, a[0], a[1], b[0], b[1]);
  L(p(sp, H - 22), p(sp, 0.5 * H));                       // trunk
  L(p(sp, 0.5 * H), p(sp - dir * 3, 0)); L(p(sp, 0.5 * H), p(sp + dir * 3, 0)); // legs
  L(p(sp + dir * 3, 0), p(xf, 0));                        // foot reaches the front line
  L(p(sp, H - 28), p(sp + dir * 6, 0.5 * H + 4));         // arm
  sv("circle", { class: img ? "ihead" : "head", cx: sx(sp).toFixed(1), cy: sy(H - 11).toFixed(1), r: (11 * SK).toFixed(1) }, g);
  if (!img) sv("circle", { class: "eyeP", cx: sx(xf).toFixed(1), cy: sy(he).toFixed(1), r: 2.6 }, g);
}

function drawSide(g) {
  const R = sideView(S.H, S.D, S.b, S.t), D = S.D, H = S.H;
  sv("rect", { class: "behind", x: SX, y: 0, width: 320, height: SF }, g);
  line(g, "floor", 0, SF, 640, SF);
  line(g, "wall", SX, 0, SX, SF);
  person(g, D, H, -1, true);
  if (!R.empty) line(g, "band", sx(D), sy(R.zHi), sx(D), sy(R.zLo));
  if (stp.i === 3) {
    [R.needTop, R.needBot].forEach((z) => line(g, "guide", sx(-30), sy(z), sx(30), sy(z)));
  }
  if (!R.empty) {
    [[R.zHi, "r1"], [R.zLo, "r2"]].forEach(([z, c]) => {
      const m = hitY(D, R.he, z);
      line(g, "pr " + c, sx(-D), sy(z), sx(0), sy(m));
      line(g, "pr " + c, sx(0), sy(m), sx(-D), sy(R.he));
      line(g, "ext " + c, sx(0), sy(m), sx(D), sy(z));
    });
  }
  line(g, "mirror", SX, sy(S.t), SX, sy(S.b));
  for (let z = S.b + 3; z <= S.t; z += 6) line(g, "hatch", SX + 4, sy(z), SX + 12, sy(z - 4));
  text(g, "lbl", sx(-D - 7), 294, P.t("lYou"));
  text(g, "lblI", sx(D + 7), 294, P.t("lImage"));
  // draggables: you, mirror top, mirror bottom
  const gp = handle("p", P.t("aYou"), P.t("vtYou", { D: n0(D) }));
  sv("rect", { class: "ring", x: sx(-D - 7) - 26, y: sy(H) - 6, width: 52, height: H * SK + 12, rx: 10 }, gp);
  person(gp, -D, H, 1, false);
  [["mt", S.t, "aTop"], ["mb", S.b, "aBot"]].forEach(([fid, z, a]) => {
    const gh = handle(fid, P.t(a), P.t("vtEdge", { h: nn(z) }));
    sv("rect", { class: "ring", x: SX - 20, y: sy(z) - 16, width: 40, height: 32, rx: 8 }, gh);
    sv("circle", { class: "knob", cx: SX, cy: sy(z).toFixed(1), r: 8 }, gh);
  });
  return R;
}

function draw() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  fig.innerHTML = "";
  const defs = sv("defs", {}, fig), cp = sv("clipPath", { id: "clipV" }, defs);
  sv("rect", { x: 0, y: 0, width: 640, height: 300 }, cp);
  const g = sv("g", { "clip-path": "url(#clipV)" }, fig);
  const R = S.view === "top" ? drawTop(g) : drawSide(g);
  if (fid) { const el = fig.querySelector(`[data-fid="${fid}"]`); if (el) el.focus(); }
  return R;
}

function rows(list) { return list.map((r) => `<tr><td>${P.t(r[0])}</td><td>${r[1]}</td></tr>`).join(""); }

function panel() {
  const T = topView(S.o, S.e), V = sideView(S.H, S.D, S.b, S.t), i = stp.i;
  $("vTop").classList.toggle("on", S.view === "top"); $("vTop").setAttribute("aria-pressed", S.view === "top");
  $("vSide").classList.toggle("on", S.view === "side"); $("vSide").setAttribute("aria-pressed", S.view === "side");
  $("ctlTop").hidden = S.view !== "top"; $("ctlSide").hidden = S.view !== "side";
  $("d").value = -S.o.x; $("dVal").textContent = nf(-S.o.x) + " cm"; $("fan").checked = S.fan;
  $("D").value = S.D; $("DVal").textContent = n0(S.D) + " cm";
  $("H").value = S.H; $("HVal").textContent = n0(S.H) + " cm";
  $("mt").value = S.t; $("mtVal").textContent = nn(S.t) + " cm";
  $("mb").value = S.b; $("mbVal").textContent = nn(S.b) + " cm";
  $("walk").textContent = P.t(S.walking ? "pause" : Play.reduced ? "walkStep" : "walk");
  $("walk").setAttribute("aria-pressed", S.walking ? "true" : "false");
  // caption
  let cap;
  if (S.view === "top") {
    if (!S.a1 && i === 0) cap = P.t("capHidden");
    else cap = P.t(T.seen ? "capSeen" : "capMiss", { d: nf(T.d), v: nf(T.v), i: n0(T.inc), r: n0(T.ref) });
  } else if (V.empty) cap = P.t("capNone", { D: n0(S.D) });
  else if (V.full) cap = P.t("capFull", { D: n0(S.D), H: n0(S.H) });
  else cap = P.t("capSide", { D: n0(S.D), H: n0(S.H), v: n0(V.vis), p: n0((100 * V.vis) / S.H), lo: n0(V.zLo), hi: n0(V.zHi) });
  $("cap").textContent = cap;
  // readout
  let ro = "";
  if (i === 1) ro = rows([["rD", nf(T.d) + " cm"], ["rV", nf(T.v) + " cm"], ["rI", T.seen ? n0(T.inc) + "°" : "—"], ["rR", T.seen ? n0(T.ref) + "°" : "—"], ["rSeen", P.t(T.seen ? "yes" : "no")]]);
  if (i === 2) ro = rows([["rH", n0(S.H) + " cm"], ["rE", n0(V.he) + " cm"], ["rDD", n0(S.D) + " cm"], ["rL", nn(S.t - S.b) + " cm"], ["rVis", n0(V.vis) + " cm"], ["rNeed", nf(V.need) + " cm"]]);
  $("readout").innerHTML = ro;
  // rule
  const box = $("rule");
  if (i !== 3) box.innerHTML = "";
  else {
    let t = `<p class="big">${P.t("ruleBig")}</p><p>${P.t("ruleNow", { d: nf(T.d), v: nf(T.v) })}</p>`;
    t += `<p>${P.t("ruleTab", { b: nn(S.b), t: nn(S.t) })}</p><table class="readout"><tr><th>${P.t("thD")}</th><th>${P.t("thVis")}</th></tr>`;
    [50, 100, 150, 200].forEach((Dk) => { const s = scanVisible(S.H, Dk, S.b, S.t); t += `<tr><td>${Dk} cm</td><td>${n0(s.vis)} cm</td></tr>`; });
    t += "</table>";
    t += `<p>${P.t("ruleHalf", { nb: nf(V.needBot), nt: nf(V.needTop), n: nf(V.needTop - V.needBot), H: n0(S.H) })}</p>`;
    t += `<p><button type="button" class="small" id="half">${P.t("btnHalf")}</button></p>`;
    box.innerHTML = t;
    $("half").addEventListener("click", () => { S.view = "side"; S.t = Math.min(Z_MAX, V.needTop); S.b = Math.max(0, V.needBot); update(); });
  }
  if (!drag && !S.walking && cap !== lastLive) { lastLive = cap; Play.live($("live"), cap); }
}
function update() { draw(); panel(); }

/* ---------- direct manipulation ---------- */
const r10 = (x) => Math.round(x * 10) / 10;
function setPt(which, x, y) {
  const B = which === "o" ? OBJ : EYE, p = S[which];
  p.x = cl(r10(num(x, p.x)), B.xMin, B.xMax); p.y = cl(r10(num(y, p.y)), B.yMin, B.yMax);
}
const setD = (v) => { S.D = cl(Math.round(num(v, S.D)), D_MIN, D_MAX); };
const setT = (v) => { S.t = cl(Math.round(num(v, S.t)), S.b + GAP, Z_MAX); };
const setB = (v) => { S.b = cl(Math.round(num(v, S.b)), 0, S.t - GAP); };
const setH = (v) => { S.H = cl(Math.round(num(v, S.H)), H_MIN, H_MAX); };
fig.addEventListener("pointerdown", (e) => {
  const t = e.target.closest && e.target.closest("[data-fid]");
  if (!t) return;
  drag = { fid: t.dataset.fid }; t.focus(); setWalking(false); e.preventDefault();
  const p = Play.pointer(fig, e);
  if (drag.fid === "o" || drag.fid === "e") { const q = S[drag.fid]; drag.dx = q.x - (p.x - TX) / TK; drag.dy = q.y - (TY - p.y) / TK; }
  if (drag.fid === "p") drag.dx = S.D + (p.x - SX) / SK;
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = Play.pointer(fig, e), f = drag.fid;
  if (f === "o" || f === "e") setPt(f, (p.x - TX) / TK + drag.dx, (TY - p.y) / TK + drag.dy);
  else if (f === "p") setD(drag.dx - (p.x - SX) / SK);
  else if (f === "mt") setT((SF - p.y) / SK);
  else if (f === "mb") setB((SF - p.y) / SK);
  update();
});
addEventListener("pointerup", () => { if (drag) { drag = null; update(); } });
addEventListener("pointercancel", () => { drag = null; });
fig.addEventListener("keydown", (e) => {
  const f = e.target.dataset && e.target.dataset.fid;
  if (!f) return;
  const k = e.key, big = e.shiftKey;
  const dx = k === "ArrowRight" ? 1 : k === "ArrowLeft" ? -1 : 0, dy = k === "ArrowUp" ? 1 : k === "ArrowDown" ? -1 : 0;
  if (!dx && !dy) return;
  e.preventDefault(); setWalking(false);
  if (f === "o" || f === "e") { const s = big ? 5 : 1; setPt(f, S[f].x + dx * s, S[f].y + dy * s); }
  else if (f === "p") setD(S.D - (dx || -dy) * (big ? 20 : 5)); // ← moves you away from the wall
  else if (f === "mt") setT(S.t + (dy || dx) * (big ? 10 : 1));
  else if (f === "mb") setB(S.b + (dy || dx) * (big ? 10 : 1));
  update();
});
$("d").addEventListener("input", () => { setPt("o", -(+$("d").value), S.o.y); update(); });
$("fan").addEventListener("change", () => { S.fan = $("fan").checked; update(); });
$("D").addEventListener("input", () => { setWalking(false); setD(+$("D").value); update(); });
$("H").addEventListener("input", () => { setH(+$("H").value); update(); });
$("mt").addEventListener("input", () => { setT(+$("mt").value); update(); });
$("mb").addEventListener("input", () => { setB(+$("mb").value); update(); });
$("vTop").addEventListener("click", () => { S.view = "top"; update(); });
$("vSide").addEventListener("click", () => { S.view = "side"; update(); });

/* ---------- walk-back animation (only on request; one step per click when motion is reduced) ---------- */
function tick(ts) {
  if (!S.walking) return;
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0;
  last = ts;
  S.D = Math.min(D_MAX, S.D + 40 * dt);
  if (S.D >= D_MAX) { S.D = D_MAX; S.walking = false; }
  update();
  if (S.walking) raf = requestAnimationFrame(tick);
}
function setWalking(on) {
  if (on === S.walking) return;
  S.walking = on; cancelAnimationFrame(raf); last = 0;
  if (on) { if (S.D >= D_MAX - 0.5) S.D = D_MIN; raf = requestAnimationFrame(tick); }
  else S.D = Math.round(S.D);
  update();
}
$("walk").addEventListener("click", () => {
  if (Play.reduced) { setD(S.D >= D_MAX ? D_MIN : S.D + 40); update(); return; }
  setWalking(!S.walking);
});

/* ---------- steps ---------- */
const pr1 = Play.predict($("pr1"), {
  q: P.t("q1"), options: [{ label: P.t("o1a") }, { label: P.t("o1b"), right: true }, { label: P.t("o1c") }], right: P.t("r1"), wrong: P.t("w1"),
}, () => { S.a1 = true; S.view = "top"; update(); });
const pr2 = Play.predict($("pr2"), {
  q: P.t("q2"), options: [{ label: P.t("o2a") }, { label: P.t("o2b"), right: true }, { label: P.t("o2c") }], right: P.t("r2"), wrong: P.t("w2"),
}, () => { S.a2 = true; S.view = "side"; update(); });
let ready = false;
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("stepBody").hidden = !P.t("b" + k);
  $("pr1").hidden = $("pr2").hidden = i !== 0;
  if (i === 0) S.view = S.a2 ? "side" : "top";
  if (i === 1) S.view = "top";
  if (i === 2 || i === 3) S.view = "side";
  if (i !== 2) setWalking(false);
  if (ready) update();
});
function resetAll() {
  cancelAnimationFrame(raf);
  const d = JSON.parse(JSON.stringify(DEF));
  Object.keys(d).forEach((k) => { S[k] = d[k]; });
  pr1.reset(); pr2.reset(); stp.go(0); update();
}
$("reset").addEventListener("click", resetAll);
ready = true;
resetAll();
</script>
</body>
</html>

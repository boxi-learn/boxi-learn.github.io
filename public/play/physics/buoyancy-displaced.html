/* SIM-BEGIN — pure physics, no DOM (tests extract this block). Units: cm, g, N. */
const G = 9.8, RHO_W = 1.0, AC = 100, AB = 25, HS = 14, YMIN = 1, YMAX = 15;
const BLOCKS = { al: { rho: 2.7, h: 4 }, steel: { rho: 7.9, h: 4 }, al2: { rho: 2.7, h: 8 }, wood: { rho: 0.5, h: 4 } };
const fin = (x, d) => (Number.isFinite(x) ? x : d);
const clampN = (x, a, b) => Math.min(b, Math.max(a, x));
const weightN = (grams) => grams / 1000 * G;
function blockInfo(k) {
  const b = BLOCKS[k] || BLOCKS.al, V = AB * b.h, m = b.rho * V;
  return { k: BLOCKS[k] ? k : "al", rho: b.rho, h: b.h, V, m, W: weightN(m), Bfull: weightN(RHO_W * V), floats: b.rho < RHO_W, sf: Math.min(b.h, m / (RHO_W * AB)) };
}
const subAt = (H, yb, h) => clampN(H - yb, 0, h);
// Water surface height H (cm above can floor) for water volume Wv with the block bottom at yb.
function levelFor(Wv, yb, h) {
  let H = Wv / AC;
  if (H <= yb) return H;
  H = (Wv - AB * yb) / (AC - AB);
  if (H - yb <= h) return H;
  return (Wv + AB * h) / AC;
}
const roomFor = (yb, h) => AC * HS - AB * subAt(HS, yb, h);   // most water the can holds below the spout
// Hook position yh (bottom of a hanging block, cm above floor), water volume Wv, water already spilled.
function settle(blk, yh, Wv, spilled) {
  yh = clampN(fin(yh, YMAX), YMIN, YMAX);
  Wv = clampN(fin(Wv, AC * HS), 0, AC * HS);
  spilled = Math.max(0, fin(spilled, 0));
  let W = Math.min(Wv, roomFor(yh, blk.h)), H = levelFor(W, yh, blk.h), s = subAt(H, yh, blk.h), yb = yh, floating = false;
  if (RHO_W * AB * s > blk.m + 1e-9) {             // pushed up more than its weight: string goes slack
    floating = true; s = blk.sf;
    W = Math.min(Wv, AC * HS - AB * s); H = (W + AB * s) / AC; yb = Math.max(0, H - s);
  }
  const out = spilled + (Wv - W), V = AB * s, B = weightN(RHO_W * V);
  return { yh, yb, H, s, V, B, T: floating ? 0 : Math.max(0, blk.W - B), floating, Wv: W, spilled: out, cup: weightN(RHO_W * out), d: H - yb, full: H >= HS - 1e-6 };
}
// Upward push if the can is full, as a function of the depth d of the bottom face below the surface.
function theory(blk, d) {
  d = Math.max(0, fin(d, 0));
  return blk.floats ? weightN(RHO_W * AB * Math.min(d, blk.sf)) : weightN(RHO_W * AB * Math.min(d, blk.h));
}
// Pressure (Pa) at depth d cm, and the top/bottom difference times area (N) for a block fully under.
const pressure = (dcm) => 1000 * G * Math.max(0, dcm) / 100;
/* SIM-END */

KEYS.forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.id = "b-" + k; b.textContent = P.t("b" + k);
  b.addEventListener("click", () => chooseBlock(k));
  $("blocks").appendChild(b);
});
$("depth").addEventListener("input", () => { stopTween(); setYh(YMAX - (+$("depth").value || 0)); });
$("refill").addEventListener("click", () => { stopTween(); S.Wv = AC * HS; S.spilled = 0; update(); });
function chooseBlock(k) {
  stopTween();
  S.blk = k; blk = blockInfo(k); S.yh = YMAX; S.Wv = AC * HS; S.spilled = 0;
  update();
}
function setYh(y) { S.yh = clampN(fin(y, YMAX), YMIN, YMAX); update(); }
function stopTween() { cancelAnimationFrame(tween); tween = 0; }
function moveTo(target) {
  stopTween();
  target = clampN(target, YMIN, YMAX);
  if (Play.reduced) { setYh(target); return; }
  const y0 = S.yh, t0 = performance.now(), dur = 300 + 60 * Math.abs(target - y0);
  const step = (now) => {
    const u = Math.min(1, (now - t0) / dur), e = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);
    setYh(y0 + (target - y0) * e);
    tween = u < 1 ? requestAnimationFrame(step) : 0;
  };
  tween = requestAnimationFrame(step);
}

/* ---------- drag + keyboard on the picture ---------- */
let drag = null;
scene.addEventListener("pointerdown", (e) => {
  stopTween();
  const p = Play.pointer(scene, e);
  if (p.x > 300) return;                              // right side is the cup and balance
  drag = { y0: p.y, yh0: S.yh };
  scene.setPointerCapture && scene.setPointerCapture(e.pointerId); e.preventDefault();
});
scene.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = Play.pointer(scene, e);
  setYh(Math.round((drag.yh0 - (p.y - drag.y0) / K) * 10) / 10);
});
["pointerup", "pointercancel"].forEach((ev) => scene.addEventListener(ev, () => { drag = null; }));
scene.addEventListener("keydown", (e) => {
  const d = e.shiftKey ? 0.1 : 0.5;
  const map = { ArrowDown: -d, ArrowUp: d, PageDown: -2, PageUp: 2 };
  if (e.key in map) { stopTween(); setYh(Math.round((S.yh + map[e.key]) * 10) / 10); e.preventDefault(); }
  else if (e.key === "Home") { stopTween(); setYh(YMAX); e.preventDefault(); }
  else if (e.key === "End") { stopTween(); setYh(YMIN); e.preventDefault(); }
});

/* ---------- state → everything ---------- */
function update() {
  const before = S.spilled;
  st = settle(blk, S.yh, S.Wv, S.spilled);
  S.yh = st.yh; S.Wv = st.Wv; S.spilled = st.spilled;
  if (st.spilled > before + 1e-6) {
    streamUntil = performance.now() + 350;
    clearTimeout(streamTimer); streamTimer = setTimeout(drawScene, 400);
  }
  if (st.s > 1e-6 && st.d >= 0) {                     // record a reading
    const key = blk.k + ":" + Math.round(st.d * 4);
    if (!trail.some((r) => r.key === key)) { trail.push({ key, b: blk.k, d: st.d, F: st.B }); if (trail.length > 400) trail.shift(); }
  }
  const dep = YMAX - S.yh;
  $("depth").value = dep.toFixed(1);
  $("depthVal").textContent = f1(dep) + " " + P.t("unitCm");
  scene.setAttribute("aria-valuemin", "0"); scene.setAttribute("aria-valuemax", String(YMAX - YMIN));
  scene.setAttribute("aria-valuenow", dep.toFixed(1));
  scene.setAttribute("aria-valuetext", P.t("live", { T: f2(st.T), F: f2(st.B), G: f2(st.cup), d: f1(Math.max(0, st.d)) }));
  KEYS.forEach((k) => $("b-" + k).setAttribute("aria-pressed", k === blk.k ? "true" : "false"));
  $("tag").textContent = st.s <= 1e-6 ? P.t("tagOut", { W: f2(blk.W) })
    : st.floating && st.full ? P.t("tagFloat", { W: f2(blk.W) })
    : !st.full ? P.t("tagLow", { gap: f1(HS - st.H) })
    : P.t("tagFull", { G: f2(st.cup), F: f2(st.B) });
  drawScene(); drawGraph(); drawReadout(); drawRule();
  const msg = P.t("live", { T: f2(st.T), F: f2(st.B), G: f2(st.cup), d: f1(Math.max(0, st.d)) });
  if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); }
}

/* ---------- picture ---------- */
const K = 10, YB = 483, CX = 200, BW = 50, SLEN = 130, SH = 100, ypx = (cm) => YB - cm * K;
function txt(x, y, cls, s, anchor, parent) {
  Play.svg("text", { class: cls, x, y, "text-anchor": anchor || "start" }, parent || scene).textContent = s;
}
function drawScene() {
  const sv = Play.svg;
  scene.innerHTML = "";
  sv("line", { class: "table", x1: 0, y1: 493, x2: 600, y2: 493 }, scene);
  // water in the can
  const wy = ypx(st.H);
  sv("rect", { class: "water", x: 150, y: wy.toFixed(1), width: 100, height: (YB - wy).toFixed(1) }, scene);
  // block
  const bTop = ypx(st.yb + blk.h), bBot = ypx(st.yb);
  sv("rect", { class: "blk b-" + blk.k, x: CX - BW / 2, y: bTop.toFixed(1), width: BW, height: (bBot - bTop).toFixed(1), rx: 2 }, scene);
  // water surface drawn over the block so the waterline shows on it
  sv("line", { class: "surf", x1: 150, y1: wy.toFixed(1), x2: 250, y2: wy.toFixed(1) }, scene);
  // can walls and spout
  sv("path", { class: "wall", d: `M147,${ypx(16)} L147,${YB + 3} L253,${YB + 3} L253,${ypx(16)}` }, scene);
  sv("path", { class: "wall", d: `M253,${ypx(HS)} L308,${ypx(HS) + 18}` }, scene);
  // catch cup on a balance
  const cupTop = 395, cupBot = 462, cupH = Math.min(cupBot - cupTop - 4, st.spilled / 220 * (cupBot - cupTop - 4));
  if (cupH > 0.3) sv("rect", { class: "water", x: 300, y: (cupBot - cupH).toFixed(1), width: 70, height: cupH.toFixed(1) }, scene);
  if (performance.now() < streamUntil) sv("line", { class: "stream", x1: 308, y1: ypx(HS) + 20, x2: 314, y2: (cupBot - cupH).toFixed(1) }, scene);
  sv("path", { class: "wall", d: `M298,${cupTop} L298,${cupBot + 2} L372,${cupBot + 2} L372,${cupTop}` }, scene);
  sv("rect", { class: "bal", x: 282, y: 466, width: 106, height: 26, rx: 4 }, scene);
  txt(398, 452, "lbl", P.t("cupLbl"));
  txt(398, 482, "lbC", f2(st.cup) + " " + P.t("unitN"));
  // spring scale: hangs from the hook; when floating the string goes slack
  const hookTop = ypx(st.yh + blk.h) - SLEN, sBot = hookTop, sTop = sBot - SH;
  if (st.floating) {
    const y0 = sBot + 8, y1 = bTop, mid = (y0 + y1) / 2, slack = Math.min(40, (ypx(st.yh + blk.h) - bTop) * 0.8);
    sv("path", { class: "string", d: `M${CX},${y0} Q${CX + 10 + slack},${mid.toFixed(1)} ${CX},${y1.toFixed(1)}` }, scene);
  } else sv("line", { class: "string", x1: CX, y1: sBot + 8, x2: CX, y2: bTop.toFixed(1) }, scene);
  sv("line", { class: "string", x1: CX, y1: sBot, x2: CX, y2: sBot + 8 }, scene);
  sv("circle", { class: "string", cx: CX, cy: sTop - 9, r: 8 }, scene);
  sv("rect", { class: "body", x: CX - 16, y: sTop.toFixed(1), width: 32, height: SH, rx: 6 }, scene);
  for (let n = 0; n <= 10; n++) {
    const y = sTop + 10 + n * 8;
    sv("line", { class: "tick", x1: CX - 10, y1: y.toFixed(1), x2: CX - (n % 5 ? 3 : 0), y2: y.toFixed(1) }, scene);
  }
  const py = sTop + 10 + clampN(st.T, 0, 10) * 8;
  sv("polygon", { class: "ptr", points: `${CX - 12},${py.toFixed(1)} ${CX + 8},${(py - 6).toFixed(1)} ${CX + 8},${(py + 6).toFixed(1)}` }, scene);
  txt(CX + 26, sTop + 34, "lbl", P.t("scaleLbl"));
  txt(CX + 26, sTop + 64, "lbA", f2(st.T) + " " + P.t("unitN"));
}

/* ---------- graph: push against depth ---------- */
const GX0 = 80, GX1 = 560, GY0 = 240, GY1 = 26, DMAX = 14, FMAX = 2.2;
const gx = (d) => GX0 + clampN(d, 0, DMAX) / DMAX * (GX1 - GX0), gy = (f) => GY0 - clampN(f, 0, FMAX) / FMAX * (GY0 - GY1);
function marker(b, x, y, r, parent) {
  const sv = Play.svg, cls = "m-" + b;
  if (b === "steel") sv("rect", { class: cls, x: (x - r).toFixed(1), y: (y - r).toFixed(1), width: 2 * r, height: 2 * r }, parent);
  else if (b === "al2") sv("polygon", { class: cls, points: `${x.toFixed(1)},${(y - r * 1.2).toFixed(1)} ${(x + r * 1.1).toFixed(1)},${(y + r * 0.8).toFixed(1)} ${(x - r * 1.1).toFixed(1)},${(y + r * 0.8).toFixed(1)}` }, parent);
  else sv("circle", { class: cls, cx: x.toFixed(1), cy: y.toFixed(1), r }, parent);
}
function drawGraph() {
  const sv = Play.svg;
  graph.innerHTML = "";
  for (let f = 0; f <= 2; f += 0.5) {
    sv("line", { class: "grid", x1: GX0, y1: gy(f), x2: GX1, y2: gy(f) }, graph);
    Play.svg("text", { class: "lbl", x: GX0 - 8, y: gy(f) + 7, "text-anchor": "end" }, graph).textContent = Play.fmt(f, 1);
  }
  for (let d = 0; d <= DMAX; d += 2) Play.svg("text", { class: "lbl", x: gx(d), y: GY0 + 26, "text-anchor": "middle" }, graph).textContent = d;
  sv("line", { class: "ax", x1: GX0, y1: GY0, x2: GX1, y2: GY0 }, graph);
  sv("line", { class: "ax", x1: GX0, y1: GY0, x2: GX0, y2: GY1 - 8 }, graph);
  Play.svg("text", { class: "lbl", x: GX1, y: GY0 + 54, "text-anchor": "end" }, graph).textContent = P.t("xAxis");
  Play.svg("text", { class: "lbl", x: GX0 + 10, y: GY1 + 4 }, graph).textContent = P.t("yAxis");
  if (stp && stp.i === 2) {                            // the rule line for the current block
    const pts = [], end = blk.floats ? blk.sf : DMAX;
    for (let i = 0; i <= 56; i++) { const d = end * i / 56; pts.push(gx(d).toFixed(1) + "," + gy(theory(blk, d)).toFixed(1)); }
    sv("polyline", { class: "theory", points: pts.join(" ") }, graph);
  }
  trail.forEach((r) => marker(r.b, gx(r.d), gy(r.F), 5, graph));
  if (st.s > 1e-6) sv("circle", { class: "now", cx: gx(st.d), cy: gy(st.B), r: 11 }, graph);
  // full-under depth marker for the current block
  if (!blk.floats) {
    const x = gx(blk.h);
    sv("line", { class: "grid", x1: x, y1: GY0, x2: x, y2: GY1, "stroke-dasharray": "4 4" }, graph);
  }
  const seen = KEYS.filter((k) => trail.some((r) => r.b === k));
  $("legend").innerHTML = "";
  const lg = document.createElement("div"); lg.className = "legend";
  seen.forEach((k) => {
    const sp = document.createElement("span");
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = `var(--${{ al: "a", steel: "h", al2: "hl", wood: "b" }[k]})`;
    sp.append(dot, document.createTextNode(P.t("b" + k)));
    lg.appendChild(sp);
  });
  const key = document.createElement("span");
  key.textContent = P.t("legendKey") + (stp && stp.i === 2 ? " · " + P.t("theoryKey") : "");
  lg.appendChild(key);
  $("legend").appendChild(lg);
}

/* ---------- readout table ---------- */
function drawReadout() {
  const N = " " + P.t("unitN"), row = (k, v, cls) => `<tr${cls ? ' class="' + cls + '"' : ""}><td>${P.t(k)}</td><td>${v}</td></tr>`;
  $("readout").hidden = stp && stp.i === 0;
  $("readout").innerHTML = row("rW", f2(blk.W) + N) + row("rT", f2(st.T) + N) + row("rF", f2(blk.W - st.T) + N, "key") +
    row("rG", f2(st.cup) + N, "key") + row("rV", f1(st.V) + " " + P.t("unitCm3")) + row("rD", f1(Math.max(0, st.d)) + " " + P.t("unitCm"));
}

/* ---------- step 3: the rule with numbers ---------- */
function drawRule() {
  const box = $("rule");
  if (!stp || stp.i !== 2) { box.innerHTML = ""; return; }
  let h = "<p>" + P.t("ruleMain") + "</p>";
  if (st.s > 1e-6) {
    const Vm = st.V / 1e6;
    h += "<p>" + P.t("ruleNow", { V: f1(st.V), m: f1(RHO_W * st.V), Vm: Vm.toExponential(2).replace("e-", " × 10^-").replace(/\^-(\d+)/, (m, n) => "⁻" + [...n].map((c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("")), F: f2(st.B), dF: f2(blk.W - st.T), G: f2(st.cup) }) + "</p>";
  } else h += "<p>" + P.t("ruleOut") + "</p>";
  if (st.floating) h += "<p>" + P.t("ruleFloat", { s: f1(blk.sf), W: f2(blk.W) }) + "</p>";
  else if (st.s >= blk.h - 1e-6) {
    const top = st.d - blk.h, pt = pressure(top), pb = pressure(st.d), A = AB / 1e4;
    h += "<p>" + P.t("ruleDeep", { pt: Play.fmt(pt, 0), pb: Play.fmt(pb, 0), dp: Play.fmt(pb - pt, 0), A: Play.fmt(A, 4), Fp: f2((pb - pt) * A) }) + "</p>";
  } else h += "<p>" + P.t("ruleNotYet") + "</p>";
  h += '<table class="readout"><tr><th>' + P.t("tblH") + "</th><th>" + P.t("tW") + "</th><th>" + P.t("tF") + "</th></tr>";
  KEYS.forEach((k) => {
    const b = blockInfo(k), F = b.floats ? b.W : b.Bfull;
    h += "<tr" + (k === blk.k ? ' class="key"' : "") + "><td>" + P.t("b" + k) + "</td><td>" + f2(b.W) + " N</td><td>" + f2(F) + " N" + (b.floats ? " (" + P.t("tFl") + ")" : "") + "</td></tr>";
  });
  h += "</table><p class=\"note\">" + P.t("tblNote") + "</p>";
  box.innerHTML = h;
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }, { label: P.t("o4") }], right: P.t("right"), wrong: P.t("wrong"),
});
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = i === 2 ? "" : P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (st) { drawGraph(); drawReadout(); drawRule(); }
});
function resetAll() {
  stopTween(); trail = []; lastLive = ""; $("live").textContent = "";
  S.blk = "al"; blk = blockInfo("al"); S.yh = YMAX; S.Wv = AC * HS; S.spilled = 0;
  pr.reset(); stp.go(0); update();
}
$("reset").addEventListener("click", resetAll);
// Phones: the 600-wide viewBox shrinks, so grow the label fonts to keep them ≥ 13 px on screen (GOAL 6).
function sizeFonts() {
  [scene, graph].forEach((svg) => {
    const s = svg.getBoundingClientRect().width / 600;
    svg.style.setProperty("--fk", s > 0 ? Math.max(1, 13.6 / (21 * s)).toFixed(3) : "1");
  });
}
let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(sizeFonts); });
sizeFonts();
resetAll();
</script>
</body>
</html>

  u1 = Math.min(3, Math.max(-3, fin(u1, 0))); u2 = Math.min(3, Math.max(-3, fin(u2, 0)));
  e = Math.min(1, Math.max(0, fin(e, 0)));
  const M = m1 + m2, P = m1 * u1 + m2 * u2, w = u1 - u2, hit = w > 1e-9, mu = m1 * m2 / M;
  const v1 = hit ? (P + m2 * e * (u2 - u1)) / M : u1, v2 = hit ? (P + m1 * e * (u1 - u2)) / M : u2;
  const ke0 = 0.5 * m1 * u1 * u1 + 0.5 * m2 * u2 * u2, ke1 = 0.5 * m1 * v1 * v1 + 0.5 * m2 * v2 * v2;
  const heat = hit ? 0.5 * mu * w * w * (1 - e * e) : 0;
  return { m1, u1, m2, u2, e, M, P, V: P / M, w, hit, mu, v1, v2, ke0, ke1, heat };
}
// Contact model: spring k while squashing, k/e² while springing back (e = 0: no spring-back).
function contact(c) {
  if (!c.hit) return null;
  const w1 = Math.sqrt(K / c.mu), X = c.w / w1, Fmax = K * X, Tc = Math.PI / 2 / w1;
  const el = c.e > 1e-6, w2 = el ? w1 / c.e : Infinity, Tr = el ? Math.PI / 2 / w2 : 0, k2 = el ? K / (c.e * c.e) : Infinity;
  return { w1, X, Fmax, Tc, w2, Tr, k2, T: Tc + Tr, dent: X * (1 - c.e * c.e) };
}
// Push between the carts at time tau after first touch (≥ 0), and the squash x of the bumper.
function forceAt(ct, tau) {
  if (!ct || !(tau >= 0) || tau > ct.T) return 0;
  return tau <= ct.Tc ? ct.Fmax * Math.sin(ct.w1 * tau) : ct.Fmax * Math.cos(ct.w2 * (tau - ct.Tc));
}
function squashAt(c, ct, tau) {
  if (tau <= 0) return 0;
  if (tau <= ct.Tc) return ct.X * Math.sin(ct.w1 * tau);
  if (tau <= ct.T) return ct.X - (ct.Fmax / ct.k2) * (1 - Math.cos(ct.w2 * (tau - ct.Tc)));
  return ct.dent - c.e * c.w * (tau - ct.T);           // negative = a gap opens (dent stays)
}
// Full scenario: contact happens at track position 0 at time tc (chosen so both carts start on screen).
function scenario(m1, u1, m2, u2, e) {
  const c = collide(m1, u1, m2, u2, e), ct = contact(c);
  if (!c.hit) return { c, ct, tc: null, tEnd: 2.5 };
  const tc = Math.min(1.5, 1.6 / Math.max(Math.abs(c.u1), Math.abs(c.u2), 1e-6));
  return { c, ct, tc, tEnd: tc + ct.T + TAFTER };
}
function stateAt(s, t) {
  const c = s.c;
  t = Math.max(0, fin(t, 0));
  if (!c.hit) return { x1: -1.2 + c.u1 * t, x2: 1.2 + c.u2 * t, v1: c.u1, v2: c.u2, F: 0, sq: 0, dent: 0, phase: "none" };
  const r0 = 2 * HW + LB;
  if (t <= s.tc) return { x1: -HW - LB + c.u1 * (t - s.tc), x2: HW + c.u2 * (t - s.tc), v1: c.u1, v2: c.u2, F: 0, sq: 0, dent: 0, phase: "before" };
  const tau = t - s.tc, ct = s.ct, x = squashAt(c, ct, tau), r = r0 - x;
  const Xcm = (c.m1 * (-HW - LB) + c.m2 * HW) / c.M + c.V * tau;
  let rdot;                                           // rate of change of centre distance
  if (tau <= ct.Tc) rdot = -ct.X * ct.w1 * Math.cos(ct.w1 * tau);
  else if (tau <= ct.T) rdot = (ct.Fmax / ct.k2) * ct.w2 * Math.sin(ct.w2 * (tau - ct.Tc));
  else rdot = c.e * c.w;
  const inC = tau <= ct.T;
  return {
    x1: Xcm - (c.m2 / c.M) * r, x2: Xcm + (c.m1 / c.M) * r,
    v1: c.V - (c.m2 / c.M) * rdot, v2: c.V + (c.m1 / c.M) * rdot,
    F: forceAt(ct, tau), sq: inC ? Math.max(0, x) : 0, dent: inC ? 0 : ct.dent, phase: inC ? "contact" : "after",
  };
}
// Area under the force curve (trapezoid, n steps): the impulse each cart receives.
function impulse(ct, n) {
  if (!ct) return 0;
  n = n || 400;
  let J = 0;
  const parts = [[0, ct.Tc], [ct.Tc, ct.T]];
  parts.forEach(([a, b]) => {
    if (b - a <= 0) return;
    const h = (b - a) / n;
    for (let i = 0; i < n; i++) J += 0.5 * h * (forceAt(ct, a + i * h) + forceAt(ct, Math.min(b, a + (i + 1) * h)));
  });
  return J;
}
// Crumple zone: same impulse J over time T as a half-sine pulse.
const CAR_M = 1200, CAR_V = 15;
const crash = (T) => { T = Math.max(1e-3, fin(T, 0.1)); const J = CAR_M * CAR_V; return { J, T, Favg: J / T, Fpk: Math.PI / 2 * J / T, g: CAR_V / T / G }; };
/* SIM-END */

const $ = (id) => document.getElementById(id);
const scene = $("scene"), fch = $("fchart"), bars = $("bars");
const S = { m1: 5, u1: 2, m2: 1, u2: -2, e: 0.2, t: 0, playing: false, speed: 1 };
let sc = null, J = 0, raf = 0, last = 0, lastLive = "", stp = null, crT = 0.1;
const f1 = (x) => Play.fmt(Math.abs(x) < 0.005 ? 0 : x, 2).replace("-", "−"), f1s = (x) => (x > 0.005 ? "+" : "") + f1(x);
const fF = (x) => Play.fmt(x, x < 100 ? 1 : 0);
const PRE = {
  pTruck: [5, 2, 1, -2, 0.2], pEqual: [1, 2, 1, -2, 1], pRest: [1, 2, 1, 0, 1], pStick: [2, 1.5, 1, 0, 0],
};

/* ---------- controls ---------- */
Object.keys(PRE).forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(k);
  b.addEventListener("click", () => { [S.m1, S.u1, S.m2, S.u2, S.e] = PRE[k]; recompute(); });
  $("presets").appendChild(b);
});
const SL = { m1: 10, u1: 10, m2: 10, u2: 10, e: 20 };
Object.keys(SL).forEach((id) => $(id).addEventListener("input", () => { S[id] = (+$(id).value || 0) / SL[id]; recompute(); }));
$("speed").addEventListener("change", () => { S.speed = +$("speed").value || 1; });
$("play").addEventListener("click", () => {
  if (S.playing) { pause(); return; }
  if (!sc) recompute();
  if (S.t >= sc.tEnd - 1e-9) S.t = 0;
  S.playing = true; last = 0; raf = requestAnimationFrame(tick); syncPlay();
});
$("skip").addEventListener("click", () => { pause(); if (!sc) recompute(); S.t = sc.tEnd; drawDyn(); say(summary()); syncPlay(); });
function pause() { S.playing = false; cancelAnimationFrame(raf); syncPlay(); }
function syncPlay() { if (!sc) return; $("play").textContent = P.t(S.playing ? "pause" : S.t >= sc.tEnd - 1e-9 ? "replay" : "play"); }
// Sim seconds per real second: contact (a few ms) is stretched to about 2 s.
function rate(t) {
  if (!sc.c.hit) return 1;
  const a = sc.tc - 0.004, b = sc.tc + sc.ct.T + 0.004;
  return t >= a && t <= b ? (b - a) / 2 : 1;
}
function tick(ts) {
  if (!S.playing || !sc) return;
  if (last) S.t += Math.min(0.1, (ts - last) / 1000) * S.speed * rate(S.t);
  last = ts;
  if (S.t >= sc.tEnd) { S.t = sc.tEnd; S.playing = false; say(summary()); }
  drawDyn(); syncPlay();
  if (S.playing) raf = requestAnimationFrame(tick);
}
function say(msg) { if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); } }
function summary() {
  const c = sc.c, P1 = c.m1 * c.v1 + c.m2 * c.v2;
  return c.hit ? P.t("liveHit", { F: fF(sc.ct.Fmax), ms: Play.fmt(sc.ct.T * 1000, 1), p0: f1(c.P), p1: f1(P1), k0: f1(c.ke0), k1: f1(c.ke1), h: f1(c.heat) })
    : P.t("liveNo", { p0: f1(c.P) });
}

/* ---------- drag a cart to set its speed ---------- */
let drag = null;
scene.addEventListener("pointerdown", (e) => {
  const p = Play.pointer(scene, e), st = stateAt(sc, 0);
  const d1 = Math.abs(p.x - px(st.x1)), d2 = Math.abs(p.x - px(st.x2));
  if (Math.min(d1, d2) > 70 || p.y < 20) return;
  pause(); S.t = 0;
  drag = { k: d1 <= d2 ? 1 : 2, x0: p.x, u0: d1 <= d2 ? S.u1 : S.u2 };
  scene.setPointerCapture && scene.setPointerCapture(e.pointerId); e.preventDefault();
});
scene.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = Play.pointer(scene, e), u = Math.round(Play.clamp(drag.u0 + (p.x - drag.x0) / 40, -3, 3) * 10) / 10;
  if (u !== S["u" + drag.k]) { S["u" + drag.k] = u; recompute(); }
});
["pointerup", "pointercancel"].forEach((ev) => scene.addEventListener(ev, () => { drag = null; }));

/* ---------- physics → everything ---------- */
function recompute() {
  pause();
  sc = scenario(S.m1, S.u1, S.m2, S.u2, S.e);
  Object.assign(S, { m1: sc.c.m1, u1: sc.c.u1, m2: sc.c.m2, u2: sc.c.u2, e: sc.c.e });
  J = impulse(sc.ct);
  S.t = 0;
  Object.keys(SL).forEach((id) => { $(id).value = Math.round(S[id] * SL[id]); });
  $("m1Val").textContent = S.m1.toFixed(1) + " " + P.t("unitKg");
  $("m2Val").textContent = S.m2.toFixed(1) + " " + P.t("unitKg");
  $("u1Val").textContent = f1s(S.u1) + " " + P.t("unitMS");
  $("u2Val").textContent = f1s(S.u2) + " " + P.t("unitMS");
  $("eVal").textContent = S.e.toFixed(2) + (S.e === 0 ? " · " + P.t("eStick") : S.e === 1 ? " · " + P.t("eElastic") : "");
  $("cap").textContent = P.t("cap", { k: K });
  drawBars(); drawReadout(); drawRule(); drawDyn(); syncPlay(); say(summary());
}

/* ---------- scene ---------- */
const GY = 150, PXM = 110, px = (x) => 300 + x * PXM;
function arrow(x0, x1, y, cls, parent) {
  const sv = Play.svg, d = x1 - x0;
  if (Math.abs(d) < 3) { sv("circle", { cx: x0, cy: y, r: 4, class: cls.replace("s", "c") }, parent); return; }
  const s = Math.sign(d);
  sv("line", { class: "arr " + cls, x1: x0, y1: y, x2: x1 - s * 6, y2: y }, parent);
  sv("polygon", { class: cls.replace("s", "c"), points: `${x1},${y} ${x1 - s * 13},${y - 8} ${x1 - s * 13},${y + 8}` }, parent);
}
function textAt(x, y, cls, str, parent) {
  const w = str.length * 12.5, xx = Play.clamp(x, 8 + w / 2, 592 - w / 2);
  Play.svg("text", { class: cls, x: xx.toFixed(1), y, "text-anchor": "middle" }, parent).textContent = str;
}
function cart(xc, m, k, sq, dent, parent) {
  const sv = Play.svg, hb = 18 + 7 * m, x = px(xc), hw = HW * PXM, top = GY - 12 - hb;
  sv("rect", { class: "c" + k, x: (x - hw).toFixed(1), y: top.toFixed(1), width: 2 * hw, height: hb, rx: 4 }, parent);
  sv("circle", { class: "wheel", cx: (x - hw * 0.55).toFixed(1), cy: GY - 6, r: 6 }, parent);
  sv("circle", { class: "wheel", cx: (x + hw * 0.55).toFixed(1), cy: GY - 6, r: 6 }, parent);
  if (k === 1) {                                     // spring bumper on the right face
    const L = Math.max(0.03, LB - sq - dent) * PXM, x0 = x + hw, y = GY - 12 - Math.min(hb, 30) / 2, n = 6;
    let d = `M${x0.toFixed(1)},${y}`;
    for (let i = 1; i <= n; i++) d += ` L${(x0 + (L - 6) * (i - 0.5) / n).toFixed(1)},${y + (i % 2 ? -7 : 7)}`;
    d += ` L${(x0 + L - 6).toFixed(1)},${y} L${(x0 + L).toFixed(1)},${y}`;
    sv("path", { class: "spring", d }, parent);
    sv("line", { class: "spring", x1: (x0 + L).toFixed(1), y1: y - 11, x2: (x0 + L).toFixed(1), y2: y + 11 }, parent);
  }
}
function drawDyn() {
  const sv = Play.svg, st = stateAt(sc, S.t), c = sc.c;
  scene.innerHTML = "";
  sv("line", { class: "ground", x1: 0, y1: GY, x2: 600, y2: GY }, scene);
  for (let m = -2; m <= 2; m++) sv("line", { class: "tick", x1: px(m), y1: GY + 4, x2: px(m), y2: GY + 10 }, scene);
  cart(st.x1, c.m1, 1, st.sq, st.dent, scene);
  cart(st.x2, c.m2, 2, 0, 0, scene);
  // velocity arrows: cart 1 on the top row, cart 2 on the second row
  [[st.x1, st.v1, 1, 22, 38], [st.x2, st.v2, 2, 60, 76]].forEach(([x, v, k, ty, ay]) => {
    arrow(px(x), px(x) + v * 35, ay, "s" + k, scene);
    textAt(px(x) + v * 17, ty, "lb" + k, f1s(v) + " " + P.t("unitMS"), scene);
  });
  textAt(px(st.x1), GY + 32, "lb1", +c.m1.toFixed(1) + " " + P.t("unitKg"), scene);
  textAt(px(st.x2), GY + 32, "lb2", +c.m2.toFixed(1) + " " + P.t("unitKg"), scene);
  if (st.phase === "contact" && st.F > 0.5) {         // the two pushes: same length, opposite ways
    const xc = px(st.x2 - HW), L = 18 + 110 * st.F / sc.ct.Fmax, y = 202, lab = fF(st.F) + " " + P.t("unitN");
    arrow(xc - 4, xc - 4 - L, y, "s1", scene);
    arrow(xc + 4, xc + 4 + L, y, "s2", scene);
    sv("text", { class: "lb1", x: (xc - 10).toFixed(1), y: 238, "text-anchor": "end" }, scene).textContent = lab;
    sv("text", { class: "lb2", x: (xc + 10).toFixed(1), y: 238 }, scene).textContent = lab;
  }
  $("tag").textContent = !c.hit ? P.t("tagNo") : st.phase === "contact" ? P.t("tagSlow", { ms: Play.fmt(sc.ct.T * 1000, 1) }) : P.t("tagRun");
  drawForce(st);
}

/* ---------- force–time graph ---------- */
const FX0 = 80, FX1 = 410, FY0 = 132, FA = 92;
function drawForce() {
  const sv = Play.svg, ct = sc.ct;
  fch.innerHTML = "";
  sv("line", { class: "ax", x1: FX0, y1: FY0, x2: FX1, y2: FY0 }, fch);
  sv("line", { class: "ax", x1: FX0, y1: FY0 - FA - 14, x2: FX0, y2: FY0 + FA + 14 }, fch);
  if (!ct) { sv("text", { class: "lbl", x: 330, y: FY0 - 16, "text-anchor": "middle" }, fch).textContent = P.t("tagNo"); return; }
  const span = ct.T * 1.25 + 1e-6, t0 = -ct.T * 0.1, tx = (t) => FX0 + (t - t0) / span * (FX1 - FX0);
  const ty = (f) => FY0 - f / ct.Fmax * FA;
  const up = [], dn = [], N = 160;
  for (let i = 0; i <= N; i++) { const t = t0 + span * i / N, f = forceAt(ct, t); up.push(tx(t).toFixed(1) + "," + ty(f).toFixed(1)); dn.push(tx(t).toFixed(1) + "," + ty(-f).toFixed(1)); }
  const base = `${tx(t0 + span).toFixed(1)},${FY0} ${tx(t0).toFixed(1)},${FY0}`;
  sv("polygon", { class: "area2", points: up.join(" ") + " " + base }, fch);
  sv("polygon", { class: "area1", points: dn.join(" ") + " " + base }, fch);
  sv("polyline", { class: "curve2", points: up.join(" ") }, fch);
  sv("polyline", { class: "curve1", points: dn.join(" ") }, fch);
  sv("line", { class: "grid", x1: FX0, y1: ty(ct.Fmax), x2: FX1, y2: ty(ct.Fmax) }, fch);
  sv("line", { class: "grid", x1: FX0, y1: ty(-ct.Fmax), x2: FX1, y2: ty(-ct.Fmax) }, fch);
  const fl = fF(ct.Fmax);
  sv("text", { class: "lbl", x: FX0 - 6, y: ty(ct.Fmax) + 8, "text-anchor": "end" }, fch).textContent = fl;
  sv("text", { class: "lbl", x: FX0 - 6, y: ty(-ct.Fmax) + 8, "text-anchor": "end" }, fch).textContent = "−" + fl;
  const LX = FX1 + 14;
  sv("text", { class: "lb2", x: LX, y: FY0 - 56 }, fch).textContent = P.t("fOn2");
  sv("text", { class: "lb2", x: LX, y: FY0 - 26 }, fch).textContent = P.t("jLbl", { j: "+" + f1(J) });
  sv("text", { class: "lb1", x: LX, y: FY0 + 44 }, fch).textContent = P.t("fOn1");
  sv("text", { class: "lb1", x: LX, y: FY0 + 74 }, fch).textContent = P.t("jLbl", { j: "−" + f1(J) });
  [[0, "0"], [ct.T, Play.fmt(ct.T * 1000, 1)]].forEach(([t, s]) => {
    sv("line", { class: "ax", x1: tx(t), y1: FY0 + FA + 6, x2: tx(t), y2: FY0 + FA + 14 }, fch);
    sv("text", { class: "lbl", x: tx(t), y: 264, "text-anchor": "middle" }, fch).textContent = s;
  });
  sv("text", { class: "lbl", x: 590, y: 264, "text-anchor": "end" }, fch).textContent = P.t("tAxis");
  sv("text", { class: "lbl", x: FX0 + 8, y: 24 }, fch).textContent = P.t("fAxis");
  const tau = S.t - sc.tc;
  if (tau >= t0 && tau <= t0 + span) sv("line", { class: "cursor", x1: tx(tau), y1: FY0 - FA - 10, x2: tx(tau), y2: FY0 + FA + 10 }, fch);
}

/* ---------- momentum + energy bars ---------- */
function drawBars() {
  const sv = Play.svg, c = sc.c;
  bars.innerHTML = "";
  const p = [[c.m1 * c.u1, c.m1 * c.v1, 1], [c.m2 * c.u2, c.m2 * c.v2, 2], [c.P, c.m1 * c.v1 + c.m2 * c.v2, 0]];
  const mx = Math.max(1e-9, ...p.map((r) => Math.max(Math.abs(r[0]), Math.abs(r[1])))), Z = 340, SC = 140 / mx;
  sv("line", { class: "ax", x1: Z, y1: 8, x2: Z, y2: 226 }, bars);
  const names = ["p₁", "p₂", "p₁+p₂"];
  p.forEach((r, i) => {
    const y = 14 + i * 72, cls = r[2] ? "c" + r[2] : "wheel", lc = r[2] ? "lb" + r[2] : "lbF";
    sv("text", { class: lc, x: 8, y: y + 38 }, bars).textContent = names[i];
    [r[0], r[1]].forEach((v, j) => {
      const yy = y + j * 30, w = v * SC;
      sv("rect", { class: cls + (j ? "" : " pale"), x: Math.min(Z, Z + w).toFixed(1), y: yy, width: Math.abs(w).toFixed(1), height: 24, rx: 3 }, bars);
      const tx = v >= 0 ? Z + Math.abs(w) + 6 : Z - Math.abs(w) - 6;

    });
  });

  // kinetic energy

  sv("text", { class: "lbF", x: 8, y: y0 + 38 }, bars).textContent = P.t("ke");
  const k = [[0.5 * c.m1 * c.u1 * c.u1, 0.5 * c.m2 * c.u2 * c.u2, 0], [0.5 * c.m1 * c.v1 * c.v1, 0.5 * c.m2 * c.v2 * c.v2, c.heat]];
  k.forEach((r, j) => {
    let x = E0;

      const w = Math.max(0, v) * ES;
      if (w > 0.2) sv("rect", { class: cl + (j ? "" : " pale"), x: x.toFixed(1), y: yy, width: w.toFixed(1), height: 24 }, bars);
      x += w;
    });
    const kin = r[0] + r[1];
    sv("text", { class: "lbl", x: (Math.max(x, E0) + 6).toFixed(1), y: yy + 20 }, bars).textContent = f1(kin) + (j && r[2] > 0.005 ? " + " + f1(r[2]) : "") + " " + P.t("unitJ");
  });
  sv("text", { class: "lbH", x: E0, y: y0 + 86 }, bars).textContent = c.heat > 0.005 ? P.t("heat", { h: f1(c.heat) }) : "";
  sv("text", { class: "lbl", x: 590, y: y0 + 116, "text-anchor": "end" }, bars).textContent = P.t("before") + " / " + P.t("after") + " · " + P.t("unitJ");
}

/* ---------- readout table ---------- */
function drawReadout() {
  const c = sc.c, u = " ";
  const row = (k, a, b, t) => `<tr><td>${P.t(k)}</td><td>${a}</td><td>${b}</td><td>${t}</td></tr>`;
  const d1 = c.m1 * (c.v1 - c.u1), d2 = c.m2 * (c.v2 - c.u2);
  $("readout").innerHTML =
    `<tr><th></th><th class="h1">${P.t("colA")}</th><th class="h2">${P.t("colB")}</th><th>${P.t("colT")}</th></tr>` +
    row("rU", f1s(c.u1), f1s(c.u2), "") + row("rV", f1s(c.v1), f1s(c.v2), "") +
    row("rP0", f1s(c.m1 * c.u1), f1s(c.m2 * c.u2), f1s(c.P)) +
    row("rP1", f1s(c.m1 * c.v1), f1s(c.m2 * c.v2), f1s(c.m1 * c.v1 + c.m2 * c.v2)) +
    row("rDP", f1s(d1), f1s(d2), f1s(d1 + d2)) +
    row("rJ", f1s(-J), f1s(J), f1s(0)) +
    row("rF", sc.ct ? fF(sc.ct.Fmax) + u + P.t("unitN") : "0", sc.ct ? fF(sc.ct.Fmax) + u + P.t("unitN") : "0", "");
}

/* ---------- step 3: rule + crumple zone ---------- */
function drawRule() {
  const box = $("rule");
  if (!stp || stp.i !== 2) { box.innerHTML = ""; return; }
  const c = sc.c;
  let h = "";
  if (c.hit) {
    const dv1 = Math.abs(c.v1 - c.u1), dv2 = Math.abs(c.v2 - c.u2);
    h += "<p>" + P.t("ruleF", { F: fF(sc.ct.Fmax), ms: Play.fmt(sc.ct.T * 1000, 1), J: f1(J) }) + "</p>";
    h += "<p>" + P.t("ruleP", { d1: f1s(c.m1 * (c.v1 - c.u1)), d2: f1s(c.m2 * (c.v2 - c.u2)), p: f1s(c.P) }) + "</p>";
    h += "<p>" + P.t("ruleE", { h: f1(c.heat), k: f1(c.ke0), pct: Play.fmt(100 * c.heat / Math.max(1e-9, c.ke0), 0) }) + "</p>";
    h += "<p>" + P.t("ruleA", { dv1: f1(dv1), dv2: f1(dv2), r: Play.fmt(dv2 / Math.max(1e-9, dv1), 2) }) + "</p>";
  } else h += "<p>" + P.t("ruleNo") + "</p>";
  h += '<div class="crumple"><h3>' + P.t("crH") + '</h3><p id="crNote"></p>' +
    '<svg class="fig" id="crSvg" viewBox="0 0 360 200" role="img" aria-label="' + P.t("crAria") + '"></svg>' +
    '<div class="controls"><label for="crT">' + P.t("crLbl") + '</label><input type="range" id="crT" min="3" max="20" step="1" value="' + Math.round(crT * 100) + '"><span class="val" id="crVal"></span></div>' +
    '<p id="crRows"></p></div>';
  box.innerHTML = h;
  $("crT").addEventListener("input", () => { crT = Play.clamp(+$("crT").value || 10, 3, 20) / 100; drawCrumple(); });
  drawCrumple();
}
function drawCrumple() {
  const g = $("crSvg"), sv = Play.svg;
  if (!g) return;
  const a = crash(0.01), b = crash(crT);
  $("crNote").textContent = P.t("crNote", { J: Play.fmt(a.J, 0) });
  $("crVal").textContent = crT.toFixed(2) + " s";
  const row = (r) => P.t("crRow", { t: r.T.toFixed(2), F: Play.fmt(r.Favg / 1000, 0), g: Play.fmt(r.g, 0) });
  $("crRows").innerHTML = row(a) + "<br>" + row(b) + "<br>" + P.t("crSay", { r: Play.fmt(b.T / a.T, 1) });
  g.innerHTML = "";
  const X0 = 20, X1 = 350, Y0 = 170, TM = 0.2, H = 140, tx = (t) => X0 + t / TM * (X1 - X0), fy = (f) => Y0 - f / a.Fpk * H;
  sv("line", { class: "ax", x1: X0, y1: Y0, x2: X1, y2: Y0 }, g);
  [[b, "area2", "curve2"], [a, "area1", "curve1"]].forEach(([r, ac, cc]) => {
    const pts = [];
    for (let i = 0; i <= 60; i++) { const t = r.T * i / 60; pts.push(tx(t).toFixed(1) + "," + fy(r.Fpk * Math.sin(Math.PI * t / r.T)).toFixed(1)); }
    sv("polygon", { class: ac, points: pts.join(" ") + ` ${tx(r.T).toFixed(1)},${Y0} ${X0},${Y0}` }, g);
    sv("polyline", { class: cc, points: pts.join(" ") }, g);
  });
  sv("text", { class: "lb1", x: tx(0.01) + 8, y: 40 }, g).textContent = P.t("stiff");
  sv("text", { class: "lb2", x: Math.max(tx(crT) + 8, tx(0.01) + 70), y: Math.max(80, fy(b.Fpk * 0.6)) }, g).textContent = P.t("crumple");
  sv("text", { class: "lbl", x: X1, y: Y0 + 26, "text-anchor": "end" }, g).textContent = "t → " + TM + " s";
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3") }, { label: P.t("o4"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
});
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = i === 2 ? "" : P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (sc) drawRule();
});
function resetAll() {
  [S.m1, S.u1, S.m2, S.u2, S.e] = PRE.pTruck;
  S.speed = 1; $("speed").value = "1"; crT = 0.1; lastLive = ""; $("live").textContent = "";
  pr.reset(); stp.go(0); recompute();
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

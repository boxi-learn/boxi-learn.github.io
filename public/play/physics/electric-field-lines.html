/* SIM-BEGIN — pure physics, no DOM (tests extract this block) */
const K = 8.99e9, UNIT_NC = 10, QT_NC = 1, RMIN = 0.5;   // N·m²/C², nC per unit, test charge nC, clamp cm
const KC = K * 1e-9 * 1e4;                               // E (N/C) = KC · Q[nC] / r[cm]²
const WX = 20, WY = 12;                                  // world: x ∈ [−20, 20], y ∈ [−12, 12] cm
// Point charge: {x, y, q} with q in units (±1…±3, 1 unit = 10 nC).
// Plate (seen edge-on): {plate: true, y, a, b, q} — uniform square sheet x ∈ [−a, a], depth z ∈ [−b, b] (cm), q in units.
function plateField(x, y, p) {
  const sig = p.q * UNIT_NC * 1e-9 / (4 * p.a * p.b * 1e-4);   // C/m²
  const h0 = y - p.y, h = Math.max(Math.abs(h0), 0.03), sg = h0 > 0 ? 1 : h0 < 0 ? -1 : 0, b = p.b;
  const s1 = -p.a - x, s2 = p.a - x;
  const R1 = Math.sqrt(s1 * s1 + b * b + h * h), R2 = Math.sqrt(s2 * s2 + b * b + h * h);
  const ey = 2 * K * sig * sg * (Math.atan(s2 * b / (h * R2)) - Math.atan(s1 * b / (h * R1)));
  const ex = 2 * K * sig * (Math.asinh(b / Math.sqrt(s2 * s2 + h * h)) - Math.asinh(b / Math.sqrt(s1 * s1 + h * h)));
  return [ex, ey];
}
function fieldRaw(x, y, ch, rmin) {
  let ex = 0, ey = 0;
  for (const c of ch) {
    if (c.plate) { const f = plateField(x, y, c); ex += f[0]; ey += f[1]; continue; }
    const dx = x - c.x, dy = y - c.y;
    const r2 = Math.max(dx * dx + dy * dy, rmin * rmin), r = Math.sqrt(r2);
    const s = KC * c.q * UNIT_NC / (r2 * r);
    ex += s * dx; ey += s * dy;
  }
  return { x: ex, y: ey, m: Math.hypot(ex, ey) };
}
const fieldAt = (x, y, ch) => fieldRaw(x, y, ch, RMIN);        // N/C, distances < 0.5 cm count as 0.5 cm
const distTo = (x, y, c) => (c.plate ? (Math.abs(x) <= c.a ? Math.abs(y - c.y) : Math.hypot(Math.abs(x) - c.a, y - c.y)) : Math.hypot(x - c.x, y - c.y));
// per-charge contributions and total force (N) on the +1 nC test charge
function forceOn(tx, ty, ch) {
  const parts = ch.map((c) => { const f = fieldAt(tx, ty, [c]); return { r: distTo(tx, ty, c), F: f.m * QT_NC * 1e-9 }; });
  const E = fieldAt(tx, ty, ch);
  const fx = E.x * QT_NC * 1e-9, fy = E.y * QT_NC * 1e-9, F = Math.hypot(fx, fy);
  return { parts, E: E.m, fx, fy, F, ang: F > 0 ? Math.atan2(fy, fx) * 180 / Math.PI : 0 };
}
// force between two point charges (nC) at distance r (cm), in N
const coulomb = (q1, q2, r) => K * q1 * 1e-9 * q2 * 1e-9 / Math.pow(Math.max(r, RMIN) * 0.01, 2);

const BOX = 60, ENDR = 0.45, MAXSTEP = 1400;
function dirAt(x, y, ch, sgn) {
  const E = fieldRaw(x, y, ch, 0.2);
  return E.m > 1e-6 ? [sgn * E.x / E.m, sgn * E.y / E.m] : null;
}
function crossPlate(x, y, nx, ny, ch, src, i) {
  for (let j = 0; j < ch.length; j++) {
    const c = ch[j];
    if (!c.plate || (j === src && i < 2) || ny === y || (y - c.y) * (ny - c.y) > 0) continue;
    const f = (c.y - y) / (ny - y);
    if (Math.abs(x + f * (nx - x)) <= c.a) return j;
  }
  return -1;
}
// trace one line from (x0,y0); sgn = +1 follows E (from +), −1 goes against E (from −); src = index to ignore
function trace(x0, y0, ch, sgn, src) {
  const pts = [x0, y0];
  let x = x0, y = y0, end = -1;
  for (let i = 0; i < MAXSTEP; i++) {
    let dmin = 1e9;
    for (const c of ch) dmin = Math.min(dmin, distTo(x, y, c));
    const h = Math.min(0.8, Math.max(0.08, 0.2 * dmin));
    const k1 = dirAt(x, y, ch, sgn); if (!k1) break;
    // a plate stops the line where the straight step would cross it (RK would otherwise creep along it)
    let pc = crossPlate(x, y, x + h * k1[0], y + h * k1[1], ch, src, i);
    let nx = 0, ny = 0;
    if (pc < 0) {
      const k2 = dirAt(x + h / 2 * k1[0], y + h / 2 * k1[1], ch, sgn); if (!k2) break;

function loadPreset(name) {
  S.preset = name; S.ch = presetCharges(name);
  if (name === "plates") { S.tx = 0; S.ty = 0; S.sel = "t"; } else { S.tx = 0; S.ty = 6; S.sel = "t"; }
  update(true);
}
function addCharge(sign) {
  if (plates() || S.ch.length >= 4) return;
  const spots = [[0, -7], [0, 7], [-12, -6], [12, 6], [-12, 6], [12, -6], [-15, 0], [15, 0], [0, 0]];
  const s = spots.find(([x, y]) => freeSpot(x, y, -1) && Math.hypot(x - S.tx, y - S.ty) > 1.5) || [0, 0];
  S.ch.push({ x: s[0], y: s[1], q: sign });
  S.sel = S.ch.length - 1; S.preset = ""; update(true);
}
function changeQ(d) {
  const c = typeof S.sel === "number" ? S.ch[S.sel] : null;
  if (!c || c.fixed) return;
  let q = Play.clamp(c.q + d, -3, 3);
  if (q === 0) q = d > 0 ? 1 : -1;
  c.q = q; S.preset = ""; update(true);
}
function removeSel() {
  if (typeof S.sel !== "number" || plates()) return;
  S.ch.splice(S.sel, 1); S.sel = "t"; S.preset = ""; update(true);
}
function objects() { const o = []; if (S.test) o.push("t"); if (!plates()) S.ch.forEach((c, i) => o.push(i)); return o; }

/* ---------- pointer ---------- */
function pick(w) {
  const step = stp.i, tol = Math.max(1.0, 22 / sc);
  if (step > 0 && (step === 2 || S.test) && Math.hypot(w.x - S.tx, w.y - S.ty) < tol) return "t";
  if (step !== 1 || plates()) return null;
  let best = null, bd = tol;
  S.ch.forEach((c, i) => { const d = Math.hypot(w.x - c.x, w.y - c.y); if (d < bd) { bd = d; best = i; } });
  return best;
}
cv.addEventListener("pointerdown", (e) => {
  const w = toWorld(e), o = pick(w);
  if (o === null) return;
  e.preventDefault();
  if (stp.i === 1) S.sel = o;
  const ox = o === "t" ? S.tx : S.ch[o].x, oy = o === "t" ? S.ty : S.ch[o].y;
  drag = { o, dx: ox - w.x, dy: oy - w.y };
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
  update(false);
});
cv.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const w = toWorld(e);
  moveObj(drag.o, w.x + drag.dx, w.y + drag.dy);
});
const endDrag = () => { if (drag) { drag = null; panel(); } };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("keydown", (e) => {
  const step = stp.i;
  if (step === 0) return;
  const d = e.shiftKey ? 2 : 0.5, mv = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[e.key];
  if (step === 2) {
    if (mv) { e.preventDefault(); moveObj("t", S.tx + mv[0], S.ty + mv[1]); }
    return;
  }
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    const o = objects(); if (!o.length) return;
    const i = o.indexOf(S.sel); S.sel = o[(i + 1) % o.length]; update(false);
  } else if (mv) {
    e.preventDefault();
    if (S.sel === "t" && !S.test) return;
    const cur = S.sel === "t" ? [S.tx, S.ty] : S.ch[S.sel] ? [S.ch[S.sel].x, S.ch[S.sel].y] : null;
    if (cur) moveObj(S.sel, cur[0] + mv[0], cur[1] + mv[1]);
  } else if (e.key === "+" || e.key === "=") { e.preventDefault(); changeQ(1); }
  else if (e.key === "-" || e.key === "_") { e.preventDefault(); changeQ(-1); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeSel(); }
});

/* ---------- controls ---------- */
const presetBtns = {};
[["single", "pSingle"], ["dipole", "pDipole"], ["like", "pLike"], ["plates", "pPlates"]].forEach(([k, s]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(s);
  b.addEventListener("click", () => loadPreset(k));
  $("presets").appendChild(b); presetBtns[k] = b;
});
$("addP").addEventListener("click", () => addCharge(1));
$("addN").addEventListener("click", () => addCharge(-1));
$("qUp").addEventListener("click", () => changeQ(1));
$("qDn").addEventListener("click", () => changeQ(-1));
$("del").addEventListener("click", removeSel);
$("cLines").addEventListener("change", (e) => { S.lines = e.target.checked; update(false); });
$("cGrid").addEventListener("change", (e) => { S.grid = e.target.checked; update(false); });
$("cTest").addEventListener("change", (e) => { S.test = e.target.checked; if (!S.test && S.sel === "t") S.sel = S.ch.length && !plates() ? 0 : "t"; update(false); });
function markR0() {
  const c = S.ch[0]; if (!c) return;
  S.r0 = Play.clamp(Math.hypot(S.tx - c.x, S.ty - c.y), RMIN, 16);
  S.F0 = forceOn(S.tx, S.ty, S.ch).F; update(false);
}
function testAt(r) {
  const c = S.ch[0]; if (!c) return;
  const a = Math.atan2(S.ty - c.y, S.tx - c.x) || 0;
  moveObj("t", c.x + r * Math.cos(a), c.y + r * Math.sin(a));
}
$("setR0").addEventListener("click", markR0);
$("goR0").addEventListener("click", () => testAt(S.r0));
$("go2R0").addEventListener("click", () => testAt(2 * S.r0));

/* ---------- steps ---------- */
function enterStep(i) {
  if (i === 0) { S.ch = [{ x: -5, y: 0, q: 1, fixed: true }, { x: 5, y: 0, q: -1, fixed: true }]; retrace(); }
  else if (i === 1) { if (S.ch.some((c) => c.fixed) || !S.ch.length || S.step3) { S.step3 = false; loadPreset(S.preset || "dipole"); return; } }
  else { S.ch = [{ x: -13, y: 0, q: 1 }]; S.tx = -7; S.ty = 0; S.step3 = true; retrace(); markR0(); return; }
  update(false);
}
const Fp = coulomb(UNIT_NC, UNIT_NC, 10), mg = Fp / 9.81 * 1e6;
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { F: fmtSci(Fp), m: Play.fmt(mg, 0) }), wrong: P.t("wrong", { F: fmtSci(Fp) }),
}, () => { S.answered = true; update(false); });
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  enterStep(i);
});
function resetAll() {
  Object.assign(S, { ch: [], tx: 0, ty: 6, sel: "t", lines: true, grid: false, test: true, preset: "dipole", answered: false, r0: 6, F0: 0, step3: false });
  pr.reset(); stp.go(0);
}
$("reset").addEventListener("click", resetAll);
readColors();
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
if (mq && mq.addEventListener) mq.addEventListener("change", () => { readColors(); schedule(); });
if ("ResizeObserver" in window) new ResizeObserver(resize).observe(cv); else addEventListener("resize", resize);
resetAll();
resize();
</script>
</body>
</html>

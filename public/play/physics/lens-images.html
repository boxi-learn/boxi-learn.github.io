/* SIM-BEGIN — pure thin-lens model, no DOM (tests extract this block). Units: cm. Real-is-positive. */
const A_CM = 10, H_CM = 4, U_MIN = 1, U_MAX = 38, F_MIN = 4, F_MAX = 10, X_MIN = 1, X_MAX = 39.5;
const r10 = (x) => Math.round(x * 10) / 10;
function lens(u, f) {
  u = Number.isFinite(u) ? Math.min(U_MAX, Math.max(U_MIN, u)) : 20;
  f = Number.isFinite(f) ? Math.min(F_MAX, Math.max(F_MIN, f)) : 8;
  const d10 = Math.round(u * 10) - Math.round(f * 10); // tenths of a cm: exact zero test
  if (d10 === 0) return { u, f, kind: "inf", v: null, m: null, zone: 3 };
  const v = (u * f) / (u - f), m = -v / u;
  const r = Math.round(u * 10) - 2 * Math.round(f * 10);
  const zone = r > 0 ? 0 : r === 0 ? 1 : d10 > 0 ? 2 : 4;
  return { u, f, kind: v > 0 ? "real" : "virtual", v, m, zone };
}
/* Ray from (−u, y0) hitting the lens at height yL leaves with slope s' = (yL − y0)/u − yL/f. */
const outSlope = (u, f, y0, yL) => (yL - y0) / u - yL / f;
/* Screen at x (cm right of lens). cover: "none" | "top" | "bottom". */
function screen(u, f, x, cover) {
  const g = 1 + x / u - x / f;               // spread factor of one point's rays on the screen
  const open = cover === "none" ? 2 * A_CM : A_CM;
  const c = cover === "top" ? -A_CM / 2 : cover === "bottom" ? A_CM / 2 : 0; // mean yL of open part
  return { blur: open * Math.abs(g), shift: c * g, hImg: (-x * H_CM) / u, light: open / (2 * A_CM) };
}
const blocked = (yL, cover) => (cover === "top" && yL > 1e-9) || (cover === "bottom" && yL < -1e-9);
function sharpAt(L, x, blur) { return L.kind === "real" && (Math.abs(x - L.v) <= 0.051 || blur <= 0.4); }
function sizeWord(m) { const a = Math.abs(m); return a > 1.005 ? "bigger" : a < 0.995 ? "smaller" : "same"; }
/* SIM-END */

const fmtV = (v) => (Math.abs(v) > 999 ? P.t("far") : nf(v));
const nfs = (x) => String(+(+x).toFixed(2)).replace("-", "−");
const fmtM = (m) => (Math.abs(m) >= 100 ? nf(m, 0) : nf(m, 2));

function candle(parent, x, base, H, cls, flameCls) { // H in px, + = up
  const w = Play.clamp(Math.abs(H) * 0.2, 2.5, 9), top = base - H, neck = base - 0.68 * H, mid = base - 0.82 * H;
  sv("line", { class: cls, x1: x, y1: base, x2: x, y2: neck }, parent);
  sv("path", { class: flameCls, d: `M${x},${top} Q${x + w},${mid} ${x},${neck} Q${x - w},${mid} ${x},${top}Z` }, parent);
}
function seg(parent, cls, x1, y1, x2, y2) { return sv("line", { class: cls, x1: px(x1).toFixed(1), y1: py(y1).toFixed(1), x2: px(x2).toFixed(1), y2: py(y2).toFixed(1) }, parent); }
function handle(fid, aria, now, min, max, txt) {
  const g = sv("g", { class: "hit", tabindex: 0, role: "slider", "data-fid": fid, "aria-label": aria, "aria-valuemin": min, "aria-valuemax": max, "aria-valuenow": now, "aria-valuetext": txt }, fig);
  return g;
}

function draw() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  const L = lens(S.u, S.f), u = L.u, f = L.f, h = H_CM;
  fig.innerHTML = "";
  const defs = sv("defs", {}, fig), cp = sv("clipPath", { id: "clipV" }, defs);
  sv("rect", { x: 0, y: 0, width: 640, height: 300 }, cp);
  const g = sv("g", { "clip-path": "url(#clipV)" }, fig);
  // axis, lens plane, focal marks
  sv("line", { class: "axis", x1: 0, y1: AX, x2: 640, y2: AX }, g);
  sv("line", { class: "plane", x1: X0, y1: 0, x2: X0, y2: 300 }, g);
  [[-f, "lF"], [f, "lF2"], [-2 * f, "l2F"], [2 * f, "l2F2"]].forEach(([x, k]) => {
    if (Math.abs(x) > 39) return;
    sv("circle", { class: "tick", cx: px(x), cy: AX, r: 4 }, g);
    sv("text", { class: "lblF", x: px(x), y: AX + 28, "text-anchor": "middle" }, g).textContent = P.t(k);
  });
  // lens (biconvex)
  const yT = py(A_CM), yB = py(-A_CM);
  sv("path", { class: "lens", d: `M${X0},${yT} Q${X0 + 18},${AX} ${X0},${yB} Q${X0 - 18},${AX} ${X0},${yT}Z` }, g);
  const xEnd = S.scr ? S.x : 41;
  const outEnd = (yL, y0) => { const s = outSlope(u, f, y0, yL); return [xEnd, yL + s * xEnd]; };
  // fan of rays from the candle tip
  const N = 9;
  for (let i = 0; i < N; i++) {
    const yL = -A_CM + (2 * A_CM * i) / (N - 1), bl = blocked(yL, S.cover);
    seg(g, "fan" + (bl ? " off" : ""), -u, h, 0, yL);
    if (!bl) { const e = outEnd(yL, h); seg(g, "fan", 0, yL, e[0], e[1]); }
  }
  // principal rays
  const pr = [{ c: "r1", yL: h }, { c: "r2", yL: 0 }];
  if (L.kind !== "inf") { const y3 = (h * f) / (f - u); if (Math.abs(y3) < 40) pr.push({ c: "r3", yL: y3 }); }
  pr.forEach((r) => {
    if (r.c === "r3" && u < f) seg(g, "ext " + r.c, -f, 0, -u, h); // construction line from F
    seg(g, "pr " + r.c, -u, h, 0, r.yL);
    if (blocked(r.yL, S.cover)) return;
    const e = outEnd(r.yL, h);
    seg(g, "pr " + r.c, 0, r.yL, e[0], e[1]);
    if (L.kind === "virtual") seg(g, "ext " + r.c, 0, r.yL, L.v, L.m * h);
  });
  // cover card
  if (S.cover !== "none") {
    const top = S.cover === "top";
    sv("rect", { class: "card", x: X0 - 7, y: top ? yT - 12 : AX + 1, width: 14, height: A_CM * K + 11, rx: 3 }, g);
  }
  // image
  if (L.kind !== "inf" && Math.abs(L.v) <= 40) {
    const ig = sv("g", { class: L.kind === "real" && S.scr && S.x < L.v - 0.05 ? "ghost" : "" }, g);
    candle(ig, px(L.v), AX, L.m * h * K, "img" + (L.kind === "virtual" ? " virt" : ""), "imgFlame");
  }
  // screen + where the tip's rays land on it
  if (S.scr) {
    const sc = screen(u, f, S.x, S.cover);
    sv("line", { class: "scr", x1: px(S.x), y1: 44, x2: px(S.x), y2: 286 }, g);
    const yc = sc.shift + sc.hImg, half = sc.blur / 2;
    if (half < 25) sv("line", { class: "spot", x1: px(S.x), y1: py(yc + half) - 0.5, x2: px(S.x), y2: py(yc - half) + 0.5 }, g);
  }
  // edge labels
  const lab = (x, y, k, vars, anchor) => { sv("text", { class: "lblE", x, y, "text-anchor": anchor }, fig).textContent = P.t(k, vars); };
  if (L.kind === "inf") lab(630, 30, "parallel", {}, "end");
  else if (L.kind === "real" && L.v > 40) lab(630, 30, "offR", { v: fmtV(L.v) }, "end");
  else if (L.kind === "virtual" && L.v < -40) lab(10, 30, "offL", { v: fmtV(L.v) }, "start");
  // draggable candle (drawn last so it sits on top)
  const go = handle("obj", P.t("objAria"), u.toFixed(1), U_MIN, U_MAX, P.t("objVal", { u: nf(u) }));
  sv("rect", { class: "ring", x: px(-u) - 22, y: py(h) - 14, width: 44, height: h * K + 34, rx: 8 }, go);
  candle(go, px(-u), AX, h * K, "obj", "flame");
  if (S.scr) {
    const gs = handle("scr", P.t("scrAria"), S.x.toFixed(1), X_MIN, X_MAX, P.t("scrVal", { x: nf(S.x) }));
    sv("rect", { class: "ring", x: px(S.x) - 20, y: 38, width: 40, height: 254, rx: 8 }, gs);
  }
  if (fid) { const el = fig.querySelector(`[data-fid="${fid}"]`); if (el) el.focus(); }
  return L;
}

function screenView(L) {
  const box = $("scrView");
  box.innerHTML = "";
  sv("rect", { class: "sc", x: 0, y: 0, width: 168, height: 112, rx: 10 }, box);
  sv("text", { class: "sTxt", x: 8, y: 18 }, box).textContent = P.t("scrTitle");
  let side = "";
  if (!S.scr) { sv("text", { class: "sTxt", x: 84, y: 64, "text-anchor": "middle" }, box).textContent = P.t("scrNone"); }
  else {
    const sc = screen(L.u, L.f, S.x, S.cover), KS = Math.min(12, 66 / Math.max(1e-6, Math.abs(sc.hImg))), cy = 62 + (sc.hImg * KS) / 2;
    const bpx = sc.blur * KS, sd = Play.clamp(bpx / 4, 0, 30);
    const defs = sv("defs", {}, box), fl = sv("filter", { id: "bl", x: "-200%", y: "-200%", width: "500%", height: "500%" }, defs);
    sv("feGaussianBlur", { stdDeviation: sd.toFixed(2) }, fl);
    const gg = sv("g", { filter: sd > 0.05 ? "url(#bl)" : "", opacity: sc.light.toFixed(2) }, box);
    candle(gg, 84, cy - sc.shift * KS, sc.hImg * KS, "sObj", "sFl");
    const sharp = sharpAt(L, S.x, sc.blur);
    side = (sharp ? P.t("sharpL") : P.t("blurL", { b: nf(sc.blur) })) + "<br>" + P.t("light", { p: Math.round(sc.light * 100) });
  }
  $("scrSide").innerHTML = side;
}

function panel(L) {
  $("uVal").textContent = nf(L.u) + " cm"; $("fVal").textContent = nf(L.f) + " cm"; $("xsVal").textContent = nf(S.x) + " cm";
  $("u").value = L.u; $("f").value = L.f; $("xs").value = S.x; $("scrOn").checked = S.scr; $("xs").disabled = !S.scr;
  $("slide").textContent = P.t(S.playing ? "pause" : "slide");
  $("slide").setAttribute("aria-pressed", S.playing ? "true" : "false");
  Object.keys(coverBtns).forEach((k) => { coverBtns[k].classList.toggle("on", S.cover === k); coverBtns[k].setAttribute("aria-pressed", S.cover === k ? "true" : "false"); });
  $("covers").hidden = stp && stp.i === 0 && !S.answered;
  // caption under the figure
  let img;
  if (L.kind === "inf") img = P.t("capInf");
  else if (L.kind === "real") img = P.t("capReal", { size: P.t(sizeWord(L.m)), m: fmtM(Math.abs(L.m)), v: fmtV(L.v) });
  else img = P.t("capVirt", { size: P.t(sizeWord(L.m)), m: fmtM(Math.abs(L.m)), d: fmtV(-L.v) });
  let scr = P.t("capNoScr");
  const sc = screen(L.u, L.f, S.x, S.cover);
  if (S.scr) scr = L.kind === "real" ? P.t(sharpAt(L, S.x, sc.blur) ? "capSharp" : "capBlur", { x: nf(S.x), b: nf(sc.blur) }) : P.t(L.kind === "inf" ? "capInfScr" : "capVirtScr");
  $("cap").textContent = img + " " + scr;
  // readout
  const typ = L.kind === "inf" ? P.t("none") : P.t(L.kind === "real" ? "real" : "virt") + ", " + P.t(sizeWord(L.m));
  const rows = [["rU", nf(L.u) + " cm"], ["rF", nf(L.f) + " cm"], ["rV", L.kind === "inf" ? "—" : fmtV(L.v) + (Math.abs(L.v) > 999 ? "" : " cm")],
    ["rM", L.kind === "inf" ? "—" : fmtM(L.m)], ["rT", typ], ["rS", S.scr ? nf(S.x) + " cm / " + nf(sc.blur) + " cm" : "—"]];
  $("readout").innerHTML = stp && stp.i === 2 ? "" : rows.map((r) => `<tr><td>${P.t(r[0])}</td><td>${r[1]}</td></tr>`).join("");
  // rule (step 3)
  const box = $("rule");
  if (!stp || stp.i !== 2) box.innerHTML = "";
  else {
    let hT = L.kind === "inf" ? P.t("ruleInf", { f: nf(L.f) }) : P.t("ruleMain", { f: nf(L.f), u: nf(L.u), v: fmtV(L.v), m: fmtM(L.m) });
    const ex = [[3, "Far"], [2, "2F"], [1.5, "Mid"], [1, "F"], [0.5, "In"]];
    let t = `<div class="tablewrap"><table class="readout rtab"><tr><th>${P.t("thU")}</th><th>${P.t("thV")}</th><th>${P.t("thM")}</th><th>${P.t("thI")}</th><th>${P.t("thUse")}</th></tr>`;
    ex.forEach(([k, z], i) => {
      const R = lens(k * L.f, L.f);
      const vv = R.kind === "inf" ? "∞" : nf(R.v), mm = R.kind === "inf" ? "—" : nf(R.m, 2);
      t += `<tr class="${L.zone === i ? "cur" : ""}"><td>${P.t("z" + z)}<br>${nfs(k * L.f)}</td><td>${vv}</td><td>${mm}</td><td>${P.t("i" + z)}</td><td>${P.t("use" + z)}</td></tr>`;
    });
    t += "</table></div>";
    box.innerHTML = `<p>${hT}</p><p>${P.t("ruleTable", { f: nf(L.f) })}</p>${t}<p>${P.t("ruleMove")}</p>`;
  }
  const msg = P.t("live", { u: nf(L.u), f: nf(L.f), img });
  if (msg !== lastLive && !drag) { lastLive = msg; Play.live($("live"), msg); }
}
function update() { const L = draw(); screenView(L); panel(L); }

/* ---------- direct manipulation ---------- */
function setU(v) { S.u = Play.clamp(r10(v), U_MIN, U_MAX); }
function setX(v) { S.x = Play.clamp(r10(v), X_MIN, X_MAX); }
fig.addEventListener("pointerdown", (e) => {
  const t = e.target.closest && e.target.closest("[data-fid]");
  if (!t) return;
  drag = t.dataset.fid; t.focus(); setPlaying(false); e.preventDefault(); move(e);
});
function move(e) {
  if (!drag) return;
  const p = Play.pointer(fig, e), xc = (p.x - X0) / K;
  if (drag === "obj") setU(-xc); else setX(xc);
  update();
}
addEventListener("pointermove", move);
addEventListener("pointerup", () => { if (drag) { drag = null; update(); } });
addEventListener("pointercancel", () => { drag = null; });
fig.addEventListener("keydown", (e) => {
  const fid = e.target.dataset && e.target.dataset.fid;
  if (!fid) return;
  const st = e.shiftKey ? 0.1 : 0.5;
  let d = 0;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") d = st;
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = -st;
  else if (e.key === "Home" || e.key === "End") {
    e.preventDefault();
    if (fid === "obj") setU(e.key === "Home" ? U_MIN : U_MAX); else setX(e.key === "Home" ? X_MIN : X_MAX);
    update(); return;
  } else return;
  e.preventDefault(); setPlaying(false);
  if (fid === "obj") setU(S.u - (e.key === "ArrowUp" || e.key === "ArrowDown" ? -d : d)); // ← moves the candle left (farther)
  else setX(S.x + d);
  update();
});
$("u").addEventListener("input", () => { setPlaying(false); setU(+$("u").value); update(); });
$("f").addEventListener("input", () => { const v = +$("f").value; S.f = Number.isFinite(v) ? Play.clamp(v, F_MIN, F_MAX) : 8; update(); });
$("xs").addEventListener("input", () => { setX(+$("xs").value); update(); });
$("scrOn").addEventListener("change", () => { S.scr = $("scrOn").checked; update(); });
const coverBtns = {};
[["none", "cNone"], ["top", "cTop"], ["bottom", "cBot"]].forEach(([k, s]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t(s);
  b.addEventListener("click", () => { S.cover = k; update(); });
  $("covers").appendChild(b); coverBtns[k] = b;
});

/* ---------- slide-in animation (only on request) ---------- */
function tick(ts) {
  if (!S.playing) return;
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0;
  last = ts;
  S.u = Math.max(U_MIN, S.u - 3 * dt);
  if (S.u <= U_MIN) { S.u = U_MIN; S.playing = false; }
  update();
  if (S.playing) raf = requestAnimationFrame(tick);
}
function setPlaying(on) {
  if (on === S.playing) return;
  S.playing = on; cancelAnimationFrame(raf); last = 0;
  if (on) { if (S.u <= U_MIN + 0.05) S.u = U_MAX; S.scr = false; raf = requestAnimationFrame(tick); }
  else S.u = r10(S.u);
  update();
}
$("slide").addEventListener("click", () => setPlaying(!S.playing));

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
}, () => { S.answered = true; S.cover = "top"; update(); });
let ready = false;
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (ready) update();
});
function resetAll() {
  cancelAnimationFrame(raf);
  Object.assign(S, { u: 20, f: 8, x: 13.3, scr: true, cover: "none", answered: false, playing: false });
  pr.reset(); stp.go(0); update();
}
$("reset").addEventListener("click", resetAll);
ready = true;
resetAll();
</script>
</body>
</html>

/* SIM-BEGIN — pure physics, no DOM (tests extract this block) */
const G = 9.81, DT = 0.001, C_DAMP = 0.12, TMAX = 120;
const rad = (d) => d * Math.PI / 180;
// One RK4 step of θ'' = −(g/L)·sin θ − c·θ'
function rk4(th, w, gL, c, dt) {
  const f = (a, b) => -gL * Math.sin(a) - c * b;
  const k1t = w, k1w = f(th, w);
  const k2t = w + 0.5 * dt * k1w, k2w = f(th + 0.5 * dt * k1t, w + 0.5 * dt * k1w);
  const k3t = w + 0.5 * dt * k2w, k3w = f(th + 0.5 * dt * k2t, w + 0.5 * dt * k2w);
  const k4t = w + dt * k3w, k4w = f(th + dt * k3t, w + dt * k3w);
  return [th + dt / 6 * (k1t + 2 * k2t + 2 * k3t + k4t), w + dt / 6 * (k1w + 2 * k2w + 2 * k3w + k4w)];
}
function energy(m, L, th, w) {
  const pe = m * G * L * (1 - Math.cos(th)), ke = 0.5 * m * (L * w) ** 2;
  return { pe, ke, e: pe + ke };
}
const Tsmall = (L) => 2 * Math.PI * Math.sqrt(L / G);
function agm(a, b) { for (let i = 0; i < 40 && Math.abs(a - b) > 1e-15 * a; i++) [a, b] = [(a + b) / 2, Math.sqrt(a * b)]; return (a + b) / 2; }
const Texact = (L, deg) => Tsmall(L) / agm(1, Math.cos(rad(Math.min(Math.abs(deg), 179.999)) / 2));
// Release from rest at deg; period = time between the 1st and 3rd zero crossings (same direction).
function measurePeriod(L, deg, c) {
  if (!Number.isFinite(L) || !Number.isFinite(deg) || L <= 0 || Math.abs(deg) < 0.01) return null;
  const gL = G / L;
  let th = rad(deg), w = 0, t = 0;
  const cross = [];
  for (let i = 0; i < TMAX / DT && cross.length < 3; i++) {
    const [t2, w2] = rk4(th, w, gL, c || 0, DT);
    if ((th > 0 && t2 <= 0) || (th < 0 && t2 >= 0)) cross.push(t + DT * th / (th - t2));
    th = t2; w = w2; t += DT;
  }
  return cross.length === 3 ? cross[2] - cross[0] : null;
}
/* SIM-END */

const $ = (id) => document.getElementById(id);

let samples = [], lastCount = -1, lastLive = "";
const per = { A: null, B: null }, perKey = { A: "", B: "" };

const f2 = (x) => Play.fmt(x, 2), f3 = (x) => Play.fmt(x, 3);

function slider(k, id, lab, min, max, val) {
  return `<span class="pair"><label for="${id}${k}">${P.t(lab)}</label><input type="range" id="${id}${k}" min="${min}" max="${max}" step="1" value="${val}"><span class="val" id="${id}${k}v"></span></span>`;
}
$("ctl").innerHTML = KEYS.map((k) => `<div class="pend"><div class="ph"><span class="sw" style="background:${COL[k]}"></span>${k}</div>` +
  slider(k, "m", "mass", 1, 50, 10) + slider(k, "L", "length", 2, 40, 20) + slider(k, "a", "angle", 0, 179, 20) + "</div>").join("");
KEYS.forEach((k) => {
  $("m" + k).addEventListener("input", () => { PEN[k].m = Play.clamp(+$("m" + k).value, 1, 50) / 10; restart(); });
  $("L" + k).addEventListener("input", () => { PEN[k].L = Play.clamp(+$("L" + k).value, 2, 40) / 20; restart(); });
  $("a" + k).addEventListener("input", () => { PEN[k].a0 = Play.clamp(+$("a" + k).value, 0, 179); restart(); });
});
$("play").addEventListener("click", () => {
  if (playing) { pause(); return; }
  playing = true; last = 0;
  if (t === 0) say(P.t("liveGo"));
  raf = requestAnimationFrame(tick); syncPlay();
});
$("restart").addEventListener("click", () => restart());
$("speed").addEventListener("change", () => { speed = +$("speed").value || 1; });
$("damp").addEventListener("change", () => { damp = $("damp").checked; restart(); });
function pause() { playing = false; cancelAnimationFrame(raf); syncPlay(); }
function syncPlay() { $("play").textContent = P.t(playing ? "pause" : t > 0 ? "resume" : "play"); }
function say(msg) { if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); } }

/* ---------- drag a bob to set the start angle ---------- */
scene.addEventListener("pointerdown", (e) => {
  const p = Play.pointer(scene, e);
  dragging = p.x < 300 ? "A" : "B";
  wasPlaying = playing; if (playing) pause();
  scene.setPointerCapture && scene.setPointerCapture(e.pointerId);
  dragTo(p); e.preventDefault();
});
scene.addEventListener("pointermove", (e) => { if (dragging) dragTo(Play.pointer(scene, e)); });
["pointerup", "pointercancel"].forEach((ev) => scene.addEventListener(ev, () => {
  if (!dragging) return;
  dragging = null;
  if (wasPlaying) $("play").click();
}));
function dragTo(p) {
  const k = dragging, dx = p.x - CXP[k], dy = p.y - PY;
  if (Math.hypot(dx, dy) < 6) return;
  const deg = Math.round(Play.clamp(Math.abs(Math.atan2(dx, dy)) * 180 / Math.PI, 0, 179));
  const side = dx < 0 ? -1 : 1;
  if (deg !== PEN[k].a0 || side !== PEN[k].side) { PEN[k].a0 = deg; PEN[k].side = side; restart(); }
}

/* ---------- simulation ---------- */
function restart() {
  t = 0; samples = []; lastCount = -1;
  KEYS.forEach((k) => {
    const p = PEN[k], th = p.side * rad(p.a0);
    RUN[k] = { th, w: 0, prevW: 0, swings: 0, e0: energy(p.m, p.L, th, 0).e };
    const key = p.L + "|" + p.a0;   // period of the release itself, measured without air friction
    if (key !== perKey[k]) { perKey[k] = key; per[k] = measurePeriod(p.L, p.a0, 0); }
  });
  samples.push([0, RUN.A.th, RUN.B.th]);
  syncControls(); drawAll(); syncPlay(); drawRule();
}
function advance(dt) {
  const n = Math.round(dt / DT), c = damp ? C_DAMP : 0;
  for (let i = 0; i < n; i++) {
    KEYS.forEach((k) => {
      const r = RUN[k];
      [r.th, r.w] = rk4(r.th, r.w, G / PEN[k].L, c, DT);
      // one full swing = back at the starting side: θ' changes sign with the bob on the start side
      if (r.prevW * PEN[k].side > 0 && r.w * PEN[k].side <= 0) r.swings++;
      if (r.w !== 0) r.prevW = r.w;
    });
    t += DT;
    if (Math.round(t / DT) % 20 === 0) samples.push([t, RUN.A.th, RUN.B.th]);
  }
  while (samples.length && samples[0][0] < t - 10) samples.shift();
}
function tick(ts) {
  if (!playing) return;
  if (last) advance(Math.min(0.1, (ts - last) / 1000) * speed);
  last = ts;
  drawAll();
  const a = RUN.A.swings, b = RUN.B.swings;
  if (a + b !== lastCount && (a + b) % 4 === 0 && a + b > 0) say(P.t("liveCount", { a, b }));
  lastCount = a + b;
  raf = requestAnimationFrame(tick);
}

/* ---------- drawing ---------- */
function syncControls() {
  KEYS.forEach((k) => {
    const p = PEN[k];
    $("m" + k).value = Math.round(p.m * 10); $("m" + k + "v").textContent = p.m.toFixed(1) + " " + P.t("unitKg");
    $("L" + k).value = Math.round(p.L * 20); $("L" + k + "v").textContent = p.L.toFixed(2) + " " + P.t("unitM");
    $("a" + k).value = p.a0; $("a" + k + "v").textContent = p.a0 + "°";
  });
}
const bobR = (m) => 7 + 5 * Math.cbrt(m);
function drawAll() { drawScene(); drawEnergy(); drawTrace(); drawReadout(); }
function drawScene() {
  const sv = Play.svg;
  scene.innerHTML = "";
  KEYS.forEach((k) => {
    const p = PEN[k], cx = CXP[k], R = p.L * RMAX / Math.max(PEN.A.L, PEN.B.L), r = bobR(p.m);
    sv("line", { class: "vert", x1: cx, y1: PY, x2: cx, y2: PY + R }, scene);
    const th0 = p.side * rad(p.a0);
    sv("circle", { class: "ghost", cx: (cx + R * Math.sin(th0)).toFixed(1), cy: (PY + R * Math.cos(th0)).toFixed(1), r }, scene);
    const th = RUN[k].th, bx = cx + R * Math.sin(th), by = PY + R * Math.cos(th);
    sv("line", { class: "rod", x1: cx, y1: PY, x2: bx.toFixed(1), y2: by.toFixed(1) }, scene);
    sv("line", { class: "support", x1: cx - 34, y1: PY, x2: cx + 34, y2: PY }, scene);
    sv("circle", { cx, cy: PY, r: 4, fill: "var(--fg)" }, scene);
    sv("circle", { class: "bob", cx: bx.toFixed(1), cy: by.toFixed(1), r: r.toFixed(1), fill: COL[k] }, scene);
    sv("text", { class: "lblF", x: cx - 140, y: 28 }, scene).textContent = k;
    sv("text", { class: "lbl", x: cx - 112, y: 28 }, scene).textContent = p.m.toFixed(1) + " kg · " + p.L.toFixed(2) + " m";
  });
  sv("line", { class: "grid", x1: 300, y1: 40, x2: 300, y2: 312 }, scene);
}
function drawEnergy() {
  const sv = Play.svg;
  eSvg.innerHTML = "";
  const X0 = 50, W = 540, items = [["pe", "var(--c)"], ["ke", "var(--hl)"]];
  if (damp) items.push(["heat", "var(--no)"]);
  let lx = X0;
  items.forEach(([key, col]) => {
    sv("rect", { x: lx, y: 10, width: 16, height: 16, rx: 3, fill: col }, eSvg);
    const tx = sv("text", { class: "lbl", x: lx + 22, y: 27 }, eSvg); tx.textContent = P.t(key);
    lx += 32 + P.t(key).length * (P.lang === "zh" ? 17 : 12) + 14;
  });
  const eMax = Math.max(RUN.A.e0, RUN.B.e0);
  KEYS.forEach((k, i) => {
    const y = 50 + i * 50, r = RUN[k], p = PEN[k];
    sv("text", { class: "lblF", x: 14, y: y + 25 }, eSvg).textContent = k;
    if (!(eMax > 1e-12) || !(r.e0 > 1e-12)) {
      sv("text", { class: "lbl", x: X0, y: y + 25 }, eSvg).textContent = P.t("noEnergy");
      return;
    }
    const s = W / eMax, en = energy(p.m, p.L, r.th, r.w), heat = Math.max(0, r.e0 - en.e);
    let x = X0;
    [[en.pe, "var(--c)"], [en.ke, "var(--hl)"], [damp ? heat : 0, "var(--no)"]].forEach(([v, col]) => {
      const w = Math.max(0, Math.min(v * s, X0 + W - x));
      if (w > 0.2) sv("rect", { x: x.toFixed(1), y, width: w.toFixed(1), height: 34, fill: col }, eSvg);
      x += w;
    });
    sv("rect", { class: "eOut", x: X0, y, width: (r.e0 * s).toFixed(1), height: 34 }, eSvg);
  });
  $("clock").textContent = P.t("clock", { t: Play.fmt(t, 1) });
}
function drawTrace() {
  const sv = Play.svg, X0 = 70, X1 = 585, YM = 100, H = 76;
  trace.innerHTML = "";
  const amax = Math.max(PEN.A.a0, PEN.B.a0, 5), t0 = Math.max(0, t - 10);
  const px = (tt) => X0 + (tt - t0) / 10 * (X1 - X0), py = (th) => YM - (th * 180 / Math.PI) / amax * H;
  sv("line", { class: "grid", x1: X0, y1: YM - H, x2: X1, y2: YM - H }, trace);
  sv("line", { class: "grid", x1: X0, y1: YM + H, x2: X1, y2: YM + H }, trace);
  sv("polyline", { class: "ax", points: `${X0},${YM - H - 8} ${X0},${YM + H + 8}` }, trace);
  sv("line", { class: "ax", x1: X0, y1: YM, x2: X1, y2: YM }, trace);
  sv("text", { class: "lbl", x: X0 - 8, y: YM - H + 8, "text-anchor": "end" }, trace).textContent = "+" + amax + "°";
  sv("text", { class: "lbl", x: X0 - 8, y: YM + 8, "text-anchor": "end" }, trace).textContent = "0";
  sv("text", { class: "lbl", x: X0 - 8, y: YM + H + 8, "text-anchor": "end" }, trace).textContent = "−" + amax + "°";
  for (let s = Math.ceil(t0 / 2) * 2; s <= t0 + 10 + 1e-9; s += 2) {
    sv("text", { class: "lbl", x: px(s).toFixed(1), y: YM + H + 32, "text-anchor": "middle" }, trace).textContent = s;
  }
  sv("text", { class: "lbl", x: X1, y: YM + H - 10, "text-anchor": "end" }, trace).textContent = P.t("tAxis");
  if (t === 0) {
    sv("text", { class: "lbl", x: (X0 + X1) / 2, y: YM - 14, "text-anchor": "middle" }, trace).textContent = P.t("traceHint");
    return;
  }
  [["A", 1], ["B", 2]].forEach(([k, j]) => {
    const pts = samples.map((q) => px(q[0]).toFixed(1) + "," + py(q[j]).toFixed(1)).join(" ");
    sv("polyline", { class: "tr", points: pts, stroke: COL[k], "stroke-dasharray": k === "B" ? "9 6" : "none" }, trace);
  });
}
function drawReadout() {
  const row = (lab, fn, cls) => `<tr${cls ? ' class="key"' : ""}><td>${P.t(lab)}</td>` + KEYS.map((k) => `<td>${fn(k)}</td>`).join("") + "</tr>";
  const s = " " + P.t("unitS"), J = " " + P.t("unitJ");
  const en = (k) => energy(PEN[k].m, PEN[k].L, RUN[k].th, RUN[k].w);
  let h = `<tr><th></th><th style="color:${COL.A}">${P.t("colA")}</th><th style="color:${COL.B}">${P.t("colB")}</th></tr>` +
    row("rM", (k) => PEN[k].m.toFixed(1) + " " + P.t("unitKg")) +
    row("rL", (k) => PEN[k].L.toFixed(2) + " " + P.t("unitM")) +
    row("rA", (k) => PEN[k].a0 + "°") +
    row("rTm", (k) => (per[k] === null ? P.t("noSwing") : f3(per[k]) + s), true) +
    row("rT0", (k) => f3(Tsmall(PEN[k].L)) + s) +
    row("rDiff", (k) => (per[k] === null ? "—" : "+" + Play.fmt((per[k] / Tsmall(PEN[k].L) - 1) * 100, 2) + "%")) +
    row("rN", (k) => RUN[k].swings) +
    row("rPE", (k) => f3(en(k).pe) + J) + row("rKE", (k) => f3(en(k).ke) + J);
  if (damp) h += row("rH", (k) => f3(Math.max(0, RUN[k].e0 - en(k).e)) + J);
  h += row("rE", (k) => f3(en(k).e) + J);
  $("readout").innerHTML = h;
  if (damp && playing && t > 0) {
    const e0 = RUN.A.e0 + RUN.B.e0, lost = e0 > 1e-12 ? (1 - (en("A").e + en("B").e) / e0) * 100 : 0;
    if (Math.round(t * 10) % 50 === 0) say(P.t("liveDamp", { p: Math.round(lost) }));
  }
}

/* ---------- step 3: rule ---------- */
function drawRule() {
  const box = $("rule");
  if (!stp || stp.i !== 2) { box.innerHTML = ""; return; }
  const Ls = [0.25, 0.5, 1, 2, 4], s = " " + P.t("unitS");
  const rows = Ls.map((L) => `<tr${L === 0.25 || L === 1 || L === 4 ? ' class="key"' : ""}><td>${L} ${P.t("unitM")}</td><td>${f3(Tsmall(L))}${s}</td><td>${f3(measurePeriod(L, 10, 0))}${s}</td></tr>`).join("");
  const T = (L) => Tsmall(L);
  const four = P.t("ruleFour", { a: 0.25, b: 1, e: 4, c: f3(T(0.25)), d: f3(T(1)), r: f2(T(1) / T(0.25)), r2: f2(T(4) / T(1)) });
  const LA = PEN.A.L;
  const amps = [5, 20, 45, 90, 179].map((a) => {
    const m = measurePeriod(LA, a, 0);
    return `<tr><td>${a}°</td><td>${f3(m)}${s}</td><td>+${Play.fmt((m / Tsmall(LA) - 1) * 100, 2)}%</td></tr>`;
  }).join("");
  box.innerHTML =
    "<p>" + P.t("ruleMain") + "</p>" +
    `<table class="readout"><tr><th>${P.t("thL")}</th><th>${P.t("thT0")}</th><th>${P.t("thTm")}</th></tr>${rows}</table>` +
    "<p>" + four + "</p>" +
    `<p><button type="button" class="small" id="demo4">${P.t("demo4")}</button></p>` +
    `<p><strong>${P.t("ampH", { L: LA.toFixed(2) })}</strong></p>` +
    `<table class="readout"><tr><th>${P.t("thA")}</th><th>${P.t("rTm")}</th><th>${P.t("thDiff")}</th></tr>${amps}</table>` +
    "<p>" + P.t("ampNote") + "</p>" +
    '<div class="gal"><h3>' + P.t("galH") + "</h3><p>" + P.t("galNote") + "</p></div>";
  $("demo4").addEventListener("click", () => {
    pause();
    Object.assign(PEN.A, { m: 1, L: 0.5, a0: 15, side: 1 });
    Object.assign(PEN.B, { m: 1, L: 2, a0: 15, side: 1 });
    restart();
    say(P.t("demoSay"));
  });
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
});
let stp = null;
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (RUN.A) drawRule();
});
function resetAll() {
  pause();
  PEN.A = { m: 1, L: 1, a0: 20, side: 1 };
  PEN.B = { m: 4, L: 1, a0: 20, side: 1 };
  speed = 1; $("speed").value = "1"; damp = false; $("damp").checked = false;
  lastLive = ""; $("live").textContent = "";
  pr.reset(); stp.go(0); restart();
}
$("reset").addEventListener("click", resetAll);
resetAll();
// No autoplay (with or without Play.reduced): the reader predicts first, then presses Release.
</script>
</body>
</html>

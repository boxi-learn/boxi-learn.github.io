/* SIM-BEGIN — pure kinematics, no DOM (tests extract this block) */
const G = 9.81, DTD = 0.05;
const num = (x, a, b, d) => (Number.isFinite(x) ? Math.min(b, Math.max(a, x)) : d);
const fallTime = (h) => Math.sqrt(2 * num(h, 0, 100, 0) / G);
// Release at t = 0 with the train at speed v, accelerating at a. Platform frame origin = release point.
function stateAt(v, h, a, t) {
  v = num(v, 0, 30, 0); h = num(h, 0, 100, 1); a = num(a, -10, 10, 0);
  const T = fallTime(h);
  t = t === Infinity ? T : num(t, 0, T, 0);
  const y = Math.max(0, h - 0.5 * G * t * t);
  const xb = v * t, xh = v * t + 0.5 * a * t * t;
  return { t, T, y, xb, xh, rel: xb - xh, vyp: G * t, spT: Math.hypot(a * t, G * t), spP: Math.hypot(v, G * t), landed: t >= T - 1e-12 };
}
const landing = (v, h, a) => stateAt(v, h, a, Infinity);
// offset behind the hand on landing: ½aT² = a·h/g
const offsetBehind = (h, a) => num(a, -10, 10, 0) * num(h, 0, 100, 0) / G;
function dotTimes(t) {
  const out = [];
  for (let k = 0; k * DTD <= num(t, 0, 100, 0) + 1e-9; k++) out.push(k * DTD);
  return out;
}
// ruler step (m) so ticks are at least minPx apart
function niceStep(sx, minPx) {
  for (const s of [0.25, 0.5, 1, 2, 5, 10, 20]) if (s * sx >= minPx) return s;
  return 50;
}
// platform panel scale: true scale unless the path needs more room than 560 units
const platScale = (sy, xhEnd) => Math.min(sy, 560 / (Math.max(0, num(xhEnd, 0, 1e4, 0)) + 4));
/* SIM-END */

const $ = (id) => document.getElementById(id);

const DEF = { v: 20, h: 1.5 };
const S = { v: DEF.v, h: DEF.h, acc: false, a: 1, t: 0, playing: false, slow: 0.25 };
const Tb = { H: 0.8, u: 2, t: 0, playing: false };
let raf = 0, last = 0, raf2 = 0, last2 = 0, lastLive = "", step = 0;
const f2 = (x) => Play.fmt(Math.abs(x) < 5e-4 ? 0 : x, 2);
const f3 = (x) => Play.fmt(x, 3);
const aNow = () => (S.acc ? S.a : 0);
function say(m) { if (m !== lastLive) { lastLive = m; Play.live($("live"), m); } }

/* ---------- train + platform panels ---------- */
const SY = 80, R = 7, FT = 200, HX = 360;   // train panel: floor y, hand x; same scale both ways
const FP = 200, GP = 214;                    // platform panel: car floor y, ground y
function person(g, hx, floorY, sx, h, sy) {
  const bx = hx + 0.45 * sx, yAt = (m) => floorY - m * sy;
  sv("circle", { class: "head", cx: bx, cy: yAt(1.62), r: Math.max(5, 0.11 * sy) }, g);
  sv("path", { class: "person", d: `M${bx},${yAt(1.48)} L${bx},${yAt(0.85)} M${bx},${yAt(0.85)} L${bx - 0.12 * sx},${floorY} M${bx},${yAt(0.85)} L${bx + 0.12 * sx},${floorY} M${bx},${yAt(1.38)} L${hx},${yAt(h) - R}` }, g);
}
function arrow(g, x1, y, x2) {
  sv("line", { class: "arrow", x1, y1: y, x2: x2 - 8, y2: y }, g);
  sv("path", { class: "arrowHead", d: `M${x2},${y} l-12,-7 v14 z` }, g);
}
function drawTrain() {
  const g = $("tr"); g.innerHTML = "";
  const a = aNow(), st = stateAt(S.v, S.h, a, S.t);
  // platform posts stream backwards: post k at platform x = 3k, seen at HX + (3k − xh)·SY
  const sp = 3, off = st.xh % sp;
  for (let k = -3; k <= 3; k++) {
    const px = HX + (k * sp - off) * SY;
    if (px > 4 && px < 596) sv("line", { class: "post", x1: px, y1: 14, x2: px, y2: FT - 4 }, g);
  }
  sv("line", { class: "floor", x1: 0, y1: FT, x2: 600, y2: FT }, g);
  sv("line", { class: "wall", x1: 0, y1: 8, x2: 600, y2: 8 }, g);
  person(g, HX, FT, SY, S.h, SY);
  sv("circle", { class: "hand", cx: HX, cy: FT - S.h * SY - R, r: 8 }, g);
  // spot under the hand
  sv("path", { class: "mark", d: `M${HX},${FT} l-8,12 h16 z` }, g);
  // trail: equal-time dots + path
  const ts = dotTimes(st.t), px = (s) => HX + s.rel * SY, py = (s) => FT - s.y * SY - R;
  if (st.t > 0) {
    const s0 = stateAt(S.v, S.h, a, 0);
    sv("line", { class: "trail", x1: px(s0), y1: py(s0), x2: px(st), y2: py(st) }, g);
  }
  ts.forEach((t) => { const s = stateAt(S.v, S.h, a, t); sv("circle", { class: "dotA", cx: px(s), cy: py(s), r: 5 }, g); });
  sv("circle", { class: "ball", cx: px(st), cy: py(st), r: R }, g);
  if (st.landed) {
    const d = -st.rel;
    sv("line", { class: "land", x1: px(st), y1: FT - 2, x2: px(st), y2: FT + 10 }, g);
    sv("text", { class: d > 5e-4 ? "lblA" : "lbl", x: HX, y: FT + 25, "text-anchor": "middle" }, g).textContent =
      d > 5e-4 ? P.t("landTrain", { d: f2(d) }) : P.t("landZero");
  } else {
    sv("text", { class: "lbl", x: HX, y: FT + 25, "text-anchor": "middle" }, g).textContent = P.t("underHand");
  }
  $("tagTrain").textContent = a > 0 ? P.t("tagTrainAcc", { a: Play.fmt(a, 1) }) : P.t("tagTrain");
}
function drawPlat() {
  const g = $("pf"); g.innerHTML = "";
  const a = aNow(), st = stateAt(S.v, S.h, a, S.t), end = landing(S.v, S.h, a);
  const sx = platScale(SY, end.xh), x0 = 20 + 2 * sx;
  const X = (m) => x0 + m * sx, Y = (m) => FP - m * SY - R;
  // fixed posts and ruler on the ground
  for (let m = -6; m <= 60; m += 3) if (X(m) > 4 && X(m) < 596) sv("line", { class: "post", x1: X(m), y1: 14, x2: X(m), y2: GP }, g);
  sv("line", { class: "rail", x1: 0, y1: GP, x2: 600, y2: GP }, g);
  const stp = niceStep(sx, 80);
  for (let m = 0; X(m) < 596; m += stp) {
    sv("line", { class: "tick", x1: X(m), y1: GP, x2: X(m), y2: GP + 8 }, g);
    sv("text", { class: "lbl", x: X(m), y: GP + 32, "text-anchor": "middle" }, g).textContent = (m === 0 ? "0" : +m.toFixed(2)) + (X(m + stp) >= 596 || m === 0 ? " m" : "");
  }
  // release point
  sv("line", { class: "rel", x1: X(0), y1: Y(S.h) - 14, x2: X(0), y2: FP }, g);
  // carriage section: 2 m either side of the hand, moving with it
  const cx = X(st.xh);
  sv("rect", { class: "carfill", x: cx - 2 * sx, y: 12, width: 4 * sx, height: FP - 12 }, g);
  sv("path", { class: "wall", d: `M${cx - 2 * sx},${FP} V12 H${cx + 2 * sx} V${FP}` }, g);
  sv("line", { class: "floor", x1: cx - 2 * sx, y1: FP, x2: cx + 2 * sx, y2: FP }, g);
  [-1.3, 1.3].forEach((w) => sv("circle", { class: "head", cx: cx + w * sx, cy: FP + 7, r: 6 }, g));
  person(g, cx, FP, sx, S.h, SY);
  sv("circle", { class: "hand", cx, cy: Y(S.h), r: 8 }, g);
  if (S.v > 0) arrow(g, cx + 2 * sx - Math.min(70, 3 * sx) + 4, 34, cx + 2 * sx - 4);
  // path: the parabola so far, sampled
  if (st.t > 0) {
    let d = "";
    for (let i = 0; i <= 40; i++) { const s = stateAt(S.v, S.h, a, st.t * i / 40); d += (i ? "L" : "M") + X(s.xb).toFixed(1) + "," + Y(s.y).toFixed(1); }
    sv("path", { class: "trail", d }, g);
  }
  dotTimes(st.t).forEach((t) => {
    const s = stateAt(S.v, S.h, a, t);
    sv("circle", { class: "dotA", cx: X(s.xb), cy: Y(s.y), r: 5 }, g);
    if (S.v > 0) sv("line", { class: "tickA", x1: X(s.xb), y1: GP - 6, x2: X(s.xb), y2: GP + 4 }, g);
  });
  sv("circle", { class: "ball", cx: X(st.xb), cy: Y(st.y), r: R }, g);
  sv("path", { class: "mark", d: `M${cx},${FP} l-8,12 h16 z` }, g);
  if (st.landed) sv("line", { class: "land", x1: X(st.xb), y1: FP - 2, x2: X(st.xb), y2: FP + 10 }, g);
  sv("text", { class: "lbl", x: Math.max(8, X(0) - 6), y: 36, "text-anchor": X(0) > 120 ? "end" : "start" }, g).textContent = P.t("release");
  $("tagPlat").textContent = a > 0 ? P.t("tagPlatAcc", { v: S.v, a: Play.fmt(a, 1) }) : P.t("tagPlat", { v: S.v });
}
function drawReadout() {
  const a = aNow(), st = stateAt(S.v, S.h, a, S.t), e = landing(S.v, S.h, a);
  const m = (x) => f2(x) + " m";
  const pT = a > 0 ? P.t("pSlant") : P.t("pStraight"), pP = S.v > 0 ? P.t("pParab") : P.t("pStraight");
  const off = -e.rel;
  const rows = [
    ["", P.t("colTrain"), P.t("colPlat"), true],
    [P.t("rT"), f3(e.T) + " s", f3(e.T) + " s"],
    [P.t("rBall"), m(Math.abs(st.rel) < 5e-4 ? 0 : st.rel), m(st.xb)],
    [P.t("rHand"), m(0), m(st.xh)],
    [P.t("rPath"), pT, pP],
    [P.t("rSpd"), Play.fmt(st.spT, 2) + " m/s", Play.fmt(st.spP, 2) + " m/s"],
  ];
  let html = rows.map((r) => r[3] ? `<tr><th></th><th>${r[1]}</th><th>${r[2]}</th></tr>` : `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
  html += `<tr><td>${P.t("rLand")}</td><td class="both" colspan="2">${off > 5e-4 ? P.t("behind", { d: f2(off) }) : P.t("under")}</td></tr>`;
  $("readout").innerHTML = html;
}
function syncTrainCtl() {
  $("vVal").textContent = S.v + " m/s";
  $("hVal").textContent = S.h.toFixed(2) + " m";
  $("aVal").textContent = Play.fmt(S.a, 1) + " m/s²";
  $("a").disabled = !S.acc;
  $("acc").checked = S.acc;
  const T = fallTime(S.h);
  $("tt").value = T > 0 ? Math.round(200 * S.t / T) : 0;
  $("ttVal").textContent = Play.fmt(S.t, 2) + " s";
  const done = S.t >= T - 1e-12 && S.t > 0;
  $("play").textContent = P.t(S.playing ? "pause" : done ? "replay" : "drop");
}
function drawAll() { drawTrain(); drawPlat(); drawReadout(); syncTrainCtl(); }
function landed() {
  const a = aNow(), e = landing(S.v, S.h, a), off = -e.rel;
  say(P.t("liveLand", { t: f3(e.T), xb: f2(e.xb), xh: f2(e.xh), land: off > 5e-4 ? P.t("landTrain", { d: f2(off) }) : P.t("landZero") }));
}
function pause() { S.playing = false; cancelAnimationFrame(raf); syncTrainCtl(); }
function tick(ts) {
  if (!S.playing) return;
  if (last) S.t += Math.min(0.1, (ts - last) / 1000) * S.slow;
  last = ts;
  const T = fallTime(S.h);
  if (S.t >= T) { S.t = T; S.playing = false; landed(); }
  drawAll();
  if (S.playing) raf = requestAnimationFrame(tick);
}
$("play").addEventListener("click", () => {
  if (S.playing) { pause(); return; }
  const T = fallTime(S.h);
  if (S.t >= T - 1e-12) S.t = 0;
  if (Play.reduced) { S.t = T; drawAll(); landed(); return; }
  S.playing = true; last = 0; raf = requestAnimationFrame(tick); syncTrainCtl();
});
// any parameter change: stop and show the finished drop with its full trails
function changed() { pause(); S.t = fallTime(S.h); drawAll(); landed(); }
$("v").addEventListener("input", () => { S.v = num(+$("v").value, 0, 30, 20); changed(); });
$("h").addEventListener("input", () => { S.h = num(+$("h").value, 0.5, 2, 1.5); changed(); });
$("a").addEventListener("input", () => { S.a = num(+$("a").value, 0.5, 3, 1); changed(); });
$("acc").addEventListener("change", () => { S.acc = $("acc").checked; changed(); if (step === 2) drawRule(); });
$("slow").addEventListener("change", () => { S.slow = num(+$("slow").value, 0.05, 1, 0.25); });
$("tt").addEventListener("input", () => { pause(); S.t = fallTime(S.h) * num(+$("tt").value, 0, 200, 0) / 200; drawAll(); if (S.t >= fallTime(S.h) - 1e-12) landed(); });
// drag the hand (train panel) up and down to set the drop height
let dragging = false;
const tr = $("tr");
tr.addEventListener("pointerdown", (e) => {
  const p = Play.pointer(tr, e);
  if (Math.abs(p.x - HX) > 40 || Math.abs(p.y - (FT - S.h * SY - R)) > 40) return;
  dragging = true; tr.setPointerCapture && tr.setPointerCapture(e.pointerId); e.preventDefault();
});
tr.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const p = Play.pointer(tr, e), h = Math.round(num((FT - R - p.y) / SY, 0.5, 2, 1.5) * 20) / 20;
  if (Math.abs(h - S.h) > 1e-9) { S.h = h; $("h").value = h; changed(); }
});
["pointerup", "pointercancel"].forEach((ev) => tr.addEventListener(ev, () => { dragging = false; }));

/* ---------- table panel (step 3) ---------- */
const TS = 90, TG = 268, EDGE = 150;
function drawTable() {
  const g = $("tb"); g.innerHTML = "";
  const T = fallTime(Tb.H), t = num(Tb.t, 0, T, 0), top = TG - Tb.H * TS;
  const X = (m) => EDGE + R + m * TS, Y = (m) => TG - m * TS - R;
  const yAt = (tt) => Math.max(0, Tb.H - 0.5 * G * tt * tt);
  sv("line", { class: "floor", x1: 0, y1: TG, x2: 600, y2: TG }, g);
  sv("rect", { class: "tbl", x: 20, y: top, width: EDGE - 20, height: 10 }, g);
  sv("line", { class: "floor", x1: 36, y1: top + 10, x2: 36, y2: TG }, g);
  sv("line", { class: "floor", x1: EDGE - 16, y1: top + 10, x2: EDGE - 16, y2: TG }, g);
  for (let m = 0; X(m) < 596; m += 0.5) {
    sv("line", { class: "tick", x1: X(m), y1: TG, x2: X(m), y2: TG + 8 }, g);
    if (m % 1 === 0) sv("text", { class: "lbl", x: X(m), y: TG + 24, "text-anchor": "middle", "font-size": 18 }, g).textContent = m + (m === 0 ? "" : " m");
  }
  dotTimes(t).forEach((tt) => {
    const y = Y(yAt(tt));
    if (Tb.u > 0) sv("line", { class: "pair", x1: X(0), y1: y, x2: X(Tb.u * tt), y2: y }, g);
    sv("circle", { class: "dotB", cx: X(0), cy: y, r: 5 }, g);
    sv("circle", { class: "dotA", cx: X(Tb.u * tt), cy: y, r: 5 }, g);
  });
  sv("circle", { class: "ballB", cx: X(0), cy: Y(yAt(t)), r: R }, g);
  sv("circle", { class: "ball", cx: X(Tb.u * t), cy: Y(yAt(t)), r: R }, g);
  sv("text", { class: "lblC", x: 20, y: 28 }, g).textContent = P.t("tableA");
  sv("text", { class: "lblA", x: 20, y: 56 }, g).textContent = P.t("tableB", { u: Play.fmt(Tb.u, 1) });
  if (t >= T - 1e-12) {
    sv("text", { class: "lbl", x: 590, y: 28, "text-anchor": "end" }, g).textContent = P.t("tableLand", { t: f3(T) });
    if (Tb.u > 0) sv("text", { class: "lblA", x: 590, y: 56, "text-anchor": "end" }, g).textContent = P.t("tableOut", { x: f2(Tb.u * T) });
  }
  $("tagTable").textContent = P.t("tagTable", { dt: DTD });
  $("HVal").textContent = Tb.H.toFixed(2) + " m";
  $("uVal").textContent = Play.fmt(Tb.u, 1) + " m/s";
  $("play2").textContent = P.t(Tb.playing ? "pause" : t >= T - 1e-12 && t > 0 ? "replay" : "drop2");
}
function tableLanded() { const T = fallTime(Tb.H); say(P.t("liveTable", { t: f3(T), x: f2(Tb.u * T) })); }
function pause2() { Tb.playing = false; cancelAnimationFrame(raf2); }
function tick2(ts) {
  if (!Tb.playing) return;
  if (last2) Tb.t += Math.min(0.1, (ts - last2) / 1000) * 0.25;
  last2 = ts;
  const T = fallTime(Tb.H);
  if (Tb.t >= T) { Tb.t = T; Tb.playing = false; tableLanded(); }
  drawTable();
  if (Tb.playing) raf2 = requestAnimationFrame(tick2);
}
$("play2").addEventListener("click", () => {
  if (Tb.playing) { pause2(); drawTable(); return; }
  const T = fallTime(Tb.H);
  if (Tb.t >= T - 1e-12) Tb.t = 0;
  if (Play.reduced) { Tb.t = T; drawTable(); tableLanded(); return; }
  Tb.playing = true; last2 = 0; raf2 = requestAnimationFrame(tick2); drawTable();
});
function changed2() { pause2(); Tb.t = fallTime(Tb.H); drawTable(); drawRule(); tableLanded(); }
$("H").addEventListener("input", () => { Tb.H = num(+$("H").value, 0.5, 2, 0.8); changed2(); });
$("u").addEventListener("input", () => { Tb.u = num(+$("u").value, 0, 5, 2); changed2(); });

function drawRule() {
  const box = $("rule");
  if (step !== 2) { box.innerHTML = ""; return; }
  const T = fallTime(Tb.H), aShow = S.acc ? S.a : 1;
  const rows = [0.5, 1, 1.5, 2].map((h) => P.t("ruleRows", { h: h.toFixed(1), t: f3(fallTime(h)) }));
  box.innerHTML =
    '<p class="big">' + P.t("ruleBig") + "</p>" +
    '<p class="mathline">y = h − ½gt² &nbsp;·&nbsp; x = v·t</p>' +
    "<p>" + rows.join("<br>") + "</p>" +
    "<p>" + P.t("ruleNow", { H: Tb.H.toFixed(2), t: f3(T), u: Play.fmt(Tb.u, 1), x: f2(Tb.u * T) }) + "</p>" +
    "<p>" + P.t("ruleFrames", { v: S.v }) + "</p>" +
    "<p>" + P.t("ruleAcc", { a: Play.fmt(aShow, 1), h: S.h.toFixed(2), d: f2(offsetBehind(S.h, aShow)) }) + "</p>";
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
});
const stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, { dt: DTD, v: DEF.v, kmh: Play.fmt(DEF.v * 3.6, 0), h: DEF.h.toFixed(1) });
  $("predict").hidden = i !== 0;
  $("trainViz").hidden = i === 2;
  $("tableViz").hidden = i !== 2;
  $("readout").hidden = i === 2;
  if (i === 2) { pause(); drawTable(); } else pause2();
  drawRule();
});
function resetAll() {
  pause(); pause2();
  Object.assign(S, { v: DEF.v, h: DEF.h, acc: false, a: 1, t: 0, slow: 0.25 });
  Object.assign(Tb, { H: 0.8, u: 2, t: 0 });
  $("v").value = DEF.v; $("h").value = DEF.h; $("a").value = 1; $("slow").value = "0.25"; $("H").value = 0.8; $("u").value = 2;
  lastLive = ""; $("live").textContent = "";
  pr.reset(); stp.go(0); drawAll(); drawTable();
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

    nNails: "{n} 根钉子", nNail: "1 根钉子", unitN: "牛", unitPa: "帕", kg: "≈ {m} 千克",

/* SIM-BEGIN — pure physics, no DOM (tests extract this block) */
const G = 9.81, TIP = 1e-6, NMAX = 2000, SKIN_PAIN = 1e6, SKIN_BREAK = 1e7, SNOW_K = 4e4, SNOW_MAX = 60;
const SUP = {
  sNail1: { kind: "nails", n: 1 }, sNail1000: { kind: "nails", n: 1000 },
  sBoots: { kind: "snow", A: 0.05, w: 46 }, sShoes: { kind: "snow", A: 2 * 0.15, w: 100 }, sSkis: { kind: "snow", A: 2 * 1.6 * 0.065, w: 300 },
};
const fin = (x, d) => (Number.isFinite(x) ? x : d);
const clampN = (n) => Math.round(Math.min(NMAX, Math.max(1, fin(n, 1))));
const clampF = (F) => Math.min(800, Math.max(300, fin(F, 700)));
// Nails slider: steps through these counts (roughly even on a log scale).
const NSTEPS = [1, 2, 3, 5, 10, 20, 30, 50, 100, 200, 300, 500, 1000, 1500, 2000];
const nFromIdx = (i) => NSTEPS[Math.round(Math.min(NSTEPS.length - 1, Math.max(0, fin(i, 0))))];
const idxFromN = (n) => { n = clampN(n); let b = 0; NSTEPS.forEach((v, i) => { if (Math.abs(Math.log(v / n)) < Math.abs(Math.log(NSTEPS[b] / n))) b = i; }); return b; };
function areaOf(key, n) { const s = SUP[key] || SUP.sNail1; return s.kind === "nails" ? clampN(n) * TIP : s.A; }
const pressure = (F, A) => (A > 0 ? clampF(F) / A : Infinity);
const skinZone = (p) => (p < SKIN_PAIN ? 0 : p < SKIN_BREAK ? 1 : 2);
const dimple = (p) => Math.min(1, Math.max(0, (Math.log10(Math.max(p, 1)) - 4) / 3));   // 10 kPa → 0, 10 MPa → 1
const sinkCm = (p) => Math.min(SNOW_MAX, Math.max(0, 100 * fin(p, 0) / SNOW_K));
function state(key, F, n) {
  const s = SUP[key] || SUP.sNail1; F = clampF(F); n = s.kind === "nails" ? clampN(n) : 0;
  const A = areaOf(key, n), p = pressure(F, A);
  return { key, kind: s.kind, F, n, A, p, each: n ? F / n : 0, zone: skinZone(p), dim: dimple(p), sink: s.kind === "snow" ? sinkCm(p) : 0, m: F / G };
}
// Worked examples for step 3 (round values).
function examples() {
  const thumb = 20, head = 1e-4, tack = 1e-7;
  const knifeF = 40, blade = 0.08, sharp = 1e-5, blunt = 3e-4;
  const trM = 5, trF = trM * 1000 * G, trA = 2 * 2 * 0.4;
  return {
    tack: { F: thumb, p1: thumb / head, p2: thumb / tack, r: head / tack },
    knife: { F: knifeF, p1: knifeF / (blade * sharp), p2: knifeF / (blade * blunt) },
    tractor: { M: trM, F: trF, p: trF / trA, r: (trF / trA) / (700 / SUP.sBoots.A) },
  };
}
const SUPS = ["⁰", "¹", "²", "³", "⁴", "⁵", "⁶", "⁷", "⁸", "⁹"];
const sup = (e) => (e < 0 ? "⁻" : "") + String(Math.abs(e)).split("").map((d) => SUPS[+d]).join("");
function sci(x) {
  if (!(x > 0) || !Number.isFinite(x)) return "—";
  let e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  if (Math.round(m * 10) / 10 >= 10) { m /= 10; e += 1; }
  return e >= 0 && e <= 3 ? String(Math.round(x)) : m.toFixed(1) + " × 10" + sup(e);
}
/* SIM-END */

const $ = (id) => document.getElementById(id);
const scene = $("scene");
const S = { key: "sNail1", F: 700, n: 1 };
let st = null, shown = { dim: 0, sink: 0 }, anim = 0, stp = null, lastLive = "";
const fA = (A) => (A >= 0.01 ? Play.fmt(A, 3) + " m²" : sci(A) + " m²");

/* ---------- controls ---------- */
Object.keys(SUP).forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.dataset.k = k; b.textContent = P.t(k);
  b.addEventListener("click", () => { S.key = k; if (SUP[k].kind === "nails") S.n = SUP[k].n; update(); });
  $("sups").appendChild(b);
});
$("w").addEventListener("input", () => { S.F = +$("w").value || 700; update(); });
$("n").addEventListener("input", () => {
  S.n = nFromIdx(+$("n").value);
  if (SUP[S.key].kind !== "nails") S.key = "sNail1";
  update(true);
});

function update(fromN) {
  const nails = SUP[S.key].kind === "nails";
  if (nails) S.key = S.n === 1000 ? "sNail1000" : "sNail1";
  st = state(S.key, S.F, S.n);
  S.F = st.F; if (nails) S.n = st.n;
  $("w").value = S.F;
  $("wVal").textContent = S.F + " " + P.t("unitN") + " " + P.t("kg", { m: Math.round(st.m) });
  if (!fromN) $("n").value = idxFromN(S.n);
  $("nVal").textContent = S.n === 1 ? P.t("nNail") : P.t("nNails", { n: S.n });
  $("nPair").style.opacity = nails ? "1" : ".5";
  document.querySelectorAll("#sups button").forEach((b) => {
    const k = b.dataset.k, on = nails ? SUP[k].kind === "nails" && SUP[k].n === S.n : k === S.key;
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  readout(); drawRule(); animateTo(); say();
}
function say() {
  const n = S.n === 1 ? P.t("nNail") : P.t("nNails", { n: S.n });
  const msg = st.kind === "nails"
    ? P.t("liveNails", { n, F: st.F, A: fA(st.A), p: sci(st.p), z: P.t("zoneSay" + st.zone) })
    : P.t("liveSnow", { s: P.t(st.key), F: st.F, A: fA(st.A), p: sci(st.p), d: Play.fmt(st.sink, 0) });
  if (msg !== lastLive) { lastLive = msg; Play.live($("live"), msg); }
}

/* ---------- gentle tween of the dent / sink (none when reduced motion) ---------- */
function animateTo() {
  cancelAnimationFrame(anim);
  const from = { ...shown }, to = { dim: st.dim, sink: st.sink }, t0 = performance.now();
  if (Play.reduced) { shown = to; draw(); return; }
  const step = (ts) => {
    const u = Math.min(1, (ts - t0) / 350), e = 1 - Math.pow(1 - u, 3);
    shown = { dim: from.dim + (to.dim - from.dim) * e, sink: from.sink + (to.sink - from.sink) * e };
    draw();
    if (u < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

/* ---------- drawing ---------- */
const sv = Play.svg;
function text(x, y, cls, str, anchor) {
  const w = [...str].reduce((a, c) => a + (c.charCodeAt(0) > 0x2e80 ? 23 : 12.5), 0), xx = anchor === "middle" ? Play.clamp(x, 6 + w / 2, 594 - w / 2) : x;
  sv("text", { class: cls, x: xx.toFixed(1), y, "text-anchor": anchor || "start" }, scene).textContent = str;
}
function arrowDown(x, y0, y1) {
  sv("line", { class: "arrF", x1: x, y1: y0, x2: x, y2: y1 - 10 }, scene);
  sv("polygon", { class: "arrH", points: `${x},${y1} ${x - 9},${y1 - 15} ${x + 9},${y1 - 15}` }, scene);
}
function draw() {
  scene.innerHTML = "";
  if (st.kind === "nails") drawNails(); else drawSnow();
  drawScale();
}
function drawNails() {
  const X0 = 30, X1 = 370, BY = 222, TY = 178, d = Math.min(st.n, 33);
  sv("rect", { class: "board", x: X0, y: BY, width: X1 - X0, height: 16, rx: 3 }, scene);
  for (let i = 0; i < d; i++) {
    const x = d === 1 ? (X0 + X1) / 2 : X0 + 14 + i * (X1 - X0 - 28) / (d - 1);
    sv("rect", { class: "nail", x: x - 1.5, y: TY + 10, width: 3, height: BY - TY - 10 }, scene);
    sv("polygon", { class: "nail", points: `${x - 3},${TY + 11} ${x + 3},${TY + 11} ${x},${TY}` }, scene);
  }
  sv("rect", { class: "body", x: 50, y: 118, width: 300, height: TY - 118, rx: 26 }, scene);
  arrowDown(200, 34, 112);
  text(212, 70, "lbF", P.t("weightF", { F: st.F }));
  text(200, 268, "lbl", st.n > d ? P.t("drawn", { d, n: st.n }) : (st.n === 1 ? P.t("nNail") : P.t("nNails", { n: st.n })), "middle");
  // close-up of one tip pressing into the skin (skin is above the tip)
  const cx = 494, cy = 128, r = 92, y0 = 128, dent = 46 * shown.dim, zc = ["lbA", "lbH", "lbN"][st.zone];
  const clip = sv("clipPath", { id: "lensClip" }, sv("defs", {}, scene));
  sv("circle", { cx, cy, r }, clip);
  sv("circle", { class: "lens", cx, cy, r }, scene);
  const g = sv("g", { "clip-path": "url(#lensClip)" }, scene), pts = [];
  for (let i = 0; i <= 40; i++) { const x = cx - r + i * 2 * r / 40, dx = x - cx; pts.push(x.toFixed(1) + "," + (y0 - dent * Math.exp(-(dx * dx) / 500)).toFixed(1)); }
  sv("polygon", { class: "skin", points: `${cx - r},${cy - r} ${cx + r},${cy - r} ` + pts.slice().reverse().join(" ") }, g);
  sv("polyline", { class: "skinLine", points: pts.join(" ") }, g);
  const tipY = st.zone === 2 ? y0 - dent - 26 : y0 - dent;
  sv("polygon", { class: "nail", points: `${cx - 16},${cy + r} ${cx + 16},${cy + r} ${cx + 16},${tipY + 40} ${cx},${tipY} ${cx - 16},${tipY + 40}` }, g);
  text(cx, 246, zc, P.t("zone" + st.zone), "middle");
  text(cx, 274, "lbl", P.t("perNail", { f: Play.fmt(st.each, st.each < 10 ? 2 : 0) }), "middle");
}
function drawSnow() {
  const SY = 186, X0 = 20, X1 = 380, cx = 200, s = SUP[st.key], w = s.w, sink = shown.sink * 0.9;
  const L = cx - w / 2, R = cx + w / 2, by = SY + sink;
  sv("rect", { class: "snow", x: X0, y: SY, width: X1 - X0, height: 66 }, scene);
  sv("rect", { class: "snow", x: L, y: SY - 1, width: w, height: sink + 1, style: "fill:var(--surface);stroke:none" }, scene);
  sv("polyline", { class: "snowTop", points: `${X0},${SY} ${L},${SY} ${L},${by} ${R},${by} ${R},${SY} ${X1},${SY}` }, scene);
  // support
  if (st.key === "sSkis") sv("path", { class: "sup", d: `M${L},${by} L${R - 16},${by} Q${R + 4},${by} ${R + 8},${by - 14} L${R - 14},${by - 6} L${L},${by - 6} Z` }, scene);
  else if (st.key === "sShoes") sv("ellipse", { class: "sup", cx, cy: by - 4, rx: w / 2, ry: 6 }, scene);
  else sv("rect", { class: "sup", x: L, y: by - 12, width: w, height: 12, rx: 4 }, scene);
  // person
  const feet = by - (st.key === "sBoots" ? 12 : 6), hip = feet - 58, neck = hip - 50;
  sv("polyline", { class: "stick", points: `${cx - 12},${feet} ${cx},${hip} ${cx + 12},${feet}` }, scene);
  sv("line", { class: "stick", x1: cx, y1: hip, x2: cx, y2: neck }, scene);
  sv("polyline", { class: "stick", points: `${cx - 26},${hip - 10} ${cx},${neck + 8} ${cx + 26},${hip - 10}` }, scene);
  sv("circle", { class: "head", cx, cy: neck - 14, r: 14 }, scene);
  text(240, Math.max(48, neck - 20), "lbF", P.t("weightF", { F: st.F }));
  text(30, 240, "lbl", P.t("snowTitle"));
  // depth gauge
  const GX = 470, GY = 40, GH = 180, d = st.sink;
  sv("rect", { class: "gauge", x: GX, y: GY, width: 48, height: GH, rx: 4 }, scene);
  sv("rect", { class: "gaugeFill", x: GX, y: GY, width: 48, height: GH * shown.sink / SNOW_MAX, rx: 4 }, scene);
  text(GX + 24, GY + GH + 26, "lbl", P.t("snowDepth"), "middle");
  text(GX + 24, Math.min(GY + GH * d / SNOW_MAX + 26, GY + GH - 6), "lbH", P.t("sinks", { d: Play.fmt(d, 0) }), "middle");
}
// Log pressure scale 10³…10⁹ Pa with skin zones; dots for every support at the current weight.
const LX0 = 34, LX1 = 566, LY = 332, lx = (p) => LX0 + (Math.log10(p) - 3) / 6 * (LX1 - LX0);
function drawScale() {
  [[1e3, SKIN_PAIN, "z0"], [SKIN_PAIN, SKIN_BREAK, "z1"], [SKIN_BREAK, 1e9, "z2"]].forEach(([a, b, c]) => sv("rect", { class: c, x: lx(a), y: LY - 10, width: lx(b) - lx(a), height: 20 }, scene));
  sv("line", { class: "ax", x1: LX0, y1: LY + 10, x2: LX1, y2: LY + 10 }, scene);
  ["1 kPa", "", "100 kPa", "", "10 MPa", "", "1 GPa"].forEach((s, i) => {
    const x = LX0 + i * (LX1 - LX0) / 6;
    sv("line", { class: "ax", x1: x, y1: LY + 10, x2: x, y2: LY + 18 }, scene);
    if (s) sv("text", { class: "lbl", x, y: LY + 40, "text-anchor": i === 0 ? "start" : i === 6 ? "end" : "middle" }, scene).textContent = s;
  });
  [[1e3, SKIN_PAIN, 0], [SKIN_PAIN, SKIN_BREAK, 1], [SKIN_BREAK, 1e9, 2]].forEach(([a, b, z]) => {
    const x = (lx(a) + lx(b)) / 2;
    sv("text", { class: "lbl", x, y: LY + 64, "text-anchor": "middle" }, scene).textContent = P.t("zone" + z);
  });
  Object.keys(SUP).forEach((k) => {
    const o = state(k, st.F, SUP[k].n || 1);
    sv("circle", { class: "ghost", cx: lx(o.p).toFixed(1), cy: LY, r: 5 }, scene);
  });
  const x = lx(Play.clamp(st.p, 1e3, 1e9));
  sv("polygon", { class: "ptr", points: `${x},${LY + 4} ${x - 9},${LY - 14} ${x + 9},${LY - 14}` }, scene);
  text(x, LY - 22, "lbF", "p = " + sci(st.p) + " " + P.t("unitPa"), "middle");
}

/* ---------- side panel ---------- */
function readout() {
  const row = (k, v) => `<tr><td>${P.t(k)}</td><td>${v}</td></tr>`;
  let h = row("rF", st.F + " " + P.t("unitN")) + row("rA", fA(st.A)) + row("rP", sci(st.p) + " " + P.t("unitPa"));
  h += st.kind === "nails" ? row("rEach", Play.fmt(st.each, st.each < 10 ? 2 : 0) + " " + P.t("unitN"))
    : row("rSink", "≈ " + Play.fmt(st.sink, 0) + " cm");
  $("readout").innerHTML = h;
}
function drawRule() {
  const box = $("rule");
  if (!stp || stp.i !== 2) { box.innerHTML = ""; return; }
  const a = state("sNail1", S.F, 1), b = state("sNail1000", S.F, 1000), ex = examples();
  let h = "<p>" + P.t("ruleMain", { F: S.F, r: Play.fmt(b.A / a.A, 0), p0: sci(a.p), p1: sci(b.p) }) + "</p>";
  h += `<table class="readout"><tr><th>${P.t("colS")}</th><th>${P.t("colA")}</th><th>${P.t("colP")}</th></tr>`;
  Object.keys(SUP).forEach((k) => {
    const o = state(k, S.F, SUP[k].n || 1), cur = st.kind === "nails" ? SUP[k].n === S.n : k === S.key;
    h += `<tr${cur ? ' class="cur"' : ""}><td>${P.t(k)}</td><td>${fA(o.A)}</td><td>${sci(o.p)} ${P.t("unitPa")}</td></tr>`;
  });
  h += "</table><h3>" + P.t("moreH") + "</h3><ul>";
  h += "<li>" + P.t("ex1", { F: ex.tack.F, p1: sci(ex.tack.p1), p2: sci(ex.tack.p2), r: Play.fmt(ex.tack.r, 0) }) + "</li>";
  h += "<li>" + P.t("ex2", { F: ex.knife.F, p1: sci(ex.knife.p1), p2: sci(ex.knife.p2) }) + "</li>";
  h += "<li>" + P.t("ex3", { M: ex.tractor.M, F: sci(ex.tractor.F), p: sci(ex.tractor.p), r: Play.fmt(ex.tractor.r, 1) }) + "</li></ul>";
  box.innerHTML = h;
}

/* ---------- steps ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
});
stp = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = i === 2 ? "" : P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("readout").hidden = i === 2;
  if (st) drawRule();
});
function resetAll() {
  Object.assign(S, { key: "sNail1", F: 700, n: 1 });
  lastLive = ""; $("live").textContent = "";
  pr.reset(); stp.go(0); update();
}
$("reset").addEventListener("click", resetAll);
resetAll();
</script>
</body>
</html>

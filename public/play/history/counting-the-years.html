const mod = (a, n) => ((a % n) + n) % n;
const MIN_A = -840, MAX_A = 2100;                          // 841 BCE … 2100 CE
const histYear = (A) => (A <= 0 ? A - 1 : A);              // 0 → -1 (1 BCE)
const astroOf = (h) => (h < 0 ? h + 1 : h);
function gz(A) {                                           // 甲子 = index 0; 1984 → 0
  const i = mod(A - 4, 60);
  return { i, s: i % 10, b: i % 12, name: STEMS[i % 10] + BRANCHES[i % 12] };
}
const TODAY = new Date().getFullYear();
const ERAS = [
  { zh: "贞观", py: "Zhenguan", from: 627, to: 649, en: "Tang dynasty, Emperor Taizong", cn: "唐太宗" },
  { zh: "洪武", py: "Hongwu", from: 1368, to: 1398, en: "Ming dynasty, Hongwu Emperor", cn: "明太祖" },
  { zh: "永乐", py: "Yongle", from: 1403, to: 1424, en: "Ming dynasty, Yongle Emperor", cn: "明成祖" },
  { zh: "康熙", py: "Kangxi", from: 1662, to: 1722, en: "Qing dynasty, Kangxi Emperor", cn: "清圣祖" },
  { zh: "乾隆", py: "Qianlong", from: 1736, to: 1795, en: "Qing dynasty, Qianlong Emperor", cn: "清高宗" },
  { zh: "平成", py: "Heisei", from: 1989, to: 2019, en: "Japan", cn: "日本" },
  { zh: "令和", py: "Reiwa", from: 2019, to: null, en: "Japan", cn: "日本" },
];
const eraEnd = (e) => (e.to == null ? Math.max(TODAY, e.from) : e.to);
function erasAt(A) {                                       // all eras covering year A, with year number n
  return ERAS.filter((e) => A >= e.from && A <= eraEnd(e)).map((e) => ({ e, n: A - e.from + 1 }));
}
const CN_D = "〇一二三四五六七八九";
function cnNum(n) {                                        // 1 → 元, 23 → 二十三 (1–99)
  if (n === 1) return "元";
  const t = Math.floor(n / 10), o = n % 10;
  return (t === 0 ? "" : t === 1 ? "十" : CN_D[t] + "十") + (o ? CN_D[o] : "");
}
const eraYearZh = (r) => r.e.zh + cnNum(r.n) + "年";
function span(a, b) {                                      // a, b astronomical; returns years between and crossing info
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return { lo, hi, n: hi - lo, cross: lo <= 0 && hi >= 1 };
}
function sameGzList(A, k) {                                // up to k other years in range with the same 干支, nearest first
  const out = [];
  for (let d = 60; out.length < k && d <= MAX_A - MIN_A; d += 60) {
    if (A + d <= MAX_A) out.push(A + d);
    if (A - d >= MIN_A && out.length < k) out.push(A - d);
  }
  return out.sort((x, y) => x - y);
}
const TASKS = [
  { k: 1, targets: () => [627 + 3 - 1] },
  { k: 2, targets: () => [5 - 10] },                       // astronomical -5 = 6 BCE
  { k: 3, targets: () => [1403 + 3 - 1] },
  { k: 4, targets: () => { const e = ERAS[3], r = []; for (let A = e.from; A <= e.to; A++) if (gz(A).i === 0) r.push(A); return r; } },
  { k: 5, targets: () => { const r = []; for (let A = MIN_A; A <= MAX_A; A++) if (gz(A).i === 0) r.push(A); return r; } },
  { k: 6, targets: () => [ERAS[6].from] },
];
/* ===== END LOGIC ===== */

function yearText(A) {
  const h = histYear(A);
  return h < 0 ? P.t("yearBCE", { n: -h }) : P.t("yearCE", { n: h });
}
const gzLabel = (A) => gz(A).name;
function eraText(A, short) {
  const rs = erasAt(A);
  if (!rs.length) return short ? "" : P.t("eraNone");
  const s = rs.map((r) => ZH ? P.t("eraName", { zh: r.e.zh, n: cnNum(r.n), who: r.e.cn }) : P.t("eraName", { zh: eraYearZh(r), py: r.e.py, n: r.n, who: r.e.en })).join(" / ");
  return short ? s : P.t("eraLine", { e: s });
}
function eraShort(A) { return erasAt(A).map(eraYearZh).join(" / "); }

const fig = $("fig"), S = (tag, a, p) => Play.svg(tag, a, p || fig);
function T(x, y, s, cls, anchor, p) { const t = S("text", { x, y, class: cls || "", "text-anchor": anchor || "start" }, p); t.textContent = s; return t; }
const state = { A: Math.min(TODAY, MAX_A), guessed: false, sa: -2, sb: 4, task: 0, solved: new Set(), showHint: false };

/* ---------- step 1: three tablets ---------- */
function drawIntro() {
  setView(300);
  const A = 629, cards = [[yearText(A), "tabCE"], [gzLabel(A) + (ZH ? "年" : ""), "tabGZ"], [eraShort(A), "tabEra"]];
  T(300, 24, P.t("sameYear"), "mut", "middle");
  cards.forEach(([txt, k], i) => {
    const x = 20 + i * 192;
    S("rect", { x, y: 40, width: 176, height: 96, rx: 10, class: "tab" });
    T(x + 88, 96, txt, "big", "middle");
    T(x + 88, 160, P.t(k), "mut", "middle");
  });
  const y0 = 232, xs = [90, 230, 370, 510], lab = [-1, 0, 1, 2];
  S("line", { x1: 40, y1: y0, x2: 560, y2: y0, class: "ax" });
  lab.forEach((A2, j) => {
    S("circle", { cx: xs[j], cy: y0, r: 5, class: "dotOn" });
    T(xs[j], y0 - 14, yearText(A2), "", "middle");
  });
  if (state.guessed) {
    S("path", { d: `M${xs[1]} ${y0 + 14} v8 H${xs[2]} v-8`, class: "brk" });
    T(300, y0 + 42, P.t("yr1"), "acc", "middle");
    T(300, y0 + 64, P.t("noZero"), "gap", "middle");
  } else T(300, y0 + 40, "?", "huge", "middle");
}

/* ---------- steps 2–3: the dials ---------- */
const TICK = 84;
function drawDials() {
  setView(420);
  const A = state.A, g = gz(A);
  // band 1: CE/BCE line
  T(14, 22, P.t("ce") + " / " + P.t("bce"), "mut");
  S("line", { x1: 10, y1: 78, x2: 590, y2: 78, class: "ax" });
  for (let k = -3; k <= 3; k++) {
    const B = A + k;
    if (B < MIN_A || B > MAX_A) continue;
    const x = 300 + k * TICK, h = histYear(B), on = k === 0;
    const grp = S("g", { class: "hot", "data-y": B });
    if (on) S("rect", { x: x - 38, y: 40, width: 76, height: 58, rx: 8, class: "cellOn" }, grp);
    S("circle", { cx: x, cy: 78, r: on ? 0 : 4, class: "dotOn" }, grp);
    T(x, 64, String(Math.abs(h)), on ? "onTx big" : "", "middle", grp);
    T(x, 94, h < 0 ? P.t("bce") : P.t("ce"), on ? "onTx" : "mut", "middle", grp);
    if (B === 0 && k < 3) {                                // gap between 1 BCE and 1 CE
      const gx = x + TICK / 2;
      S("line", { x1: gx, y1: 70, x2: gx, y2: 86, class: "gapL" });
      T(gx, 116, P.t("noZero"), "gap", "middle");
    }
  }
  // band 2: 干支 wheel
  const cx = 150, cy = 282;
  T(14, 150, P.t("gzHead"), "mut");
  S("circle", { cx, cy, r: 110, class: "ring" });
  S("circle", { cx, cy, r: 72, class: "ring" });
  for (let i = 0; i < 10; i++) {
    const ang = (-90 + i * 36) * Math.PI / 180, x = cx + 110 * Math.cos(ang), y = cy + 110 * Math.sin(ang);
    if (i === g.s) S("circle", { cx: x, cy: y, r: 13, class: "cellOn" });
    T(x, y + 5, STEMS[i], i === g.s ? "onTx" : "", "middle");
  }
  for (let i = 0; i < 12; i++) {
    const ang = (-90 + i * 30) * Math.PI / 180, x = cx + 72 * Math.cos(ang), y = cy + 72 * Math.sin(ang);
    if (i === g.b) S("circle", { cx: x, cy: y, r: 13, class: "cellOn" });
    T(x, y + 5, BRANCHES[i], i === g.b ? "onTx" : "", "middle");
  }
  T(cx, cy + 6, g.name, "huge", "middle");
  T(cx, cy + 28, P.t("ofSixty", { i: g.i + 1 }), "mut", "middle");
  // band 2: era list
  T(318, 150, P.t("eraHead"), "mut");
  const SC = 134 / 61;
  T(318, 172, P.t("china"), "mut");
  T(318, 330, P.t("japan"), "mut");
  ERAS.forEach((e, i) => {
    const y = i < 5 ? 196 + i * 27 : 354 + (i - 5) * 27, end = eraEnd(e), inE = A >= e.from && A <= end;
    const grp = S("g", { class: "hot", "data-y": e.from });
    S("rect", { x: 312, y: y - 18, width: 278, height: 25, rx: 6, fill: "transparent" }, grp);
    T(318, y, ZH ? e.zh : e.py, inE ? "acc" : "", "start", grp);
    T(446, y, e.from + "–" + (e.to == null ? "" : e.to), inE ? "acc" : "mut", "end", grp);
    const w = Math.max(4, (end - e.from + 1) * SC);
    S("rect", { x: 452, y: y - 10, width: w, height: 10, rx: 3, class: "barBg" }, grp);
    if (inE) S("rect", { x: 452, y: y - 10, width: Math.max(3, (A - e.from + 1) * SC), height: 10, rx: 3, class: "barFg" }, grp);
  });
  const es = eraShort(A);
  T(318, 410, es || P.t("noEra"), es ? "big" : "mut", "start");
}

/* ---------- step 4: span ruler ---------- */
const SX = (A) => 30 + (A + 9) * (540 / 19);
function drawSpan() {
  setView(300);
  const a = state.sa, b = state.sb, sp = span(a, b), y0 = 120;
  S("line", { x1: 20, y1: y0, x2: 580, y2: y0, class: "ax" });
  for (let A = -9; A <= 10; A++) {
    const x = SX(A), h = histYear(A);
    S("line", { x1: x, y1: y0 - 6, x2: x, y2: y0 + 6, class: "ax" });
    T(x, y0 - 14, String(Math.abs(h)), A > sp.lo && A <= sp.hi ? "acc" : "", "middle");
  }
  const gx = (SX(0) + SX(1)) / 2;
  S("line", { x1: gx, y1: y0 + 10, x2: gx, y2: y0 + 22, class: "gapL" });
  T(gx, y0 + 40, P.t("noZero"), "gap", "middle");
  T(SX(-9), y0 + 40, "← " + P.t("bce"), "mut", "start");
  T(SX(10), y0 + 40, P.t("ce") + " →", "mut", "end");
  if (sp.n > 0) S("path", { d: `M${SX(sp.lo)} ${y0 - 34} v-8 H${SX(sp.hi)} v8`, class: "brk" });
  T((SX(sp.lo) + SX(sp.hi)) / 2, y0 - 50, sp.n === 0 ? P.t("yr0") : sp.n === 1 ? P.t("yr1") : P.t("yrs", { n: sp.n }), "acc", "middle");
  [[a, "dotOn", "sa"], [b, "dotB", "sb"]].forEach(([A, cls, id]) => S("circle", { cx: SX(A), cy: y0, r: 10, class: cls + " hot", "data-h": id }));
  const L = spanLines();
  L.forEach((s, i) => T(300, 200 + i * 28, s, i === 0 ? "big" : "mut", "middle"));
}
function spanLines() {
  const sp = span(state.sa, state.sb), hl = histYear(sp.lo), hh = histYear(sp.hi);
  if (sp.cross) {
    const a = -hl, b = hh;
    return [P.t("rRight", { expr: `${a} + ${b} − 1 = ${sp.n}` }), P.t("rZero", { w: a + b })];
  }
  const ex = hl < 0 ? `${-hl} − ${-hh} = ${sp.n}` : `${hh} − ${hl} = ${sp.n}`;
  return [P.t("rSame", { expr: ex })];
}

function setView(h) { fig.setAttribute("viewBox", "0 0 600 " + h); fig.style.aspectRatio = "600 / " + h; }

/* ---------- side panel ---------- */
function line(cls, text, parent) { const d = document.createElement("div"); d.className = cls; d.textContent = text; parent.appendChild(d); return d; }
function info() {
  const box = $("info"), A = state.A, g = gz(A);
  box.innerHTML = "";
  line("gp", yearText(A), box);
  const nb = sameGzList(A, 2);
  line("", P.t("gzLine", { gz: g.name, py: STEM_PY[g.s] + " " + BR_PY[g.b], an: ZH ? ANIMAL_ZH[g.b] : ANIMAL_EN[g.b], i: g.i + 1, p: nb[0] != null ? yearText(nb[0]) : "—", n: nb[1] != null ? yearText(nb[1]) : "—" }), box);
  line("", eraText(A), box);
  if (A <= 0) line("dt", P.t("earlyBCE"), box);
  if (A < 525) line("dt", P.t("early525"), box);
}
function taskPanel() {
  const t = TASKS[state.task], n = TASKS.length;
  $("taskK").textContent = P.t("taskK", { i: state.task + 1, n }) + " · " + P.t("tries", { s: state.solved.size, n });
  $("taskIns").textContent = P.t("i" + t.k);
  $("taskFb").textContent = state.showHint ? P.t("h" + t.k + "t") : "";
  $("taskFb").className = "fbk";
}
function checkTask() {
  const t = TASKS[state.task], A = state.A, tg = t.targets(), fb = $("taskFb");
  if (tg.includes(A)) {
    state.solved.add(state.task);
    const v = { y: yearText(A), gz: gzLabel(A) };
    if (t.k === 4) { v.a = ERAS[3].from; v.b = ERAS[3].to; }
    if (t.k === 5) v.list = tg.filter((x) => x !== A && Math.abs(x - A) <= 120).map(yearText).join(ZH ? "、" : ", ");
    taskPanel();
    fb.textContent = P.t("tOk", { why: P.t("w" + t.k, v) }) + (state.solved.size === TASKS.length ? " " + P.t("allDone") : "");
    fb.className = "fbk ok";
  } else {
    const es = eraShort(A);
    fb.textContent = P.t("tNo", { y: yearText(A), gz: gzLabel(A), e: es ? (ZH ? "，" : ", ") + es : "" });
    fb.className = "fbk no";
  }
  Play.live($("live"), fb.textContent);
}
function rules() {
  const ul = $("rules");
  ul.innerHTML = "";
  const now = TODAY + " = " + gzLabel(TODAY);
  const list = [1924, 1984, 2044].map(yearText).join(ZH ? "、" : ", ");
  ["rule1", "rule2", "rule3", "rule4"].forEach((k) => {
    const li = document.createElement("li");
    li.textContent = P.t(k, { now, list, zg: 627 + 3 - 1 });
    ul.appendChild(li);
  });
}

/* ---------- drawing + state ---------- */
function draw() {
  fig.innerHTML = "";
  const i = st ? st.i : 0;
  if (i === 0) drawIntro();
  else if (i === 3) drawSpan();
  else drawDials();
  $("yr").value = state.A;
  $("yrVal").textContent = yearText(state.A);
  $("sa").value = state.sa; $("sb").value = state.sb;
  if (i === 1 || i === 2) info();
  document.querySelector(".result").hidden = i === 0 && !state.guessed;
}
function setYear(A, announce) {
  const v = Play.clamp(Math.round(A), MIN_A, MAX_A);
  if (!Number.isFinite(v)) return;
  state.A = v;
  draw();
  if (announce !== false) Play.live($("live"), P.t("liveY", { y: yearText(v), gz: gzLabel(v), e: eraText(v, true) }));
}

let timer = null;
function stopRun() { if (timer) { clearInterval(timer); timer = null; } $("run").textContent = P.t("run"); }
$("run").addEventListener("click", () => {
  if (timer) return stopRun();
  $("run").textContent = P.t("pause");
  timer = setInterval(() => { if (state.A >= MAX_A) return stopRun(); setYear(state.A + 1, false); }, 400);
});

let st = null;
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { state.guessed = true; draw(); });

st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  stopRun();
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ctlYear").hidden = !(i === 1 || i === 2);
  $("ctlSpan").hidden = i !== 3;
  $("info").hidden = !(i === 1 || i === 2);
  $("task").hidden = i !== 2;
  $("rules").hidden = i !== 3;
  fig.style.cursor = i === 0 ? "default" : "";
  if (i === 2) taskPanel();
  if (i === 3) rules();
  $("live").textContent = "";
  draw();
});

/* controls */
$("yr").addEventListener("input", (e) => setYear(+e.target.value));
$("bL").addEventListener("click", () => setYear(state.A - 1));
$("bR").addEventListener("click", () => setYear(state.A + 1));
$("m60").addEventListener("click", () => setYear(state.A - 60));
$("p60").addEventListener("click", () => setYear(state.A + 60));
const JUMPS = [[TODAY, ""], [2024, "甲辰"], [1984, "甲子"], ...ERAS.map((e) => [e.from, e.zh + "元年"]), [1, ""], [-840, "共和元年"]];
(function fillJump() {
  const sel = $("jump"), o0 = document.createElement("option");
  o0.value = ""; o0.textContent = P.t("jumpPick"); sel.appendChild(o0);
  JUMPS.forEach(([A, lab]) => {
    const o = document.createElement("option");
    o.value = A; o.textContent = yearText(A) + (lab ? " = " + lab : "");
    sel.appendChild(o);
  });
})();
$("jump").addEventListener("change", (e) => { if (e.target.value !== "") setYear(+e.target.value); e.target.value = ""; });
$("sa").addEventListener("input", (e) => { state.sa = +e.target.value; draw(); Play.live($("live"), spanLines()[0]); });
$("sb").addEventListener("input", (e) => { state.sb = +e.target.value; draw(); Play.live($("live"), spanLines()[0]); });
$("check").addEventListener("click", checkTask);
$("hint").addEventListener("click", () => { state.showHint = true; taskPanel(); });
$("next").addEventListener("click", () => { state.task = (state.task + 1) % TASKS.length; state.showHint = false; taskPanel(); });

/* pointer: drag the dials sideways; tap a year or an era; drag the span dots */
let drag = null, lastHandle = "sb";
fig.addEventListener("pointerdown", (ev) => {
  const i = st.i;
  if (i === 0) return;
  const p = Play.pointer(fig, ev), h = ev.target.closest("[data-h]");
  if (i === 3) {
    let id = h ? h.dataset.h : (Math.abs(p.x - SX(state.sa)) < Math.abs(p.x - SX(state.sb)) ? "sa" : "sb");
    drag = { span: id }; lastHandle = id;
    moveHandle(id, p.x);
  } else drag = { x0: p.x, A0: state.A, moved: false, tgt: ev.target.closest("[data-y]") };
  try { fig.setPointerCapture(ev.pointerId); } catch (e) { /* fine */ }
});
function moveHandle(id, x) {
  const A = Play.clamp(Math.round((x - 30) / (540 / 19)) - 9, -9, 10);
  if (state[id] === A) return;
  state[id] = A; draw(); Play.live($("live"), spanLines()[0]);
}
fig.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const p = Play.pointer(fig, ev);
  if (drag.span) return moveHandle(drag.span, p.x);
  const dx = p.x - drag.x0;
  if (Math.abs(dx) > 6) drag.moved = true;
  if (drag.moved) { const A = drag.A0 - Math.round(dx / TICK); if (A !== state.A) setYear(A); }
});
function up() {
  if (drag && !drag.span && !drag.moved && drag.tgt) setYear(+drag.tgt.dataset.y);
  drag = null;
}
fig.addEventListener("pointerup", up);
fig.addEventListener("pointercancel", () => (drag = null));
fig.addEventListener("keydown", (e) => {
  const i = st.i;
  if (i === 0) return;
  let d = 0;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") d = e.shiftKey ? 10 : 1;
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") d = e.shiftKey ? -10 : -1;
  else if (e.key === "PageUp") d = 60;
  else if (e.key === "PageDown") d = -60;
  else return;
  e.preventDefault();
  if (i === 3) { state[lastHandle] = Play.clamp(state[lastHandle] + Math.sign(d), -9, 10); draw(); Play.live($("live"), spanLines()[0]); }
  else setYear(state.A + d);
});

$("reset").addEventListener("click", () => {
  stopRun();
  Object.assign(state, { A: Math.min(TODAY, MAX_A), guessed: false, sa: -2, sb: 4, task: 0, showHint: false });
  state.solved = new Set();
  pr.reset(); st.go(0);
});

$("resMain").textContent = P.t("resMain", { g: span(0, 1).n, zg: TASKS[0].targets()[0] });
draw();
</script>
</body>
</html>

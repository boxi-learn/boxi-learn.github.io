const P = Play.setup({ en: EN, zh: ZH });
const $ = (id) => document.getElementById(id);
const fig = $("fig"), panel = $("panel");
const STEPN = 4;
let step = 0, sel = null, tabW = "A", checked2 = false, checked3 = false;
const pos = { A: WIT.A.home.slice(), B: WIT.B.home.slice(), T: WIT.T.home.slice() };
let pick = {}, cpick = {};
const COL = { A: "var(--c)", B: "var(--h)", T: "var(--a)" };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const home = { A: WIT.A.home, B: WIT.B.home, T: WIT.T.home };
const joinW = (ks) => {
  const n = ks.map((k) => P.t("w" + k));
  return n.length < 2 ? n.join("") : n.slice(0, -1).join(P.t("listSep")) + P.t("andW") + n[n.length - 1];
};
function reason(k, r, t) {
  return P.t("why_" + r.why, { w: P.t("w" + k), o: r.by ? P.t("ob_" + r.by) : "", time: clock(t) });
}

function draw() {
  fig.innerHTML = "";
  const S = (tag, a, p) => Play.svg(tag, a, p || fig);
  S("rect", { class: "ground", x: 0, y: 0, width: W, height: H });
  if (step > 0) {
    S("polygon", { class: "fanA", points: fan(WIT.A, pos.A, 99, 360).map((p) => p.join(",")).join(" ") });
    S("polygon", { class: "fanB", points: fan(WIT.B, pos.B, 99, 240).map((p) => p.join(",")).join(" ") });
  }
  OBS.forEach((o) => {
    const [x0, y0, x1, y1] = o.r;
    const cls = o.id === "cart" ? "cart" : o.id === "houses" || o.id === "corner" ? "bld" : o.k === "tall" ? "tall" : "low";
    S("rect", { class: cls, x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: o.k === "low" ? 3 : 0 });
  });
  const flame = (x, y, s) => S("path", { class: "flame", d: `M${x} ${y + 9 * s}c${-9 * s} 0 ${-10 * s} ${-9 * s} ${-3 * s} ${-19 * s}c0 ${6 * s} ${4 * s} ${7 * s} ${5 * s} ${2 * s}c${3 * s} ${4 * s} ${8 * s} ${17 * s} ${-2 * s} ${17 * s}z` });
  flame(434, 185, 1.1); flame(470, 238, .9);
  const lab = (x, y, k, a, cls) => { const t = S("text", { class: "lab " + (cls || ""), x, y, "text-anchor": a || "start" }); t.textContent = P.t(k); return t; };
  lab(30, 32, "lab_houses");
  lab(62, 136, "lab_tower", "start", "opt");
  lab(295, 352, "lab_well", "middle");
  lab(592, 198, "lab_lane", "end", "opt");
  lab(464, 160, "lab_cart", "middle", "opt");
  // places
  const selItem = sel ? (sel.k === "s" ? ST : CL).find((x) => x.id === sel.id) : null;
  if (step > 0) Object.keys(PTS).forEach((k) => S("circle", { class: "pin" + (selItem && selItem.at === k ? " on" : ""), cx: PTS[k][0], cy: PTS[k][1], r: selItem && selItem.at === k ? 8 : 4 }));
  // sight lines for the selected item
  if (selItem && step > 0) {
    const who = step >= 2 ? ["A", "B", "T"] : ["A", "B"];
    const tg = PTS[selItem.at];
    who.forEach((k) => {
      const r = look(WIT[k], pos[k], tg, selItem.t);
      const p0 = pos[k];
      if (r.ok) S("line", { class: "sl", x1: p0[0], y1: p0[1], x2: tg[0], y2: tg[1], stroke: COL[k] });
      else if (r.why === "blocked") {
        S("line", { class: "sl", x1: p0[0], y1: p0[1], x2: r.hit[0], y2: r.hit[1], stroke: COL[k] });
        S("line", { class: "sl dash faint", x1: r.hit[0], y1: r.hit[1], x2: tg[0], y2: tg[1], stroke: "var(--muted)" });
        const [hx, hy] = r.hit;
        S("path", { class: "x", d: `M${hx - 7} ${hy - 7}L${hx + 7} ${hy + 7}M${hx + 7} ${hy - 7}L${hx - 7} ${hy + 7}` });
      } else S("line", { class: "sl dash" + (r.why === "cone" ? " faint" : ""), x1: p0[0], y1: p0[1], x2: tg[0], y2: tg[1], stroke: r.why === "cone" ? "var(--muted)" : COL[k] });
    });
  }
  // watchman
  S("circle", { class: "ring", cx: pos.T[0], cy: pos.T[1], r: 11, fill: COL.T });
  S("text", { class: "wtx", x: pos.T[0], y: pos.T[1] }).textContent = "W";
  // witnesses
  ["A", "B"].forEach((k) => {
    const g = S("g", { class: "wit", tabindex: 0, role: "button", "aria-label": P.t("wit" + k), "data-w": k });
    if (k === "B") S("rect", { x: pos.B[0] - 15, y: 44, width: 30, height: 8, fill: "var(--surface)", stroke: COL.B }, g);
    S("circle", { class: "ring", cx: pos[k][0], cy: pos[k][1] + (k === "B" ? 4 : 0), r: 13, fill: COL[k] }, g);
    S("text", { class: "wtx", x: pos[k][0], y: pos[k][1] + (k === "B" ? 4 : 0) }, g).textContent = k;
  });
}

function stRow(s) {
  const p = pick[s.id] || {};
  const r = look(WIT[s.w], home[s.w], PTS[s.at], s.t);
  let fb = "";
  if (checked2) {
    const okS = p.see === r.ok, okM = !!p.mot === s.m;
    fb = `<div class="fbk"><span class="${okS ? "ok" : "bad"}">${P.t(okS ? "ok" : "no")}</span> ${esc(reason(s.w, r, s.t))}<br><span class="${okM ? "ok" : "bad"}">${P.t(okM ? "ok" : "no")}</span> ${esc(s.m ? P.t("motY", { r: P.t("r" + s.w) }) : P.t("motN"))}</div>`;
  }
  return `<div class="row${sel && sel.id === s.id ? " sel" : ""}"><button type="button" class="qt" data-sel="s:${s.id}">${esc(P.t("st_" + s.id))}</button>
    <div class="meta">${esc(P.t("meta", { at: P.t("at_" + s.at), time: clock(s.t) }))}</div>
    <div class="ch"><button type="button" class="${p.see === true ? "on" : ""}" data-see="${s.id}:1">${P.t("saw")}</button><button type="button" class="${p.see === false ? "on" : ""}" data-see="${s.id}:0">${P.t("cant")}</button>
    <label class="check"><input type="checkbox" data-mot="${s.id}"${p.mot ? " checked" : ""}> ${P.t("mot")}</label></div>${fb}</div>`;
}
function clRow(c) {
  const v = classify(c, home);
  const says = ["A", "B", "T"].map((k) => {
    const s = c.s[k], key = s > 0 ? "sP" : s < 0 ? "sM" : "s0";
    return `<span class="${s > 0 ? "p" : s < 0 ? "m" : ""}">${esc(P.t(key, { w: P.t("w" + k) }))}</span>`;
  }).join("");
  let fb = "";
  if (checked3) {
    const ok = cpick[c.id] === v.cat;
    const blind = ["A", "B", "T"].filter((k) => c.s[k] < 0 && !v.able[k].ok);
    const con = blind.length ? P.t("ex_con", { list: joinW(blind) }) : "";
    let ex;
    if (v.cat === "none") ex = P.t("ex_none", { why: ["A", "B", "T"].filter((k) => c.s[k]).map((k) => reason(k, v.able[k], c.t)).join(" ") });
    else ex = P.t("ex_" + v.cat, { sup: joinW(v.sup), con });
    fb = `<div class="fbk"><span class="${ok ? "ok" : "bad"}">${P.t(ok ? "ok" : "no")} ${P.t("c_" + v.cat)}</span> — ${esc(ex)}</div>`;
  }
  const btn = (cat) => `<button type="button" class="${cpick[c.id] === cat ? "on" : ""}" data-cat="${c.id}:${cat}">${P.t("c_" + cat)}</button>`;
  return `<div class="row${sel && sel.id === c.id ? " sel" : ""}"><button type="button" class="qt" data-sel="c:${c.id}">${esc(P.t("cl_" + c.id))}</button>
    <div class="says">${says}</div><div class="ch">${btn("firm")}${btn("one")}${btn("none")}</div>${fb}</div>`;
}
function stats() {
  const seen = (w) => ST.filter((s) => s.w === w && look(WIT[w], home[w], PTS[s.at], s.t).ok).length;
  const cats = { firm: 0, one: 0, none: 0 };
  CL.forEach((c) => cats[classify(c, home).cat]++);
  return { a: seen("A"), b: seen("B"), cats };
}
function renderPanel() {
  let h = "";
  if (step === 0) h = `<p><strong>${esc(P.t("qA"))}</strong></p><p><strong>${esc(P.t("qB"))}</strong></p>`;
  if (step === 1) {
    h += `<div class="seg" role="group">${["A", "B"].map((k) => `<button type="button" class="${tabW === k ? "on" : ""}" data-tab="${k}">${k}</button>`).join("")}</div>`;
    h += `<div class="acct">${P.t("acc" + tabW)}</div>`;
    h += ST.filter((s) => s.w === tabW).map(stRow).join("");
    let sc = "";
    if (checked2) {
      let a = 0, b = 0;
      ST.forEach((s) => { const p = pick[s.id] || {}; if (p.see === look(WIT[s.w], home[s.w], PTS[s.at], s.t).ok) a++; if (!!p.mot === s.m) b++; });
      sc = esc(P.t("score2", { a, b, n: ST.length }));
    }
    h += `<div class="actions"><button type="button" id="chk2">${P.t("check")}</button><span>${sc}</span></div>`;
  }
  if (step === 2) {
    const first = LOG[0][0], last = LOG[LOG.length - 1][0];
    h += `<div class="log"><div><b>${esc(P.t("logH"))}</b></div>${LOG.map(([m, k]) => `<div><span class="tm">${clock(m)}</span>${esc(P.t(k))}</div>`).join("")}<div>${esc(P.t("logSum", { m: last - first }))}</div></div>`;
    h += CL.map(clRow).join("");
    let sc = "";
    if (checked3) sc = esc(P.t("score3", { a: CL.filter((c) => cpick[c.id] === classify(c, home).cat).length, n: CL.length }));
    h += `<div class="actions"><button type="button" id="chk3">${P.t("check")}</button><span>${sc}</span></div>`;
  }
  if (step === 3) {
    const s = stats();
    h = `<p class="rulebox">${esc(P.t("rule"))}</p><p>${esc(P.t("b4", { a: s.a, b: s.b, f: s.cats.firm, n: CL.length }))}</p>`;
  }
  panel.innerHTML = h;
}
function renderText() {
  const s = stats();
  const k = step + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = step === 3 ? "" : P.t("b" + k);
  $("stepBody").hidden = step === 3;
  $("predict").hidden = step !== 0;
  $("resMain").textContent = step === 3 || checked3 ? P.t("resRun", { f: s.cats.firm, o: s.cats.one, n: s.cats.none }) : P.t("resPend");
  const movedA = pos.A[0] !== home.A[0] || pos.A[1] !== home.A[1], movedB = pos.B[0] !== home.B[0];
  let live = "";
  if (step > 0) {
    const cnt = (w) => Object.keys(PTS).filter((q) => look(WIT[w], pos[w], PTS[q], 99).ok).length;
    live = P.t("seeN", { a: cnt("A"), b: cnt("B") }) + ((movedA || movedB) ? " " + P.t("moved") : "");
  }
  Play.live($("live"), live);
  $("key").innerHTML = step === 0 ? "" : [["A", "keyA"], ["B", "keyB"], ["T", "keyT"]].map(([w, kk]) => `<span><i style="border-color:${COL[w]}"></i>${esc(P.t(kk))}</span>`).join("") +
    `<span><i class="d" style="border-color:var(--muted)"></i>${esc(P.t("keyOut"))}</span>`;
}
function render() { draw(); renderPanel(); renderText(); }

panel.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.sel) { const [k, id] = b.dataset.sel.split(":"); sel = { k, id }; }
  else if (b.dataset.see) { const [id, v] = b.dataset.see.split(":"); pick[id] = Object.assign({}, pick[id], { see: v === "1" }); }
  else if (b.dataset.cat) { const [id, v] = b.dataset.cat.split(":"); cpick[id] = v; sel = { k: "c", id }; }
  else if (b.dataset.tab) { tabW = b.dataset.tab; sel = null; }
  else if (b.id === "chk2") checked2 = true;
  else if (b.id === "chk3") checked3 = true;
  else return;
  const focusKey = b.dataset.sel || b.dataset.see || b.dataset.cat || b.dataset.tab || b.id;
  render();
  const again = [...panel.querySelectorAll("button")].find((x) => (x.dataset.sel || x.dataset.see || x.dataset.cat || x.dataset.tab || x.id) === focusKey);
  if (again) again.focus();
});
panel.addEventListener("change", (e) => {
  const id = e.target.dataset.mot;
  if (!id) return;
  pick[id] = Object.assign({}, pick[id], { mot: e.target.checked });
  render();
  const cb = panel.querySelector(`[data-mot="${id}"]`);
  if (cb) cb.focus();
});

// Drag and keyboard for the witnesses.
function moveTo(k, p) {
  if (k === "B") { pos.B = [Math.round(Play.clamp(p[0], 40, 550)), WIT.B.home[1]]; return true; }
  const q = [Math.round(Play.clamp(p[0], 30, 555)), Math.round(Play.clamp(p[1], 55, 360))];
  if (!freeSpot(q)) return false;
  pos.A = q;
  return true;
}
let drag = null;
fig.addEventListener("pointerdown", (e) => {
  const g = e.target.closest(".wit");
  if (!g || step === 0) return;
  drag = g.dataset.w;
  try { fig.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  e.preventDefault();
});
fig.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (moveTo(drag, (({ x, y }) => [x, y])(Play.pointer(fig, e)))) { draw(); renderText(); }
});
const endDrag = () => { if (drag) { const k = drag; drag = null; draw(); renderText(); const g = fig.querySelector(`[data-w="${k}"]`); if (g) g.focus(); } };
fig.addEventListener("pointerup", endDrag);
fig.addEventListener("pointercancel", endDrag);
fig.addEventListener("keydown", (e) => {
  const g = e.target.closest && e.target.closest(".wit");
  if (!g || step === 0) return;
  const k = g.dataset.w, d = e.shiftKey ? 20 : 6;
  const dv = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
  if (!dv) return;
  e.preventDefault();
  moveTo(k, [pos[k][0] + dv[0], pos[k][1] + dv[1]]);
  draw(); renderText();
  const ng = fig.querySelector(`[data-w="${k}"]`);
  if (ng) ng.focus();
});

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), Array.from({ length: STEPN }, (_, i) => P.t("s" + (i + 1))), (i) => {
  step = i;
  sel = i === 1 ? { k: "s", id: tabW === "A" ? "a3" : "b2" } : i === 2 ? { k: "c", id: "help" } : i === 3 ? { k: "c", id: "help" } : null;
  render();
});
$("reset").addEventListener("click", () => {
  pos.A = home.A.slice(); pos.B = home.B.slice();
  pick = {}; cpick = {}; checked2 = checked3 = false; tabW = "A";
  pr.reset(); st.go(0);
});
</script>

   u = west (0) → east (1), v = north (0) → south (1). NOT a map projection: positions only keep the order of places.

const NODES = {

  ANT: { u: 0.12, v: 0.30, lw: "n", lp: "e" },

};
/* [a, b, km, type, bend]: rough route lengths in km (rounded), "L" overland, "S" by sea.
   Two Dunhuang–Kashgar edges: north and south of the Taklamakan desert. */
const EDGES = [
  ["CON", "ANT", 1100, "L", 0], ["ANT", "CTE", 900, "L", 0], ["ANT", "ALE", 750, "L", 0], ["CON", "ALE", 1300, "S", 0.18],
  ["CTE", "MER", 1700, "L", 0], ["MER", "SAM", 600, "L", 0], ["SAM", "KAS", 800, "L", 0], ["SAM", "GAN", 900, "L", 0],
  ["GAN", "KAS", 900, "L", 0], ["KAS", "DUN", 2300, "L", -0.22], ["KAS", "DUN", 2100, "L", 0.22], ["DUN", "CHA", 1700, "L", 0],
  ["CHA", "GUA", 1600, "L", 0], ["GUA", "MAL", 2700, "S", 0], ["MAL", "CAL", 3200, "S", 0], ["CAL", "ADE", 3300, "S", 0],
  ["ADE", "ALE", 2400, "S", 0], ["CAL", "CTE", 3000, "S", -0.12],
];
/* Illustrative travel model (not historical data). */
const M = { landKmDay: 30, seaKmDay: 150, seaWait: 30, landRisk: 0.02, seaRisk: 0.03 };
/* goods and ideas; era "e" = early (Han–Roman), "l" = later (Tang–Mongol); idea = not sold, so no markup */
const GOODS = [
  { id: "silk", era: "e", routes: { L: ["CHA", "DUN", "KAS", "SAM", "MER", "CTE", "ANT"], S: ["CHA", "GUA", "MAL", "CAL", "ADE", "ALE"] } },
  { id: "glass", era: "e", routes: { L: ["ANT", "CTE", "MER", "SAM", "KAS", "DUN", "CHA"], S: ["ALE", "ADE", "CAL", "MAL", "GUA", "CHA"] } },
  { id: "horse", era: "e", routes: { L: ["SAM", "KAS", "DUN", "CHA"] } },
  { id: "pepper", era: "e", routes: { S: ["CAL", "ADE", "ALE"] } },
  { id: "budd", era: "e", idea: 1, routes: { L: ["GAN", "KAS", "DUN", "CHA"] } },
  { id: "paper", era: "l", idea: 1, routes: { L: ["CHA", "DUN", "KAS", "SAM", "MER", "CTE"] } },
  { id: "gunp", era: "l", idea: 1, routes: { L: ["CHA", "DUN", "KAS", "SAM", "MER", "CTE"] } },
];
const ENDS = ["ANT", "ALE", "CON"];

/* ---------- pure logic ---------- */
function edgeOf(a, b) { return EDGES.find((e) => (e[0] === a && e[1] === b) || (e[0] === b && e[1] === a)); }
function legDays(e) { return e[3] === "S" ? e[2] / M.seaKmDay + M.seaWait : e[2] / M.landKmDay; }
function legRisk(e) { return 1 - Math.pow(1 - (e[3] === "S" ? M.seaRisk : M.landRisk), e[2] / 1000); }
/* one trader per leg; price is multiplied by (1 + markup) every time it is sold on */
function chain(path, markup) {
  const m = Number.isFinite(markup) ? Math.max(0, markup) : 0;
  const legs = [];
  let km = 0, days = 0, ok = 1;
  for (let i = 0; i + 1 < path.length; i++) {
    const e = edgeOf(path[i], path[i + 1]);
    if (!e) return null;
    const d = legDays(e);
    legs.push({ a: path[i], b: path[i + 1], e, km: e[2], days: d, t0: days });
    km += e[2]; days += d; ok *= 1 - legRisk(e);
  }
  const n = legs.length;
  return {
    legs, n, km, days, arrive: ok,
    mult: Math.pow(1 + m, n),
    longestLeg: legs.reduce((x, l) => Math.max(x, l.days), 0),
    priceAfter: (k) => Math.pow(1 + m, Number.isFinite(k) ? Play.clamp(Math.floor(k), 0, n) : 0),
  };
}
/* number of different routes (edge sequences, no city twice) from a to any of the targets */
function countRoutes(a, targets) {
  let n = 0;
  const seen = new Set([a]);
  (function go(x) {
    if (targets.includes(x)) { n++; return; }
    EDGES.forEach((e) => {
      const y = e[0] === x ? e[1] : e[1] === x ? e[0] : null;
      if (y && !seen.has(y)) { seen.add(y); go(y); seen.delete(y); }
    });
  })(a);
  return n;
}
if (typeof module !== "undefined") module.exports = { NODES, EDGES, GOODS, M, chain, countRoutes, edgeOf, legDays, legRisk };

  resIdea: "{g}，{r}：经 {n} 个人传递，不是 1 个 · 约 {d} 天",
  resNote: "很少有人走完全程。每一段都有自己的商人，每转卖一次价格就涨一次。「丝绸之路」这个名字本身 1877 年才出现。",
  dot: "·", pct: "%",
  n_CON_e: "拜占庭", n_CON_l: "君士坦丁堡", n_ANT: "安条克", n_ALE: "亚历山大港", n_CTE_e: "泰西封", n_CTE_l: "巴格达",
  n_MER: "木鹿", n_SAM: "撒马尔罕", n_GAN: "犍陀罗", n_KAS: "喀什", n_DUN: "敦煌", n_CHA: "长安（西安）",
  n_GUA: "广州", n_MAL: "马六甲海峡", n_CAL: "卡利卡特", n_ADE: "亚丁（红海）",
  tagS: "示意图，不按比例", tagL: "— 陆路", tagSea: "- - 海路",
  explainK: "说一说", explainQ: "朋友说：「一个商人沿着丝绸之路把丝绸从中国运到了罗马。」用本页的经手人数和价格，跟他讲讲实际是怎样的，价格为什么涨了那么多。",
  homeK: "家里做一做", homeQ: "和家人玩「传下去」：沿一排人悄悄传一句话；或者传一杯米，每人留一勺当「辛苦费」。经过 3 个人还剩多少？6 个人呢？",
  foot: "地图是示意图：位置只保留各地大致的先后关系，不代表距离和方向。泰西封是帕提亚和萨珊的都城；巴格达 762 年建在它附近，所以较晚的东西显示巴格达。拜占庭在 330 年改名君士坦丁堡。卡利卡特代表马拉巴尔海岸的港口（更早是穆吉里斯）。路线、距离（粗略取整）和旅行模型都是示意：商队每天约 30 公里，船每天约 150 公里，每段海路另加约 30 天等季风；风险每 1000 公里陆路 2%、海路 3%；每段一个商人，每次转卖加价相同。真实的贸易差别很大。年代采用通行参考书的说法，都是大致年代。CC BY-SA 4.0 · Boxi Yu",
};
GOODS.forEach((g) => { if (!EN["g_" + g.id] || !ZH["g_" + g.id]) console.error("missing good " + g.id); });
const P = Play.setup({ en: EN, zh: ZH });
const ZHL = P.lang === "zh";
const $ = (id) => document.getElementById(id);
const num = (x, d) => (ZHL || x < 1000 ? Play.fmt(x, d || 0) : Math.round(x).toLocaleString("en"));

/* ---------- state ---------- */
let step = 0, good = GOODS[0], route = "L", markup = 0.25, prog = 0, playing = false, raf = 0, last = 0;
let W = 600, H = 330, portrait = false;
const fig = $("fig");
function cur() { return chain(good.routes[route], markup); }
function era() { return step === 1 ? good.era : "e"; }
function nodeName(id, er) {
  if (id === "CON" || id === "CTE") return P.t("n_" + id + "_" + (er || era()));
  return P.t("n_" + id);
}
function textW(s) { let w = 0; for (const ch of s) w += /[⺀-鿿＀-￯]/.test(ch) ? 13 : 7.3; return w; }

/* ---------- layout ---------- */
function pos(id) {
  const n = NODES[id];
  if (portrait) return { x: 22 + n.v * (W - 44), y: 40 + (1 - n.u) * (H - 74) };
  return { x: 22 + n.u * (W - 44), y: 40 + n.v * (H - 80) };
}
function edgeCtrl(e) {
  const p = pos(e[0]), q = pos(e[1]);
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, dx = q.x - p.x, dy = q.y - p.y;
  return { p, q, c: { x: mx - dy * e[4], y: my + dx * e[4] } };
}
function onEdge(e, from, t) {         // point at fraction t from node "from"
  const g = edgeCtrl(e);
  const tt = e[0] === from ? t : 1 - t, s = 1 - tt;
  return { x: s * s * g.p.x + 2 * s * tt * g.c.x + tt * tt * g.q.x, y: s * s * g.p.y + 2 * s * tt * g.c.y + tt * tt * g.q.y };
}

function draw() {
  portrait = W < 520;
  H = portrait ? 560 : 330;
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  fig.style.height = H + "px";
  fig.innerHTML = "";
  const ch = step === 1 ? cur() : null;
  const path = ch ? good.routes[route] : [];
  const done = Math.floor(prog);
  const active = new Map();             // edge → "on" | "done"
  if (ch) ch.legs.forEach((l, i) => active.set(l.e, i < done ? "done" : "on"));
  // edges
  EDGES.forEach((e) => {
    const g = edgeCtrl(e);
    const cls = (e[3] === "S" ? "eS" : "eL") + (active.has(e) ? " " + active.get(e) : "");
    Play.svg("path", { class: cls, d: `M${g.p.x} ${g.p.y}Q${g.c.x} ${g.c.y} ${g.q.x} ${g.q.y}` }, fig);
  });
  // corner tags
  const t1 = P.t("tagS");
  Play.svg("text", { class: "tag", x: W - 6, y: H - 8, "text-anchor": "end" }, fig).textContent = t1;
  Play.svg("text", { class: "tag", x: 6, y: H - 8 }, fig).textContent = P.t("tagL") + "   " + P.t("tagSea");
  // nodes and labels
  Object.keys(NODES).forEach((id) => {
    const p = pos(id), n = NODES[id];
    const onPath = path.includes(id);
    const c = Play.svg("circle", { class: "nd" + (onPath && path.indexOf(id) <= done ? " on" : "") + (onPath ? " hit" : ""), cx: p.x, cy: p.y, r: onPath ? 7 : 5.5 }, fig);
    if (onPath) {
      c.dataset.k = path.indexOf(id);
      // bigger invisible touch target
      Play.svg("circle", { cx: p.x, cy: p.y, r: 18, fill: "transparent", class: "hit" }, fig).dataset.k = path.indexOf(id);
    }
    const s = nodeName(id), tw = textW(s);
    const side = portrait ? n.lp : n.lw;
    let x = p.x, y = p.y + 4, anchor = "middle";
    if (side === "n") y = p.y - 11;
    if (side === "s") y = p.y + 21;
    if (side === "e") { x = p.x + 11; anchor = "start"; }
    if (side === "w") { x = p.x - 11; anchor = "end"; }
    if (anchor === "middle") x = Play.clamp(x, 3 + tw / 2, W - 3 - tw / 2);
    else if (anchor === "start") x = Math.min(x, W - 3 - tw);
    else x = Math.max(x, 3 + tw);
    Play.svg("text", { class: "lab" + (ch && !onPath ? " dim" : ""), x, y, "text-anchor": anchor }, fig).textContent = s;
  });
  if (!ch) return;
  // trader badges on finished legs, token on the current one
  ch.legs.forEach((l, i) => {
    if (i >= done) return;
    const m = onEdge(l.e, l.a, 0.5);
    Play.svg("circle", { class: "bdg", cx: m.x, cy: m.y, r: 10 }, fig);
    Play.svg("text", { class: "bdgT", x: m.x, y: m.y + 4.5, "text-anchor": "middle" }, fig).textContent = i + 1;
  });
  const k = Math.min(done, ch.n - 1), f = prog >= ch.n ? 1 : prog - done;
  const tp = onEdge(ch.legs[k].e, ch.legs[k].a, prog >= ch.n ? 1 : f);
  Play.svg("circle", { class: "tok", cx: tp.x, cy: tp.y, r: 9 }, fig);
}

/* ---------- step 2 panel ---------- */
function carriers(ch) { return prog >= ch.n ? ch.n : Math.floor(prog) + 1; }
function daysAt(ch) {
  if (prog >= ch.n) return ch.days;
  const k = Math.floor(prog);
  return ch.legs[k].t0 + (prog - k) * ch.legs[k].days;
}
function panel() {
  const box = $("info");
  box.innerHTML = "";
  box.hidden = step === 0;
  if (step === 0) return;
  const add = (cls, txt, parent) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; (parent || box).appendChild(d); return d; };
  if (step === 2) {
    add("gp", P.t("ways", { n: countRoutes("CHA", ENDS) }));
    add("", P.t("name1"));
    add("it", P.t("name2"));
    return;
  }
  const ch = cur();
  add("rg", P.t("d_" + good.id));
  const vs = document.createElement("div"); vs.className = "vs"; box.appendChild(vs);
  const a = add("", "", vs), b = add("no", "", vs);
  add("big", String(carriers(ch)), a); add("sm", P.t("carried") + " · " + P.t("soFar", { n: ch.n }), a);
  add("big", "1", b); add("sm", P.t("myth") + " · " + P.t("one"), b);
  add("", P.t("legsLine", { km: num(ch.km / ch.n), d: num(ch.days / ch.n) }));
  if (good.idea) add("it", P.t("idea"));
  else {
    const xNow = Play.fmt(ch.priceAfter(prog >= ch.n ? ch.n : Math.floor(prog)), 2);
    add("gp", prog >= ch.n ? P.t("price", { x: Play.fmt(ch.mult, 2) }) : P.t("priceNow", { x: xNow }));
    add("calc", P.t("priceCalc", { m: Math.round(markup * 100), n: ch.n, x: Play.fmt(ch.mult, 2) }));
  }
  const dm = document.createElement("div"); box.appendChild(dm);
  const tg = document.createElement("span"); tg.className = "demo"; tg.textContent = P.t("illus"); dm.appendChild(tg);
  add("", P.t("road", { d: num(ch.days), km: num(ch.km) }));
  if (ch.legs.some((l) => l.e[3] === "S")) add("it", P.t("seaNote", { w: M.seaWait }));
  add("", P.t("risk", { p: Math.round(ch.arrive * 100) }));
  add("it", P.t("mythLine", { d: num(ch.days), y: Play.fmt((2 * ch.days) / 365, 1) }));
}
function result() {
  const ch = chain(good.routes[route], markup);
  const r = P.t(route === "L" ? "resL" : "resS");
  $("resMain").textContent = good.idea
    ? P.t("resIdea", { g: P.t("g_" + good.id), r, n: ch.n, d: num(ch.days) })
    : P.t("resGood", { g: P.t("g_" + good.id), r, n: ch.n, x: Play.fmt(ch.mult, 2), d: num(ch.days) });
}
let answered = false;
function showResult() { document.querySelector(".result").hidden = step === 0 && !answered; }

/* ---------- deck: goods and route ---------- */
const deck = $("deck");
function buildDeck() {
  deck.innerHTML = "";
  const lead = (k) => { const d = document.createElement("div"); d.className = "lead"; d.textContent = P.t(k); deck.appendChild(d); };
  lead("deckLead");
  GOODS.forEach((g) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (g === good ? " on" : "");
    b.setAttribute("aria-pressed", g === good ? "true" : "false");
    b.textContent = P.t("g_" + g.id);
    b.addEventListener("click", () => {
      good = g;
      if (!good.routes[route]) route = good.routes.L ? "L" : "S";
      restart(); buildDeck(); deck.querySelectorAll("button")[GOODS.indexOf(g)].focus();
    });
    deck.appendChild(b);
  });
  lead("routeLead");
  ["L", "S"].forEach((r) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (r === route ? " on" : "");
    b.setAttribute("aria-pressed", r === route ? "true" : "false");
    const ok = !!good.routes[r];
    b.disabled = !ok;
    b.textContent = ok ? P.t("r" + r) : P.t("rNo", { r: P.t("r" + r) });
    b.addEventListener("click", () => { route = r; restart(); buildDeck(); deck.querySelectorAll("button")[GOODS.length + (r === "L" ? 0 : 1)].focus(); });
    deck.appendChild(b);
  });
}

/* ---------- animation and stepping ---------- */
const LEG_MS = 1100;
function setProg(x, announce) {
  const ch = cur();
  const old = prog;
  prog = Play.clamp(Number.isFinite(x) ? x : 0, 0, ch.n);
  if (announce !== false && Math.floor(prog) !== Math.floor(old)) say(ch);
  render();
}
function say(ch) {
  const k = Math.floor(prog);
  const c = nodeName(good.routes[route][Math.min(k, ch.n)]);
  if (prog >= ch.n) Play.live($("live"), P.t("liveEnd", { c, n: ch.n, d: num(ch.days) }));
  else if (good.idea) Play.live($("live"), P.t("liveAtIdea", { c, k: k + 1, n: ch.n }));
  else Play.live($("live"), P.t("liveAt", { c, k: k + 1, n: ch.n, x: Play.fmt(ch.priceAfter(k), 2) }));
}
function setPlaying(on) {
  playing = on;
  cancelAnimationFrame(raf);
  if (on) {
    if (prog >= cur().n) prog = 0;
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }
  playBtn();
}
function tick(t) {
  const dt = Math.min(100, t - last); last = t;
  const ch = cur();
  setProg(prog + dt / LEG_MS);
  if (prog >= ch.n) { setPlaying(false); return; }
  raf = requestAnimationFrame(tick);
}
function playBtn() { $("play").textContent = P.t(playing ? "pause" : prog >= cur().n ? "again" : "play"); }
function restart() {
  setPlaying(false);
  prog = 0;
  render();
  say(cur());
  if (step === 1 && !Play.reduced) setPlaying(true);
}
function render() { draw(); if (step === 1) panel(); result(); playBtn(); }
$("play").addEventListener("click", () => setPlaying(!playing));
$("next").addEventListener("click", () => { setPlaying(false); setProg(Math.floor(prog) + 1); });
$("prev").addEventListener("click", () => { setPlaying(false); setProg(Math.ceil(prog) - 1); });
const mk = $("mk");
function setMarkup() { markup = +mk.value / 100; $("mkVal").textContent = P.t("mkVal", { m: mk.value }); render(); }
mk.addEventListener("input", setMarkup);
fig.addEventListener("keydown", (ev) => {
  if (step !== 1) return;
  if (ev.key === "ArrowRight" || ev.key === "ArrowDown") { setPlaying(false); setProg(Math.floor(prog) + 1); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") { setPlaying(false); setProg(Math.ceil(prog) - 1); }
  else if (ev.key === " " || ev.key === "Enter") setPlaying(!playing);
  else if (ev.key === "Home") { setPlaying(false); setProg(0); }
  else if (ev.key === "End") { setPlaying(false); setProg(cur().n); }
  else return;
  ev.preventDefault();
});
fig.addEventListener("pointerdown", (ev) => {
  if (step !== 1) return;
  const k = ev.target && ev.target.dataset ? ev.target.dataset.k : undefined;
  if (k === undefined) return;
  setPlaying(false); setProg(+k);
});

function resize() {
  const r = fig.getBoundingClientRect();
  if (r.width < 10) return;
  const w = Math.round(r.width);
  if (w !== W) { W = w; draw(); }
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(fig); else window.addEventListener("resize", resize);

/* ---------- steps and predict ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { answered = true; showResult(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  deck.hidden = i !== 1;
  $("ctl").hidden = i !== 1;
  showResult();
  setPlaying(false);
  if (i === 1) { buildDeck(); restart(); }
  else { Play.live($("live"), ""); render(); panel(); }
});

$("reset").addEventListener("click", () => {
  setPlaying(false);
  good = GOODS[0]; route = "L"; prog = 0; answered = false;
  mk.value = 25; setMarkup();
  pr.reset(); st.go(0);
});
setMarkup();
st.go(0);
resize();
</script>
</body>
</html>

const astro = (y) => (y < 0 ? y + 1 : y);          // 1 BCE → 0, 30 BCE → -29
const hist = (a) => (a <= 0 ? a - 1 : a);           // inverse, for integers
const gapYears = (y1, y2) => Math.abs(astro(y1) - astro(y2));
function roundGap(g, approx) {
  if (!approx) return g;
  if (g >= 10000) return Math.round(g / 1000) * 1000;

function drawBracket() {

function drawGuess() {

    const x = xL + (gapYears(ePyr.y, n) / total) * (xR - xL);
    Play.svg("line", { class: "gTick", x1: x, x2: x, y1: y0 - 8, y2: y0 + 8 }, gGuess);
  }

    const ax = anchor === "start" ? x - 8 : anchor === "end" ? x + 8 : x;
    Play.svg("text", { class: "gName", x: ax, y: yT, "text-anchor": anchor }, gGuess).textContent = P.t("n_" + e.id);

  else Play.svg("text", { class: "gQ", x: cx, y: cy + 10, "text-anchor": "middle" }, gGuess).textContent = "?";
  const ly = cy - 48 - 48 * ease;
  if (guessed) Play.svg("line", { class: "lead", x1: cx, x2: cx, y1: ly + 26, y2: cy - 9 }, gGuess);
  Play.svg("text", { class: "gName", x: tx, y: ly, "text-anchor": "middle" }, gGuess).textContent = cName;
  Play.svg("text", { class: "gDate", x: tx, y: ly + 18, "text-anchor": "middle" }, gGuess).textContent = dateText(eCleo);

/* ---------- pointer, wheel, keyboard ---------- */
const ptrs = new Map();
let down = null, pinchD = 0, pinchX = 0;
const svgX = (cx) => { const r = fig.getBoundingClientRect(); return ((cx - r.left) / r.width) * W; };

fig.addEventListener("pointerdown", (ev) => {

  if (ptrs.size === 1) {

  } else if (ptrs.size === 2) {

    if (down && down.moved) {

      pan((-(nx - prev.x) / r.width) * (V.b - V.a));

    ptrs.set(ev.pointerId, { x: nx, y: ny });
  } else if (ptrs.size === 2) {
    ptrs.set(ev.pointerId, { x: nx, y: ny });
    const pi = pinchInfo();

function up(ev) {

fig.addEventListener("pointerup", up);
fig.addEventListener("pointercancel", up);
fig.addEventListener("wheel", (ev) => {

$("zOut").addEventListener("click", () => animateTo(...scaled(2)));

function runGuess() {
  guessed = true;
  showResult();
  cancelAnimationFrame(anim);
  if (Play.reduced) { guessT = 1; draw(); return; }
  const t0 = performance.now();
  const f = (t) => {
    guessT = Math.min(1, (t - t0) / 900);
    if (mode === "guess") draw();
    if (guessT < 1) anim = requestAnimationFrame(f); else draw();
  };
  anim = requestAnimationFrame(f);
}

/* ---------- computed strings ---------- */
const mPC = measure(byId.pyr, byId.cleo), mCM = measure(byId.cleo, byId.moon);
const closer = roundGap(mPC.raw - mCM.raw, true);
const dTxt = yearsText(closer, true).replace(/^about |^约 /, "");
$("resMain").textContent = (ZHL ? "公元前 30 年 → 公元 1969 年：" : "30 BCE → 1969 CE: ") + mCM.calc + (ZHL ? " 年" : " years");
$("resNote").textContent = P.t("resNote", { d: dTxt });
const writeAgo = TODAY - astro(-3200);
const sapiensAgo = TODAY - astro(byId.hs.y);

const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right", { g: yearsText(mPC.g, false).replace(/ years| 年/, "") }),
  wrong: P.t("wrong", { d: dTxt }),
}, () => { if (!guessed) runGuess(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("info").hidden = i === 0;
  $("ctl").hidden = i === 0;
  mode = i === 0 ? "guess" : "line";
  showResult();
  if (i === 2) Play.live($("live"), P.t("liveW", { w: yearsText(Math.round(writeAgo / 100) * 100, false).replace(/^about /, ""), pct: Play.fmt((100 * writeAgo) / sapiensAgo, 1) }));
  else if (i === 0) Play.live($("live"), "");
  else info();
  resize();
});

$("reset").addEventListener("click", () => {
  cancelAnimationFrame(anim);
  sel = []; guessed = false; guessT = 0;
  V.a = START[0]; V.b = START[1];
  pr.reset(); st.go(0); info();
});
info();
resize();
</script>
</body>
</html>

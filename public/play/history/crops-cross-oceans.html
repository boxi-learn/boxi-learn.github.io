];
const YMIN = 1400, YMAX = 2000, Y1492 = 1492;

/* ---------- pure logic ---------- */
function crosses(dish, it) { return REGIONS[INGR[it.i]].side !== dish.side; }
function present(dish, it, year) {
  if (!crosses(dish, it)) return true;
  const y = Number.isFinite(year) ? year : YMAX;
  return y >= it.first;
}
function stats(dish, year) {
  const m = dish.items.length;
  const x = dish.items.filter((it) => crosses(dish, it)).length;
  const here = dish.items.filter((it) => present(dish, it, year)).length;
  return { m, x, here, complete: here === m };
}
function totals(year) {
  let m = 0, x = 0, complete = 0, withX = 0;
  DISHES.forEach((d) => { const s = stats(d, year); m += s.m; x += s.x; if (s.complete) complete++; if (s.x > 0) withX++; });
  return { m, x, complete, withX, n: DISHES.length, pct: m ? Math.round((100 * x) / m) : 0 };
}
/* earliest year at which a dish has all its ingredients on record in this story */
function completeFrom(dish) {
  return dish.items.reduce((y, it) => (crosses(dish, it) ? Math.max(y, it.first) : y), YMIN);
}
/* schematic projection: plain lon/lat grid, Americas on the left, Pacific split at the edges */
const LON0 = -130, LON1 = 190, LAT0 = 75, LAT1 = -60;
function proj(ll, W, H) {
  const lon = Number.isFinite(ll[0]) ? ll[0] : 0, lat = Number.isFinite(ll[1]) ? ll[1] : 0;
  return { x: ((lon - LON0) / (LON1 - LON0)) * W, y: ((LAT0 - lat) / (LAT0 - LAT1)) * H };
}

const P = Play.setup({ en: EN, zh: ZH });
const $ = (id) => document.getElementById(id);

/* ---------- state ---------- */
let step = 0, dish = DISHES[0], year = YMAX, answered = false;
let fly = 1, flyRaf = 0, playing = false, raf = 0, last = 0;
let W = 600, H = 330;
const fig = $("fig");
function textW(s) { let w = 0; for (const ch of s) w += /[⺀-鿿＀-￯]/.test(ch) ? 13 : 7.2; return w; }
function pt(ll) { return proj(ll, W, H); }
function curve(a, b) {             // quadratic curve from a to b, bulging north
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(b.x - a.x, b.y - a.y);
  return { a, b, c: { x: mx, y: my - Math.min(70, d * 0.25) } };
}
function at(cv, t) { const s = 1 - t; return { x: s * s * cv.a.x + 2 * s * t * cv.c.x + t * t * cv.b.x, y: s * s * cv.a.y + 2 * s * t * cv.c.y + t * t * cv.b.y }; }
function label(x, y, s, cls, anchor) {
  const tw = textW(s);
  let a = anchor || "middle";
  if (a === "middle") x = Play.clamp(x, 3 + tw / 2, W - 3 - tw / 2);
  else if (a === "start") { if (x + tw > W - 3) { a = "end"; x = Math.min(x - 16, W - 3); } }
  else if (x - tw < 3) { a = "start"; x = Math.max(x + 16, 3); }
  y = Play.clamp(y, 14, H - 22);
  const t = Play.svg("text", { class: "lab " + (cls || ""), x, y, "text-anchor": a }, fig);
  t.textContent = s;
  return t;
}

/* ---------- drawing ---------- */
function draw() {
  H = Math.round(Play.clamp(W * 0.62, 240, 430));
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  fig.style.height = H + "px";
  fig.innerHTML = "";
  Play.svg("rect", { class: "sea", x: 0, y: 0, width: W, height: H }, fig);
  LAND.forEach((poly) => {
    Play.svg("path", { class: "land", d: "M" + poly.map((p) => { const q = pt(p); return q.x.toFixed(1) + " " + q.y.toFixed(1); }).join("L") + "Z" }, fig);
  });
  const wide = W >= 520;
  // the Atlantic divide between the two "sides"
  const d0 = pt([-30, 70]), d1 = pt([-25, -55]);
  Play.svg("line", { class: "divide", x1: d0.x, y1: d0.y, x2: d1.x, y2: d1.y }, fig);
  const oa = pt([-33, 25]);
  Play.svg("text", { class: "ocean", x: oa.x, y: oa.y, "text-anchor": "middle" }, fig).textContent = P.t("oAtl");
  if (wide) {
    const op = pt([-128, -35]);
    Play.svg("text", { class: "ocean", x: op.x + 4, y: op.y }, fig).textContent = P.t("oPac");
  }
  const sa = pt([-124, 72]), se = pt([180, 72]);
  Play.svg("text", { class: "tag", x: Math.max(4, sa.x), y: Math.max(14, sa.y) }, fig).textContent = P.t("sideA");
  Play.svg("text", { class: "tag", x: Math.min(W - 4, se.x), y: Math.max(14, se.y), "text-anchor": "end" }, fig).textContent = P.t("sideE");
  Play.svg("text", { class: "tag", x: W - 6, y: wide ? H - 6 : H - 24, "text-anchor": "end" }, fig).textContent = P.t("tagS");
  const lg = Play.svg("text", { class: "tag", x: 6, y: H - 6 }, fig);
  Play.svg("tspan", { style: "fill: var(--a)" }, lg).textContent = P.t("tagX");
  if (wide || step === 1) Play.svg("tspan", { style: "fill: var(--c)", dx: 10 }, lg).textContent = P.t("tagL");

  const shown = step === 2 ? DISHES : [dish];
  const yNow = step === 1 ? year : YMAX;
  const stack = {};                 // region → labels so far (stacking)
  const used = new Set();
  // lines first, then dots, then labels on top
  const layer = { ln: [], lab: [] };
  shown.forEach((d) => {
    const h = pt(d.at);
    d.items.forEach((it) => {
      const x = crosses(d, it);
      if (step === 2 && !x) return;   // rule view: only what crossed
      const rg = INGR[it.i], o = pt(REGIONS[rg].at);
      used.add(rg);
      const here = present(d, it, yNow);
      const hidden = step === 0 && it.i === "chilli" && !answered;
      if (hidden) { layer.q = h; return; }
      const cls = !here ? "gone" : x ? "x" : "";
      const cv = curve(h, o);
      const t = step === 1 ? fly : 1;
      const e = at(cv, t);
      // line from the dish to where the ingredient has flown so far
      const n = 16, pts = [];
      for (let k = 0; k <= n; k++) { const q = at(cv, (k / n) * t); pts.push(q.x.toFixed(1) + " " + q.y.toFixed(1)); }
      layer.ln.push(["path", { class: "ln " + cls, d: "M" + pts.join("L") }]);
      layer.ln.push(["circle", { class: "dot " + cls, cx: e.x, cy: e.y, r: x ? 5 : 4 }]);
      if (t < 1) return;
      const key = rg;
      const name = P.t("i_" + it.i);
      if (step === 2) {                // one label per ingredient name per region
        const nm = P.t("i_" + it.i);
        stack[key] = stack[key] || [];
        if (stack[key].includes(nm)) return;
        stack[key].push(nm);
      } else {
        stack[key] = stack[key] || [];
        stack[key].push(name);
      }
      layer.lab.push({ rg, name, cls, k: stack[key].length - 1 });
    });
  });
  layer.ln.forEach(([tag, a]) => Play.svg(tag, a, fig));
  // origin regions
  used.forEach((rg) => {
    const o = pt(REGIONS[rg].at);
    Play.svg("circle", { class: "og", cx: o.x, cy: o.y, r: 4 }, fig);
  });
  // plates (dish homes)
  DISHES.forEach((d) => {
    const h = pt(d.at), on = shown.includes(d);
    if (step === 0 && !on) return;
    const c = Play.svg("circle", { class: "plate" + (on ? " on" : " dim") + (step === 1 ? " hit" : ""), cx: h.x, cy: h.y, r: on ? 8 : 6 }, fig);
    if (step === 1) {
      c.dataset.d = d.id;
      Play.svg("circle", { cx: h.x, cy: h.y, r: 16, fill: "transparent", class: "hit" }, fig).dataset.d = d.id;
    }
  });
  // ingredient labels, stacked under/over each region
  layer.lab.forEach((l) => {
    const o = pt(REGIONS[l.rg].at);
    const below = REGIONS[l.rg].side === "A" || l.rg === "SASIA" || l.rg === "CHINA";
    const anchor = l.rg === "WASIA" || l.rg === "CASIA" ? "end" : "middle";
    const dx = anchor === "start" ? 9 : anchor === "end" ? -9 : 0;
    const y = below ? o.y + 20 + l.k * 16 : o.y - 9 - l.k * 16;
    label(o.x + dx, y, l.name, l.cls, anchor);
  });
  if (wide && step !== 0) used.forEach((rg) => {
    const o = pt(REGIONS[rg].at);
    if (rg === "MESO") label(o.x, o.y - 10, P.t("r_" + rg), "rg");
  });
  if (layer.q) label(layer.q.x, layer.q.y + 42, P.t("chilliQ"), "x");
  // dish labels
  if (step !== 2 || wide) shown.forEach((d) => {
    const h = pt(d.at);
    const s = step === 2 ? P.t("sd_" + d.id) : P.t("d_" + d.id) + " · " + P.t("h_" + d.id);
    const side = d.ls;
    if (side === "s") label(h.x, h.y + 24, s, "home");
    else if (side === "n") label(h.x, h.y - 13, s, "home");
    else if (side === "e") label(h.x + 12, h.y + 5, s, "home", "start");
    else label(h.x - 12, h.y + 5, s, "home", "end");
  });
}

/* ---------- side panel ---------- */
function add(box, cls, txt) { const d = document.createElement("div"); d.className = cls; d.textContent = txt; box.appendChild(d); return d; }
function panel() {
  const box = $("info");
  box.innerHTML = "";
  box.hidden = step === 0;
  if (step === 0) return;
  if (step === 1) {
    const s = stats(dish, year);
    add(box, "gp", P.t("count", { x: s.x, m: s.m }) + " " + P.t("countYear", { y: year, h: s.here, m: s.m }));
    dish.items.forEach((it) => {
      const x = crosses(dish, it), here = present(dish, it, year);
      const r = document.createElement("div");
      r.className = "row" + (!here ? " gone" : x ? " x" : "");
      const dt = document.createElement("span"); dt.className = "d"; r.appendChild(dt);
      const tx = document.createElement("span");
      const b = document.createElement("b"); b.textContent = P.t("i_" + it.i); tx.appendChild(b);
      tx.appendChild(document.createTextNode(" · " + P.t("r_" + INGR[it.i])));
      const w = document.createElement("div"); w.className = "w";
      const f = it.fl ? P.t("f_" + it.fl) : "";
      w.textContent = !x ? P.t("same") : here ? P.t("crossed", { w: P.t("w_" + it.w), f }) : P.t("notYet", { w: P.t("w_" + it.w), f });
      tx.appendChild(w);
      r.appendChild(tx);
      box.appendChild(r);
    });
    add(box, "", P.t("dishNote_" + dish.id));
    if (dish.items.some((it) => it.i === "porkC" || it.i === "porkW")) add(box, "it", P.t("porkNote"));
    add(box, "it", P.t("complete", { y: completeFrom(dish) }) + " " + P.t("firstOnly"));
    return;
  }
  const t = totals(YMAX), t0 = totals(YMIN);
  add(box, "gp", P.t("ruleCount", { n: t.n, x: t.x, m: t.m, p: t.pct, k: t.withX }));
  add(box, "", P.t("ruleYear", { c: t0.complete, n: t0.n }));
  const lists = document.createElement("div"); lists.className = "lists"; box.appendChild(lists);
  [["toWorld", ["maize", "potato", "tomato", "chilli", "sweet", "cacao", "peanut"]], ["toAm", ["wheat", "rice", "sugar", "coffee", "cattle", "horse", "pig"]]].forEach(([h, ks]) => {
    const c = document.createElement("div"); lists.appendChild(c);
    add(c, "h", P.t(h));
    const ul = document.createElement("ul"); c.appendChild(ul);
    ks.forEach((k) => { const li = document.createElement("li"); li.textContent = P.t("l_" + k); ul.appendChild(li); });
  });
  add(box, "it", P.t("sweetNote"));
  add(box, "it", P.t("horseNote"));
  add(box, "it", P.t("nameNote"));
}
function result() {
  const y = step === 1 ? year : YMAX, s = stats(dish, y);
  $("resMain").textContent = P.t(step === 1 ? "resLine" : "resLine0", { d: P.t("d_" + dish.id), x: s.x, m: s.m, y, h: s.here });
  document.querySelector(".result").hidden = step === 0 && !answered;
}
function render() { draw(); panel(); result(); playBtn(); $("yrVal").textContent = P.t("yrVal", { y: year }); }

/* ---------- dish deck ---------- */
const deck = $("deck");
function buildDeck() {
  deck.innerHTML = "";
  add(deck, "lead", P.t("deckLead"));
  DISHES.forEach((d) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (d === dish ? " on" : "");
    b.setAttribute("aria-pressed", d === dish ? "true" : "false");
    b.textContent = P.t("d_" + d.id);
    b.addEventListener("click", () => { pick(d); deck.querySelectorAll("button")[DISHES.indexOf(d)].focus(); });
    deck.appendChild(b);
  });
}
function pick(d) {
  dish = d;
  buildDeck();
  const s = stats(dish, year);
  Play.live($("live"), P.t("liveDish", { d: P.t("d_" + d.id), x: s.x, m: s.m }));
  startFly();
}
function startFly() {
  cancelAnimationFrame(flyRaf);
  if (Play.reduced) { fly = 1; render(); return; }
  fly = 0;
  const t0 = performance.now();
  const go = (t) => {
    fly = Play.clamp((t - t0) / 900, 0, 1);
    fly = 1 - Math.pow(1 - fly, 3);
    render();
    if (fly < 1) flyRaf = requestAnimationFrame(go);
  };
  flyRaf = requestAnimationFrame(go);
}

/* ---------- year slider and playback ---------- */
const yr = $("yr");
function setYear(y, announce) {
  const old = year;
  year = Math.round(Play.clamp(Number.isFinite(y) ? y : YMAX, YMIN, YMAX));
  yr.value = year;
  render();
  if (announce !== false && year !== old) {
    const s = stats(dish, year), t = totals(year);
    Play.live($("live"), P.t("liveYear", { y: year, d: P.t("d_" + dish.id), h: s.here, m: s.m, c: t.complete, n: t.n }));
  }
}
function playBtn() { $("play").textContent = P.t(playing ? "pause" : "play"); }
function setPlaying(on) {
  playing = on;
  cancelAnimationFrame(raf);
  if (on) {
    if (year >= YMAX) setYear(YMIN, false);
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }
  playBtn();
}
function tick(t) {
  const dt = Math.min(100, t - last); last = t;
  setYear(year + dt / 40, false);     // 25 years per second
  if (year >= YMAX) { setPlaying(false); setYear(YMAX); return; }
  raf = requestAnimationFrame(tick);
}
yr.addEventListener("input", () => { setPlaying(false); setYear(+yr.value); });
$("play").addEventListener("click", () => setPlaying(!playing));
fig.addEventListener("keydown", (ev) => {
  if (step !== 1) return;
  const i = DISHES.indexOf(dish);
  if (ev.key === "ArrowRight") { setPlaying(false); setYear(year + 10); }
  else if (ev.key === "ArrowLeft") { setPlaying(false); setYear(year - 10); }
  else if (ev.key === "ArrowDown") pick(DISHES[(i + 1) % DISHES.length]);
  else if (ev.key === "ArrowUp") pick(DISHES[(i + DISHES.length - 1) % DISHES.length]);
  else if (ev.key === "Home") { setPlaying(false); setYear(YMIN); }
  else if (ev.key === "End") { setPlaying(false); setYear(YMAX); }
  else if (ev.key === " " || ev.key === "Enter") setPlaying(!playing);
  else return;
  ev.preventDefault();
});
fig.addEventListener("pointerdown", (ev) => {
  if (step !== 1) return;
  const id = ev.target && ev.target.dataset ? ev.target.dataset.d : undefined;
  const d = DISHES.find((x) => x.id === id);
  if (d && d !== dish) pick(d);
});

function resize() {
  const r = fig.getBoundingClientRect();
  if (r.width < 10) return;
  const w = Math.round(r.width);
  if (w !== W) { W = w; draw(); }
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(fig); else window.addEventListener("resize", resize);

/* ---------- steps and predict ---------- */
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { answered = true; render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  deck.hidden = i !== 1;
  $("ctl").hidden = i !== 1;
  setPlaying(false);
  cancelAnimationFrame(flyRaf); fly = 1;
  if (i === 0) dish = DISHES[0];
  if (i === 1) { buildDeck(); startFly(); }
  Play.live($("live"), "");
  render();
});

$("reset").addEventListener("click", () => {
  setPlaying(false);
  dish = DISHES[0]; answered = false; year = YMAX; yr.value = YMAX;
  pr.reset(); st.go(0);
});
resize();
render();
</script>
</body>
</html>

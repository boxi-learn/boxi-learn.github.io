const P = Play.setup({ en: EN, zh: ZH });
const ZHL = P.lang === "zh";
const $ = (id) => document.getElementById(id);
const byId = {}; SRC.forEach((s) => (byId[s.id] = s));

/* ---------- pure logic ---------- */
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function dayNum(d) { return Date.UTC(d[0], (d[1] || 7) - 1, d[2] || 1) / 864e5; }

function whenCat(days) {

}

}

/* how a claim reads, given the tags we have (null = not yet weighed) */

}
function weightOf(s, t) {

}
function fits(c, e) {

/* corroboration: each line of evidence counts once, with its best fitting member */
function support(e, tags) {

}
function numbers() {                      // every number some source states

const KEY = {}; SRC.forEach((s) => (KEY[s.id] = keyTags(s)));
if (typeof module !== "undefined") module.exports = { SRC, gapDays, gapYears, whenCat, keyTags, points, profile, claimOf, weightOf, fits, support, curve, peaks, numbers, KEY };

/* ---------- state ---------- */
const blankTags = () => { const o = {}; SRC.forEach((s) => (o[s.id] = { who: null, when: null, why: null })); return o; };

let tags = blankTags(), rates = blankRates(), sel = 0, est = 300, answered = false, mode = 0;

/* ---------- text helpers ---------- */

function dateText(d) {

}

}
const nameS = (s) => P.t("nameShort_" + s.id);

/* ---------- source tabs, document, tags ---------- */
const tabsEl = $("tabs"), docWrap = $("docWrap"), tagbox = $("tagbox");
function buildTabs() {

}

function chipRow(label, opts, isOn, onPick, cls) {

function refocus(row, idx) { const b = row && row.querySelectorAll("button")[idx]; if (b) b.focus(); }

/* ---------- death-toll line ---------- */
const fig = $("fig");
let W = 600, H = 250;
const ML = 12, MR = 14, TOPC = 30, BOTC = 84, AX = 98, ROW0 = 126, RH = 30;
const X = (e) => ML + (e / EMAX) * (W - ML - MR);
function textW(s) { let w = 0; for (const ch of s) w += /[⺀-鿿＀-￯]/.test(ch) ? 13 : 7.4; return w; }
function viewTags() { return mode === 2 ? KEY : tags; }
function drawLine() {
  fig.innerHTML = "";
  const S = (tag, a) => Play.svg(tag, a, fig);
  const T = viewTags();
  const showAll = mode > 0 || answered;
  const live = mode > 0;
  H = ROW0 + SRC.length * RH + 6;
  fig.classList.toggle("still", !live);
  // support curve and peak bands
  if (live) {
    const cv = curve(T), pk = peaks(cv), top = Math.max(4.5, pk.m);
    const Y = (v) => BOTC - (v / top) * (BOTC - TOPC);
    pk.bands.forEach(([a, b]) => S("rect", { class: "peak", x: X(a), y: TOPC - 4, width: Math.max(3, X(b) - X(a)), height: AX - TOPC + 4 }));
    let d = `M${X(0)} ${Y(0)}`;
    cv.forEach((v, e) => { d += `L${X(e)} ${Y(v)}`; });
    d += `L${X(EMAX)} ${Y(0)}Z`;
    S("path", { class: "sup", d });
    S("text", { class: "head", x: ML, y: TOPC + 6 }).textContent = ZHL ? "支持度" : "support";
  }
  // axis
  S("line", { class: "axis", x1: X(0), x2: X(EMAX), y1: AX, y2: AX });
  const step = (W - ML - MR) / EMAX * 50 >= 34 ? 50 : 100;
  const dl = ZHL ? "死亡人数" : "deaths", room = X(EMAX) - textW(dl) - 6;
  for (let n = 0; n <= EMAX; n += step) {
    S("line", { class: "grid", x1: X(n), x2: X(n), y1: AX, y2: H - 4 });
    if (X(n) + textW(String(n)) / 2 < room) S("text", { class: "tick", x: X(n), y: AX + 15, "text-anchor": "middle" }).textContent = n;
  }
  S("text", { class: "head", x: X(EMAX), y: AX + 15, "text-anchor": "end" }).textContent = dl;
  // claims
  SRC.forEach((s, i) => {
    if (!showAll && s.id !== "ballad") return;
    const y = ROW0 + i * RH, yl = y + 21, t = T[s.id], c = claimOf(s, t);
    const col = live ? (fits(c, est) ? "fit" : "bad") : "neutral";
    const hol = live && !complete(t) ? " hollow" : "";
    if (c.type === "range") {
      S("line", { class: "mk " + col, x1: X(c.lo), x2: X(c.hi), y1: yl, y2: yl, "stroke-width": 7 });
    } else {
      const x = X(c.v);
      if (c.type === "floor") { S("line", { class: "mk " + col, x1: x, x2: X(EMAX), y1: yl, y2: yl }); S("path", { class: "dotm " + col, d: `M${X(EMAX)} ${yl}l-7 -4v8z` }); }
      if (c.type === "ceiling") { S("line", { class: "mk " + col, x1: X(0), x2: x, y1: yl, y2: yl }); S("path", { class: "dotm " + col, d: `M${X(0)} ${yl}l7 -4v8z` }); }
      if (c.type === "point") S("line", { class: "mk band " + col, x1: X(c.v * (1 - TOL)), x2: X(Math.min(EMAX, c.v * (1 + TOL))), y1: yl, y2: yl, "stroke-width": 7 });
      S("circle", { class: "dotm " + col + hol, cx: x, cy: yl, r: 5 });
    }
    const lab = nameS(s) + " " + claimText(s, t), lw = textW(lab);
    const x0 = c.type === "range" ? X(c.lo) : X(c.v);
    const lx = Play.clamp(x0 - lw / 2, 2, W - lw - 2);
    S("text", { class: "lab", x: lx, y: y + 10 }).textContent = lab;
  });
  // estimate marker
  if (live) {
    const cx = X(est);
    S("line", { class: "cur", x1: cx, x2: cx, y1: 24, y2: H - 4 });
    const lab = (ZHL ? "估计 " : "estimate ") + fmtN(est), lw = textW(lab) + 16;
    const px = Play.clamp(cx - lw / 2, 1, W - lw - 1);
    S("rect", { class: "curPill", x: px, y: 2, width: lw, height: 22, rx: 11 });
    S("text", { class: "curTxt", x: px + lw / 2, y: 18, "text-anchor": "middle" }).textContent = lab;
  }

  fig.style.height = H + "px";
}
function resize() { const r = fig.getBoundingClientRect(); if (r.width < 10) return; W = Math.round(r.width); drawLine(); }

/* ---------- explain panel ---------- */
function addDiv(box, cls, txt) { const d = document.createElement("div"); d.className = cls; d.textContent = txt; box.appendChild(d); return d; }
function reasons(t, qi) {
  const r = [];
  for (const c in CATS) if (t[c]) { const v = PTS[c][t[c]][qi]; if (v) r.push((v > 0 ? "+" : "−") + Math.abs(v) + " " + P.t("t_" + t[c])); }
  return r.length ? r.join(ZHL ? "，" : ", ") : P.t("noPts");
}
function estInfo(box) {
  const T = viewTags(), f = [], b = [];
  SRC.forEach((s) => (fits(claimOf(s, T[s.id]), est) ? f : b).push(nameS(s)));
  const pk = peaks(curve(T));
  addDiv(box, "rg", P.t("ifE", { e: fmtN(est) }));
  addDiv(box, "gp", P.t("fitsL", { list: f.length ? join(f) : P.t("noneL") }));
  if (b.length) addDiv(box, "no", P.t("badL", { list: join(b) }));
  addDiv(box, "", P.t("supL", { s: support(est, T), m: pk.m, bands: pk.bands.map(([a, z]) => P.t("band", { a, b: z })).join(P.t("orL")) }));
  if (complete(T.council)) addDiv(box, "it", P.t("ceilNote", { v: V.c }));
  addDiv(box, "it", P.t("sameLine"));
  if (SRC.some((s) => !complete(T[s.id]))) addDiv(box, "it", P.t("unweighed"));
}
function profTable(withAim) {
  const wrap = $("profWrap"); wrap.innerHTML = "";
  if (mode === 0) return;
  const T = viewTags();
  const h = document.createElement("h3"); h.textContent = P.t("profH"); wrap.appendChild(h);
  const tb = document.createElement("table"); tb.className = "prof";
  const hr = tb.insertRow(); hr.insertCell().outerHTML = "<th></th>";
  const cols = withAim ? QS.concat("qAim") : QS;
  cols.forEach((q) => { const th = document.createElement("th"); th.textContent = P.t(q + "S"); hr.appendChild(th); });
  let k = 0, n = 0;
  SRC.forEach((s) => {
    const tr = tb.insertRow(), t = T[s.id], done = complete(t), pr = done ? profile(t) : null;
    const nm = document.createElement("th"); nm.textContent = nameS(s); tr.appendChild(nm);
    cols.forEach((q, qi) => {
      const td = tr.insertCell();
      if (q === "qAim") { td.className = "l2"; td.textContent = P.t("lv2"); return; }
      const lv = done ? pr[qi] : null, mine = rates[s.id][qi];
      td.className = done ? "l" + lv : "unk";
      td.textContent = done ? P.t("lv" + lv) : P.t("lvU");
      if (mine !== null) {
        const y = document.createElement("span"); y.className = "you";
        let mark = "";
        if (done) { n++; if (mine === lv) { k++; mark = " ✓"; } }
        y.textContent = P.t("you", { v: P.t("lv" + mine) }) + mark;
        td.appendChild(y);
      }
    });
  });
  wrap.appendChild(tb);
  if (n) addDiv(wrap, "note", P.t("agree", { k, n }));
}
function renderInfo() {
  const box = $("info"); box.innerHTML = "";
  if (mode === 0) {
    box.hidden = !answered;
    if (answered) {
      const nm = numbers();
      addDiv(box, "gp", P.t("spread", { r: Play.fmt(nm.max / nm.min, 1) }));
      SRC.forEach((s) => addDiv(box, "", nameS(s) + (ZHL ? "：" : ": ") + claimText(s, null)));
    }
    return;
  }
  box.hidden = false;
  if (mode === 1) {
    const s = SRC[sel], t = tags[s.id];
    addDiv(box, "rg", P.t("name_" + s.id));
    if (complete(t)) {
      const pr = profile(t);
      QS.forEach((q, qi) => addDiv(box, "l" + pr[qi], P.t("verdict", { q: P.t(q), lv: P.t("lv" + pr[qi]) }) + P.t("because", { r: reasons(t, qi) })));
    } else addDiv(box, "it", P.t("h_" + Object.keys(CATS).find((c) => !t[c])));
    const hr = document.createElement("h3"); hr.textContent = P.t("estLabel"); box.appendChild(hr);
  } else addDiv(box, "it", P.t("filled"));

}

/* ---------- render ---------- */
function render() {
  const s = mode === 0 ? byId.ballad : SRC[sel];
  tabsEl.hidden = mode !== 1;
  tagbox.hidden = mode !== 1;
  docWrap.hidden = mode === 2;
  $("aims").hidden = mode !== 2;
  $("ctl").hidden = mode === 0;

  if (mode !== 2) buildDoc(s);

}
function setEst(e) {

  drawLine(); renderInfo(); profTable(mode === 2);
  $("est").value = est;
  const T = viewTags(), f = SRC.filter((x) => fits(claimOf(x, T[x.id]), est)).map(nameS);
  Play.live($("live"), P.t("ifE", { e: est }) + " " + P.t("fitsL", { list: f.length ? join(f) : P.t("noneL") }));
}
$("est").addEventListener("input", () => setEst(+$("est").value));

let dragging = false;
const toE = (ev) => { const r = fig.getBoundingClientRect(); return ((ev.clientX - r.left) / r.width * W - ML) / (W - ML - MR) * EMAX; };
fig.addEventListener("pointerdown", (ev) => {
  if (mode === 0) return;
  dragging = true;
  try { fig.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  setEst(toE(ev));
});
fig.addEventListener("pointermove", (ev) => { if (dragging) setEst(toE(ev)); });
["pointerup", "pointercancel"].forEach((t) => fig.addEventListener(t, () => (dragging = false)));
fig.addEventListener("keydown", (ev) => {
  if (mode === 0) return;
  const d = { ArrowLeft: -1, ArrowRight: 1, ArrowDown: -1, ArrowUp: 1, PageDown: -10, PageUp: 10 }[ev.key];
  if (d) setEst(est + (ev.shiftKey ? d * 10 : d));
  else if (ev.key === "Home") setEst(0);
  else if (ev.key === "End") setEst(EMAX);
  else return;
  ev.preventDefault();
});

const NUM = numbers();
const pr = Play.predict($("predict"), {
  q: P.t("q", V),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", Object.assign({}, V, NUM)),
  wrong: P.t("wrong", Object.assign({}, V, NUM)),
}, () => { answered = true; render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  mode = i;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (i === 2) { SRC.forEach((s) => (tags[s.id] = Object.assign({}, KEY[s.id]))); buildAims(); }
  render();
  resize();
});

$("reset").addEventListener("click", () => {
  tags = blankTags(); rates = blankRates(); sel = 0; est = 300; answered = false;
  for (const k in hints) delete hints[k];
  pr.reset(); st.go(0);
});
</script>
</body>

"use strict";
/* ---- Facts (consensus, see footnote) ---- */
const START = 1450, END = 1500, SACK = 1462, CITED = 250;   // CITED: commonly cited approx. "250+ towns by 1500"
const BISHENG = 11, JIKJI = 1377;
/* ---- Model (illustrative, invented for this page) ----
   N(START) = 1 printing town. Each year N += k·N·(1 − N/CAP), k = K0 × factor of every missing cause.
   Without the trigger there is no press to copy: N = 0 every year. */
const CAP = 400, K0 = 0.14;
const CAUSES = [
  { id: "paper", band: "L", f: 0.4 },
  { id: "readers", band: "L", f: 0.35 },
  { id: "metal", band: "L", f: 0.4 },
  { id: "press", band: "L", f: 0.75 },
  { id: "trade", band: "L", f: 0.6 },
  { id: "gut", band: "T", f: 0 },
  { id: "move", band: "C", f: 0.4 },
  { id: "invest", band: "C", f: 0.6 },
];
const BANDS = ["L", "T", "C", "O"];
const ORDER = ["gut", "paper", "move", "readers", "metal", "invest", "press", "trade"]; // sorting order
/* supported links: [from, to] — "from helped to" */
const LINKS = [["metal", "gut"], ["press", "gut"], ["paper", "out"], ["readers", "out"], ["gut", "out"],
  ["move", "out"], ["invest", "out"], ["trade", "invest"], ["trade", "move"], ["readers", "invest"]];
const byId = Object.fromEntries(CAUSES.map((c) => [c.id, c]));
byId.out = { id: "out", band: "O" };

function model(on) {
  const ys = [];
  if (!on.has("gut")) { for (let y = START; y <= END; y++) ys.push(0); return ys; }
  let k = K0;
  CAUSES.forEach((c) => { if (c.id !== "gut" && !on.has(c.id)) k *= c.f; });
  let n = 1;
  ys.push(n);
  for (let y = START + 1; y <= END; y++) { n += k * n * (1 - n / CAP); n = Play.clamp(n, 0, CAP); ys.push(n); }
  return ys;
}
const last = (on) => Math.round(model(on).at(-1));
const ALL = () => new Set(CAUSES.map((c) => c.id));
function summary() {
  const all = last(ALL());
  const only = last(new Set(["gut"]));
  const without = CAUSES.map((c) => { const s = ALL(); s.delete(c.id); return { id: c.id, n: last(s) }; });
  const rest = without.filter((w) => w.id !== "gut").map((w) => w.n);
  return { all, only, without, lo: Math.min(...rest), hi: Math.max(...rest) };
}

        const k = key(l[0], l[1]);
        if (userLinks.has(k)) { userLinks.delete(k); newLink = null; infoMsg = P.t("linkDel", { a: nm(l[0]), b: nm(l[1]) }); }
        else { userLinks.add(k); newLink = k; infoMsg = P.t("linkAdd", { a: nm(l[0]), b: nm(l[1]), w: P.t("why_" + l[0] + "_" + l[1]) }); }
      }
      Play.live($("live"), infoMsg);
      sel = null;
    }
    render(); focusNode(id); return;
  }
  if (mode === 2 && id !== "out") {
    if (on.has(id)) on.delete(id); else on.add(id);
    Play.live($("live"), P.t(on.has(id) ? "onA" : "offA", { a: nm(id) }) + " " + P.t("modelSays", { n: last(on), e: END, all: SUM.all }));
    render(); focusNode(id); return;
  }
  infoMsg = id === "out" ? "" : P.t("desc_" + id, V);
  render(); focusNode(id);
}
function focusNode(id) { const g = web.querySelector('[data-id="' + id + '"]'); if (g) g.focus(); }
web.addEventListener("click", (ev) => { const g = ev.target.closest(".node"); if (g) pressNode(g.dataset.id); });
web.addEventListener("keydown", (ev) => {
  const g = ev.target.closest && ev.target.closest(".node");
  if (!g) return;
  if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pressNode(g.dataset.id); return; }
  const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key];
  if (!d) return;
  ev.preventDefault();
  const all = [...web.querySelectorAll(".node")];
  const i = all.indexOf(g);
  all[(i + d + all.length) % all.length].focus();
});

/* ---- text panels ---- */
function para(parent, text, tag) { const p = document.createElement(tag || "p"); p.textContent = text; parent.appendChild(p); return p; }
function renderInfo() {
  const box = $("info");
  box.innerHTML = "";
  if (mode === 1 && infoMsg) para(box, infoMsg);
  if (mode === 2) {
    const rm = CAUSES.filter((c) => !on.has(c.id)).map((c) => nm(c.id));
    para(box, rm.length ? P.t("removed", { list: rm.join(zh ? "、" : ", ") }) : P.t("noneRemoved"));
    para(box, P.t("modelSays", { n: last(on), e: END, all: SUM.all }));
  }
  if (mode === 3) {
    para(box, P.t("cautionH"), "h3"); para(box, P.t("caution"));
    para(box, P.t("eastH"), "h3"); para(box, P.t("east", V));
  }
  if (mode === 0 && infoMsg) para(box, infoMsg);
  box.hidden = !box.childNodes.length;
}
function renderResult() {
  const r = $("result");
  r.hidden = mode === 0 && !answered;
  let t, m, n;
  if (mode === 0) { t = P.t("resQ"); m = P.t("resQm"); n = P.t("resQn", V); }
  else if (mode === 1) { t = P.t("resB"); m = P.t("resBm", { s: sorted.size, n: NC, l: userLinks.size, m: NL }); n = P.t("resBn"); }
  else if (mode === 2) { t = P.t("resW", V); m = P.t("resWm", { n: last(on), all: SUM.all }); n = P.t("resWn"); }
  else { t = P.t("resR"); m = P.t("resRm", V); n = P.t("resRn", V); }
  $("resTitle").textContent = t; $("resMain").textContent = m; $("resNote").textContent = n;
}
function render() {
  drawCard(); drawWeb(); drawChart(); renderInfo(); renderResult();
  $("whatif").hidden = mode !== 2;
}
function resize() { const w = $("visual").getBoundingClientRect().width; if (w < 10) return; const nw = Math.floor(Play.clamp(w, 280, 900)); if (nw !== W) { W = nw; drawWeb(); drawChart(); } }
if (window.ResizeObserver) new ResizeObserver(resize).observe($("visual")); else window.addEventListener("resize", resize);

$("allOn").addEventListener("click", () => { on = ALL(); Play.live($("live"), P.t("modelSays", { n: last(on), e: END, all: SUM.all })); render(); });
$("onlyT").addEventListener("click", () => { on = new Set(["gut"]); Play.live($("live"), P.t("modelSays", { n: last(on), e: END, all: SUM.all })); render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q", V),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { answered = true; render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  mode = i; sel = null; newLink = null; infoMsg = "";
  $("kicker").textContent = P.t("k" + (i + 1));
  $("stepTitle").textContent = P.t("t" + (i + 1));
  $("stepBody").textContent = P.t("b" + (i + 1), V);
  $("predict").hidden = i !== 0;
  $("live").textContent = "";
  if (i === 3) on = ALL();
  render(); resize();
});

$("reset").addEventListener("click", () => {
  answered = false; cardI = 0; sortHint = ""; sortBad = false; sorted = new Set(); userLinks = new Set();
  sel = null; on = ALL(); newLink = null; infoMsg = "";
  pr.reset(); st.go(0);
});
</script>
</body>

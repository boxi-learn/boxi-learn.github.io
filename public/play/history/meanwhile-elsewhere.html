  foot: "年代采用通行参考书的说法；「约」表示大约。时间段都经过取整，是大致范围。孔子用传统生卒年。佛陀的年代各家估计从公元前 6 世纪到前 4 世纪不等，图上的模糊带覆盖最常引用的两种（约前 563—前 483、约前 480—前 400）。汉朝中间有新朝（公元 9—23 年）短暂中断。罗马帝国指西部帝国，公元前 27 年—公元 476 年。库施、加纳和美洲各条的年代尤其粗略。某一年某地区没有横条，只说明这份短清单里没有，不说明那里没有人。CC BY-SA 4.0 · Boxi Yu",
};
IT.forEach((e) => { EN["n_" + e.id] = e.en; ZH["n_" + e.id] = e.zh; });
CARDS.forEach((c) => { if (c.en) { EN["n_" + c.id] = c.en; ZH["n_" + c.id] = c.zh; } });
const P = Play.setup({ en: EN, zh: ZH });
const ZHL = P.lang === "zh";
const $ = (id) => document.getElementById(id);
const byId = {}; IT.forEach((e) => (byId[e.id] = e));
CARDS.forEach((c) => { const it = byId[c.id]; c.s = c.s != null ? c.s : it.s; c.e = c.e != null ? c.e : it.e; c.fz = it ? it.fz : 0; c.c = it ? it.c : 0; c.k = it ? it.k : "ev"; c.dt = it ? it.dt : null; });

/* ---------- pure logic ---------- */
function yearText(y) {                        // one historical year
  if (ZHL) return y < 0 ? "公元前 " + -y + " 年" : "公元 " + y + " 年";
  return y < 0 ? -y + " BCE" : y + " CE";
}
function dateText(e) {
  if (e.dt) return P.t(e.dt);
  const s = e.s, t = e.e, c = e.c;
  let r;
  if (ZHL) {
    const p = c ? "约" : "";
    if (s === t) r = p + yearText(s);
    else if (s < 0 && t < 0) r = p + "公元前 " + -s + "—前 " + -t + " 年";
    else if (s > 0) r = p + "公元 " + s + "—" + t + " 年";
    else r = p + "公元前 " + -s + " 年—公元 " + t + " 年";
  } else {
    const p = c ? "c. " : "";
    if (s === t) r = p + yearText(s);
    else if (s < 0 && t < 0) r = p + -s + "–" + -t + " BCE";
    else if (s > 0) r = p + s + "–" + t + " CE";
    else r = p + -s + " BCE – " + t + " CE";
  }
  return e.k === "r" ? P.t("reigned") + r : r;
}
/* 0 = not there in astronomical year a, 1 = there, 2 = maybe (fuzzy dates) */
function aliveAt(e, a) {
  if (!Number.isFinite(a) || a < astro(e.s) || a > astro(e.e)) return 0;
  return e.fz ? 2 : 1;
}
function slice(a) { return LANES.map((_, l) => IT.filter((e) => e.l === l && aliveAt(e, a))); }
/* years two spans share (inclusive), 0 if none */
function overlapYears(p, q) {
  const s = Math.max(astro(p.s), astro(q.s)), t = Math.min(astro(p.e), astro(q.e));
  return t >= s ? t - s : 0;
}
/* card order: -1 a surely first, 1 b surely first, 0 unclear */
function cmpCard(a, b) {
  if (a.hi < b.lo) return -1;
  if (b.hi < a.lo) return 1;
  return 0;
}
function scoreOrder(order) {                  // order: array of cards, first → last
  let k = 0, n = 0;
  for (let i = 0; i < order.length; i++) for (let j = i + 1; j < order.length; j++) {
    const c = cmpCard(order[i], order[j]);
    if (c === 0) continue;
    n++;
    if (c < 0) k++;
  }
  return { k, n };
}
/* greedy row packing inside each lane, people after states */
function pack() {
  const rows = LANES.map(() => []);
  const order = IT.slice().sort((p, q) => (!!p.k - !!q.k) || (p.s - q.s));
  order.forEach((e) => {
    const R = rows[e.l];
    let r = R.findIndex((end) => astro(e.s) >= end);
    if (r < 0) { r = R.length; R.push(0); }
    R[r] = astro(e.e) + 1;
    e.row = r;
  });
  return rows.map((R) => R.length);
}
const NROWS = pack();
if (typeof module !== "undefined") module.exports = { astro, hist, aliveAt, slice, overlapYears, scoreOrder, cmpCard, IT, CARDS, NROWS };

/* ---------- figure ---------- */
const fig = $("fig");
let W = 600, H = 300, mode = "cards";
const A0 = astro(-800), A1 = 1650;            // timeline window, astronomical years
let cur = astro(-500);
const TOP = 30, BOT = 26, RH = 20, LHEAD = 18;
const X = (a) => ((a - A0) / (A1 - A0)) * W;
function textW(s) { let w = 0; for (const ch of s) w += /[⺀-鿿＀-￯]/.test(ch) ? 13 : 7.4; return w; }

const defs = Play.svg("defs", {}, fig);
const grad = Play.svg("linearGradient", { id: "fzg", x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
[[0, 0], [0.25, 0.45], [0.75, 0.45], [1, 0]].forEach(([o, op]) => Play.svg("stop", { class: "fzA", offset: o, "stop-opacity": op }, grad));
const gMain = Play.svg("g", {}, fig);

function laneTops() {
  const tops = []; let y = TOP;
  NROWS.forEach((n) => { tops.push(y); y += LHEAD + n * RH + 6; });
  return { tops, end: y };
}

function drawSlice() {
  gMain.innerHTML = "";
  const L = laneTops();
  H = L.end + BOT;
  // lanes
  LANES.forEach((k, i) => {
    const y = L.tops[i], h = LHEAD + NROWS[i] * RH + 6;
    if (i % 2 === 0) Play.svg("rect", { class: "laneBg", x: 0, y, width: W, height: h }, gMain);
    Play.svg("text", { class: "laneName", x: 6, y: y + 14 }, gMain).textContent = P.t(k);
  });
  // ticks
  const ppy = W / (A1 - A0);
  const need = textW(ZHL ? "前1000" : "1000 BCE") + 14;
  const step = [100, 200, 250, 500, 1000].find((s) => s * ppy >= need) || 1000;
  for (let n = Math.ceil(-800 / step) * step; n <= 1650; n += step) {
    if (n === 0) continue;
    const x = X(astro(n));
    Play.svg("line", { class: "grid", x1: x, x2: x, y1: TOP, y2: L.end }, gMain);
    const s = ZHL ? (n < 0 ? "前" + -n : String(n)) : (n < 0 ? -n + " BCE" : n + " CE");
    const w = textW(s);
    if (x - w / 2 < 2 || x + w / 2 > W - 2) continue;
    Play.svg("text", { class: "tick", x, y: L.end + 17, "text-anchor": "middle" }, gMain).textContent = s;
  }
  // bars
  const rowEnds = {};
  const byStart = IT.slice().sort((p, q) => p.s - q.s);
  byStart.forEach((e) => {
    const x1 = Math.max(0, X(astro(e.s))), x2 = Math.min(W, X(astro(e.e) + 1));
    if (x2 <= 0 || x1 >= W) return;
    const y = L.tops[e.l] + LHEAD + e.row * RH;
    const on = aliveAt(e, cur);
    const w = Math.max(3, x2 - x1);
    if (e.fz) Play.svg("rect", { class: "fz" + (on ? " on" : ""), x: x1, y, width: w, height: RH - 3, rx: 4, fill: "url(#fzg)" }, gMain);
    else Play.svg("rect", { class: "bar" + (e.k ? " p" : "") + (on ? " on" : ""), x: x1, y, width: w, height: RH - 3, rx: 4 }, gMain);
    const name = P.t("n_" + e.id), tw = textW(name);
    const key = e.l + ":" + e.row;
    // label inside the bar if it fits, else in the free space to its right
    const next = IT.filter((o) => o !== e && o.l === e.l && o.row === e.row && o.s > e.s).reduce((m, o) => Math.min(m, X(astro(o.s))), W);
    const room = next - x1 - 4;
    if (tw + 8 <= room && x1 + 4 >= (rowEnds[key] || 0)) {
      Play.svg("text", { class: "inl", x: x1 + 4, y: y + 13 }, gMain).textContent = name;
      rowEnds[key] = x1 + 4 + tw + 6;
    }
  });
  // cursor
  const cx = X(cur + 0.5);
  Play.svg("line", { class: "cur", x1: cx, x2: cx, y1: TOP - 4, y2: L.end }, gMain);
  const lab = yearText(hist(cur)), lw = textW(lab) + 16;
  const px = Play.clamp(cx - lw / 2, 1, W - lw - 1);
  Play.svg("rect", { class: "curPill", x: px, y: 4, width: lw, height: 22, rx: 11 }, gMain);
  Play.svg("text", { class: "curTxt", x: px + lw / 2, y: 20, "text-anchor": "middle" }, gMain).textContent = lab;
  // step 3: the indirect silk link Han → Parthia → Rome
  if (mode === "rule" && aliveAt(byId.han, cur) && aliveAt(byId.rome, cur) && aliveAt(byId.parth, cur)) {
    const yc = (e) => L.tops[e.l] + LHEAD + e.row * RH + (RH - 3) / 2;
    const off = cx > W - 150 ? -22 : 22;
    const pts = [byId.han, byId.parth, byId.rome].map((e) => [cx + off, yc(e)]);
    Play.svg("path", { class: "link", d: `M${cx} ${pts[0][1]}Q${cx + off * 2} ${(pts[0][1] + pts[1][1]) / 2} ${cx} ${pts[1][1]}Q${cx + off * 2} ${(pts[1][1] + pts[2][1]) / 2} ${cx} ${pts[2][1]}` }, gMain);
    // label it in the free strip beside the year pill
    const t = "⋯ " + P.t("hrLink"), tw = textW(t);
    if (px + lw + 8 + tw <= W) Play.svg("text", { class: "linkTxt", x: px + lw + 8, y: 20 }, gMain).textContent = t;
    else if (px - 8 - tw >= 0) Play.svg("text", { class: "linkTxt", x: px - 8 - tw, y: 20 }, gMain).textContent = t;
  }
}

/* ---------- step 1: cards and chapters ---------- */
let picked = [], revealed = false, revT = 0, anim = 0;
const deck = $("deck");
function currentOrder() { return picked.concat(CARDS.filter((c) => !picked.includes(c))); }
function drawCards() {
  gMain.innerHTML = "";
  const rowH = 46, top = 34, n = CARDS.length;
  H = top + n * rowH + 30;
  const t = revT, ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const B0 = astro(-600), B1 = astro(-1);
  const XR = (a) => 8 + ((a - B0) / (B1 - B0)) * (W - 16);
  Play.svg("text", { class: "head", x: 8, y: 18 }, gMain).textContent = P.t(revealed ? "realHead" : "chHead");
  if (revealed) {
    for (let y = -600; y <= -100; y += 100) {
      const x = XR(astro(y));
      Play.svg("line", { class: "grid", x1: x, x2: x, y1: top, y2: top + n * rowH, opacity: ease }, gMain);
      const s = ZHL ? "前" + -y : -y + " BCE";
      if (x + textW(s) / 2 < W - 2 && x - textW(s) / 2 > 2) Play.svg("text", { class: "tick", x, y: top + n * rowH + 18, "text-anchor": "middle", opacity: ease }, gMain).textContent = s;
    }
  }
  const order = currentOrder(), cw = (W - 16) / n;
  order.forEach((c, i) => {
    const y = top + i * rowH;
    const placed = picked.includes(c);
    const cx0 = 8 + i * cw, cw0 = cw - 4;
    const rx1 = XR(astro(c.s)), rw = Math.max(6, XR(astro(c.e) + 1) - rx1);
    const bx = cx0 + (rx1 - cx0) * ease, bw = cw0 + (rw - cw0) * ease;
    if (revealed && t > 0) {
      if (c.fz) Play.svg("rect", { x: bx, y: y + 22, width: bw, height: 16, rx: 4, fill: "url(#fzg)", opacity: ease }, gMain);
      else Play.svg("rect", { class: "chapReal" + (c.k ? "" : " st"), x: bx, y: y + 22, width: bw, height: 16, rx: 4, style: "opacity:" + (0.55 * ease).toFixed(3) }, gMain);
    }
    Play.svg("rect", { class: "chap" + (placed ? "" : " open"), x: bx, y: y + 22, width: bw, height: 16, rx: 4, "fill-opacity": 1 - ease, "stroke-opacity": 1 - 0.7 * ease }, gMain);
    const num = placed ? String(picked.indexOf(c) + 1) : "?";
    const label = P.t("n_" + c.id) + (revealed ? " · " + dateText(c) : "");
    const lw = textW(num) + 6 + textW(label);
    const lx = Play.clamp(bx, 4, W - 4 - lw);
    Play.svg("text", { class: "num", x: lx, y: y + 16 }, gMain).textContent = num;
    Play.svg("text", { class: "lab", x: lx + textW(num) + 6, y: y + 16 }, gMain).textContent = label;
  });
}
function buildDeck() {
  deck.innerHTML = "";
  const lead = document.createElement("div"); lead.className = "lead"; lead.textContent = P.t("deckLead");
  deck.appendChild(lead);
  CARDS.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    const i = picked.indexOf(c);
    b.className = i >= 0 ? "on" : "";
    b.setAttribute("aria-pressed", i >= 0 ? "true" : "false");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i >= 0 ? i + 1 : "·";
    b.append(n, document.createTextNode(" " + P.t("n_" + c.id)));
    b.addEventListener("click", () => {
      const j = picked.indexOf(c);
      if (j >= 0) picked.splice(j, 1); else picked.push(c);
      buildDeck(); deck.querySelectorAll("button")[CARDS.indexOf(c)].focus();
      draw(); cardInfo();
    });
    deck.appendChild(b);
  });
  const clr = document.createElement("button");
  clr.type = "button"; clr.className = "small"; clr.textContent = P.t("clear");
  clr.addEventListener("click", () => { picked = []; buildDeck(); draw(); cardInfo(); });
  deck.appendChild(clr);
}
function trueOrderText() {
  const s = CARDS.slice().sort((a, b) => cmpCard(a, b) || a.lo - b.lo);
  const parts = [];
  for (let i = 0; i < s.length; i++) {
    if (i + 1 < s.length && cmpCard(s[i], s[i + 1]) === 0) {
      parts.push(P.t("unsure", { a: P.t("n_" + s[i].id), b: P.t("n_" + s[i + 1].id) })); i++;
    } else parts.push(P.t("n_" + s[i].id));
  }
  return P.t("trueOrder", { list: parts.join(ZHL ? "，" : ", ") });
}
function cardInfo() {
  const box = $("info");
  box.innerHTML = "";
  box.hidden = !revealed || mode !== "cards";
  if (!revealed) return;
  const add = (cls, txt) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; box.appendChild(d); };
  if (picked.length === CARDS.length) {
    const sc = scoreOrder(picked);
    add("gp", P.t("score", sc));
    add("it", P.t("budNote"));
  } else add("it", P.t("scoreAll"));
  add("", trueOrderText());
}
function reveal() {
  if (revealed) return;
  revealed = true;
  showResult();
  cardInfo();
  cancelAnimationFrame(anim);
  if (Play.reduced) { revT = 1; draw(); return; }
  const t0 = performance.now();
  const f = (t) => {
    revT = Math.min(1, (t - t0) / 1000);
    if (mode === "cards") draw();
    if (revT < 1) anim = requestAnimationFrame(f);
  };
  anim = requestAnimationFrame(f);
}

/* ---------- slice panel ---------- */
const yr = $("yr");
function sliceInfo() {
  const box = $("info");
  box.innerHTML = "";
  box.hidden = mode === "cards";
  if (mode === "cards") return;
  const y = yearText(hist(cur));
  const add = (cls, txt, parent) => { const d = document.createElement(parent ? "span" : "div"); d.className = cls; d.textContent = txt; (parent || box).appendChild(d); return d; };
  if (mode === "rule") {
    add("rg", P.t("hanRome"));
    const g = overlapYears(byId.han, byId.rome);
    add("gp", P.t("overlap", { g }));
    add("calc", dateText({ s: byId.rome.s, e: byId.han.e }) + (ZHL ? "：" : ": ") + -byId.rome.s + " + " + byId.han.e + " − 1 = " + g);
    if (!(aliveAt(byId.han, cur) && aliveAt(byId.rome, cur))) add("it", P.t("noOverlap"));
    add("", P.t("hanRomeB"));
    const h = document.createElement("h3"); h.textContent = P.t("howH"); box.appendChild(h);
    add("", P.t("howB"));
    Play.live($("live"), P.t("countLive", { y, n: slice(cur).filter((x) => x.length).length }));
    return;
  }
  add("rg", P.t("inYear", { y }));
  const sl = slice(cur);
  sl.forEach((list, l) => {
    const d = add("", "");
    add("rg", P.t(LANES[l]) + (ZHL ? "：" : ": "), d);
    if (!list.length) { add("none", P.t("none"), d); return; }
    add("it", list.map((e) => {
      const nm = P.t("n_" + e.id) + " (" + dateText(e) + ")";
      return aliveAt(e, cur) === 2 ? P.t("maybe", { n: nm }) : nm;
    }).join(ZHL ? "；" : "; "), d);
  });
  Play.live($("live"), P.t("countLive", { y, n: sl.filter((x) => x.length).length }));
}
function setYear(a) {
  a = Math.round(Play.clamp(Number.isFinite(a) ? a : astro(-500), A0, A1));
  cur = a;
  yr.value = a;
  $("yrVal").textContent = yearText(hist(a));
  draw(); sliceInfo();
}
yr.addEventListener("input", () => setYear(+yr.value));
document.querySelectorAll("[data-y]").forEach((b) => {
  const y = +b.dataset.y;
  b.textContent = yearText(y);
  b.addEventListener("click", () => setYear(astro(y)));
});

function draw() {
  fig.classList.toggle("cards", mode === "cards");
  if (mode === "cards") drawCards(); else drawSlice();
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  fig.style.height = H + "px";
}
function resize() {
  const r = fig.getBoundingClientRect();
  if (r.width < 10) return;
  W = Math.round(r.width);
  draw();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(fig); else window.addEventListener("resize", resize);

/* ---------- pointer and keyboard on the figure ---------- */
let dragging = false;
const toYear = (ev) => { const r = fig.getBoundingClientRect(); return A0 + ((ev.clientX - r.left) / r.width) * (A1 - A0) - 0.5; };
fig.addEventListener("pointerdown", (ev) => {
  if (mode === "cards") return;
  dragging = true;
  try { fig.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  setYear(toYear(ev));
});
fig.addEventListener("pointermove", (ev) => { if (dragging) setYear(toYear(ev)); });
["pointerup", "pointercancel"].forEach((t) => fig.addEventListener(t, () => (dragging = false)));
fig.addEventListener("keydown", (ev) => {
  if (mode === "cards") return;
  const d = { ArrowLeft: -10, ArrowRight: 10, ArrowDown: -10, ArrowUp: 10, PageDown: -100, PageUp: 100 }[ev.key];
  if (d) setYear(cur + (ev.shiftKey ? d * 10 : d));
  else if (ev.key === "Home") setYear(A0);
  else if (ev.key === "End") setYear(A1);
  else return;
  ev.preventDefault();
});

/* ---------- steps, predict, result ---------- */
const gCS = astro(byId.soc.s) - astro(byId.conf.e);          // Confucius dies → Socrates born
const gQC = astro(byId.caes.s) - astro(-221);                 // Qin unification → Caesar born
const gHR = overlapYears(byId.han, byId.rome);
$("resMain").textContent = P.t("resMain", { g: gHR, d: dateText({ s: byId.rome.s, e: byId.han.e }) });
$("resNote").textContent = P.t("resNote");
function showResult() { document.querySelector(".result").hidden = mode === "cards" && !revealed; }

const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { g: gCS }),
  wrong: P.t("wrong", { g: gCS, q: gQC }),
}, reveal);

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  deck.hidden = i !== 0;
  $("ctl").hidden = i === 0;
  mode = ["cards", "slice", "rule"][i];
  showResult();
  if (i === 2 && !(aliveAt(byId.han, cur) && aliveAt(byId.rome, cur))) cur = astro(100);
  if (i === 0) { Play.live($("live"), ""); cardInfo(); resize(); }
  else setYear(cur);
  resize();
});

$("reset").addEventListener("click", () => {
  cancelAnimationFrame(anim);
  picked = []; revealed = false; revT = 0; cur = astro(-500);
  pr.reset(); buildDeck(); st.go(0);
});
buildDeck();
setYear(cur);
st.go(0);
</script>
</body>

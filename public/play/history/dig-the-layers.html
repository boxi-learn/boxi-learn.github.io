const BND = [

/* ---------- pure logic ---------- */
function layerAt(x, d) { for (let k = 0; k < 6; k++) if (d < BND[k + 1](x)) return LAYERS[k]; return "L6"; }
function home(f, missed) { return missed && (f.c === "P" || f.c === "B") ? layerAt(f.x, f.d) : f.c; }
function ctxs(missed) { return missed ? LAYERS : ORDER; }
function above(c, missed) { return missed ? (c === "L1" ? [] : [LAYERS[LAYERS.indexOf(c) - 1]]) : CTX[c]; }
function findsIn(c, missed) { return FINDS.filter((f) => home(f, missed) === c); }
function own(c, missed) { const ys = findsIn(c, missed).filter((f) => f.y !== null).map((f) => f.y); return ys.length ? Math.max(...ys) : null; }
function eff(c, missed) {          // a part is also no earlier than anything it lies on or cuts into
  let v = own(c, missed);
  ctxs(missed).forEach((o) => { if (above(o, missed).includes(c)) { const e = eff(o, missed); if (e !== null && (v === null || e > v)) v = e; } });
  return v;
}
function canDig(c, dug) { return !dug.has(c) && CTX[c].every((a) => dug.has(a)); }
function blockers(c, dug) { return CTX[c].filter((a) => !dug.has(a)); }
function closure(c) { const s = new Set(); const go = (x) => CTX[x].forEach((a) => { if (!s.has(a)) { s.add(a); go(a); } }); go(c); return s; }
function reducedEdges() {           // keep only direct "lies on / cuts" links (transitive reduction)
  const out = [];
  ORDER.forEach((c) => CTX[c].forEach((a) => { if (!CTX[c].some((b) => b !== a && closure(b).has(a))) out.push([a, c]); }));
  return out;
}
function level(c) { return CTX[c].length ? 1 + Math.max(...CTX[c].map(level)) : 0; }
function hitAt(x, d, holes) {       // which part is under the pointer (holes: dug pit/burrow ignored)
  if (!holes.has("B")) for (let i = 1; i < BUR.length; i++) if (segDist(x, d, BUR[i - 1], BUR[i]) < 0.025) return "B";
  if (!holes.has("P") && inPit(x, d)) return "P";
  return layerAt(x, Play.clamp(d, 0, DMAX));
}
let SX = 300, SY = 1.5;              // px per unit x, px per cm (for hit distances)
function segDist(x, d, a, b) {
  const px = x * SX, py = d * SY, ax = a[0] * SX, ay = a[1] * SY, bx = b[0] * SX, by = b[1] * SY;
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy, t = L ? Play.clamp(((px - ax) * dx + (py - ay) * dy) / L, 0, 1) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy) / SX;
}

/* ---------- formatting ---------- */
const yr = (y) => (y < 0 ? P.t("yBce", { y: -y }) : P.t("yCe", { y }));
const yShort = (f) => (f.y === null ? "" : f.y < 0 ? (ZHL ? "前" + -f.y : -f.y + " BCE") : f.k === "pot" || f.k === "pipe" ? P.t("yC", { y: f.y }) : String(f.y));
const fname = (f) => P.t("f" + f.k, { y: f.y === null ? "" : f.k === "char" ? yr(f.y) : f.y });
const cname = (c) => P.t(c);
const cdesc = (c) => P.t("d" + c);

/* ---------- state ---------- */
let step = 0, guessed = false, dug = new Set(), lastDug = null, msg = "", sel = "L3", missed = false;
let W = 600, H = 460, G = null;

/* ---------- drawing ---------- */
function geom() {
  const SL = W < 480 ? 38 : 48, SR = W - 10, ST = 38, SB = H - 14;
  SX = SR - SL; SY = (SB - ST) / DMAX;
  return { SL, SR, ST, SB, X: (x) => SL + x * (SR - SL), Y: (d) => ST + (d / DMAX) * (SB - ST) };
}
function bandPath(k) {
  const g = G, n = 60;
  let d = "";
  for (let i = 0; i <= n; i++) d += (i ? "L" : "M") + g.X(i / n).toFixed(1) + " " + g.Y(BND[k](i / n)).toFixed(1);
  for (let i = n; i >= 0; i--) d += "L" + g.X(i / n).toFixed(1) + " " + g.Y(BND[k + 1](i / n)).toFixed(1);
  return d + "Z";
}
function pitPath() {
  const g = G, n = 40, a = PIT.c - PIT.hw, b = PIT.c + PIT.hw;
  let d = "";
  for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; d += (i ? "L" : "M") + g.X(x).toFixed(1) + " " + g.Y(BND[1](x)).toFixed(1); }
  for (let i = n; i >= 0; i--) { const x = a + (b - a) * i / n; d += "L" + g.X(x).toFixed(1) + " " + g.Y(pitBot(x)).toFixed(1); }
  return d + "Z";
}
function burPath() { return BUR.map((p, i) => (i ? "L" : "M") + G.X(p[0]).toFixed(1) + " " + G.Y(p[1]).toFixed(1)).join(""); }
function icon(f, cls) {
  const x = G.X(f.x), y = G.Y(f.d), g = S("g", { class: cls || "" });
  if (f.k === "coin") S("circle", { cx: x, cy: y, r: 6, class: "coin" }, g);
  else if (f.k === "pot") S("path", { d: `M${x - 8} ${y - 3}Q${x} ${y + 7} ${x + 8} ${y - 3}L${x + 6} ${y + 3}Q${x} ${y + 9} ${x - 6} ${y + 3}Z`, class: "pot" }, g);
  else if (f.k === "bone") S("rect", { x: x - 9, y: y - 3, width: 18, height: 6, rx: 3, class: "bone" }, g);
  else if (f.k === "flint") S("path", { d: `M${x - 7} ${y + 5}L${x} ${y - 7}L${x + 6} ${y + 5}Z`, class: "flint" }, g);
  else if (f.k === "toy") { S("rect", { x: x - 4, y: y - 3, width: 8, height: 10, rx: 2, class: "toy" }, g); S("circle", { cx: x, cy: y - 6, r: 3.5, class: "toy" }, g); }
  else if (f.k === "bead") S("circle", { cx: x, cy: y, r: 4.5, class: "toy" }, g);
  else if (f.k === "pipe") { S("line", { x1: x - 9, y1: y + 2, x2: x + 4, y2: y + 2, class: "pipe" }, g); S("rect", { x: x + 3, y: y - 6, width: 6, height: 9, rx: 2, class: "pipe" }, g); }
  else if (f.k === "char") S("circle", { cx: x, cy: y, r: 5, class: "char" }, g);
  return g;
}
function tag(x, y, s, cls, warn) {
  const w = s.length * (ZHL ? 13 : 7.4) + 10;
  S("rect", { x: x - w / 2, y: y - 13, width: w, height: 19, rx: 5, class: warn ? "tagW" : "tag" });
  T(x, y + 1, s, cls || "bold", "middle");
}
function layerLabel(k, extra, warn) {
  const g = G, c = LAYERS[k], ym = g.Y((BND[k](0.04) + BND[k + 1](0.04)) / 2);
  T(g.SL + 6, ym + (extra ? -3 : 5), cname(c), "bold");
  if (extra) T(g.SL + 6, ym + 13, extra, warn ? "warnT" : "acc");
}
function drawSection() {
  const g = (G = geom()), mode = ["guess", "dig", "date"][step];
  // depth axis + surface
  for (let d = 0; d <= DMAX; d += 50) { S("line", { class: "lyr", x1: g.SL - 4, x2: g.SL, y1: g.Y(d), y2: g.Y(d) }); T(g.SL - 7, g.Y(d) + 4, String(d), "mut", "end"); }
  T(g.SL - 7, g.ST - 18, P.t("depth"), "mut", "end");
  S("rect", { class: "trench", x: g.SL, y: g.Y(-2), width: g.SR - g.SL, height: g.SB - g.Y(-2) });
  if (!(mode === "dig" && dug.has("L1"))) {
    let d = ""; for (let i = 0; i <= 60; i++) d += (i ? "L" : "M") + g.X(i / 60).toFixed(1) + " " + (g.Y(BND[0](i / 60)) - 1).toFixed(1);
    S("path", { class: "grass", d });
  }
  T(g.SR, g.ST - 18, P.t("surface"), "mut", "end");
  const isDug = (c) => mode === "dig" && dug.has(c);
  LAYERS.forEach((c, k) => { if (!isDug(c)) S("path", { d: bandPath(k), class: "l" + k + " lyr" }); });
  const showCuts = mode === "dig" || (mode === "date" && !missed) || (mode === "guess" && guessed);
  if (showCuts) {
    S("path", { d: pitPath(), class: isDug("P") ? "hole" : "pit" + (mode === "guess" ? " fade" : "") });
    S("path", { d: burPath(), class: isDug("B") ? "holeB" : "bur" });
  }
  // selection outline
  if ((mode === "date" || mode === "dig") && sel && ctxs(mode === "date" && missed).includes(sel) && !isDug(sel)) {
    if (sel === "P") S("path", { d: pitPath(), class: "sel" });
    else if (sel === "B") S("path", { d: burPath(), class: "selB" });
    else S("path", { d: bandPath(LAYERS.indexOf(sel)), class: "sel" });
  }
  // finds
  FINDS.forEach((f) => {
    if (mode === "dig" && dug.has(f.c)) { icon(f, "ghost"); return; }
    icon(f, "");
  });
  // labels
  if (mode === "date") {
    LAYERS.forEach((c, k) => { const o = own(c, missed); layerLabel(k, o === null ? P.t("none") : P.t("ge", { y: yr(o) }), missed && o !== own(c, false)); });
    FINDS.forEach((f) => { if (f.y !== null) T(G.X(f.x) + (f.k === "bead" ? 12 : 0), G.Y(f.d) - (f.k === "bead" ? -4 : 10), yShort(f), "mut", f.k === "bead" ? "start" : "middle"); });
    if (!missed) {
      tag(g.X(PIT.c), g.Y(PIT.bottom + 13), cname("P") + " " + P.t("ge", { y: yr(own("P", false)) }));
      const bt = cname("B") + " " + P.t("ge", { y: yr(own("B", false)) });
      tag(g.X(0.28) + (bt.length * (ZHL ? 13 : 7.4) + 10) / 2, g.Y(26), bt);
    }
  } else {
    LAYERS.forEach((c, k) => { if (!isDug(c)) layerLabel(k); });
    if (mode === "dig") {
      if (!dug.has("P")) tag(g.X(PIT.c), g.Y(100), cname("P"));
      if (!dug.has("B")) tag(g.X(0.40), g.Y(24), cname("B"));
    }
  }
  if (mode === "guess") {
    [KEYCOIN, KEYPOT].forEach((f) => S("circle", { class: "ring", cx: g.X(f.x), cy: g.Y(f.d), r: 12 }));
    const cx = g.X(KEYCOIN.x), cy = g.Y(KEYCOIN.d), px = g.X(KEYPOT.x), py = g.Y(KEYPOT.d);
    const lc = P.t("nCoin") + " · " + P.t("atD", { d: KEYCOIN.d }) + (guessed ? " · " + KEYCOIN.y : "");
    const lp = P.t("nPot") + " · " + P.t("atD", { d: KEYPOT.d }) + (guessed ? " · " + P.t("yC", { y: KEYPOT.y }) : "");
    S("path", { class: "call", d: `M${cx} ${cy + 12}V${cy + 30}` });
    tag(Play.clamp(cx, g.SL + 80, g.SR - 80), cy + 44, lc);
    S("path", { class: "call", d: `M${px} ${py - 12}V${py - 24}` });
    tag(Play.clamp(px, g.SL + 80, g.SR - 80), py - 30, lp);
  }
}
function drawMatrix() {
  const L = 14, R = W - 14, top = 52, rows = 1 + Math.max(...ORDER.map(level)), rh = (H - top - 16) / rows, bh = Math.min(38, rh - 12);
  T(L, 24, P.t("mTitle"), "bold");
  T(R, 24, P.t("mNew"), "mut", "end"); T(R, H - 8, P.t("mOld"), "mut", "end");
  const pos = {};
  for (let r = 0; r < rows; r++) {
    const row = ORDER.filter((c) => level(c) === r), n = row.length, span = Math.min(R - L - 50, n * 230), bw = Math.min(210, (span - (n - 1) * 12) / n);
    row.forEach((c, i) => { const cx = (L + R - 40) / 2 + (i - (n - 1) / 2) * (bw + 12); pos[c] = { x: cx, y: top + r * rh + bh / 2, w: bw }; });
  }
  reducedEdges().forEach(([a, c]) => S("path", { class: "edge", d: `M${pos[a].x} ${pos[a].y + bh / 2}L${pos[c].x} ${pos[c].y - bh / 2}` }));
  ORDER.forEach((c) => {
    const p = pos[c], o = own(c, false), cut = c === "P" || c === "B";
    S("rect", { class: cut ? "boxC" : "box", x: p.x - p.w / 2, y: p.y - bh / 2, width: p.w, height: bh, rx: 8 });
    T(p.x, p.y + 5, cname(c) + " " + (o === null ? "· " + P.t("none") : P.t("ge", { y: yr(o) })), o === null ? "mut" : "bold", "middle");
  });
}
function draw() {
  fig.innerHTML = "";
  fig.classList.toggle("tap", step === 1 || step === 2);
  if (step === 3) drawMatrix(); else drawSection();
}

/* ---------- info panel ---------- */
function line(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("info").appendChild(d); return d; }
function list(fs) {
  const ul = document.createElement("ul");
  fs.slice().sort((a, b) => (b.y ?? -1e9) - (a.y ?? -1e9)).forEach((f) => { const li = document.createElement("li"); li.textContent = fname(f) + " · " + P.t("atD", { d: f.d }); ul.appendChild(li); });
  $("info").appendChild(ul);
}
function nFound() { return FINDS.filter((f) => dug.has(f.c)).length; }
function digButtons() {
  const box = $("ctlDig");
  box.innerHTML = "";
  const can = ORDER.filter((c) => canDig(c, dug));
  if (!can.length) { const s = document.createElement("span"); s.className = "val"; s.textContent = P.t("allDug"); box.appendChild(s); return; }
  can.forEach((c) => { const b = document.createElement("button"); b.type = "button"; b.textContent = P.t("digBtn", { c: cname(c) }); b.addEventListener("click", () => tryDig(c)); box.appendChild(b); });
}
function info() {
  const box = $("info");
  box.innerHTML = "";
  if (step === 1) {
    digButtons();
    line("gp", P.t("progress", { n: dug.size, m: ORDER.length, f: nFound() }));
    if (msg) line(msg.startsWith("!") ? "warn" : "", msg.replace(/^!/, ""));
    if (lastDug && !msg.startsWith("!")) {
      const fs = FINDS.filter((f) => f.c === lastDug);
      if (fs.length) list(fs); else line("dt", P.t("dugNone"));
      if (lastDug === "P") line("dt", P.t("newP"));
      if (lastDug === "B") line("dt", P.t("newB", { y: FINDS.find((f) => f.k === "bead").y, c: cname(layerAt(BUR[BUR.length - 1][0], BUR[BUR.length - 1][1])) }));
    }
    if (dug.size === ORDER.length) line("gp", P.t("allDone"));
  } else if (step === 2) {
    const c = ctxs(missed).includes(sel) ? sel : null;
    if (!c) line("dt", P.t("pick"));
    else {
      line("", P.t("ownList", { c: cname(c), d: cdesc(c) }));
      const fs = findsIn(c, missed), o = own(c, missed);
      if (fs.length) list(fs);
      if (o === null) line("dt", P.t("noDate"));
      else {
        const nf = fs.filter((f) => f.y === o)[0];
        line("gp", P.t("own", { f: fname(nf), y: yr(o) }));
        const ys = fs.filter((f) => f.y !== null).map((f) => f.y);
        if (ys.length > 1 && o - Math.min(...ys) > 0) line("dt", P.t("mixed", { s: o - Math.min(...ys) }));
      }
    }
    if (missed) {
      const bad = LAYERS.filter((x) => own(x, true) !== own(x, false));
      bad.forEach((x) => {
        const pots = findsIn(x, false).filter((f) => f.k === "pot").map((f) => f.y);
        line("warn", P.t("warnMiss", { c: cname(x), y: yr(own(x, true)), p: pots.length ? yr(Math.max(...pots)) : "—" }));
      });
      line("warn", P.t("warnUp", { y: yr(eff("L3", true)) }));
      line("dt", P.t("okMiss"));
    }
  }
  const y3 = own("L3", false);
  $("resMain").textContent = P.t("resMain");
  $("resNote").textContent = P.t("resNote", { y3: yr(y3), dc: KEYCOIN.d, yc: yr(KEYCOIN.y) });
}
function update() { draw(); info(); }

/* ---------- actions ---------- */
function tryDig(c) {
  if (dug.has(c)) { msg = "!" + P.t("already"); update(); return; }
  if (!canDig(c, dug)) {
    const sep = ZHL ? "、" : ", ";
    msg = "!" + P.t("blocked", { list: blockers(c, dug).map(cname).join(sep), c: cname(c) });
    update(); Play.live($("live"), msg.slice(1)); return;
  }
  dug.add(c); lastDug = c; sel = c;
  msg = P.t("dug", { c: cname(c), d: cdesc(c) });
  const next = ORDER.find((x) => canDig(x, dug));
  if (next) sel = next;
  update();
  Play.live($("live"), P.t("liveDig", { c: cname(c), f: nFound() }));
}
function select(c) {
  sel = c; update();
  const o = own(c, missed);
  Play.live($("live"), P.t("liveSel", { c: cname(c), y: o === null ? P.t("none") : P.t("ge", { y: yr(o) }) }));
}
fig.addEventListener("pointerdown", (ev) => {
  if (step !== 1 && step !== 2) return;
  const g = G, p = Play.pointer(fig, ev);
  if (!g || p.x < g.SL || p.x > g.SR || p.y < g.ST - 6 || p.y > g.SB) return;
  const x = (p.x - g.SL) / (g.SR - g.SL), d = ((p.y - g.ST) / (g.SB - g.ST)) * DMAX;
  if (step === 1) {
    const holes = new Set([...dug].filter((c) => c === "P" || c === "B"));
    const c = hitAt(x, d, holes);
    tryDig(c);
  } else {
    const c = missed ? layerAt(x, Play.clamp(d, 0, DMAX)) : hitAt(x, d, new Set());
    select(c);
  }
});
fig.addEventListener("keydown", (ev) => {
  if (step !== 1 && step !== 2) return;
  const list0 = step === 1 ? ORDER.filter((c) => !dug.has(c)) : ctxs(missed);
  if (!list0.length) return;
  let i = list0.indexOf(sel);
  if (ev.key === "ArrowDown" || ev.key === "ArrowRight") i = (i + 1) % list0.length;
  else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") i = (i - 1 + list0.length) % list0.length;
  else if ((ev.key === "Enter" || ev.key === " ") && step === 1) { ev.preventDefault(); if (i >= 0) tryDig(list0[i]); return; }
  else return;
  ev.preventDefault();
  if (i < 0) i = 0;
  if (step === 1) { sel = list0[i]; msg = ""; update(); Play.live($("live"), cname(sel)); } else select(list0[i]);
});
$("missed").addEventListener("change", (e) => { missed = e.target.checked; if (!ctxs(missed).includes(sel)) sel = "L3"; update(); });

/* ---------- predict + steps ---------- */
const pv = { dc: KEYCOIN.d, dp: KEYPOT.d, yc: KEYCOIN.y, yp: KEYPOT.y, gap: KEYCOIN.y - KEYPOT.y };
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", pv), wrong: P.t("wrong", pv),
}, () => { guessed = true; showResult(); if (step === 0) draw(); });
function showResult() { document.querySelector(".result").hidden = step === 0 && !guessed; }

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, pv);
  $("predict").hidden = i !== 0;
  $("info").hidden = i === 0 || i === 3;
  $("ctlDig").hidden = i !== 1;
  $("ctlDate").hidden = i !== 2;
  if (i === 2) sel = "L3";
  if (i === 1) sel = ORDER.find((x) => canDig(x, dug)) || null;
  Play.live($("live"), "");
  showResult();
  resize();
});

function resize() {
  const r = fig.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) { info(); return; }
  W = Math.round(r.width); H = Math.round(r.height);
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  update();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(fig); else window.addEventListener("resize", resize);

$("reset").addEventListener("click", () => {
  guessed = false; dug = new Set(); lastDug = null; msg = ""; sel = "L3"; missed = false;
  $("missed").checked = false;
  pr.reset(); st.go(0);
});
resize();
</script>
</body>
</html>

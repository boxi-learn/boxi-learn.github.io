"use strict";
/* ---- Data: one made-up farming village, four snapshots ---- */
const YEARS = [1300, 1700, 1900, 2000];
const KM = 50;                       // distance to the market town
const SPEED = [5, 5, 40, 70];        // km/h: walking, walking, train (average incl. stops), bus/car — approximate
const BIG_RATIO = 4, SOME_RATIO = 1.5; // travel: time falls ≥4× → big change, ≥1.5× → some change
const HOURS = SPEED.map((v) => KM / v);
const IDS = ["travel", "light", "food", "lang", "fest", "farm", "news"];
/* Page's rough rating of each gap (0 about the same, 1 some change, 2 big change); travel is computed. */
const RATED = { light: [0, 1, 2], food: [1, 0, 1], lang: [1, 1, 1], fest: [0, 0, 1], farm: [0, 1, 2], news: [1, 2, 2] };
const NG = YEARS.length - 1, SPAN = YEARS[NG] - YEARS[0];
function ratioScore(a, b) { const r = b > 0 ? a / b : 1; return r >= BIG_RATIO ? 2 : r >= SOME_RATIO ? 1 : 0; }
function scores(id) {
  if (id === "travel") return YEARS.slice(0, NG).map((_, g) => ratioScore(HOURS[g], HOURS[g + 1]));
  return RATED[id];
}
const firstBig = (id) => { const i = scores(id).indexOf(2); return i < 0 ? NG : i; };   // NG = "no big jump"
const lasted = (id) => YEARS[firstBig(id)] - YEARS[0];                                 // years the 1300 way was still there (at least)
function stats() {
  const gaps = YEARS.slice(0, NG).map((y, g) => {
    const c = [0, 0, 0];
    IDS.forEach((id) => c[scores(id)[g]]++);
    return { from: y, to: YEARS[g + 1], len: YEARS[g + 1] - y, same: c[0], some: c[1], big: c[2] };
  });
  const never = IDS.filter((id) => firstBig(id) === NG);
  return { gaps, never };
}
const ST = stats();

  explainK: "说一说", explainQ: "朋友说：「从前什么都不变，到了近代一下子全变了。」用这块板上的两行——一行变得快、一行几乎没变——来回答他。",
  homeK: "家里做一做", homeQ: "请一位长辈比较他小时候和现在：出行、照明、主食、怎么得到消息、一个家里过的节日。哪些变了很多，哪些没变？",
  foot: "村子是虚构的：一个典型的农村，所在地区 19 世纪通了铁路；真实年代各地差别很大。去 {km} 公里外集镇的时间按近似速度 {sp} 公里/小时计算（步行；步行；火车含停站；汽车或公交）；时间缩短到 1/{br} 以下算大变化，1/{sr} 以下算有些变化。其他各行是本页对卡片的粗略评级。背景（教科书常用年代）：美洲作物（玉米、土豆、红薯）在 16–18 世纪传遍欧洲、非洲和亚洲；东亚印刷早已有几百年，欧洲从 15 世纪 50 年代开始；铁路始于 19 世纪 30 年代；电报 19 世纪 40 年代；煤油灯 19 世纪 50–60 年代；电灯 19 世纪 80 年代先进城市，许多村子到 20 世纪才通电；无线电广播 20 世纪 20 年代；拖拉机在许多国家 20 世纪中期普及到农场。文字：Boxi Yu，CC BY-SA 4.0。",
};
const P = Play.setup({ en: EN, zh: ZH });
const $ = (id) => document.getElementById(id);
const zh = P.lang === "zh";
const SEP = zh ? "、" : ", ";
const nm = (id) => P.t("n_" + id);
const gapName = (g) => (g >= NG ? P.t("none") : P.t("gap", { a: YEARS[g], b: YEARS[g + 1] }));
const G = ST.gaps;
const V = {
  y0: YEARS[0], y1: YEARS[1], n: IDS.length, span: SPAN, km: KM, br: BIG_RATIO, sr: SOME_RATIO,
  z: G[0].same, s: G[0].some, b0: G[0].big, b1: G[1].big, b2: G[2].big, l0: G[0].len, l1: G[1].len, l2: G[2].len,
  nv: ST.never.length, list: ST.never.map(nm).join(SEP), sp: SPEED.join(" / "),
};
$("foot").textContent = P.t("foot", V);
function card(id, k) {
  let s = P.t("c_" + id + "_" + k);
  if (id === "travel") s += " · " + P.t("hours", { h: Play.fmt(HOURS[k], HOURS[k] >= 5 ? 0 : 1), km: KM });
  return s;
}

/* ---- state ---- */
let step = 0, answered = false, checked = false, sel = 0, sorted = false;
const marks = {};               // id -> gap index 0..NG (NG = no big jump)
const nMarked = () => IDS.filter((id) => id in marks).length;
const nRight = () => IDS.filter((id) => marks[id] === firstBig(id)).length;
const order = () => (sorted ? IDS.slice().sort((a, b) => lasted(b) - lasted(a) || IDS.indexOf(a) - IDS.indexOf(b)) : IDS);

/* ---- step 1: 1300 vs 1700 cards ---- */
function drawCmp() {
  const box = $("cmp");
  box.innerHTML = "";
  const el = (cls, txt, parent) => { const d = document.createElement("div"); d.className = cls; d.textContent = txt; (parent || box).appendChild(d); return d; };
  el("yh", YEARS[0]); el("yh", YEARS[1]);
  IDS.forEach((id) => {
    const h = el("sn", "");
    const a = document.createElement("span"); a.textContent = nm(id); h.appendChild(a);
    if (answered) { const sc = scores(id)[0]; const t = document.createElement("span"); t.className = "tag s" + sc; t.textContent = P.t("sc" + sc); h.appendChild(t); }
    el("cc", card(id, 0));
    el("cc" + (answered ? "" : " hid"), answered ? card(id, 1) : P.t("hidden"));
  });
}

/* ---- board: rows on a to-scale timeline (pixel units so text stays 13 px) ---- */
const board = $("board");
let W = 600;
function drawBoard() {
  const reveal = step === 2 || checked;
  const narrow = W < 480;
  const lw = narrow ? 104 : 140, rw = narrow ? 58 : 70, top = 26, rh = 30;
  const x0 = lw, x1 = W - rw - 14;
  const X = (y) => x0 + (y - YEARS[0]) / SPAN * (x1 - x0);
  const ids = order();
  const H = top + ids.length * rh + 6;
  board.setAttribute("viewBox", "0 0 " + W + " " + H);
  board.innerHTML = "";
  YEARS.forEach((y, i) => {
    const anchor = i === 0 || i === NG ? "start" : "end";
    const dx = i === 0 ? -4 : i === NG ? -3 : 3;
    const t = Play.svg("text", { x: X(y) + dx, y: 15, "text-anchor": anchor, class: "yr" }, board); t.textContent = y;
    Play.svg("line", { x1: X(y), x2: X(y), y1: top - 4, y2: H - 4, class: "grid" }, board);
  });
  ids.forEach((id, r) => {
    const yc = top + r * rh + rh / 2, sc = scores(id);
    const g = Play.svg("g", { class: "row" + (step === 1 && IDS[sel] === id ? " sel" : ""), tabindex: step === 0 ? -1 : 0, role: "button", "data-id": id }, board);
    g.setAttribute("aria-label", rowText(id));
    Play.svg("rect", { x: 1, y: yc - rh / 2 + 1, width: W - 2, height: rh - 2, rx: 8, class: "bg" }, g);
    const t = Play.svg("text", { x: 8, y: yc + 4.5 }, g); t.textContent = nm(id);
    Play.svg("line", { x1: x0, x2: x1, y1: yc, y2: yc, class: "trk" }, g);
    if (reveal) sc.forEach((s, k) => Play.svg("line", { x1: X(YEARS[k]) + 6, x2: X(YEARS[k + 1]) - 6, y1: yc, y2: yc, class: "g" + s }, g));
    YEARS.forEach((y) => Play.svg("circle", { cx: X(y), cy: yc, r: 3.5, class: "pt" }, g));
    if (id in marks) {
      const m = marks[id], mx = m >= NG ? x1 + 13 : X((YEARS[m] + YEARS[m + 1]) / 2), s = 6;
      Play.svg("path", { d: `M${mx} ${yc - s} L${mx + s} ${yc} L${mx} ${yc + s} L${mx - s} ${yc} Z`, class: "mk" }, g);
    }
    let right = "", cls = "lst";
    if (step === 2) right = P.t(firstBig(id) === NG ? "lastedNever" : "lastedV", { y: lasted(id) });
    else if (checked && id in marks) { const ok = marks[id] === firstBig(id); right = ok ? "✓" : "✗"; cls = ok ? "ok" : "no"; }
    if (right) { const rt = Play.svg("text", { x: W - 6, y: yc + 4.5, "text-anchor": "end", class: cls }, g); rt.textContent = right; }
  });
}
function rowText(id) {
  const sc = scores(id);
  const parts = sc.map((s, g) => gapName(g) + " " + P.t("sc" + s)).join(SEP);
  if (step === 2 || checked) {
    return firstBig(id) === NG ? P.t("rowNever", { s: nm(id), list: parts, y: SPAN })
      : P.t("rowInfo", { s: nm(id), list: parts, y: lasted(id), y0: YEARS[0] });
  }
  return id in marks ? P.t("marked", { s: nm(id), g: gapName(marks[id]) }) : nm(id);
}
function drawLegend() {
  const lg = $("legend");
  lg.innerHTML = "";
  const items = step === 2 || checked ? [["", "lgSame"], ["s1", "lgSome"], ["s2", "lgBig"]] : [];
  if (step === 1 || nMarked()) items.push(["mk", "lgMark"]);
  items.forEach(([c, k]) => { const s = document.createElement("span"); const w = document.createElement("i"); w.className = "sw " + c; s.append(w, P.t(k)); lg.appendChild(s); });
}

/* ---- step 2 detail: four cards with clickable gaps ---- */
function drawDetail() {
  const id = IDS[sel], tl = $("tl"), sc = scores(id);
  $("dq").textContent = (sel + 1) + "/" + IDS.length + " · " + P.t("q_" + id, V);
  tl.innerHTML = "";
  YEARS.forEach((y, k) => {
    const c = document.createElement("div"); c.className = "cc";
    const b = document.createElement("b"); b.textContent = y;
    const s = document.createElement("span"); s.textContent = card(id, k);
    c.append(b, s); tl.appendChild(c);
    if (k < NG) tl.appendChild(gapButton(id, k, sc[k]));
  });
  const nb = gapButton(id, NG, null); nb.classList.add("nobig"); tl.appendChild(nb);
  $("jump").value = id in marks ? marks[id] : 0;
  $("jump").max = NG;
  $("jumpVal").textContent = id in marks ? gapName(marks[id]) : "—";
  $("progress").textContent = checked ? P.t("checked", { r: nRight(), n: IDS.length }) : P.t("progress", { m: nMarked(), n: IDS.length });
}
function gapButton(id, g, s) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small gapb" + (marks[id] === g ? " on" : "");
  b.setAttribute("aria-pressed", marks[id] === g ? "true" : "false");
  const l = document.createElement("span");
  l.textContent = g >= NG ? P.t("noneLong", V) : P.t("gapLong", { a: YEARS[g], b: YEARS[g + 1], l: YEARS[g + 1] - YEARS[g] });
  b.appendChild(l);
  if (checked && s !== null) { const r = document.createElement("span"); r.className = "rv s" + s; r.textContent = P.t("sc" + s); b.appendChild(r); }
  b.addEventListener("click", () => { setMark(id, g); const again = $("tl").querySelectorAll(".gapb")[g]; if (again) again.focus(); });
  return b;
}
function setMark(id, g) {
  marks[id] = Play.clamp(Math.round(g), 0, NG);
  Play.live($("live"), P.t("marked", { s: nm(id), g: gapName(marks[id]) }));
  render();
}
function pick(i) { sel = (i + IDS.length) % IDS.length; render(); }

/* ---- texts + result ---- */
function render() {
  $("cmpPane").hidden = step !== 0;
  $("boardPane").hidden = step === 0;
  $("detail").hidden = step !== 1;
  $("sortRow").hidden = step !== 2;
  $("predict").hidden = step !== 0;
  $("boardHead").textContent = P.t(step === 2 ? "boardHead3" : "boardHead2", V);
  $("sortBtn").textContent = P.t(sorted ? "sortOrig" : "sortBy");
  $("kicker").textContent = P.t("k" + (step + 1));
  $("stepTitle").textContent = P.t("t" + (step + 1));
  $("stepBody").textContent = P.t("b" + (step + 1), V);
  if (step === 0) drawCmp();
  else { W = Math.max(300, Math.round(board.clientWidth || 600)); drawBoard(); drawLegend(); }
  if (step === 1) drawDetail();
  if (step === 0) { $("resTitle").textContent = P.t("resT1"); $("resMain").textContent = P.t("resM1"); $("resNote").textContent = P.t("resN1"); }
  else if (step === 1) { $("resTitle").textContent = P.t("resT2"); $("resMain").textContent = checked ? P.t("checked", { r: nRight(), n: IDS.length }) : P.t("resM2", { m: nMarked(), n: IDS.length }); $("resNote").textContent = P.t("resN2"); }
  else { $("resTitle").textContent = P.t("resT3"); $("resMain").textContent = P.t("resM3"); $("resNote").textContent = P.t("resN3", V); }
}

const pr = Play.predict($("predict"), {
  q: P.t("q", V),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }],
  right: P.t("right", V), wrong: P.t("wrong", V),
}, () => { answered = true; render(); });
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => { step = i; Play.live($("live"), ""); render(); });

/* ---- input ---- */
function rowFrom(e) { const g = e.target.closest && e.target.closest(".row"); return g ? g.dataset.id : null; }
board.addEventListener("click", (e) => {
  const id = rowFrom(e); if (!id) return;
  if (step === 1) pick(IDS.indexOf(id));
  else if (step === 2) Play.live($("live"), rowText(id));
});
board.addEventListener("keydown", (e) => {
  const id = rowFrom(e); if (!id) return;
  const ids = order(), r = ids.indexOf(id);
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (step === 1) { pick(IDS.indexOf(id)); const b = $("tl").querySelector(".gapb"); if (b) b.focus(); }
    else Play.live($("live"), rowText(id));
  } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const nr = Play.clamp(r + (e.key === "ArrowDown" ? 1 : -1), 0, ids.length - 1);
    if (step === 1) pick(IDS.indexOf(ids[nr]));
    else Play.live($("live"), rowText(ids[nr]));
    const g = board.querySelector('.row[data-id="' + ids[nr] + '"]'); if (g) g.focus();
  }
});
$("prev").addEventListener("click", () => pick(sel - 1));
$("next").addEventListener("click", () => pick(sel + 1));
$("jump").addEventListener("input", (e) => setMark(IDS[sel], +e.target.value));
$("check").addEventListener("click", () => { checked = true; render(); Play.live($("live"), P.t("checked", { r: nRight(), n: IDS.length })); });
$("sortBtn").addEventListener("click", () => { sorted = !sorted; render(); });
$("reset").addEventListener("click", () => {
  answered = false; checked = false; sorted = false; sel = 0;
  IDS.forEach((id) => delete marks[id]);
  pr.reset(); Play.live($("live"), ""); st.go(0);
});
let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (step > 0) render(); }); });
</script>
</body>
</html>

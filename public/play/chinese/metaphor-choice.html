</div>
<script src="../play.js"></script>
<script>
// ---- data (Chinese sentences are original except the two 李白 lines) ----
// Each target has the features a reader could notice; each comparison (vehicle) carries some of them,
// plus features of its own that stay behind. "plain" is the literal sentence that states one feature.
const TARGETS = [
  { id: "moon", zh: "月亮", en: "the moon",
    feats: [["round", "圆", "round"], ["curve", "弯", "curved"], ["bright", "亮", "bright"], ["white", "白", "white"], ["smooth", "光滑", "smooth"], ["sail", "在天上漂", "sails across the sky"]],
    vehicles: [
      { zh: "白玉盘", en: "white jade plate", s: "月亮像一个白玉盘。", g: "The moon is like a white jade plate.", f: ["round", "white", "bright", "smooth"], x: [["盛菜", "holds food"]],
        p: ["月亮是圆的。", "The moon is round."], pf: ["round"], quote: 0 },
      { zh: "镜子", en: "mirror", s: "月亮像一面镜子。", g: "The moon is like a mirror.", f: ["round", "bright", "smooth"], x: [["照出人影", "shows your face"]],
        p: ["月亮是圆的。", "The moon is round."], pf: ["round"], quote: 1 },
      { zh: "小船", en: "little boat", s: "月亮像一只小船。", g: "The moon is like a little boat.", f: ["curve", "sail"], x: [["木头做的", "made of wood"]],
        p: ["月亮是弯的。", "The moon is curved."], pf: ["curve"] },
      { zh: "银钩", en: "silver hook", s: "月亮像一弯银钩。", g: "The moon is like a silver hook.", f: ["curve", "white", "bright"], x: [["能挂东西", "hangs things up"]],
        p: ["月亮是弯的。", "The moon is curved."], pf: ["curve"] },
    ] },
  { id: "cloud", zh: "云", en: "a cloud",
    feats: [["white", "白", "white"], ["soft", "软", "soft"], ["puffy", "蓬松", "puffy"], ["clumps", "一团一团", "in clumps"], ["drift", "慢慢飘", "drifts slowly"]],
    vehicles: [
      { zh: "棉花糖", en: "cotton candy", s: "这朵云像一大团棉花糖。", g: "This cloud is like a big tuft of cotton candy.", f: ["white", "soft", "puffy"], x: [["甜", "sweet"]],
        p: ["这朵云是白的。", "This cloud is white."], pf: ["white"] },
      { zh: "绵羊", en: "sheep", s: "天上的云像一群绵羊。", g: "The clouds are like a flock of sheep.", f: ["white", "puffy", "clumps", "drift"], x: [["会咩咩叫", "say baa"]],
        p: ["天上的云一团一团的。", "The clouds come in clumps."], pf: ["clumps"] },
      { zh: "枕头", en: "pillow", s: "这朵云像一个大枕头。", g: "This cloud is like a big pillow.", f: ["white", "soft"], x: [["放在床上", "lives on a bed"]],
        p: ["这朵云是软的。", "This cloud is soft."], pf: ["soft"] },
    ] },
  { id: "cat", zh: "睡着的猫", en: "a sleeping cat",
    feats: [["roundcat", "圆滚滚", "curled up round"], ["soft", "软", "soft"], ["warm", "暖", "warm"], ["still", "一动不动", "perfectly still"]],
    vehicles: [
      { zh: "毛线", en: "ball of yarn", s: "睡着的猫像一团毛线。", g: "The sleeping cat is like a ball of yarn.", f: ["roundcat", "soft"], x: [["能滚", "rolls away"]],
        p: ["猫蜷成一团睡觉。", "The cat sleeps curled up."], pf: ["roundcat"] },
      { zh: "面包", en: "fresh loaf", s: "睡着的猫像一个刚出炉的面包。", g: "The sleeping cat is like a loaf fresh from the oven.", f: ["roundcat", "soft", "warm"], x: [["能吃", "you can eat it"]],
        p: ["猫睡着了，身上暖暖的。", "The cat is asleep and warm."], pf: ["warm"] },
      { zh: "石头", en: "stone", s: "睡着的猫像一块石头。", g: "The sleeping cat is like a stone.", f: ["roundcat", "still"], x: [["硬", "hard"], ["凉", "cold"]],
        p: ["猫睡着了，一动不动。", "The cat is asleep and doesn't move."], pf: ["still"] },
    ] },
];
const QUOTES = [["小时不识月，呼作白玉盘。", "As a child I didn't know the moon; I called it a white jade plate."],
                ["又疑瑶台镜，飞在青云端。", "Or I wondered if it was the mirror of the fairy terrace, flying at the edge of the blue clouds."]];
// Is it a 比喻? yes = two different kinds of thing that share a feature.
const QUIZ = [
  { s: "草地像一块绿色的地毯。", g: "The lawn is like a green carpet.", yes: true, why: ["草地和地毯是两样东西，都绿、都软、铺开一大片。", "Lawn and carpet are different things that share green, soft and spread-out."] },
  { s: "他长得像他爸爸。", g: "He looks like his dad.", yes: false, why: ["人和人是同一类，这是比较长相，不是比喻。", "Person and person are the same kind: this compares, it isn't a metaphor."] },
  { s: "天好像要下雨了。", g: "It looks like it's going to rain.", yes: false, why: ["「好像」在这里是猜测，没有拿别的东西来比。", "好像 here is a guess; nothing is compared to anything."] },
  { s: "弯弯的月亮是天上的一只小船。", g: "The curved moon is a little boat in the sky.", yes: true, why: ["没有「像」也算：把月亮直接说成了小船。", "No 像, still a metaphor: the moon is simply called a boat."] },
  { s: "妹妹的脸红得像苹果。", g: "My sister's face is as red as an apple.", yes: true, why: ["脸和苹果不同类，借来的是「红、圆」。", "Face and apple are different kinds; it borrows red and round."] },
  { s: "这只小狗好像饿了。", g: "This puppy seems hungry.", yes: false, why: ["又是猜测：小狗大概饿了。", "Another guess: the puppy is probably hungry."] },
  { s: "这个西瓜像那个西瓜一样大。", g: "This watermelon is as big as that one.", yes: false, why: ["西瓜比西瓜，同一类东西比大小。", "Watermelon vs watermelon: same kind, just comparing size."] },
  { s: "树枝上的雪像一团团棉花。", g: "The snow on the branches is like tufts of cotton.", yes: true, why: ["雪和棉花不同类，借来的是「白、软、一团团」。", "Snow and cotton are different kinds; it borrows white, soft, in tufts."] },
];

// ---- pure logic ----
function featsOf(t, v, plain) { return plain ? v.pf.slice() : v.f.slice(); }
function carried(t, list) { const ids = t.feats.map((f) => f[0]); return ids.filter((id) => list.includes(id)); }
function score(t, v, plain) { const k = carried(t, featsOf(t, v, plain)).length, n = t.feats.length; return { k, n, pct: n ? Math.round((100 * k) / n) : 0 }; }
function quizScore(ans) { let right = 0, done = 0; QUIZ.forEach((q, i) => { if (ans[i] === undefined) return; done++; if (ans[i] === q.yes) right++; }); return { right, done, n: QUIZ.length }; }

const P = Play.setup({
  en: {
    title: "Pick the comparison: what does the reader see?", eyebrow: "Chinese · Stage 2",

    k1: "Predict first", t1: "Do these two sentences say the same thing?",

    o1: "Yes — the comparison is just decoration; the plain sentence says the same", o2: "No — the boat lends more: the curve and also sailing across the sky", o3: "No — the plain sentence says more",
    right: "Yes. The plain sentence gives one feature; the boat gives the curve and a picture of the moon sailing. Count them in step 2.",
    wrong: "Check it in step 2: switch the plain sentence on and off and count what the reader gets.",
    k2: "Hands on", t2: "Choose a comparison and see what carries over",
    b2: "Pick what to describe, then a comparison from the tray. The picture shows only what the sentence gives the reader; the chips list the features that carried over. Tick “plain sentence” to swap in the literal version.",
    k3: "Hands on", t3: "Is each sentence a 比喻?",
    b3: "像 does not make a 比喻, and a 比喻 does not need 像. Decide for each sentence: are two different kinds of thing being matched on a shared feature?",
    k4: "The rule", t4: "A comparison lends its features; choosing it is choosing what the reader notices",
    b4: "The thing described is the 本体 (moon); the thing it is compared to is the 喻体 (jade plate, boat). The reader takes the features the two share and leaves the rest behind (nobody puts food on the moon). A different 喻体 lends different features — the plate gives round and bright, the boat a thin curve. The plain sentence gives one.",
    targetL: "Describe:", trayL: "Compare to:", targetAria: "What to describe", trayAria: "What to compare it to", plainL: "plain sentence instead",
    carriedH: "Features the reader sees (filled = carried over):", leftH: "Features of the comparison that stay behind:",
    count: "The reader sees <span class=\"math\">{k} / {n}</span> features.", none: "none",

    thFeat: "features carried", resultTitle: "What we found",

  },

    resultNote: "比喻不是装饰：它一下子把一组特点交给读者，借哪些由喻体决定。同类东西相比、用「好像」猜测，都不是比喻。",
    explainK: "说一说", explainQ: "同学说：「『月亮像小船』就是『月亮是弯的』，比喻只是装饰。」用这页的发现跟他讲讲：小船多给了读者什么？换成「白玉盘」，读者又会看见什么？",
    homeK: "家里做一做", homeQ: "在家里挑一样东西（台灯、拖鞋、枕头……），给它想三个比喻，问家里人每个比喻让他们想到了什么。哪一个最能让人注意到你想让人注意的那一点？",
    foot: "李白（701–762）《古朗月行》开头四句（公有领域，文字依通行本）。本页其余句子和比喻都是原创。各事物的「特点」是为本页简化的模型，读者可能注意到更多。CC BY 4.0 · Boxi Yu",
  },
});
const L = P.lang, $ = (id) => document.getElementById(id), S = Play.svg;
const sep = L === "zh" ? "、" : ", ";
const fname = (t, id) => { const f = t.feats.find((x) => x[0] === id); return L === "zh" ? f[1] : f[2]; };
const listOf = (t, ids) => (ids.length ? ids.map((id) => fname(t, id)).join(sep) : P.t("none"));

let step = 0, ti = 0, vi = 2, plain = false, ti4 = 0, answers = {};

// ---- controls ----
function mkBtn(parent, html, onClick) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.innerHTML = html;
  b.addEventListener("click", onClick);
  parent.appendChild(b);
  return b;
}
const label = (zh, en) => '<span class="han">' + zh + "</span>" + (L === "en" ? '<span class="g">' + en + "</span>" : "");
const tBtns = TARGETS.map((t, i) => mkBtn($("targets"), label(t.zh, t.en), () => { ti = i; vi = 0; render(); }));
const t4Btns = TARGETS.map((t, i) => mkBtn($("targets4"), label(t.zh, t.en), () => { ti4 = i; renderTable(); }));
let vBtns = [];
function buildTray() {
  vBtns.forEach((b) => b.remove());
  vBtns = TARGETS[ti].vehicles.map((v, i) => mkBtn($("tray"), label(v.zh, v.en), () => { vi = i; render(); vBtns[i].focus(); }));
}
$("plain").addEventListener("change", (e) => { plain = e.target.checked; render(); });

// ---- picture: draw the target using only the features the sentence carries ----
function drawPic(t, on) {
  const g = $("pic");
  g.innerHTML = "";
  const has = (id) => on.includes(id);
  S("rect", { x: 0, y: 0, width: 600, height: 300, rx: 14, class: "panel" }, g);
  S("text", { x: 16, y: 26, class: "cap" }, g).textContent = P.t("picCap");
  const cx = 300, cy = 160;
  if (t.id === "moon") {
    [[60, 60], [520, 70], [470, 250], [110, 230], [200, 50]].forEach(([x, y]) => S("circle", { cx: x, cy: y, r: 2.5, class: "star" }, g));
    const r = 72;
    if (has("bright")) [r + 40, r + 22].forEach((rr, i) => S("circle", { cx, cy, r: rr, class: "glow", opacity: i ? 0.22 : 0.12 }, g));
    const fill = has("white") ? "solid" : "outline";
    if (has("round")) S("circle", { cx, cy, r, class: fill }, g);
    else if (has("curve")) S("path", { d: `M${cx} ${cy - r} A${r} ${r} 0 0 0 ${cx} ${cy + r} A${r * 0.5} ${r} 0 0 1 ${cx} ${cy - r}Z`, class: fill, transform: `rotate(-80 ${cx} ${cy})` }, g);
    else { S("circle", { cx, cy, r, class: "dash" }, g); S("text", { x: cx, y: cy + 15, class: "q", "text-anchor": "middle" }, g).textContent = "?"; }
    if (has("smooth")) S("path", { d: has("round") ? `M${cx - 48} ${cy - 20} A52 52 0 0 1 ${cx - 14} ${cy - 50}` : `M${cx - 50} ${cy + 10} A60 60 0 0 1 ${cx - 40} ${cy - 30}`, class: "sheen" }, g);
    if (has("sail")) {
      [[-150, -10, 70], [-140, 20, 90], [-130, 50, 60]].forEach(([dx, dy, w]) => S("path", { d: `M${cx + dx} ${cy + dy} h${w}`, class: "move" }, g));
      S("path", { d: `M${cx - 220} ${cy + 100} q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0`, class: "move", opacity: 0.6 }, g);
    }
  } else if (t.id === "cloud") {
    const spots = has("clumps") ? [[170, 120, 0.7], [330, 180, 0.85], [470, 110, 0.65]] : [[cx, cy, 1.2]];
    const known = on.length > 0;
    if (has("soft")) {
      const f = S("filter", { id: "soft", x: "-20%", y: "-20%", width: "140%", height: "140%" }, g);
      S("feGaussianBlur", { stdDeviation: 3 }, f);
    }
    spots.forEach(([x, y, k]) => {
      const grp = S("g", { transform: `translate(${x} ${y}) scale(${k})` }, g);
      if (has("soft")) grp.setAttribute("filter", "url(#soft)");
      const cls = has("white") ? "solid" : known ? "outline" : "dash";
      if (has("puffy")) [[-50, 10, 34], [-15, -14, 42], [28, -4, 38], [55, 16, 28], [0, 22, 36]].forEach(([dx, dy, r]) => S("circle", { cx: dx, cy: dy, r, class: cls }, grp));
      else S("ellipse", { cx: 0, cy: 8, rx: 90, ry: 36, class: cls }, grp);
      if (has("drift")) [[-130, -6, 40], [-125, 16, 30]].forEach(([dx, dy, w]) => S("path", { d: `M${dx} ${dy} h${w}`, class: "move" }, grp));
    });
    if (!known) S("text", { x: cx, y: cy + 22, class: "q", "text-anchor": "middle" }, g).textContent = "?";
  } else {
    if (has("warm")) [110, 90].forEach((rr, i) => S("circle", { cx, cy: cy + 10, r: rr, class: "glow", opacity: i ? 0.22 : 0.12 }, g));
    if (has("soft")) { const f = S("filter", { id: "fur" }, g); S("feGaussianBlur", { stdDeviation: 2.2 }, f); }
    const cls = has("warm") ? "warm" : on.length ? "outline" : "dash";
    const grp = S("g", {}, g);
    if (has("soft")) grp.setAttribute("filter", "url(#fur)");
    if (has("roundcat")) {
      S("circle", { cx, cy: cy + 10, r: 68, class: cls }, grp);
      S("circle", { cx: cx + 50, cy: cy - 38, r: 30, class: cls }, grp);
      S("path", { d: `M${cx + 30} ${cy - 58} l6 -26 l14 18 Z M${cx + 58} ${cy - 66} l16 -20 l4 26 Z`, class: cls }, grp);
      S("path", { d: `M${cx - 60} ${cy + 40} q40 50 110 26`, class: "outline", "stroke-width": 9 }, grp);
    } else {
      S("ellipse", { cx: cx - 20, cy: cy + 30, rx: 120, ry: 44, class: cls }, grp);
      S("circle", { cx: cx + 110, cy: cy - 4, r: 32, class: cls }, grp);
      S("path", { d: `M${cx + 88} ${cy - 26} l6 -28 l16 18 Z M${cx + 118} ${cy - 34} l16 -22 l6 28 Z`, class: cls }, grp);
      if (!on.length) S("text", { x: cx - 20, y: cy + 44, class: "q", "text-anchor": "middle" }, g).textContent = "?";
    }
    if (has("still")) ["z", "z", "Z"].forEach((z, i) => S("text", { x: cx + 100 + i * 22, y: cy - 70 - i * 20, class: "zz" }, g).textContent = z);
  }
  g.setAttribute("aria-label", P.t("picAria", { t: L === "zh" ? t.zh : t.en, list: listOf(t, on) }));
}

// ---- step 2 render ----
function render() {
  const t = TARGETS[ti], v = t.vehicles[vi];
  tBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === ti ? "true" : "false"));
  if (!vBtns.length || vBtns.length !== t.vehicles.length || vBtns._t !== ti) { buildTray(); vBtns._t = ti; }
  vBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === vi ? "true" : "false"));
  const on = carried(t, featsOf(t, v, plain));
  const sc = score(t, v, plain);
  const sent = $("sent");
  sent.classList.toggle("plain", plain);
  sent.innerHTML = "";
  if (plain) sent.textContent = v.p[0];
  else {
    const i = Math.max(0, v.s.indexOf(v.zh));
    sent.append(document.createTextNode(v.s.slice(0, i)));
    const b = document.createElement("span"); b.className = "v"; b.textContent = v.zh; sent.appendChild(b);
    sent.append(document.createTextNode(v.s.slice(i + v.zh.length)));
  }
  $("sgl").textContent = L === "en" ? (plain ? v.p[1] : v.g) : "";
  const qb = $("quote");
  qb.innerHTML = "";
  if (!plain && v.quote !== undefined) {
    const q = QUOTES[v.quote];
    const h = document.createElement("span"); h.className = "han"; h.textContent = q[0];
    qb.append(h, document.createTextNode(" ——李白《古朗月行》" + (L === "en" ? " · " + q[1] : "")));
  }
  drawPic(t, on);
  $("count").innerHTML = P.t("count", sc);
  const chips = $("chips"); chips.innerHTML = "";
  t.feats.forEach((f) => {
    const c = document.createElement("span");
    c.className = "chip" + (on.includes(f[0]) ? " on" : "");
    c.textContent = L === "zh" ? f[1] : f[1] + " " + f[2];
    chips.appendChild(c);
  });
  const lefts = $("lefts"); lefts.innerHTML = "";
  (plain ? [] : v.x).forEach((x) => {
    const c = document.createElement("span"); c.className = "chip left";
    c.textContent = L === "zh" ? x[0] : x[0] + " " + x[1];
    lefts.appendChild(c);
  });
  if (plain) { const c = document.createElement("span"); c.className = "chip"; c.textContent = P.t("none"); lefts.appendChild(c); }
  if (step === 1) Play.live($("live"), P.t(plain ? "livePlain" : "liveV", { s: plain ? v.p[0] : v.s, list: listOf(t, on), k: sc.k, n: sc.n }));
}

// ---- step 3 ----
function renderQuiz() {
  const ul = $("quiz"); ul.innerHTML = "";
  QUIZ.forEach((q, i) => {
    const li = document.createElement("li");
    const s = document.createElement("div"); s.className = "s han"; s.textContent = q.s; li.appendChild(s);
    if (L === "en") { const gl = document.createElement("div"); gl.className = "gl"; gl.textContent = q.g; li.appendChild(gl); }
    const bt = document.createElement("div"); bt.className = "bt";
    [[true, "yes"], [false, "no"]].forEach(([val, k]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "small"; b.textContent = P.t(k);
      b.setAttribute("aria-pressed", answers[i] === val ? "true" : "false");
      if (answers[i] === val) b.classList.add(val === q.yes ? "right" : "wrong");
      b.addEventListener("click", () => { answers[i] = val; renderQuiz(); ul.querySelectorAll("li")[i].querySelectorAll("button")[val ? 0 : 1].focus(); });
      bt.appendChild(b);
    });
    li.appendChild(bt);
    if (answers[i] !== undefined) {
      const w = document.createElement("div"); w.className = "why";
      w.textContent = (answers[i] === q.yes ? "✓ " : "✗ " + P.t("actually")) + (q.yes ? P.t("yes") : P.t("no")) + (L === "zh" ? "：" : ": ") + (L === "zh" ? q.why[0] : q.why[1]);
      li.appendChild(w);
    }
    ul.appendChild(li);
  });
  const qs = quizScore(answers);
  Play.live($("live"), qs.done ? P.t("quizLive", qs) : "");
}

// ---- step 4: every comparison for one target, plus the plain sentences ----
function renderTable() {
  t4Btns.forEach((b, i) => b.setAttribute("aria-pressed", i === ti4 ? "true" : "false"));
  const t = TARGETS[ti4], tb = $("cmp"); tb.innerHTML = "";
  const rows = t.vehicles.map((v) => ({ w: v.s, f: carried(t, v.f), plain: false }));
  const seen = new Set();
  t.vehicles.forEach((v) => { if (!seen.has(v.p[0])) { seen.add(v.p[0]); rows.push({ w: v.p[0], f: carried(t, v.pf), plain: true }); } });
  rows.forEach((r) => {
    const tr = document.createElement("tr"); if (r.plain) tr.className = "plain";
    const k = r.f.length, n = t.feats.length;
    const td1 = document.createElement("td"); td1.className = "w han"; td1.textContent = r.w;
    const td2 = document.createElement("td"); td2.className = "f"; td2.textContent = listOf(t, r.f);
    const td3 = document.createElement("td"); td3.style.width = "28%";
    const bb = document.createElement("div"); bb.className = "barbox"; const bi = document.createElement("i"); bi.style.width = (n ? (100 * k) / n : 0) + "%"; bb.appendChild(bi); td3.appendChild(bb);
    const td4 = document.createElement("td"); td4.className = "n"; td4.textContent = k + " / " + n;
    tr.append(td1, td2, td3, td4); tb.appendChild(tr);
  });
}

// ---- result line, built from the data ----
function resultLine() {
  const m = TARGETS[0], plate = m.vehicles[0], boat = m.vehicles[2];
  const z = (ids) => ids.map((id) => m.feats.find((f) => f[0] === id)[1]).join("、");
  return "白玉盘 → " + z(carried(m, plate.f)) + "　·　小船 → " + z(carried(m, boat.f)) + "　·　「" + boat.p[0].replace("。", "") + "」→ " + z(carried(m, boat.pf));
}
$("resultMain").textContent = resultLine();

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }], right: P.t("right"), wrong: P.t("wrong"),
});
const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  [1, 2, 3, 4].forEach((n) => ($("v" + n).hidden = n !== k));
  Play.live($("live"), "");
  if (i === 1) render();
  if (i === 2) renderQuiz();
  if (i === 3) renderTable();
});
$("reset").addEventListener("click", () => {
  ti = 0; vi = 2; plain = false; ti4 = 0; answers = {};
  $("plain").checked = false;
  pr.reset();
  render();
  steps.go(0);
});
render();
Play.live($("live"), "");
</script>
</body>
</html>

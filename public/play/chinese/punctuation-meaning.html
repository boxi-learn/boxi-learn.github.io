const MARKS = ["，", "。", "？", "！", "：", "“", "”"];
const ENDS = "。？！", STOPS = "，。？！：";

// ---- pure logic (also tested in node) ----
function parsePat(pat) {
  const gaps = [[""]];
  let chars = "";
  for (let i = 0; i < pat.length; i++) {
    const c = pat[i];
    if (c === "[") {
      const j = pat.indexOf("]", i);
      gaps[gaps.length - 1] = pat.slice(i + 1, j).split("|");
      i = j;
    } else { chars += c; gaps.push([""]); }
  }
  return { chars, gaps, show: assemble(chars, gaps.map((g) => g[0])) };
}
function assemble(chars, marks) {
  let s = marks[0] || "";
  for (let i = 0; i < chars.length; i++) s += chars[i] + (marks[i + 1] || "");
  return s;
}
const emptyMarks = (chars) => new Array(chars.length + 1).fill("");
// Order marks inside one gap: pause/stop marks, then a closing quote, then an opening quote.
const markKey = (m) => (m === "“" ? 2 : m === "”" ? 1 : 0);
function addMark(cur, m) {
  if (cur === m) return "";                        // tap the same single mark again: take it off
  const next = cur.length >= 2 ? m : cur + m;      // at most two marks in a gap (e.g. 。” or ：“)
  return [...next].sort((a, b) => markKey(a) - markKey(b)).join("");
}
// Problems that make a punctuation pattern not a proper sentence.
function problems(chars, marks) {
  const out = [];
  const text = assemble(chars, marks);
  if ([...marks[0]].some((m) => m !== "“")) out.push("start");
  if (marks.some((g) => [...g].filter((m) => STOPS.includes(m)).length > 1 && g !== "？！")) out.push("double");
  let depth = 0, ok = true;
  for (const c of text) {
    if (c === "“") { depth++; if (depth > 1) ok = false; }
    if (c === "”") { depth--; if (depth < 0) ok = false; }
  }
  if (!ok || depth !== 0) out.push("quotes");
  if (!ENDS.includes(text.replace(/”+$/, "").slice(-1))) out.push("noEnd");
  return out;
}
// Split into sentences; kind from the end mark: s = statement, q = question, e = exclamation, n = none.
function sentences(text) {
  const out = [];
  let cur = "";
  for (let i = 0; i < text.length; i++) {
    cur += text[i];
    if (ENDS.includes(text[i])) {
      while (i + 1 < text.length && "？！”".includes(text[i + 1])) cur += text[++i];
      out.push(cur); cur = "";
    }
  }
  if (cur.replace(/[“”，：]/g, "")) out.push(cur);
  return out.map((s) => ({ s, kind: s.includes("？") ? "q" : s.includes("！") ? "e" : s.includes("。") ? "s" : "n" }));
}
// Who speaks the quoted words: the chunk right before "：“" (or "："), else nobody inside the sentence.
function speaker(text) {
  const k = text.indexOf("：");
  if (k < 0) return text.includes("“") ? "?" : "";
  let j = k - 1;
  while (j >= 0 && !"，。？！“”".includes(text[j])) j--;
  return text.slice(j + 1, k);
}
function matchReading(sent, marks) {
  if (problems(sent.chars, marks).length) return -1;
  return sent.R.findIndex((r) => {
    const p = parsePat(r.pat);
    return p.gaps.length === marks.length && p.gaps.every((alts, g) => alts.includes(marks[g]));
  });
}
const strip = (s) => s.replace(/[，。？！：“”]/g, "");

    found: "已找到读法：{k} / {n}", newFound: "找到新读法：{t}。", allFound: "这串字的 {n} 种读法全找到了！",
    folk: "民间故事", own: "本页原创",
    hit: "✓ 做到了：{t}", near: "这是另一种读法：{t}。还不是目标。", keep: "还不对。只改标点试试。", tasksDone: "{n} 个任务全部完成！",
    ruleCount: "{n} 串字 · {r} 种读法 · 去掉标点后字一模一样：{ok} / {r} · 带问号的 {q} 种，不带的 {s} 种。",
    resultTitle: "我们发现", resultMain: "同样的字 + 不同的标点 = 不同的意思",
    resultNote: "标点决定在哪里停、谁在说话、是不是在问。它是意思的一部分，不只是换气。",
    explainK: "说一说", explainQ: "把「小林说我画得最好」写给家人看，一次加 说：“ ”，一次不加。问问他们两次的「我」各是谁，再讲讲为什么会变。",
    homeK: "家里做一做", homeQ: "在纸上写一句不带标点的短句，用便利贴剪出标点，和家人轮流摆。每摆一次读出来——谁能让它说出相反的意思？",
    foot: "标点用法依照国家标准《标点符号用法》（GB/T 15834-2011）：逗号表示句中停顿，句号用于陈述句末，问号用于疑问句末，叹号用于感叹句末，冒号引出要说的话，引号标出直接引用的话。「下雨天留客天留我不留」是民间故事，相传有多种讲法；其余例句均为本页原创。CC BY-SA 4.0 · Boxi Yu",
  },
});
const L = P.lang;
const $ = (id) => document.getElementById(id);
const stripEl = $("strip"), palEl = $("palette"), readout = $("readout"), foundEl = $("found"), rulesEl = $("rules"), fb3 = $("fb3"), liveEl = $("live");
const PARSED = SENTS.map((s) => s.R.map((r) => parsePat(r.pat)));

let step = 0, si = 0, ti = 0, guessed = false, sel = null;
let marks = {}, found = SENTS.map(() => new Set()), solved = new Set();
const key = () => (step === 2 ? "t" + ti : step === 0 ? "g" : "s" + si);
const cur = () => SENTS[step === 2 ? TASKS[ti].s : step === 0 ? 0 : si];
function getMarks() { const k = key(); if (!marks[k]) marks[k] = emptyMarks(cur().chars); return marks[k]; }
function shake(el) { if (!Play.reduced && el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }

// Text with the marks coloured.
function formEl(text, cls) {
  const d = document.createElement("div");
  d.className = cls + " han";
  d.lang = "zh-CN";
  for (const c of text) {
    if (MARKS.includes(c)) { const m = document.createElement("span"); m.className = "m"; m.textContent = c; d.appendChild(m); }
    else d.appendChild(document.createTextNode(c));
  }
  return d;
}
function row(label, value, cls) {
  const d = document.createElement("div");
  d.className = "row" + (cls ? " " + cls : "");
  const b = document.createElement("b");
  b.textContent = label + "：";
  if (L === "en") b.textContent = label + ": ";
  d.append(b, document.createTextNode(value));
  return d;
}

// ---- picker (sentences in step 2, tasks in step 3) ----
function renderPick() {
  const pick = $("pick");
  pick.innerHTML = "";
  const lab = document.createElement("span");
  lab.textContent = P.t(step === 2 ? "taskLabel" : "pickLabel");
  pick.appendChild(lab);
  const list = step === 2 ? TASKS : SENTS;
  list.forEach((x, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "small";
    b.textContent = (step === 2 && solved.has(i) ? "✓ " : "") + (i + 1);
    const on = step === 2 ? i === ti : i === si;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.setAttribute("aria-label", step === 2 ? x.goal[L] : x.chars);
    b.addEventListener("click", () => { if (step === 2) ti = i; else si = i; sel = null; fb3.textContent = ""; render(); });
    pick.appendChild(b);
  });
}

// ---- the strip of characters and gaps ----
function renderStrip(interactive) {
  const s = cur(), m = getMarks();
  stripEl.innerHTML = "";
  // Each unit = [char c][gap after it] (gap 0 joins the first unit), so a mark never wraps to the start of a line.
  const gapBtn = (g) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "gap" + (sel === g && interactive ? " sel" : "");
    b.dataset.g = g;
    b.disabled = !interactive;
    if (m[g]) b.textContent = m[g];
    else { const d = document.createElement("span"); d.className = "dot0"; b.appendChild(d); }
    const left = g ? s.chars[g - 1] : "^", right = g < s.chars.length ? s.chars[g] : "$";
    b.setAttribute("aria-label", left + " | " + right + (m[g] ? " · " + m[g] : ""));
    b.addEventListener("click", () => { sel = g; renderStrip(true); focusGap(g); });
    b.addEventListener("keydown", (e) => onGapKey(e, g));
    return b;
  };
  for (let c = 0; c < s.chars.length; c++) {
    const unit = document.createElement("span");
    unit.className = "unit";
    if (c === 0) unit.appendChild(gapBtn(0));
    const ch = document.createElement("span");
    ch.className = "ch";
    ch.textContent = s.chars[c];
    ch.setAttribute("aria-hidden", "true");
    unit.append(ch, gapBtn(c + 1));
    stripEl.appendChild(unit);
  }
}
function focusGap(g) { const b = stripEl.querySelector('[data-g="' + g + '"]'); if (b) b.focus(); }
function onGapKey(e, g) {
  const n = cur().chars.length;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    sel = Play.clamp(g + (e.key === "ArrowRight" ? 1 : -1), 0, n);
    renderStrip(true); focusGap(sel); e.preventDefault(); return;
  }
  const map = { ",": "，", "，": "，", ".": "。", "。": "。", "?": "？", "？": "？", "!": "！", "！": "！", ":": "：", "：": "：", "“": "“", "”": "”" };
  let mk = map[e.key];
  if (e.key === '"') {
    const text = assemble(cur().chars, getMarks().map((x, i) => (i < g ? x : "")));
    mk = (text.split("“").length - text.split("”").length) > 0 ? "”" : "“";
  }
  if (mk) { sel = g; put(mk); e.preventDefault(); return; }
  if (e.key === "Backspace" || e.key === "Delete") { sel = g; put(""); e.preventDefault(); }
}
// Put a mark (or "" = clear) into the selected gap.
function put(mk) {
  if (sel === null) { fb3.textContent = P.t("pickGap"); shake(stripEl); return; }
  const m = getMarks();
  m[sel] = mk ? addMark(m[sel], mk) : "";
  const g = sel;
  update();
  focusGap(g);
}

function renderPalette() {
  palEl.innerHTML = "";
  MARKS.concat([""]).forEach((mk) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mk" + (mk ? " han" : " clr");
    b.textContent = mk || "⌫";
    b.setAttribute("aria-label", mk || "clear gap");
    // keep the gap selected: don't steal focus on mouse down
    b.addEventListener("mousedown", (e) => e.preventDefault());
    b.addEventListener("click", () => put(mk));
    palEl.appendChild(b);
  });
}

// ---- readout: who speaks, what kind, what it means ----
function renderReadout() {
  const s = cur(), m = getMarks();
  const text = assemble(s.chars, m);
  const sIdx = SENTS.indexOf(s);
  readout.innerHTML = "";
  const lab = document.createElement("div");
  lab.className = "lab";
  lab.textContent = P.t("now") + " · " + P.t(s.folk ? "folk" : "own");
  readout.append(lab, formEl(text, "zh"));
  if (!m.some((x) => x)) {
    readout.appendChild(row(P.t("mean"), P.t("bare")));
    Play.live(liveEl, text);
    return -1;
  }
  const probs = problems(s.chars, m);
  const ri = matchReading(s, m);
  const kinds = sentences(text).map((x) => P.t("k" + x.kind)).join(" + ");
  readout.appendChild(row(P.t("kind"), kinds));
  let who;
  if (ri >= 0) who = s.R[ri].who[L];
  else { const sp = speaker(text); who = sp === "" ? P.t("nobody") : sp === "?" ? P.t("unknown") : P.t("quoted", { w: sp }); }
  readout.appendChild(row(P.t("who"), who));
  let mean;
  if (ri >= 0) mean = s.R[ri].para[L];
  else if (probs.length) mean = probs.map((p) => P.t("p" + p[0].toUpperCase() + p.slice(1))).join(" ");
  else mean = P.t("noMatch");
  readout.appendChild(row(P.t("mean"), mean, ri < 0 && probs.length ? "status no" : ""));
  Play.live(liveEl, text + " — " + mean);
  if (ri >= 0 && step === 1 && !found[sIdx].has(ri)) {
    found[sIdx].add(ri);
    fb3.textContent = found[sIdx].size === s.R.length ? P.t("allFound", { n: s.R.length }) : P.t("newFound", { t: s.R[ri].tag[L] });
  }
  return ri;
}
function renderFound() {
  foundEl.innerHTML = "";
  const s = SENTS[si], f = found[si];
  const lab = document.createElement("span");
  lab.textContent = P.t("found", { k: f.size, n: s.R.length });
  foundEl.appendChild(lab);
  s.R.forEach((r, i) => {
    const c = document.createElement("span");
    c.className = "chip" + (f.has(i) ? " on" : "");
    c.textContent = f.has(i) ? "✓ " + r.tag[L] : "?";
    foundEl.appendChild(c);
  });
}

// ---- step 1: the folk tale, before and after the guess ----
function renderGuess() {
  readout.innerHTML = "";
  const s = SENTS[0];
  const lab = document.createElement("div");
  lab.className = "lab";
  lab.textContent = P.t("folk");
  readout.appendChild(lab);
  if (!guessed) { readout.appendChild(formEl(s.chars, "zh")); return; }
  s.R.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "pair";
    d.append(formEl(PARSED[0][i].show, "form"));
    const p = document.createElement("div");
    p.className = "para";
    p.textContent = r.who[L] + " — " + r.para[L];
    d.appendChild(p);
    readout.appendChild(d);
  });
}

// ---- step 3: challenge ----
function renderTask(ri) {
  const t = TASKS[ti];
  const tg = $("target");
  tg.innerHTML = "";
  const lab = document.createElement("div");
  lab.className = "lab";
  lab.textContent = P.t("taskLabel") + " " + (ti + 1) + " / " + TASKS.length;
  tg.append(lab, document.createTextNode(t.goal[L]));
  const m = getMarks();
  if (!m.some((x) => x)) { fb3.textContent = ""; return; }
  const s = SENTS[t.s];
  if (ri === t.r) {
    const was = solved.size;
    solved.add(ti);
    fb3.textContent = P.t("hit", { t: s.R[ri].tag[L] }) + (solved.size === TASKS.length && was < TASKS.length ? " " + P.t("tasksDone", { n: TASKS.length }) : "");
  } else if (ri >= 0) fb3.textContent = P.t("near", { t: s.R[ri].tag[L] });
  else fb3.textContent = P.t("keep");
}

// ---- step 4: rule ----
function renderRules() {
  rulesEl.innerHTML = "";
  let r = 0, ok = 0, q = 0, s = 0;
  SENTS.forEach((sent, si2) => {
    const d = document.createElement("div");
    d.className = "pair";
    const src = document.createElement("div");
    src.className = "src";
    src.textContent = sent.chars + " · " + P.t(sent.folk ? "folk" : "own");
    d.appendChild(src);
    sent.R.forEach((rd, i) => {
      const show = PARSED[si2][i].show;
      r++;
      if (strip(show) === sent.chars && matchReading(sent, parsePat(rd.pat).gaps.map((g) => g[0])) === i) ok++;
      if (show.includes("？")) q++; else s++;
      d.appendChild(formEl(show, "form"));
      const p = document.createElement("div");
      p.className = "para";
      p.textContent = rd.para[L];
      d.appendChild(p);
    });
    rulesEl.appendChild(d);
  });
  const c = document.createElement("div");
  c.className = "status";
  c.textContent = P.t("ruleCount", { n: SENTS.length, r, ok, q, s });
  rulesEl.appendChild(c);
  Play.live(liveEl, c.textContent);
}

function update() {
  if (step === 0) { renderGuess(); return; }
  if (step === 3) { renderRules(); return; }
  renderStrip(true);
  const ri = renderReadout();
  if (step === 1) renderFound();
  if (step === 2) { renderTask(ri); renderPick(); }
}
function render() {
  const play = step === 1 || step === 2;
  $("pick").hidden = !play;
  $("target").hidden = step !== 2;
  stripEl.hidden = step === 3;
  palEl.hidden = !play;
  $("tools2").hidden = step === 3;
  $("clearAll").hidden = !play;
  readout.hidden = step === 3 || (step === 0 && !guessed);
  foundEl.hidden = step !== 1;
  rulesEl.hidden = step !== 3;
  if (play) renderPick();
  if (step === 0) renderStrip(false);
  update();
}

$("say").addEventListener("click", () => {
  const s = cur();
  Play.speak(step === 0 ? s.chars : assemble(s.chars, getMarks()), "zh-CN");
});
$("clearAll").addEventListener("click", () => { marks[key()] = emptyMarks(cur().chars); fb3.textContent = ""; update(); });

const A = PARSED[0][0].show, B = PARSED[0][1].show;
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { a: A, b: B }), wrong: P.t("wrong", { a: A, b: B }),
}, () => { guessed = true; render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  sel = null;
  fb3.textContent = "";
  render();
});
$("reset").addEventListener("click", () => {
  si = 0; ti = 0; sel = null; guessed = false; marks = {}; found = SENTS.map(() => new Set()); solved = new Set();
  pr.reset(); fb3.textContent = ""; st.go(0);
});
renderPalette();
render();
</script>
</body>
</html>

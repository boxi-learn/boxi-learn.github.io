<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radical families</title>
<link rel="stylesheet" href="../play.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  .han { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif; }
  #fig text { fill: var(--fg); }
  #fig .lab { font-size: 20px; fill: var(--muted); font-family: var(--font); }
  #fig .py { font-size: 22px; font-family: var(--font); }
  #fig .ra { fill: var(--a); }
  #fig .alt { fill: var(--c); }
  #fig .slot { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  #fig .slot.got { stroke: var(--a); stroke-width: 2.5; }
  #fig .box { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
  #fig .arrow { stroke: var(--muted); stroke-width: 2.5; fill: none; }
  .sorter { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .bins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .bin { text-align: left; padding: 8px 9px; min-height: 92px; display: flex; flex-direction: column; gap: 2px; border-radius: 12px; background: var(--soft); border: 2px solid transparent; }
  .bin:hover, .bin.over { border-color: var(--a); }
  .bin.armed { border-style: dashed; border-color: var(--line); }
  .bin.armed:hover, .bin.armed.over { border-style: solid; border-color: var(--a); }
  .bin .hd { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .bin .old { font-size: 26px; color: var(--a); line-height: 1.1; }
  .bin .side { font-size: 24px; color: var(--c); }
  .bin .nm { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .sfb { display: none; margin: 0; font-size: 14px; color: var(--fg); min-height: 1.4em; }
  @media (max-width: 860px) { .sfb { display: block; } }
  .bin .got { font-size: 21px; letter-spacing: .08em; line-height: 1.25; color: var(--fg); overflow-wrap: anywhere; }
  .bin.flash { background: var(--surface); }
  .bin.nope { border-color: var(--no); }
  .trayrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .tray { display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; }
  .tile { touch-action: none; font-size: 26px; width: 50px; height: 50px; padding: 0; display: grid; place-items: center; line-height: 1; }
  .tile[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tile.big { width: 84px; height: 84px; font-size: 52px; }
  .tile.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .ghost { position: fixed; z-index: 9; pointer-events: none; font-size: 40px; color: var(--a); transform: translate(-50%, -60%); }
  .pairs { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 14px 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .pairs button { font-size: 18px; min-width: 52px; }
  .pairs button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .sayrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 2px 0 8px; }
  .gloss { font-size: 15px !important; color: var(--fg) !important; }
  .gloss .big { font-size: 22px; }
  @media (max-width: 560px) {
    .bins { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bin { min-height: 78px; }
    .tile { width: 46px; height: 46px; font-size: 24px; }
  }
</style>
</head>
<body data-subject="chinese">
<div class="play">
  <div class="topline"><span class="eyebrow" data-t="eyebrow"></span><span class="langs"></span></div>
  <h1 data-t="h1"></h1>
  <p class="intro" data-t="intro"></p>

  <div class="navrow">
    <div class="steps" id="steps"></div>
    <div class="tools"><button type="button" class="small" id="reset" data-t="reset"></button></div>
  </div>

  <section class="stage">
    <div class="visual">
      <svg class="main" id="fig" viewBox="0 0 600 360" role="img" data-t-aria="figAria"></svg>
      <div class="pairs" id="pairs" role="group" data-t-aria="pairsLabel"><span data-t="pairsLabel"></span></div>
      <div class="sorter" id="sorter">
        <div class="trayrow"><span id="trayLabel"></span><span id="score"></span></div>
        <div class="tray" id="tray" role="group" data-t-aria="trayAria"></div>
        <div class="bins" id="bins" role="group" data-t-aria="binsLabel"></div>
        <p class="sfb" id="sfb" aria-hidden="true"></p>
      </div>
    </div>
    <div class="explain">
      <div class="kicker" id="kicker"></div>
      <h2 id="stepTitle"></h2>
      <div id="predict"></div>
      <p id="stepBody"></p>
      <p class="gloss" id="gloss"></p>
      <div class="sayrow"><button type="button" class="small" id="say" data-t="say"></button><button type="button" class="small" id="next" data-t="next" hidden></button></div>
      <p class="note" id="live"></p>
    </div>
  </section>

  <div class="result">
    <div><div class="rt" data-t="resultTitle"></div><div class="math han" id="resultMain"></div></div>
    <div class="rn" data-t="resultNote"></div>
  </div>
  <div class="explainit">
    <div><div class="kicker" data-t="explainK"></div><span data-t="explainQ"></span></div>
    <div><div class="kicker" data-t="homeK"></div><span data-t="homeQ"></span></div>
  </div>
  <p class="foot" data-t="foot"></p>
</div>

function tell(text) { Play.live($("live"), text); $("sfb").textContent = text; }
$("resultMain").textContent = P.t("resultMain");

let step = 0, revealed = false, pair = 0, sel = null, last = null;
// sorting state
const placed = new Set(), missed = new Set(), seenCat = new Set();
// test state
let ti = 0, tAnswered = false;
const tFirst = TEST.map(() => null);

function scoreSort() { let k = 0; placed.forEach((i) => { if (!missed.has(i)) k++; }); return k; }
function scoreTest() { return tFirst.filter((x) => x === true).length; }
// Why a drop is wrong: pick the most useful hint.
function wrongMsg(x, binId) {
  if (x.cat === "flesh" && binId === "moon") return P.t("trapMoon", { c: x.c });
  if (x.cat === "moon" && binId === "flesh") return P.t("trapFlesh", { c: x.c, g: glossOf(x) });
  if ((x.cat === "cloth" && binId === "altar") || (x.cat === "altar" && binId === "cloth")) return P.t("trapDots");
  if (x.cat === "jade") return P.t("trapJade");
  return P.t("generic", { cat: catName(binId), c: x.c });
}
function glossLine(x) {
  const g = $("gloss");
  g.textContent = "";
  if (!x) return;
  const b = document.createElement("span"); b.className = "big han"; b.textContent = x.c + " ";
  const p = document.createElement("strong"); p.textContent = x.py;
  g.append(b, p, document.createTextNode((L === "zh" ? "　" : "  ") + x.w + (L === "zh" ? "：" : " — ") + glossOf(x)));
}

// ---- SVG figures (steps 1 and 3) ----
function txt(x, y, s, cls, size, anchor) {
  const t = S("text", { x, y, "text-anchor": anchor || "middle", class: cls || "" }, fig);
  if (size) t.setAttribute("font-size", size);
  t.textContent = s;
  return t;
}
function drawGuess() {
  ["肚", "脸", "腿"].forEach((c, i) => {
    const x = CH.find((y) => y.c === c), cx = 30 + i * 186;
    S("rect", { x: cx, y: 40, width: 168, height: 270, rx: 16, class: "slot" + (revealed ? " got" : "") }, fig);
    txt(cx + 84, 160, c, "han", 104);
    txt(cx + 84, 222, revealed ? x.py + "  " + x.w : P.t("hidden"), "py han");
    txt(cx + 84, 266, revealed ? glossOf(x) : P.t("hidden"), "lab");
  });
}
function drawPair() {
  const pr = PAIRS[pair], n = pr.cols.length, w = 600 / n;
  pr.cols.forEach((col, j) => {
    const x0 = j * w, cx = x0 + w / 2;
    if (j > 0) S("line", { x1: x0, y1: 20, x2: x0, y2: 340, stroke: "var(--line)", "stroke-width": 2 }, fig);
    // old character → squeezed side form
    S("rect", { x: cx - 120, y: 22, width: 96, height: 96, rx: 12, class: "box" }, fig);
    txt(cx - 72, 96, col.old, "han ra", 72);
    S("path", { d: `M${cx - 14} 70 h28 m-9 -8 l9 8 l-9 8`, class: "arrow" }, fig);
    S("rect", { x: cx + 24, y: 22, width: 96, height: 96, rx: 12, class: "box" }, fig);
    txt(cx + 72, 96, col.side, "han " + (j ? "alt" : "ra"), 72);
    const label = col.cat ? catOf(col.cat)[L] : P.t(col.pos === "L" ? "left" : "rightE");
    txt(cx, 156, label, "lab " + (j ? "alt" : "ra"));
    // example characters, each with its pinyin
    const ex = col.ex, gap = Math.min(110, (w - 30) / ex.length);
    ex.forEach((c, i) => {
      const ex0 = cx + (i - (ex.length - 1) / 2) * gap;
      const d = CH.find((y) => y.c === c) || EAR.find((y) => y.c === c);
      txt(ex0, 248, c, "han", 66);
      txt(ex0, 290, d.py, "lab");
      txt(ex0, 322, d.w, "lab han");
    });
  });
}
// 阝 examples (not part of the sorting game). 都 read dū as in 首都.
const EAR = [
  { c: "阶", py: "jiē", w: "台阶" }, { c: "陡", py: "dǒu", w: "陡坡" }, { c: "院", py: "yuàn", w: "院子" },
  { c: "郊", py: "jiāo", w: "郊外" }, { c: "都", py: "dū", w: "首都" }, { c: "邮", py: "yóu", w: "邮局" },
];

// ---- bins and tray (steps 2 and 4) ----
const binBtns = CATS.map((k) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "bin";
  b.dataset.cat = k.id;
  b.innerHTML = '<span class="hd"><span class="old han"></span><span class="side han"></span></span><span class="nm"></span><span class="got han"></span>';
  b.querySelector(".old").textContent = k.old;
  b.querySelector(".nm").textContent = k[L];
  b.addEventListener("click", () => { if (suppress) return; if (sel !== null) drop(sel, k.id); else tell(P.t("idle")); });
  binsEl.appendChild(b);
  return b;
});
function renderBins() {
  binBtns.forEach((b) => {
    const id = b.dataset.cat, k = catOf(id);
    b.querySelector(".side").textContent = seenCat.has(id) && k.side !== k.old ? "→ " + k.side : "";
    b.querySelector(".got").textContent = step === 1 ? CH.filter((x, i) => placed.has(i) && x.cat === id).map((x) => x.c).join("") : "";
    b.classList.toggle("armed", sel !== null);
    b.setAttribute("aria-label", k.old + " " + k[L] + (b.querySelector(".got").textContent ? ": " + b.querySelector(".got").textContent : ""));
  });
}
function renderTray() {
  trayEl.innerHTML = "";
  const items = step === 1 ? ORDER.filter((i) => !placed.has(i)).map((i) => ({ i, x: CH[i] }))
    : (ti < TEST.length ? [{ i: ti, x: TEST[ti] }] : []);
  items.forEach(({ i, x }) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tile han" + (step === 3 ? " big" : "");
    b.dataset.i = i;
    b.textContent = x.c;
    b.setAttribute("aria-label", x.c + " " + x.py);
    b.setAttribute("aria-pressed", sel === i ? "true" : "false");
    b.addEventListener("click", () => {
      if (suppress) return;
      sel = sel === i ? null : i;
      renderTray(); renderBins();
      tell(sel === null ? P.t("idle") : P.t("pickHint", { c: x.c }));
      const nb = trayEl.querySelector(`[data-i="${i}"]`);
      if (nb) nb.focus();
    });
    trayEl.appendChild(b);
  });
  if (step === 1) {
    $("trayLabel").textContent = placed.size === CH.length ? P.t("trayDone") : P.t("trayLeft", { n: CH.length - placed.size });
    $("score").textContent = P.t("score", { k: scoreSort(), n: placed.size });
  } else {
    $("trayLabel").textContent = ti < TEST.length ? P.t("trayTest", { i: ti + 1, n: TEST.length }) : P.t("testDone");
    const done = tFirst.filter((x) => x !== null).length;
    $("score").textContent = P.t("score", { k: scoreTest(), n: done });
  }
}
function flash(binId, ok) {
  const b = binBtns.find((x) => x.dataset.cat === binId);
  if (Play.reduced) return;
  b.classList.add(ok ? "flash" : "nope");
  setTimeout(() => b.classList.remove("flash", "nope"), 450);
}
function drop(i, binId) {
  if (step === 1) {
    const x = CH[i];
    if (x.cat === binId) {
      placed.add(i); seenCat.add(binId); sel = null; last = x;
      glossLine(x);
      let line = P.t("ok", { c: x.c, cat: catName(binId) });
      if (placed.size === CH.length) line += " " + P.t("allDone", { n: CH.length, k: scoreSort() });
      tell(line);
      flash(binId, true);
      renderTray(); renderBins();
      const t = trayEl.querySelector(".tile"); if (t) t.focus();
    } else {
      missed.add(i); sel = null;
      tell(wrongMsg(x, binId));
      flash(binId, false);
      renderTray(); renderBins();
      const t = trayEl.querySelector(`[data-i="${i}"]`);
      if (t && !Play.reduced) { t.classList.add("shake"); setTimeout(() => t.classList.remove("shake"), 320); }
    }
  } else if (step === 3) {
    if (ti >= TEST.length || tAnswered) return;
    const x = TEST[ti], ok = x.cat === binId;
    if (tFirst[ti] === null) tFirst[ti] = ok;
    flash(binId, ok);
    if (ok) {
      tAnswered = true; seenCat.add(binId); sel = null; last = x;
      glossLine(x);
      let line = P.t("ok", { c: x.c, cat: catName(binId) });
      if (ti === TEST.length - 1) line += " " + P.t("testEnd", { k: scoreTest(), n: TEST.length });
      tell(line);
      $("next").hidden = ti === TEST.length - 1;
      if (ti === TEST.length - 1) { ti = TEST.length; }
    } else {
      sel = null;
      tell(wrongMsg(x, binId));
    }
    renderTray(); renderBins();
  }
}
$("next").addEventListener("click", () => {
  if (ti < TEST.length - 1) ti++;
  tAnswered = false; sel = null; $("next").hidden = true;
  $("gloss").textContent = "";
  tell("");
  renderTray(); renderBins();
  const t = trayEl.querySelector(".tile"); if (t) t.focus();
});

// arrow keys move focus inside the tray and inside the family grid
function arrows(box, sel) {
  box.addEventListener("keydown", (e) => {
    const els = [...box.querySelectorAll(sel)];
    const i = els.indexOf(document.activeElement);
    if (i < 0) return;
    const cols = Math.max(1, Math.round(box.clientWidth / (els[0].offsetWidth + 6)));
    const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    if (!d) return;
    e.preventDefault();
    els[Play.clamp(i + d, 0, els.length - 1)].focus();
  });
}
arrows(trayEl, ".tile");
arrows(binsEl, ".bin");

// drag (mouse + touch via pointer events); a tap still goes through the click handlers above
let drag = null, suppress = false;
function binAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest(".bin") : null;
}
trayEl.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".tile");
  if (!b || e.button > 0) return;
  drag = { i: +b.dataset.i, c: b.textContent, x: e.clientX, y: e.clientY, ghost: null, over: null };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
    drag.ghost = document.createElement("div");
    drag.ghost.className = "ghost han";
    drag.ghost.textContent = drag.c;
    document.body.appendChild(drag.ghost);
  }
  if (drag.ghost) {
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top = e.clientY + "px";
    const over = binAt(e.clientX, e.clientY);
    if (over !== drag.over) { if (drag.over) drag.over.classList.remove("over"); if (over) over.classList.add("over"); drag.over = over; }
  }
});
function endDrag(e, cancel) {
  if (!drag) return;
  if (drag.ghost) {
    drag.ghost.remove();
    if (drag.over) drag.over.classList.remove("over");
    suppress = true;
    setTimeout(() => (suppress = false), 0);
    const bin = cancel ? null : binAt(e.clientX, e.clientY);
    if (bin) drop(drag.i, bin.dataset.cat);
  }
  drag = null;
}
window.addEventListener("pointerup", (e) => endDrag(e, false));
window.addEventListener("pointercancel", (e) => endDrag(e, true));

// look-alike buttons (step 3)
const pairBtns = PAIRS.map((pr, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "small han";
  b.textContent = pr.btn;
  b.addEventListener("click", () => { pair = i; draw(); });
  b.addEventListener("keydown", (e) => {
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (!d) return;
    e.preventDefault();
    pair = (pair + d + PAIRS.length) % PAIRS.length;
    draw();
    pairBtns[pair].focus();
  });
  $("pairs").appendChild(b);
  return b;
});

$("say").addEventListener("click", () => {
  let s;
  if (step === 0) s = "肚子，脸，腿";
  else if (step === 2) s = PAIRS[pair].cols.map((c) => c.ex.join("，")).join("；");
  else s = last ? last.w : (step === 3 && ti < TEST.length ? TEST[ti].c : "");
  if (s) Play.speak(s, "zh-CN");
});

function draw() {
  fig.innerHTML = "";
  if (step === 0) drawGuess();
  else if (step === 2) drawPair();
  pairBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === pair ? "true" : "false"));
  if (step === 2) tell(P.t(PAIRS[pair].k));
  if (step === 1 || step === 3) { renderTray(); renderBins(); }
}

const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { revealed = true; draw(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i; sel = null; last = null;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  fig.style.display = i === 0 || i === 2 ? "" : "none";
  $("pairs").hidden = i !== 2;
  $("sorter").hidden = i !== 1 && i !== 3;
  $("next").hidden = !(i === 3 && tAnswered && ti < TEST.length - 1);
  $("gloss").textContent = "";
  tell(i === 1 || i === 3 ? P.t("idle") : "");
  draw();
});

$("reset").addEventListener("click", () => {
  revealed = false; pair = 0; sel = null; last = null; ti = 0; tAnswered = false;
  placed.clear(); missed.clear(); seenCat.clear();
  tFirst.fill(null);
  pr.reset();
  st.go(0);
});
</script>
</body>
</html>

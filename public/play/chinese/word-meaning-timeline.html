<script>
// ---------- data ----------
// Eras (columns of the timeline). Dates: conventional period boundaries.
const ERAS = [
  { zh: "先秦", en: "pre-Qin", full: { zh: "先秦（前 221 年以前）", en: "pre-Qin 先秦 (before 221 BCE)" } },
  { zh: "秦汉", en: "Qin–​Han", full: { zh: "秦汉（前 221–公元 220）", en: "Qin–Han 秦汉 (221 BCE–220 CE)" } },
  { zh: "魏晋南北朝", en: "Wei–​Jin", full: { zh: "魏晋南北朝（220–589）", en: "Wei, Jin & N/S dynasties 魏晋南北朝 (220–589)" } },
  { zh: "隋唐宋", en: "Tang–​Song", full: { zh: "隋唐宋（581–1279）", en: "Sui, Tang & Song 隋唐宋 (581–1279)" } },
  { zh: "元明清", en: "Yuan–​Qing", full: { zh: "元明清（1271–1912）", en: "Yuan, Ming & Qing 元明清 (1271–1912)" } },
  { zh: "现代", en: "today", full: { zh: "现代（20 世纪至今）", en: "today 现代 (20th century on)" } },
];
// Sentence markup: {x} = the word being asked about, [x] = the words that prove its meaning.
// py: one syllable per Han character, in order (punctuation has none).
// lv: rough commonness in writing of each era, 0 = not (yet / any more) in normal use … 3 = the main meaning. Approximate.
const WORDS = [
  { w: "走", py: "zǒu",
    m: [{ zh: "跑", py: "pǎo", en: "run", lv: [3, 3, 3, 2, 1, 0] }, { zh: "行走", py: "xíngzǒu", en: "walk", lv: [0, 0, 0, 1, 3, 3] }],
    alive: { zh: "奔走、不胫而走", en: "奔走 bēnzǒu 'rush about', 不胫而走 'runs off without legs' (news spreading)" },
    c: { s: "宋人有耕者，田中有株，兔{走}[触株]，[折颈而死]。", py: "sòng rén yǒu gēng zhě tián zhōng yǒu zhū tù zǒu chù zhū zhé jǐng ér sǐ",
      src: { zh: "《韩非子·五蠹》", en: "Han Feizi, 'Five Vermin' 《韩非子·五蠹》" }, era: 0,
      why: { zh: "「触株」是撞上树桩，「折颈而死」是折断脖子死了——慢慢走可撞不断脖子。兔子是在跑：这里的「走」= 跑。",
        en: "触株 'crashed into the stump' and 折颈而死 'broke its neck and died': a walking rabbit does not break its neck. It was running, so 走 here means run." },
      tr: { zh: "宋国有个种田的人，田里有个树桩。一只兔子跑来撞在树桩上，折断脖子死了。", en: "A farmer of Song had a tree stump in his field. A rabbit ran into the stump, broke its neck and died." } } },
  { w: "去", py: "qù",
    m: [{ zh: "离开", py: "líkāi", en: "leave", lv: [3, 3, 3, 2, 1, 0] }, { zh: "前往", py: "qiánwǎng", en: "go to", lv: [0, 0, 1, 2, 3, 3] }],
    alive: { zh: "去世、拂袖而去", en: "去世 qùshì 'leave the world' (die), 拂袖而去 'sweep out of the room'" },
    c: { s: "[城]非不高也，池非不深也……[委]而{去}[之]", py: "chéng fēi bù gāo yě chí fēi bù shēn yě wěi ér qù zhī",
      src: { zh: "《孟子·公孙丑下》", en: "Mencius, Gongsun Chou II 《孟子·公孙丑下》" }, era: 0,
      why: { zh: "「委」是丢下，「之」指他们正在守的城。人本来就在城里，谈不上「前往」它——是丢下城离开了。「去」= 离开。",
        en: "委 means 'abandon', and 之 'it' is the city they were defending. You can't 'go to' a city you are already standing in: they abandoned it and left. 去 = leave." },
      tr: { zh: "不是城墙不高，不是护城河不深……可守城的人还是丢下城离开了。", en: "It is not that the walls are not high or the moat not deep… yet they abandon the city and leave it." } } },
  { w: "汤", py: "tāng",
    m: [{ zh: "热水", py: "rèshuǐ", en: "hot water", lv: [3, 3, 3, 2, 1, 0] }, { zh: "菜汤", py: "càitāng", en: "soup", lv: [0, 0, 1, 2, 3, 3] }],
    alive: { zh: "赴汤蹈火", en: "赴汤蹈火 fù tāng dǎo huǒ 'rush into boiling water, tread on fire'" },
    c: { s: "日初出[沧沧凉凉]，及其日中如[探]{汤}", py: "rì chū chū cāng cāng liáng liáng jí qí rì zhōng rú tàn tāng",
      src: { zh: "《列子·汤问》", en: "Liezi, 'Questions of Tang' 《列子·汤问》" }, era: 2,
      why: { zh: "小孩拿早上的「沧沧凉凉」和中午比，争的是冷热：中午像「探汤」——把手伸进热水里。（上古说菜汤，一般用「羹」。）",
        en: "The child contrasts the morning, 沧沧凉凉 'cool and chilly', with noon. The argument is about heat: at noon it is like 探汤, 'putting your hand into hot water'. (In early texts soup was usually 羹 gēng.)" },
      tr: { zh: "太阳刚出来时清清凉凉，到了中午就像把手伸进热水里。", en: "When the sun first rises it is cool and chilly; at noon it is like putting your hand into hot water." } } },
  { w: "涕", py: "tì",
    m: [{ zh: "眼泪", py: "yǎnlèi", en: "tears", lv: [3, 3, 2, 2, 1, 0] }, { zh: "鼻涕", py: "bítì", en: "nasal mucus", lv: [0, 1, 2, 2, 3, 3] }],
    alive: { zh: "感激涕零、痛哭流涕", en: "感激涕零 'so grateful the tears fall', 痛哭流涕 'weep bitterly'" },
    c: { s: "临表{涕}[零]，[不知所言]。", py: "lín biǎo tì líng bù zhī suǒ yán",
      src: { zh: "诸葛亮《出师表》（三国）", en: "Zhuge Liang, 'Memorial on Sending Out the Troops' 《出师表》 (Three Kingdoms)" }, era: 2,
      why: { zh: "「零」是像雨点一样落下，「不知所言」说明他激动得不知说了什么。激动时落下的是眼泪——「涕」= 眼泪。",
        en: "零 means 'fall like raindrops', and 不知所言 'I don't know what I am saying' shows how moved he is. What falls when you are moved is tears: 涕 = tears." },
      tr: { zh: "面对这份奏表，我泪落不止，不知道说了些什么。", en: "Facing this memorial, my tears fall, and I do not know what I am saying." } } },
  { w: "兵", py: "bīng",
    m: [{ zh: "兵器", py: "bīngqì", en: "weapon", lv: [3, 2, 2, 1, 1, 1] }, { zh: "士兵", py: "shìbīng", en: "soldier", lv: [1, 2, 3, 3, 3, 3] }],
    alive: { zh: "兵器、短兵相接", en: "兵器 bīngqì 'weapon', 短兵相接 'fight hand to hand' (short weapons meet)" },
    c: { s: "[弃甲][曳]{兵}而走", py: "qì jiǎ yè bīng ér zǒu",
      src: { zh: "《孟子·梁惠王上》", en: "Mencius, King Hui of Liang I 《孟子·梁惠王上》" }, era: 0,
      why: { zh: "「弃甲」和「曳兵」是一对：盔甲和兵器，是战士身上带的两样东西。「曳」是拖着，拖的是手里的东西；在逃跑的才是士兵。「兵」= 兵器。（这里的「走」也是跑！）",
        en: "弃甲 'throw off armour' and 曳兵 'drag ___' are a pair: armour and weapons, the two things a fighter carries. 曳 'drag' needs something in your hand; the soldiers are the ones running away. 兵 = weapon. (And 走 here means run again!)" },
      tr: { zh: "丢掉盔甲，拖着兵器逃跑。", en: "They throw off their armour and run, dragging their weapons." } } },
  { w: "闻", py: "wén",
    m: [{ zh: "听见", py: "tīngjiàn", en: "hear", lv: [3, 3, 3, 3, 2, 1] }, { zh: "用鼻子闻", py: "yòng bízi wén", en: "smell", lv: [1, 1, 1, 2, 2, 3] }],
    alive: { zh: "新闻、耳闻、闻名", en: "新闻 xīnwén 'news' (newly heard), 耳闻 'hear of', 闻名 'well known'" },
    c: { s: "阡陌[交通]，[鸡犬][相]{闻}。", py: "qiān mò jiāo tōng jī quǎn xiāng wén",
      src: { zh: "陶渊明《桃花源记》（东晋）", en: "Tao Yuanming, 'Peach Blossom Spring' 《桃花源记》 (Eastern Jin)" }, era: 2,
      why: { zh: "鸡叫狗吠是声音；「阡陌交通」说田间小路四通八达，人家挨得近，鸡犬的声音「相闻」——互相听得见。「闻」= 听见。",
        en: "Roosters crow and dogs bark: those are sounds. 阡陌交通 'the field paths connect' means the farms are close, so the animals 相闻, 'hear each other'. 闻 = hear." },
      tr: { zh: "田间小路交错相通，村落之间鸡鸣狗叫都听得见。", en: "Paths criss-cross the fields, and the chickens and dogs of one farm can be heard from the next." } } },
  { w: "妻子", py: "qī zǐ",
    m: [{ zh: "妻和子（妻子儿女）", py: "qī hé zǐ", en: "wife and children", lv: [3, 3, 3, 2, 1, 0] }, { zh: "妻子（qīzi）", py: "qīzi", en: "wife", lv: [0, 0, 1, 2, 3, 3] }],
    alive: { zh: "妻离子散（妻、子分开说）", en: "妻离子散 'wife and children scattered': 妻 and 子 still two people" },
    c: { s: "[仰]足以事[父母]，[俯]足以畜{妻子}", py: "yǎng zú yǐ shì fù mǔ fǔ zú yǐ xù qī zǐ",
      src: { zh: "《孟子·梁惠王上》", en: "Mencius, King Hui of Liang I 《孟子·梁惠王上》" }, era: 0,
      why: { zh: "这是一组对句：「仰」对「父母」——父和母，上一辈两种人；「俯」对「妻子」——妻和子，下面要养的一家人。「妻子」= 妻子和儿女。",
        en: "The sentence is a pair: 仰 'looking up' to 父母, father and mother (two kinds of people, the generation above); 俯 'looking down' to 妻子, 妻 wife and 子 children, the family you feed. 妻子 = wife and children." },
      tr: { zh: "对上足够侍奉父母，对下足够养活妻子儿女。", en: "Enough, looking up, to serve one's parents, and, looking down, to feed one's wife and children." } } },
  { w: "牺牲", py: "xīshēng",
    m: [{ zh: "祭祀用的牲畜", py: "jìsì yòng de shēngchù", en: "animals offered in sacrifice", lv: [3, 3, 3, 3, 2, 0] }, { zh: "舍弃生命", py: "shěqì shēngmìng", en: "give one's life", lv: [0, 0, 0, 0, 1, 3] }],
    alive: { zh: "今天几乎只用新义", en: "today almost only the new meaning" },
    c: { s: "{牺牲}[玉帛]，[弗敢加]也，必以信。", py: "xī shēng yù bó fú gǎn jiā yě bì yǐ xìn",
      src: { zh: "《左传·庄公十年》", en: "Zuo Zhuan, Duke Zhuang year 10 《左传·庄公十年》" }, era: 0,
      why: { zh: "「牺牲」和「玉帛」排在一起，都是祭祀的供品；「弗敢加」是不敢虚报多说。供品可以数、可以多报；舍弃生命谈不上「多报」。「牺牲」= 祭祀用的牲畜。",
        en: "牺牲 sits in a list with 玉帛 'jade and silk', offerings to the spirits, and 弗敢加 means 'I dare not overstate them'. You can count offerings and inflate the count; you cannot inflate 'giving your life'. 牺牲 = sacrificial animals." },
      tr: { zh: "「祭祀用的牛羊、玉器和丝绸，我从不敢虚报，一定按实情说。」", en: "'The animals, jade and silk I offer, I never dare overstate; I always keep faith.'" } } },
];
// Quiz: new sentences; w = index into WORDS, the right answer is the old meaning (m[0]).
const QUIZ = [
  { w: 1, s: "太丘[舍]{去}，[去后乃至]。", py: "tài qiū shě qù qù hòu nǎi zhì",
    src: { zh: "刘义庆《世说新语·方正》（南朝宋）", en: "Liu Yiqing, A New Account of Tales of the World 《世说新语·方正》 (5th c.)" }, era: 2,
    why: { zh: "「舍」是不再等，「去后乃至」是他走了以后朋友才到——陈太丘是离开了约好的地方。「去」= 离开。", en: "舍 'gave up waiting', and 去后乃至 'only after he had gone did the friend arrive': Chen Taiqiu left the meeting place. 去 = leave." },
    tr: { zh: "陈太丘不再等候就离开了，他离开后朋友才到。", en: "Chen Taiqiu gave up and left; only after he had gone did his friend arrive." } },

const HAN = /\p{Script=Han}/u;
function parseS(s, py) {
  const syl = py.split(/\s+/).filter(Boolean), out = [];
  let tgt = false, ev = false, k = 0;
  for (const ch of s) {
    if (ch === "{") tgt = true; else if (ch === "}") tgt = false;
    else if (ch === "[") ev = true; else if (ch === "]") ev = false;
    else if (HAN.test(ch)) out.push({ c: ch, py: syl[k++] || "", tgt, ev });
    else out.push({ c: ch, py: "", tgt: false, ev: false, p: true });
  }
  return { tokens: out, ok: k === syl.length };
}
function levelWord(lv, i) {
  const v = lv[i];
  if (v > 0) return ["", "occasional", "common", "main"][v];
  return lv.slice(i + 1).some((x) => x > 0) ? "notyet" : "gone";
}
// Smooth band: half-thickness h(level) at each column centre, cubic joins between them.
function bandPath(lv, W, H) {
  const n = lv.length, cx = (i) => ((i + 0.5) / n) * W, mid = H / 2, half = (v) => (v / 3) * (H / 2 - 1);
  const pts = lv.map((v, i) => [cx(i), half(v)]);
  let top = `M0 ${mid - pts[0][1]} L${pts[0][0]} ${mid - pts[0][1]}`;
  for (let i = 1; i < n; i++) { const xm = (pts[i - 1][0] + pts[i][0]) / 2; top += ` C${xm} ${mid - pts[i - 1][1]} ${xm} ${mid - pts[i][1]} ${pts[i][0]} ${mid - pts[i][1]}`; }
  top += ` L${W} ${mid - pts[n - 1][1]} L${W} ${mid + pts[n - 1][1]} L${pts[n - 1][0]} ${mid + pts[n - 1][1]}`;
  for (let i = n - 2; i >= 0; i--) { const xm = (pts[i + 1][0] + pts[i][0]) / 2; top += ` C${xm} ${mid + pts[i + 1][1]} ${xm} ${mid + pts[i][1]} ${pts[i][0]} ${mid + pts[i][1]}`; }
  return top + ` L0 ${mid + pts[0][1]} Z`;
}
function dominant(lvs, i) { // index of the meaning most common in era i (ties → the older one)
  let best = 0;
  lvs.forEach((lv, j) => { if (lv[i] > lvs[best][i]) best = j; });
  return best;
}
function eraFromX(x, width) { const v = Math.floor((x / Math.max(1, width)) * 6); return Number.isFinite(v) ? Play.clamp(v, 0, 5) : 0; }
function quizScore(set, ans) { return set.reduce((a, qi) => a + (ans[qi] === 0 ? 1 : 0), 0); }

function feedbackEl(ok, why, tr, w, reveal) {
  const fb = el("div", "fb");
  fb.setAttribute("aria-live", "polite");
  fb.appendChild(el("span", "v " + (ok ? "ok" : "no"), (ok ? P.t("okV") : P.t("noV")) + " "));
  if (ok) {
    fb.appendChild(document.createTextNode(why[L] + " " + P.t("evNote")));
    const wrap = el("div");
    wrap.appendChild(el("div", "tr", P.t("trL", { x: tr[L] })));
    wrap.appendChild(el("div", "alive", P.t("aliveL", { x: w.alive[L] })));
    fb.appendChild(wrap);
  } else {
    fb.appendChild(document.createTextNode(L === "zh"
      ? "把「" + w.m[1].zh.replace(/（.*）/, "") + "」放进句子里读一读，再看看句中其他的字。"
      : "Put '" + w.m[1].en + "' into the sentence and read it again; then look at the other words around " + w.w + "."));
    if (reveal) fb.appendChild(el("div", "tr", why[L] + " " + P.t("evNote")));
  }
  return fb;
}
const solvedCount = () => cardAns.filter((a) => a === 0).length;
function renderPicks() {
  pickBtns.forEach((b, i) => {
    b.setAttribute("aria-pressed", i === cur ? "true" : "false");
    b.querySelector(".ok").textContent = cardAns[i] === 0 ? "✓" : "";
    b.setAttribute("aria-label", WORDS[i].w + " " + WORDS[i].py + (cardAns[i] === 0 ? " ✓" : ""));
  });
}
function renderWord() { renderPicks(); renderTimeline(); renderCard(); }
function setEra(i) {
  i = Play.clamp(Math.round(i), 0, 5);
  if (!Number.isFinite(i) || i === era) return;
  era = i;
  renderTimeline();
}
$("era").addEventListener("input", (e) => setEra(+e.target.value));
(function () {
  const tl = $("tl");
  let down = false;
  const at = (e) => { const r = tl.getBoundingClientRect(); setEra(eraFromX(e.clientX - r.left, r.width)); };
  tl.addEventListener("pointerdown", (e) => { down = true; at(e); });
  tl.addEventListener("pointermove", (e) => { if (down) at(e); });
  addEventListener("pointerup", () => { down = false; });
  addEventListener("pointercancel", () => { down = false; });
  if (Play.reduced) tl.classList.add("noanim");
})();

// ---------- step 3 ----------
function renderQuiz() {
  const box = $("quiz");
  box.innerHTML = "";
  QSETS[quizSet].forEach((qi, n) => {
    const q = QUIZ[qi], w = WORDS[q.w], ans = quizAns[qi];
    const card = el("div", "ccard");
    const head = el("div", "src");
    head.append(el("span", "n", String(n + 1)), document.createTextNode(q.src[L] + " · " + eraName(q.era)));
    card.appendChild(head);
    card.appendChild(sentenceEl(q.s, q.py, quizChecked && ans != null));
    card.appendChild(el("div", "q", P.t("cardQ", { w: w.w })));
    card.appendChild(choiceRow(w, quizChecked ? ans : null, (j) => {
      quizAns[qi] = j; quizChecked = false; renderQuiz(); $("qscore").textContent = "";
      const b = $("quiz").querySelectorAll(".ccard")[n].querySelectorAll(".choices button");
      b.forEach((x) => { if (x.textContent === mLabel(w.m[j])) x.focus(); });
    }, (qi + 1) % 2));
    if (!quizChecked && ans != null) {
      const bs = card.querySelectorAll(".choices button");
      bs.forEach((x) => { if (x.textContent === mLabel(w.m[ans])) { x.classList.add("on"); x.setAttribute("aria-pressed", "true"); } });
    }
    if (quizChecked && ans != null) card.appendChild(feedbackEl(ans === 0, q.why, q.tr, w, true));
    box.appendChild(card);
  });
}
$("qcheck").addEventListener("click", () => {
  const set = QSETS[quizSet], k = set.filter((qi) => quizAns[qi] != null).length;
  if (k < set.length) { Play.live($("qscore"), P.t("qNeed", { n: set.length, k })); return; }
  quizChecked = true;
  const s = quizScore(set, quizAns);
  quizBest = Math.max(quizBest, s);
  renderQuiz();
  Play.live($("qscore"), P.t("qScore", { k: s, n: set.length }));
  renderScore();
});
$("qnew").addEventListener("click", () => {
  quizSet = (quizSet + 1) % QSETS.length;
  QSETS[quizSet].forEach((qi) => { quizAns[qi] = null; });
  quizChecked = false; $("qscore").textContent = ""; renderQuiz();
});
function renderSummary() {
  const box = $("sumbox");
  box.innerHTML = "";
  const t = el("table", "sum");
  const hr = el("tr");
  ["sumW", "sumOld", "sumAlive", "sumOk"].forEach((k) => hr.appendChild(el("th", "", P.t(k))));
  t.appendChild(hr);
  WORDS.forEach((w, i) => {
    const tr = el("tr");
    const old = w.m[0], now = w.m[1];
    tr.append(el("td", "w han", w.w),
      el("td", "", (L === "zh" ? old.zh : old.en) + " → " + (L === "zh" ? now.zh.replace(/（.*）/, "") : now.en)),
      el("td", "han", w.w === "牺牲" ? "—" : w.alive.zh.replace(/（.*）/, "")),
      el("td", "k", cardAns[i] === 0 ? "✓" : "·"));
    t.appendChild(tr);
  });
  box.appendChild(t);
  box.appendChild(el("p", "note", P.t("sumNote", { k: solvedCount(), n: WORDS.length })));
}
function renderScore() {
  const q = quizChecked ? quizScore(QSETS[quizSet], quizAns) + "/3" : (quizBest ? quizBest + "/3" : "—");
  $("rscore").textContent = P.t("rscore", { k: solvedCount(), n: WORDS.length, q });
}

// ---------- steps ----------
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { predicted = true; renderStory(); });
const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("v1").hidden = i !== 0; $("v2").hidden = i !== 1; $("v3").hidden = i !== 2;
  $("sumbox").hidden = i !== 2;
  Play.live($("live"), "");
  if (i === 0) renderStory();
  if (i === 1) renderWord();
  if (i === 2) { renderQuiz(); renderSummary(); }
});
$("reset").addEventListener("click", () => {
  cur = 0; era = 0; quizSet = 0; quizChecked = false; predicted = false; quizBest = 0;
  cardAns = WORDS.map(() => null); quizAns = QUIZ.map(() => null);
  $("qscore").textContent = "";
  pr.reset(); renderScore(); steps.go(0);
});
renderScore();
</script>
</body>
</html>

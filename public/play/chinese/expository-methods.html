<script>
// ---- logic (pure; tested in node) ----
// Constants (see footnote). Lengths in km unless noted.
const K = {
  earthD: 12742,          // Earth volumetric mean diameter (2 × 6,371.0 km)
  moonD: 3474.8,          // Moon volumetric mean diameter (2 × 1,737.4 km)
  dist: 384400,           // mean Earth–Moon distance
  everestM: 8848.86,      // Everest height in metres (2020 survey)
  sunD: 1391400,          // Sun volumetric mean diameter (2 × 695,700 km)
  au: 149597870.7,        // mean Earth–Sun distance (1 au)
  gEarth: 9.80665, gMoon: 1.62, // surface gravity, m/s²
  cardMM: 0.76,           // bank-card thickness (ISO/IEC 7810 ID-1), mm
};
function derived(k = K) {
  const dRatio = k.earthD / k.moonD;               // ≈ 3.67
  const vol = dRatio ** 3;                          // ≈ 49 Moons fit inside Earth by volume
  const earthsGap = k.dist / k.earthD;              // ≈ 30 Earths between Earth and Moon
  const everestOnMetreGlobeMM = (k.everestM / 1000) / k.earthD * 1000; // Everest on a 1 m globe, mm
  const sunRatio = k.sunD / k.earthD;               // ≈ 109
  const auRatio = k.au / k.dist;                    // ≈ 389
  const gFrac = k.gMoon / k.gEarth;                 // ≈ 0.165
  return { dRatio, vol, volRound: Math.round(vol / 10) * 10, earthsGap, everestOnMetreGlobeMM, sunRatio, auRatio, gFrac, gInv: 1 / gFrac };
}
const group3 = (x) => { // 12742 → "12,742"; 8848.86 → "8,848.86"
  if (!Number.isFinite(x)) return "—";
  const [i, f] = String(x).split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (f ? "." + f : "");
};
const fix = (x, d) => (Number.isFinite(x) ? x.toFixed(d) : "—");
// What the reader gets from each method, 0–3: exact / graspable (size you can feel) / vivid.
const METHODS = ["num", "cmp", "ana"];
const GAIN = { num: [3, 1, 0], cmp: [2, 3, 1], ana: [0, 1, 3] };
function meter(list) {
  const m = [0, 0, 0];
  (list || []).forEach((id) => { const g = GAIN[id]; if (g) g.forEach((v, i) => { m[i] = Math.max(m[i], v); }); });
  return m;
}
// One sentence per topic × method. Numbers are filled in from K and derived().
function sentence(topic, method, k = K) {
  const d = derived(k);
  const S = {
    size: {
      num: ["月球的直径约 " + group3(Math.round(k.moonD)) + " 千米，地球的直径约 " + group3(k.earthD) + " 千米。",
        "The Moon is about " + group3(Math.round(k.moonD)) + " km across; Earth is about " + group3(k.earthD) + " km across."],
      cmp: ["地球的直径约是月球的 " + fix(d.dRatio, 1) + " 倍；论体积，地球里大约能装下 " + d.volRound + " 个月球。",
        "Earth is about " + fix(d.dRatio, 1) + " times as wide as the Moon; by volume, about " + d.volRound + " Moons would fit inside it."],
      ana: ["月球像跟在地球身边的小跟班，形影不离地绕着它转。",
        "The Moon is like a little sidekick that never leaves Earth’s side, circling it again and again."],
    },
    dist: {
      num: ["地球到月球的平均距离约 " + group3(k.dist) + " 千米。",
        "The average distance from Earth to the Moon is about " + group3(k.dist) + " km."],
      cmp: ["地月之间的这段路，大约能一个挨一个地排下 " + Math.round(d.earthsGap) + " 个地球。",
        "Laid side by side, about " + Math.round(d.earthsGap) + " Earths would fill the gap between Earth and the Moon."],
      ana: ["月球像一只被看不见的长绳拴住的风筝，远远地绕着地球飞。",
        "The Moon is like a kite on an invisible string, flying in circles far away from Earth."],
    },
    peak: {
      num: ["珠穆朗玛峰的高度为 " + group3(k.everestM) + " 米（2020 年公布的测量结果）。",
        "Mount Everest is " + group3(k.everestM) + " m high (survey result announced in 2020)."],
      cmp: ["要是把地球缩成直径 1 米的球，珠峰只高约 " + fix(d.everestOnMetreGlobeMM, 1) + " 毫米，" + (d.everestOnMetreGlobeMM < k.cardMM ? "比一张银行卡还薄。" : "跟一张银行卡差不多厚。"),
        "Shrink Earth to a ball 1 m across and Everest would be only about " + fix(d.everestOnMetreGlobeMM, 1) + " mm high — " + (d.everestOnMetreGlobeMM < k.cardMM ? "thinner than a bank card." : "about as thick as a bank card.")],
      ana: ["珠峰像一座披着白雪的金字塔，直直地刺进蓝天。",
        "Everest is like a snow-covered pyramid stabbing straight into the blue sky."],
    },
  };
  const t = S[topic] && S[topic][method];
  return t ? { zh: t[0], en: t[1] } : null;
}
// Step 3: sort into 作比较 (cmp) or 打比方 (ana). All sentences written for this page.
function sortItems(k = K) {
  const d = derived(k);
  return [
    { id: 1, a: "cmp", zh: "太阳的直径大约是地球的 " + Math.round(d.sunRatio) + " 倍。", en: "The Sun is about " + Math.round(d.sunRatio) + " times as wide as Earth.", why: "same" },
    { id: 2, a: "ana", zh: "土星的光环像一顶大草帽的宽帽檐。", en: "Saturn’s rings are like the wide brim of a big straw hat.", why: "image" },
    { id: 3, a: "cmp", zh: "地球到太阳的距离，大约是地球到月球的 " + Math.round(d.auRatio / 10) * 10 + " 倍。", en: "Earth to the Sun is about " + Math.round(d.auRatio / 10) * 10 + " times as far as Earth to the Moon.", why: "same" },
    { id: 4, a: "ana", zh: "月面上的环形山一个挨一个，像被大雨砸过的沙地。", en: "Craters crowd the Moon’s face like sand pounded by heavy rain.", why: "image" },
    { id: 5, a: "cmp", zh: "在月球上，物体受到的重力只有在地球上的约" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"][Math.round(d.gInv)] + "分之一。", en: "On the Moon, things weigh only about 1/" + Math.round(d.gInv) + " of what they weigh on Earth.", why: "same" },
    { id: 6, a: "ana", zh: "跟地球比起来，月球就像一个小弟弟。", en: "Next to Earth, the Moon is like a little brother.", why: "trap" },
    { id: 7, a: "ana", zh: "大气层像给地球裹上的一层薄被子。", en: "The atmosphere is like a thin quilt wrapped around Earth.", why: "image" },
  ];
}
function judgeSort(item, pick) { return item && (pick === "cmp" || pick === "ana") ? item.a === pick : false; }
// Step 4: which method does this reader need? "best" / "ok" / "bad".
const READERS = {
  kid: { num: "bad", cmp: "ok", ana: "best" },
  report: { num: "best", cmp: "ok", ana: "bad" },
};
function judgeReader(who, m) { return (READERS[who] && READERS[who][m]) || "bad"; }
// ---- end logic ----

    sentA: "Sentence A", sentB: "Sentence B",

const L = P.lang;
const $ = (id) => document.getElementById(id);

const D = derived();
const MKEY = { num: "mNum", cmp: "mCmp", ana: "mAna" };
const MZH = { num: "列数字", cmp: "作比较", ana: "打比方" };
const TOPICS = [["size", "topicSize"], ["dist", "topicDist"], ["peak", "topicPeak"]];

let step = 0, topic = "size", desc = [], sel = null, predicted = false, sorted = {}, readerPick = {};

function say(text, no) { fb3.textContent = text; fb3.classList.toggle("no", !!no); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function mName(m) { return L === "en" ? MZH[m] + " " + P.t(MKEY[m]) : P.t(MKEY[m]); }
function tag(m) { const s = el("span", "tag m-" + m, MZH[m]); s.lang = "zh-CN"; return s; }
function zhSpan(text) { const s = el("span", "zh", text); s.lang = "zh-CN"; return s; }
function enSpan(text) { const s = el("span", "en", text); s.lang = "en"; return s; }

// ---------- figure ----------
let FS = 1; // SVG-unit → CSS-px compensation so figure labels stay ≥ 13 px when the figure is narrow
const BASE = { lab: 14, labm: 13, num: 15, anat: 14 };
function T(x, y, text, cls, anchor) { const t = Play.svg("text", { x, y, class: cls, "text-anchor": anchor || "middle", style: "font-size:" + ((BASE[cls] || 14) * FS).toFixed(1) + "px" }, fig); t.textContent = text; return t; }
function cap(text, cls) { const s = el("span", cls, text); $("figcap").appendChild(s); }
function drawFig(methods) {
  fig.innerHTML = "";
  $("figcap").innerHTML = "";
  FS = Play.clamp(600 / (fig.clientWidth || 600), 1, 2.2);
  const has = (m) => methods.includes(m);
  const tp = step === 0 ? "size" : topic;
  fig.setAttribute("aria-label", P.t(TOPICS.find((x) => x[0] === tp)[1]));
  if (tp === "size") {
    const R = 78, r = R / D.dRatio, cx = 170, cy = 105, mx = 400;
    Play.svg("circle", { cx, cy, r: R, class: "earth" }, fig);
    Play.svg("circle", { cx: mx, cy, r, class: "moon" }, fig);
    T(cx, cy + R + 20, L === "en" ? "Earth" : "地球", "lab");
    T(mx, cy + r + 20, L === "en" ? "Moon" : "月球", "lab");
    if (has("num")) {
      T(cx, 20, P.t("figD", { n: group3(K.earthD) }), "num");
      T(mx, cy - r - 12, P.t("figD", { n: group3(Math.round(K.moonD)) }), "num");
    }
    if (has("cmp")) {
      // Moon diameters laid across Earth's diameter: 3 whole + a fraction.
      for (let i = 0; i < Math.ceil(D.dRatio); i++) {
        const x = cx - R + r + i * 2 * r;
        Play.svg("circle", { cx: x, cy, r, class: "ghostm" }, fig);
      }
      T(cx + R + 18, cy + 5, P.t("figX", { r: fix(D.dRatio, 1) }), "num", "start");
      cap(P.t("figX", { r: fix(D.dRatio, 1) }) + " · " + P.t("figV", { v: D.volRound }), "c-cmp");
    }
    if (has("ana") && step === 0) {
      // Sentence B's picture: a round mirror hung in the sky.
      Play.svg("circle", { cx: mx, cy, r: r + 8, class: "ana" }, fig);
      T(mx, cy - r - 16, P.t("figMirror"), "anat");
    } else if (has("ana")) {
      Play.svg("ellipse", { cx, cy, rx: mx - cx, ry: 70, class: "ana" }, fig);
      T(mx + r + 10, cy + 6, P.t("figKid"), "anat", "start");
    }
  } else if (tp === "dist") {
    const W = 540, x0 = 30, unit = W / (D.earthsGap + 1); // Earth diameters across the width
    const R = unit / 2, r = R / D.dRatio, cy = 110, ex = x0 + R, mx = ex + unit * D.earthsGap;
    Play.svg("circle", { cx: ex, cy, r: R, class: "earth" }, fig);
    Play.svg("circle", { cx: mx, cy, r: Math.max(r, 1.5), class: "moon" }, fig);
    T(ex, cy + 32, L === "en" ? "Earth" : "地球", "lab", "start");
    T(mx, cy + 32, L === "en" ? "Moon" : "月球", "lab", "end");
    if (has("num")) {
      Play.svg("path", { d: `M${ex} ${cy - 22} H${mx}`, class: "cmp", "stroke-dasharray": "2 3" }, fig);
      T((ex + mx) / 2, cy - 30, P.t("figD", { n: group3(K.dist) }), "num");
    }
    if (has("cmp")) {
      for (let i = 1; i <= Math.floor(D.earthsGap); i++) Play.svg("circle", { cx: ex + i * unit, cy, r: R, class: "ghoste" }, fig);
      cap(P.t("figE", { n: Math.round(D.earthsGap) }), "c-cmp");
    }
    if (has("ana")) {
      Play.svg("path", { d: `M${ex} ${cy} C ${ex + 150} ${cy - 90}, ${mx - 150} ${cy + 90}, ${mx} ${cy}`, class: "ana" }, fig);

    }
  } else {
    // Everest: true-scale on a 1 m globe is below one pixel, so the bump is drawn tiny and labelled.
    const gy = 175;
    Play.svg("rect", { x: 20, y: gy, width: 560, height: 20, class: "ground", rx: 4 }, fig);
    Play.svg("path", { d: `M220 ${gy} L300 ${gy - 120} L380 ${gy} Z`, class: "peak" }, fig);
    Play.svg("path", { d: `M280 ${gy - 90} L300 ${gy - 120} L320 ${gy - 90} L308 ${gy - 96} L300 ${gy - 86} L292 ${gy - 96} Z`, class: "snow" }, fig);
    if (has("num")) {
      Play.svg("path", { d: `M400 ${gy} V${gy - 120}`, class: "cmp" }, fig);
      T(410, gy - 55, P.t("figH", { n: group3(K.everestM) }), "num", "start");
    }
    if (has("cmp")) {
      // 1 m globe drawn as an arc; at that scale Everest's height in px (1 m → 400 px) is computed.
      const pxPerMM = 400 / 1000, h = D.everestOnMetreGlobeMM * pxPerMM;
      Play.svg("path", { d: "M30 70 Q130 20 230 70", class: "cmp" }, fig);
      Play.svg("path", { d: `M130 45 v${-h}`, class: "cmp" }, fig); // ≈0.3 px: too small to see, which is the point
      T(130, 70 + 18 * FS, P.t("figMmS", { n: fix(D.everestOnMetreGlobeMM, 1) }), "num");
      cap(P.t("figGlobe") + ": " + P.t("figMm", { n: fix(D.everestOnMetreGlobeMM, 1) }), "c-cmp");
    }
    if (has("ana")) T(470, 50, P.t("figPyr"), "anat");
  }
}

// ---------- meter ----------
function drawMeter(m, heading) {
  meterEl.innerHTML = "";
  meterEl.appendChild(el("div", "hd", heading || P.t("meterHd")));
  [["gExact", m[0]], ["gGrasp", m[1]], ["gVivid", m[2]]].forEach(([k, v]) => {
    const row = el("div", "row");
    const tr = el("div", "track"), f = el("div", "fill");
    f.style.width = (Play.clamp(v, 0, 3) / 3) * 100 + "%";
    tr.appendChild(f);
    row.append(el("span", "", P.t(k)), tr, el("b", "", v + "/3"));
    meterEl.appendChild(row);
  });
}

// ---------- step 2: slot and tray ----------
function addMethod(m) {
  if (!GAIN[m]) return;
  if (desc.includes(m)) { say(P.t("already", { m: mName(m) })); return; }
  desc.push(m);
  sel = null;
  say(desc.length === 3 ? P.t("allThree") : P.t("added", { m: mName(m) }));
  render();
}
function removeMethod(m) {
  desc = desc.filter((x) => x !== m);
  say(P.t("removed", { m: mName(m) }));
  render();
  const c = tray.querySelector('[data-m="' + m + '"]');
  if (c) c.focus();
}
function renderSlot() {
  slot.innerHTML = "";
  slot.classList.toggle("ready", sel !== null);
  if (!desc.length) { slot.appendChild(el("span", "lab0", P.t("slotEmpty"))); return; }
  desc.forEach((m) => {
    const s = sentence(topic, m);
    const b = el("button", "line");
    b.type = "button";
    const body = el("span");
    body.appendChild(zhSpan(s.zh));
    if (L === "en") body.appendChild(enSpan(s.en));
    b.append(tag(m), body, el("span", "x", "✕"));
    b.setAttribute("aria-label", mName(m) + ": " + s.zh + " — " + P.t("takeOut"));
    b.addEventListener("click", () => removeMethod(m));
    slot.appendChild(b);
  });
}
function renderTray() {
  tray.innerHTML = "";
  tray.appendChild(el("div", "hd", P.t("trayHd")));
  METHODS.forEach((m) => {
    const b = el("button", "card2" + (desc.includes(m) ? " in" : "") + (sel === m ? " sel" : ""));
    b.type = "button";
    b.dataset.m = m;
    const z = el("span", "zh", MZH[m]); z.lang = "zh-CN";
    b.appendChild(z);
    if (L === "en") b.appendChild(el("span", "en", P.t(MKEY[m])));
    b.setAttribute("aria-pressed", desc.includes(m) ? "true" : "false");
    b.addEventListener("click", () => { if (b.dataset.dragged) return; addMethod(m); });
    dragify(b, m);
    tray.appendChild(b);
  });
}
// Pointer drag onto the slot (mouse and touch); a plain tap still adds.
function dragify(b, m) {
  let start = null, ghost = null, over = false;
  b.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY }; try { b.setPointerCapture(e.pointerId); } catch (_) { /* ok */ } });
  b.addEventListener("pointermove", (e) => {
    if (!start) return;
    if (!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
      ghost = el("span", "card2 ghost");
      ghost.appendChild(tag(m));
      document.body.appendChild(ghost);
      sel = m; slot.classList.add("ready");
    }
    if (!ghost) return;
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    const r = slot.getBoundingClientRect();
    over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    slot.classList.toggle("over", over);
  });
  const end = (cancel) => {
    if (!start) return;
    start = null;
    if (!ghost) return;
    ghost.remove(); ghost = null;
    b.dataset.dragged = "1";
    setTimeout(() => delete b.dataset.dragged, 0);
    slot.classList.remove("over", "ready");
    sel = null;
    if (!cancel && over) addMethod(m); else render();
    over = false;
  };
  b.addEventListener("pointerup", () => end(false));
  b.addEventListener("pointercancel", () => end(true));
}
tray.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const bs = [...tray.querySelectorAll("button")];
  const i = bs.indexOf(document.activeElement);
  if (i < 0) return;
  bs[Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, bs.length - 1)].focus();
  e.preventDefault();
});
function renderTopics() {
  topicsEl.innerHTML = "";
  TOPICS.forEach(([id, key]) => {
    const b = el("button", topic === id ? "on" : "", P.t(key));
    b.type = "button";
    b.setAttribute("aria-pressed", topic === id ? "true" : "false");
    b.addEventListener("click", () => { topic = id; render(); topicsEl.querySelector('[aria-pressed="true"]').focus(); });
    topicsEl.appendChild(b);
  });
}

// ---------- step 1: the two predict sentences ----------
function renderPair() {
  pairEl.innerHTML = "";
  if (step === 0) {
    [["sentA", "pA", "pAen", "cmp"], ["sentB", "pB", "pBen", "ana"]].forEach(([lab, k, ken, m]) => {
      const box = el("div", "reader");
      box.appendChild(el("span", "who", P.t(lab) + (predicted ? " · " + mName(m) : "")));
      box.appendChild(zhSpan(P.t(k, { r: fix(D.dRatio, 1) })));
      if (L === "en") box.appendChild(enSpan(P.t(ken, { r: fix(D.dRatio, 1) })));
      if (predicted) {
        const g = GAIN[m];
        box.appendChild(el("span", "need", P.t("gExact") + " " + g[0] + "/3 · " + P.t("gGrasp") + " " + g[1] + "/3 · " + P.t("gVivid") + " " + g[2] + "/3"));
      }
      pairEl.appendChild(box);
    });
  } else if (step === 2) {
    const items = sortItems();
    pairEl.appendChild(el("div", "need", P.t("sortHint")));
    items.forEach((it) => {
      const row = el("div", "sortrow");
      const pick = sorted[it.id];
      if (pick) row.classList.add(judgeSort(it, pick) ? "ok" : "no");
      row.appendChild(zhSpan(it.zh));
      if (L === "en") row.appendChild(enSpan(it.en));
      const btns = el("div", "btns");
      ["cmp", "ana"].forEach((m) => {
        const b = el("button", pick === m ? (judgeSort(it, m) ? "good" : "bad") : "", L === "en" ? MZH[m] + " " + P.t(MKEY[m]) : MZH[m]);
        b.type = "button";
        b.setAttribute("aria-pressed", pick === m ? "true" : "false");
        b.addEventListener("click", () => {
          sorted[it.id] = m;
          render();
          const again = pairEl.querySelectorAll(".sortrow")[items.indexOf(it)];
          if (again) again.querySelectorAll("button")[m === "cmp" ? 0 : 1].focus();
        });
        btns.appendChild(b);
      });
      if (pick) {
        const ok = judgeSort(it, pick);
        btns.appendChild(el("span", "why", (ok ? "✓ " : "✗ ") + P.t(it.why === "same" ? "whySame" : it.why === "trap" ? "whyTrap" : "whyImage")));
      }
      row.appendChild(btns);
      pairEl.appendChild(row);
    });
  } else if (step === 3) {
    [["kid", "kidNeed"], ["report", "reportNeed"]].forEach(([who, need]) => {
      const box = el("div", "reader");
      box.appendChild(el("span", "who", P.t(who)));
      box.appendChild(el("span", "need", P.t(need)));
      const btns = el("div", "btns");
      const pick = readerPick[who];
      METHODS.forEach((m) => {
        const v = pick === m ? judgeReader(who, m) : null;
        const b = el("button", v ? (v === "bad" ? "bad" : "good") : "", mName(m));
        b.type = "button";
        b.setAttribute("aria-pressed", pick === m ? "true" : "false");
        b.addEventListener("click", () => {
          readerPick[who] = m;
          render();
          const bb = pairEl.querySelector('[data-who="' + who + '"] button:nth-child(' + (METHODS.indexOf(m) + 1) + ")");
          if (bb) bb.focus();
        });
        btns.appendChild(b);
      });
      box.dataset.who = who;
      box.appendChild(btns);
      const f = el("span", "fbr");
      if (pick) {
        const v = judgeReader(who, pick);
        const key = v === "best" ? "fbBest" : (v === "ok" ? (who === "kid" ? "fbOkKid" : "fbOkRep") : (who === "kid" ? "fbBadKid" : "fbBadRep"));
        f.textContent = P.t(key, { v: D.volRound, n: group3(Math.round(K.moonD)) });
        f.classList.toggle("no", v === "bad");
      }
      f.setAttribute("aria-live", "polite");
      box.appendChild(f);
      pairEl.appendChild(box);
    });
  }
}

function render() {
  const s2 = step === 1;
  topicsEl.hidden = !s2;
  slot.hidden = !s2;
  tray.hidden = !s2;
  pairEl.hidden = s2;
  fig.style.display = step === 2 ? "none" : "";
  let m;
  if (step === 0) {
        drawFig(predicted ? ["cmp", "ana"] : []);
    meterEl.hidden = true;
  } else if (step === 1) {
    m = meter(desc);
    drawFig(desc);
    meterEl.hidden = false;
    drawMeter(m);
    renderTopics(); renderSlot(); renderTray();
  } else if (step === 2) {
    meterEl.hidden = true;
    const items = sortItems();
    const k = items.filter((it) => sorted[it.id] && judgeSort(it, sorted[it.id])).length;
    Play.live(liveEl, P.t("sortScore", { k, t: items.length }));
  } else {
    meterEl.hidden = false;
    m = meter(["num", "cmp", "ana"]);
    drawFig(["num", "cmp", "ana"]);
    drawMeter(m);
  }
  renderPair();
  $("rule").hidden = $("nums").hidden = step !== 3;
  if (step === 3) {
    $("rule").textContent = P.t("rule");
    $("nums").textContent = P.t("nums", {
      e: group3(K.earthD), m: group3(K.moonD), r1: fix(D.dRatio, 3), r: fix(D.dRatio, 1), v1: fix(D.vol, 1), v: D.volRound,
      d: group3(K.dist), g1: fix(D.earthsGap, 2), g: Math.round(D.earthsGap), h: group3(K.everestM), mm1: fix(D.everestOnMetreGlobeMM, 2),
    });
  }
  if (step === 1) Play.live(liveEl, P.t("liveM", { a: m[0], b: m[1], c: m[2] }));
  else if (step !== 2) liveEl.textContent = "";
}

const pr = Play.predict($("predict"), {
  q: P.t("q", { r: fix(D.dRatio, 1) }),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { predicted = true; render(); });

const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  sel = null;
  say("");
  render();
});

let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (step !== 2) render(); }); });
$("reset").addEventListener("click", () => {
  topic = "size"; desc = []; sel = null; predicted = false; sorted = {}; readerPick = {};
  pr.reset(); say(""); steps.go(0);
});
</script>
</body>
</html>

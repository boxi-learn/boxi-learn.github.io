<style>

  .pl { font-size: 21px; line-height: 1.55; white-space: nowrap; letter-spacing: .02em; }
  .pl .seg { display: inline; padding: 0 1px; margin: 0; border: 0; border-radius: 4px; background: transparent; font: inherit; color: inherit; line-height: inherit; letter-spacing: inherit; cursor: pointer;
    border-bottom: 2px dotted var(--muted); }
  .pl .seg:hover { background: var(--soft); }
  .pl .seg:focus-visible { outline: 2px solid var(--a); outline-offset: 1px; }
  .pl .seg.k-same { border-bottom: 3px solid var(--c); color: var(--c); }
  .pl .seg.k-change { border-bottom: 3px solid var(--b); color: var(--b); }

  .chips button.k-same { background: var(--c); border-color: var(--c); color: var(--surface); }
  .chips button.k-change { background: var(--b); border-color: var(--b); color: var(--surface); }
  .chips button.k-drop { background: var(--h); border-color: var(--h); color: var(--surface); }
  .legend .sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
  .panel h3 { font-size: 15px; margin: 2px 0 6px; }
  .side { margin: 6px 0 4px; }
  .side .who { font-size: 12px; color: var(--muted); font-weight: 650; }

  .kinds button.on.wrong { background: var(--no); border-color: var(--no); color: var(--surface); }

  .tally { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: 14px; margin: 4px 0 6px; }

<script>
// ---------- data ----------
// Texts: the received versions in common modern editions (variants in the footnote).
// py: one syllable per character, Putonghua citation tones.
const POEMS = [
  { who: { zh: "崔颢《黄鹤楼》", en: "Cui Hao, 'Yellow Crane Tower' 《黄鹤楼》" }, tag: { zh: "前作", en: "earlier" },
    rhyme: [1, 3, 5, 7], // lines whose last character rhymes (line 1 ends in 去, which does not)
    lines: [
      { s: "昔人已乘黄鹤去", py: "xī rén yǐ chéng huáng hè qù", en: "Long ago someone rode the yellow crane away;", zh: "传说中的仙人早已骑着黄鹤飞走，" },
      { s: "此地空余黄鹤楼", py: "cǐ dì kōng yú huáng hè lóu", en: "all that is left here is the empty Yellow Crane Tower.", zh: "这里只剩下一座空空的黄鹤楼。" },
      { s: "黄鹤一去不复返", py: "huáng hè yī qù bù fù fǎn", en: "The yellow crane, once gone, never came back;", zh: "黄鹤一去，再也没有回来，" },
      { s: "白云千载空悠悠", py: "bái yún qiān zǎi kōng yōu yōu", en: "for a thousand years white clouds have drifted, empty.", zh: "千百年来只有白云空自飘荡。" },
      { s: "晴川历历汉阳树", py: "qíng chuān lì lì hàn yáng shù", en: "Across the sunlit river the trees of Hanyang stand clear;", zh: "晴天的江对岸，汉阳的树木清清楚楚，" },
      { s: "芳草萋萋鹦鹉洲", py: "fāng cǎo qī qī yīng wǔ zhōu", en: "sweet grass grows thick on Parrot Island.", zh: "鹦鹉洲上芳草长得茂盛。" },
      { s: "日暮乡关何处是", py: "rì mù xiāng guān hé chù shì", en: "The sun is setting — where is my home town?", zh: "天色晚了，我的家乡在哪里？" },
      { s: "烟波江上使人愁", py: "yān bō jiāng shàng shǐ rén chóu", en: "Mist and waves on the river make one sad.", zh: "江上烟雾笼罩的水波，让人发愁。" },
    ] },
  { who: { zh: "李白《登金陵凤凰台》", en: "Li Bai, 'Climbing Phoenix Terrace at Jinling' 《登金陵凤凰台》" }, tag: { zh: "后作", en: "later" },
    rhyme: [0, 1, 3, 5, 7],
    lines: [
      { s: "凤凰台上凤凰游", py: "fèng huáng tái shàng fèng huáng yóu", en: "On Phoenix Terrace phoenixes once came to roam;", zh: "凤凰台上曾有凤凰来游，" },
      { s: "凤去台空江自流", py: "fèng qù tái kōng jiāng zì liú", en: "the phoenixes gone, the terrace empty, the river flows on by itself.", zh: "凤凰飞走，台也空了，只有江水自己流着。" },
      { s: "吴宫花草埋幽径", py: "wú gōng huā cǎo mái yōu jìng", en: "Flowers and weeds of the Wu palace bury its hidden paths;", zh: "吴国宫殿的花草，埋没了幽深的小路，" },
      { s: "晋代衣冠成古丘", py: "jìn dài yī guān chéng gǔ qiū", en: "the robed and capped nobles of Jin are old grave mounds now.", zh: "晋朝的达官贵人，都成了古墓。" },
      { s: "三山半落青天外", py: "sān shān bàn luò qīng tiān wài", en: "The Three Mountains half drop away beyond the blue sky;", zh: "三山一半隐没在青天之外，" },
      { s: "二水中分白鹭洲", py: "èr shuǐ zhōng fēn bái lù zhōu", en: "White Egret Island splits the water in two.", zh: "白鹭洲把江水分成两道。" },
      { s: "总为浮云能蔽日", py: "zǒng wèi fú yún néng bì rì", en: "It is all because drifting clouds can hide the sun:", zh: "总是因为浮云能遮住太阳，" },
      { s: "长安不见使人愁", py: "cháng ān bù jiàn shǐ rén chóu", en: "Chang'an cannot be seen, and that makes one sad.", zh: "望不见长安，让人发愁。" },
    ] },
];
// Pre-annotated features. a = spans in Cui's poem, b = spans in Li's: [line, start, end) (0-based, character index).
// kind: same 同 (kept) · change 改 · drop 弃 (in the earlier poem, gone from the later one).
const FEATURES = [
  { kind: "same", a: [[0, 4, 6], [1, 4, 7]], b: [[0, 0, 3], [0, 4, 6]],
    label: { zh: "开头：楼台以鸟得名，鸟名一再出现", en: "Opening: a building named after a bird, the bird's name repeated" },
    why: { zh: "崔颢前三句用了三次「黄鹤」；李白第一句就两次「凤凰」，第二句又一个「凤」。开法一样：先说这座楼（台）为什么叫这个名字。",
      en: "Cui uses 黄鹤 'yellow crane' three times in three lines; Li puts 凤凰 'phoenix' twice into his first line and 凤 again in the second. Same opening move: say why the building carries a bird's name." } },
  { kind: "same", a: [[0, 6, 7], [1, 2, 4]], b: [[1, 0, 4]],
    label: { zh: "鸟去楼空", en: "The bird is gone, the building is empty" },
    why: { zh: "崔颢用两句说「乘黄鹤去」「空余黄鹤楼」；李白压成四个字「凤去台空」。意思一样：传说里的鸟走了，只剩下建筑。",
      en: "Cui takes two lines: 乘黄鹤去 'rode the crane away', 空余黄鹤楼 'only the empty tower is left'. Li squeezes it into four characters, 凤去台空 'phoenix gone, terrace empty'. Same idea." } },
  { kind: "change", a: [[3, 0, 2], [3, 5, 7]], b: [[1, 4, 7]],
    label: { zh: "不变的自然：白云 → 江水", en: "What never changes: white clouds → the river" },
    why: { zh: "崔颢拿千年飘着的白云，对照一去不回的黄鹤；李白换成「江自流」——人事变了，江水照样自己流。作用一样，景物换了。",
      en: "Cui sets clouds that drift for a thousand years against the crane that never returns; Li uses 江自流 'the river flows on by itself'. Same job, a different thing in nature." } },
  { kind: "change", a: [[3, 2, 4]], b: [[2, 0, 7], [3, 0, 7]],
    label: { zh: "感叹的对象：仙人传说 → 六朝兴亡", en: "What time has erased: a legend → real history" },
    why: { zh: "崔颢三四句还停在黄鹤的传说里，感叹「千载」的空；李白三四句写吴宫、晋代——金陵做过六朝都城，当年的宫殿和贵人都成了荒草古墓。神话换成了真实的历史。",
      en: "Cui's lines 3–4 stay with the crane legend and the emptiness of 千载 'a thousand years'. Li's lines 3–4 name the Wu palace and the Jin nobles: Jinling was the capital of six dynasties, and its palaces and grandees are weeds and grave mounds now. Myth is swapped for history." } },
  { kind: "same", a: [[5, 4, 7]], b: [[5, 4, 7]],
    label: { zh: "第六句落在江中小洲：鹦鹉洲 → 白鹭洲", en: "Line 6 ends on an island in the river: Parrot Island → White Egret Island" },
    why: { zh: "两首的第五、六句都写登高望见的远景，第六句都落在一个以鸟命名的江中小洲上，韵脚还是同一个「洲」字。",
      en: "In both poems lines 5–6 describe the view from the height, and line 6 ends on a river island named after a bird — with the same rhyme character, 洲 zhōu 'island'." } },
  { kind: "change", a: [[6, 0, 2]], b: [[6, 2, 7]],
    label: { zh: "第七句的「日」：日暮 → 浮云蔽日", en: "The sun in line 7: sunset → the sun hidden by clouds" },
    why: { zh: "崔颢的「日暮」是真实的黄昏，天晚了想回家。李白的「日」被浮云遮住：「浮云蔽日」是古诗文里常见的比喻，太阳常比君主，浮云比遮蔽君主的小人。同一个「日」，从写景变成了比喻。",
      en: "Cui's 日暮 is a real sunset: it is late, he wants to go home. Li's 日 is covered by 浮云 'drifting clouds' — an old figure of speech in which the sun stands for the ruler and the clouds for the schemers around him. The same character 日 goes from scenery to metaphor." } },
  { kind: "change", a: [[6, 2, 7]], b: [[7, 0, 4]],
    label: { zh: "望不见的地方：乡关 → 长安", en: "The place out of sight: home town → Chang'an" },
    why: { zh: "崔颢问「乡关何处是」——故乡在哪里；李白说「长安不见」——看不见的是都城，是朝廷。愁的对象换了。",
      en: "Cui asks 乡关何处是 'where is my home town?'. Li says 长安不见 'Chang'an cannot be seen' — the capital, the imperial court. What the sadness is about has changed." } },
  { kind: "same", a: [[7, 4, 7]], b: [[7, 4, 7]],
    label: { zh: "末三字一字不改：使人愁", en: "The last three characters, unchanged: 使人愁" },
    why: { zh: "两首最后三个字完全相同，位置也相同。李白特意留着它，读者才会把两个结尾放在一起比：同样是愁，愁的不是一回事。",
      en: "Both poems end with exactly the same three characters in the same place. Keeping them invites the reader to compare the two endings: the same word 'sad', but not the same sadness." } },
  { kind: "drop", a: [[0, 0, 4]], b: [],
    label: { zh: "骑鹤飞走的仙人", en: "The immortal who flew off on the crane" },
    why: { zh: "崔颢开头就有一个人：「昔人已乘黄鹤去」。李白的凤凰台上没有人骑凤凰；全诗不写神仙，写的是吴宫、晋代这些真实的人和事。",
      en: "Cui starts with a person: 昔人已乘黄鹤去 'someone long ago rode the crane away'. On Li's terrace nobody rides the phoenix; the poem has no immortals at all, only the real people of Wu and Jin." } },
  { kind: "drop", a: [[2, 1, 7]], b: [],
    label: { zh: "不守格律的写法", en: "Breaking the tone rules" },
    why: { zh: "崔颢第三句「黄鹤一去不复返」从「鹤」起连着六个仄声字，第四句以「空悠悠」三个平声收尾——律诗本来要避开这些，崔颢写得像古体歌行。李白也重复了「凤凰」，但平仄基本合律，没有照搬这种破格。",
      en: "Cui's line 3 runs six oblique-tone syllables in a row (from 鹤 on), and line 4 ends on three level tones (空悠悠) — both things a regulated poem should avoid; his first half sounds like an old-style ballad. Li repeats 凤凰 too, but his tones basically follow the rules: he did not copy this rule-breaking." } },
];
const KINDS = ["same", "change", "drop"];
const KHAN = { same: "同", change: "改", drop: "弃" };
// Interpretations of what the later poem is arguing with; right = index 1.
const ARGUE = [
  { zh: "李白只是在模仿：两首诗说的是同一种愁", en: "Li is just copying: both poems are about the same sadness" },
  { zh: "李白借崔颢的架子，把「想家」的愁换成「望不见长安」的愁：浮云蔽日，自己被挡在朝廷之外", en: "Li borrows Cui's frame but swaps homesickness for the sadness of 'not seeing Chang'an': clouds hide the sun, and he is shut out of the court" },
  { zh: "李白在嘲笑崔颢写得不好", en: "Li is mocking Cui's poem as badly written" },
  { zh: "李白在写天气：云多，所以看不见长安", en: "Li is describing the weather: it is cloudy, so he cannot see Chang'an" },
];
const ARGUE_RIGHT = 1;
const NEED_FOR_ARGUE = 6;
// City centres for the distance in the feedback (degrees): Nanjing (Jinling), Xi'an (Chang'an).
const JINLING = [32.06, 118.80], CHANGAN = [34.26, 108.94];

// ---------- pure logic ----------
function haversineKm(p, q) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (q[0] - p[0]) * r, dLon = (q[1] - p[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(p[0] * r) * Math.cos(q[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
// owner[poem][line][char] = feature index or -1; throws if spans overlap or run off a line.
function ownerMap(poems, feats) {
  const own = poems.map((p) => p.lines.map((l) => Array.from(l.s).map(() => -1)));
  feats.forEach((f, fi) => [f.a, f.b].forEach((spans, pi) => spans.forEach(([ln, s, e]) => {
    const row = own[pi][ln];
    if (!row || s < 0 || e > row.length || s >= e) throw new Error("bad span " + fi);
    for (let k = s; k < e; k++) { if (row[k] !== -1) throw new Error("overlap " + fi); row[k] = fi; }
  })));
  return own;
}
function segments(chars, owners) { // consecutive characters with the same owner
  const out = [];

function select(i, fromSeg) {
  sel = Play.clamp(i, 0, FEATURES.length - 1);
  paintMarks(); renderPanel();
  if (fromSeg) { const b = $("panel").querySelector(".kinds button"); if (b) b.focus({ preventScroll: true }); }
}
function sideBox(pi, spans) {
  const p = POEMS[pi], box = el("div", "side");
  box.appendChild(el("div", "who", P.t("side" + pi) + " · " + spans.map((s) => s[0] + 1).filter((v, k, a) => a.indexOf(v) === k).map((n) => "#" + n).join(" ")));
  if (!spans.length) { box.appendChild(el("div", "none", P.t("noneL"))); return box; }
  const lines = [...new Set(spans.map((s) => s[0]))];
  lines.forEach((ln) => {
    const sp = spans.filter((s) => s[0] === ln);
    const row = rubyLine(p.lines[ln], -1, -1);
    sp.forEach(([, s, e]) => { for (let k = s; k < e; k++) row.children[k].classList.add("hit"); });
    box.appendChild(row);
    box.appendChild(el("div", "gl", L === "en" ? p.lines[ln].en : P.t("glossL") + p.lines[ln].zh));
  });
  return box;
}
function renderPanel() {
  const box = $("panel");
  box.innerHTML = "";
  if (sel < 0) { box.appendChild(el("div", "hint", P.t("pickHint"))); return; }
  const f = FEATURES[sel], ans = answers[sel];
  box.appendChild(el("h3", "", circ(sel) + " " + (ans ? f.label[L] : f.a.map((s) => spanText(POEMS[0], s)).join(" / ") + "  ↔  " + (f.b.length ? f.b.map((s) => spanText(POEMS[1], s)).join(" / ") : "?"))));
  box.appendChild(sideBox(0, f.a));
  box.appendChild(sideBox(1, f.b));
  box.appendChild(el("div", "q", P.t("askK")));
  const row = el("div", "kinds");
  KINDS.forEach((k) => {
    const b = el("button", ans === k ? "on " + (k === f.kind ? "right" : "wrong") : "");
    b.type = "button";
    b.append(el("span", "hz han", KHAN[k]), document.createTextNode(P.t("k" + k[0].toUpperCase() + k.slice(1))));
    b.setAttribute("aria-pressed", ans === k ? "true" : "false");
    b.addEventListener("click", () => classify(k));
    row.appendChild(b);
  });
  box.appendChild(row);
  if (ans) {
    const fb = el("div", "fb");
    const ok = ans === f.kind;
    fb.appendChild(el("span", "v " + (ok ? "ok" : "no"), (ok ? P.t("okV") : P.t("noV", { k: kindName(f.kind) })) + " "));
    fb.appendChild(document.createTextNode(f.why[L]));
    box.appendChild(fb);
  }
}
function classify(k) {
  if (sel < 0) return;
  answers[sel] = k;
  const f = FEATURES[sel];
  paintMarks(); renderPanel(); renderTally(); renderArgue(); renderResult();
  Play.live($("live"), P.t("liveF", { i: sel + 1, label: f.label[L], v: k === f.kind ? P.t("okV") : P.t("noV", { k: kindName(f.kind) }) }));
  const b = $("panel").querySelectorAll(".kinds button")[KINDS.indexOf(k)];
  if (b) b.focus({ preventScroll: true });
}
const doneCount = () => answers.filter(Boolean).length;
const rightCount = () => answers.filter((a, i) => a && a === FEATURES[i].kind).length;
function renderTally() {
  const t = $("tally"), n = countKinds(FEATURES, (i) => !!answers[i]);
  t.innerHTML = "";
  KINDS.forEach((k) => {
    t.appendChild(el("span", "", kindName(k)));
    const bar = el("div", "bar"), fill = el("i");
    fill.style.width = (TOTAL[k] ? (n[k] / FEATURES.length) * 100 : 0) + "%";
    fill.style.background = "var(--" + { same: "c", change: "b", drop: "h" }[k] + ")";
    bar.appendChild(fill);
    t.append(bar, el("span", "n", String(n[k])));
  });
  const k = doneCount();
  $("tallyNote").textContent = P.t("tallyNote", { k, n: FEATURES.length, r: rightCount() }) +
    (k === FEATURES.length ? " " + P.t("allDone", { n: FEATURES.length, s: n.same, c: n.change, d: n.drop }) : "");
}
function renderArgue() {
  const box = $("argue"), k = doneCount();
  box.innerHTML = "";
  box.appendChild(el("div", "q", P.t("argueQ")));
  if (k < NEED_FOR_ARGUE && argued == null) { box.appendChild(el("div", "hint", P.t("argueLock", { n: NEED_FOR_ARGUE, k }))); return; }
  const row = el("div", "choices");
  ARGUE.forEach((o, i) => {
    const b = el("button", argued === i ? "on " + (i === ARGUE_RIGHT ? "right" : "wrong") : "", o[L]);
    b.type = "button";
    b.setAttribute("aria-pressed", argued === i ? "true" : "false");
    b.addEventListener("click", () => {
      argued = i; renderArgue(); renderResult();
      const nb = $("argue").querySelectorAll(".choices button")[i];
      if (nb) nb.focus({ preventScroll: true });
    });
    row.appendChild(b);
  });
  box.appendChild(row);
  if (argued != null) {
    const ok = argued === ARGUE_RIGHT;
    const fb = el("div", "fb");
    fb.setAttribute("aria-live", "polite");
    fb.appendChild(el("span", "v " + (ok ? "ok" : "no"), (ok ? P.t("okV").replace(/ .*/, "") : "✗") + " "));
    fb.appendChild(document.createTextNode(ok ? P.t("aR") : P.t("a" + argued, { d: DIST })));
    box.appendChild(fb);
  }
}

// ---------- step 3 ----------
function renderRule() {
  const svg = $("tbar");
  svg.innerHTML = "";
  const W = Math.max(240, Math.round(svg.getBoundingClientRect().width) || 600), n = FEATURES.length;
  svg.setAttribute("viewBox", "0 0 " + W + " 64");
  let x = 0;
  KINDS.forEach((k) => {
    const w = (TOTAL[k] / n) * W;
    if (w <= 0) return;
    Play.svg("rect", { x: x + 1, y: 8, width: Math.max(0, w - 2), height: 36, rx: 8, fill: "var(--" + { same: "c", change: "b", drop: "h" }[k] + ")" }, svg);
    const t = Play.svg("text", { x: x + w / 2, y: 32, "text-anchor": "middle" }, svg);
    t.textContent = KHAN[k] + " " + TOTAL[k];
    x += w;
  });
  const cap = Play.svg("text", { x: 0, y: 60, class: "out" }, svg);
  cap.textContent = L === "zh" ? "崔颢 → 李白：共 " + n + " 处" : "Cui → Li: " + n + " features";
  const ul = $("stats");
  ul.innerHTML = "";
  const byLine = [];
  SAMEPLACE.forEach((o) => { const last = byLine[byLine.length - 1]; if (last && last.line === o.line && last.end === o.pos) { last.t += o.c; last.end++; } else byLine.push({ line: o.line, t: o.c, end: o.pos + 1 }); });
  const list = byLine.map((o) => (L === "zh" ? "第 " + (o.line + 1) + " 句「" : "line " + (o.line + 1) + " 「") + o.t + "」").join(L === "zh" ? "、" : ", ");
  [P.t("st1", { n, s: TOTAL.same, c: TOTAL.change, d: TOTAL.drop }), P.t("st2", { k: SAMEPLACE.length, list }), P.t("st3", { list: SHARED_RHYME.join(L === "zh" ? "、" : ", ") })]
    .forEach((s) => ul.appendChild(el("li", "", s)));
}
function renderResult() {
  $("rmain").textContent = P.t("rmain", { s: TOTAL.same, c: TOTAL.change, d: TOTAL.drop });
  $("rscore").textContent = P.t("rscore", { k: doneCount(), n: FEATURES.length, r: rightCount(), a: argued == null ? "—" : argued === ARGUE_RIGHT ? "✓" : "✗" });
}

// ---------- steps ----------
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { predicted = true; renderSolo(); });
buildPair();
const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, { n: NEED_FOR_ARGUE });
  $("predict").hidden = i !== 0;
  $("rule").hidden = i !== 2;
  $("rule").textContent = P.t("rule");
  $("v1").hidden = i !== 0; $("v2").hidden = i !== 1; $("v3").hidden = i !== 2;
  Play.live($("live"), "");
  if (i === 0) renderSolo();
  if (i === 1) { paintMarks(); renderPanel(); renderTally(); renderArgue(); }
  if (i === 2) renderRule();
});
$("reset").addEventListener("click", () => {
  sel = -1; predicted = false; argued = null;
  answers = FEATURES.map(() => null);
  pr.reset(); renderResult(); steps.go(0);
});
renderResult();
addEventListener("resize", () => { if (steps.i === 2) renderRule(); });
</script>
</body>
</html>

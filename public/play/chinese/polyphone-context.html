// Step 1: one sentence, 长 twice.
const GUESS = { t: ["院子里的", "小树", "长", "高了", "，", "影子", "也", "变", "长", "了", "。"],

const POEM = { t: ["长", "风", "破", "浪", "会", "有", "时"], k: 0, c: "长", r: 0 };

// ---- pure logic (also tested in node) ----
const PUNCT = /^[，。！？、；：]$/;
const isPunct = (w) => PUNCT.test(w);
const pairOf = (c) => PAIRS.find((p) => p.c === c);
const readingOf = (s) => pairOf(s.c).r[s.r];
const plain = (s) => s.t.join("");
// The span from the polyphone to its main clue, e.g. 「细又长」, 「长大了」.
function exampleOf(s) {
  const a = Math.min(s.k, s.clue[0]), b = Math.max(s.k, s.clue[0]);
  return s.t.slice(a, b + 1).filter((w) => !isPunct(w)).join("");
}
// Distance (in words) from the polyphone to its nearest clue, ignoring punctuation.
function clueDistance(s) {
  const words = s.t.map((w, i) => i).filter((i) => !isPunct(s.t[i]));
  const pos = (i) => words.indexOf(i);
  return Math.min(...s.clue.map((i) => Math.abs(pos(i) - pos(s.k))));
}
function stats(list) {
  let adj = 0, before = 0, after = 0;
  list.forEach((s) => {
    if (clueDistance(s) === 1) adj++;
    if (s.clue[0] < s.k) before++; else after++;
  });
  const chars = new Set(list.map((s) => s.c)).size;
  const readings = new Set(list.map((s) => s.c + s.r)).size;
  return { n: list.length, adj, before, after, chars, readings };
}
// Is tapping token i a correct clue? "ok" | "self" | "punct" | "no"
function clueCheck(s, i) {
  if (i === s.k) return "self";
  if (!s.t[i] || isPunct(s.t[i])) return "punct";
  return s.clue.includes(i) ? "ok" : "no";
}
// Order the two sentences of a character so the first one is not always reading 0.
function cardsFor(ci) {
  const c = PAIRS[ci].c;
  const two = SENTS.map((s, i) => i).filter((i) => SENTS[i].c === c);
  return ci % 2 ? two.slice().reverse() : two;
}

    allDone: "{n} 句全部完成！去第 3 步看看规律。",
    hRead: "读音", hMean: "意思", hEx: "本页的词",
    ruleCount: "{chars} 个字 · {readings} 个读音 · {n} 个句子。其中 {adj} / {n} 句，证据词就紧挨着这个字（{before} 句在前面，{after} 句在后面）。",
    poemQ: "加一题——李白（唐）的诗句：这里的「长」读什么？",
    poemOk: "cháng。「长风」是吹得又远又久的大风，说的是长短，不是生长。",
    poemNo: "不对哦：「长风」是吹得又远又久的大风，说的是长短，读 cháng。",
    legT: "有两个读音的字", legK: "证明读音的词",
    resultTitle: "我们发现", resultMain: "读音跟着意思走",
    resultNote: "一个字可以有两个读音，每个读音带着自己的意思。别光看字猜，看它跟哪个词连在一起。",
    explainK: "说一说",
    explainQ: "同学把「还」一律读成 hái。用「还在」和「还给」跟他讲讲为什么不对，再说说每次你是看哪个词判断的。",
    homeK: "家里做一做",
    homeQ: "和家人玩「一字两音」：一人说本页的一个字，另一人用它的两个读音各说一个词（长：长短、长大）。说对一个读音得一分，再交换。",
    foot: "读音依据《现代汉语词典》（第 7 版）和《普通话异读词审音表》（1985），只取现代用法。「教」作动词（教给别人）读 jiāo，在「教室、教师」等词里读 jiào。同一个读音也可能有几个意思（「班长」的长和「长大」一样读 zhǎng，意思是领头的人）；少数字不止两个读音，本页只取最常见的两个。诗句出自李白《行路难》（唐）；其余句子都是原创。CC BY 4.0 · Boxi Yu",
  },
});
const L = P.lang;
const $ = (id) => document.getElementById(id);
const cardsEl = $("cards"), rulesEl = $("rules"), scoreEl = $("score"), liveEl = $("live"), pick = $("pick");

let step = 0, guessed = false, ci = 0;
// per-sentence state: phase "py" | "clue" | "done"; firstOk: first pinyin pick right; wrongPy: index tried wrong; miss: wrong clue index
let state;
let poemPick = null;
function freshState() { state = SENTS.map(() => ({ phase: "py", firstOk: null, wrongPy: null, miss: null, msg: "", bad: false })); }
freshState();

function shake(el) { if (!Play.reduced && el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }
function arrowNav(el) {
  el.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const bs = [...el.querySelectorAll("button:not([disabled])")];
    const i = bs.indexOf(document.activeElement);
    if (i < 0) return;
    bs[Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, bs.length - 1)].focus();
    e.preventDefault();
  });
}

// One sentence as a row of word buttons. opts: { py: {k: text}, tg: Set, clue: Set, miss, pickable, onTap }
function sentenceRow(tokens, opts) {
  const row = document.createElement("div");
  row.className = "sent han";
  row.lang = "zh-CN";
  tokens.forEach((w, i) => {
    const b = document.createElement("button");
    b.type = "button";
    const p = isPunct(w);
    b.className = "tok" + (p ? " punct" : "") + (opts.tg.has(i) ? " tg" : "") + (opts.clue.has(i) ? " clue" : "") +
      (opts.miss === i ? " miss" : "") + (opts.pickable && !p && !opts.tg.has(i) && !opts.clue.has(i) ? " pickable" : "");
    const py = document.createElement("span");
    py.className = "py";
    py.textContent = opts.py[i] || "";
    const ww = document.createElement("span");
    ww.className = "w";
    ww.textContent = w;
    b.append(py, ww);
    b.dataset.i = i;
    if (p) { b.tabIndex = -1; b.setAttribute("aria-hidden", "true"); b.disabled = true; }
    else b.setAttribute("aria-label", w + (opts.py[i] ? " " + opts.py[i] : ""));
    if (opts.onTap && !p) b.addEventListener("click", () => opts.onTap(i, b));
    row.appendChild(b);
  });
  arrowNav(row);
  return row;
}

function legend(show) {
  const lg = $("legend");
  lg.innerHTML = "";
  if (!show) return;
  [["t", "legT"], ["k", "legK"]].forEach(([c, k]) => {
    const s = document.createElement("span");
    s.innerHTML = '<span class="dot ' + c + '"></span>';
    s.appendChild(document.createTextNode(P.t(k)));
    lg.appendChild(s);
  });
}

// ---- step 1 ----
function renderGuess() {
  cardsEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "card2";
  const py = {}, clue = new Set();
  if (guessed) GUESS.marks.forEach((m) => { py[m.k] = pairOf(m.c).r[m.r].py; clue.add(m.clue); });
  box.appendChild(sentenceRow(GUESS.t, { py, tg: new Set(GUESS.marks.map((m) => m.k)), clue, onTap: () => {} }));
  if (L === "en") { const g = document.createElement("div"); g.className = "gloss"; g.textContent = GUESS.en; box.appendChild(g); }
  const f = document.createElement("div");
  f.className = "cfb";
  f.textContent = P.t(guessed ? "guessShown" : "guessHint");
  box.appendChild(f);
  cardsEl.appendChild(box);
  scoreEl.textContent = "";
  legend(guessed);
  Play.live(liveEl, f.textContent);
}

// ---- step 2 ----
function buildPicker() {
  pick.querySelectorAll("button").forEach((b) => b.remove());
  PAIRS.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ch han";
    b.lang = "zh-CN";
    b.textContent = p.c;
    b.setAttribute("aria-pressed", i === ci ? "true" : "false");
    const done = cardsFor(i).filter((j) => state[j].phase === "done").length;
    b.setAttribute("aria-label", p.c + " · " + done + "/2");
    if (done === 2) { const t = document.createElement("span"); t.className = "tick"; t.textContent = "✓"; b.appendChild(t); }
    b.addEventListener("click", () => { ci = i; render(); const again = pick.querySelectorAll("button")[i]; if (again) again.focus(); });
    pick.appendChild(b);
  });
}
arrowNav(pick);

function tally() {
  const a = state.filter((s) => s.firstOk === true).length;
  const b = state.filter((s) => s.phase === "done").length;
  return { a, b, n: SENTS.length };
}

function renderCards() {
  cardsEl.innerHTML = "";
  cardsFor(ci).forEach((j) => {
    const s = SENTS[j], st = state[j], pair = pairOf(s.c);
    const box = document.createElement("div");
    box.className = "card2";
    const py = {};
    if (st.phase !== "py") py[s.k] = readingOf(s).py;
    else py[s.k] = "?";
    const clue = new Set(st.phase === "done" ? [st.found] : []);
    const row = sentenceRow(s.t, {
      py, tg: new Set([s.k]), clue, miss: st.miss, pickable: st.phase === "clue",
      onTap: (i, btn) => {
        if (st.phase === "py") { st.msg = P.t("pyFirst"); st.bad = true; render(); return; }
        if (st.phase === "done") return;
        const res = clueCheck(s, i);
        if (res === "ok") { st.phase = "done"; st.found = i; st.miss = null; st.msg = P.t("clueOk", { why: s.why[L] }); st.bad = false; }
        else { st.miss = res === "no" ? i : null; st.msg = P.t(res === "self" ? "clueSelf" : "clueNo", { w: s.t[i], c: s.c }); st.bad = true; }
        render();
        const again = cardsEl.querySelector('[data-card="' + j + '"] .sent [data-i="' + i + '"]');
        if (again) { again.focus(); if (res !== "ok") shake(again); }
      },
    });
    box.dataset.card = j;
    box.appendChild(row);
    if (L === "en") { const g = document.createElement("div"); g.className = "gloss"; g.textContent = s.en; box.appendChild(g); }
    const pr = document.createElement("div");
    pr.className = "pyrow";
    pr.setAttribute("role", "group");
    pr.setAttribute("aria-label", P.t("pickPy"));
    const lab = document.createElement("span");
    lab.textContent = P.t(st.phase === "py" ? "pickPy" : "readAs");
    pr.appendChild(lab);
    pair.r.forEach((rd, ri) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pyb" + (st.phase !== "py" && ri === s.r ? " ok" : "") + (st.phase === "py" && st.wrongPy === ri ? " no" : "");
      b.textContent = rd.py;
      b.dataset.ri = ri;
      b.setAttribute("aria-label", rd.py + " · " + (L === "zh" ? rd.zh : rd.en));
      b.addEventListener("click", () => {
        if (st.phase !== "py") return;
        const ok = ri === s.r;
        if (st.firstOk === null) st.firstOk = ok;
        if (ok) { st.phase = "clue"; st.wrongPy = null; st.msg = P.t("pyOk", { py: rd.py }); st.bad = false; }
        else {
          st.wrongPy = ri;
          const m = (x) => (L === "zh" ? x.zh : x.en);
          st.msg = P.t("pyNo", { a: m(pair.r[0]), b: m(pair.r[1]) });
          st.bad = true;
        }
        render();
        const sel = ok ? cardsEl.querySelector('[data-card="' + j + '"] .tok.pickable') : cardsEl.querySelector('[data-card="' + j + '"] [data-ri="' + ri + '"]');
        if (sel) { sel.focus(); if (!ok) shake(sel); }
      });
      pr.appendChild(b);
    });
    arrowNav(pr);
    box.appendChild(pr);
    const f = document.createElement("div");
    f.className = "cfb" + (st.bad ? " no" : "");
    f.textContent = st.msg;
    box.appendChild(f);
    cardsEl.appendChild(box);
  });
  const tl = tally();
  scoreEl.textContent = P.t("score", tl) + (tl.b === tl.n ? " — " + P.t("allDone", { n: tl.n }) : "");
  legend(true);
  const last = cardsFor(ci).map((j) => state[j].msg).filter(Boolean).pop();
  Play.live(liveEl, last || scoreEl.textContent);
}

// ---- step 3 ----
function renderRules() {
  rulesEl.innerHTML = "";
  const tb = document.createElement("table");
  tb.className = "rule";
  const hd = document.createElement("tr");
  ["", P.t("hRead") + " 1", P.t("hRead") + " 2"].forEach((h) => { const th = document.createElement("th"); th.textContent = h; hd.appendChild(th); });
  tb.appendChild(hd);
  PAIRS.forEach((p) => {
    const tr = document.createElement("tr");
    const c = document.createElement("td");
    c.className = "c han";
    c.lang = "zh-CN";
    c.textContent = p.c;
    tr.appendChild(c);
    p.r.forEach((rd, ri) => {
      const td = document.createElement("td");
      const s = SENTS.find((x) => x.c === p.c && x.r === ri);
      const ex = document.createElement("span");
      ex.className = "ex han";
      ex.lang = "zh-CN";
      ex.textContent = exampleOf(s);
      const pp = document.createElement("span");
      pp.className = "p";
      pp.textContent = rd.py + " ";
      const m = document.createElement("div");
      m.className = "m";
      m.textContent = L === "zh" ? rd.zh : rd.en;
      td.append(pp, ex, m);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  rulesEl.appendChild(tb);
  const c = document.createElement("p");
  c.className = "score";
  c.textContent = P.t("ruleCount", stats(SENTS));
  rulesEl.appendChild(c);
  // Bonus: a Tang poem line
  const poem = document.createElement("div");
  poem.className = "poem";
  const q = document.createElement("div");
  q.className = "gloss";
  q.textContent = P.t("poemQ");
  poem.appendChild(q);
  const py = {};
  if (poemPick !== null) py[POEM.k] = pairOf(POEM.c).r[POEM.r].py;
  poem.appendChild(sentenceRow(POEM.t, { py, tg: new Set([POEM.k]), clue: new Set(poemPick !== null ? [1] : []), onTap: () => {} }));
  const pr = document.createElement("div");
  pr.className = "pyrow";
  pairOf(POEM.c).r.forEach((rd, ri) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pyb" + (poemPick !== null && ri === POEM.r ? " ok" : "") + (poemPick === ri && ri !== POEM.r ? " no" : "");
    b.textContent = rd.py;
    b.addEventListener("click", () => { poemPick = ri; render(); });
    pr.appendChild(b);
  });
  arrowNav(pr);
  poem.appendChild(pr);
  if (poemPick !== null) {
    const f = document.createElement("div");
    f.className = "cfb";
    f.textContent = P.t(poemPick === POEM.r ? "poemOk" : "poemNo");
    poem.appendChild(f);
  }
  rulesEl.appendChild(poem);
  legend(false);
  Play.live(liveEl, c.textContent);
}

function render() {
  const rule = step === 2;
  pick.hidden = step !== 1;
  cardsEl.hidden = rule;
  scoreEl.hidden = rule;
  rulesEl.hidden = !rule;
  if (step === 0) renderGuess();
  else if (step === 1) { buildPicker(); renderCards(); }
  else renderRules();
}

const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { guessed = true; render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  render();
});
$("reset").addEventListener("click", () => {
  freshState(); ci = 0; guessed = false; poemPick = null;
  pr.reset(); st.go(0);
});
</script>
</body>
</html>

<script>
// Original sentences written for this page (not from any textbook). Chinese stays Chinese in both UI languages.
// Roles: S = subject (谁), V = predicate verb (做什么), O = object (什么) — the skeleton;
//        a = describes a thing, placed before a noun (定语); d = describes an action, placed before the verb (状语).
// `to` = index of the skeleton word a describing word belongs to.
const SENTS = [
  { en: "The chubby little tabby cat by the door is lazily basking in the sun.", skelEn: "The cat is basking in the sun.", t: [
    { w: "门口", r: "a", to: 3 }, { w: "那只", r: "a", to: 3 }, { w: "胖胖的", r: "a", to: 3 }, { w: "小花猫", r: "S" },
    { w: "懒洋洋地", r: "d", to: 5 }, { w: "晒着", r: "V" }, { w: "太阳", r: "O" }] },
  { en: "My little brother happily ate a big bowl of steaming-hot noodles.", skelEn: "Little brother ate noodles.", t: [
    { w: "我的", r: "a", to: 1 }, { w: "弟弟", r: "S" }, { w: "高高兴兴地", r: "d", to: 3 }, { w: "吃了", r: "V" },
    { w: "一大碗", r: "a", to: 6 }, { w: "热乎乎的", r: "a", to: 6 }, { w: "面条", r: "O" }] },
  { en: "A troop of hard-working little ants slowly carried off the biscuit crumbs on the ground.", skelEn: "The ants carried off the crumbs.", t: [
    { w: "一群", r: "a", to: 2 }, { w: "勤劳的", r: "a", to: 2 }, { w: "小蚂蚁", r: "S" }, { w: "慢慢地", r: "d", to: 4 },
    { w: "搬走了", r: "V" }, { w: "地上的", r: "a", to: 6 }, { w: "饼干渣", r: "O" }] },
  { en: "The grandpa in the park carefully practises tai chi every day.", skelEn: "Grandpa practises tai chi.", t: [
    { w: "公园里的", r: "a", to: 1 }, { w: "老爷爷", r: "S" }, { w: "每天", r: "d", to: 4 }, { w: "认真地", r: "d", to: 4 },
    { w: "打", r: "V" }, { w: "太极拳", r: "O" }] },
  { en: "That soft white cloud in the sky gently drifted away.", skelEn: "The cloud drifted away.", t: [
    { w: "天上", r: "a", to: 3 }, { w: "那朵", r: "a", to: 3 }, { w: "白白的", r: "a", to: 3 }, { w: "云", r: "S" },
    { w: "轻轻地", r: "d", to: 5 }, { w: "飘走了", r: "V" }] },
];
const CORE = ["S", "V", "O"];
const isCore = (tok) => CORE.includes(tok.r);

// ---- pure logic (also tested in node) ----
// Which skeleton roles are missing when the set `hidden` of token indices is removed?
function missingRoles(s, hidden) {
  return CORE.filter((r) => s.t.some((tok, i) => tok.r === r && hidden.has(i)));
}
const sentenceText = (s, keep) => s.t.filter((_, i) => keep(i)).map((x) => x.w).join("") + "。";
const skeletonText = (s) => sentenceText(s, (i) => isCore(s.t[i]));
const fullText = (s) => sentenceText(s, () => true);
const decoIdx = (s) => s.t.map((x, i) => (isCore(x) ? -1 : i)).filter((i) => i >= 0);
// Placing describing word `ti` into the slot in front of skeleton word `hi`: "ok" | "kind" | "head".
function placeCheck(s, ti, hi) {
  const tok = s.t[ti], head = s.t[hi];
  if (!tok || !head || isCore(tok) || !isCore(head)) return "kind";
  const wantNoun = tok.r === "a";
  const isNoun = head.r === "S" || head.r === "O";
  if (wantNoun !== isNoun) return "kind";
  return tok.to === hi ? "ok" : "head";
}
// Deterministic shuffle so the tray order is not the answer order.
function shuffled(arr, seed) {
  const a = arr.slice();
  let x = seed * 9301 + 49297;
  for (let i = a.length - 1; i > 0; i--) {
    x = (x * 9301 + 49297) % 233280;
    const j = Math.floor((x / 233280) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const L = P.lang;
const $ = (id) => document.getElementById(id);
const tilesEl = $("tiles"), trayEl = $("tray"), readout = $("readout"), rulesEl = $("rules"), fb3 = $("fb3"), liveEl = $("live");

let step = 0, si = 0, guessed = false;
let hidden = new Set();
let placed = new Set(), sel = null;

function tile(tok, extra) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile " + tok.r + (extra ? " " + extra : "");
  const w = document.createElement("span");
  w.className = "w";
  w.textContent = tok.w;
  w.lang = "zh-CN";
  const g = document.createElement("span");
  g.className = "g";
  g.textContent = P.t(tok.r);
  b.append(w, g);
  return b;
}
// Arrow keys move focus between the buttons of a group.
function arrowNav(el) {
  el.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const bs = [...el.querySelectorAll("button")];
    const i = bs.indexOf(document.activeElement);
    if (i < 0) return;
    const j = Play.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, bs.length - 1);
    bs[j].focus();
    e.preventDefault();
  });
}
arrowNav(tilesEl); arrowNav(trayEl);
function shake(el) { if (!Play.reduced && el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); } }

// ---- sentence picker ----
const pick = $("pick");
const pickBtns = SENTS.map((s, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "small";
  b.textContent = String(i + 1);
  b.setAttribute("aria-label", fullText(s));
  b.addEventListener("click", () => { si = i; hidden = new Set(); placed = new Set(); sel = null; fb3.textContent = ""; render(); });
  pick.appendChild(b);
  return b;
});

function legend() {
  const lg = $("legend");
  lg.innerHTML = "";
  [["k", "legK"], ["ac", "legA"], ["dc", "legD"]].forEach(([c, k]) => {
    const s = document.createElement("span");
    s.innerHTML = '<span class="dot ' + c + '"></span>';
    s.appendChild(document.createTextNode(P.t(k)));
    lg.appendChild(s);
  });
}

function missText(miss) { return miss.map((r) => P.t(r + "_")).join(P.t("and")); }

function readoutBox(zh, status, cls, extra) {
  readout.innerHTML = "";
  const lab = document.createElement("div");
  lab.className = "lab";
  lab.textContent = P.t("now");
  const z = document.createElement("div");
  z.className = "zh han";
  z.lang = "zh-CN";
  z.textContent = zh;
  readout.append(lab, z);
  if (extra) {
    const e = document.createElement("div");
    e.className = "en";
    e.textContent = extra;
    readout.appendChild(e);
  }
  const st = document.createElement("div");
  st.className = "status " + cls;
  st.textContent = status;
  readout.appendChild(st);
}

// ---- step 1 & 2: take apart ----
function renderTiles() {
  const s = SENTS[si];
  tilesEl.innerHTML = "";
  s.t.forEach((tok, i) => {
    const off = hidden.has(i);
    const extra = step === 0 && !guessed ? "plain" : off ? (isCore(tok) ? "off broken" : "off") : "";
    const b = tile(tok, extra);
    if (step === 0 && !guessed) b.querySelector(".g").textContent = " ";
    b.setAttribute("aria-pressed", off ? "false" : "true");
    b.setAttribute("aria-label", tok.w + " · " + P.t(tok.r));
    b.addEventListener("click", () => {
      if (step !== 1) { st.go(1); return; }
      if (hidden.has(i)) hidden.delete(i); else hidden.add(i);
      if (hidden.has(i) && isCore(tok)) fb3.textContent = P.t("hideCore", { w: tok.w });
      else fb3.textContent = "";
      render();
      const again = tilesEl.querySelectorAll("button")[i];
      if (again) { again.focus(); if (hidden.has(i) && isCore(tok)) shake(again); }
    });
    tilesEl.appendChild(b);
  });
  const miss = missingRoles(s, hidden);
  const k = s.t.length - hidden.size;
  const shown = sentenceText(s, (i) => !hidden.has(i));
  const allDeco = decoIdx(s).every((i) => hidden.has(i));
  const gloss = L !== "en" || miss.length ? "" : allDeco ? P.t("glossSk") + ": " + s.skelEn : P.t("gloss") + ": " + s.en;
  if (miss.length) readoutBox(k ? shown : "……", P.t("broken", { miss: missText(miss) }), "no", gloss);
  else if (!hidden.size) readoutBox(shown, P.t("okFull", { n: s.t.length }), "ok", gloss);
  else readoutBox(shown, P.t("ok", { k, n: s.t.length }) + " " + P.t("skelSame", { s: skeletonText(s) }), "ok", gloss);
  const strip = $("strip");
  strip.setAttribute("aria-pressed", allDeco ? "true" : "false");
  strip.textContent = P.t(allDeco ? "stripOn" : "strip");
  Play.live(liveEl, miss.length ? P.t("broken", { miss: missText(miss) }) : shown);
}

$("strip").addEventListener("click", () => {
  if (step !== 1) st.go(1);
  const s = SENTS[si];
  const allDeco = decoIdx(s).every((i) => hidden.has(i));
  hidden = new Set(hidden);
  decoIdx(s).forEach((i) => (allDeco ? hidden.delete(i) : hidden.add(i)));
  fb3.textContent = "";
  render();
});
$("say").addEventListener("click", () => {
  const s = SENTS[si];
  const text = step === 2 ? builtText() : sentenceText(s, (i) => !hidden.has(i));
  Play.speak(text, "zh-CN");
});

// ---- step 3: build up ----
function builtText() { const s = SENTS[si]; return sentenceText(s, (i) => isCore(s.t[i]) || placed.has(i)); }
function tryPlace(ti, hi) {
  const s = SENTS[si];
  const res = placeCheck(s, ti, hi);
  const tok = s.t[ti], head = s.t[hi];
  if (res === "ok") {
    placed.add(ti);
    sel = null;
    const total = decoIdx(s).length;
    fb3.textContent = placed.size === total
      ? P.t("done", { k: total, s: skeletonText(s).slice(0, -1) })
      : P.t("fbOk", { w: tok.w, h: head.w }) + " " + P.t("progress", { k: placed.size, n: total });
  } else {
    fb3.textContent = res === "kind" ? P.t(tok.r === "a" ? "fbKindA" : "fbKindD", { w: tok.w }) : P.t("fbHead", { w: tok.w, h: head.w, t: s.t[tok.to].w });
  }
  render();
  if (res !== "ok") shake(trayEl.querySelector('[data-i="' + ti + '"]'));
  const slot = tilesEl.querySelector('[data-slot="' + hi + '"]');
  if (res === "ok" && slot) slot.focus();
  else { const t = trayEl.querySelector('[data-i="' + ti + '"]'); if (t) t.focus(); }
  return res;
}
function renderBuild() {
  const s = SENTS[si];
  tilesEl.innerHTML = "";
  s.t.forEach((tok, i) => {
    if (!isCore(tok)) return;
    const slot = document.createElement("button");
    slot.type = "button";
    slot.className = "slot" + (sel !== null ? " ready" : "");
    slot.dataset.slot = i;
    slot.setAttribute("aria-label", "+ → " + tok.w);
    const inSlot = s.t.map((x, j) => j).filter((j) => placed.has(j) && s.t[j].to === i);
    if (!inSlot.length) { const p = document.createElement("span"); p.className = "plus"; p.textContent = "+"; slot.appendChild(p); }
    inSlot.forEach((j) => {
      const tt = tile(s.t[j]);
      const span = document.createElement("span");
      span.className = tt.className;
      span.innerHTML = tt.innerHTML;
      slot.appendChild(span);
    });
    slot.addEventListener("click", () => {
      if (sel === null) { fb3.textContent = P.t("pickFirst"); return; }
      tryPlace(sel, i);
    });
    tilesEl.appendChild(slot);
    const core = tile(tok);
    core.tabIndex = -1;
    core.disabled = true;
    core.style.cursor = "default";
    tilesEl.appendChild(core);
  });
  trayEl.innerHTML = "";
  shuffled(decoIdx(s), si + 1).filter((i) => !placed.has(i)).forEach((i) => {
    const b = tile(s.t[i], sel === i ? "sel" : "");
    b.dataset.i = i;
    b.setAttribute("aria-pressed", sel === i ? "true" : "false");
    b.addEventListener("click", () => {
      if (b.dataset.dragged) { delete b.dataset.dragged; return; }
      sel = sel === i ? null : i;
      fb3.textContent = sel === null ? "" : P.t("selected", { w: s.t[i].w });
      render();
      const again = trayEl.querySelector('[data-i="' + i + '"]');
      if (again) again.focus();
    });
    dragify(b, i);
    trayEl.appendChild(b);
  });
  const total = decoIdx(s).length;
  readoutBox(builtText(), P.t("progress", { k: placed.size, n: total }), "ok", L === "en" ? (placed.size === total ? P.t("gloss") + ": " + s.en : P.t("glossSk") + ": " + s.skelEn) : "");
  Play.live(liveEl, builtText());
}
// Pointer drag from the tray onto a slot (mouse and touch); a plain tap still selects.
function dragify(b, i) {
  let start = null, ghost = null, over = null;
  b.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY }; b.setPointerCapture(e.pointerId); });
  b.addEventListener("pointermove", (e) => {
    if (!start) return;
    if (!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
      ghost = b.cloneNode(true);
      ghost.classList.add("ghost");
      document.body.appendChild(ghost);
    }
    if (!ghost) return;
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const slot = el && el.closest("[data-slot]");
    if (over && over !== slot) over.classList.remove("over");
    over = slot;
    if (over) over.classList.add("over");
  });
  const end = (e, cancel) => {
    if (!start) return;
    start = null;
    if (!ghost) return;
    ghost.remove(); ghost = null;
    b.dataset.dragged = "1";
    setTimeout(() => delete b.dataset.dragged, 0);
    if (over) over.classList.remove("over");
    const slot = over;
    over = null;
    if (!cancel && slot) tryPlace(i, +slot.dataset.slot);
  };
  b.addEventListener("pointerup", (e) => end(e, false));
  b.addEventListener("pointercancel", (e) => end(e, true));
}

// ---- step 4: rule ----
function renderRules() {
  rulesEl.innerHTML = "";
  let words = 0, skel = 0, stand = 0;
  SENTS.forEach((s) => {
    words += s.t.length;
    skel += s.t.filter(isCore).length;
    if (!missingRoles(s, new Set(decoIdx(s))).length) stand++;
    const d = document.createElement("div");
    d.className = "pair";
    const f = document.createElement("div");
    f.className = "full han";
    f.lang = "zh-CN";
    s.t.forEach((tok) => { const sp = document.createElement("span"); sp.className = isCore(tok) ? "k" : "m"; sp.textContent = tok.w; f.appendChild(sp); });
    f.appendChild(document.createTextNode("。"));
    const k = document.createElement("div");
    k.className = "sk";
    k.appendChild(document.createTextNode(P.t("skel", { s: "" })));
    const b = document.createElement("b");
    b.lang = "zh-CN";
    b.textContent = s.t.filter(isCore).map((x) => x.w).join(" + ");
    k.appendChild(b);
    if (L === "en") k.appendChild(document.createTextNode(" — " + s.skelEn));
    d.append(f, k);
    rulesEl.appendChild(d);
  });
  const c = document.createElement("div");
  c.className = "status ok";
  c.textContent = P.t("ruleCount", { n: SENTS.length, s: stand, w: words, k: skel });
  rulesEl.appendChild(c);
  Play.live(liveEl, c.textContent);
}

function render() {
  pickBtns.forEach((b, i) => b.setAttribute("aria-pressed", i === si ? "true" : "false"));
  const build = step === 2, rule = step === 3;
  pick.hidden = rule || (step === 0);
  tilesEl.hidden = rule;
  $("tools2").hidden = rule;
  $("strip").hidden = step !== 1;
  readout.hidden = rule || (step === 0 && !guessed);
  trayEl.hidden = !build;
  rulesEl.hidden = !rule;
  if (rule) renderRules();
  else if (build) renderBuild();
  else renderTiles();
}

const skel0 = skeletonText(SENTS[0]).replace("。", "");
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { skel: skel0 }), wrong: P.t("wrong", { skel: skel0 }),
}, () => { guessed = true; render(); });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  if (i === 0) si = 0;
  if (i === 2) { sel = null; }
  fb3.textContent = "";
  render();
});
$("reset").addEventListener("click", () => {
  si = 0; hidden = new Set(); placed = new Set(); sel = null; guessed = false;
  pr.reset(); fb3.textContent = ""; st.go(0);
});
legend();
render();
</script>

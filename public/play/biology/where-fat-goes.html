// ---------- numbers (all computed here) ----------
const AM = { C: 12.011, H: 1.008, O: 15.999 };
const FAT = { C: 55, H: 104, O: 6 };                         // C55H104O6 + 78 O2 -> 55 CO2 + 52 H2O
const RX = { O2: 78, CO2: 55, H2O: 52 };
const M = {
  FAT: FAT.C * AM.C + FAT.H * AM.H + FAT.O * AM.O,
  O2: 2 * AM.O, CO2: AM.C + 2 * AM.O, H2O: 2 * AM.H + AM.O,
};
const PER = { O2: RX.O2 * M.O2 / M.FAT, CO2: RX.CO2 * M.CO2 / M.FAT, H2O: RX.H2O * M.H2O / M.FAT }; // kg per kg fat
// the fat's own atoms: all C -> CO2, all H -> H2O, its O split 2/3 : 1/3 (Meerman & Brown)
const O_TO_CO2 = FAT.O * 2 / 3, O_TO_H2O = FAT.O - O_TO_CO2;
const OWN = {
  CO2: (FAT.C * AM.C + O_TO_CO2 * AM.O) / M.FAT,
  H2O: (FAT.H * AM.H + O_TO_H2O * AM.O) / M.FAT,
};
const REPORTED = { kg: 10, CO2: 8.4, H2O: 1.6 };
const BREATH_G = 0.04, BPM = 12;                             // g CO2 per quiet breath (approx.), breaths per minute
const E_FAT = 37e3, C_LIGHT = 299792458;                     // J per g of fat; m/s
const energy = (kg) => { const J = kg * 1000 * E_FAT; return { MJ: J / 1e6, ug: J / (C_LIGHT * C_LIGHT) * 1e9 }; };
function burnKg(kg) {
  kg = Play.clamp(+kg || 0, 0, 1e6);
  const co2 = kg * PER.CO2, breaths = co2 * 1000 / BREATH_G;
  return {
    kg, o2: kg * PER.O2, co2, h2o: kg * PER.H2O, ownCO2: kg * OWN.CO2, ownH2O: kg * OWN.H2O,
    breaths, perKg: PER.CO2 * 1000 / BREATH_G, days: breaths / BPM / 60 / 24,
  };
}
const f = Play.fmt;
const pct = (x) => f(x * 100, 1);
const big = (x) => (Number.isFinite(x) ? (Math.round(x / 100) * 100).toLocaleString(P.lang === "zh" ? "zh-CN" : "en-US") : "—");
const E10 = energy(10);

// ---------- one molecule, atom by atom ----------
// fat atoms spread evenly by type; destination: CO2 bin as (C,O,O) triples, water bin as (O,H,H) triples
function buildAtoms() {
  const counts = { C: FAT.C, H: FAT.H, O: FAT.O }, N = FAT.C + FAT.H + FAT.O, placed = { C: 0, H: 0, O: 0 };
  const fat = [];
  for (let k = 0; k < N; k++) {
    let best = "C", bd = -Infinity;
    for (const t in counts) { const d = (k + 1) * counts[t] / N - placed[t]; if (placed[t] < counts[t] && d > bd) { bd = d; best = t; } }
    placed[best]++;
    fat.push({ el: best, src: k });
  }
  const binC = [], binW = [];                                   // slots
  const fatOToC = Math.round(O_TO_CO2), fatOToW = FAT.O - fatOToC;
  for (let m = 0; m < RX.CO2; m++) {
    binC.push({ el: "C", fat: true });
    const fo = Math.floor((m + 1) * fatOToC / RX.CO2) > Math.floor(m * fatOToC / RX.CO2);
    binC.push({ el: "O", fat: fo }, { el: "O", fat: false });
  }
  for (let m = 0; m < RX.H2O; m++) {
    const fo = Math.floor((m + 1) * fatOToW / RX.H2O) > Math.floor(m * fatOToW / RX.H2O);
    binW.push({ el: "O", fat: fo }, { el: "H", fat: true }, { el: "H", fat: true });
  }
  // match fat atoms to fat slots of the same element
  const free = (bin, name) => bin.map((s, i) => ({ s, i, bin: name })).filter((x) => x.s.fat);
  const pool = free(binC, "C").concat(free(binW, "W"));
  fat.forEach((a) => { const j = pool.findIndex((x) => x.s.el === a.el); const x = pool.splice(j, 1)[0]; a.bin = x.bin; a.slot = x.i; });
  const air = [];
  binC.forEach((s, i) => { if (!s.fat) air.push({ el: "O", bin: "C", slot: i }); });
  binW.forEach((s, i) => { if (!s.fat) air.push({ el: "O", bin: "W", slot: i }); });
  return { fat, air, nC: binC.length, nW: binW.length };
}
const ATOMS = buildAtoms();

// ---------- DOM ----------
const fig = document.getElementById("fig");
const kgIn = document.getElementById("kg"), burnIn = document.getElementById("burn");
const playBtn = document.getElementById("playBtn");
const extra = document.getElementById("extra"), liveEl = document.getElementById("live");
let step = 0, predictNote = "", raf = 0, last = 0, pf = 0;
document.getElementById("resultNote").textContent = P.t("resultNote", { fp: pct(OWN.CO2), wp: pct(OWN.H2O) });

const S = (tag, a, p) => Play.svg(tag, a, p || fig);
function text(x, y, s, cls, anchor) {
  const t = S("text", { x, y, class: "lbl " + (cls || ""), "text-anchor": anchor || "start" });
  t.textContent = s;
  return t;
}
function arrow(x1, y1, x2, y2) {
  S("line", { x1, y1, x2, y2, class: "arrow" });
  const a = Math.atan2(y2 - y1, x2 - x1), L = 9;
  const p = [[x2, y2], [x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45)], [x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45)]];
  S("polygon", { points: p.map((q) => q.join(",")).join(" "), class: "ah" });
}
function bar(x, y, w, h, frac, cls) {
  S("rect", { x, y, width: Math.max(0, w), height: h, rx: 3, class: "barbg" });
  const v = Play.clamp(frac, 0, 1) * w;
  if (v > 0) S("rect", { x, y, width: Math.max(1, v), height: h, rx: 3, class: cls });
}
function size() {
  const r = fig.getBoundingClientRect();
  const W = Math.max(280, Math.round(r.width || 600)), H = Math.max(240, Math.round(r.height || 360));
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  return { W, H };
}

function drawGuess(W, H) {
  const cx = W / 2, s = H / 360;
  const hy = 70 * s, tt = 104 * s, tb = 236 * s, tw = 74 * s;
  S("circle", { cx, cy: hy, r: 24 * s, class: "body" });
  S("rect", { x: cx - tw / 2, y: tt, width: tw, height: tb - tt, rx: 22 * s, class: "body" });
  S("rect", { x: cx - tw / 2 + 6, y: tb - 8, width: 22 * s, height: H - 30 - tb, rx: 8, class: "body" });
  S("rect", { x: cx + tw / 2 - 6 - 22 * s, y: tb - 8, width: 22 * s, height: H - 30 - tb, rx: 8, class: "body" });
  S("ellipse", { cx, cy: 190 * s, rx: 28 * s, ry: 22 * s, class: "fat" });
  text(cx, 195 * s, "?", "q", "middle").setAttribute("class", "q");
  const side = Math.min(W / 2 - 14, 170);
  // breath: from the mouth, up and right
  arrow(cx + 26 * s, hy + 6, cx + side * 0.62, 34 * s);
  text(cx + side * 0.62 + 4, 30 * s, P.t("fA"), "m", W < 420 ? "end" : "start");
  // sweat & urine: left
  arrow(cx - tw / 2 - 4, 170 * s, cx - side * 0.7, 150 * s);
  text(cx - side * 0.7, 138 * s, P.t("fB"), "m", W < 420 ? "start" : "middle");
  // heat: wavy lines, right
  for (let i = 0; i < 3; i++) {
    const x0 = cx + tw / 2 + 8 + i * 12, y0 = 150 * s;
    S("path", { d: `M${x0} ${y0 + 40 * s} q6 -8 0 -16 q-6 -8 0 -16 q6 -8 0 -16`, class: "wave" });
  }
  text(cx + side * 0.75, 170 * s, P.t("fC"), "m", "middle");
  // toilet: down
  arrow(cx - tw / 2 - 2, H - 56, cx - side * 0.62, H - 26);
  text(cx - side * 0.62 - 6, H - 10, P.t("fD"), "m", W < 420 ? "start" : "end");
  text(cx + tw / 2 + 6, 222 * s, P.t("fFat"), "m b");
}

function drawWeigh(W, H) {
  const r = burnKg(+kgIn.value), narrow = W < 420, tight = H < 340;
  text(W / 2, 20, "C₅₅H₁₀₄O₆ + 78 O₂ → 55 CO₂ + 52 H₂O", narrow ? "eqs" : "eq", "middle");
  const lw = narrow ? 74 : 92, vw = 72, bw = W - 24 - lw - vw, max = 10 * PER.O2, rh = tight ? 22 : 25;
  const rows = [[P.t("mFat"), r.kg, "bF"], [P.t("mO2"), r.o2, "bO"], [P.t("mCO2"), r.co2, "bC"], [P.t("mH2O"), r.h2o, "bW"]];
  rows.forEach((row, i) => {
    const y = 30 + i * rh + (i >= 2 ? 6 : 0);
    text(12, y + 14, row[0], "m");
    bar(12 + lw, y + 3, bw, 13, row[1] / max, row[2]);
    text(W - 12, y + 15, f(row[1], 2) + " kg", "", "end");
  });
  let y = 30 + 4 * rh + 22;
  text(W / 2, y, P.t("fBal", { a: f(r.kg + r.o2, 2), b: f(r.co2 + r.h2o, 2) }), "m", "middle");
  y += tight ? 22 : 28;
  text(12, y, P.t("fOwn", { kg: f(r.kg, 1) }), "m b");
  const w2 = W - 24, wc = OWN.CO2 * w2;
  if (r.kg > 0) {
    S("rect", { x: 12, y: y + 7, width: wc - 2, height: 18, rx: 3, class: "bC" });
    S("rect", { x: 12 + wc, y: y + 7, width: w2 - wc, height: 18, rx: 3, class: "bW" });
  } else S("rect", { x: 12, y: y + 7, width: w2, height: 18, rx: 3, class: "barbg" });
  y += 42;
  if (narrow) {                                            // stacked so the two labels never overlap
    text(12, y, P.t("fLungs", { v: f(r.ownCO2, 2), p: pct(OWN.CO2) }), "b");
    text(12, y + 16, P.t("fWater", { v: f(r.ownH2O, 2), p: pct(OWN.H2O) }), "m");
    y += 16;
  } else {
    text(12, y, P.t("fLungs", { v: f(r.ownCO2, 2), p: pct(OWN.CO2) }), "b");
    text(W - 12, y, P.t("fWater", { v: f(r.ownH2O, 2), p: pct(OWN.H2O) }), "b", "end");
  }
  // reported vs computed, as a small table: label | CO2 | water
  const ten = burnKg(REPORTED.kg), ty = y + 12, x1 = W - 16, x0 = W - (narrow ? 76 : 96);
  S("rect", { x: 8, y: ty, width: W - 16, height: 58, rx: 8, class: "panel" });
  text(16, ty + 16, P.t("fTen"), "m b");
  text(x0, ty + 16, P.t("fColC"), "m b", "end");
  text(x1, ty + 16, P.t("fColW"), "m b", "end");
  [[P.t("fRep"), f(REPORTED.CO2, 1), f(REPORTED.H2O, 1)], [P.t("fCalc"), f(ten.ownCO2, 2), f(ten.ownH2O, 2)]].forEach((row, i) => {
    const yy = ty + 34 + i * 17;
    text(16, yy, row[0], "m");
    text(x0, yy, row[1], "b", "end");
    text(x1, yy, row[2], "b", "end");
  });
}

const ease = (t) => t * t * (3 - 2 * t);
function gridSlots(n, x, y, w, h, triples) {
  // triples: lay atoms out as molecules of 3 side by side
  const nm = triples ? Math.ceil(n / 3) : n;
  const aspect = triples ? 3 : 1;
  const cols = Math.max(1, Math.round(Math.sqrt(nm * w / (h * aspect))));
  const rows = Math.ceil(nm / cols);
  const cw = w / cols, ch = h / rows, out = [];
  const r = Math.min(triples ? cw / 3 : cw, ch) * 0.36;
  for (let i = 0; i < n; i++) {
    const m = triples ? Math.floor(i / 3) : i, k = triples ? i % 3 : 0;
    const col = m % cols, row = Math.floor(m / cols);
    const px = triples ? x + col * cw + cw * (0.2 + 0.3 * k) : x + (col + 0.5) * cw;
    out.push([px, y + (row + 0.5) * ch]);
  }
  return { pos: out, r: Math.min(5, Math.max(1.6, r)) };
}

function drawAtoms(W, H) {
  const p = +burnIn.value / 100, narrow = W < 420;
  const mw = W * (narrow ? 0.34 : 0.36), bx = mw + (narrow ? 22 : 34), bw = W - bx - 8;
  const top = 26, legY = H - 8, bottom = H - 26;
  text(10, 16, P.t("fMol"), "m b");
  const mol = gridSlots(ATOMS.fat.length, 8, top, mw - 8, bottom - top - 24, false);
  const gap = 8, bh = (bottom - 4 - gap) / 2;
  const bins = { C: { y: 4, n: ATOMS.nC }, W: { y: 4 + bh + gap, n: ATOMS.nW } };
  const binGrid = {};
  for (const k in bins) {
    const b = bins[k];
    S("rect", { x: bx, y: b.y, width: bw, height: bh, rx: 8, class: "bin" });
    binGrid[k] = gridSlots(b.n, bx + 6, b.y + 22, bw - 12, bh - 26, true);
  }
  const src = [mw / 2 + 4, bottom - 6];
  text(src[0], bottom + 4, P.t("fAirIn"), "m", "middle");
  const all = ATOMS.fat.length + ATOMS.air.length;
  const massIn = { C: 0, W: 0 };
  const draw1 = (a, from, idx, isAir) => {
    const d = (idx / all) * 0.6, t = ease(Play.clamp((p - d) / 0.4, 0, 1));
    const g = binGrid[a.bin], to = g.pos[a.slot];
    const x = from[0] + (to[0] - from[0]) * t, y = from[1] + (to[1] - from[1]) * t;
    const r = mol.r + (g.r - mol.r) * t;
    if (isAir) {
      if (t <= 0) return;
      S("circle", { cx: x, cy: y, r: Math.max(1.4, g.r - 0.6), class: "aOair", opacity: Math.min(1, t * 3) });
    } else {
      S("circle", { cx: x, cy: y, r, class: "a" + a.el });
      massIn[a.bin] += AM[a.el] * t;
    }
  };
  // interleave fat and air atoms in time so both streams move together
  ATOMS.fat.forEach((a, i) => draw1(a, mol.pos[a.src], Math.round(i * all / ATOMS.fat.length), false));
  ATOMS.air.forEach((a, i) => draw1(a, src, Math.round(i * all / ATOMS.air.length), true));
  const lp = massIn.C / M.FAT, wp = massIn.W / M.FAT;
  text(bx + 8, bins.C.y + 16, P.t("fBinC"), "m b");
  text(bx + bw - 8, bins.C.y + 16, pct(lp) + "%", "b", "end");
  text(bx + 8, bins.W.y + 16, P.t("fBinW"), "m b");
  text(bx + bw - 8, bins.W.y + 16, pct(wp) + "%", "b", "end");
  // legend
  const items = [["aC", P.t("lC")], ["aH", P.t("lH")], ["aO", P.t("lO")], ["aOair", P.t("lOa")]];
  const dx = narrow ? (W - 16) / 4 : Math.min(110, (W - 16) / 4);
  items.forEach((it, i) => {
    const x = 12 + i * dx;
    S("circle", { cx: x, cy: legY - 4, r: 4.5, class: it[0] });
    text(x + 9, legY, it[1], "m");
  });
  Play.live(liveEl, P.t("live3", { p: f(p * 100, 0), lp: pct(lp), wp: pct(wp), rp: pct(Math.max(0, 1 - lp - wp)) }));
}

function drawRule(W, H) {
  const narrow = W < 420, ten = burnKg(10);
  text(12, 22, P.t("f10"), "m b");
  const w2 = W - 24, wc = OWN.CO2 * w2;
  S("rect", { x: 12, y: 32, width: wc - 2, height: 24, rx: 3, class: "bC" });
  S("rect", { x: 12 + wc, y: 32, width: w2 - wc, height: 24, rx: 3, class: "bW" });
  const u = P.lang === "zh" ? " 千克" : " kg";
  text(12, 76, P.t("mCO2") + " " + f(ten.ownCO2, 1) + u, "b");
  text(W - 12, 76, P.t("mH2O") + " " + f(ten.ownH2O, 1) + u, "b", "end");
  text(12, 104, P.t("fEn", { mj: f(E10.MJ, 0), ug: f(E10.ug, 1) }), "m b");
  S("rect", { x: 12, y: 112, width: w2, height: 10, rx: 3, class: "barbg" });
  text(12, 140, P.t("fEn2"), "m");
  // the cycle: you ⇄ plant
  const cy = Math.min(H - 70, 220), r = narrow ? 30 : 36, xl = W * 0.24, xr = W * 0.76;
  S("circle", { cx: xl, cy, r, class: "body" });
  S("circle", { cx: xr, cy, r, class: "bin" });
  text(xl, cy + 5, P.t("fYou"), "b", "middle");
  text(xr, cy + 5, P.t("fPlant"), "b", "middle");
  arrow(xl + r * 0.7, cy - r * 0.75, xr - r * 0.7, cy - r * 0.75);
  text(W / 2, cy - r * 0.75 - 8, P.t("fOut"), "m", "middle");
  arrow(xr - r * 0.7, cy + r * 0.75, xl + r * 0.7, cy + r * 0.75);
  text(W / 2, cy + r * 0.75 + 18, P.t("fIn"), "m", "middle");
  text(W / 2, Math.min(H - 8, cy + r + 44), P.t("fLoop"), "m", "middle");
}

function draw() {
  const { W, H } = size();
  fig.innerHTML = "";
  if (step === 0) drawGuess(W, H);
  else if (step === 1) drawWeigh(W, H);
  else if (step === 2) drawAtoms(W, H);
  else drawRule(W, H);
  const r = burnKg(+kgIn.value);
  document.getElementById("kgVal").textContent = f(r.kg, 1) + (P.lang === "zh" ? " 千克" : " kg");
  document.getElementById("burnVal").textContent = f(+burnIn.value, 0) + "%";
  playBtn.textContent = raf ? P.t("pause") : P.t("play");
  if (step === 0) { extra.textContent = predictNote; Play.live(liveEl, ""); }
  if (step === 1) {
    extra.textContent = r.kg > 0 ? P.t("x2", {
      kg: f(r.kg, 1), fc: f(r.ownCO2, 2), fw: f(r.ownH2O, 2), o2: f(r.o2, 2), co2: f(r.co2, 2),
      br: big(r.breaths), bpk: big(r.perKg), days: f(r.days, r.days < 10 ? 1 : 0),
    }) : P.t("x2zero");
    Play.live(liveEl, P.t("live2", { kg: f(r.kg, 1), o2: f(r.o2, 2), co2: f(r.co2, 2), w: f(r.h2o, 2), fp: pct(OWN.CO2), wp: pct(OWN.H2O) }));
  }
  if (step === 2) extra.textContent = P.t("x3");
  if (step === 3) {
    const ten = burnKg(10);
    extra.textContent = P.t("x4", { mj: f(E10.MJ, 0), ug: f(E10.ug, 1), bn: f(10 / (E10.ug * 1e-9) / 1e9, 1), yi: f(10 / (E10.ug * 1e-9) / 1e8, 0) });
    Play.live(liveEl, P.t("live4", { fc: f(ten.ownCO2, 2), fw: f(ten.ownH2O, 2), mj: f(E10.MJ, 0), ug: f(E10.ug, 1) }));
  }
}

// ---------- animation (never autoplays) ----------
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
function tick(t) {
  const dt = last ? (t - last) / 1000 : 0;
  last = t;
  pf = Play.clamp(pf + dt * 25, 0, 100);       // 4 s for the whole burn
  burnIn.value = pf;
  if (pf >= 100) { stop(); draw(); return; }
  raf = requestAnimationFrame(tick);
  draw();
}
playBtn.addEventListener("click", () => {
  if (raf) { stop(); draw(); return; }
  if (+burnIn.value >= 100) burnIn.value = 0;
  if (Play.reduced) { burnIn.value = 100; draw(); return; }  // no motion: jump to the end
  pf = +burnIn.value;
  last = 0;
  raf = requestAnimationFrame(tick);
  draw();
});

// ---------- steps ----------
const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1"), right: true }, { label: P.t("o2") }, { label: P.t("o3") }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { predictNote = P.t("fb" + (i + 1)); if (step === 0) extra.textContent = predictNote; });

const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  if (i !== 2) stop();
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k, { fp: f(OWN.CO2 * 100, 0) });
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("ctlKg").hidden = i !== 1;
  document.getElementById("ctlBurn").hidden = i !== 2;
  draw();
});

kgIn.addEventListener("input", draw);
burnIn.addEventListener("input", () => { stop(); draw(); });
document.getElementById("reset").addEventListener("click", () => {
  stop(); kgIn.value = 10; burnIn.value = 0; predictNote = ""; pr.reset(); st.go(0);
});
if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(fig);
else window.addEventListener("resize", draw);
</script>
</body>
</html>

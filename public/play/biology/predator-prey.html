// ---------- pure logic ----------
const DEF = { a: 0.8, b: 4, c: 2.5, d: 0.5 }, START = { H: 8000, L: 12 }, T = 50, DT = 0.01;
// b is a percentage per year; c is lynx per 1000 hares eaten
const rate = (p) => ({ a: p.a, b: p.b / 100, cb: (p.c / 1000) * (p.b / 100), d: p.d });
function balance(p) { const r = rate(p); return { H: r.d / r.cb, L: r.a / r.b }; }
// RK4 on x = ln H, y = ln L (numbers stay positive; substeps when they change fast)
function simulate(p, H0, L0) {

const fig = document.getElementById("fig"), ph = document.getElementById("phase");

// two stacked panels over time: hares above, lynx below
function drawSeries(svg, W, H, r, a, opt) {
  const Tw = opt.T, left = 50, right = 12, top = 22, gap = 30, bottom = 30;
  const pw = W - left - right, phh = (H - top - gap - bottom) / 2;
  const X = (t) => left + (t / Tw) * pw;
  const n = Math.round(Tw / DT), every = Math.max(1, Math.round(n / pw));
  const panels = [
    { arr: r.H, y: top, name: P.t("fHares"), cls: "hareL", lc: "hare" },
    { arr: r.L, y: top + phh + gap, name: P.t("fLynx"), cls: "lynxL", lc: "lynx" },
  ];
  const hpk = a.hp.filter((t) => t <= Tw), lpk = a.lp.filter((t) => t <= Tw);
  panels.forEach((pn, k) => {
    let mx = 0;
    for (let i = 0; i <= n; i++) mx = Math.max(mx, pn.arr[i]);
    const ymax = nice(mx * 1.08), Y = (v) => pn.y + phh - (Play.clamp(v, 0, ymax) / ymax) * phh;
    pn.Y = Y;
    Play.svg("line", { x1: left, y1: pn.y + phh, x2: left + pw, y2: pn.y + phh, class: "axis" }, svg);
    Play.svg("line", { x1: left, y1: pn.y, x2: left + pw, y2: pn.y, class: "grid" }, svg);
    text(svg, left - 5, pn.y + 5, cnt(ymax), "m", "end");
    text(svg, left - 5, pn.y + phh + 4, "0", "m", "end");
    text(svg, left + 4, pn.y - 6, pn.name, pn.lc);
    if (k === 1 && opt.hideLynx) {
      Play.svg("rect", { x: left + 1, y: pn.y, width: pw - 1, height: phh, rx: 6, class: "hide" }, svg);
      text(svg, left + pw / 2, pn.y + phh / 2 + 6, "?", "q", "middle");
      label(svg, left + pw / 2, pn.y + phh - 8, P.t("fHidden"), "m", "middle");
      return;
    }
    const pts = [];
    for (let i = 0; i <= n; i += every) pts.push([X(i * DT), Y(pn.arr[i])]);
    pts.push([X(Tw), Y(pn.arr[n])]);
    path(svg, pts, pn.cls);
    (k === 0 ? hpk : lpk).forEach((t) => Play.svg("circle", { cx: X(t), cy: Y(at(pn.arr, t)), r: 3.5, class: k === 0 ? "hareD" : "lynxD" }, svg));
  });

  hpk.forEach((t) => Play.svg("line", { x1: X(t), y1: top, x2: X(t), y2: top + 2 * phh + gap, class: "peakV" }, svg));

  if (!opt.hideLynx) {
    const lt = lpk.find((t) => hpk.some((u) => u < t));
    if (lt !== undefined) {
      const ht = hpk.filter((u) => u < lt).pop(), yB = panels[1].y + 12;
      Play.svg("line", { x1: X(ht), y1: yB, x2: X(lt), y2: yB, class: "lagA" }, svg);
      arrowHead(svg, X(lt), yB, 0, "ahF", 6);
      label(svg, X(lt) + 6, yB + 5, P.t("fLag", { lag: f(lt - ht, 1) }), "m");
    }

  // time axis
  const tick = Tw > 30 ? 10 : 5;
  for (let t = 0; t <= Tw + 1e-9; t += tick) text(svg, X(t), H - 10, String(t), "m", "middle");
  text(svg, left - 8, H - 10, P.t("fYears"), "m", "end");
  if (opt.cursor !== undefined) {
    const cx = X(Play.clamp(opt.cursor, 0, Tw));
    Play.svg("line", { x1: cx, y1: top, x2: cx, y2: top + 2 * phh + gap, class: "cursor" }, svg);
    panels.forEach((pn) => Play.svg("circle", { cx, cy: pn.Y(at(pn.arr, opt.cursor)), r: 5, class: "cur" }, svg));

// step 3: stylised sketch of the fur-record pattern (shape only, not data)
function drawSketch(svg, W, H) {
  const left = 14, right = 12, top = 44, bottom = 34, pw = W - left - right, phh = H - top - bottom;
  Play.svg("rect", { x: left, y: top, width: pw, height: phh, rx: 8, class: "sketchBg" }, svg);
  label(svg, left + 4, 16, P.t("fSketch"), "m b");

  const hp = [], lp = [];
  for (let i = 0; i <= 500; i++) { const t = (i / 500) * Tw; hp.push([X(t), Y(0.06 + 0.9 * bump(t, -3, 3))]); lp.push([X(t), Y(0.04 + 0.62 * bump(t, -1.5, 2.5))]); }

  const tl = text(svg, left + 24, 37, P.t("fHares"), "hare");
  let lx = left + 24 + 50;

  Play.svg("line", { x1: lx, y1: 33, x2: lx + 18, y2: 33, class: "lynxL" }, svg);
  text(svg, lx + 22, 37, P.t("fLynx"), "lynx");
  text(svg, left + pw, 37, P.t("fRel"), "m", "end");
  const y = H - 14, x0 = left + pw - 6 - (10 / Tw) * pw;
  Play.svg("line", { x1: x0, y1: y - 4, x2: left + pw - 6, y2: y - 4, class: "lagA" }, svg);

}

function draw() {
  const p = params();
  ids.forEach((id, i) => { document.getElementById(id + "V").textContent = f(p[keys[i]], keys[i] === "a" || keys[i] === "d" ? 2 : 1); });
  document.getElementById("yrVal").textContent = f(tNow, 1);
  document.getElementById("play").textContent = P.t(playing ? "pause" : "play");
  document.getElementById("play").setAttribute("aria-pressed", String(playing));
  document.getElementById("startVal").textContent = P.t("startV", { H0: cnt(start.H), L0: cnt(start.L) });
  fig.innerHTML = ""; ph.innerHTML = "";
  ph.classList.toggle("static", step !== 1);
  if (step === 0) {
    const { W, H } = size(fig, 320);
    drawSeries(fig, W, H, DRUN, DA, { T: 25, hideLynx: answered < 0 });
    extra.textContent = answered >= 0 ? P.t("fb" + (answered + 1), DV) : "";
  } else if (step === 1) {
    let s = size(fig, 320);
    drawSeries(fig, s.W, s.H, run, A, { T, cursor: tNow });
    s = size(ph, 300);
    drawPhase(ph, s.W, s.H, run, A, p, { handle: true, cursor: tNow, scale: frozen, whole: !Number.isFinite(A.per) });
    const e = balance(p);
    extra.textContent = P.t("x2", { a: f(p.a, 2), b: f(p.b, 1), c: f(p.c, 1), d: f(p.d, 2), Hs: cnt(e.H), Ls: cnt(e.L) });
  } else {
    let s = size(fig, 320);
    drawSketch(fig, s.W, s.H);
    s = size(ph, 300);

}

  if (A.lmin < 1) s += " " + P.t("liveLow", { lmin: cnt(A.lmin) });

  if (step === 1 && changed) el.textContent = A.flat ? P.t("rnFlat") : P.t("rnRun", { per: yrs(A.per), lag: f(A.lag, 1), hmin: cnt(A.hmin), hmax: cnt(A.hmax) });

}

  lastTs = ts;

  if (tNow >= T) { tNow = T; stopPlay(); }
  document.getElementById("yr").value = tNow;
  draw();
  if (playing) raf = requestAnimationFrame(frame);
  else Play.live(liveEl, P.t("liveYear", { t: f(tNow, 0), h: cnt(at(run.H, tNow)), l: cnt(at(run.L, tNow)) }));
}

inp.forEach((el) => el.addEventListener("input", () => { frozen = null; recompute(); draw(); announce(); }));

function fromPointer(e) {

  if (!drag) return;
  const v = fromPointer(e);
  if (v) setStart(v.H, v.L);
});
function endDrag() { if (!drag) return; drag = false; frozen = null; draw(); announce(); }
ph.addEventListener("pointerup", endDrag);
ph.addEventListener("pointercancel", endDrag);
ph.addEventListener("keydown", (e) => {
  if (step !== 1 || !PH) return;
  const k = e.shiftKey ? 5 : 1, dH = 0.02 * PH.sc.hmax * k, dL = 0.02 * PH.sc.lmax * k;
  const mv = { ArrowLeft: [-dH, 0], ArrowRight: [dH, 0], ArrowUp: [0, dL], ArrowDown: [0, -dL] }[e.key];
  if (!mv) return;
  e.preventDefault();
  frozen = PH.sc;
  setStart(start.H + mv[0], start.L + mv[1]);
  frozen = null;
  announce();
});

// ---------- steps & controls ----------
const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { answered = i; if (step === 0) draw(); });

const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  stopPlay();
  step = i;
  const k = i + 1;
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("eqs").hidden = i !== 1;
  ["ctlTime", "ctlStart", "ctlRates"].forEach((id) => { document.getElementById(id).hidden = i !== 1; });
  ph.hidden = i === 0;
  ph.tabIndex = i === 1 ? 0 : -1;
  Play.live(liveEl, i === 1 ? runText() : "");
  draw();
});

document.getElementById("reset").addEventListener("click", () => {
  stopPlay();
  inp.forEach((el, i) => { el.value = DEF[keys[i]]; });
  start = { ...START }; tNow = 0; yrIn.value = 0; frozen = null; answered = -1;
  recompute(); pr.reset(); st.go(0);
});
if ("ResizeObserver" in window) { const ro = new ResizeObserver(() => draw()); ro.observe(fig); ro.observe(ph); }
else window.addEventListener("resize", draw);
</script>
</body>

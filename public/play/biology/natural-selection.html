// ---------- pure logic ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) {
  const u = Math.max(rnd(), 1e-12);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
}
const N = 100, MUT = 0.025, BASE = 0.05, SLOPE = 0.75, C0 = 0.2, SD0 = 0.15;
// keep colours in [0, 1] by bouncing off the ends (no pile-up at 0 or 1)
function reflect01(x) {
  if (x < 0) x = -x;
  if (x > 1) x = 2 - x;
  return x < 0 ? 0 : x > 1 ? 1 : x;
}
const catchP = (c, b) => BASE + SLOPE * Math.abs(c - b);
function stats(list) {
  const n = list.length;
  if (!n) return { n: 0, mean: NaN, sd: NaN };
  let s = 0;
  for (const m of list) s += m.c;
  const mean = s / n;
  let v = 0;
  for (const m of list) v += (m.c - mean) * (m.c - mean);
  return { n, mean, sd: Math.sqrt(v / n) };
}
function makeMoth(s, c, parent) {
  return { id: s.nextId++, c, gen: s.gen, parent, x: s.rnd(), y: s.rnd(), eaten: false };
}
function createSim(seed, b) {
  const s = { rnd: mulberry32(seed), gen: 1, phase: "hunt", nextId: 1, pop: [], history: [], extinct: false };
  for (let i = 0; i < N; i++) s.pop.push(makeMoth(s, reflect01(C0 + SD0 * gauss(s.rnd)), 0));
  s.history.push({ gen: 1, mean: stats(s.pop).mean, bark: b });
  return s;
}
// Birds: with sight, catch chance grows with contrast; without, everyone gets the average chance.
function simHunt(s, b, sight) {
  const ps = s.pop.map((m) => catchP(m.c, b));
  const avg = ps.length ? ps.reduce((a, x) => a + x, 0) / ps.length : 0;
  s.pop.forEach((m, i) => { m.eaten = s.rnd() < (sight ? ps[i] : avg); });
  if (s.history.length) s.history[s.history.length - 1].bark = b;
  s.phase = "breed";
}
// Survivors breed: N children shared out evenly among survivors, colour = parent's + small mutation.
function simBreed(s, b) {
  const alive = s.pop.filter((m) => !m.eaten);
  s.phase = "hunt";
  if (!alive.length) { s.pop = []; s.extinct = true; return; }
  s.gen++;
  // shuffle survivors, then deal the N children round-robin: every survivor leaves about N / survivors young
  for (let i = alive.length - 1; i > 0; i--) { const j = Math.floor(s.rnd() * (i + 1)); [alive[i], alive[j]] = [alive[j], alive[i]]; }
  const next = [];
  for (let i = 0; i < N; i++) {
    const p = alive[i % alive.length];
    next.push(makeMoth(s, reflect01(p.c + MUT * gauss(s.rnd)), p.id));

function drawHist(R, pop, b) {

// ---------- actions ----------
function doHunt(quiet) {
  const b = B();
  simHunt(sim, b, sightIn.checked);
  const dead = sim.pop.filter((m) => m.eaten), alive = sim.pop.filter((m) => !m.eaten);
  const tm = sim.pop.find((m) => m.id === tag);
  if (tm) { tagMsg = tm.eaten ? "trEaten" : "trSurv"; tagVars = {}; }
  if (!quiet) Play.live(liveEl, P.t("liveHunt", { g: sim.gen, k: dead.length, n: sim.pop.length, mc: f(stats(dead).mean, 2), ms: f(stats(alive).mean, 2), b: f(b, 2) }));
}
function doBreed() {
  const parents = sim.pop.filter((m) => !m.eaten), mp = stats(parents).mean;
  const tm = sim.pop.find((m) => m.id === tag);
  simBreed(sim, B());
  if (sim.extinct) { stopPlay(); Play.live(liveEl, P.t("liveExt")); return; }
  if (tm && !tm.eaten) {
    const kids = sim.pop.filter((m) => m.parent === tm.id);
    if (kids.length) { tag = kids[0].id; lineage.push({ c: kids[0].c }); tagMsg = "trAlive"; tagVars = { pid: tm.id, pc: f(tm.c, 2), k: kids.length }; }
    else { tag = null; tagMsg = "trNoKids"; tagVars = {}; }
  } else if (tm) { tag = null; tagMsg = "trEaten"; tagVars = {}; }
  Play.live(liveEl, P.t("liveBreed", { g: sim.gen, n: sim.pop.length, m: f(stats(sim.pop).mean, 2), mp: f(mp, 2) }));
}
function advance(quiet) {
  if (sim.extinct) return;
  if (sim.phase === "hunt") doHunt(quiet); else doBreed();
  draw();
}
function tick() {
  timer = 0;
  if (!playing || step !== 1) return;
  advance(true);
  if (playing) timer = setTimeout(tick, 450);
}
function stopPlay() { playing = false; clearTimeout(timer); timer = 0; }
function startPlay() { if (sim.extinct) return; playing = true; clearTimeout(timer); timer = setTimeout(tick, 120); }

function startBird() {
  stopPlay();
  if (sim.extinct) return;
  if (sim.phase === "breed") doBreed();
  if (sim.extinct) return;
  bird = { left: 10000, last: performance.now(), paused: false, caught: [], cx: 0.5, cy: 0.5, kbd: false };
  sim.pop.forEach((m) => { m.eaten = false; });
  draw();
  raf = setInterval(birdTick, 100);
}
function birdTick() {
  if (!bird) return;
  const ts = performance.now();
  if (!bird.paused) bird.left -= Math.max(0, ts - bird.last);
  bird.last = ts;
  if (bird.left <= 0) { endBird(); return; }
  const t = document.getElementById("birdT");
  if (t) t.textContent = P.t("fBirdT", { s: f(bird.left / 1000, 1), k: bird.caught.length });
}
function endBird() {
  if (!bird) return;
  clearInterval(raf);
  const caught = bird.caught;
  bird = null;
  sim.phase = "breed";
  if (sim.history.length) sim.history[sim.history.length - 1].bark = B();
  const alive = sim.pop.filter((m) => !m.eaten);
  const tm = sim.pop.find((m) => m.id === tag);
  if (tm) { tagMsg = tm.eaten ? "trEaten" : "trSurv"; tagVars = {}; }
  Play.live(liveEl, P.t("liveBird", { k: caught.length, mc: caught.length ? f(stats(caught).mean, 2) : "—", ms: f(stats(alive).mean, 2), b: f(B(), 2) }));
  draw();
}
function nearest(px, py, maxD) {
  if (!layout) return null;
  let best = null, bd = maxD * maxD;
  for (const m of sim.pop) {
    if (m.eaten) continue;
    const [x, y] = mothXY(layout.bark, m), d = (x - px) * (x - px) + (y - py) * (y - py);
    if (d <= bd) { bd = d; best = m; }
  }

}
function peck(px, py) {

  const m = nearest(px, py, mothR(layout.bark) * 1.8);
  if (m) { m.eaten = true; bird.caught.push(m); if (m.id === tag) tagMsg = "trEaten"; }
  draw();
}

fig.addEventListener("pointerdown", (e) => {
  if (step !== 1 || !layout) return;
  const p = Play.pointer(fig, e);
  if (bird) { e.preventDefault(); bird.kbd = false; peck(p.x, p.y); return; }
  const m = nearest(p.x, p.y, mothR(layout.bark) * 3);
  if (m) { tagMoth(m); draw(); }
});
fig.addEventListener("keydown", (e) => {
  if (step !== 1 || !layout) return;

    if (mv) { bird.kbd = true; bird.cx = Play.clamp(bird.cx + mv[0], 0.02, 0.98); bird.cy = Play.clamp(bird.cy + mv[1], 0.02, 0.98); draw(); e.preventDefault(); }
    if (k === "Enter" || k === " ") { bird.kbd = true; peck(layout.bark.x + bird.cx * layout.bark.w, layout.bark.y + bird.cy * layout.bark.h); e.preventDefault(); }
    return;
  }
  if (k === "ArrowLeft" || k === "ArrowRight") {
    const alive = sim.pop.filter((m) => !m.eaten);
    if (!alive.length) return;
    const i = alive.findIndex((m) => m.id === tag);
    const j = i < 0 ? 0 : (i + (k === "ArrowRight" ? 1 : alive.length - 1)) % alive.length;
    tagMoth(alive[j]);
    draw();
    e.preventDefault();
  }
});

// ---------- steps & controls ----------
const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { answered = i; if (step === 0) draw(); });

const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  if (i !== 1) { stopPlay(); if (bird) endBird(); }
  step = i;
  const k = i + 1;
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  ["ctlBark", "ctlSim", "tracker"].forEach((id) => { document.getElementById(id).hidden = i !== 1; });
  if (i !== 1) Play.live(liveEl, "");
  draw();
});

barkIn.addEventListener("input", draw);
document.getElementById("next").addEventListener("click", () => { stopPlay(); advance(false); });
document.getElementById("play").addEventListener("click", () => {
  if (bird) { bird.paused = !bird.paused; draw(); return; }
  if (playing) stopPlay(); else startPlay();
  draw();
});
document.getElementById("bird").addEventListener("click", () => { if (bird) endBird(); else startBird(); });
function fresh(newSeed) {
  stopPlay();
  if (bird) { clearInterval(raf); bird = null; }
  seed = newSeed;
  sim = createSim(seed, B());
  tagMoth(sim.pop[0]);
  Play.live(liveEl, "");
}
document.getElementById("fresh").addEventListener("click", () => { fresh(seed + 1); draw(); });
document.getElementById("reset").addEventListener("click", () => {
  barkIn.value = 20; sightIn.checked = true; answered = -1;
  fresh(1); pr.reset(); st.go(0);
});
if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(fig);
else window.addEventListener("resize", draw);
</script>
</body>

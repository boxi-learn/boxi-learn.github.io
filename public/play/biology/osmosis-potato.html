// ================= numbers (all computed here) =================
const CISO = 0.28;          // model isotonic sucrose concentration of potato tissue, M (approximate)
const GAIN = 20;            // % mass gain in pure water (model, approximate)
const LOSS = 35;            // scale of loss above CISO, % (model)
const PHI = 0.93;           // osmotic coefficient of NaCl near 0.15 M (approximate)
const BNON = 0.3;           // non-water fraction of protoplast volume in the sketch
const dm = (C) => { C = Play.clamp(+C || 0, 0, 2); return C <= CISO ? GAIN * (CISO - C) / CISO : LOSS * (CISO / C - 1); };
const SALT = CISO / (2 * PHI);
const BENCH = [0, 0.1, 0.2, 0.4, 0.8];
const MASS0 = [2.51, 2.46, 2.55, 2.49, 2.53, 2.5]; // starting masses, g (last = your beaker)
const r2 = (x) => Math.round(x * 100) / 100;
const weigh = (m0, C) => { const a = r2(m0 * (1 + dm(C) / 100)); return { b: m0, a, p: (a - m0) / m0 * 100 }; };
// zero crossing by linear interpolation between neighbouring measured points
function crossing(pts) {
  const s = pts.slice().sort((p, q) => p.c - q.c);
  for (let i = 0; i + 1 < s.length; i++) {
    const p = s[i], q = s[i + 1];
    if (p.p === 0) return { a: p.c, b: p.c, c: p.c };
    if (p.p > 0 && q.p <= 0 && q.c > p.c) return { a: p.c, b: q.c, c: p.c + (q.c - p.c) * p.p / (p.p - q.p) };
  }
  return null;
}
const protoVol = (C) => (C <= CISO ? 1 : BNON + (1 - BNON) * CISO / C);

// ================= particle model (step 2; simplified) =================
// Physics lives in its own box (PB); drawing maps it onto the figure. Every particle takes one place,
// so each side's width is proportional to its particle count, and the share of hits on the membrane
// that are water equals that side's water share.
const PB = { w: 380, h: 256 }, LIM = [0.15, 0.85];
const RW = 3.5, RS = 5, VW = 90, VS = 40, PASS = 0.8, KSPRING = 0.008, NW = 60, SMAX = 30, WIN = 5;
let parts = [], simT = 0, since = 0, nLR = 0, nRL = 0, events = [], cnt = { w: [0, 0], s: [0, 0] }, xm = PB.w / 2;
const rnd = Math.random;
const nSide = (i) => cnt.w[i] + cnt.s[i];
const xmOf = () => PB.w * Play.clamp(nSide(0) / Math.max(1, nSide(0) + nSide(1)), LIM[0], LIM[1]);
function setXM() {
  // move the membrane to match the counts and stretch each side's particles with it (keeps density even)
  const m0 = xm, m = xmOf();
  if (m === m0) return;
  for (const p of parts) {
    p.x = p.side ? PB.w - (PB.w - p.x) * (PB.w - m) / (PB.w - m0) : p.x * m / m0;
    p.x = p.side ? Play.clamp(p.x, m + p.r, PB.w - p.r) : Play.clamp(p.x, p.r, m - p.r);
  }
  xm = m;
}
function addP(kind, side, x, y) {
  const r = kind === "w" ? RW : RS;
  cnt[kind][side]++; setXM();
  const lo = side ? xm + r : r, hi = side ? PB.w - r : xm - r;
  parts.push({ kind, side, r, x: Play.clamp(x ?? lo + rnd() * (hi - lo), lo, hi), y: Play.clamp(y ?? r + rnd() * (PB.h - 2 * r), r, PB.h - r), a: rnd() * 6.283, el: null });
}
function addSugar(side, x, y) {
  if (cnt.s[side] >= SMAX) return false;

}
function clearSugar() { parts = parts.filter((p) => p.kind === "w"); cnt.s = [0, 0]; setXM(); markChange(); }
function markChange() { since = 0; nLR = 0; nRL = 0; events = []; }
function initSim() {
  parts = []; cnt = { w: [0, 0], s: [0, 0] }; xm = PB.w / 2; simT = 0;
  for (let i = 0; i < NW; i++) { addP("w", 0); addP("w", 1); }

}
// chance that a water particle hitting the membrane from side `from` gets through
function passChance(from) {
  const to = 1 - from;
  if ((nSide(to) + 1) / (nSide(0) + nSide(1)) > LIM[1]) return 0;
  return Math.min(1, PASS * Math.exp(-KSPRING * (cnt.w[to] - cnt.w[from]) / 2));
}
function simStep(dt) {
  simT += dt; since += dt;
  for (const p of parts) {
    const v = p.kind === "w" ? VW : VS, r = p.r;
    p.a += (rnd() - 0.5) * 4 * Math.sqrt(dt);
    p.x += Math.cos(p.a) * v * dt; p.y += Math.sin(p.a) * v * dt;
    if (p.y < r) { p.y = 2 * r - p.y; p.a = -p.a; }
    if (p.y > PB.h - r) { p.y = 2 * (PB.h - r) - p.y; p.a = -p.a; }
    p.y = Play.clamp(p.y, r, PB.h - r);
    const lo = p.side ? xm + r : r, hi = p.side ? PB.w - r : xm - r;
    if (p.x >= lo && p.x <= hi) continue;
    const atMem = p.side ? p.x < lo : p.x > hi;
    if (atMem && p.kind === "w" && rnd() < passChance(p.side)) {
      cnt.w[p.side]--; p.side = 1 - p.side; cnt.w[p.side]++;
      if (p.side) nLR++; else nRL++;
      events.push({ t: simT, d: p.side });
      setXM();
      p.x = p.side ? xm + r : xm - r;
    } else {
      p.x = p.x < lo ? 2 * lo - p.x : 2 * hi - p.x; p.a = Math.PI - p.a;

  return { w, s, sh, win, bal, rr: win > 0.5 ? r[1] / win : 0, rl: win > 0.5 ? r[0] / win : 0 };
}

  if (step === 2) {
    const pts = [];
    for (let i = 0; i < 6; i++) if (soaked[i] && anim[i] >= 1) { const c = concOf(i), w = weigh(MASS0[i], c); pts.push({ c, p: w.p, b: w.b, a: w.a }); }
    if (!pts.length) { extra.textContent = P.t("x3none"); return; }
    const rows = pts.slice().sort((a, b) => a.c - b.c).map((q) => `<tr><td>${g(q.c)} M</td><td>${q.b.toFixed(2)}</td><td>${q.a.toFixed(2)}</td><td>${sg(q.p)}%</td></tr>`).join("");
    const cr = crossing(pts);
    extra.innerHTML = `<table><tr><th>${P.t("thC")}</th><th>${P.t("thB")}</th><th>${P.t("thA")}</th><th>${P.t("thP")}</th></tr>${rows}</table><p>` +
      (cr ? P.t("x3cross", { a: g(cr.a), b: g(cr.b), c: g(cr.c) }) : P.t("x3one")) + P.t("x3why") + "</p>";
    return;
  }
  const C = +coEl.value, st = cellState(C);
  extra.innerHTML = P.t("x4", { c: g(C), i: g(CISO), s: P.t(st === "sEven" ? "x4even" : C < CISO ? "x4in" : "x4out"), p: sg(dm(C)) }) + P.t("x4salt", { s: g(SALT), i: g(CISO) });
  Play.live(liveEl, P.t("live4", { c: g(C), st: P.t(st), p: sg(dm(C)) }));
}

function draw() {
  const ae = document.activeElement, fi = ae && fig.contains(ae) ? ae.getAttribute("data-i") : null;
  sizeFig();
  fig.innerHTML = ""; H = null;
  if (step === 0) drawGuess(); else if (step === 1) drawSim(); else if (step === 2) drawBench(); else drawCell();
  if (fi !== null) { const el = fig.querySelector(`[data-i="${fi}"]`); if (el) el.focus(); }
  runBtn.textContent = raf ? P.t("pause") : P.t("play");
  fastBtn.setAttribute("aria-pressed", fast ? "true" : "false");
  fastBtn.classList.toggle("on", fast);
  document.getElementById("cxVal").textContent = g(+cxEl.value) + " M";
  document.getElementById("coVal").textContent = g(+coEl.value) + " M";
  text();
}

// ================= animation (step 2; never autoplays when reduced motion is on) =================
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; runBtn.textContent = P.t("play"); }
function start() {
  if (raf) return;
  last = 0;
  raf = requestAnimationFrame(tick);
  runBtn.textContent = P.t("pause");
}
function tick(t) {
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  const n = fast ? 8 : 2, h = dt / 2;
  for (let i = 0; i < n && dt > 0; i++) simStep(h);
  paintSim();
  textT += dt;
  if (textT > 0.4) { textT = 0; text(); }
  raf = requestAnimationFrame(tick);
}
runBtn.addEventListener("click", () => { if (raf) stop(); else start(); text(); });
fastBtn.addEventListener("click", () => { fast = !fast; fastBtn.setAttribute("aria-pressed", fast ? "true" : "false"); fastBtn.classList.toggle("on", fast); });
const sugarBtn = (fn) => () => { fn(); rebuildDots(); paintSim(); text(); };
document.getElementById("addL").addEventListener("click", sugarBtn(() => addSugar(0)));
document.getElementById("addR").addEventListener("click", sugarBtn(() => addSugar(1)));
document.getElementById("clr").addEventListener("click", sugarBtn(clearSugar));
document.getElementById("soakAll").addEventListener("click", () => { for (let i = 0; i < 6; i++) if (!soaked[i]) soak(i); });
cxEl.addEventListener("input", () => {
  if (step === 2) draw();
  if (soaked[5]) { const c = +cxEl.value, w = weigh(MASS0[5], c); Play.live(liveEl, P.t("live3", { c: g(c), b: w.b.toFixed(2), a: w.a.toFixed(2), p: sg(w.p) })); }
});
coEl.addEventListener("input", () => { if (step === 3) draw(); });
let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { const was = narrow; sizeFig(); if (was !== narrow) draw(); }); });

// ================= steps =================
const mk = (q, opts, ok, k, el) => Play.predict(document.getElementById(el), {
  q: P.t(q), options: opts.map((o, j) => ({ label: P.t(o), right: j === ok })), right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { notes[k] = P.t("fb" + (k + 1) + "abc"[i]); if (step === 0) text(); });
const pr1 = mk("q1", ["q1a", "q1b", "q1c"], 1, 0, "predict");
const pr2 = mk("q2", ["q2a", "q2b", "q2c"], 1, 1, "predict2");

initSim();
const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  if (i !== 1) stop();
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("predict2").hidden = i !== 0;
  for (const j of [2, 3, 4]) document.getElementById("ctl" + j).hidden = i !== j - 1;
  draw();
  if (i === 1 && !Play.reduced) start();
});

document.getElementById("resultMain").textContent = P.t("resultMain", { c: g(CISO) });
document.getElementById("foot").textContent = P.t("foot", {
  w: NW * 2, k: g(KSPRING, 3), pp: Math.round(PASS * 100), c: g(CISO), g: g(GAIN), l: g(LOSS), b: g(BNON), b1: g(1 - BNON), phi: g(PHI),
});
document.getElementById("reset").addEventListener("click", () => {
  stop(); fast = false; initSim(); soaked.fill(false); anim.fill(1); cxEl.value = 0.3; coEl.value = 0.8;
  notes = ["", ""]; pr1.reset(); pr2.reset(); st.go(0);
});
</script>
</body>
</html>

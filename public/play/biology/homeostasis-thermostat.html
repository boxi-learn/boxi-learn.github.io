// ---------- pure logic ----------
const clamp = Play.clamp, f = Play.fmt;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) {
  const u = Math.max(rnd(), 1e-12);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
}
// slowly varying random wiggle (Ornstein–Uhlenbeck, 20 min memory)
const NTH = 0.05;
const ou = (x, rnd, sd) => x - NTH * x + sd * Math.sqrt(2 * NTH) * gauss(rnd);
const HMAX = 241; // chart window: 4 h of 1-min samples

const TLO = 28, THI = 43; // the model stops here: a real body would not survive beyond
const TS = 37, TAU = 600, TOFF = 15, TGAIN = 60, UWARM = 40, UCOOL = 60, TEX = 40, TNOISE = 6;
function tempNew(seed) { return { rnd: mulberry32(seed), t: 0, T: TS, n: 0, ex: 0, U: 0, hist: [{ t: 0, v: TS }] }; }
const tempResp = (T, fb) => (fb ? clamp(TGAIN * (TS - T), -UCOOL, UWARM) : 0);
function tempStep(s, Ta, fb, noisy) {
  if (noisy) s.n = ou(s.n, s.rnd, TNOISE);
  const ex = s.ex > 0 ? TEX : 0;
  if (s.ex > 0) s.ex--;
  s.U = tempResp(s.T, fb);
  s.T = clamp(s.T + (Ta + TOFF + ex + (noisy ? s.n : 0) + s.U - s.T) / TAU, TLO, THI);
  s.t++;
  s.hist.push({ t: s.t, v: s.T, ev: ex ? "run" : "" });
  if (s.hist.length > HMAX) s.hist.shift();
}
// response split: first the skin vessels (up to 12), then shivering / sweating
function tempParts(U) {
  const a = Math.abs(U), vaso = Math.min(a, 12) / 12, extra = Math.max(0, a - 12) / (U > 0 ? UWARM - 12 : UCOOL - 12);
  return { warm: U > 0.5, cool: U < -0.5, vaso, extra: clamp(extra, 0, 1) };
}

// Blood glucose (mmol/L, 1 step = 1 min)
const GS = 5, GA = 6, GTM = 30, AI = 0.03, AN = 0.08, TI = 8, TN = 8, GEX = 0.04, GEXD = 30, KR = 0.01, GR = 10, GNOISE = 0.004;
const mealRate = (d) => (d < 0 ? 0 : (GA * d) / (GTM * GTM) * Math.exp(-d / GTM));
function gluNew(seed) { return { rnd: mulberry32(seed), t: 0, G: GS, I: 0, N: 0, n: 0, ex: 0, meals: [], fl: { gut: 0, liver: 0, cells: 0 }, hist: [{ t: 0, v: GS }] }; }
function gluStep(s, fb, noisy) {
  if (noisy) s.n = ou(s.n, s.rnd, GNOISE);
  const meal = s.meals.reduce((a, m) => a + mealRate(s.t - m), 0);
  s.meals = s.meals.filter((m) => s.t - m < 480);
  const ex = s.ex > 0 ? GEX : 0;
  if (s.ex > 0) s.ex--;
  if (fb) {
    s.I += (AI * Math.max(0, s.G - GS) - s.I) / TI;
    s.N += (AN * Math.max(0, GS - s.G) - s.N) / TN;
  } else { s.I = 0; s.N = 0; }
  const renal = KR * Math.max(0, s.G - GR);
  s.fl = { gut: meal, liver: s.N, cells: s.I + ex + renal };
  s.G = clamp(s.G + meal - ex + s.N - s.I - renal + (noisy ? s.n : 0), 1.5, 25);
  s.t++;
  const ev = s.meals.includes(s.t - 1) ? "meal" : ex && s.ex === GEXD - 1 ? "walk" : "";
  s.hist.push({ t: s.t, v: s.G, ev });
  if (s.hist.length > HMAX) s.hist.shift();
}
const mgdl = (g) => g * 18.016; // glucose 180.16 g/mol

// Fixed scenarios (no noise) for the guess and the rule
function coldRun(fb) {
  const s = tempNew(1), out = [];
  for (let i = 0; i < 30; i++) { tempStep(s, 22, fb, false); out.push(s.T); }
  for (let i = 0; i < 90; i++) { tempStep(s, 0, fb, false); out.push(s.T); }
  return [TS].concat(out); // index = minute, 0…120; cold from minute 30
}
function mealRun(fb) {
  const s = gluNew(1), out = [GS];
  s.meals.push(0);
  for (let i = 0; i < 180; i++) { gluStep(s, fb, false); out.push(s.G); }
  return out;
}
const COLD_ON = coldRun(true), COLD_OFF = coldRun(false), MEAL_ON = mealRun(true), MEAL_OFF = mealRun(false);
const SN = {
  a: f(COLD_ON[90], 1), b: f(COLD_OFF[90], 1), c: f(Math.max(...MEAL_ON), 1), d: f(MEAL_ON[120], 1), e: f(MEAL_OFF[120], 1),
};
const DIP = f(TS - COLD_ON[90], 1);
// ---------- end pure logic ----------

// ---------- state ----------
let step = 0, answered = -1, playing = false, timer = 0, seed = 1;
const airIn = document.getElementById("air"), fbIn = document.getElementById("fb");
let ts = tempNew(seed), gs = gluNew(seed + 100);
const air = () => clamp(+airIn.value, -10, 45);

// ---------- drawing ----------
const fig = document.getElementById("fig"), extra = document.getElementById("extra"), liveEl = document.getElementById("live");
const S = (tag, a, p) => Play.svg(tag, a, p || fig);
function text(x, y, s, cls, anchor) {
  const t = S("text", { x, y, class: "lbl " + (cls || ""), "text-anchor": anchor || "start" });
  t.textContent = s;
  return t;
}
function label(x, y, s, anchor, cls) {
  const t = text(x, y, s, cls || "m b", anchor);
  try {
    const bb = t.getBBox();
    fig.insertBefore(S("rect", { x: bb.x - 4, y: bb.y - 1, width: bb.width + 8, height: bb.height + 2, rx: 4, class: "tagbg" }), t);
  } catch (e) { /* no layout: label still shows */ }
  return t;
}
function size() {
  const r = fig.getBoundingClientRect();
  const W = Math.max(280, Math.round(r.width || 600)), H = Math.max(300, Math.round(r.height || 440));
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  return { W, H };
}
function arrow(x1, y1, x2, y2, on) {
  S("line", { x1, y1, x2, y2, class: "arrow" + (on ? " on" : "") });
  const a = Math.atan2(y2 - y1, x2 - x1), k = 7;
  S("path", { d: `M${x2} ${y2} L${x2 - k * Math.cos(a - 0.45)} ${y2 - k * Math.sin(a - 0.45)} L${x2 - k * Math.cos(a + 0.45)} ${y2 - k * Math.sin(a + 0.45)} Z`, class: "ah" + (on ? " on" : "") });
}
// three boxes in a row with arrows, plus a return arrow underneath
function loop(R, boxes, active, offIdx) {
  const g = Math.max(14, R.w * 0.05), bw = (R.w - 2 * g) / 3, bh = R.h - 24;
  boxes.forEach((b, i) => {
    const x = R.x + i * (bw + g);
    S("rect", { x, y: R.y, width: bw, height: bh, rx: 8, class: "box" + (active ? " on" : "") + (offIdx === i ? " off" : "") });
    text(x + bw / 2, R.y + 17, b[0], "b", "middle");
    text(x + bw / 2, R.y + 35, offIdx === i ? P.t("lOffBox") : b[1], "m", "middle");
    if (b[2]) text(x + bw / 2, R.y + 53, b[2], "m a", "middle");
    if (i < 2) arrow(x + bw + 2, R.y + bh / 2, x + bw + g - 2, R.y + bh / 2, active);
  });
  const y = R.y + bh + 12, x1 = R.x + 2.5 * bw + 2 * g, x0 = R.x + bw / 2;
  S("path", { d: `M${x1} ${R.y + bh} L${x1} ${y} L${x0} ${y}`, class: "arrow" + (active ? " on" : "") });
  arrow(x0, y, x0, R.y + bh + 2, active);
  label((x0 + x1) / 2, y + 4, P.t("lBack"), "middle", "m");
}
// time chart: series [{pts:[{t,v}], cls}], window [t0, t1]
function chart(R, o) {
  const px = R.x + 34, py = R.y + 22, pw = R.w - 42, ph = Math.max(40, R.h - 22 - 20);
  let lo = o.lo, hi = o.hi;
  o.series.forEach((s) => s.pts.forEach((p) => { if (Number.isFinite(p.v)) { lo = Math.min(lo, p.v); hi = Math.max(hi, p.v); } }));
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const X = (t) => px + ((t - o.t0) / (o.t1 - o.t0)) * pw, Y = (v) => py + ph - ((v - lo) / (hi - lo)) * ph;
  text(R.x + 2, R.y + 13, o.title, "m b");
  if (o.band) {
    const y1 = Y(clamp(o.band[1], lo, hi)), y0 = Y(clamp(o.band[0], lo, hi));
    S("rect", { x: px, y: y1, width: pw, height: Math.max(0, y0 - y1), class: "band" });
    text(px + 4, y0 - 5, P.t("fBand"), "m");
  }
  const step = hi - lo > 12 ? 5 : hi - lo > 5 ? 2 : hi - lo > 2.4 ? 1 : 0.5;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    S("line", { x1: px, y1: Y(v), x2: px + pw, y2: Y(v), class: "grid" });
    text(px - 4, Y(v) + 4, f(v, step < 1 ? 1 : 0), "m", "end");
  }
  for (let t = Math.ceil(o.t0 / 60) * 60; t <= o.t1; t += 60) {
    S("line", { x1: X(t), y1: py + ph, x2: X(t), y2: py + ph + 4, class: "axis" });
    text(X(t), py + ph + 16, t === 0 ? "0" : P.t("fH", { h: t / 60 }), "m", "middle");
  }
  S("line", { x1: px, y1: py + ph, x2: px + pw, y2: py + ph, class: "axis" });
  (o.events || []).forEach((e) => {
    if (e.t < o.t0 || e.t > o.t1) return;
    S("line", { x1: X(e.t), y1: py, x2: X(e.t), y2: py + ph, class: "evL" });
    if (e.s) label(X(e.t) + 4, py + 12, e.s, "start", "m");
  });
  S("line", { x1: px, y1: Y(o.set), x2: px + pw, y2: Y(o.set), class: "setL" });
  label(px + pw - 2, Y(o.set) + (o.band ? 15 : -5), P.t("fSet") + " " + f(o.set, 1), "end", "m");
  o.series.forEach((s) => {
    let d = "";
    s.pts.forEach((p) => { if (Number.isFinite(p.v) && p.t >= o.t0) d += (d ? " L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1); });
    if (d) S("path", { d, class: s.cls });
  });
  return { X, Y, px, py, pw, ph };
}
const toPts = (arr) => arr.map((v, i) => ({ t: i, v }));

function drawGuess(W, H) {
  const R = { x: 8, y: 8, w: W - 16, h: H - 16 };
  const series = answered < 0 ? [{ pts: toPts(COLD_ON.slice(0, 31)), cls: "valL" }]
    : [{ pts: toPts(COLD_OFF), cls: "offL" }, { pts: toPts(COLD_ON), cls: "valL" }];
  const c = chart(R, { t0: 0, t1: 120, lo: 34.5, hi: 37.5, set: TS, series, title: P.t("fCore"),
    events: [{ t: 30, s: P.t("fOut") }] });
  label(c.px + 6, c.py + c.ph - 8, P.t("fRoom"), "start", "m");
  if (answered < 0) {
    const t = text(c.X(75), c.Y(36), "?", "q", "middle");
    t.setAttribute("aria-hidden", "true");
    label(c.X(75), c.Y(36) + 34, P.t("f1Hint"), "middle", "m");
  } else {
    label(c.X(118), c.Y(COLD_ON[120]) + 18, P.t("fOn") + " " + f(COLD_ON[120], 1), "end", "m a");
    label(c.X(118), c.Y(COLD_OFF[120]) - 8, P.t("fOff") + " " + f(COLD_OFF[120], 1), "end", "m");
  }
}

function layout(W, H) {
  const lh = W < 420 ? 100 : 96, top = { x: 6, y: 6, w: W - 12, h: lh };
  const rest = H - lh - 18;
  if (W >= 520) {
    const fw = clamp(Math.round(W * 0.32), 150, 240);
    return { loop: top, fig: { x: 6, y: lh + 14, w: fw, h: rest }, chart: { x: fw + 14, y: lh + 14, w: W - fw - 20, h: rest } };
  }
  const fh = Math.round(rest * 0.42);
  return { loop: top, fig: { x: 6, y: lh + 14, w: W - 12, h: fh }, chart: { x: 6, y: lh + 20 + fh, w: W - 12, h: rest - fh - 6 } };
}
function respName(U) {
  const p = tempParts(U);
  if (!p.warm && !p.cool) return P.t("rNone");
  if (p.warm) return P.t(p.extra > 0 ? "rShiver" : "rKeep");
  return P.t(p.extra > 0 ? "rSweat" : "rDilate");
}
function body(R, s) {
  const p = tempParts(s.U), wide = R.w > R.h * 0.9;
  const h = Math.min(R.h - 40, wide ? R.h - 40 : R.w * 1.9), cx = R.x + R.w / 2, top = R.y + 26;
  const u = h / 10; // body unit
  text(R.x + 4, R.y + 14, P.t("fAir", { a: f(air(), 0) }), "m b");
  text(R.x + R.w - 4, R.y + 14, P.t("fCoreV", { c: f(s.T, 1) }), "b a", "end");
  // flush (red) when vessels widen, pale (blue) when they narrow
  const tint = p.cool ? "warm" : p.warm ? "cool" : "";
  const parts = [["circle", { cx, cy: top + u, r: u * 0.9 }],
    ["rect", { x: cx - u * 1.3, y: top + u * 2.1, width: u * 2.6, height: u * 3.8, rx: u * 0.6 }],
    ["rect", { x: cx - u * 2.1, y: top + u * 2.3, width: u * 0.7, height: u * 3.4, rx: u * 0.35 }],
    ["rect", { x: cx + u * 1.4, y: top + u * 2.3, width: u * 0.7, height: u * 3.4, rx: u * 0.35 }],
    ["rect", { x: cx - u * 1.15, y: top + u * 6, width: u * 1, height: u * 3.9, rx: u * 0.45 }],
    ["rect", { x: cx + u * 0.15, y: top + u * 6, width: u * 1, height: u * 3.9, rx: u * 0.45 }]];
  parts.forEach(([tg, a]) => {
    S(tg, Object.assign({ class: "skin" }, a));
    if (tint) S(tg, Object.assign({ class: tint, opacity: (0.12 + 0.4 * p.vaso).toFixed(2) }, a));
  });
  // sweat drops
  if (p.cool && p.extra > 0) {
    const n = Math.round(2 + p.extra * 8), rr = mulberry32(5);
    for (let i = 0; i < n; i++) {
      const x = cx + (rr() - 0.5) * u * 4.6, y = top + u * (0.6 + rr() * 5.6), r = u * 0.18;
      S("path", { d: `M${x} ${y - r * 2} Q${x + r * 1.2} ${y} ${x} ${y + r} Q${x - r * 1.2} ${y} ${x} ${y - r * 2} Z`, class: "drop" });
    }
  }
  // shiver marks
  if (p.warm && p.extra > 0) {
    const n = Math.round(1 + p.extra * 3);
    for (let i = 0; i < n; i++) for (const side of [-1, 1]) {
      const x = cx + side * u * (2.5 + i * 0.45), y0 = top + u * 2.6, k = u * 0.25;
      let d = `M${x} ${y0}`;
      for (let j = 1; j <= 6; j++) d += ` L${x + (j % 2 ? k : -k)} ${y0 + j * u * 0.5}`;
      S("path", { d, class: "shiv" });
    }
  }
  text(R.x + R.w / 2, R.y + R.h - 4, respName(s.U) + (s.ex > 0 ? " · " + P.t("fRun") : ""), "m b", "middle");
  if (s.T < 35 || s.T > 40) label(cx, top + u * 5.4, P.t(s.T < 35 ? "warnCold" : "warnHot"), "middle", "m b").style.fill = "var(--no)";
}
function drawTemp(W, H) {
  const L = layout(W, H), fb = fbIn.checked, active = fb && (Math.abs(ts.U) > 0.5);
  loop(L.loop, [[P.t("lSensor"), P.t("dSensT"), P.t("hSensT")], [P.t("lControl"), P.t("dCtrlT"), P.t("hCtrlT")], [P.t("lEffect"), P.t("dEffT"), P.t("hEffT")]], active, fb ? -1 : 1);
  body(L.fig, ts);
  const t1 = Math.max(240, ts.t), events = ts.hist.filter((h) => h.ev === "run" && !ts.hist.find((q) => q.t === h.t - 1 && q.ev)).map((h) => ({ t: h.t, s: P.t("fRun") }));
  chart(L.chart, { t0: t1 - 240, t1, lo: 36, hi: 38, set: TS, series: [{ pts: ts.hist, cls: "valL" }], title: P.t("fCore"), events });
}
function tank(R, s) {
  const fb = fbIn.checked;
  text(R.x + 4, R.y + 14, P.t("fGV", { g: f(s.G, 1), mg: f(mgdl(s.G), 0) }), "m b");
  const tw = Math.min(R.w * 0.42, 150), th = Math.min(R.h - 100, 150), tx = R.x + (R.w - tw) / 2, ty = R.y + 44;
  S("rect", { x: tx, y: ty, width: tw, height: th, rx: 14, class: "blood" });
  const n = Math.round(clamp(s.G, 0, 20) * 6), rr = mulberry32(11);
  for (let i = 0; i < n; i++) S("circle", { cx: tx + 8 + rr() * (tw - 16), cy: ty + 8 + rr() * (th - 16), r: 3, class: "glu" });
  const wdt = (v) => clamp(1 + v * 120, 1, 14);
  // inflows on the left (food at top, liver below), outflow on the right
  const fl = s.fl;
  [[fl.gut, ty + th * 0.3, "fGut"], [fl.liver, ty + th * 0.75, "fLiver"]].forEach(([v, y, k]) => {
    S("line", { x1: R.x + 4, y1: y, x2: tx - 4, y2: y, class: "flow in", "stroke-width": wdt(v), opacity: v > 0.002 ? 1 : 0.25 });
    text(R.x + 4, y - 9, P.t(k), "m");
  });
  S("line", { x1: tx + tw + 4, y1: ty + th / 2, x2: R.x + R.w - 4, y2: ty + th / 2, class: "flow out", "stroke-width": wdt(fl.cells), opacity: fl.cells > 0.002 ? 1 : 0.25 });
  text(R.x + R.w - 4, ty + th / 2 - 9, P.t("fCells"), "m", "end");
  // hormone bars
  const by = ty + th + 18, bw = (R.w - 30) / 2, bh = 12;
  [[s.I, "ins", "fIns", R.x + 6], [s.N, "gcg", "fGcg", R.x + 18 + bw]].forEach(([v, cls, k, x]) => {
    S("rect", { x, y: by, width: bw, height: bh, rx: 4, class: "box" + (fb ? "" : " off") });
    S("rect", { x, y: by, width: bw * clamp(v / 0.08, 0, 1), height: bh, rx: 4, class: "hbar " + cls });
    text(x, by + bh + 16, P.t(k), "m");
  });
  if (s.G < 3.9 || s.G > 10) label(tx + tw / 2, ty + th / 2, P.t(s.G < 3.9 ? "warnLow" : "warnHigh"), "middle", "m b").style.fill = "var(--no)";
}
function drawGlu(W, H) {
  const L = layout(W, H), fb = fbIn.checked, active = fb && (gs.I > 0.002 || gs.N > 0.002);
  loop(L.loop, [[P.t("lSensor"), P.t("lSensG"), P.t("dSensG")], [P.t("lHorm"), P.t("dHorm"), P.t("dHorm2")], [P.t("lEffect"), P.t("lEffG"), P.t("dEffG")]], active, fb ? -1 : 1);
  tank(L.fig, gs);
  const t1 = Math.max(240, gs.t), events = gs.hist.filter((h) => h.ev).map((h) => ({ t: h.t, s: P.t(h.ev === "meal" ? "fMeal" : "fWalk") }));
  chart(L.chart, { t0: t1 - 240, t1, lo: 3.5, hi: 8, set: GS, band: [4, 6], series: [{ pts: gs.hist, cls: "valL" }], title: P.t("fGlu"), events });
}
function drawRule(W, H) {
  const wide = W >= 560, g = 12;
  const A = wide ? { x: 6, y: 6, w: (W - 12 - g) / 2, h: H - 12 } : { x: 6, y: 6, w: W - 12, h: (H - 12 - g) / 2 };
  const B = wide ? { x: A.x + A.w + g, y: 6, w: A.w, h: A.h } : { x: 6, y: A.y + A.h + g, w: A.w, h: A.h };
  const c1 = chart(A, { t0: 0, t1: 120, lo: 34.5, hi: 37.5, set: TS, title: P.t("fCore") + " · " + P.t("fTwoT"), events: [{ t: 30, s: "" }],
    series: [{ pts: toPts(COLD_OFF), cls: "offL" }, { pts: toPts(COLD_ON), cls: "valL" }] });
  label(c1.X(118), c1.Y(COLD_ON[120]) + 18, P.t("fOn"), "end", "m a");
  label(c1.X(118), c1.Y(COLD_OFF[120]) - 8, P.t("fOff"), "end", "m");
  const c2 = chart(B, { t0: 0, t1: 180, lo: 3.5, hi: 8, set: GS, band: [4, 6], title: P.t("fGlu") + " · " + P.t("fTwoG"),
    series: [{ pts: toPts(MEAL_OFF), cls: "offL" }, { pts: toPts(MEAL_ON), cls: "valL" }] });
  label(c2.X(178), c2.Y(MEAL_ON[180]) - 8, P.t("fOn"), "end", "m a");
  label(c2.X(178), c2.Y(MEAL_OFF[180]) + 18, P.t("fOff"), "end", "m");
}

function draw() {
  const { W, H } = size();
  fig.innerHTML = "";
  document.getElementById("airVal").textContent = f(air(), 0) + " °C";
  if (step === 0) { drawGuess(W, H); extra.textContent = answered >= 0 ? P.t("fb" + (answered + 1), { d: DIP, t: SN.a, o: SN.b }) : ""; }
  if (step === 1) { drawTemp(W, H); extra.textContent = P.t("x2"); }
  if (step === 2) { drawGlu(W, H); extra.textContent = P.t("x3"); }
  if (step === 3) { drawRule(W, H); extra.textContent = P.t("x4", SN); }
  const pb = document.getElementById("play");
  pb.textContent = P.t(playing ? "pause" : "play");
  pb.setAttribute("aria-pressed", String(playing));
  resultNote();
}
function resultNote() {
  const el = document.getElementById("resultNote"), fv = P.t(fbIn.checked ? "on" : "off");
  if (step === 1 && ts.t > 0) el.textContent = P.t("rnTemp", { a: f(air(), 0), c: f(ts.T, 1), f: fv });
  else if (step === 2 && gs.t > 0) el.textContent = P.t("rnGlu", { g: f(gs.G, 1), mg: f(mgdl(gs.G), 0), f: fv });
  else el.textContent = P.t("rnStory", SN);
}
function announce() {
  if (step === 1) Play.live(liveEl, P.t("liveT", { m: ts.t, a: f(air(), 0), c: f(ts.T, 2), r: respName(ts.U) }));
  if (step === 2) Play.live(liveEl, P.t("liveG", { m: gs.t, g: f(gs.G, 1), mg: f(mgdl(gs.G), 0), i: f(gs.I * 100, 1), n: f(gs.N * 100, 1) }));
}

// ---------- actions ----------
function advance(min) {
  for (let i = 0; i < min; i++) {
    if (step === 1) tempStep(ts, air(), fbIn.checked, true);
    if (step === 2) gluStep(gs, fbIn.checked, true);
  }
}
function tick() {
  timer = 0;
  if (!playing || (step !== 1 && step !== 2)) return;
  advance(2);
  draw();
  if ((step === 1 ? ts.t : gs.t) % 10 === 0) announce();
  timer = setTimeout(tick, 100);
}
function stopPlay() { playing = false; clearTimeout(timer); timer = 0; }
function startPlay() { playing = true; clearTimeout(timer); timer = setTimeout(tick, 100); }
// after a user action: keep playing, or (reduced motion / paused) jump ahead so the effect shows
function kick() {
  if (!playing) { if (Play.reduced) advance(30); else startPlay(); }
  draw();
  announce();
}

const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { answered = i; if (step === 0) draw(); });

const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  stopPlay();
  step = i;
  fbIn.checked = true;
  const k = i + 1;
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("ctlAir").hidden = i !== 1;
  document.getElementById("ctlTemp").hidden = i !== 1;
  document.getElementById("ctlGlu").hidden = i !== 2;
  document.getElementById("ctlSim").hidden = i !== 1 && i !== 2;
  Play.live(liveEl, "");
  if ((i === 1 || i === 2) && !Play.reduced) startPlay();
  draw();
});

airIn.addEventListener("input", () => { draw(); if (!playing) announce(); });
airIn.addEventListener("change", () => { if (!playing && Play.reduced) { advance(30); draw(); announce(); } });
document.getElementById("cold").addEventListener("click", () => { airIn.value = 0; kick(); });
document.getElementById("hot").addEventListener("click", () => { airIn.value = 40; kick(); });
document.getElementById("run").addEventListener("click", () => { ts.ex = 20; kick(); });
document.getElementById("meal").addEventListener("click", () => { gs.meals.push(gs.t); kick(); });
document.getElementById("walk").addEventListener("click", () => { gs.ex = GEXD; kick(); });
document.getElementById("skip").addEventListener("click", () => { advance(30); draw(); announce(); });
document.getElementById("play").addEventListener("click", () => { if (playing) stopPlay(); else startPlay(); draw(); });
fbIn.addEventListener("change", () => { draw(); announce(); });
document.getElementById("reset").addEventListener("click", () => {
  stopPlay();
  airIn.value = 22; fbIn.checked = true; answered = -1; seed++;
  ts = tempNew(seed); gs = gluNew(seed + 100);
  pr.reset(); st.go(0);
});
document.addEventListener("visibilitychange", () => { if (document.hidden) stopPlay(); });
if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(fig);
else window.addEventListener("resize", draw);
</script>
</body>
</html>

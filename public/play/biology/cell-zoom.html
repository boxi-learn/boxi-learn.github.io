      S("path", { d: "M" + xy(a) + "L" + N(sx + 4) + " " + N(sy - 13), class: "lead", style: p === part ? "stroke:var(--hl);stroke-width:2;opacity:1" : "opacity:.35" }, fig);
      S("circle", { cx: N(a[0]), cy: N(a[1]), r: 2.5, class: "ldot" }, fig);
      text(sx, sy, P.t("pn_" + p), p === part ? "b" : "", "start", fig);
    });
  });
  Play.live(liveEl, P.t("live3", { n: labelled.size }));
}
function choosePart(p) {
  part = p; labelled.add(p);
  extra.textContent = "";
  const st = document.createElement("strong");
  st.textContent = P.t("pn_" + p) + " · " + P.t(PLANT_ONLY[p] ? "plantOnly" : "both") + DOT;
  extra.append(st, P.t("pd_" + p));
  buildChips(); draw();
}
function buildChips() {
  chips.innerHTML = "";
  PARTS.forEach((p) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (labelled.has(p) ? " done" : "") + (part === p ? " on" : "");
    b.textContent = P.t("pn_" + p);
    b.addEventListener("click", () => { choosePart(p); chips.querySelectorAll("button")[PARTS.indexOf(p)].focus(); });
    chips.appendChild(b);
  });
  const all = document.createElement("button");
  all.type = "button"; all.className = "small"; all.textContent = P.t("allBtn");
  all.addEventListener("click", () => { PARTS.forEach((p) => labelled.add(p)); buildChips(); draw(); });
  chips.appendChild(all);
}

// size ladder from the same table
function drawLadder() {
  const rows = LADDER.slice().sort((a, b) => T(a) - T(b));
  const cw = P.lang === "zh" ? 13 : 7.1, lw = min(W * 0.56, 8 + cw * mx(...rows.map((k) => (P.t("r_" + k) + " " + fmtRange(k)).length))), ax0 = lw + 8, ax1 = W - 14, top = 32, bot = H - 42;
  const lo = -0.3, hi = 3.3, X = (um) => ax0 + ((log10(um) - lo) / (hi - lo)) * (ax1 - ax0);
  const rh = (bot - top) / rows.length;
  text(12, H - 10, P.t("lad"), "m", "start", fig);
  const ex = X(T("eye"));
  S("rect", { x: N(ax0), y: top - 6, width: N(ex - ax0), height: N(bot - top + 6), style: fs("soft") }, fig);
  [1, 10, 100, 1000].forEach((u) => {
    const x = X(u);
    S("line", { x1: N(x), y1: top - 6, x2: N(x), y2: bot, style: ss("line", 1) }, fig);
    text(x, H - 10, String(u), "m", "middle", fig);
  });
  S("line", { x1: N(ex), y1: top - 12, x2: N(ex), y2: bot, style: ss("no", 2) + ";stroke-dasharray:5 3" }, fig);
  const el = P.t("eyeLine") + " " + fmtLen(T("eye"));
  text(min(ex + 4, W - 6 - el.length * cw), top - 16, el, "no", "start", fig);
  text(ax0 + 4, bot + 15, P.t("micro"), "m", "start", fig);
  const col = { chloro: "a", plant: "a", stoma: "a", alga: "a", cheek: "c", nucleus: "c", rbc: "h", flake: "b", hair: "muted", bact: "h", param: "b", amoeba: "h" };
  rows.forEach((key, i) => {
    const y = top + (i + 0.5) * rh, s = SIZE[key], c = col[key];
    text(12, y + 4, P.t("r_" + key) + " " + fmtRange(key), key === "hair" ? "m" : "", "start", fig);
    if (s[0] !== s[2]) S("line", { x1: N(X(s[0])), y1: N(y), x2: N(X(s[2])), y2: N(y), style: ss(c, 5, 0.45) + LC }, fig);
    S("circle", { cx: N(X(s[1])), cy: N(y), r: 4.5, style: fs(c) }, fig);
  });
}

function draw() {
  size();
  fig.innerHTML = ""; clipN = 0;
  fig.classList.toggle("cmp", step === 2);
  if (step === 0) drawGuess();
  else if (step === 1) drawZoom();
  else if (step === 2) drawCompare();
  else drawLadder();
}

// ---------- zoom input ----------
function setLog(x) { logF = clamp(x, LMIN, LMAX); if (step === 1) draw(); }
function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = 0; }
function animTo(target) {
  stopAnim();
  target = clamp(target, LMIN, LMAX);
  if (Play.reduced) { setLog(target); return; }
  const from = logF, t0 = performance.now(), dur = 250 + 120 * abs(target - from);
  const tick = (t) => {
    const u = clamp((t - t0) / dur, 0, 1), e = u < 0.5 ? 2 * u * u : 1 - pow(-2 * u + 2, 2) / 2;
    setLog(from + (target - from) * e);
    anim = u < 1 ? requestAnimationFrame(tick) : 0;
  };
  anim = requestAnimationFrame(tick);
}
zoom.addEventListener("input", () => { stopAnim(); setLog(LMAX - +zoom.value / 10); });
$("zin").addEventListener("click", () => animTo(logF - 0.5));
$("zout").addEventListener("click", () => animTo(logF + 0.5));
fig.addEventListener("wheel", (e) => {
  if (step !== 1) return;
  e.preventDefault(); stopAnim();
  setLog(logF + e.deltaY * (e.deltaMode === 1 ? 30 : 1) * 0.0015);
}, { passive: false });
fig.addEventListener("keydown", (e) => {
  if (step !== 1) return;
  const m = { "+": -0.1, "=": -0.1, ArrowUp: -0.1, "-": 0.1, ArrowDown: 0.1, PageUp: -1, PageDown: 1 }[e.key];
  if (m) { e.preventDefault(); stopAnim(); setLog(logF + m); }
  if (e.key === "Home") { e.preventDefault(); animTo(LMAX); }
  if (e.key === "End") { e.preventDefault(); animTo(LMIN); }
});
const ptrs = new Map();
let pinch0 = 0, drag0 = null;
fig.addEventListener("pointerdown", (e) => {
  if (step === 2) {
    const t = e.target.closest && e.target.closest("[data-part]");
    if (t) choosePart(t.dataset.part);
    return;
  }
  if (step !== 1) return;
  e.preventDefault(); stopAnim();
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  try { fig.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = hypot(a[0] - b[0], a[1] - b[1]); drag0 = null; }
  else drag0 = [e.clientY, logF];
});
fig.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2 && pinch0 > 0) {
    const [a, b] = [...ptrs.values()], d = hypot(a[0] - b[0], a[1] - b[1]);
    if (d > 0) { setLog(logF - log10(d / pinch0)); pinch0 = d; }
  } else if (drag0) setLog(drag0[1] + ((e.clientY - drag0[0]) / mx(200, H)) * 1.5);
});
const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) drag0 = null; };
fig.addEventListener("pointerup", up); fig.addEventListener("pointercancel", up);

// specimen + jump buttons
const SPEC_KEY = { leaf: "specLeaf", hand: "specHand", pond: "specPond" };
function specButtons() {
  const box = $("specs");
  box.innerHTML = "";
  Object.keys(SPECS).forEach((s) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small" + (s === spec ? " on" : "");
    b.setAttribute("aria-pressed", s === spec ? "true" : "false");
    b.textContent = P.t(SPEC_KEY[s]) + (found[s] ? " ✓" : "");
    b.addEventListener("click", () => switchSpec(s));
    box.appendChild(b);
  });
  const jb = $("jumps");
  jb.innerHTML = "";
  SPECS[spec].jumps.forEach((F) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "small";
    b.textContent = P.t("n_" + stageOf(spec, F));
    b.title = fmtLen(F);
    b.addEventListener("click", () => animTo(log10(F)));
    jb.appendChild(b);
  });
}
function switchSpec(s) {
  if (s === spec) return;
  stopAnim();
  const go = () => { spec = s; specButtons(); draw(); fig.style.opacity = 1; };
  if (Play.reduced) { go(); return; }
  fig.style.opacity = 0;
  setTimeout(go, 160);
}

// ---------- steps ----------
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { predictNote = P.t("fb" + (i + 1)); if (step === 0) extra.textContent = predictNote; });

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  stopAnim();
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k);
  $("predict").hidden = i !== 0;
  $("ctlZoom").hidden = i !== 1;
  chips.hidden = i !== 2;
  foundEl.hidden = i !== 1;
  if (i === 1) fig.setAttribute("tabindex", "0"); else { fig.removeAttribute("tabindex"); fig.blur(); }
  extra.textContent = "";
  Play.live(liveEl, "");
  if (i === 0) extra.textContent = predictNote;
  if (i === 2) { buildChips(); if (part) choosePart(part); }
  if (i === 3) extra.textContent = P.t("x4", {
    lo: fmtLen(T("bact")), hi: fmtLen(T("amoeba")), eye: fmtLen(T("eye")), cc: fmtLen(T("cheek")), bb: fmtLen(T("bact")),
    m1: sig2(1000 / T("cheek")), m2: sig2(1000 / T("bact")),
  });
  draw();
});

$("resultNote").textContent = P.t("resultNote", { p: fmtRange("plant"), c: fmtLen(T("cheek")), b: fmtRange("bact"), e: fmtLen(T("eye")) });
$("foot").textContent = P.t("foot", {
  list: LADDER.map((k) => P.t("r_" + k) + " " + fmtRange(k)).join(P.lang === "zh" ? "；" : "; "),
  eye: fmtLen(T("eye")), lm: fmtLen(T("light")), sl: nice(T("slideL") / 1000) + " × " + fmtLen(T("slideW")), cs: fmtLen(T("cover")) + (P.lang === "zh" ? " 见方" : " square"),
});
specButtons();
$("reset").addEventListener("click", () => {
  stopAnim(); logF = LMAX; spec = "leaf"; predictNote = ""; part = null; labelled = new Set();
  found = { leaf: false, hand: false, pond: false }; fig.style.opacity = 1;
  pr.reset(); specButtons(); st.go(0);
});
if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(fig);
else window.addEventListener("resize", draw);
</script>
</body>

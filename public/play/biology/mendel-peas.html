// ---------- pure logic ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const NS_ = [1, 10, 100, 1000], MAXN = 1000;
const MENDEL = { p: 705, w: 224 };
const ratio = (p, w) => (w > 0 ? p / w : Infinity);
// One child of parents g1, g2 (strings like "Pp"): each gives one of its two letters at random.
function child(g1, g2, rnd) {
  const a = g1[rnd() < 0.5 ? 0 : 1], b = g2[rnd() < 0.5 ? 0 : 1];
  return { a, b };
}
const purple = (c) => c.a === "P" || c.b === "P";
const geno = (c) => (c.a === "p" && c.b === "P" ? "Pp" : c.a + c.b);
function cross(g1, g2, n, seed) {
  const rnd = mulberry32(seed), out = [];
  for (let i = 0; i < n; i++) out.push(child(g1, g2, rnd));
  return out;
}
// counts of the first n children: cells[i][j], i = parent-1 allele (0:P,1:p), j = parent-2 allele
function tally(kids, n) {
  const cells = [[0, 0], [0, 0]];
  let p = 0;
  for (let i = 0; i < n; i++) {
    const c = kids[i];
    cells[c.a === "P" ? 0 : 1][c.b === "P" ? 0 : 1]++;
    if (purple(c)) p++;
  }
  return { cells, p, w: n - p };
}

// ---------- state ----------
let seed = 1, step = 0, answered = -1, mystery = 0, revealed = false;
let kids = cross("Pp", "Pp", MAXN, seed);
const f = Play.fmt;
const rStr = (p, w) => (w > 0 ? f(ratio(p, w), 2) : P.t("rNone"));
const MR = f(ratio(MENDEL.p, MENDEL.w), 2);
const CHANCE10 = Math.pow(0.5, 10);
document.getElementById("resultNote").textContent = P.t("resultNote", { mp: MENDEL.p, mw: MENDEL.w, mr: MR });
function mysteryGenos() { return mulberry32(seed * 7919 + 3)() < 0.5 ? ["PP", "Pp"] : ["Pp", "PP"]; }

// ---------- drawing ----------
const fig = document.getElementById("fig"), nIn = document.getElementById("n");
const extra = document.getElementById("extra"), liveEl = document.getElementById("live");
const S = (tag, a, p) => Play.svg(tag, a, p || fig);
function text(x, y, s, cls, anchor) {
  const t = S("text", { x, y, class: "lbl " + (cls || ""), "text-anchor": anchor || "start" });
  t.textContent = s;
  return t;
}
function arrow(x1, y1, x2, y2) {
  S("line", { x1, y1, x2, y2, class: "arrow" });
  const a = Math.atan2(y2 - y1, x2 - x1), L = 8;
  const p = [[x2, y2], [x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45)], [x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45)]];
  S("polygon", { points: p.map((q) => q.join(",")).join(" "), class: "ah" });
}
function flower(cx, cy, r, kind, stem) {
  if (stem) S("path", { d: `M${cx} ${cy + r * 0.6} L${cx} ${cy + r * 2.1}`, class: "stem" });
  const cls = kind === "P" ? "petP" : kind === "B" ? "petB" : "petW";
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
    S("ellipse", { cx: cx + Math.cos(a) * r * 0.55, cy: cy + Math.sin(a) * r * 0.55, rx: r * 0.5, ry: r * 0.38,
      transform: `rotate(${(a * 180) / Math.PI} ${cx + Math.cos(a) * r * 0.55} ${cy + Math.sin(a) * r * 0.55})`, class: cls });
  }
  S("circle", { cx, cy, r: r * 0.22, class: "ctr" });
}
function size() {
  const r = fig.getBoundingClientRect();
  const W = Math.max(280, Math.round(r.width || 600)), H = Math.max(240, Math.round(r.height || 360));
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  return { W, H };
}

function drawGuess(W, H) {
  const r = Math.min(26, W / 16), y0 = 50;
  const xa = W * 0.28, xb = W * 0.72;
  flower(xa, y0, r, "P", true); flower(xb, y0, r, "W", true);
  text(xa, y0 + r * 2.1 + 18, P.t("fP") + " PP", "g", "middle");
  text(xb, y0 + r * 2.1 + 18, P.t("fW") + " pp", "g", "middle");
  text(W / 2, y0 + 8, "×", "big", "middle");
  const ay = y0 + r * 2.1 + 30;
  arrow(W / 2, ay, W / 2, ay + 26);
  const cy = ay + 26 + 18 + r;
  text(12, ay + 18, P.t("fF1"), "m b");
  const n = 4, gap = Math.min(80, (W - 40) / n);
  for (let i = 0; i < n; i++) {
    const x = W / 2 + (i - (n - 1) / 2) * gap;
    if (answered < 0) { text(x, cy + 12, "?", "q", "middle"); continue; }
    flower(x, cy, r * 0.85, "P", true);
    text(x, cy + r * 2 + 16, "Pp", "g", "middle");
  }
  if (answered < 0) text(W / 2, H - 14, P.t("f1Hint"), "m", "middle");
  else if (answered === 0) {
    // what the paint idea predicted, crossed out
    const x = 22, y = H - 22;
    flower(x, y - 4, 10, "B", false);
    const t = text(x + 18, y, P.t("fPale") + " ✗", "m", "start"); t.classList.add("b");
  }
}

function drawCross(W, H) {
  const n = NS_[+nIn.value], T = tally(kids, n), last = kids[n - 1];
  const narrow = W < 500;
  const barH = 64, top = 8;
  const sq = Math.max(120, Math.min(narrow ? W * 0.46 : W * 0.4, H - barH - 40));
  const hd = 24, cell = (sq - hd) / 2, x0 = 10, y0 = top + 14;
  // Punnett square
  text(x0, y0 - 2, P.t("fParents"), "m", "start");
  const al = ["P", "p"];
  for (let j = 0; j < 2; j++) {
    S("rect", { x: x0 + hd + j * cell, y: y0 + 2, width: cell, height: hd - 2, class: "hdr" });
    text(x0 + hd + j * cell + cell / 2, y0 + hd - 6, al[j], "g", "middle");
    S("rect", { x: x0, y: y0 + hd + j * cell, width: hd - 2, height: cell, class: "hdr" });
    text(x0 + hd / 2 - 1, y0 + hd + j * cell + cell / 2 + 6, al[j], "g", "middle");
  }
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const cx = x0 + hd + j * cell, cy = y0 + hd + i * cell, c = T.cells[i][j];
    const isW = i === 1 && j === 1;
    S("rect", { x: cx, y: cy, width: cell, height: cell, class: isW ? "cellW" : "cellP" });
    S("rect", { x: cx, y: cy, width: cell, height: cell, class: "cellLine" });
    text(cx + cell / 2, cy + cell / 2 - 4, geno({ a: al[i], b: al[j] }), "g", "middle");
    text(cx + cell / 2, cy + cell / 2 + 16, f(c, 0), "m", "middle");
  }
  const li = last.a === "P" ? 0 : 1, lj = last.b === "P" ? 0 : 1;
  S("rect", { x: x0 + hd + lj * cell + 2, y: y0 + hd + li * cell + 2, width: cell - 4, height: cell - 4, class: "cellHi" });
  text(x0 + sq / 2 + hd / 2, y0 + sq + 16, P.t("fEach"), "m", "middle");
  // seed tray
  const tx = x0 + sq + 16, tw = W - tx - 10, th = sq, ty = y0;
  S("rect", { x: tx, y: ty, width: tw, height: th, rx: 10, class: "panel" });
  text(tx + 10, ty + 18, P.t("fTray", { n }), "m b");
  const gx = tx + 8, gy = ty + 26, gw = tw - 16, gh = th - 34;
  const cols = n === 1 ? 1 : n <= 10 ? 5 : n <= 100 ? 10 : Math.max(20, Math.round(Math.sqrt(n * gw / gh)));
  const rows = Math.ceil(n / cols), pitch = Math.min(gw / cols, gh / rows);
  const ox = gx + (gw - pitch * cols) / 2, oy = gy + (gh - pitch * rows) / 2;
  for (let i = 0; i < n; i++) {
    const c = kids[i], x = ox + (i % cols) * pitch, y = oy + Math.floor(i / cols) * pitch;
    if (n <= 100) {
      if (pitch >= 24) flower(x + pitch / 2, y + pitch / 2, pitch * 0.4, purple(c) ? "P" : "W", false);
      else S("circle", { cx: x + pitch / 2, cy: y + pitch / 2, r: pitch * 0.38, class: purple(c) ? "seedP" : "seedW" });
    } else S("rect", { x: x + 0.3, y: y + 0.3, width: Math.max(0.6, pitch - 0.6), height: Math.max(0.6, pitch - 0.6), class: purple(c) ? "seedP" : "seedW" });
  }
  // bars: this run vs Mendel, with the expected 3 : 1 line
  const by = Math.max(y0 + sq + 30, H - barH), lw = narrow ? 88 : 116, vw = narrow ? 58 : 70;
  const bx = 10 + lw, bw = W - 20 - lw - vw;
  const rowsB = [[P.t("fThis", { n }), T.p, T.w], [P.t("fMendel"), MENDEL.p, MENDEL.w]];
  rowsB.forEach((r, i) => {
    const y = by + i * 26, tot = r[1] + r[2], fp = tot ? r[1] / tot : 0;
    text(10, y + 14, r[0], "m");
    S("rect", { x: bx, y: y + 2, width: bw, height: 16, rx: 3, class: "barW" });
    if (fp > 0) S("rect", { x: bx, y: y + 2, width: Math.max(1, fp * bw), height: 16, rx: 3, class: "barP" });
    text(W - 10, y + 15, (r[2] > 0 ? f(ratio(r[1], r[2]), 2) : "—") + " : 1", "b", "end");
  });
  const ex = bx + 0.75 * bw;
  S("line", { x1: ex, y1: by - 4, x2: ex, y2: by + 48, class: "exp" });
  text(ex, by - 7, P.t("fExp"), "m b", "middle");
  Play.live(liveEl, P.t("live2a", { a: last.a, b: last.b, g: geno(last), c: purple(last) ? P.t("fP") : P.t("fW") }) + " " +
    P.t("live2b", { n, p: T.p, w: T.w, r: rStr(T.p, T.w), wp: f((T.w / n) * 100, 1) }));
}

function drawRule(W, H) {
  const g = mysteryGenos()[mystery], name = mystery ? "B" : "A";
  const kidsT = cross(g, "pp", 10, seed * 31 + mystery + 11);
  const pc = kidsT.filter(purple).length;
  const r = Math.min(20, W / 22), y0 = 30;
  const xa = W * 0.22, xb = W * 0.58;
  flower(xa, y0, r, "P", true); flower(xb, y0, r, "W", true);
  text(xa, y0 + r * 2.1 + 16, revealed ? P.t("fMyst", { m: name }) + " = " + g : P.t("fUnknown", { m: name }), "m b", "middle");
  text(xb, y0 + r * 2.1 + 16, P.t("fWhite"), "m b", "middle");
  text((xa + xb) / 2, y0 + 6, "×", "big", "middle");
  const ky = y0 + r * 2.1 + 40, step10 = Math.min(34, (W - 40) / 10);
  for (let i = 0; i < 10; i++) flower(W / 2 + (i - 4.5) * step10, ky, step10 * 0.36, purple(kidsT[i]) ? "P" : "W", false);
  const verdict = text(W / 2, ky + step10 * 0.5 + 22, pc < 10 ? P.t("fHas") : P.t("fAll"), "b", "middle");
  if (pc < 10) verdict.classList.add("big");
  // the two models, generation by generation: parents → F1 → F2
  const my = Math.max(ky + 52, H - 112), fr = 8, gap = Math.min(22, (W - 40) / 10);
  [[P.t("fPaint"), "PxW>B>BBBB", P.t("fNever")], [P.t("fGene"), "PxW>P>PPPW", P.t("fBack")]].forEach((row, i) => {
    const y = my + i * 54;
    S("rect", { x: 6, y, width: W - 12, height: 48, rx: 8, class: "panel" });
    text(14, y + 17, row[0], "m b");
    text(W - 14, y + 17, row[2], i === 0 ? "m" : "b", "end");
    [...row[1]].forEach((k, j) => {
      const x = 22 + j * gap, yy = y + 34;
      if (k === "x") text(x, yy + 5, "×", "m", "middle");
      else if (k === ">") text(x, yy + 5, "→", "m", "middle");
      else flower(x, yy, fr, k, false);
    });
  });
  Play.live(liveEl, P.t("live3", { m: name, p: pc, w: 10 - pc }) + (revealed ? " " + P.t("live3r", { m: name, g }) : ""));
}

function draw() {
  const { W, H } = size();
  fig.innerHTML = "";
  const n = NS_[+nIn.value];
  document.getElementById("nVal").textContent = P.t("nVal", { n });
  document.getElementById("reveal").textContent = revealed ? P.t("hide") : P.t("reveal");
  document.getElementById("mA").classList.toggle("on", mystery === 0);
  document.getElementById("mB").classList.toggle("on", mystery === 1);
  document.getElementById("mA").setAttribute("aria-pressed", mystery === 0);
  document.getElementById("mB").setAttribute("aria-pressed", mystery === 1);
  if (step === 0) { drawGuess(W, H); extra.textContent = answered >= 0 ? P.t("fb" + (answered + 1)) : ""; Play.live(liveEl, ""); }
  if (step === 1) { drawCross(W, H); extra.textContent = P.t("x2", { mp: MENDEL.p, mw: MENDEL.w, mr: MR }); }
  if (step === 2) { drawRule(W, H); extra.textContent = P.t("x3", { odds: f(1 / CHANCE10, 0) }); }
}

// ---------- steps & controls ----------
const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { answered = i; if (step === 0) draw(); });

const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("ctlN").hidden = i !== 1;
  document.getElementById("ctlTest").hidden = i !== 2;
  draw();
});

nIn.addEventListener("input", draw);
document.getElementById("reroll").addEventListener("click", () => { seed++; kids = cross("Pp", "Pp", MAXN, seed); draw(); });
document.getElementById("mA").addEventListener("click", () => { mystery = 0; revealed = false; draw(); });
document.getElementById("mB").addEventListener("click", () => { mystery = 1; revealed = false; draw(); });
document.getElementById("reveal").addEventListener("click", () => { revealed = !revealed; draw(); });
document.getElementById("reset").addEventListener("click", () => {
  seed = 1; kids = cross("Pp", "Pp", MAXN, seed); nIn.value = 1; answered = -1; mystery = 0; revealed = false; pr.reset(); st.go(0);
});
if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(fig);
else window.addEventListener("resize", draw);
</script>
</body>
</html>

// ---------- numbers (all computed here) ----------
const LB = 0.45359237, OZ = LB / 16;
const H0 = { tree0: 5 * LB, tree5: 169 * LB + 3 * OZ, soil0: 200 * LB, soilLoss: 2 * OZ }; // kg, as reported
const GAIN = H0.tree5 - H0.tree0;                       // kg
const AM = { C: 12.011, H: 1.008, O: 15.999 };
const M = {
  CO2: AM.C + 2 * AM.O, H2O: 2 * AM.H + AM.O, O2: 2 * AM.O,
  GLU: 6 * AM.C + 12 * AM.H + 6 * AM.O,
};
// 6CO2 + 6H2O -> C6H12O6 + 6O2, grams per gram of glucose
const PER = { CO2: 6 * M.CO2 / M.GLU, H2O: 6 * M.H2O / M.GLU, O2: 6 * M.O2 / M.GLU };
const SHARE = { C: 6 * AM.C / M.GLU, O: 6 * AM.O / M.GLU, H: 12 * AM.H / M.GLU }; // of glucose mass
const FROM_AIR = SHARE.C + SHARE.O, FROM_WATER = SHARE.H;
const DRY = GAIN * 0.5;                                  // rough: fresh wood about half water
const growth = (u) => Math.pow(Play.clamp(u, 0, 1), 1.5); // illustrative curve between reported ends
function willow(y) {
  const u = Play.clamp(y / 5, 0, 1);
  return { tree: H0.tree0 + GAIN * growth(u), soil: H0.soil0 - H0.soilLoss * u };
}
const roundSig = (x, s) => { if (!(x > 0)) return 0; const p = Math.pow(10, Math.floor(Math.log10(x)) - s + 1); return Math.round(x / p) * p; };
const f = Play.fmt;
const pct = (x) => f(x * 100, 1);

// ---------- DOM ----------
const fig = document.getElementById("fig");
const year = document.getElementById("year"), glu = document.getElementById("glu");
const playBtn = document.getElementById("playBtn");
const extra = document.getElementById("extra"), liveEl = document.getElementById("live");
let step = 0, predictNote = "", raf = 0, last = 0, yf = 0;
document.getElementById("resultNote").textContent = P.t("resultNote", { ap: pct(FROM_AIR) });

const S = (tag, a, p) => Play.svg(tag, a, p || fig);
function text(x, y, s, cls, anchor, p) {
  const t = S("text", { x, y, class: "lbl " + (cls || ""), "text-anchor": anchor || "start" }, p);
  t.textContent = s;
  return t;
}
function arrow(x1, y1, x2, y2) {
  S("line", { x1, y1, x2, y2, class: "arrow" });
  const a = Math.atan2(y2 - y1, x2 - x1), L = 9;
  const p = [[x2, y2], [x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45)], [x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45)]];
  S("polygon", { points: p.map((q) => q.join(",")).join(" "), class: "ah" });
}

// willow in a pot; returns geometry
function drawTree(cx, groundY, areaW, areaH, mass, label) {
  const pw = Math.min(areaW * 0.62, 130), ph = 52;
  const potTop = groundY - ph;
  S("line", { x1: cx - areaW / 2 + 6, y1: groundY, x2: cx + areaW / 2 - 6, y2: groundY, class: "ground" });
  S("path", { d: `M${cx - pw / 2} ${potTop} L${cx + pw / 2} ${potTop} L${cx + pw / 2 - 12} ${groundY} L${cx - pw / 2 + 12} ${groundY} Z`, class: "pot" });
  S("rect", { x: cx - pw / 2 + 3, y: potTop + 2, width: pw - 6, height: 9, rx: 3, class: "soil" });
  const s = Math.cbrt(Play.clamp(mass / H0.tree5, 0, 1));          // size ∝ cube root of mass
  const maxH = Math.max(40, potTop - 12);
  const th = Math.max(18, s * maxH * 0.45), tw = 3 + s * 10;
  const topY = potTop - th;
  S("path", { d: `M${cx - tw / 2} ${potTop + 2} L${cx - tw / 4} ${topY} L${cx + tw / 4} ${topY} L${cx + tw / 2} ${potTop + 2} Z`, class: "trunk" });
  const rx = Math.max(12, s * Math.min(areaW / 2 - 8, maxH * 0.55)), ry = Math.max(10, s * maxH * 0.3);
  const cy = topY - ry * 0.35;
  for (let i = 0; i < 9; i++) {                                     // drooping willow strands
    const x0 = cx - rx * 0.85 + (i / 8) * rx * 1.7;
    S("path", { d: `M${x0} ${cy} Q${x0 + (x0 - cx) * 0.25} ${cy + ry} ${x0 + (x0 - cx) * 0.15} ${cy + ry * 1.5}`, class: "twig" });
  }
  S("ellipse", { cx, cy, rx, ry, class: "leaf" });
  if (label) text(cx, groundY + 20, label, "m", "middle");
  return { potTop, top: cy - ry };
}

function bar(x, y, w, h, frac, cls) {
  S("rect", { x, y, width: Math.max(0, w), height: h, rx: 3, class: "barbg" });
  const v = Play.clamp(frac, 0, 1) * w;
  if (v > 0) S("rect", { x, y, width: Math.max(1, v), height: h, rx: 3, class: cls });
}

function size() {
  const r = fig.getBoundingClientRect();
  const W = Math.max(280, Math.round(r.width || 600)), H = Math.max(240, Math.round(r.height || 360));
  fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
  return { W, H };
}

function drawGuess(W, H) {
  const cx = W * 0.5, g = H - 34;
  const t = drawTree(cx, g, Math.min(W * 0.4, 220), H, H0.tree0 + GAIN * 0.15, P.t("fPot"));
  text(cx, Math.max(40, t.top - 14), "?", "q", "middle").setAttribute("class", "q");
  const sx = W - 46, sy = 44;
  S("circle", { cx: sx, cy: sy, r: 18, class: "sun" });
  text(sx, sy + 38, P.t("fSun"), "m", "middle");
  arrow(sx - 26, sy + 14, cx + 30, t.top + 26);
  text(16, 40, P.t("fAir"), "m", "start");
  arrow(40, 52, cx - 34, t.top + 26);
  text(16, H * 0.62, P.t("fWater"), "m", "start");
  arrow(56, H * 0.62 - 4, cx - Math.min(W * 0.2, 70), t.potTop + 6);
}

function drawWillow(W, H) {
  const y = +year.value, w = willow(y);
  const split = W * 0.47;
  drawTree(split / 2 + 4, H - 34, split - 8, H, w.tree, P.t("fYear", { y: f(y, 1) }));
  const x0 = split + 8, cw = W - x0 - 12, gap = 10, ch = (H - 24 - gap) / 2;
  const cards = [
    { y: 12, name: P.t("fTree"), val: f(w.tree, 2) + " kg", d: "+" + f(w.tree - H0.tree0, 2) + " kg", fr: (w.tree - H0.tree0) / 80, cls: "bA",
      sub: P.t("fStart", { v: f(H0.tree0, 2) }) },
    { y: 12 + ch + gap, name: P.t("fSoil"), val: f(w.soil, 3) + " kg", d: "−" + f((H0.soil0 - w.soil) * 1000, 0) + " g", fr: (H0.soil0 - w.soil) / 80, cls: "bB",
      sub: P.t("fSame") },
  ];
  const k = ch / 150;
  cards.forEach((c) => {
    S("rect", { x: x0, y: c.y, width: cw, height: ch, rx: 10, class: "panel" });
    text(x0 + 12, c.y + 22 * k + 4, c.name, "m b");
    text(x0 + 12, c.y + 52 * k + 6, c.val, "big");
    text(x0 + 12, c.y + 80 * k + 6, c.d, "b");
    bar(x0 + 12, c.y + 96 * k + 4, cw - 24, 10, c.fr, c.cls);
    text(x0 + 12, c.y + 128 * k + 6, c.sub, "m");
  });
}

function drawAtoms(W, H) {
  const g = +glu.value;
  const amt = { co2: g * PER.CO2, h2o: g * PER.H2O, o2: g * PER.O2 };
  const max = 1000 * PER.CO2;
  const eqY = 26;
  text(W / 2, eqY, "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "eq", "middle");
  const rows = [
    [P.t("mCO2"), amt.co2, "bC"], [P.t("mH2O"), amt.h2o, "bH"],
    [P.t("mGlu"), g, "bA"], [P.t("mO2"), amt.o2, "bB"],
  ];
  const lw = W < 420 ? 84 : 104, vw = 68, top = 44, rh = Math.min(34, (H - 170) / 4);
  rows.forEach((r, i) => {
    const yy = top + i * rh + (i >= 2 ? 6 : 0);
    text(12, yy + 15, r[0], "m");
    bar(12 + lw, yy + 4, W - 24 - lw - vw, 14, r[1] / max, r[2]);
    text(W - 12, yy + 16, f(r[1], 0) + " g", "", "end");
  });
  const by = top + 4 * rh + 26;
  text(W / 2, by, P.t("fBal", { a: f(amt.co2 + amt.h2o, 1), b: f(g + amt.o2, 1) }), "m", "middle");
  const cy = by + 30;
  text(12, cy, P.t("fComp"), "m b");
  const bw = W - 24, segs = [[SHARE.C, "bC", P.t("fC")], [SHARE.O, "bC", P.t("fO")], [SHARE.H, "bH", P.t("fH")]];
  let x = 12;
  segs.forEach((s, i) => {
    const w = s[0] * bw;
    S("rect", { x, y: cy + 10, width: Math.max(1, w - 2), height: 22, rx: 3, class: s[1], opacity: i === 1 ? 0.7 : 1 });
    if (w > 22) text(x + w / 2, cy + 26, s[2], "b", "middle").style.fill = "var(--surface)";
    x += w;
  });
  text(12, cy + 52, P.t("fFromAir", { p: pct(FROM_AIR) }), "", "start");
  text(W - 12, cy + 52, P.t("fFromWater", { p: pct(FROM_WATER) }), "", "end");
  Play.live(liveEl, P.t("live3", { g: f(g, 0), co2: f(amt.co2, 1), h2o: f(amt.h2o, 1), o2: f(amt.o2, 1), per: f(PER.CO2, 2) }));
}

function drawRule(W, H) {
  const lw = W < 420 ? 88 : 110, vw = 74, bw = W - 24 - lw - vw;
  text(12, 26, P.t("fYear", { y: 5 }), "m b");
  [[P.t("fGain"), GAIN, f(GAIN, 1) + " kg", "bA"], [P.t("fLoss"), H0.soilLoss, f(H0.soilLoss * 1000, 0) + " g", "bB"]].forEach((r, i) => {
    const y = 40 + i * 32;
    text(12, y + 15, r[0], "m");
    bar(12 + lw, y + 4, bw, 14, r[1] / GAIN, r[3]);
    text(W - 12, y + 16, r[2], "b", "end");
  });
  const sy = 40 + 2 * 32 + 30;
  text(12, sy, P.t("fSugar"), "m b");
  const bw2 = W - 24, wa = FROM_AIR * bw2;
  S("rect", { x: 12, y: sy + 10, width: wa - 2, height: 26, rx: 3, class: "bC" });
  S("rect", { x: 12 + wa, y: sy + 10, width: Math.max(1, bw2 - wa), height: 26, rx: 3, class: "bH" });
  text(12, sy + 58, P.t("fAirS") + " " + pct(FROM_AIR) + "%", "b");
  text(W - 12, sy + 58, P.t("fWaterS") + " " + pct(FROM_WATER) + "%", "b", "end");
  const my = Math.min(H - 20, sy + 96);
  S("circle", { cx: 20, cy: my - 5, r: 6, class: "bB" });
  text(34, my, P.t("fMin"), "m");
}

function draw() {
  const { W, H } = size();
  fig.innerHTML = "";
  if (step === 0) drawGuess(W, H);
  else if (step === 1) drawWillow(W, H);
  else if (step === 2) drawAtoms(W, H);
  else drawRule(W, H);
  const y = +year.value, w = willow(y);
  document.getElementById("yearVal").textContent = P.t("yearVal", { y: f(y, 1) });
  document.getElementById("gluVal").textContent = f(+glu.value, 0) + (P.lang === "zh" ? " 克" : " g");
  playBtn.textContent = raf ? P.t("pause") : P.t("play");
  const gain = roundSig(GAIN, 2), loss = f(H0.soilLoss * 1000, 0);
  if (step === 0) { extra.textContent = predictNote; Play.live(liveEl, ""); }
  if (step === 1) {
    extra.textContent = y >= 5 ? P.t("x2b", { gain: f(GAIN, 0), loss, ratio: f(roundSig(GAIN / H0.soilLoss, 2), 0) }) : P.t("x2a");
    Play.live(liveEl, P.t("live2", { y: f(y, 1), tree: f(w.tree, 2), dt: "+" + f(w.tree - H0.tree0, 2), soil: f(w.soil, 3), ds: "−" + f((H0.soil0 - w.soil) * 1000, 0) }));
  }
  if (step === 2) extra.textContent = P.t("x3", { hp: pct(FROM_WATER) });
  if (step === 3) {
    extra.textContent = P.t("x4", { gain: f(gain, 0), dry: f(roundSig(DRY, 2), 0), co2: f(roundSig(DRY * PER.CO2, 2), 0) });
    Play.live(liveEl, P.t("live4", { gain: f(GAIN, 1), loss, ap: pct(FROM_AIR), hp: pct(FROM_WATER) }));
  }
}

// ---------- animation (never autoplays) ----------
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
function tick(t) {
  const dt = last ? (t - last) / 1000 : 0;
  last = t;
  yf = Play.clamp(yf + dt, 0, 5);           // one year per second; keep the float, the slider snaps to 0.1
  const v = yf;
  year.value = v;
  if (v >= 5) { stop(); draw(); return; }
  raf = requestAnimationFrame(tick);
  draw();
}
playBtn.addEventListener("click", () => {
  if (raf) { stop(); draw(); return; }
  if (+year.value >= 5) year.value = 0;
  yf = +year.value;
  last = 0;
  raf = requestAnimationFrame(tick);
  draw();
});

// ---------- steps ----------
const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { predictNote = P.t("fb" + (i + 1)); if (step === 0) extra.textContent = predictNote; });

const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  step = i;
  const k = i + 1;
  if (i !== 1) stop();
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("ctlYear").hidden = i !== 1;
  document.getElementById("ctlGlu").hidden = i !== 2;
  draw();
});

year.addEventListener("input", () => { stop(); draw(); });
glu.addEventListener("input", draw);
document.getElementById("reset").addEventListener("click", () => {
  stop(); year.value = 0; glu.value = 100; predictNote = ""; pr.reset(); st.go(0);
});
if ("ResizeObserver" in window) new ResizeObserver(() => draw()).observe(fig);
else window.addEventListener("resize", draw);
</script>
</body>
</html>

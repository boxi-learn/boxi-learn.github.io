  CODE[(B4[i] + B4[j] + B4[k]).replace(/T/g, "U")] = AA1[16 * i + 4 * j + k];
const AA3 = { A: "Ala", R: "Arg", N: "Asn", D: "Asp", C: "Cys", Q: "Gln", E: "Glu", G: "Gly", H: "His", I: "Ile",

  if (step === 0) {
    drawCellPair();
    extra.textContent = answered >= 0 ? P.t("fb" + (answered + 1)) : "";
    Play.live(liveEl, "");
  }
  if (step === 1) drawGene();
  if (step === 2) drawBook();
}
fig.addEventListener("click", (e) => {
  const d = e.target.dataset || {};
  if (step === 1 && d.i !== undefined) tapBase(+d.i);
  if (step === 2 && d.r !== undefined) toggle(+d.r, +d.g);
});
fig.addEventListener("keydown", (e) => {
  const k = e.key;
  if (step === 1) {
    if (k === "ArrowRight" || k === "ArrowLeft") { sel = Play.clamp(sel + (k === "ArrowRight" ? 1 : -1), 0, GENE.length - 1); draw(); }
    else if (k === "ArrowUp" || k === "ArrowDown") {
      const b = gene()[sel], d = k === "ArrowUp" ? 1 : 3;
      if (mut && mut.i !== sel) mut = null;
      setBase(sel, LETTERS[(LETTERS.indexOf(mut ? b : GENE[sel]) + d) % 4]);
    } else if (/^[acgtACGT]$/.test(k)) { if (mut && mut.i !== sel) mut = null; setBase(sel, k.toUpperCase()); }
    else if (k === "Escape" || k === "Backspace") { mut = null; draw(); }
    else return;
    e.preventDefault();
  } else if (step === 2) {
    const mv = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0] }[k];
    if (mv) { cur3 = { r: Play.clamp(cur3.r + mv[0], 0, CELLS.length - 1), g: Play.clamp(cur3.g + mv[1], 0, GENES.length - 1) }; draw(); }
    else if (k === " " || k === "Enter") toggle(cur3.r, cur3.g);
    else return;
    e.preventDefault();
  }
});
progIn.addEventListener("input", () => { stopPlay(); prog = +progIn.value; draw(); });
playBtn.addEventListener("click", () => { if (playing) { stopPlay(); draw(); } else startPlay(); });
document.getElementById("undo").addEventListener("click", () => { mut = null; draw(); });
document.getElementById("real").addEventListener("click", () => { sw = CELLS.map((c) => c.on.slice()); draw(); });
document.getElementById("alloff").addEventListener("click", () => { sw = CELLS.map(() => [1, 0, 0, 0, 0]); draw(); });

const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { answered = i; if (step === 0) draw(); });

let entered2 = false;
const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  step = i;
  const k = i + 1;
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  document.getElementById("predict").hidden = i !== 0;
  document.getElementById("ctlGene").hidden = i !== 1;
  document.getElementById("ctlMut").hidden = i !== 1;
  document.getElementById("ctlBook").hidden = i !== 2;
  document.getElementById("tableBox").hidden = i !== 1;
  if (i === 0) fig.removeAttribute("tabindex"); else fig.tabIndex = 0;
  if (i !== 1) stopPlay();
  if (i === 1 && !entered2) {
    entered2 = true;
    if (Play.reduced) prog = geneState().maxP; else { prog = 0; startPlay(); return; }
  }
  draw();
});

document.getElementById("reset").addEventListener("click", () => {
  stopPlay();
  answered = -1; mut = null; sel = 0; prog = 0; entered2 = false;
  sw = CELLS.map(() => [1, 0, 0, 0, 0]); cur3 = { r: 0, g: 1 };
  pr.reset(); st.go(0);
});
let lastW = 0;
const onResize = () => { const w = Math.round(fig.getBoundingClientRect().width); if (w !== lastW) { lastW = w; draw(); } };
if ("ResizeObserver" in window) new ResizeObserver(onResize).observe(fig);
else window.addEventListener("resize", onResize);
</script>
</body>
</html>

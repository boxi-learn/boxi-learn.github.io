const mod = (a, n) => ((a % n) + n) % n;
function geo(W, H) {

  return {
    W, H, cx, cw, g, hx0, hx1, xR: hx0 + cw / 2, xL: hx1 - cw / 2, xl: hx0 - 24, xr: hx1 + 24,

    yBt: H * 0.81, yBb: H * 0.975, yBc: H * 0.895,
  };
}
// The loop as a closed polyline; each node carries the region of the segment that starts at it.
function buildPath(G) {
  const n = [];
  const add = (x, y, r) => n.push([x, y, r]);

    const waves = Math.max(2, Math.round(Math.abs(x1 - x0) / 40)), N = Math.max(12, Math.round(Math.abs(x1 - x0) / 4));
    for (let i = 0; i < N; i++) { const t = i / N; add(x0 + (x1 - x0) * t, y + amp * Math.sin(t * waves * 2 * Math.PI), r); }
  };
  add(G.hx0, G.yAc, "ra"); add(G.xR, G.yAc, "ra"); add(G.xR, G.yAV, "rv"); add(G.xR, G.yVc, "rv");
  add(G.cx - G.g / 2, G.yP, "pa"); add(G.cx, G.yP, "pa"); add(G.cx, G.yL1, "pa"); add(G.xl, G.yL1, "pa");
  wig(G.xl, G.xr, G.yLc, (G.yLb - G.yLt) * 0.26, "lungs");
  add(G.xr, G.yLc, "pv"); add(G.xr, G.yAc, "pv"); add(G.hx1, G.yAc, "la"); add(G.xL, G.yAc, "la");
  add(G.xL, G.yAV, "lv"); add(G.xL, G.yVc, "lv"); add(G.hx1, G.yVc, "ao"); add(G.xr, G.yVc, "ao");
  wig(G.xr, G.xl, G.yBc, (G.yBb - G.yBt) * 0.2, "body");
  add(G.xl, G.yBc, "vc"); add(G.xl, G.yAc, "vc");
  const cum = [0];
  for (let i = 0; i < n.length; i++) {
    const a = n[i], b = n[(i + 1) % n.length];
    cum.push(cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  const L = cum[n.length], spans = {};
  n.forEach((p, i) => {
    const s = spans[p[2]] || (spans[p[2]] = [cum[i], cum[i]]);
    s[1] = Math.max(s[1], cum[i + 1]);

  return { n, cum, L, spans };
}
function segAt(path, s) {
  let lo = 0, hi = path.n.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (path.cum[m] <= s) lo = m; else hi = m - 1; }

}
function pointAt(path, s) {
  s = mod(s, path.L);
  const i = segAt(path, s), a = path.n[i], b = path.n[(i + 1) % path.n.length];
  const len = path.cum[i + 1] - path.cum[i], t = len > 0 ? (s - path.cum[i]) / len : 0;
  return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, reg: a[2], ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };

  const reg = pointAt(path, s).reg, sp = path.spans[reg];
  const f = sp && sp[1] > sp[0] ? clampN((s - sp[0]) / (sp[1] - sp[0]), 0, 1) : 0;
  if (reg === "lungs") { const u = Math.min(1, f / 0.35); return SAT_V + (SAT_A - SAT_V) * u * (2 - u); } // loads within the first third
  if (reg === "body") return SAT_A - (SAT_A - SAT_V) * f;
  return OXY[reg] ? SAT_A : SAT_V;
}
function colourOf(sat) {
  const t = Number.isFinite(sat) ? clampN((sat - SAT_V) / (SAT_A - SAT_V), 0, 1) : 0;
  return "rgb(" + DARK.map((d, k) => Math.round(d + (BRIGHT[k] - d) * t)).join(",") + ")";
}
// Nearest point on the path ahead of s (within win); also says whether the pointer is closer to a point behind.
function project(path, px, py, s, win) {
  let fwd = null, all = null;
  for (let i = 0; i < path.n.length; i++) {
    const a = path.n[i], b = path.n[(i + 1) % path.n.length], dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
    const t = l2 > 0 ? clampN(((px - a[0]) * dx + (py - a[1]) * dy) / l2, 0, 1) : 0;
    const d = Math.hypot(a[0] + dx * t - px, a[1] + dy * t - py), sc = path.cum[i] + t * Math.sqrt(l2), f = mod(sc - s, path.L);
    if (f <= win && (!fwd || d < fwd.d)) fwd = { d, s: sc, f };
    if (!all || d < all.d) all = { d, f };
  }
  const back = !!all && all.f > path.L / 2 && all.d + 10 < (fwd ? fwd.d : Infinity);
  return { fwd, back };
}
// Regions entered while moving forward from s0 by d (in order).
function entered(path, s0, d) {
  const out = [];
  REGIONS.forEach((r) => {
    const sp = path.spans[r];
    if (!sp) return;
    const f = mod(sp[0] - s0, path.L);
    if (f > 0 && f <= d) out.push([f, r]);
  });
  if (d >= path.L) out.push([path.L, "ra"]);
  return out.sort((a, b) => a[0] - b[0]).map((x) => x[1]);
}
const cardiacOutput = (hr, sv) => (hr * sv) / 1000;           // L/min
const lapSeconds = (hr, sv) => { const c = cardiacOutput(hr, sv); return c > 0 ? (BLOOD_L / c) * 60 : Infinity; };
// LOGIC-END

const L = P.lang, fig = document.getElementById("fig"), extra = document.getElementById("extra"), liveEl = document.getElementById("live");
const hrIn = document.getElementById("hr"), svIn = document.getElementById("sv");
const play2 = document.getElementById("play2"), play3 = document.getElementById("play3");
const S = (tag, a, p) => Play.svg(tag, a, p || fig);
function text(x, y, s, cls, anchor, p) {
  const lines = String(s).split("\n"), t = S("text", { x, y, class: "lbl " + (cls || ""), "text-anchor": anchor || "start" }, p);
  lines.forEach((ln, i) => { const sp = Play.svg("tspan", { x, dy: i ? 15 : 0 }, t); sp.textContent = ln; });
  return t;
}

let step = 0, answered = -1, G = null, path = null, s = 0, visits = 1, laps = 0, msg = "";
let playing2 = false, playing3 = false, raf = 0, last = 0, flow = 0, beat = 0, H = {};

function size() {
  const W = Math.max(280, Math.round(fig.getBoundingClientRect().width || 600)), Ht = W < 520 ? 440 : 400;
  if (fig.style.height !== Ht + "px") fig.style.height = Ht + "px";
  fig.setAttribute("viewBox", `0 0 ${W} ${Ht}`);
  return [W, Ht];
}

// ---------- step 1: under the skin ----------
function drawGuess() {
  const [W, Ht] = size(), narrow = W < 520;
  fig.innerHTML = "";
  const A = narrow ? { x: 12, y: 8, w: W - 24, h: Ht * 0.34 } : { x: 14, y: 16, w: W * 0.4 - 14, h: Ht - 32 };
  const B = narrow ? { x: 12, y: Ht * 0.38, w: W - 24, h: Ht * 0.6 } : { x: W * 0.45, y: 16, w: W * 0.55 - 14, h: Ht - 32 };
  // what you see
  text(A.x, A.y + 14, P.t("fSee"), "b");
  S("rect", { x: A.x, y: A.y + 24, width: A.w, height: A.h - 24, rx: 18, class: "skin" });
  const vy = [0.42, 0.62, 0.8];
  vy.forEach((f, k) => {
    let d = "";
    const y0 = A.y + 24 + (A.h - 24) * f;
    for (let i = 0; i <= 24; i++) {
      const x = A.x + 16 + (A.w - 32) * (i / 24), y = y0 + 6 * Math.sin(i / 3 + k * 2);
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    S("path", { d, class: "veinlook" });
  });
  text(A.x + 16, A.y + 24 + (A.h - 24) * 0.22, P.t("fLook"), "m");
  // under the skin
  text(B.x, B.y + 14, P.t("fCut"), "b");
  const tubeW = 30, sw = B.w - tubeW - 44, y0 = B.y + 62, band = B.h * 0.14, bottom = B.y + B.h - 4;
  S("rect", { x: B.x, y: y0, width: sw, height: bottom - y0, rx: 8, class: "skin" });
  S("rect", { x: B.x, y: y0, width: sw, height: band, class: "skinband" });
  const r = Math.min(30, B.h * 0.11), vx = B.x + sw * 0.55, vyc = y0 + band + r + 18;
  const tx = B.x + B.w - tubeW - 10, ty = y0, th = Math.min(120, B.h * 0.42);
  if (answered < 0) {
    S("circle", { cx: vx, cy: vyc, r, class: "ask" });
    text(vx, vyc + 10, "?", "q", "middle");
    S("rect", { x: tx, y: ty, width: tubeW, height: th, rx: 10, class: "ask" });
    text(B.x + sw / 2, bottom - 14, P.t("fPick"), "m", "middle");
    return;
  }
  const dark = colourOf(SAT_V);
  S("circle", { cx: vx, cy: vyc, r, fill: dark, stroke: "var(--fg)", "stroke-width": 1.5 });
  text(vx, vyc + r + 20, P.t("fVein"), "b", "middle");
  // light: blue comes back from the skin, red reaches the vein and is absorbed (sketch)
  const top = B.y + 34;
  S("path", { d: `M${vx - 70} ${top + 8} L${vx - 46} ${y0 + band * 0.6} L${vx - 26} ${top + 8}`, class: "rayB" });
  S("path", { d: `M${vx - 30} ${top + 14} l4 -7 l4 8`, class: "rayB" });
  text(vx - 74, top + 4, P.t("fBlue"), "m", "end");
  S("path", { d: `M${vx + 44} ${top + 8} L${vx + r * 0.35} ${vyc - r + 2}`, class: "rayR" });
  text(vx + 48, top + 4, P.t("fRed"), "m");
  S("rect", { x: tx, y: ty, width: tubeW, height: th, rx: 10, fill: "none", stroke: "var(--fg)", "stroke-width": 1.5 });
  S("rect", { x: tx + 3, y: ty + th * 0.25, width: tubeW - 6, height: th * 0.75 - 3, rx: 8, fill: dark });
  text(tx + tubeW / 2, ty + th + 18, P.t("fTube"), "m", "middle");
}

// ---------- steps 2–3: the circuit ----------
function drawCircuit() {
  const [W, Ht] = size();
  G = geo(W, Ht); path = buildPath(G);
  fig.innerHTML = "";
  H = {};
  // lungs and body
  S("rect", { x: G.xl - 18, y: G.yLt, width: G.cx - G.xl + 10, height: G.yLb - G.yLt, rx: 26, class: "organ" });
  S("rect", { x: G.cx + 8, y: G.yLt, width: G.xr - G.cx + 10, height: G.yLb - G.yLt, rx: 26, class: "organ" });
  text(G.xl - 24, G.yLc + 5, P.t("lLungs"), "b", "end");
  S("rect", { x: G.xl - 18, y: G.yBt, width: G.xr - G.xl + 36, height: G.yBb - G.yBt, rx: 16, class: "organ" });
  text(G.xl + 10, G.yBt + 15, P.t("lBody"), "b");
  // heart
  S("rect", { x: G.hx0 - 8, y: G.yA0 - 8, width: G.hx1 - G.hx0 + 16, height: G.yV1 - G.yA0 + 16, rx: 22, class: "heartbox" });
  const ch = (x, y0, y1, oxy, wall) => S("rect", {
    x: x + wall / 2, y: y0 + wall / 2, width: G.cw - wall, height: y1 - y0 - wall, rx: 12, class: "chamber",
    fill: colourOf(oxy ? SAT_A : SAT_V), "fill-opacity": 0.32, "stroke-width": wall,
  });
  ch(G.hx0, G.yA0, G.yA1, 0, 2); ch(G.hx1 - G.cw, G.yA0, G.yA1, 1, 2);
  H.rv = ch(G.hx0, G.yV0, G.yV1, 0, 4); H.lv = ch(G.hx1 - G.cw, G.yV0, G.yV1, 1, 10);
  // vessels: grey underlay, then blood coloured by its oxygen
  const vessel = (r) => r !== "ra" && r !== "rv" && r !== "la" && r !== "lv";
  const segs = S("g", {});
  path.n.forEach((a, i) => {
    if (!vessel(a[2])) return;
    const b = path.n[(i + 1) % path.n.length];
    S("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "under", "stroke-width": 14 }, segs);
  });
  path.n.forEach((a, i) => {
    if (!vessel(a[2])) return;
    const b = path.n[(i + 1) % path.n.length], c = colourOf(satAt(path, (path.cum[i] + path.cum[i + 1]) / 2));
    S("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c, "stroke-width": 9, "stroke-linecap": "round" }, segs);
  });
  // direction chevrons
  for (let d = 30; d < path.L; d += 64) {
    const p = pointAt(path, d);
    if (!vessel(p.reg) || p.reg === "lungs" || p.reg === "body") continue;
    const c = Math.cos(p.ang), sn = Math.sin(p.ang);
    S("path", { d: `M${p.x + c * 4} ${p.y + sn * 4} L${p.x - c * 3 - sn * 3.5} ${p.y - sn * 3 + c * 3.5} L${p.x - c * 3 + sn * 3.5} ${p.y - sn * 3 - c * 3.5}Z`, class: "chev" });
  }
  // one-way valves (chevrons pointing downstream)
  const valve = (x, y, dir) => {
    const k = 8;
    const d = dir === "d" ? `M${x - k} ${y - 4} L${x} ${y + 4} L${x + k} ${y - 4}` : `M${x - 4} ${y - k} L${x + 4} ${y} L${x - 4} ${y + k}`;
    S("path", { d, class: "valve" });
  };
  valve(G.xR, G.yAV, "d"); valve(G.xL, G.yAV, "d"); valve(G.cx - G.g / 2 + 2, G.yP, "r"); valve(G.hx1 + 1, G.yVc, "r");
  // labels
  text(G.xR, G.yA0 + 17, P.t("lra"), "b", "middle");
  text(G.xL, G.yA0 + 17, P.t("lla"), "b", "middle");
  const vl = (x, k) => { const n = P.t(k).split("\n").length; text(x, G.yV1 - 10 - (n - 1) * 15, P.t(k), "b", "middle"); };
  vl(G.xR, "lrv"); vl(G.xL, "llv");
  text(G.cx - 8, G.yL1 + 18, P.t("lpa"), "m", "end");
  text(G.xr - 8, G.yL1 + 18, P.t("lpv"), "m", "end");
  text(G.xr + 10, G.yVc + 22, P.t("lao"), "m");
  text(G.xl - 10, G.yAc + 22, P.t("lvc"), "m", "end");
  H.capG = S("g", {});
  caption(P.t("front"));
  // moving things
  H.dots = S("g", {});
  H.cell = S("g", { class: "cellg" });
  S("circle", { r: 24, fill: "transparent" }, H.cell);
  H.cellC = S("circle", { r: 12, class: "cell" }, H.cell);
  S("ellipse", { rx: 5.5, ry: 3.5, class: "dimple" }, H.cell);
  H.cell.addEventListener("pointerdown", startDrag);
  if (step === 1) { H.dots.style.display = "none"; placeCell(); }
  else { H.cell.style.display = "none"; makeDots(); }
}
function caption(str) {
  H.capG.innerHTML = "";
  text(G.cx, G.yV1 + 23, str, "m", "middle", H.capG);
}
function placeCell() {
  if (!H.cell) return;
  const p = pointAt(path, s);
  H.cell.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
  H.cellC.setAttribute("fill", colourOf(satAt(path, s)));
}
function makeDots() {
  H.dots.innerHTML = "";
  H.dotEls = [];
  for (let i = 0; i < 26; i++) H.dotEls.push(S("circle", { r: 5.5, stroke: "var(--fg)", "stroke-width": 1 }, H.dots));
  placeDots();
}
function placeDots() {
  if (!H.dotEls || !path) return;
  H.dotEls.forEach((c, i) => {
    const d = flow * path.L + (i / H.dotEls.length) * path.L, p = pointAt(path, d);
    c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1));
    c.setAttribute("fill", colourOf(satAt(path, d)));
  });
  const ph = beat % 1, sq = ph < 0.3;
  if (H.rv) { H.rv.setAttribute("fill-opacity", sq ? 0.55 : 0.32); H.lv.setAttribute("fill-opacity", sq ? 0.55 : 0.32); }
}

// ---------- step 2 interaction ----------
function regionName(r) { return P.t("n" + r); }
function show2() {
  const p = pointAt(path, s), sat = satAt(path, s);
  extra.innerHTML = "";
  if (msg) { const m = document.createElement("span"); m.className = "tag-no"; m.textContent = msg; extra.append(m, document.createElement("br")); }
  const b = document.createElement("strong");
  b.textContent = regionName(p.reg) + (L === "zh" ? "：" : ": ");
  extra.append(b, document.createTextNode(P.t("x" + p.reg)));
  Play.live(liveEl, P.t("stat2", { s: Play.fmt(sat, 0), v: visits, l: laps }));
}
function moveBy(d) {
  if (!(d > 0)) return;
  entered(path, s, d).forEach((r) => {
    if (r === "ra") { laps++; visits = 1; } else if (r === "la") visits = 2;
  });
  s = mod(s + d, path.L);
  placeCell();
}
let dragging = false;
function startDrag(e) {
  if (step !== 1) return;
  dragging = true; stopAnim();
  try { fig.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
  e.preventDefault();
}
fig.addEventListener("pointermove", (e) => {
  if (!dragging || step !== 1) return;
  const q = Play.pointer(fig, e), pr = project(path, q.x, q.y, s, path.L * 0.2);
  if (pr.back) { msg = P.t("back"); show2(); return; }
  if (pr.fwd && pr.fwd.d < 60 && pr.fwd.f > 0.5) {
    msg = ""; moveBy(pr.fwd.f); show2();
  }
});
const endDrag = () => { dragging = false; };
fig.addEventListener("pointerup", endDrag);
fig.addEventListener("pointercancel", endDrag);
fig.addEventListener("keydown", (e) => {
  if (step !== 1) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "ArrowUp") { msg = ""; moveBy(path.L / 60); show2(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { msg = P.t("back"); show2(); e.preventDefault(); }
  else if (e.key === " " || e.key === "Enter") { toggle2(); e.preventDefault(); }
});
document.getElementById("next").addEventListener("click", () => {
  stopAnim();
  const cur = pointAt(path, s).reg, i = REGIONS.indexOf(cur), nx = REGIONS[(i + 1) % REGIONS.length];
  const target = path.spans[nx][0] + 0.01;
  msg = ""; moveBy(mod(target - s, path.L)); show2();
});

// ---------- step 3 ----------
function show3() {
  const hr = +hrIn.value, sv = +svIn.value, co = cardiacOutput(hr, sv), lap = lapSeconds(hr, sv);
  document.getElementById("hrVal").textContent = P.t("bpm", { n: hr });
  document.getElementById("svVal").textContent = P.t("ml", { n: sv });
  const v = { hr, sv, co: Play.fmt(co, 1), lap: Play.fmt(lap, 0), b: BLOOD_L };
  document.getElementById("resultMain").textContent = P.t("resMain", v);
  if (step !== 2) return;
  extra.textContent = P.t("x3", v);
  if (H.capG) caption(P.t("cap3", v));
  Play.live(liveEl, P.t("live3", v));
}
[hrIn, svIn].forEach((el) => el.addEventListener("input", show3));
const preset = (hr, sv) => { hrIn.value = hr; svIn.value = sv; show3(); };
document.getElementById("rest").addEventListener("click", () => preset(70, 70));
document.getElementById("exer").addEventListener("click", () => preset(150, 110));

// ---------- animation ----------
function setBtns() {
  play2.textContent = P.t(playing2 ? "pause" : "play");
  play3.textContent = P.t(playing3 ? "pause" : "play");
}
function tick(t) {
  const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
  last = t;
  if (step === 1 && playing2) { moveBy((path.L / 24) * dt); show2(); }
  if (step === 2 && playing3) {
    const hr = +hrIn.value, sv = +svIn.value;
    flow = mod(flow + dt / lapSeconds(hr, sv), 1);
    beat += (dt * hr) / 60;
    placeDots();
  }
  raf = (playing2 || playing3) ? requestAnimationFrame(tick) : 0;
}
function startAnim() { last = 0; if (!raf) raf = requestAnimationFrame(tick); setBtns(); }
function stopAnim() { playing2 = playing3 = false; if (raf) cancelAnimationFrame(raf); raf = 0; setBtns(); }
function toggle2() { if (playing2) stopAnim(); else { playing2 = true; msg = ""; startAnim(); } }
play2.addEventListener("click", toggle2);
play3.addEventListener("click", () => { if (playing3) stopAnim(); else { playing3 = true; startAnim(); } });

// ---------- steps ----------
const FB = ["fb1", "fb2", "fb3"];
const pr = Play.predict(document.getElementById("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, (i) => { answered = i; draw(); });
function draw() {
  if (step === 0) {
    drawGuess();
    extra.textContent = answered < 0 ? "" : P.t(FB[answered]) + " " + P.t("whyBlue");
    liveEl.textContent = "";
  } else {
    drawCircuit();
    if (step === 1) show2(); else show3();
  }
}
const vis = (id, on) => (document.getElementById(id).hidden = !on);
const st = Play.steps(document.getElementById("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  stopAnim();
  step = i;
  const k = i + 1;
  document.getElementById("kicker").textContent = P.t("k" + k);
  document.getElementById("stepTitle").textContent = P.t("t" + k);
  document.getElementById("stepBody").textContent = P.t("b" + k);
  vis("predict", i === 0); vis("ctl2", i === 1); vis("ctl3a", i === 2); vis("ctl3b", i === 2); vis("ctl3c", i === 2);
  msg = "";
  draw();
  if (i === 2 && !Play.reduced) { playing3 = true; startAnim(); }
});
document.getElementById("reset").addEventListener("click", () => {
  stopAnim();
  answered = -1; s = 0; visits = 1; laps = 0; flow = 0; beat = 0; msg = "";
  hrIn.value = 70; svIn.value = 70;
  pr.reset(); show3(); st.go(0);
});
let lastW = 0;
function onResize() {
  const w = Math.round(fig.getBoundingClientRect().width);
  if (!w || w === lastW) return;
  lastW = w;
  const f = path ? s / path.L : 0;
  draw();
  if (path) { s = f * path.L; if (step === 1) { placeCell(); show2(); } }
}
if ("ResizeObserver" in window) new ResizeObserver(onResize).observe(fig);
else window.addEventListener("resize", onResize);
setBtns(); show3();
</script>
</body>
</html>

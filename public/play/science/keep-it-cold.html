const $ = (id) => document.getElementById(id);

// ---------- physics (all numbers computed from these) ----------
const D = { room: 25, side: 3, rho: 0.917, Lf: 334, h: 10, body: 37, cold: 0, tMax: 960 }; // side cm; tMax minutes
const MASS = D.rho * D.side ** 3; // g
const AREA = 6 * (D.side / 100) ** 2; // m²
const MATS = [ // k W/(m·K), d mm per layer (illustrative)
  { id: "None", k: 0, d: 0, fill: "none" },
  { id: "Foil", k: 205, d: 0.02, fill: "var(--muted)" },
  { id: "Paper", k: 0.05, d: 1, fill: "var(--soft)" },
  { id: "Cotton", k: 0.06, d: 1, fill: "var(--hl)" },
  { id: "Wool", k: 0.04, d: 10, fill: "var(--b)" },
];
const thick = (mi, n) => (mi > 0 ? MATS[mi].d * n : 0); // mm
const Rcoat = (mi, n) => (mi > 0 ? thick(mi, n) / 1000 / MATS[mi].k : 0); // m²K/W
const Rair = 1 / D.h;
const flux = (dT, mi, n) => dT / (Rair + Rcoat(mi, n)); // W/m²
const slow = (mi, n) => (Rair + Rcoat(mi, n)) / Rair; // how many times slower than bare
const meltSec = (mi, n) => (MASS * D.Lf) / (flux(D.room, mi, n) * AREA);
const iceLeft = (tSec, mi, n) => MASS * Play.clamp(1 - tSec / meltSec(mi, n), 0, 1);
// temperature at x mm (x<0 inside the object, 0..d coat, d..d+FILM still-air film, beyond: air)
const FILM = 8;
function tempAt(x, Tin, Tout, d, Rc) {
  if (Tin === null) return Tout;
  const Ts = Tin + (Tout - Tin) * (Rc / (Rc + Rair)); // coat outer surface
  if (x <= 0) return Tin;
  if (x <= d) return Tin + (Ts - Tin) * (x / d);
  if (x <= d + FILM) return Ts + (Tout - Ts) * ((x - d) / FILM);
  return Tout;
}

// ---------- formatting ----------
const r1 = (x) => Play.fmt(x, 1);
const fmtR = (x) => (x < 10 ? Play.fmt(x, 1) : Play.fmt(x, 0));
function fmtT(sec) {
  const tm = Math.round(Math.max(0, sec) / 60), h = Math.floor(tm / 60), m = tm % 60;
  return h ? P.t("hm", { h, m: String(m).padStart(2, "0") }) : P.t("mOnly", { m });
}
const matName = (mi, short) => P.t("mat" + MATS[mi].id + (short ? "S" : ""));

// ---------- state ----------
let cur = 0, mat = 4, layers = 1, tMin = 0, scen = 0, coatOn = true, probeX = 0, answered = false, playing = false;
let drag = null; // {mi, x, y, over} while dragging a swatch

// ---------- svg layout ----------
const fig = $("fig");
let L = null, E = {};
const S = (t, a, p) => Play.svg(t, a, p || fig);
const txt = (p, x, y, s, a) => { const e = S("text", Object.assign({ x, y, "font-size": 14 }, a || {}), p); e.textContent = s; return e; };
function arrow(p, x1, y1, x2, y2, w, color) {
  const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l, hl = 5 + w * 1.6, hw = 3 + w * 1.4;
  const bx = x2 - ux * hl, by = y2 - uy * hl;
  S("line", { x1, y1, x2: bx, y2: by, stroke: color, "stroke-width": w, "stroke-linecap": "round" }, p);
  S("polygon", { points: `${x2},${y2} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}`, fill: color }, p);
}
function build() {
  const W = fig.getBoundingClientRect().width || 600;
  const vw = Play.clamp(Math.round(W), 300, 760), vh = cur === 2 ? 340 : 330;
  L = { vw, vh };
  fig.setAttribute("viewBox", `0 0 ${vw} ${vh}`);
  fig.style.height = Math.round((W * vh) / vw) + "px";
  fig.innerHTML = "";
  E = { g: S("g", {}) };
  draw();
}
function draw() {
  if (!L) return;
  E.g.innerHTML = "";
  if (cur < 2) drawRace(); else drawSlice();
}

// ---- steps 1–2: two ice cubes ----
function drawRace() {
  const { vw } = L, g = E.g, cy = 152, s0 = Play.clamp(vw * 0.12, 44, 72), ppm = Play.clamp(vw / 600, 0.6, 1) * 1.6;
  txt(g, 14, 24, P.t("room", { t: D.room }), { class: "strong" });
  if (cur === 1) txt(g, vw - 14, 24, fmtT(tMin * 60), { "text-anchor": "end", class: "strong" });
  const qBare = flux(D.room, 0, 1);
  const panels = [{ cx: vw * 0.27, mi: 0, n: 1 }, { cx: vw * 0.73, mi: mat, n: layers }];
  L.drop = { cx: panels[1].cx, cy, r: vw * 0.22 };
  panels.forEach((pn, k) => {
    const left = iceLeft(tMin * 60, pn.mi, pn.n), frac = left / MASS;
    const wpx = pn.mi === 0 ? 0 : pn.mi === 1 ? 3 : Math.max(5, thick(pn.mi, pn.n) * ppm);
    const outer = s0 / 2 + wpx;
    // puddle of melt water
    if (frac < 1) S("ellipse", { cx: pn.cx, cy: cy + outer + 8, rx: (s0 / 2 + 6) + (1 - frac) * 26, ry: 4 + (1 - frac) * 4, fill: "var(--c)", opacity: 0.25 }, g);
    // wrapping (fixed size; the ice shrinks inside)
    if (pn.mi > 0) {
      const m = MATS[pn.mi];
      S("rect", { x: pn.cx - outer, y: cy - outer, width: 2 * outer, height: 2 * outer, rx: 6 + wpx * 0.3, fill: m.fill, opacity: pn.mi === 3 ? 0.6 : pn.mi === 4 ? 0.55 : 0.8, stroke: "var(--fg)", "stroke-width": 1.2 }, g);
      if (pn.mi === 2) for (let y = cy - outer + 4; y < cy + outer - 2; y += 4) S("line", { x1: pn.cx - outer + 3, x2: pn.cx + outer - 3, y1: y, y2: y, stroke: "var(--muted)", "stroke-width": 0.6, opacity: 0.6 }, g);
      S("rect", { x: pn.cx - s0 / 2, y: cy - s0 / 2, width: s0, height: s0, fill: "var(--surface)", stroke: "var(--line)" }, g);
    }
    // ice
    if (frac > 0) {
      const s = s0 * Math.cbrt(frac);
      S("rect", { x: pn.cx - s / 2, y: cy + s0 / 2 - s, width: s, height: s, rx: 3, fill: "var(--c)", opacity: 0.35, stroke: "var(--c)", "stroke-width": 2 }, g);
      S("path", { d: `M${pn.cx - s / 2 + 4} ${cy + s0 / 2 - s + 6} l${s * 0.3} 0`, stroke: "var(--surface)", "stroke-width": 2, "stroke-linecap": "round" }, g);
    }
    // heat arrows (width ∝ heat flow)
    if (frac > 0) {
      const q = flux(D.room, pn.mi, pn.n), w = 1 + 6 * (q / qBare);
      [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dx, dy]) => {
        const a = outer + 30, b = outer + 6;
        arrow(g, pn.cx + dx * a, cy + dy * a, pn.cx + dx * b, cy + dy * b, w, "var(--no)");
      });
    }
    const ly = cy + 112;
    txt(g, pn.cx, ly, pn.mi ? P.t("wrapped", { mat: matName(pn.mi), n: pn.n }) : P.t("bare"), { "text-anchor": "middle", class: "strong" });
    txt(g, pn.cx, ly + 21, frac > 0 ? P.t("iceLeft", { g: r1(left) }) : P.t("melted"), { "text-anchor": "middle" });
    if (cur === 1 || answered) txt(g, pn.cx, ly + 42, P.t("meltsAt", { t: fmtT(meltSec(pn.mi, pn.n)) }), { "text-anchor": "middle", "font-size": 13 });
    if (k === 1 && drag && drag.over) S("circle", { cx: pn.cx, cy, r: L.drop.r * 0.8, fill: "none", stroke: "var(--hl)", "stroke-width": 3, "stroke-dasharray": "6 5" }, g);
  });
  if (drag && drag.inFig) {
    const m = MATS[drag.mi];
    S("rect", { x: drag.x - 18, y: drag.y - 18, width: 36, height: 36, rx: 6, fill: m.fill === "none" ? "var(--surface)" : m.fill, opacity: 0.8, stroke: "var(--fg)" }, g);
    if (drag.over) txt(g, drag.x, drag.y - 26, P.t("dropHere"), { "text-anchor": "middle", class: "strong", "font-size": 13 });
  }
}

// ---- step 3: slice through the coat ----
const SCEN = [{ Tin: 0, Tout: D.room }, { Tin: D.body, Tout: D.cold }, { Tin: null, Tout: D.room }];
function sliceGeom() {
  const d = coatOn ? Math.max(thick(mat, layers), mat === 1 ? 0.5 : 0) : 0; // foil drawn at 0.5 mm so it is visible
  const dReal = coatOn ? thick(mat, layers) : 0;
  const OBJ = 12, AIR = 12, x0 = 16, x1 = L.vw - 16;
  const span = OBJ + d + FILM + AIR;
  const X = (mm) => x0 + ((mm + OBJ) / span) * (x1 - x0);
  return { d, dReal, OBJ, AIR, span, X, x0, x1, xmin: -OBJ, xmax: d + FILM + AIR };
}
function probeTemp() { // in physical mm, mapping the drawn coat to the real one
  const G = sliceGeom(), sc = SCEN[scen], Rc = coatOn ? Rcoat(mat, layers) : 0;
  let x = probeX;
  if (x > 0 && x <= G.d) x = G.d ? (x / G.d) * G.dReal : 0;
  else if (x > G.d) x = G.dReal + (x - G.d);
  return tempAt(x, sc.Tin, sc.Tout, G.dReal, Rc);
}
function drawSlice() {
  const g = E.g, G = sliceGeom(), sc = SCEN[scen], Rc = coatOn ? Rcoat(mat, layers) : 0, X = G.X;
  const bandY = 46, bandH = 70, gy0 = 150, gy1 = L.vh - 34, T0 = -5, T1 = 40;
  const Y = (t) => gy1 - ((t - T0) / (T1 - T0)) * (gy1 - gy0);
  // band: object / coat / air
  const objFill = scen === 0 ? "var(--c)" : scen === 1 ? "var(--h)" : "var(--soft)";
  S("rect", { x: G.x0, y: bandY, width: X(0) - G.x0, height: bandH, fill: objFill, opacity: scen === 2 ? 1 : 0.35 }, g);
  S("rect", { x: X(G.d), y: bandY, width: G.x1 - X(G.d), height: bandH, fill: "var(--soft)", opacity: 0.5 }, g);
  if (G.d > 0) S("rect", { x: X(0), y: bandY, width: Math.max(2, X(G.d) - X(0)), height: bandH, fill: MATS[mat].fill, opacity: 0.7, stroke: "var(--fg)", "stroke-width": 1 }, g);
  S("rect", { x: G.x0, y: bandY, width: G.x1 - G.x0, height: bandH, fill: "none", stroke: "var(--line)" }, g);
  txt(g, (G.x0 + X(0)) / 2, bandY - 8, P.t("lgObj" + scen), { "text-anchor": "middle", class: "strong" });
  if (G.d > 0) txt(g, (X(0) + X(G.d)) / 2, bandY - 8, P.t("lgCoat"), { "text-anchor": "middle", class: "strong" });
  txt(g, (X(G.d) + G.x1) / 2 + 10, bandY - 8, P.t("lgAir") + " " + sc.Tout + " °C", { "text-anchor": "middle", class: "strong" });
  // heat flow arrow across the coat
  const q = sc.Tin === null ? 0 : flux(sc.Tout - sc.Tin, coatOn ? mat : 0, layers);
  const qMax = flux(D.body, 0, 1);
  if (Math.abs(q) > 0.01) {
    const w = 1.5 + 8 * Math.abs(q) / qMax, ya = bandY + bandH / 2, xa = X(-G.OBJ * 0.4), xb = X(G.d + FILM + G.AIR * 0.5);
    if (q > 0) arrow(g, xb, ya, xa, ya, w, "var(--no)"); else arrow(g, xa, ya, xb, ya, w, "var(--no)");
    txt(g, X(G.d + FILM + G.AIR * 0.5), ya + bandH / 2 - 6, P.t("lgHeat"), { "text-anchor": "end", "font-size": 13 });
  }
  // graph axes
  [0, 10, 20, 30, 40].forEach((t) => {
    S("line", { x1: G.x0, x2: G.x1, y1: Y(t), y2: Y(t), stroke: "var(--line)" }, g);
    txt(g, G.x0 + 2, Y(t) - 3, t + " °C", { "font-size": 13 });
  });
  [0, G.d].forEach((mm) => S("line", { x1: X(mm), x2: X(mm), y1: bandY, y2: gy1, stroke: "var(--muted)", "stroke-dasharray": "3 4", opacity: 0.6 }, g));
  // temperature curve
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const mm = G.xmin + (i / 120) * (G.xmax - G.xmin);
    const xr = mm <= 0 ? mm : mm <= G.d ? (G.d ? (mm / G.d) * G.dReal : 0) : G.dReal + (mm - G.d);
    pts.push(X(mm).toFixed(1) + "," + Y(tempAt(xr, sc.Tin, sc.Tout, G.dReal, Rc)).toFixed(1));
  }
  S("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--a)", "stroke-width": 3, "stroke-linejoin": "round" }, g);
  // probe
  probeX = Play.clamp(probeX, G.xmin, G.xmax);
  const T = probeTemp(), px = X(probeX);
  const pg = S("g", { class: "probe", tabindex: 0, role: "slider", "aria-valuemin": Math.round(G.xmin), "aria-valuemax": Math.round(G.xmax), "aria-valuenow": Math.round(probeX),
    "aria-label": P.t("probeAria", { x: P.t(zone()), t: r1(T) }) }, g);
  S("line", { x1: px, x2: px, y1: bandY - 2, y2: gy1, stroke: "var(--fg)", "stroke-width": 2 }, pg);
  S("rect", { x: px - 18, y: bandY - 2, width: 36, height: bandH + 4, fill: "transparent" }, pg);
  S("circle", { class: "ph", cx: px, cy: Y(T), r: 9, fill: "var(--surface)", stroke: "var(--fg)", "stroke-width": 2.5 }, pg);
  S("circle", { cx: px, cy: Y(T), r: 4, fill: "var(--no)" }, pg);
  const label = P.t("probe", { t: r1(T) }), bw = label.length * 8.2 + 16;
  const bx = Play.clamp(px - bw / 2, G.x0, G.x1 - bw);
  S("rect", { x: bx, y: L.vh - 27, width: bw, height: 24, rx: 5, fill: "var(--ink-panel)" }, pg);
  const tt = txt(pg, bx + bw / 2, L.vh - 10, label, { "text-anchor": "middle", class: "disp" }); tt.style.fill = "var(--on-panel)";
  pg.addEventListener("keydown", (e) => {
    const step = (G.xmax - G.xmin) / 40;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { probeX -= step; e.preventDefault(); refresh(true); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { probeX += step; e.preventDefault(); refresh(true); }
    if (e.key === "Home") { probeX = G.xmin; e.preventDefault(); refresh(true); }
    if (e.key === "End") { probeX = G.xmax; e.preventDefault(); refresh(true); }
  });
  E.probe = pg;
}
function zone() { const G = sliceGeom(); return probeX <= 0 ? "zIn" : probeX <= G.d ? "zCoat" : "zAir"; }

// ---------- pointer: probe drag (step 3) ----------
let probeDrag = false;
fig.addEventListener("pointerdown", (e) => {
  if (cur !== 2) return;
  const G = sliceGeom(), p = Play.pointer(fig, e);
  probeDrag = true;
  fig.setPointerCapture(e.pointerId);
  probeX = G.xmin + ((p.x - G.x0) / (G.x1 - G.x0)) * (G.xmax - G.xmin);
  refresh(true);
  e.preventDefault();
});
fig.addEventListener("pointermove", (e) => {
  if (!probeDrag) return;
  const G = sliceGeom(), p = Play.pointer(fig, e);
  probeX = G.xmin + ((p.x - G.x0) / (G.x1 - G.x0)) * (G.xmax - G.xmin);
  refresh(true);
});
const endProbe = () => { probeDrag = false; };
fig.addEventListener("pointerup", endProbe);
fig.addEventListener("pointercancel", endProbe);

// ---------- swatches (click, or drag onto the right-hand cube) ----------
const swBox = $("swatches");
const swBtns = MATS.map((m, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small sw";
  const ic = document.createElement("i");
  ic.style.background = m.fill === "none" ? "transparent" : m.fill;
  b.append(ic, document.createTextNode(matName(i)));
  b.addEventListener("pointerdown", (e) => {
    drag = { mi: i, x0: e.clientX, y0: e.clientY, moved: false, over: false, inFig: false, x: 0, y: 0 };
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  b.addEventListener("pointermove", (e) => {
    if (!drag || drag.mi !== i) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) drag.moved = true;
    if (!drag.moved || cur === 2) return;
    const r = fig.getBoundingClientRect(), p = Play.pointer(fig, e);
    drag.inFig = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    drag.x = p.x; drag.y = p.y;
    drag.over = drag.inFig && L.drop && Math.hypot(p.x - L.drop.cx, p.y - L.drop.cy) < L.drop.r;
    draw();
  });
  b.addEventListener("pointerup", () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved || d.over || cur === 2) setMat(i); else draw();
  });
  b.addEventListener("pointercancel", () => { drag = null; draw(); });
  b.addEventListener("click", (e) => { if (e.detail === 0) setMat(i); }); // keyboard Enter / Space
  swBox.appendChild(b);
  return b;
});
function setMat(i) { mat = i; refresh(); }

// ---------- controls ----------
$("layers").addEventListener("input", () => { layers = +$("layers").value; refresh(); });
$("time").addEventListener("input", () => { tMin = +$("time").value; setPlaying(false); refresh(true); });
document.querySelectorAll("[data-sc]").forEach((b) => b.addEventListener("click", () => { scen = +b.dataset.sc; refresh(); }));
$("coatOn").addEventListener("change", () => { coatOn = $("coatOn").checked; refresh(); });

// ---------- time animation (never autoplays) ----------
const pauseBtn = $("pause");
let raf = 0, last = 0;
function endMin() { return Math.min(D.tMax, Math.ceil(Math.max(meltSec(0, 1), meltSec(mat, layers)) / 60) + 10); }
function setPlaying(p) {
  playing = p;
  pauseBtn.textContent = P.t(p ? "pause" : "play"); pauseBtn.setAttribute("aria-pressed", p ? "true" : "false");
  if (p) { if (tMin >= endMin()) tMin = 0; last = 0; if (!raf) raf = requestAnimationFrame(tick); }
}
function tick(now) {
  raf = 0;
  if (!playing) return;
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
  tMin = Math.min(endMin(), tMin + dt * 60); // 1 hour of model time per second
  if (tMin >= endMin()) setPlaying(false);
  $("time").value = Math.round(tMin);
  refresh(true);
  if (playing) raf = requestAnimationFrame(tick);
}
pauseBtn.addEventListener("click", () => { if (cur !== 1) steps.go(1); setPlaying(!playing); });

// ---------- text ----------
const extra = $("extra"), live = $("live");
const el = (tag, t, cls) => { const e = document.createElement(tag); if (t != null) e.textContent = t; if (cls) e.className = cls; return e; };
let pendLive = 0;
function text(quiet) {
  const V = { m: r1(MASS), room: D.room };
  $("kicker").textContent = P.t("k" + (cur + 1));
  $("stepTitle").textContent = P.t("t" + (cur + 1));
  $("matLbl").textContent = P.t(cur === 2 ? "matLbl3" : "matLbl");
  const SV = { room: D.room, body: D.body, cold: D.cold };
  document.querySelectorAll("[data-sc]").forEach((b) => (b.textContent = P.t("sc" + b.dataset.sc, SV)));
  $("layersVal").textContent = mat ? P.t("layersVal", { n: layers, d: Play.fmt(MATS[mat].d, MATS[mat].d < 1 ? 2 : 0) }) : "—";
  $("layers").disabled = mat === 0;
  $("timeVal").textContent = fmtT(tMin * 60);
  swBtns.forEach((b, i) => { b.setAttribute("aria-pressed", i === mat ? "true" : "false"); b.hidden = cur === 2 && i === 0; });
  document.querySelectorAll("[data-sc]").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.sc === scen ? "true" : "false"));
  const r = slow(mat, layers);
  $("resultMain").textContent = cur === 0 && !answered ? P.t("resultWait") : mat ? P.t("resultMain", { mat: matName(mat), n: layers, r: fmtR(r) }) : P.t("b2same");
  if (quiet && cur !== 2) { setLive(); return; }
  extra.innerHTML = "";
  if (cur === 0) {
    $("stepBody").textContent = P.t("b1", V) + (answered ? " " + P.t("b1done") : "");
  } else if (cur === 1) {
    $("stepBody").textContent = P.t("b2");
    extra.append(el("p", mat === 0 ? P.t("b2same") : mat === 1 ? P.t("b2foil") : P.t("b2slow", { mat: matName(mat, true), r: fmtR(r) }), "rule"));
  } else {
    const sc = SCEN[scen], Rc = coatOn ? Rcoat(mat, layers) : 0;
    const Ts = sc.Tin === null ? sc.Tout : sc.Tin + (sc.Tout - sc.Tin) * (Rc / (Rc + Rair));
    if (!quiet) {
      $("stepBody").textContent = P.t("b3");
      const msg = scen === 0 ? P.t("b3ice", { ts: r1(Ts) }) : scen === 1 ? P.t("b3body") : P.t("b3empty", { t: sc.Tout });
      extra.append(el("p", msg, "rule"));
      if (!coatOn && scen !== 2) extra.append(el("p", P.t("b3off")));
      if (sc.Tin !== null) {
        const tb = el("table", null, "tbl"), tr = (a, b, head) => { const row = el("tr"); row.append(el(head ? "th" : "td", a), el(head ? "th" : "td", b, head ? "" : "n")); tb.append(row); };
        tr(P.t("thWhat"), P.t("thFlow"), true);
        tr(P.t("rowBare"), P.t("wm2", { q: Play.fmt(Math.abs(flux(sc.Tout - sc.Tin, 0, 1)), 0) }));
        tr(P.t("rowCoat", { mat: matName(mat), n: layers }), P.t("wm2", { q: Play.fmt(Math.abs(flux(sc.Tout - sc.Tin, mat, layers)), 0) }));
        extra.append(tb, el("p", P.t("ratio", { r: fmtR(r) })));
      } else extra.append(el("p", P.t("noFlow")));
      extra.append(el("p", P.t("rule3"), "rule"));
    }
  }
  setLive();
}
function setLive() { // throttle the aria-live text while dragging / playing
  clearTimeout(pendLive);
  pendLive = setTimeout(() => {
    if (cur === 0 && !answered) { Play.live(live, ""); return; }
    if (cur < 2) {
      const ts = tMin * 60;
      Play.live(live, P.t("live2", { t: fmtT(ts), a: r1(iceLeft(ts, 0, 1)), b: r1(iceLeft(ts, mat, layers)),
        qa: Play.fmt(iceLeft(ts, 0, 1) > 0 ? flux(D.room, 0, 1) * AREA : 0, 2), qb: Play.fmt(iceLeft(ts, mat, layers) > 0 ? flux(D.room, mat, layers) * AREA : 0, 2) }));
    } else {
      const sc = SCEN[scen], q = sc.Tin === null ? 0 : flux(sc.Tout - sc.Tin, coatOn ? mat : 0, layers);
      Play.live(live, P.t("live3", { sc: P.t("sc" + scen, { room: D.room, body: D.body, cold: D.cold }), z: P.t(zone()), t: r1(probeTemp()), q: Play.fmt(Math.abs(q), 0), dir: P.t(q > 0.01 ? "dirIn" : q < -0.01 ? "dirOut" : "dirNone") }));
    }
  }, cur === 1 && playing ? 400 : 120);
}
function refresh(quiet) {
  const hadFocus = cur === 2 && document.activeElement === E.probe;
  draw();
  if (hadFocus && E.probe) E.probe.focus();
  text(quiet);
}

// ---------- steps, reset ----------
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { answered = true; draw(); text(); });

const steps = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const was = cur;
  cur = i;
  if (i !== 1) setPlaying(false);
  if (i === 0) { mat = 4; layers = 1; $("layers").value = 1; tMin = 0; $("time").value = 0; }
  if (i === 2 && mat === 0) mat = 4;
  $("predict").hidden = i !== 0;
  $("cMat").hidden = i === 0; $("c2").hidden = i !== 1; $("c3").hidden = i !== 2; pauseBtn.hidden = i === 2;
  if (L && (was === 2) !== (i === 2)) build(); else if (L) draw();
  text();
});
function start() {
  mat = 4; layers = 1; tMin = 0; scen = 0; coatOn = true; probeX = 0; answered = false; drag = null;
  $("layers").value = 1; $("time").value = 0; $("coatOn").checked = true;
}
$("reset").addEventListener("click", () => { pr.reset(); setPlaying(false); start(); steps.go(0); build(); text(); });
let lastW = 0;
window.addEventListener("resize", () => {
  const w = Math.round(fig.getBoundingClientRect().width);
  if (w && w !== lastW) { lastW = w; build(); }
});

$("time").max = D.tMax;
$("resultNote").textContent = P.t("resultNote");
$("data").textContent = P.t("dataNote", { s: D.side, rho: D.rho, m: r1(MASS), Lf: D.Lf, room: D.room, A: Play.fmt(AREA * 1e4, 0), h: D.h,
  kF: MATS[1].k, dF: MATS[1].d, kP: MATS[2].k, dP: MATS[2].d, kC: MATS[3].k, dC: MATS[3].d, kW: MATS[4].k, dW: MATS[4].d });
start(); setPlaying(false); build(); lastW = Math.round(fig.getBoundingClientRect().width); text();
</script>
</body>

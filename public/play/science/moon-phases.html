/* ---------- model (pure, angles in degrees, θ = Sun–Earth–Moon angle, 0 = new moon) ---------- */
const SYN = 29.530589, SID = 27.321662, INC = 5.145;
const D_M = 384400, R_E = 6371, R_M = 1737.4, R_S = 696000, D_S = 149.6e6;
const RAD = Math.PI / 180;
const wrap360 = (a) => ((a % 360) + 360) % 360;
const litFrac = (th) => (1 - Math.cos(th * RAD)) / 2;
const ageOf = (th) => wrap360(th) / 360 * SYN;
const umbraR = (x) => R_E - x * (R_S - R_E) / D_S;            // km, x = distance behind Earth
const MAX_OFF = D_M * Math.sin(INC * RAD);                     // highest the Moon gets above Earth's orbit plane
const NEED = umbraR(D_M) + R_M;                                // centre distance to touch the umbra
function phaseIndex(th) {
  const a = wrap360(th), TOL = 6;                              // principal phases: within ±6° (≈ ½ day)
  for (let k = 0; k < 4; k++) { const c = 90 * k; const d = Math.min(Math.abs(a - c), 360 - Math.abs(a - c)); if (d <= TOL) return 2 * k; }
  return a < 90 ? 1 : a < 180 ? 3 : a < 270 ? 5 : 7;
}
// Moon position (km) in a frame with x pointing away from the Sun, y in Earth's orbit plane, z up.
function moonPos(th, node) {
  return { x: -D_M * Math.cos(th * RAD), y: D_M * Math.sin(th * RAD), z: MAX_OFF * Math.sin((th - node) * RAD) };
}
function eclipse(th, node) { // 0 none, 1 partial, 2 total (umbral)
  const m = moonPos(th, node);
  if (m.x <= 0) return 0;
  const rho = Math.hypot(m.y, m.z), u = umbraR(m.x);
  return rho < u - R_M ? 2 : rho < u + R_M ? 1 : 0;
}
// Path of the lit part of a disc as seen from Earth. mirror = Southern Hemisphere.
function phasePath(cx, cy, R, th, mirror) {
  const a = wrap360(th), c = Math.cos(a * RAD);
  let s = a < 180 ? 1 : -1;                                    // lit limb: right while waxing (north)
  if (mirror) s = -s;
  const rx = Math.abs(R * c), bulge = s * c;                   // terminator half-width and side
  const limbSweep = s > 0 ? 1 : 0, termSweep = bulge > 0 ? 0 : 1;
  const top = `${cx} ${(cy - R).toFixed(2)}`, bot = `${cx} ${(cy + R).toFixed(2)}`;
  const term = rx < 0.05 ? `L${top}` : `A${rx.toFixed(2)} ${R} 0 0 ${termSweep} ${top}`;
  return `M${top} A${R} ${R} 0 0 ${limbSweep} ${bot} ${term} Z`;
}
if (typeof module !== "undefined") module.exports = { litFrac, ageOf, phaseIndex, eclipse, phasePath, umbraR, MAX_OFF, NEED };

/* ---------- state ---------- */
const $ = (id) => document.getElementById(id);
const START = { th: 90, south: false, shadow: false, node: 60 };
const S = Object.assign({}, START);
const nf = (x, d = 0) => Number(Play.fmt(x, d)).toLocaleString(P.lang === "zh" ? "zh-CN" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const nums = () => ({ month: Play.fmt(SYN, 1), sid: Play.fmt(SID, 1), inc: Play.fmt(INC, 1), off: nf(Math.round(MAX_OFF / 100) * 100), need: nf(Math.round(NEED / 100) * 100) });
$("foot").textContent = P.t("foot", Object.assign(nums(), {
  dm: nf(D_M), re: nf(R_E), rm: nf(R_M, 1), rs: nf(R_S), ds: Play.fmt(D_S / 1e6, 1), umb: nf(umbraR(D_M)),
}));
function txt(parent, x, y, s, cls, anchor) {
  const t = Play.svg("text", { x, y, class: cls || "lb", "text-anchor": anchor || "start" }, parent);
  t.textContent = s;
  return t;
}

/* ---------- top view ---------- */
const topv = $("top"), sky = $("sky"), side = $("side");
const E = { x: 170, y: 150, r: 18, orb: 98, mr: 16 };
const moonXY = (th) => [E.x - E.orb * Math.cos(th * RAD), E.y + E.orb * Math.sin(th * RAD)]; // counter-clockwise seen from north
function drawTop() {
  topv.innerHTML = "";
  // parallel sunlight from the far left
  for (let y = 42; y <= 262; y += 22) Play.svg("line", { x1: 4, y1: y, x2: 40, y2: y, stroke: "var(--hl)", "stroke-width": 1.6 }, topv);
  for (let y = 42; y <= 262; y += 22) Play.svg("path", { d: `M40 ${y - 4} L48 ${y} L40 ${y + 4} Z`, fill: "var(--hl)" }, topv);
  txt(topv, 8, 18, P.t("topTitle"), "lbf");
  txt(topv, 6, 34, P.t("sunlight") + " · " + P.t("sunFar"), "lb");
  if (S.shadow) {
    Play.svg("path", { d: `M${E.x} ${E.y - E.r} L300 ${E.y - E.r + 3} L300 ${E.y + E.r - 3} L${E.x} ${E.y + E.r} Z`, fill: "var(--ink-panel)", opacity: 0.3 }, topv);
    txt(topv, E.x + E.r + 6, E.y - E.r - 6, P.t("shadowTxt"), "lb halo", "start");
  }
  Play.svg("circle", { cx: E.x, cy: E.y, r: E.orb, fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-dasharray": "5 5" }, topv);
  // Earth: day side faces the Sun (left)
  Play.svg("circle", { cx: E.x, cy: E.y, r: E.r, fill: "var(--c)" }, topv);
  Play.svg("path", { d: `M${E.x} ${E.y - E.r} A${E.r} ${E.r} 0 0 1 ${E.x} ${E.y + E.r} Z`, fill: "var(--ink-panel)", opacity: 0.55 }, topv);
  txt(topv, E.x, E.y + E.r + 15, P.t("earth"), "lb halo", "middle");
  // Moon: left half lit (faces the Sun), Earth-facing half outlined
  const [mx, my] = moonXY(S.th), R = E.mr;
  const g = Play.svg("g", {}, topv);
  Play.svg("circle", { cx: mx, cy: my, r: R, fill: "var(--ink-panel)", opacity: 0.75 }, g);
  Play.svg("path", { d: `M${mx} ${my - R} A${R} ${R} 0 0 0 ${mx} ${my + R} Z`, fill: "var(--hl)" }, g);
  const ux = (E.x - mx) / E.orb, uy = (E.y - my) / E.orb;     // unit vector Moon → Earth
  const px = -uy * (R + 2), py = ux * (R + 2);
  const ax = mx + px, ay = my + py, bx = mx - px, by = my - py;
  // arc through the point facing Earth (mx + u·R)
  // a = m + R·perp(u); turning back by 90° (sweep 0 in screen coordinates) passes through m + R·u
  Play.svg("path", { d: `M${ax} ${ay} A${R + 2} ${R + 2} 0 0 0 ${bx} ${by}`, fill: "none", stroke: "var(--a)", "stroke-width": 3.5, "stroke-linecap": "round" }, g);
  Play.svg("line", { x1: ax, y1: ay, x2: bx, y2: by, stroke: "var(--a)", "stroke-width": 1.2, "stroke-dasharray": "3 2" }, g);
  Play.svg("circle", { cx: mx, cy: my, r: 24, fill: "transparent" }, g);   // touch target
  // legend: green arc = the half facing Earth
  const lg = txt(topv, 296, 34, P.t("weSee"), "lb", "end");
  let lw = 70; try { lw = lg.getComputedTextLength() || lw; } catch (e) { /* not rendered yet */ }
  Play.svg("path", { d: `M${292 - lw - 4} 21 A8 8 0 0 0 ${292 - lw - 4} 37`, fill: "none", stroke: "var(--a)", "stroke-width": 3.5, "stroke-linecap": "round" }, topv);
  topv.setAttribute("aria-valuemin", 0); topv.setAttribute("aria-valuemax", 29.5);
  topv.setAttribute("aria-valuenow", Play.fmt(ageOf(S.th), 1));
  topv.setAttribute("aria-valuetext", P.t("p" + phaseIndex(S.th)) + ", " + P.t("vAge", { d: Play.fmt(ageOf(S.th), 1) }));
}

/* ---------- view from Earth ---------- */
function drawSky(i) {
  sky.innerHTML = "";
  Play.svg("rect", { x: 0, y: 0, width: 300, height: 280, fill: "var(--ink-panel)" }, sky);
  txt(sky, 10, 20, P.t(S.south ? "skyTitleS" : "skyTitleN"), "lbp");
  const cx = 150, cy = 138, R = 78;
  Play.svg("circle", { cx, cy, r: R, fill: "var(--on-panel)", opacity: 0.1, stroke: "var(--on-panel-muted)", "stroke-width": 1, "stroke-dasharray": litFrac(S.th) < 0.01 ? "4 4" : "none" }, sky);
  Play.svg("path", { d: phasePath(cx, cy, R, S.th, S.south), fill: "var(--on-panel)" }, sky);
  const ec = S.shadow ? eclipse(S.th, S.node) : 0;              // in an eclipse the Moon turns a dull red
  if (ec) { // draw Earth's umbra to scale on the Moon's face, clipped to the disc
    const m = moonPos(S.th, S.node), k = R / R_M, dir = S.south ? 1 : -1;  // north view: east (where the shadow sits before full) is left
    const cp = Play.svg("clipPath", { id: "disc" }, Play.svg("defs", {}, sky));
    Play.svg("circle", { cx, cy, r: R }, cp);
    Play.svg("circle", { cx: cx + dir * m.y * k, cy: cy - dir * m.z * k, r: umbraR(m.x) * k, fill: "var(--no)", opacity: 0.8, "clip-path": "url(#disc)" }, sky);
  }
  txt(sky, cx, 246, P.t("p" + i), "lbpf", "middle");
  const sub = i === 0 ? P.t("newNote") : S.south ? P.t("mirrorNote") : P.t("vLit", { p: Play.fmt(100 * litFrac(S.th), 0) });
  txt(sky, cx, 266, sub, "lbp", "middle");
}

/* ---------- side view: tilted orbit vs Earth's shadow ---------- */
const SV = { x: 150, y: 92, kx: 118 / D_M, k: 5, r: 296 };
function drawSide() {
  side.innerHTML = "";
  const kz = SV.kx * SV.k, X = (x) => SV.x + x * SV.kx, Y = (z) => SV.y - z * kz;
  txt(side, 6, 16, P.t("sideTitle", { k: SV.k }), "lbf");
  for (let y = SV.y - 30; y <= SV.y + 30; y += 15) Play.svg("line", { x1: 2, y1: y, x2: 20, y2: y, stroke: "var(--hl)", "stroke-width": 1.4 }, side);
  txt(side, 4, SV.y - 38, P.t("sunL"), "lb");
  Play.svg("line", { x1: 24, x2: SV.r, y1: SV.y, y2: SV.y, stroke: "var(--line)", "stroke-width": 1.5, "stroke-dasharray": "2 4" }, side);
  // umbra cone from Earth to the right edge
  const xEnd = (SV.r - SV.x) / SV.kx, uEnd = umbraR(xEnd);
  Play.svg("path", { d: `M${SV.x} ${Y(R_E)} L${SV.r} ${Y(uEnd)} L${SV.r} ${Y(-uEnd)} L${SV.x} ${Y(-R_E)} Z`, fill: "var(--ink-panel)", opacity: 0.3 }, side);
  // the Moon's orbit seen edge-on
  let d = "";
  for (let a = 0; a <= 360; a += 5) { const m = moonPos(a, S.node); d += (a ? "L" : "M") + X(m.x).toFixed(1) + " " + Y(m.z).toFixed(1); }
  Play.svg("path", { d, fill: "none", stroke: "var(--muted)", "stroke-width": 1.2, "stroke-dasharray": "4 4" }, side);
  Play.svg("circle", { cx: SV.x, cy: SV.y, r: R_E * kz, fill: "var(--c)" }, side);
  const m = moonPos(S.th, S.node), e = eclipse(S.th, S.node);
  Play.svg("circle", { cx: X(m.x), cy: Y(m.z), r: Math.max(3.5, R_M * kz), fill: e ? "var(--no)" : "var(--hl)", stroke: "var(--fg)", "stroke-width": 1 }, side);
  if (e) txt(side, Play.clamp(X(m.x), 60, SV.r), Y(m.z) - 10, P.t(e === 2 ? "eclTot" : "eclPart"), "lbf halo", X(m.x) > 220 ? "end" : "middle");
  // legend row
  Play.svg("line", { x1: 6, x2: 26, y1: 172, y2: 172, stroke: "var(--line)", "stroke-width": 1.5, "stroke-dasharray": "2 4" }, side);
  txt(side, 30, 176, P.t("orbitPlane"), "lb");
  Play.svg("rect", { x: 6, y: 184, width: 20, height: 8, fill: "var(--ink-panel)", opacity: 0.3 }, side);
  txt(side, 30, 193, P.t("shadowTxt"), "lb");
}
function shadowText() {
  const m = moonPos(S.th, S.node), e = eclipse(S.th, S.node);
  if (e) return P.t(e === 2 ? "eclTot" : "eclPart");
  if (m.x <= 0) return P.t("vFront");
  const off = Math.hypot(m.y, m.z), h = nf(Math.round(off / 100) * 100);
  return P.t("vMiss", { h });
}

/* ---------- phase buttons (rendered with the same geometry) ---------- */
const phaseBox = $("phases"), phaseBtns = [];
for (let k = 0; k < 8; k++) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small";
  b.setAttribute("aria-label", P.t("p" + k)); b.title = P.t("p" + k);
  b.appendChild(Play.svg("svg", { viewBox: "0 0 30 30", "aria-hidden": "true" }));
  b.addEventListener("click", () => { stop(); S.th = 45 * k; render(); });
  phaseBox.appendChild(b); phaseBtns.push(b);
}
function drawPhaseBtns(i) {
  phaseBtns.forEach((b, k) => {
    const s = b.firstChild; s.innerHTML = "";
    Play.svg("circle", { cx: 15, cy: 15, r: 12, fill: "var(--ink-panel)" }, s);
    Play.svg("path", { d: phasePath(15, 15, 12, 45 * k, S.south), fill: "var(--on-panel)" }, s);
    b.classList.toggle("on", k === i && Math.abs(wrap360(S.th) - 45 * k) < 6.5);
  });
}

/* ---------- render ---------- */
function render() {
  S.th = wrap360(S.th);
  const i = phaseIndex(S.th), f = litFrac(S.th), age = ageOf(S.th);
  $("age").value = Play.fmt(age, 1);
  $("ageVal").textContent = P.t("vAge", { d: Play.fmt(age, 1) });
  $("hN").classList.toggle("on", !S.south); $("hS").classList.toggle("on", S.south);
  $("hN").setAttribute("aria-pressed", String(!S.south)); $("hS").setAttribute("aria-pressed", String(S.south));
  $("shadow").checked = S.shadow;
  $("sidebox").hidden = !S.shadow;
  $("nTyp").classList.toggle("on", S.node !== 0); $("nEcl").classList.toggle("on", S.node === 0);
  drawTop(); drawSky(i); drawPhaseBtns(i);
  if (S.shadow) drawSide();
  document.querySelectorAll(".shrow").forEach((el) => (el.hidden = !S.shadow));
  $("oShadow").textContent = S.shadow ? shadowText() : "";
  $("oPhase").textContent = P.t("p" + i);
  $("oAge").textContent = P.t("vAge", { d: Play.fmt(age, 1) });
  $("oAngle").textContent = P.t("vAngle", { a: Play.fmt(S.th, 0) });
  $("oLit").textContent = P.t("vLit", { p: Play.fmt(100 * f, 0) });
  const a = Math.round(S.th);
  $("resultMain").textContent = P.t("resultMain", { a, p: Play.fmt(100 * litFrac(a), 0) });
  let note = P.t("liveSum", { d: Play.fmt(age, 1), name: P.t("p" + i), p: Play.fmt(100 * f, 0) });
  if (i === 0) note += " " + P.t("noteNew");
  else if (i === 4) { const ec = S.shadow ? eclipse(S.th, S.node) : 0; note += " " + P.t(ec === 2 ? "noteEcl" : ec ? "noteEclP" : "noteFull"); }
  else if (S.shadow && Math.abs(S.th - 180) > 60) note += " " + P.t("noteShadow");
  Play.live($("live"), note);
}

/* ---------- interaction ---------- */
let anim = 0, last = 0;
const playBtn = $("playBtn");
function stop() { if (anim) cancelAnimationFrame(anim); anim = 0; playBtn.textContent = P.t("play"); }
function tick(ts) {
  if (last) S.th += Math.min(100, ts - last) * 0.045;          // about 8 s per month
  last = ts; render(); anim = requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => { if (anim) stop(); else { last = 0; playBtn.textContent = P.t("pause"); anim = requestAnimationFrame(tick); } });

function fromPointer(e) {
  const p = Play.pointer(topv, e);
  if (Math.hypot(p.x - E.x, p.y - E.y) < 4) return;
  const t = wrap360(Math.atan2(p.y - E.y, E.x - p.x) / RAD), q = Math.round(t / 90) * 90;
  S.th = Math.abs(t - q) < 2 ? q : t;                          // gentle snap to the four main phases
  render();
}
let dragging = false;
topv.addEventListener("pointerdown", (e) => { stop(); dragging = true; topv.setPointerCapture(e.pointerId); fromPointer(e); });
topv.addEventListener("pointermove", (e) => { if (dragging) fromPointer(e); });
topv.addEventListener("pointerup", () => (dragging = false));
topv.addEventListener("pointercancel", () => (dragging = false));
topv.addEventListener("keydown", (e) => {
  const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 7, PageDown: -7 }[e.key];
  if (step) { stop(); S.th += step * 360 / SYN; render(); e.preventDefault(); }
  if (e.key === "Home") { stop(); S.th = 0; render(); e.preventDefault(); }
});
$("age").addEventListener("input", () => { stop(); S.th = Play.clamp(+$("age").value, 0, SYN) / SYN * 360; render(); });
$("hN").addEventListener("click", () => { S.south = false; render(); });
$("hS").addEventListener("click", () => { S.south = true; render(); });
$("shadow").addEventListener("change", () => { S.shadow = $("shadow").checked; render(); });
$("nTyp").addEventListener("click", () => { S.node = START.node; render(); });
$("nEcl").addEventListener("click", () => { S.node = 0; render(); });

const pr = Play.predict($("predict"), {
  q: P.t("q"), options: [{ label: P.t("o1") }, { label: P.t("o2") }, { label: P.t("o3"), right: true }], right: P.t("right"), wrong: P.t("wrong"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  const k = i + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("stepBody").textContent = P.t("b" + k, nums());
  $("predict").hidden = i !== 0;
  if (i === 2 && !S.shadow) { S.shadow = true; render(); }
});
$("reset").addEventListener("click", () => { stop(); Object.assign(S, START); pr.reset(); st.go(0); render(); });
stop();
render();
</script>
</body>
</html>

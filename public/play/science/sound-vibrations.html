<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What makes a sound?</title>
<link rel="stylesheet" href="../play.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>
  #fig { height: auto; aspect-ratio: 600 / 380; max-height: 420px; touch-action: none; }
  #fig text { fill: var(--fg); }
  #fig text.mut { fill: var(--muted); }
  #fig .hot { cursor: pointer; }
  #fig .hot:focus { outline: none; }
  #fig .hot:focus-visible .ring { stroke: var(--hl); stroke-width: 3; }
  .controls output { font-family: var(--math); color: var(--fg); font-size: 15px; min-width: 3.6em; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .btnrow button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .foot.data { text-align: left; max-width: 900px; margin: 14px auto 0; line-height: 1.6; }
  .live2 { margin: 0 0 6px; }
  .result .math { white-space: normal; }
  #snd[aria-pressed=true] { border-color: var(--a); color: var(--a); font-weight: 650; }
</style>
</head>
<body data-subject="science">
<div class="play">
  <div class="topline"><span class="eyebrow" data-t="eyebrow"></span><span class="langs"></span></div>
  <h1 data-t="h1"></h1>
  <p class="intro" data-t="intro"></p>

  <div class="navrow">
    <div class="steps" id="steps"></div>
    <div class="tools">
      <button type="button" class="small" id="snd" aria-pressed="false"></button>
      <button type="button" class="small" id="pause" aria-pressed="false"></button>
      <button type="button" class="small" id="reset" data-t="reset"></button>
    </div>
  </div>

  <section class="stage">
    <div class="visual">
      <svg class="main" id="fig" viewBox="0 0 600 380" role="group" data-t-aria="figAria"></svg>
      <div id="c1" class="controls">
        <div class="btnrow">
          <button type="button" id="soft" data-t="softBtn"></button>
          <button type="button" id="hard" data-t="hardBtn"></button>
        </div>
      </div>
      <div id="c2" hidden>
        <div class="controls">
          <label for="len" data-t="lenLabel"></label>
          <input type="range" id="len" min="8" max="24" step="1" value="20">
          <output id="lenVal" for="len"></output>
        </div>
        <div class="controls">
          <label for="str" data-t="strLabel"></label>
          <input type="range" id="str" min="1" max="5" step="1" value="2">
          <output id="strVal" for="str"></output>
          <button type="button" id="pluck" data-t="pluckBtn"></button>
        </div>
      </div>
      <div id="c3" hidden>
        <div class="controls">
          <label for="air" data-t="airLabel"></label>
          <input type="range" id="air" min="0" max="100" step="1" value="100">
          <output id="airVal" for="air"></output>
        </div>
        <div class="controls">
          <div class="btnrow">
            <button type="button" id="ring" aria-pressed="false"></button>
            <button type="button" id="pumpBtn" data-t="pumpBtn"></button>
            <button type="button" id="airIn" data-t="airIn"></button>
          </div>
        </div>
      </div>
      <div id="c4" class="controls" hidden>
        <div class="btnrow" id="chips" role="group" data-t-aria="chipsAria"></div>
        <button type="button" id="hit" data-t="hitBtn"></button>
      </div>
    </div>
    <div class="explain">
      <div class="kicker" id="kicker"></div>
      <h2 id="stepTitle"></h2>
      <div id="predict"></div>
      <div id="predict2"></div>
      <p id="stepBody"></p>
      <p class="note live2" id="live"></p>
    </div>
  </section>

  <div class="result">
    <div><div class="rt" data-t="resultTitle"></div><div class="math" data-t="resultMain"></div></div>
    <div class="rn" data-t="resultNote"></div>
  </div>
  <div class="explainit">
    <div><div class="kicker" data-t="explainK"></div><span data-t="explainQ"></span></div>
    <div><div class="kicker" data-t="homeK"></div><span data-t="homeQ"></span></div>
  </div>
  <p class="foot data" id="data"></p>
  <p class="foot" data-t="foot"></p>
</div>

// ---------- pure model ----------
const V_AIR = 343, V = { air: 343, water: 1480, wood: 3500 }; // m/s; wood: mid of 3000–4000 along the grain
const LMIN = 8, LMAX = 24, SMAX = 5;
const rateRatio = (L) => (LMAX / Play.clamp(L, LMIN, LMAX)) ** 2;         // vibration rate vs. 24 cm, ∝ 1/L²
const pitchWord = (r) => (r < 2 ? "low" : r < 4.5 ? "mid" : "high");
const loudWord = (s) => (s <= 2 ? "soft_" : s === 3 ? "medium" : "loud");
const heardWord = (p) => (p >= 70 ? "heardLoud" : p >= 25 ? "heardLess" : p > 0 ? "heardFaint" : "heardNone");
const kmTime = (v) => 1000 / v;
const pumpOnce = (a) => { const n = Math.round(a * 0.6); return n < 4 ? 0 : n; };
const crossTime = (m) => (m === "vac" ? Infinity : (3 * V_AIR) / V[m]); // seconds on screen to cross the box

// ---------- state ----------
const $ = (id) => document.getElementById(id);
const fig = $("fig");
const mv = Play.reduced ? 0 : 1;
let cur = 0, paused = false, raf = 0, last = 0, clock = 0;
const DR = { soft: { age: Infinity, A: 14 }, hard: { age: Infinity, A: 42 } }; let queue = null, s1done = false;
let L = 20, S = 2, rul = { age: Infinity, D0: 0 }, drag = null, tipD = 0;
let air = 100, ringing = false, pumpAnim = null, handle = 0, strikeT = 0, s3done = false;
let med = "air", pulses = [], flash = 0;

// ---------- drawing helpers ----------
const W = 600, H = 380;
const bg = Play.svg("g", {}, fig), dyn = Play.svg("g", { "pointer-events": "none" }, fig), hot = Play.svg("g", {}, fig), labs = Play.svg("g", { "pointer-events": "none" }, fig);
// persistent hit areas / focus targets (not redrawn, so focus survives animation)
function hotArea(tag, attrs, focus) {
  const g = Play.svg("g", { class: "hot" }, hot);
  if (focus) { g.setAttribute("tabindex", "0"); g.setAttribute("role", focus); }
  const el = Play.svg(tag, Object.assign({ class: "ring", fill: "transparent", stroke: "transparent" }, attrs), g);
  return { g, el, show(on) { g.style.display = on ? "" : "none"; } };
}
Play.svg("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, bg);
let fs = 14;
function updateFs() {
  const r = fig.getBoundingClientRect(), sc = Math.min(r.width / W, r.height / H);
  fs = sc > 0 ? Math.max(14, 13.5 / sc) : 14;
}
function txt(x, y, s, attrs, parent) {
  const t = Play.svg("text", Object.assign({ x, y, "font-size": fs.toFixed(1), "text-anchor": "middle" }, attrs || {}), parent || labs);
  t.textContent = s;
  return t;
}
function wavePath(x0, x1, yc, A, cycles, phase) {
  let d = "";
  for (let i = 0; i <= 160; i++) {
    const u = i / 160, x = x0 + (x1 - x0) * u, y = yc - A * Math.sin(2 * Math.PI * cycles * u - phase);
    d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d;
}
function wave(x0, x1, yc, A, cycles, phase, attrs) {
  return Play.svg("path", Object.assign({ d: wavePath(x0, x1, yc, A, cycles, phase), fill: "none", stroke: "var(--a)", "stroke-width": 2.5, "stroke-linejoin": "round" }, attrs || {}), dyn);
}
function box(x, y, w, h) { Play.svg("rect", { x, y, width: w, height: h, rx: 10, fill: "var(--soft)", stroke: "var(--line)" }, dyn); }
function meter(x, y, w, frac, label) {
  txt(x - 8, y + fs * 0.35, label, { "text-anchor": "end", class: "mut" });
  Play.svg("rect", { x, y: y - 7, width: w, height: 14, rx: 7, fill: "var(--soft)", stroke: "var(--line)" }, dyn);
  const f = Play.clamp(frac, 0, 1);
  if (f > 0) Play.svg("rect", { x, y: y - 7, width: Math.max(14, w * f), height: 14, rx: 7, fill: "var(--a)" }, dyn);
}
function clear() { while (dyn.firstChild) dyn.removeChild(dyn.firstChild); while (labs.firstChild) labs.removeChild(labs.firstChild); }
const shape = (s) => (s * s * (3 - s)) / 2; // bent strip held at one end

// ---------- sound (Web Audio, only after a click, quiet, optional) ----------
const AC = window.AudioContext || window.webkitAudioContext;
const Snd = { ctx: null, out: null, on: false };
const sndBtn = $("snd");
function setSound(on) {
  if (on && !Snd.ctx && AC) {
    try { Snd.ctx = new AC(); Snd.out = Snd.ctx.createGain(); Snd.out.gain.value = 0.5; Snd.out.connect(Snd.ctx.destination); }
    catch (e) { Snd.ctx = null; }
  }
  Snd.on = !!(on && Snd.ctx);
  try { if (Snd.ctx) { if (Snd.on) Snd.ctx.resume(); else Snd.ctx.suspend(); } } catch (e) { /* ignore */ }
  sndBtn.textContent = P.t(!AC ? "sndNone" : Snd.on ? "sndOn" : "sndOff");
  sndBtn.disabled = !AC;
  sndBtn.setAttribute("aria-pressed", Snd.on ? "true" : "false");
}
function tone(freq, amp, dur, type) {
  if (!Snd.on || !Snd.ctx || !(amp > 0.001) || !Number.isFinite(freq)) return;
  try {
    const c = Snd.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.12 * Math.min(1, amp)), t + 0.012); // × 0.5 master → ≤ 0.06
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Snd.out); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) { /* page works without sound */ }
}
sndBtn.addEventListener("click", () => setSound(!Snd.on));

// ---------- step 1: drum ----------
const DRUM_F = 1.5, LANE_N = 5;
function hitDrum(kind) {
  DR[kind].age = 0;
  tone(150, kind === "hard" ? 1 : 0.33, 0.9);
  if (DR.soft.age < Infinity && DR.hard.age < Infinity && !s1done) { s1done = true; text(); }
  wake(); draw();
}
function drawDrum() {
  const cx = 120, top = 215, rx = 88, ry = 22;
  let dz = 0, stickDown = false;

  raf = 0;
  if (paused) return;
  const dt = last ? Math.min((ts - last) / 1000, 0.05) : 1 / 60;
  last = ts; clock += dt;
  if (cur === 0) {
    DR.soft.age += dt; DR.hard.age += dt;
    if (queue && (queue.t -= dt) <= 0) { const k = queue.kind; queue = null; hitDrum(k); }
  } else if (cur === 1) rul.age += dt;
  else if (cur === 2) {
    if (pumpAnim) { pumpAnim.t += dt; setAir(100 * (1 - Math.min(1, pumpAnim.t / 5))); if (pumpAnim.t >= 5) pumpAnim = null; }
    handle = Math.max(0, handle - dt * 3);
    if (ringing && (strikeT -= dt) <= 0) { strikeT = 0.2; tone(1100, 0.55 * air / 100, 0.18, "triangle"); }
  } else {
    pulses.forEach((p) => {
      p.age += dt;
      if (!p.dead && !p.heard && p.age >= crossTime(med)) { p.heard = true; flash = 1.2; tone(150, 0.8, 0.7); }
    });
    pulses = pulses.filter((p) => p.age < (p.dead ? 0.6 : crossTime(med) + 0.4));
    flash = Math.max(0, flash - dt);
  }
  draw();
  if (anyAnim()) raf = requestAnimationFrame(tick);
}
const pauseBtn = $("pause");
function setPause(p) {
  paused = p; pauseBtn.textContent = P.t(p ? "play" : "pause"); pauseBtn.setAttribute("aria-pressed", p ? "true" : "false");
  if (!p) wake();
}
pauseBtn.addEventListener("click", () => setPause(!paused));

// ---------- text & steps ----------
function text() {
  const k = cur + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  let b = P.t("b" + k);
  if (cur === 0 && s1done) b = P.t("b1done");
  if (cur === 2 && s3done) b = P.t("b3done");
  $("stepBody").textContent = b;
}
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => {
  DR.soft.age = Infinity; DR.hard.age = Infinity; s1done = false; text();
  hitDrum("soft");
  if (mv) queue = { t: 1.6, kind: "hard" }; else hitDrum("hard");
  wake();
});
const pr2 = Play.predict($("predict2"), {
  q: P.t("q2"),
  options: [{ label: P.t("p1") }, { label: P.t("p2"), right: true }, { label: P.t("p3") }],
  right: P.t("right2"), wrong: P.t("wrong2"),
}, () => {
  setAir(100); setRing(true);
  if (mv) pumpAnim = { t: 0 }; else setAir(0);
  markS3(); wake(); draw();
});

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  cur = i;
  $("predict").hidden = i !== 0;
  $("predict2").hidden = i !== 2;
  ["c1", "c2", "c3", "c4"].forEach((c, j) => ($(c).hidden = i !== j));
  queue = null; pumpAnim = null; drag = null;
  if (i !== 2 && ringing) setRing(false);
  if (i === 3) { pulses = []; flash = 0; }
  text(); draw(); wake();
});

$("reset").addEventListener("click", () => {
  DR.soft.age = Infinity; DR.hard.age = Infinity; queue = null; s1done = false;
  setL(20); setS(2); rul.age = Infinity; drag = null; tipD = 0;
  setAir(100); pumpAnim = null; handle = 0; s3done = false; setRing(false);
  med = "air"; pulses = []; flash = 0; syncChips();
  pr.reset(); pr2.reset(); setPause(false); st.go(0);
});
$("data").textContent = P.t("dataNote", { v: V_AIR, t: Play.fmt(kmTime(V_AIR), 1) });
setSound(false); setPause(false); setRing(false); setAir(100); syncChips();
addEventListener("resize", draw);
draw();
</script>

// ---------- circuit model (pure) ----------
const E = 1.5, R_INT = 0.3, R_BULB = 5, R_WIRE = 0.02, R_SW = 0.02, SHORT_A = 1;
const OBJ = { coin: { R: 0.01 }, clip: { R: 0.05 }, lead: { R: 5 }, eraser: { R: Infinity }, plastic: { R: Infinity }, wood: { R: Infinity } };
const OBJ_ORDER = ["coin", "clip", "lead", "eraser", "plastic", "wood"];
const I_NOM = E / (R_INT + R_BULB + 2 * R_WIRE);   // the plain loop: two wires and the bulb

const T = { "B-": { x: 190, y: 310 }, "B+": { x: 378, y: 310 }, Ls: { x: 279, y: 164 }, Lt: { x: 300, y: 195 },
  S1: { x: 450, y: 205 }, S2: { x: 545, y: 205 }, G1: { x: 80, y: 205 }, G2: { x: 136, y: 205 } };
const pos = (e) => (e.t ? T[e.t] : e);
function wirePath(a, b) {
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2 + 24 + 0.28 * len, pts = [];
  for (let i = 0; i <= 20; i++) {
    const u = i / 20, v = 1 - u;
    pts.push({ x: v * v * a.x + 2 * u * v * cx + u * u * b.x, y: v * v * a.y + 2 * u * v * cy + u * u * b.y });
  }
  return pts;
}
const FIL = [];
for (let i = 0; i <= 8; i++) FIL.push({ x: 284 + i * 4, y: 102 + (i % 2 ? -5 : 5) });
const BULB_PATH = [T.Ls, { x: 287, y: 154 }, { x: 291, y: 146 }, { x: 284, y: 106 }, ...FIL, { x: 316, y: 106 }, { x: 309, y: 146 }, { x: 300, y: 170 }, T.Lt];
const BAT_PATH = [T["B-"], { x: 284, y: 310 }, T["B+"]];

// Gaussian elimination with partial pivoting; A is m rows of m+1 numbers.
function gauss(A) {
  const m = A.length;
  for (let c = 0; c < m; c++) {
    let p = c;
    for (let r = c + 1; r < m; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    const d = A[c][c] || 1e-30;
    for (let r = 0; r < m; r++) {
      if (r === c) continue;
      const f = A[r][c] / d;
      if (f) for (let k = c; k <= m; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map((row, i) => row[m] / (row[i] || 1e-30));
}
// c = { wires: [{a, b}], sw: null|true|false, gap: undefined|null|objId }; ends are {t} or {x, y}
function solve(c) {
  const idx = {}, names = [];
  const node = (k) => (k in idx ? idx[k] : (idx[k] = names.push(k) - 1));
  ["B-", "B+", "Ls", "Lt"].forEach(node);
  const el = [];
  c.wires.forEach((w, i) => {
    const a = node(w.a.t || "w" + i + "a"), b = node(w.b.t || "w" + i + "b");
    el.push({ kind: "wire", i, a, b, R: R_WIRE, path: wirePath(pos(w.a), pos(w.b)) });
  });
  el.push({ kind: "bulb", a: idx.Ls, b: idx.Lt, R: R_BULB, path: BULB_PATH });
  if (c.sw === true) el.push({ kind: "sw", a: node("S1"), b: node("S2"), R: R_SW, path: [T.S1, T.S2] });
  if (c.gap && OBJ[c.gap].R < Infinity) el.push({ kind: "gap", a: node("G1"), b: node("G2"), R: OBJ[c.gap].R, path: [T.G1, T.G2] });
  const n = names.length, m = n - 1, p = idx["B+"];   // node 0 (B−) is the reference, 0 V
  const A = Array.from({ length: m }, () => new Array(m + 1).fill(0));
  const stamp = (a, b, g) => {
    if (a) A[a - 1][a - 1] += g;
    if (b) A[b - 1][b - 1] += g;
    if (a && b) { A[a - 1][b - 1] -= g; A[b - 1][a - 1] -= g; }
  };
  el.forEach((e) => stamp(e.a, e.b, 1 / e.R));
  stamp(p, 0, 1 / R_INT);
  A[p - 1][m] += E / R_INT;                              // battery as E behind its inner resistance
  for (let k = 0; k < m; k++) A[k][k] += 1e-9;           // loose ends: tiny leak keeps the system solvable
  const V = [0, ...gauss(A)].map((v) => (Number.isFinite(v) ? v : 0));
  el.forEach((e) => (e.I = (V[e.a] - V[e.b]) / e.R));
  const Ibat = (E - V[p]) / R_INT;
  el.push({ kind: "bat", path: BAT_PATH, I: Ibat });
  const bulb = el.find((e) => e.kind === "bulb");
  const bright = Math.min(1.5, (bulb.I / I_NOM) ** 2);
  return { el, idx, V, Ibat, Ib: bulb.I, Vb: bulb.I * R_BULB, bright, short: Ibat > SHORT_A };
}
// Plain-words reason for what the bulb does (connection only, the bulb itself left out).
function status(c) {
  const r = solve(c);
  if (r.short) return { r, key: "stShort" };
  if (r.bright >= 0.6) return { r, key: "stLit" };
  if (r.bright >= 0.05) return { r, key: "stDim" };
  if (c.sw === false && solve({ ...c, sw: true }).bright >= 0.05) return { r, key: "stSwitch" };
  const par = {};
  const find = (k) => { while (par[k] && par[k] !== k) k = par[k]; return k; };
  const join = (a, b) => { const x = find(a), y = find(b); if (x !== y) par[x] = y; };
  c.wires.forEach((w, i) => join(w.a.t || "w" + i + "a", w.b.t || "w" + i + "b"));
  if (c.sw === true) join("S1", "S2");
  if (c.gap && OBJ[c.gap].R < Infinity) join("G1", "G2");
  const s = find("Ls"), t = find("Lt"), bat = [find("B+"), find("B-")];
  if (s === t && (bat.includes(s))) return { r, key: "stBypass" };
  if (bat.includes(s) || bat.includes(t)) return { r, key: "stOne" };
  if (s === t) return { r, key: "stBypass" };
  return { r, key: "stNone" };
}
const level = (b) => (b >= 0.6 ? "bright" : b >= 0.05 ? "dim" : "dark");

// ---------- scenes ----------
const W = (a, b) => ({ a: typeof a === "string" ? { t: a } : a, b: typeof b === "string" ? { t: b } : b });

  { wires: [W("B+", "Lt")], sw: null },

// path helpers for the moving dots
function measure(path) {
  const cum = [0];
  for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y));
  return cum;
}
function at(path, cum, s) {
  const L = cum[cum.length - 1];

  const seg = cum[i] - cum[i - 1] || 1, u = (s - cum[i - 1]) / seg;
  return { x: path[i - 1].x + (path[i].x - path[i - 1].x) * u, y: path[i - 1].y + (path[i].y - path[i - 1].y) * u, dx: path[i].x - path[i - 1].x, dy: path[i].y - path[i - 1].y };
}
function flow(par, res) {

    if (!(Math.abs(e.I) > 0.004)) return;

    const sp = 26, v = 60 * Math.min(Math.abs(e.I) / I_NOM, 3), off = (clock * v) % sp, dir = e.I > 0 ? 1 : -1;
    for (let s = off; s < L; s += sp) {

    }

      Play.svg("polygon", { points: [pt(9, 0), pt(-6, -7), pt(-6, 7)].join(" "), fill: "var(--hl)", stroke: "var(--fg)", "stroke-width": 1 }, par);
    }

}

// ---------- drawing ----------

let lastRes = null;

      const g = Play.svg("g", { transform: `translate(${(px + 158 - 284 * s).toFixed(1)} ${(py + 100 - 196 * s).toFixed(1)}) scale(${s})` }, dyn);

// ---------- words ----------
function say() {
  let s = "";

  else if (cur === 1) {
    const st = status(build);
    s = P.t(st.key, { I: Play.fmt(st.r.Ibat, 1), k: Math.round(st.r.Ibat / I_NOM) });
  } else if (cur === 2) {
    if (!gapObj) s = P.t("stGapEmpty");
    else {
      const lv = level(solve(Object.assign({}, GAP_SCENE, { gap: gapObj })).bright);
      s = P.t("stGap", { o: P.t(gapObj), s: P.t(lv === "bright" ? "sBright" : lv === "dim" ? "sDim" : "sDark") });
    }
  } else {
    const r = solve(Object.assign({}, RULE_SCENE, { sw: ruleSw }));
    s = ruleSw ? P.t("ruleOn", { I: fmt2(Math.abs(r.Ib)), Vb: fmt2(Math.abs(r.Vb)), E: Play.fmt(E, 1) }) : P.t("ruleOff");
  }
  Play.live($("live"), s);

  OBJ_ORDER.forEach((o) => { if (tested[o]) groups[tested[o]].push(P.t(o)); });
  const sep = P.lang === "zh" ? "、" : ", ";

    if (!groups[k].length) return;
    const line = document.createElement("div"), b = document.createElement("b");

// ---------- dragging wire ends ----------
function nearest(p, max) {
  let best = null, bd = max;
  TARGETS.forEach((t) => { const d = Math.hypot(T[t].x - p.x, T[t].y - p.y); if (d < bd) { bd = d; best = t; } });
  return best;
}

  if (cur !== 1) return;
  const p = Play.pointer(fig, e);
  let best = null, bd = 28;
  ends.forEach((h) => { const q = pos(build.wires[h.w][h.k]), d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = h; } });
  if (!best) return;
  drag = { h: best };
  fig.setPointerCapture(e.pointerId);
  e.preventDefault();
  best.g.focus({ preventScroll: true });
  draw();
});
fig.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = Play.pointer(fig, e);
  build.wires[drag.h.w][drag.h.k] = { x: Play.clamp(p.x, 12, 588), y: Play.clamp(p.y, 12, 368) };
  nearT = nearest(p, 34);
  draw();
});
function endDrag() {
  if (!drag) return;
  const end = build.wires[drag.h.w][drag.h.k], t = nearest(end, 34);
  if (t) build.wires[drag.h.w][drag.h.k] = { t };
  drag = null; nearT = null;
  draw(); say();
}

// PURE-BEGIN: numbers only, tested in node
const NP = 6, MAXN = 4, DEG = 3, MAXDEG = 12, BAR = 1.5, WS = [1, 2, 3];
const clampN = (x, a, b) => Math.min(b, Math.max(a, x));
function newPegs() { const m = () => Array.from({ length: NP + 1 }, () => []); return { L: m(), R: m() }; }
const sumW = (st) => st.reduce((a, b) => a + b.w, 0);
function torque(pg, s) { let t = 0; for (let d = 1; d <= NP; d++) t += d * sumW(pg[s][d]); return t; }
function weight(pg, s) { let t = 0; for (let d = 1; d <= NP; d++) t += sumW(pg[s][d]); return t; }
function count(pg, s) { let t = 0; for (let d = 1; d <= NP; d++) t += pg[s][d].length; return t; }
const targetDeg = (pg) => clampN((torque(pg, "R") - torque(pg, "L")) * DEG, -MAXDEG, MAXDEG);
function terms(pg, s) {
  const out = [];
  for (let d = 1; d <= NP; d++) {
    const ws = pg[s][d].map((b) => b.w);
    if (ws.length) out.push((ws.length > 1 ? "(" + ws.join("+") + ")" : ws[0]) + "×" + d);
  }
  return out;
}
function solutions(t) { const r = []; WS.forEach((w) => { for (let d = 1; d <= NP; d++) if (w * d === t) r.push({ w, d }); }); return r; }
function crowbar(M, p) { const a = p, b = BAR - p, e = (M * a) / b; return { a, b, e, ratio: b / a, rise: (10 * a) / b }; }
// challenges: preset left side, locked left, check(pegs) → result or null
const CH = [
  { pre: [] },
  { pre: [[2, 3]], lock: true },
  { pre: [[4, 1], [4, 1]], lock: true },
  { pre: [] },
];
function checkCh(i, pg) {
  const tl = torque(pg, "L"), tr = torque(pg, "R");
  if (tl !== tr || tr === 0) return null;
  if (i === 1) {
    if (count(pg, "R") !== 1) return null;
    for (let d = 1; d <= NP; d++) if (pg.R[d].length) return { w: pg.R[d][0].w, d };
  }
  if (i === 2) { for (let d = 2; d <= NP; d++) if (pg.R[d].length) return null; return { w: sumW(pg.R[1]) }; }
  if (i === 3) { const wl = weight(pg, "L"), wr = weight(pg, "R"); return wl !== wr ? { wl, wr } : null; }
  return null;
}
// PURE-END

const $ = (id) => document.getElementById(id);

const PX = 300, PY = 120, SP = 42, HALF = NP * SP + 32, GROUND = 360;
const BW = { 1: 26, 2: 32, 3: 38 }, COL = { 1: "var(--c)", 2: "var(--b)", 3: "var(--a)" };
const fmtN = (x) => (Math.abs(x - Math.round(x)) < 1e-9 ? Play.fmt(x, 0) : Play.fmt(x, 1));

// ---------- state ----------
let cur = 0, paused = false, raf = 0, last = 0, ch = 1, pick = 1, focusPeg = 6;
let found = new Set();
const S1 = { L: [2, 3], R: [6, 1] }; // step 1: [peg, weight]
let scn;
function buildScenes() {
  const a = { pg: newPegs(), a: 0, v: 0, locked: true };
  a.pg.L[S1.L[0]].push({ w: S1.L[1], fixed: true });
  a.pg.R[S1.R[0]].push({ w: S1.R[1], fixed: true });
  scn = [a, { pg: newPegs(), a: 0, v: 0, locked: false }];
  loadCh(ch);
}
function loadCh(i) {
  ch = i;
  const b = scn[1];
  b.pg = newPegs();
  CH[i].pre.forEach(([d, w]) => b.pg.L[d].push({ w, fixed: true }));
  if (Play.reduced) { b.a = targetDeg(b.pg); b.v = 0; }
}
const beam = () => scn[cur];
const tgt = (B) => (B.locked ? 0 : targetDeg(B.pg));

// ---------- beam drawing ----------
const beamScene = S("g", {}, fig), crowScene = S("g", {}, fig);
S("line", { x1: 10, x2: 590, y1: GROUND, y2: GROUND, stroke: "var(--muted)", "stroke-width": 2 }, beamScene);
const labL = S("text", { class: "big", x: 150, y: 30, "text-anchor": "middle" }, beamScene);
const labM = S("text", { class: "big", x: 300, y: 30, "text-anchor": "middle" }, beamScene);
const labR = S("text", { class: "big", x: 450, y: 30, "text-anchor": "middle" }, beamScene);
S("path", { d: `M${PX} ${PY}L${PX - 9} ${GROUND - 10}H${PX - 30}V${GROUND}H${PX + 30}V${GROUND - 10}H${PX + 9}Z`, fill: "var(--muted)" }, beamScene);
const supports = S("g", {}, beamScene);
[-1, 1].forEach((s) => S("rect", { x: PX + s * (HALF - 8) - 5, y: PY + 6, width: 10, height: GROUND - PY - 6, fill: "var(--line)", stroke: "var(--muted)", "stroke-width": 1.5 }, supports));
const beamG = S("g", {}, beamScene);
S("rect", { x: PX - HALF, y: PY - 6, width: 2 * HALF, height: 12, rx: 5, fill: "var(--b)" }, beamG);
const pegNums = [];
["L", "R"].forEach((s) => {
  for (let d = 1; d <= NP; d++) {
    const x = PX + (s === "L" ? -1 : 1) * d * SP;
    S("circle", { cx: x, cy: PY, r: 3.5, fill: "var(--surface)" }, beamG);
    pegNums.push(S("text", { x, y: PY - 14, "text-anchor": "middle", class: "halo" }, beamG));
    pegNums[pegNums.length - 1].textContent = d;
  }
});
S("circle", { cx: PX, cy: PY, r: 7, fill: "var(--fg)" }, beamScene);
const hangL = S("g", {}, beamScene);
const pegs = []; // x order: L6..L1, R1..R6
for (let d = NP; d >= 1; d--) pegs.push({ s: "L", d });
for (let d = 1; d <= NP; d++) pegs.push({ s: "R", d });
pegs.forEach((p, i) => {
  p.g = S("g", { class: "peg", tabindex: i === focusPeg ? 0 : -1, role: "button" }, hangL);
  p.g.addEventListener("click", () => { if (pick) addBlock(p, pick); });
  p.g.addEventListener("focus", () => { focusPeg = i; rove(); });
  p.g.addEventListener("keydown", (e) => pegKey(e, i));
});
function rove() { pegs.forEach((p, i) => p.g.setAttribute("tabindex", i === focusPeg ? 0 : -1)); }
function pegPos(p, aDeg) {
  const r = (aDeg * Math.PI) / 180, k = (p.s === "L" ? -1 : 1) * p.d * SP;
  return { x: PX + k * Math.cos(r), y: PY + k * Math.sin(r) };
}
function buildPeg(p) {
  const g = p.g, st = beam().pg[p.s][p.d];
  while (g.firstChild) g.removeChild(g.firstChild);
  S("rect", { x: -SP / 2, y: -18, width: SP, height: 190, fill: "var(--a)", "fill-opacity": 0 }, g);
  S("circle", { class: "ring", cx: 0, cy: 0, r: 13 }, g);
  let y = 0;
  if (st.length) { S("line", { x1: 0, x2: 0, y1: 0, y2: 10, stroke: "var(--fg)", "stroke-width": 1.5 }, g); y = 10; }
  st.forEach((b, j) => {
    const w = BW[b.w], bg = S("g", { class: "blk" + (b.fixed ? " fixed" : "") }, g);
    S("rect", { x: -w / 2, y, width: w, height: w, rx: 4, fill: COL[b.w] }, bg);
    const t = S("text", { x: 0, y: y + w / 2, "text-anchor": "middle", "dominant-baseline": "central" }, bg);
    t.textContent = b.w;
    blockDrag(bg, p, j);
    y += w + 2;
  });
  const list = st.length ? st.map((b) => b.w).join(", ") : P.t("empty");
  g.setAttribute("aria-label", P.t("pegAria", { side: P.t(p.s === "L" ? "sideL" : "sideR"), d: p.d, list }));
}
function renderBeam() {
  const B = beam();
  beamG.setAttribute("transform", `rotate(${B.a.toFixed(3)} ${PX} ${PY})`);
  pegNums.forEach((t) => t.setAttribute("transform", `rotate(${(-B.a).toFixed(3)} ${t.getAttribute("x")} ${PY - 14 - 5})`));
  pegs.forEach((p) => { const q = pegPos(p, B.a); p.g.setAttribute("transform", `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)})`); });
  supports.style.display = B.locked ? "" : "none";
  const tl = torque(B.pg, "L"), tr = torque(B.pg, "R");
  labL.textContent = P.t("sideL") + " " + tl;
  labR.textContent = P.t("sideR") + " " + tr;
  labM.textContent = B.locked ? "" : tl === tr ? "=" : tl > tr ? ">" : "<";
  fig.setAttribute("aria-label", P.t("figBeam", { l: tl, r: tr }));
}
function rebuild() { pegs.forEach(buildPeg); renderBeam(); }

// ---------- animation ----------
function moving() { const B = beam(); return cur < 2 && (Math.abs(tgt(B) - B.a) > 0.01 || Math.abs(B.v) > 0.01); }
function wake() {
  if (Play.reduced && cur < 2) { const B = beam(); B.a = tgt(B); B.v = 0; renderBeam(); return; }
  if (!raf && !paused && moving()) { last = 0; raf = requestAnimationFrame(tick); }
}
function tick(ts) {
  raf = 0;
  if (paused || cur > 1) return;
  const dt = last ? Math.min((ts - last) / 1000, 0.05) : 1 / 60;
  last = ts;
  const B = beam(), T = tgt(B);
  for (let k = 0; k < 4; k++) { const h = dt / 4; B.v += (40 * (T - B.a) - 6 * B.v) * h; B.a += B.v * h; }
  B.a = clampN(B.a, -MAXDEG - 3, MAXDEG + 3);
  if (Math.abs(T - B.a) < 0.01 && Math.abs(B.v) < 0.01) { B.a = T; B.v = 0; }
  renderBeam();
  if (moving()) raf = requestAnimationFrame(tick);
}

// ---------- editing blocks ----------
const note = (s) => Play.live($("live"), s);
function canEdit(p, quiet) {
  if (cur !== 1) return false;
  if (p.s === "L" && CH[ch].lock) { if (!quiet) note(P.t("leftSet")); return false; }
  return true;
}
function addBlock(p, w) {
  if (!canEdit(p)) return false;
  const st = scn[1].pg[p.s][p.d];
  if (st.length >= MAXN) { note(P.t("full", { n: MAXN })); return false; }
  st.push({ w });
  changed(p);
  return true;
}
function removeBlock(p, j) {
  const st = scn[1].pg[p.s][p.d];
  if (j < 0 || j >= st.length) return false;
  if (st[j].fixed) { note(P.t("fixedMsg")); return false; }
  if (!canEdit(p)) return false;
  st.splice(j, 1);
  changed(p);
  return true;
}
function changed(p) {
  if (p) buildPeg(p);
  renderBeam(); text(); wake();
}
function pegKey(e, i) {
  const p = pegs[i];
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    focusPeg = clampN(i + (e.key === "ArrowRight" ? 1 : -1), 0, pegs.length - 1);
    rove(); pegs[focusPeg].g.focus();
  } else if (["1", "2", "3"].includes(e.key)) { e.preventDefault(); addBlock(p, +e.key); p.g.focus(); }
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); addBlock(p, pick); p.g.focus(); }
  else if (e.key === "Delete" || e.key === "Backspace") {
    e.preventDefault();
    const st = scn[1].pg[p.s][p.d];
    for (let j = st.length - 1; j >= 0; j--) if (!st[j].fixed) { removeBlock(p, j); break; }
    p.g.focus();
  }
}
function dropPeg(e) {
  const pt = Play.pointer(fig, e), B = beam();
  let best = null, bd = SP / 2;
  pegs.forEach((p) => { const q = pegPos(p, B.a), dx = Math.abs(pt.x - q.x); if (dx < bd && pt.y > q.y - 50 && pt.y < q.y + 200) { bd = dx; best = p; } });
  return best;
}
function hot(p) { pegs.forEach((x) => x.g.classList.toggle("hot", x === p)); }
// generic drag: from an element; onDrop(peg|null, wasDrag)
function dragFrom(el, w, onEnd) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button > 0) return;
    e.preventDefault(); e.stopPropagation();
    const start = { x: e.clientX, y: e.clientY };
    let drag = false, ghost = null;
    const mv = (ev) => {
      if (!drag && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 8) {
        drag = true; ghost = document.createElement("div"); ghost.className = "ghost"; ghost.textContent = w(); ghost.style.background = COL[w()]; document.body.appendChild(ghost);
      }
      if (ghost) { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; hot(dropPeg(ev)); }
    };
    const up = (ev, ok) => {
      removeEventListener("pointermove", mv); removeEventListener("pointerup", upOk); removeEventListener("pointercancel", upNo);
      if (ghost) ghost.remove();
      hot(null);
      if (ok) onEnd(drag ? dropPeg(ev) : null, drag);
    };
    const upOk = (ev) => up(ev, true), upNo = (ev) => up(ev, false);
    addEventListener("pointermove", mv); addEventListener("pointerup", upOk); addEventListener("pointercancel", upNo);
  });
}
function blockDrag(bg, p, j) {
  bg.addEventListener("click", (e) => e.stopPropagation());
  const st = () => scn[1].pg[p.s][p.d];
  dragFrom(bg, () => (st()[j] ? st()[j].w : 1), (to, wasDrag) => {
    if (cur !== 1) return;
    const b = st()[j];
    if (!b) return;
    if (b.fixed) { note(P.t("fixedMsg")); return; }
    if (!wasDrag) { removeBlock(p, j); return; }
    if (to === p) return;
    if (to && (!canEdit(to) || scn[1].pg[to.s][to.d].length >= MAXN)) { if (to && canEdit(to, true)) note(P.t("full", { n: MAXN })); return; }
    if (!canEdit(p)) return;
    st().splice(j, 1); buildPeg(p);
    if (to) scn[1].pg[to.s][to.d].push({ w: b.w });
    changed(to);
  });
}

// ---------- tray ----------
const tray = $("tray"), chips = {};
WS.forEach((w) => {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", P.t("blockAria", { w }));
  const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = COL[w];
  b.append(sw, document.createTextNode(String(w)));
  tray.appendChild(b); chips[w] = b;
  dragFrom(b, () => w, (to, wasDrag) => {
    if (!wasDrag) { setPick(w); return; }
    setPick(w);
    if (to) addBlock(to, w);
  });
  b.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setPick(w); }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); chips[WS[(WS.indexOf(w) + (e.key === "ArrowRight" ? 1 : 2)) % 3]].focus(); }
  });
});
function setPick(w) { pick = w; WS.forEach((x) => chips[x].setAttribute("aria-pressed", x === w ? "true" : "false")); }

// ---------- challenges ----------
const chs = $("chs"), chBtns = [0, 1, 2, 3].map((i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "small"; b.textContent = P.t("ch" + i);
  b.addEventListener("click", () => { loadCh(i); rebuild(); text(); wake(); });
  chs.appendChild(b);
  return b;
});
const SOL1 = () => solutions(CH[1].pre[0][0] * CH[1].pre[0][1]);

// ---------- crowbar (step 3) ----------
const fulc = $("fulc"), mass = $("mass");
const CX0 = 80, CX1 = 560, CK = (CX1 - CX0) / BAR, CY = 236, CG = 304;
S("line", { x1: 10, x2: 590, y1: CG, y2: CG, stroke: "var(--muted)", "stroke-width": 2 }, crowScene);
const rock = S("path", { fill: "var(--muted)" }, crowScene);
const rockT = S("text", { "text-anchor": "middle", "dominant-baseline": "central", class: "big", style: "fill:var(--surface)" }, crowScene);
const fg = S("g", { class: "fulc", tabindex: 0, role: "slider", "aria-valuemin": 0.1, "aria-valuemax": 1 }, crowScene);
S("polygon", { points: `0,${CY + 5} -28,${CG} 28,${CG}`, fill: "var(--fg)", stroke: "transparent" }, fg);
S("rect", { x: CX0, y: CY - 5, width: CX1 - CX0, height: 10, rx: 4, fill: "var(--b)" }, crowScene);
const loadArr = S("path", { fill: "var(--no)" }, crowScene), effArr = S("path", { fill: "var(--a)" }, crowScene);
const effT = S("text", { "text-anchor": "end", class: "big halo" }, crowScene);
const dim = S("path", { fill: "none", stroke: "var(--muted)", "stroke-width": 1.5 }, crowScene);
const dimA = S("text", { x: CX0, y: 356, "text-anchor": "start", class: "halo" }, crowScene);
const dimB = S("text", { x: CX1, y: 356, "text-anchor": "end", class: "halo" }, crowScene);
const arrow = (x, y0, y1) => { const h = Math.sign(y1 - y0) * Math.min(12, Math.abs(y1 - y0)); return `M${x - 3} ${y0}V${y1 - h}H${x - 9}L${x} ${y1}L${x + 9} ${y1 - h}H${x + 3}V${y0}Z`; };
function drawCrow() {
  const M = +mass.value, p = clampN(+fulc.value, 0.1, 1), c = crowbar(M, p), fx = CX0 + p * CK;
  const r = 20 + Math.sqrt(M) * 2.8, top = CY - 5;
  rock.setAttribute("d", `M${CX0 - r} ${top}C${CX0 - r} ${top - r * 1.3} ${CX0 - r * 0.4} ${top - r * 2} ${CX0 + r * 0.15} ${top - r * 1.9}C${CX0 + r} ${top - r * 1.8} ${CX0 + r * 1.1} ${top - r * 0.6} ${CX0 + r} ${top}Z`);
  rockT.setAttribute("x", CX0); rockT.setAttribute("y", top - r * 0.9);
  rockT.textContent = P.t("kgUnit", { v: M });
  fg.setAttribute("transform", `translate(${fx.toFixed(1)} 0)`);
  const sc = 64 / Math.max(M, c.e), ll = Math.max(6, M * sc), le = Math.max(6, c.e * sc);
  loadArr.setAttribute("d", arrow(CX0, CY + 6, CY + 6 + ll));
  effArr.setAttribute("d", arrow(CX1 - 4, top - 14 - le, top - 2));
  effT.setAttribute("x", CX1); effT.setAttribute("y", top - 22 - le);
  effT.textContent = P.t("push", { v: Play.fmt(c.e, 1) });
  dim.setAttribute("d", `M${CX0} 316V332M${fx} 316V332M${CX1} 316V332M${CX0} 324H${CX1}`);
  dimA.textContent = P.t("loadArm", { v: Play.fmt(c.a, 2) });
  dimB.textContent = P.t("effortArm", { v: Play.fmt(c.b, 2) });
  fg.setAttribute("aria-valuenow", p);
  fg.setAttribute("aria-label", P.t("pivotAria", { v: Play.fmt(p, 2) }));
  $("fulcVal").textContent = P.t("mUnit", { v: Play.fmt(p, 2) });
  $("massVal").textContent = P.t("kgUnit", { v: M });
  if (cur === 2) fig.setAttribute("aria-label", P.t("figCrow", { m: M, e: Play.fmt(c.e, 1) }));
  return c;
}
function setFulc(v) { fulc.value = Math.round(clampN(v, 0.1, 1) * 20) / 20; drawCrow(); text(); }
fulc.addEventListener("input", () => { drawCrow(); text(); });
mass.addEventListener("input", () => { drawCrow(); text(); });
fg.addEventListener("keydown", (e) => {
  const d = { ArrowLeft: -0.05, ArrowDown: -0.05, ArrowRight: 0.05, ArrowUp: 0.05 }[e.key];
  if (d) { e.preventDefault(); setFulc(+fulc.value + d); }
  if (e.key === "Home") { e.preventDefault(); setFulc(0.1); }
  if (e.key === "End") { e.preventDefault(); setFulc(1); }
});
let fdrag = false;
fig.addEventListener("pointerdown", (e) => {
  if (cur !== 2) return;
  const pt = Play.pointer(fig, e);
  if (pt.y < CY - 30) return;
  fdrag = true; fig.setPointerCapture(e.pointerId); fg.focus();
  setFulc((pt.x - CX0) / CK);
});
fig.addEventListener("pointermove", (e) => { if (fdrag) setFulc((Play.pointer(fig, e).x - CX0) / CK); });
["pointerup", "pointercancel"].forEach((t) => fig.addEventListener(t, () => (fdrag = false)));

// ---------- text ----------
function el(tag, txt, cls) { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; }
function text() {
  const k = cur + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  $("s2box").hidden = cur !== 1; $("s3box").hidden = cur !== 2;
  if (cur === 0) {
    const B = scn[0], v = { wl: S1.L[1], dl: S1.L[0], wr: S1.R[1], dr: S1.R[0], tl: torque(B.pg, "L"), tr: torque(B.pg, "R") };
    $("stepBody").textContent = P.t(B.locked ? "b1" : "b1done", v);
    $("letgo").textContent = P.t(B.locked ? "letGo" : "hold");
    if (!B.locked) note(P.t("balanced", { l: v.tl, r: v.tr })); else note("");
  } else if (cur === 1) {
    const pg = scn[1].pg, tl = torque(pg, "L"), tr = torque(pg, "R");
    $("stepBody").textContent = P.t("b2");
    chBtns.forEach((b, i) => { b.classList.toggle("cur", i === ch); b.setAttribute("aria-pressed", i === ch ? "true" : "false"); });
    const pre = CH[ch].pre;
    $("chText").textContent = P.t("chT" + ch, ch === 1 ? { w: pre[0][1], d: pre[0][0], n: SOL1().length } : ch === 2 ? { d: pre[0][0] } : {});
    const tb = el("table", null, "res"), hr = el("tr");
    ["thSide", "thCalc", "thSum"].forEach((h) => hr.appendChild(el("th", P.t(h))));
    tb.appendChild(hr);
    [["L", tl], ["R", tr]].forEach(([s, t]) => {
      const tr_ = el("tr");
      tr_.append(el("td", P.t(s === "L" ? "sideL" : "sideR")), el("td", terms(pg, s).join(" + ") || "0", "m"), el("td", String(t), "num"));
      tb.appendChild(tr_);
    });
    $("tbl").replaceChildren(tb);
    const any = count(pg, "L") + count(pg, "R") > 0;
    const stTxt = !any ? P.t("emptyBeam") : tl === tr ? P.t("balanced", { l: tl, r: tr }) : P.t(tl > tr ? "tipsL" : "tipsR", { l: tl, r: tr });
    $("status").textContent = stTxt + (any ? " " + P.t("weights", { wl: weight(pg, "L"), wr: weight(pg, "R") }) : "");
    $("status").classList.toggle("ok", any && tl === tr);
    const res = checkCh(ch, pg);
    let win = "";
    if (ch === 1) {
      if (res) found.add(res.w + "@" + res.d);
      const sols = SOL1(), got = sols.filter((s) => found.has(s.w + "@" + s.d));
      if (got.length === sols.length) win = P.t("foundAll", { n: sols.length });
      else if (got.length) win = P.t("found", { k: got.length, n: sols.length, list: got.map((s) => s.w + "×" + s.d).join(", ") });
    } else if (ch === 2 && res) win = P.t("win2", { w: res.w, l: weight(pg, "L"), d: pre[0][0] });
    else if (ch === 3 && res) win = P.t("win3", res);
    $("chWin").textContent = win;
    note(stTxt);
  } else {
    $("stepBody").textContent = P.t("b3");
    const M = +mass.value, c = crowbar(M, +fulc.value);
    const lhs = Play.fmt(M * c.a, 1), rhs = Play.fmt(c.e * c.b, 1);
    const kg = (v) => P.t("kgUnit", { v }), m = (v) => P.t("mUnit", { v });
    $("cmath").textContent = `${kg(M)} × ${m(Play.fmt(c.a, 2))} = ${kg(Play.fmt(c.e, 1))} × ${m(Play.fmt(c.b, 2))}`;
    $("cmath2").textContent = `${lhs} = ${rhs}`;
    const v = { e: Play.fmt(c.e, 1), m: M, k: fmtN(Math.round(c.ratio * 10) / 10), r: Play.fmt(c.rise, 1) };
    note(P.t(Math.abs(c.ratio - 1) < 1e-9 ? "crowSame" : c.ratio > 1 ? "crowLess" : "crowMore", v));
  }
}

// ---------- step 1 ----------
function setLock(l) { scn[0].locked = l; if (l) { scn[0].a = 0; scn[0].v = 0; } renderBeam(); text(); wake(); }
$("letgo").addEventListener("click", () => setLock(!scn[0].locked));
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }],
  right: P.t("right", { k: S1.L[1] / S1.R[1] }), wrong: P.t("wrong"),
}, () => { if (cur === 0) setLock(false); });

const pauseBtn = $("pause");
function setPause(p) {
  paused = p; pauseBtn.textContent = P.t(p ? "play" : "pause"); pauseBtn.setAttribute("aria-pressed", p ? "true" : "false");
  if (!p) wake();
}
pauseBtn.addEventListener("click", () => setPause(!paused));

function updateFs() {
  const r = fig.getBoundingClientRect(), sc = Math.min(r.width / 600, r.height / 380);
  fig.style.setProperty("--fs", (sc > 0 ? Math.max(14, 13.5 / sc) : 14).toFixed(1) + "px");
}

buildScenes(); setPick(1); setPause(false);
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  cur = i;
  $("predict").hidden = i !== 0;
  $("c1").hidden = i !== 0; $("c2").hidden = i !== 1; $("c3").hidden = i !== 2;
  beamScene.style.display = i < 2 ? "" : "none"; crowScene.style.display = i === 2 ? "" : "none";
  pegs.forEach((p) => p.g.setAttribute("tabindex", i === 1 && pegs.indexOf(p) === focusPeg ? 0 : -1));
  fg.setAttribute("tabindex", i === 2 ? 0 : -1);
  updateFs();
  if (i < 2) rebuild(); else drawCrow();
  text(); wake();
});
pegs.forEach((p) => p.g.addEventListener("focus", () => { if (cur !== 1) p.g.blur(); }));

$("reset").addEventListener("click", () => {
  if (raf) cancelAnimationFrame(raf);
  raf = 0; found = new Set(); ch = 1;
  fulc.value = 0.3; mass.value = 60;
  buildScenes(); setPick(1); pr.reset(); setPause(false); st.go(0);
});
addEventListener("resize", () => { updateFs(); if (cur < 2) renderBeam(); });

$("data").textContent = P.t("dataNote", { n: MAXN, deg: DEG, max: MAXDEG, L: BAR });
</script>

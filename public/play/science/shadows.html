// ---------- geometry (pure; picture units, 100 = 1 m, y grows downward) ----------
const W = 600, G = 320, X0 = 300, CH = 120;            // ground line, child position, child height (units)
const TOP = G - CH, M = 100;                             // head top y, units per metre
const LX_MIN = 20, LX_MAX = 580, LY_MIN = 20, LY_MAX = G - 30, GAP = 30, SNAP = 10; // lamp snaps to 0.1 m

// Where a ray from point (px,py) in direction (dx,dy) first leaves the box [0,W]×[0,G].
function exitPoint(px, py, dx, dy) {
  let t = Infinity;
  if (dx > 1e-12) t = Math.min(t, (W - px) / dx);
  if (dx < -1e-12) t = Math.min(t, (0 - px) / dx);
  if (dy > 1e-12) t = Math.min(t, (G - py) / dy);
  if (dy < -1e-12) t = Math.min(t, (0 - py) / dy);
  if (!Number.isFinite(t) || t < 0) t = 0;
  return { x: Play.clamp(px + t * dx, 0, W), y: Play.clamp(py + t * dy, 0, G) };
}
// Shadow of a vertical object (base X0, top TOP) cast by rays in direction (dx,dy) through the top.
// Returns the region of blocked light (polygon) and the shadow on the ground [from, to].
function castShadow(dx, dy) {
  const e = exitPoint(X0, TOP, dx, dy);
  const onGround = e.y >= G - 1e-6;
  const side = dx > 1e-9 ? 1 : dx < -1e-9 ? -1 : 0;
  const edge = side > 0 ? W : 0;
  let poly = [[X0, G], [X0, TOP], [e.x, e.y]];
  if (!onGround) {
    if (e.y <= 1e-6 && Math.abs(e.x - edge) > 1e-6) poly.push([edge, 0]);
    poly.push([edge, G]);
  }
  const tipX = onGround ? e.x : edge;
  return { poly, tipX, side, clipped: !onGround || tipX <= 0 || tipX >= W };
}
// Lamp at (lx, ly): shadow length in metres (Infinity when the lamp is not above the head).
function lampShadowM(lx, ly) {
  const H = (G - ly) / M, h = CH / M, d = Math.abs(X0 - lx) / M;
  if (d < 1e-9) return 0;
  if (H <= h + 1e-9) return Infinity;
  return (h * d) / (H - h);
}
// Sun: time in hours (6..18) → height above horizon in degrees, side +1 = east (right)
function sunAt(t) {
  t = Play.clamp(t, 6, 18);
  return { e: 90 - 15 * Math.abs(t - 12), side: t < 12 ? 1 : t > 12 ? -1 : 0 };
}
function sunShadowM(eDeg) {
  if (eDeg <= 1e-9) return Infinity;
  if (eDeg >= 90 - 1e-9) return 0;
  return (CH / M) / Math.tan((eDeg * Math.PI) / 180);
}
function fixLamp(L) {
  L.x = Play.clamp(Math.round(L.x / SNAP) * SNAP, LX_MIN, LX_MAX);
  L.y = Play.clamp(Math.round(L.y / SNAP) * SNAP, LY_MIN, LY_MAX);
  if (Math.abs(L.x - X0) < GAP && L.y > TOP - GAP) L.x = X0 + (L.x >= X0 ? GAP : -GAP); // never inside the child
  return L;
}

const fmtM = (v) => Play.fmt(v, 1);
const fmtTime = (t) => { const h = Math.floor(t + 1e-9), m = Math.round((t - h) * 60); return h + ":" + String(m).padStart(2, "0"); };

let fs = 14;
function updateFs() {
  const r = fig.getBoundingClientRect();
  const sc = Math.min(r.width / 600, r.height / 380);
  fs = sc > 0 ? Math.max(14, 13.5 / sc) : 14;
}
function txt(x, y, s, attrs, parent) {
  const t = Play.svg("text", Object.assign({ x, y, "font-size": fs.toFixed(1), "text-anchor": "middle" }, attrs || {}), parent || labs);
  t.textContent = s;
  return t;
}
function drawChild(p) {
  const c = "var(--c)", hr = 11, x = X0;
  Play.svg("circle", { cx: x, cy: TOP + hr, r: hr, fill: c }, p);
  Play.svg("path", { d: `M${x - 13} ${TOP + 26}H${x + 13}L${x + 15} ${TOP + 74}H${x - 15}Z`, fill: c }, p);
  Play.svg("path", { d: `M${x - 13} ${TOP + 28}L${x - 21} ${TOP + 66}M${x + 13} ${TOP + 28}L${x + 21} ${TOP + 66}`, stroke: c, "stroke-width": 6, "stroke-linecap": "round", fill: "none" }, p);
  Play.svg("path", { d: `M${x - 7} ${TOP + 72}V${G - 2}M${x + 7} ${TOP + 72}V${G - 2}`, stroke: c, "stroke-width": 8, "stroke-linecap": "round", fill: "none" }, p);
}
function drawShadow(sh, op) {
  Play.svg("polygon", { points: sh.poly.map((p) => p.join(",")).join(" "), fill: "var(--ink-panel)", opacity: 0.12 }, dyn);
  const a = Math.min(X0, sh.tipX), b = Math.max(X0, sh.tipX);
  if (b - a > 0.01) Play.svg("rect", { x: a, y: G - 3, width: b - a, height: 11, rx: 3, fill: "var(--ink-panel)", opacity: op }, dyn);
}
function ray(x1, y1, x2, y2) {
  Play.svg("line", { x1, y1, x2, y2, stroke: "var(--b)", "stroke-width": 2, "stroke-dasharray": "6 5" }, dyn);
}

const lampEls = [0, 1].map((i) => {
  const g = Play.svg("g", { class: "lamp", tabindex: "0", role: "button" }, lampsL);
  Play.svg("circle", { r: 24, fill: "var(--hl)", opacity: 0.25 }, g);
  Play.svg("circle", { class: "ring", r: 15, fill: "var(--hl)", stroke: "transparent", "stroke-width": 3 }, g);
  const n = Play.svg("text", { y: 5, "font-size": 14, "text-anchor": "middle", "font-weight": 700 }, g);
  n.style.fill = "var(--ink-panel)";
  n.textContent = String(i + 1);
  g.addEventListener("focus", () => { if (cur === 1 || cur === 3) setActive(i); });
  g.addEventListener("keydown", (e) => {
    const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!k || !(cur === 1 || cur === 3)) return;
    e.preventDefault();
    const st = SNAP, L = lamps[i];
    L.x += k[0] * st; L.y += k[1] * st;
    if (k[0] && Math.abs(L.x - X0) < GAP && L.y > TOP - GAP) L.x = X0 + k[0] * GAP; // step past the child
    fixLamp(L); setActive(i); draw();
  });
  return g;
});

function shownLamps() {
  if (cur === 0) return [s1];
  if (cur === 1) return two ? lamps : [lamps[0]];
  if (cur === 3) return [lamps[0]];
  return [];
}

function draw() {
  updateFs();
  while (dyn.firstChild) dyn.removeChild(dyn.firstChild);
  while (labs.firstChild) labs.removeChild(labs.firstChild);
  const child = Play.svg("g", {}, dyn);
  const live = [];
  if (cur === 2) {
    const s = sunAt(time), R = 270, er = (s.e * Math.PI) / 180;
    Play.svg("path", { d: `M${X0 + R} ${G}A${R} ${R} 0 0 0 ${X0 - R} ${G}`, fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-dasharray": "3 6" }, dyn);
    const sx = X0 + s.side * R * Math.cos(er), sy = G - R * Math.sin(er);
    const dx = -s.side * Math.cos(er), dy = Math.sin(er);
    const sh = castShadow(dx, dy);
    drawShadow(sh, 0.65);
    for (let k = -2; k <= 2; k++) { // parallel rays
      const ox = -dy * k * 40, oy = dx * k * 40;
      Play.svg("line", { x1: sx + ox, y1: sy + oy, x2: sx + ox + dx * 70, y2: sy + oy + dy * 70, stroke: "var(--hl)", "stroke-width": 2.5, "stroke-linecap": "round" }, dyn);
    }
    if (sh.side) ray(X0, TOP, sh.poly[2][0], sh.poly[2][1]);
    Play.svg("circle", { cx: sx, cy: sy, r: 26, fill: "var(--hl)", opacity: 0.3 }, dyn);
    Play.svg("circle", { cx: sx, cy: sy, r: 17, fill: "var(--hl)" }, dyn);
    txt(fs * 0.6, fs * 1.3, "← " + P.t("West"), { "text-anchor": "start", class: "mut" });
    txt(W - fs * 0.6, fs * 1.3, P.t("East") + " →", { "text-anchor": "end", class: "mut" });
    const sm = sunShadowM(s.e), away = s.side > 0 ? P.t("west") : P.t("east"), dir = s.side > 0 ? P.t("east") : P.t("west");
    if (s.side === 0) live.push(P.t("liveSunNoon", { time: fmtTime(time) }));
    else if (!Number.isFinite(sm)) live.push(P.t("liveSunSet", { time: fmtTime(time), dir, away }));
    else live.push(P.t("liveSun", { time: fmtTime(time), e: Play.fmt(s.e, 1).replace(/\.0$/, ""), dir, s: P.t(sh.clipped ? "sOff" : "sDir", { s: fmtM(sm), away }) }));
    if (Number.isFinite(sm) && sm > 0) txt((X0 + sh.tipX) / 2, G + fs * 1.6, fmtM(sm) + " m");
  } else {
    const ls = shownLamps();
    const op = ls.length > 1 ? 0.45 : 0.65, gl = [];
    ls.forEach((L, i) => {
      const sh = castShadow(X0 - L.x, TOP - L.y);
      drawShadow(sh, op);
      ray(L.x, L.y, sh.poly[2][0], sh.poly[2][1]);
      const sm = lampShadowM(L.x, L.y), n = cur === 0 ? 1 : lamps.indexOf(L) + 1;
      const H = (G - L.y) / M, d = Math.abs(X0 - L.x) / M, away = sideWord(sh.side);
      let s;
      if (!Number.isFinite(sm)) s = P.t("sInf", { away });
      else s = P.t(sh.clipped ? "sOff" : "sDir", { s: fmtM(sm), away });
      if (sm === 0) live.push(P.t("liveLampOver", { n, H: fmtM(H) }));
      else live.push(P.t("liveLamp", { n, H: fmtM(H), d: fmtM(d), side: sideWord(-sh.side), s }));
      if (Number.isFinite(sm) && sm > 0.05 && cur !== 0) {
        const lx = sh.clipped ? (X0 + (sh.side > 0 ? W : 0)) / 2 : (X0 + sh.tipX) / 2;
        const lab = (ls.length > 1 ? n + ": " : "") + fmtM(sm) + " m";
        const prev = gl.find((q) => q.side === sh.side);
        if (prev) prev.el.textContent += " · " + lab; // both shadows on one side: one label
        else gl.push({ side: sh.side, el: txt(lx, G + fs * 1.6, lab) });
      }
      if (cur === 3) {
        // measurements for the similar-triangle rule
        Play.svg("line", { x1: L.x, y1: L.y + 18, x2: L.x, y2: G, stroke: "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": "2 4" }, dyn);
        const tx = L.x + (L.x < X0 ? -8 : 8), anc = L.x < X0 ? "end" : "start";
        txt(Play.clamp(tx, 4, W - 4), (L.y + G) / 2, "H " + fmtM(H) + " m", { "text-anchor": anc });
        txt(X0 + (sh.side >= 0 ? -28 : 28), TOP + fs * 0.4, "h " + fmtM(CH / M) + " m", { "text-anchor": sh.side >= 0 ? "end" : "start" });
        if (d > 0.05) txt((L.x + X0) / 2, G - fs * 0.5, "d " + fmtM(d) + " m", { class: "mut" });
        let r;
        if (sm === 0) r = P.t("liveRuleOver", { h: fmtM(CH / M), H: fmtM(H) });
        else if (!Number.isFinite(sm)) r = P.t("liveRuleInf", { h: fmtM(CH / M), H: fmtM(H) });
        else r = P.t("liveRule", { h: fmtM(CH / M), H: fmtM(H), d: fmtM(d), s: fmtM(sm) });
        live.length = 0; live.push(r);
      }
    });
  }
  drawChild(child);
  // lamp handles
  const ls = shownLamps();
  lampEls.forEach((g, i) => {
    const L = cur === 0 ? (i === 0 ? s1 : null) : ls.includes(lamps[i]) ? lamps[i] : null;
    g.style.display = L ? "" : "none";
    if (!L) return;
    g.setAttribute("transform", `translate(${L.x} ${L.y})`);
    g.classList.toggle("on", cur !== 0 && ls.length > 1 && i === active);
    g.setAttribute("tabindex", cur === 0 ? "-1" : "0");
    g.style.cursor = cur === 0 ? "default" : "";
    g.setAttribute("aria-label", P.t("lampAria", { n: i + 1 }));
  });
  Play.live($("live"), live.join(" "));
  syncControls();
}

// ---------- controls ----------
const lx = $("lx"), ly = $("ly"), twoBox = $("two"), timeEl = $("time");
function syncControls() {
  const L = lamps[active];
  lx.value = L.x; ly.value = G - L.y;
  $("lxVal").textContent = fmtM((L.x - X0) / M) + " m";
  $("lyVal").textContent = fmtM((G - L.y) / M) + " m";
  $("who").textContent = P.t("who", { n: active + 1 });
  $("who").hidden = !(two && cur === 1);
  timeEl.value = time;
  $("timeVal").textContent = fmtTime(time);
}
ly.min = G - LY_MAX; ly.max = G - LY_MIN;
function setActive(i) { active = i; }
lx.addEventListener("input", () => { const L = lamps[active]; L.x = +lx.value; fixLamp(L); draw(); });
ly.addEventListener("input", () => { const L = lamps[active]; L.y = G - +ly.value; fixLamp(L); draw(); });
twoBox.addEventListener("change", () => { two = twoBox.checked; if (!two) active = 0; else active = 1; text(); draw(); });
timeEl.addEventListener("input", () => { time = +timeEl.value; stopDay(); draw(); });
document.querySelectorAll("[data-time]").forEach((b) => b.addEventListener("click", () => { time = +b.dataset.time; stopDay(); draw(); }));

// pointer: grab the nearest lamp, or move the active lamp to where you tap
let dragging = -1;
fig.addEventListener("pointerdown", (e) => {
  if (!(cur === 1 || cur === 3)) return;
  const p = Play.pointer(fig, e), ls = shownLamps();
  let best = -1, bd = 70;
  ls.forEach((L) => { const i = lamps.indexOf(L), dd = Math.hypot(L.x - p.x, L.y - p.y); if (dd < bd) { bd = dd; best = i; } });
  if (best < 0) { if (p.y > G) return; best = active; }
  setActive(best);
  dragging = best;
  fig.setPointerCapture(e.pointerId);
  lamps[best].x = p.x; lamps[best].y = p.y; fixLamp(lamps[best]);
  e.preventDefault();
  draw();
});
fig.addEventListener("pointermove", (e) => {
  if (dragging < 0) return;
  const p = Play.pointer(fig, e), L = lamps[dragging];
  L.x = p.x; L.y = p.y; fixLamp(L); draw();
});
const endDrag = () => { dragging = -1; };
fig.addEventListener("pointerup", endDrag);
fig.addEventListener("pointercancel", endDrag);

// ---------- animation ----------
function anyAnim() { return (cur === 0 && s1.run) || (cur === 2 && dayRun); }
function wake() { if (!raf && !paused && anyAnim()) { last = 0; raf = requestAnimationFrame(tick); } }
function tick(ts) {
  raf = 0;
  if (paused) return;
  const dt = last ? Math.min((ts - last) / 1000, 0.05) : 1 / 60;
  last = ts;
  if (cur === 0 && s1.run) {
    s1.t = Math.min(1, s1.t + dt / 2);
    const u = s1.t * s1.t * (3 - 2 * s1.t);
    s1.x = s1.from + (s1.to - s1.from) * u;
    if (s1.t >= 1) { s1.run = false; s1.done = true; text(); }
  }
  if (cur === 2 && dayRun) {
    time += dt; // one hour of day per second
    if (time >= 18) { time = 18; stopDay(); }
  }
  draw();
  if (anyAnim()) raf = requestAnimationFrame(tick);
}
function moveLamp1() {
  s1.from = s1.x < X0 ? 120 : 480; s1.to = s1.from < X0 ? 480 : 120; s1.t = 0;
  if (Play.reduced) { s1.x = s1.to; s1.run = false; s1.done = true; text(); draw(); return; }
  s1.run = true; wake();
}
const runBtn = $("runDay");
function stopDay() { dayRun = false; runBtn.textContent = P.t("runDay"); runBtn.setAttribute("aria-pressed", "false"); }
runBtn.addEventListener("click", () => {
  if (dayRun) { stopDay(); return; }
  if (time >= 18) time = 6;
  dayRun = true; runBtn.textContent = P.t("stopDay"); runBtn.setAttribute("aria-pressed", "true");
  if (paused) setPause(false);
  wake();
});
const pauseBtn = $("pause");
function setPause(p) {
  paused = p; pauseBtn.textContent = P.t(p ? "play" : "pause"); pauseBtn.setAttribute("aria-pressed", p ? "true" : "false");
  if (!p) wake();
}
pauseBtn.addEventListener("click", () => setPause(!paused));

// ---------- text & steps ----------
function text() {
  const k = cur + 1;
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  let b = P.t("b" + k);
  if (cur === 0 && s1.done) b = P.t("b1done");
  if (cur === 1 && two) b = P.t("b2two");
  $("stepBody").textContent = b;
  $("replay").hidden = !(cur === 0 && s1.done);
  $("twoWrap").hidden = cur !== 1;
}
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1"), right: true }, { label: P.t("o2") }, { label: P.t("o3") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { if (!s1.run) { s1.x = 120; moveLamp1(); } });
$("replay").addEventListener("click", moveLamp1);

const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3"), P.t("s4")], (i) => {
  cur = i;
  $("predict").hidden = i !== 0;
  $("c1").hidden = i !== 0;
  $("c2").hidden = !(i === 1 || i === 3);
  $("c3").hidden = i !== 2;
  if (i === 3) active = 0;
  if (i !== 2) stopDay();
  text(); draw(); wake();
});

$("reset").addEventListener("click", () => {
  lamps = DEF.map((l) => ({ ...l })); two = false; twoBox.checked = false; active = 0; time = 7.5; stopDay();
  s1.x = 120; s1.t = 0; s1.run = false; s1.done = false;
  pr.reset(); setPause(false); st.go(0);
});
$("data").textContent = P.t("dataNote", { h: fmtM(CH / M) });
setPause(false); stopDay();
addEventListener("resize", draw);
draw();
</script>
</body>
</html>

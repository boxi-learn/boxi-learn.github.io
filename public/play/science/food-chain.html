// ---------- pure logic (tested in node) ----------
const E0 = 10000, SLOTS = 5, DEF_EFF = 10;
// eats: what each animal eats in this simplified field. need: energy units per animal per year (illustrative).
const ORG = {
  grass: { plant: true }, wheat: { plant: true },
  grasshopper: { eats: ["grass", "wheat"], need: 2 },
  mouse: { eats: ["wheat", "grass"], need: 20 },
  rabbit: { eats: ["grass"], need: 100 },
  sparrow: { eats: ["wheat", "grasshopper"], need: 15 },
  frog: { eats: ["grasshopper"], need: 5 },
  snake: { eats: ["frog", "mouse", "sparrow"], need: 20 },
  fox: { eats: ["rabbit", "mouse", "sparrow"], need: 300 },
  hawk: { eats: ["snake", "mouse", "rabbit", "sparrow", "frog"], need: 100 },
};
const ORDER = ["grass", "wheat", "grasshopper", "mouse", "rabbit", "sparrow", "frog", "snake", "fox", "hawk"];
const DEFAULT = ["grass", "grasshopper", "frog", "snake", "hawk"];
const fits = (chain, k, id) => (k === 0 ? !!ORG[id].plant : !ORG[id].plant && ORG[id].eats.includes(chain[k - 1]));
// put id at link k; keep the old links above it while they still fit
function placeAt(chain, k, id) {
  k = Math.min(k, chain.length);
  if (k >= SLOTS || !fits(chain, k, id)) return null;
  const out = chain.slice(0, k).concat(id);
  for (let j = k + 1; j < chain.length && j < SLOTS; j++) { if (fits(out, j, chain[j]) && !out.includes(chain[j])) out.push(chain[j]); else break; }
  return out;
}
// tap: append; else a plant replaces link 1; else replace the highest link it can eat from
function tapAdd(chain, id) {
  if (chain.includes(id)) return { chain, msg: "dup" };
  if (ORG[id].plant) return { chain: placeAt(chain, 0, id), msg: "plant", k: 0 };
  if (!chain.length) return { chain, msg: "needPlant" };
  if (chain.length < SLOTS && fits(chain, chain.length, id)) return { chain: placeAt(chain, chain.length, id), msg: "add", k: chain.length };
  for (let k = Math.min(chain.length, SLOTS) - 1; k >= 1; k--) if (fits(chain, k, id)) return { chain: placeAt(chain, k, id), msg: "add", k };
  return { chain, msg: chain.length >= SLOTS ? "full" : "no" };
}
const energies = (n, eff) => Array.from({ length: n }, (_, k) => E0 * Math.pow(eff / 100, k));
const sig2 = (x) => Number(x.toPrecision(2));
function feeds(E, need) { // {n} animals, or 1 per {f} fields
  if (!(E > 0) || !(need > 0)) return { n: 0 };
  const n = E / need;
  return n >= 1 ? { n: Math.floor(n) } : { f: sig2(need / E) };
}
function group(n) { const s = String(Math.round(n)); return s.replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function fmtE(E) {
  if (!Number.isFinite(E)) return "—";
  if (E >= 10) return group(E);
  if (E >= 1) return String(Number(E.toFixed(1)));
  return String(sig2(E));
}
// ---------- end pure logic ----------

    S("circle", { cx: 23.5, cy: 12, r: 5, fill: "var(--b)" });
    S("path", { d: "M28 10.5L32 12.5L28 14Z", fill: "var(--hl)" });
    S("path", Object.assign({ d: "M9 18Q15 23 21 18" }, st("var(--surface)", 1.6)));
    S("path", Object.assign({ d: "M13 27V31M18 27V31" }, st("var(--fg)", 1.3)));
  } else if (id === "frog") {
    S("ellipse", { cx: 16, cy: 22, rx: 13.5, ry: 8, fill: "var(--a)" });
    [9.5, 22.5].forEach((x) => { S("circle", { cx: x, cy: 13, r: 4.6, fill: "var(--a)" }); S("circle", { cx: x, cy: 12.5, r: 1.8, fill: "var(--fg)" }); });
    S("path", Object.assign({ d: "M10 23Q16 27 22 23" }, st("var(--surface)", 1.6)));
  } else if (id === "snake") {
    S("path", Object.assign({ d: "M2 26C8 12 13 13 15 20S23 30 27 15" }, st("var(--c)", 5.5)));
    S("circle", { cx: 27.5, cy: 13, r: 3.8, fill: "var(--c)" });
    S("path", Object.assign({ d: "M29 9.5L30.5 6M30.5 6L29 4.5M30.5 6L32 5" }, st("var(--no)", 1.1)));
  } else if (id === "fox") {
    S("path", { d: "M3 7L16 30L29 7Z", fill: "var(--no)" });
    S("path", { d: "M3 7L5 0L12 7Z M29 7L27 0L20 7Z", fill: "var(--no)" });
    S("path", { d: "M9 15L16 30L23 15Q16 19 9 15Z", fill: "var(--surface)", opacity: 0.85 });
    S("circle", { cx: 16, cy: 28.5, r: 1.8, fill: "var(--fg)" });
    S("circle", { cx: 11, cy: 12, r: 1.4, fill: "var(--fg)" }); S("circle", { cx: 21, cy: 12, r: 1.4, fill: "var(--fg)" });
  } else if (id === "hawk") {
    S("path", { d: "M16 13L1 6L5 13L0 16L16 20L32 16L27 13L31 6Z", fill: "var(--fg)", opacity: 0.85 });
    S("path", { d: "M13 19L16 30L19 19Z", fill: "var(--fg)", opacity: 0.85 });
    S("circle", { cx: 16, cy: 10.5, r: 3.6, fill: "var(--fg)" });
    S("path", { d: "M14.5 13.5L16 16.5L17.5 13.5Z", fill: "var(--hl)" });
  }
}

// ---------- figure ----------
const showChain = () => (cur === 0 ? DEFAULT : chain);
const effNow = () => (cur === 0 ? DEF_EFF : +effIn.value);

function fitText(t, max) {
  try { const w = t.getComputedTextLength(); if (w > max) { t.setAttribute("textLength", max); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); } } catch (e) { /* not rendered yet */ }
}

function draw() {
  while (fig.firstChild) fig.removeChild(fig.firstChild);
  const ch = showChain(), E = energies(ch.length, effNow());
  const hfs = Math.max(12, fs * 0.9);
  Play.svg("text", { class: "hd", x: SL.x + 2, y: 20, "font-size": hfs.toFixed(1) }, fig).textContent = P.t("hdChain");
  Play.svg("text", { class: "hd", x: W - 8, y: 20, "text-anchor": "end", "font-size": hfs.toFixed(1) }, fig).textContent = P.t("hdEnergy");
  const bars = Play.svg("g", { class: "bars", opacity: cur === 0 && !answered ? 0 : 1 }, fig);
  const edit = cur > 0;
  for (let k = 0; k < SLOTS; k++) {
    const y = rowTop(k) + (ROW - SL.h) / 2, cy = y + SL.h / 2, id = ch[k];
    // arrow from link k-1 up to link k: energy flows from the eaten to the eater
    if (k > 0 && id) {
      const x = SL.x + SL.w / 2, y1 = y + SL.h + (ROW - SL.h) - 2, y2 = y + SL.h + 3;
      Play.svg("path", { d: `M${x} ${y1}V${y2 + 6}`, stroke: "var(--a)", "stroke-width": 3, fill: "none" }, fig);
      Play.svg("path", { d: `M${x - 6} ${y2 + 8}L${x} ${y2}L${x + 6} ${y2 + 8}Z`, fill: "var(--a)" }, fig);
    }
    const isNext = !id && k === ch.length;
    const g = Play.svg("g", { class: "slot" + (edit && (id || isNext) ? " act" : "") + (k === dropK ? " drop" : "") }, fig);
    g.dataset.k = k;
    Play.svg("rect", { class: "box", x: SL.x, y, width: SL.w, height: SL.h, rx: 10, fill: id ? "var(--surface)" : "none", stroke: id ? "var(--line)" : "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": id ? "" : "5 5", opacity: id || isNext ? 1 : 0.45 }, g);
    if (id) {
      const ig = Play.svg("g", { transform: `translate(${SL.x + 8} ${cy - 16})` }, g);
      icon(id, ig);
      const t = Play.svg("text", { class: "lab", x: SL.x + 48, y: cy + fs * 0.35, "font-size": fs.toFixed(1) }, g);
      t.textContent = name(id);
      fitText(t, SL.w - 54);
      if (edit) { g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", P.t("slotAria", { k: k + 1, x: name(id), e: fmtE(E[k]) })); }
      // bar
      const w = Math.max(2, (E[k] / E0) * BAR.max), bx = BAR.cx - w / 2, by = cy - BAR.h / 2;
      if (cur === 2 && k > 0) Play.svg("rect", { x: BAR.cx - Math.max(2, (E[k - 1] / E0) * BAR.max) / 2, y: by - 3, width: Math.max(2, (E[k - 1] / E0) * BAR.max), height: BAR.h + 6, rx: 5, fill: "none", stroke: "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, bars);
      Play.svg("rect", { x: bx, y: by, width: w, height: BAR.h, rx: 4, fill: ORG[id].plant ? "var(--a)" : "var(--b)" }, bars);
      const hide = cur === 0 && !answered, label = hide ? "?" : fmtE(E[k]), tw = label.length * 0.6 * fs;
      const inside = !hide && w > tw + 14;
      const lt = Play.svg("text", { class: "num", x: inside || hide ? BAR.cx : bx + w + 6, y: cy + fs * 0.35, "text-anchor": inside || hide ? "middle" : "start", "font-size": fs.toFixed(1), fill: inside ? "var(--surface)" : "var(--fg)", "font-weight": 700 }, hide ? fig : bars);
      lt.textContent = label;
    } else if (isNext && edit) {
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
      g.setAttribute("aria-label", P.t("slotAriaNext", { k: k + 1 }));
      const t = Play.svg("text", { class: "lab", x: SL.x + SL.w / 2, y: cy + fs * 0.35, "text-anchor": "middle", "font-size": fs.toFixed(1), fill: "var(--a)" }, g);
      t.style.fill = "var(--a)"; t.textContent = P.t("slotNext", { k: k + 1 });
      fitText(t, SL.w - 16);
    } else {
      const t = Play.svg("text", { class: "lab", x: SL.x + SL.w / 2, y: cy + fs * 0.35, "text-anchor": "middle", "font-size": fs.toFixed(1), opacity: 0.45 }, g);
      t.textContent = P.t("slotEmpty", { k: k + 1 });
    }
  }
}

// ---------- slot interaction (remove / focus tray) ----------
function slotAct(k) {
  if (cur === 0) return;
  if (k < chain.length) { chain = chain.slice(0, k); msg = P.t("msgRemoved", { k: k + 1 }); update(); focusSlot(k); }
  else if (k === chain.length) { const b = tray.querySelector("button.fits") || tray.querySelector("button"); if (b) b.focus(); }
}
function focusSlot(k) { const g = fig.querySelector(`g.slot[data-k="${k}"][tabindex]`); if (g) g.focus(); }
fig.addEventListener("click", (e) => { const g = e.target.closest && e.target.closest("g.slot"); if (g) slotAct(+g.dataset.k); });
fig.addEventListener("keydown", (e) => {
  const g = e.target.closest && e.target.closest("g.slot");
  if (!g) return;
  const k = +g.dataset.k;
  if (e.key === "Enter" || e.key === " " || e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); slotAct(k); }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); focusSlot(Play.clamp(k + (e.key === "ArrowUp" ? 1 : -1), 0, SLOTS - 1)); }
});

// ---------- tray: tap or drag ----------
const chips = {};
function say(r, id) {
  const ch = r.chain;
  if (r.msg === "add") msg = P.t("msgAdd", { x: name(id), y: name(ch[r.k - 1]), k: r.k + 1 });
  else if (r.msg === "plant") msg = P.t("msgPlant", { x: name(id) });
  else if (r.msg === "dup") msg = P.t("msgDup", { x: name(id) });
  else if (r.msg === "needPlant") msg = P.t("msgNeedPlant");
  else if (r.msg === "full") msg = P.t("msgFull");
  else msg = P.t("msgNo", { x: name(id), y: name(ch[ch.length - 1]), list: ORG[id].eats.map(name).join(P.t("listSep")) });
}
function cutNote(old) { if (chain.length < old.length) msg += P.t("sp") + P.t("msgCut"); }
function tap(id) { const old = chain, r = tapAdd(chain, id); chain = r.chain; say(r, id); cutNote(old); update(); }
function dropOn(k, id) {
  if (chain.includes(id) && chain.indexOf(id) !== Math.min(k, chain.length)) { say({ msg: "dup", chain }, id); update(); return; }
  if (!ORG[id].plant && !chain.length) { say({ msg: "needPlant", chain }, id); update(); return; }
  const kk = Math.min(k, chain.length), out = placeAt(chain, kk, id);
  if (out) { const old = chain; chain = out; say({ msg: kk === 0 ? "plant" : "add", chain, k: kk }, id); cutNote(old); }
  else if (kk >= SLOTS) say({ msg: "full", chain }, id);
  else if (kk === 0) say({ msg: "needPlant", chain }, id);
  else msg = P.t("msgNo", { x: name(id), y: name(chain[kk - 1]), list: ORG[id].eats.map(name).join(P.t("listSep")) });
  update();
}
function slotAtPoint(e) {
  const r = fig.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return -1;
  const p = Play.pointer(fig, e);
  return Play.clamp(SLOTS - 1 - Math.floor((p.y - TOP) / ROW), 0, SLOTS - 1);
}
ORDER.forEach((id) => {
  const b = document.createElement("button");
  b.type = "button";
  const s = Play.svg("svg", { viewBox: "-1 -1 34 34", "aria-hidden": "true" });
  icon(id, s);
  b.append(s, document.createTextNode(name(id)));
  tray.appendChild(b); chips[id] = b;
  let start = null, drag = false, ghost = null, skip = false;
  b.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY }; drag = false; try { b.setPointerCapture(e.pointerId); } catch (x) { /* ok */ } });
  b.addEventListener("pointermove", (e) => {
    if (!start) return;
    if (!drag && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
      drag = true; ghost = document.createElement("div"); ghost.className = "ghost"; ghost.textContent = name(id); document.body.appendChild(ghost);
    }
    if (ghost) {
      ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
      const k = slotAtPoint(e), kk = k < 0 ? -1 : Math.min(k, chain.length);
      if (kk !== dropK) { dropK = kk; draw(); }
    }
  });
  const end = (e, ok) => {
    if (!start) return;
    if (drag) { skip = true; const k = slotAtPoint(e); if (ok && k >= 0) dropOn(k, id); }
    if (ghost) ghost.remove();
    ghost = null; start = null; drag = false;
    if (dropK !== -1) { dropK = -1; draw(); }
  };
  b.addEventListener("pointerup", (e) => end(e, true));
  b.addEventListener("pointercancel", (e) => end(e, false));
  b.addEventListener("click", () => { if (skip) { skip = false; return; } tap(id); });
  b.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    const i = ORDER.indexOf(id), n = ORDER.length;
    chips[ORDER[(i + (e.key === "ArrowRight" ? 1 : n - 1)) % n]].focus();
  });
});

// ---------- text ----------
function el(tag, txt, cls) { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; }
function feedsText(E, id) {
  if (ORG[id].plant) return P.t("plantRow");
  const f = feeds(E, ORG[id].need);
  return f.f ? P.t("feedsF", { f: group(f.f) }) : P.t("feedsN", { n: group(f.n) });
}
function table(ch, E, mode) {
  const tb = el("table", null, "res"), hr = el("tr");
  const heads = mode === 3 ? ["thLink", "thWho", "thE", "thUp", "thLost"] : ["thLink", "thWho", "thE", "thFeeds"];
  heads.forEach((h, i) => hr.appendChild(el("th", P.t(h), i > 1 ? "r" : "")));
  tb.appendChild(hr);
  for (let k = ch.length - 1; k >= 0; k--) {
    const tr = el("tr");
    tr.append(el("td", String(k + 1)), el("td", name(ch[k])), el("td", fmtE(E[k]), "r"));
    if (mode === 3) {
      const up = k < ch.length - 1 ? E[k + 1] : 0;
      tr.append(el("td", k < ch.length - 1 ? fmtE(up) : "—", "r"), el("td", fmtE(E[k] - up), "r"));
    } else tr.append(el("td", feedsText(E[k], ch[k]), "r"));
    tb.appendChild(tr);
  }
  return tb;
}
function summary(ch, E, p) {
  if (ch.length < 2) return "";
  const lo = ch[1], hi = ch[ch.length - 1], a = feeds(E[1], ORG[lo].need), b = feeds(E[ch.length - 1], ORG[hi].need);
  const part = (f) => (f.f ? P.t("sumOne", { f: group(f.f) }) : P.t("sumMany", { n: group(f.n) }));
  if (ch.length === 2) return P.t("sumOne1", { p, x: name(lo), a: part(a) });
  return P.t("sumFeeds", { p, x: name(lo), a: part(a), y: name(hi), b: part(b) });
}
function text() {
  const k = cur + 1, extra = $("extra");
  $("kicker").textContent = P.t("k" + k);
  $("stepTitle").textContent = P.t("t" + k);
  extra.innerHTML = "";
  if (cur === 0) {
    const E = energies(5, DEF_EFF), g = feeds(E[1], ORG.grasshopper.need), h = feeds(E[4], ORG.hawk.need);
    $("stepBody").textContent = answered ? P.t("b1done", { e0: fmtE(E[0]), e4: fmtE(E[4]), g: group(g.n || 0), f: group(h.f || 1) }) : P.t("b1");
    Play.live($("live"), "");
    return;
  }
  const p = +effIn.value, E = energies(chain.length, p);
  $("effVal").textContent = P.t("pctVal", { p });
  $("stepBody").textContent = P.t(cur === 1 ? "b2" : "b3");
  if (chain.length) extra.appendChild(table(chain, E, cur === 1 ? 2 : 3));
  const s = summary(chain, E, p);
  Play.live($("live"), [msg, chain.length ? s : P.t("msgEmpty")].filter(Boolean).join(P.t("sp")));
}
function markTray() {
  ORDER.forEach((id) => chips[id].classList.toggle("fits", !chain.includes(id) && chain.length < SLOTS && fits(chain, chain.length, id)));
}
function update() { draw(); text(); markTray(); }

// ---------- steps ----------
const pr = Play.predict($("predict"), {
  q: P.t("q"),
  options: [{ label: P.t("o1") }, { label: P.t("o2"), right: true }, { label: P.t("o3") }, { label: P.t("o4") }],
  right: P.t("right"), wrong: P.t("wrong"),
}, () => { answered = true; update(); });
const pr3 = Play.predict($("predict3"), {
  q: P.t("q3"),
  options: [{ label: P.t("p3a"), right: true }, { label: P.t("p3b") }, { label: P.t("p3c") }],
  right: P.t("right3"), wrong: P.t("wrong3"),
});
const st = Play.steps($("steps"), [P.t("s1"), P.t("s2"), P.t("s3")], (i) => {
  cur = i; msg = "";
  $("predict").hidden = i !== 0; $("predict3").hidden = i !== 2; $("c2").hidden = i === 0;
  updateFs(); update();
});
effIn.addEventListener("input", () => { msg = ""; update(); });
$("clear").addEventListener("click", () => { chain = []; msg = ""; update(); });
$("reset").addEventListener("click", () => {
  chain = ["grass", "grasshopper"]; effIn.value = DEF_EFF; answered = false; msg = ""; pr.reset(); pr3.reset(); st.go(0);
});
window.addEventListener("resize", () => { const o = fs; updateFs(); if (o !== fs) draw(); });

(function notes() {
  const E = energies(5, DEF_EFF), g = feeds(E[1], ORG.grasshopper.need), h = feeds(E[4], ORG.hawk.need);
  $("resultNote").textContent = P.t("resultNote", { p: DEF_EFF, e0: fmtE(E0), e4: fmtE(E[4]), g: group(g.n || 0), f: group(h.f || 1) });
  const needs = ORDER.filter((id) => !ORG[id].plant).map((id) => name(id) + " " + ORG[id].need).join(P.t("listSep"));
  $("data").textContent = P.t("dataNote", { e0: fmtE(E0), p: DEF_EFF, needs });
})();
</script>
</body>
